<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Карта</title>
  <meta name="description" content="Карта с мессенджером, профилем и настройками в стиле рабочего стола macOS">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#C9D2F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1430" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="icons/icon-192.png" type="image/png">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Карта">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      color-scheme: light dark;
      --land: #C9D2F0;
      --you: #3D4EB8;
      --you-soft: #5B6BD4;
      --glass: rgba(201, 210, 240, 0.42);
      --glass-edge: rgba(255, 255, 255, 0.6);
      --glass-shadow: rgba(30, 40, 90, 0.22);
      --bar: rgba(201, 210, 240, 0.55);
      --ink: #1B2350;
      --ink-soft: #4E5A85;
      --win: rgba(240, 243, 252, 0.86);
      --win-line: rgba(27, 35, 80, 0.12);
      --row-hover: rgba(27, 35, 80, 0.06);
      --tip: rgba(27, 35, 80, 0.9);
      --tip-ink: #EEF1FB;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --land: #0F1430;
        --you: #6E7EFF;
        --you-soft: #A6B2FF;
        --glass: rgba(30, 40, 90, 0.45);
        --glass-edge: rgba(150, 170, 255, 0.18);
        --glass-shadow: rgba(0, 0, 0, 0.6);
        --bar: rgba(15, 20, 48, 0.68);
        --ink: #E8ECFB;
        --ink-soft: #8A94C2;
        --win: rgba(23, 30, 66, 0.9);
        --win-line: rgba(232, 236, 251, 0.1);
        --row-hover: rgba(232, 236, 251, 0.06);
        --tip: rgba(232, 236, 251, 0.92);
        --tip-ink: #0F1430;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background: var(--land);
      color: var(--ink);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }

    button { font: inherit; color: inherit; }

    .map-app {
      position: fixed; inset: 0; z-index: 1;
    }
    .map-layer { position: fixed; inset: 0; }
    #map { z-index: 1; background: var(--land); }

    /* Когда активно НЕ-карта (друзья, сообщения, профиль) — карту полностью прячем */
    body.app-window .map-app { display: none; }
    body.app-map .window { display: none !important; }

    /* Плавающие кнопки поверх карты — видны только когда активна Карта */
    body.app-window #geo-btn,
    body.app-window #notif-btn,
    body.app-window #settings-btn { display: none !important; }

    /* ── Скрываем основной UI до входа ── */
    body.auth-locked .menubar,
    body.auth-locked .dock-wrap,
    body.auth-locked #geo-btn,
    body.auth-locked #notif-btn,
    body.auth-locked #settings-btn,
    body.auth-locked #window { display: none !important; }

    .geo-btn {
      position: fixed;
      right: 14px;
      bottom: calc(90px + env(safe-area-inset-bottom, 0px));
      z-index: 5;
      width: 42px; height: 42px;
      border-radius: 12px;
      border: 1px solid var(--win-line);
      background: var(--win);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 8px 20px var(--glass-shadow);
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--you);
      transition: transform .12s ease-out, background .15s;
    }
    .geo-btn:hover { transform: scale(1.06); }
    .geo-btn:active { transform: scale(.96); }
    .geo-btn svg { width: 20px; height: 20px; }
    .geo-btn.is-active { color: #fff; background: var(--you); border-color: transparent; }

    #notif-btn {
      position: fixed;
      top: calc(38px + env(safe-area-inset-top, 0px));
      left: 14px;
      z-index: 19;
      width: 42px; height: 42px;
      border-radius: 12px;
      border: 1px solid var(--win-line);
      background: var(--win);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 8px 20px var(--glass-shadow);
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--you-soft);
      transition: transform .12s ease-out, background .15s, color .15s;
    }
    #notif-btn:hover { transform: scale(1.06); color: var(--you); }
    #notif-btn:active { transform: scale(.96); }
    #notif-btn svg { width: 20px; height: 20px; display: block; }
    #notif-btn.is-active { color: #fff; background: var(--you); border-color: transparent; }
    #notif-btn .badge {
      position: absolute; top: -5px; right: -5px;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 9px;
      background: #C0392B; color: #fff;
      font-size: 11px; font-weight: 700; line-height: 18px;
      text-align: center;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 0 0 1.5px rgba(255, 255, 255, .7);
      pointer-events: none;
    }
    #notif-btn .badge[hidden] { display: none !important; }

    #settings-btn {
      position: fixed;
      top: calc(38px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 19;
      width: 42px; height: 42px;
      border-radius: 12px;
      border: 1px solid var(--win-line);
      background: var(--win);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 8px 20px var(--glass-shadow);
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--you-soft);
      transition: transform .12s ease-out, background .15s, color .15s;
    }
    #settings-btn:hover { transform: scale(1.06); color: var(--you); }
    #settings-btn:active { transform: scale(.96); }
    #settings-btn svg { width: 20px; height: 20px; display: block; }
    #settings-btn.is-active { color: #fff; background: var(--you); border-color: transparent; }

    /* ───────── Метка воспоминания ───────── */
    .memory-marker {
      position: relative;
      cursor: pointer;
      pointer-events: auto;
      transform-origin: 50% 100%;
      transition: transform .18s ease-out;
      width: 84px; height: 84px;
    }
    .memory-marker:hover { transform: scale(1.08); }

    .memory-marker::after {
      content: "";
      position: absolute;
      left: 50%; bottom: -4px;
      width: 14px; height: 14px;
      background: #3D4EB8;
      transform: translateX(-50%) rotate(45deg);
      border-radius: 3px;
      box-shadow: 0 0 0 2px #fff;
      z-index: 0;
    }
    @media (prefers-color-scheme: dark) {
      .memory-marker::after { background: #6E7EFF; }
    }

    .memory-fan {
      position: relative;
      width: 100%; height: 100%;
      transform: rotate(-4deg);
    }

    .memory-card {
      position: absolute;
      left: 50%; top: 50%;
      width: 60px; height: 66px;
      padding: 4px 4px 10px;
      background: #3D4EB8;
      border-radius: 4px;
      box-shadow:
        0 1px 3px rgba(0, 0, 0, .4),
        0 6px 14px rgba(27, 35, 80, .35),
        0 0 0 .5px rgba(0, 0, 0, .15);
      transform-origin: 50% 100%;
      overflow: hidden;
      will-change: transform;
    }
    @media (prefers-color-scheme: dark) {
      .memory-card { background: #6E7EFF; }
    }
    .memory-card .mc-img {
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      background-color: #DDD;
      border-radius: 2px;
    }
    .memory-card .mc-img.no-photo {
      background: rgba(255, 255, 255, .18);
      display: grid; place-items: center;
      color: #fff; font-size: 22px;
    }
    .memory-card .mc-img.no-photo::before { content: "📷"; }

    .memory-card::after {
      content: "";
      position: absolute;
      left: 8px; right: 8px; bottom: 3px;
      height: 2px; border-radius: 2px;
      background: rgba(255, 255, 255, .55);
    }
    @media (prefers-color-scheme: dark) {
      .memory-card::after { background: rgba(15, 20, 48, .5); }
    }

    .memory-more {
      position: absolute;
      right: -6px; top: -6px;
      min-width: 22px; height: 22px; padding: 0 5px;
      border-radius: 11px;
      background: #3D4EB8;
      color: #fff;
      font-size: 12px; font-weight: 700; line-height: 22px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,.4), inset 0 0 0 1.5px rgba(255,255,255,.5);
      z-index: 20;
    }
    @media (prefers-color-scheme: dark) {
      .memory-more { background: #6E7EFF; }
    }

    /* ───────── Метка желания (облако) ───────── */
    .wish-marker {
      position: relative;
      pointer-events: auto;
      cursor: pointer;
      transition: transform .18s ease-out;
      width: 220px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wish-marker:hover { transform: scale(1.05); }

    .wish-cloud-shape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 16px rgba(61, 78, 184, .45));
      pointer-events: none;
    }
    .wish-cloud-shape .cloud-body {
      fill: url(#wishCloudGrad);
      stroke: rgba(255, 255, 255, .45);
      stroke-width: 1;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      .wish-cloud-shape .cloud-body {
        fill: url(#wishCloudGradDark);
        stroke: rgba(150, 170, 255, .35);
      }
    }

    .wish-cloud-content {
      position: relative;
      z-index: 1;
      width: 74%;
      max-width: 180px;
      padding: 0 6px;
      text-align: center;
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: .01em;
      white-space: normal;
      word-break: break-word;
      text-shadow: 0 1px 2px rgba(20, 25, 60, .35);
    }

    .wish-author {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      opacity: .85;
    }

    .wish-empty {
      text-align: center;
      color: var(--ink-soft);
      padding: 40px 20px;
    }
    .wish-empty svg {
      width: 44px; height: 44px;
      opacity: .35; display: block; margin: 0 auto 10px;
    }

    .wish-card {
      display: grid;
      gap: 6px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--win-line);
      background: rgba(255, 255, 255, .45);
      margin: 8px;
    }
    @media (prefers-color-scheme: dark) {
      .wish-card { background: rgba(255, 255, 255, .06); }
    }
    .wish-card .wish-card-text {
      font-weight: 600;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .wish-card .wish-card-meta {
      color: var(--ink-soft);
      font-size: 12px;
    }
    .wish-card .wish-card-actions {
      display: flex; gap: 8px; justify-content: flex-end;
      padding-top: 4px;
    }

    /* ───────── Метка «я здесь» ───────── */
    .user-avatar-wrap {
      position: relative;
      width: 26px; height: 26px;
      pointer-events: none;
    }
    .user-avatar-wrap .user-avatar-marker {
      display: block;
      width: 100%; height: 100%;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35));
    }
    .user-avatar-marker canvas { display: block; width: 100%; height: 100%; }

    .user-badge {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: none;
      animation: user-badge-in .35s ease-out;
    }
    @keyframes user-badge-in {
      from { opacity: 0; transform: translateX(-50%) translateY(4px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .user-badge::after {
      content: "";
      position: absolute;
      left: 50%; bottom: -6px;
      width: 8px; height: 8px;
      margin-left: -4px;
      background: var(--win);
      border-right: 1px solid var(--win-line);
      border-bottom: 1px solid var(--win-line);
      transform: rotate(45deg);
      border-radius: 1px;
    }

    .user-badge-inner {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px 3px 3px;
      border-radius: 999px;
      background: var(--win);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--win-line);
      box-shadow:
        0 4px 12px var(--glass-shadow),
        0 0 0 .5px rgba(0, 0, 0, .08);
      z-index: 2;
      transition: transform .15s ease-out;
    }
    .user-badge[data-clickable="true"] { pointer-events: auto; cursor: pointer; }
    .user-badge[data-clickable="true"]:hover .user-badge-inner {
      transform: translateY(-1px);
    }

    .user-badge-avatar {
      flex: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      background-color: var(--you);
      color: #fff;
      display: grid; place-items: center;
      font-size: 11px; font-weight: 700;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1);
    }

    .user-badge-name {
      font-size: 12px;
      font-weight: 650;
      color: var(--ink);
      line-height: 1;
      white-space: nowrap;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-badge-status {
      position: absolute;
      left: 50%; bottom: 100%;
      transform: translate(-50%, 2px);
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 0 1.5px #fff;
      z-index: 3;
    }

    .user-dot-marker {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--you);
      border: 2.5px solid #fff;
      box-shadow: 0 0 0 4px rgba(110, 126, 255, .3), 0 2px 6px rgba(0,0,0,.35);
      pointer-events: none;
    }

    .map-popup {
      width: 220px;
      padding: 8px;
      background: var(--win);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--win-line);
      border-radius: 12px;
      box-shadow: 0 12px 32px var(--glass-shadow), 0 0 0 .5px rgba(0,0,0,.08);
      pointer-events: auto;
    }
    .map-popup .pop-img {
      width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; display: block;
      background: rgba(0,0,0,.08);
    }
    .map-popup .pop-place { font-weight: 700; margin-top: 6px; }
    .map-popup .pop-caption {
      color: var(--ink-soft); font-size: 12px; margin-top: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .map-popup .pop-open {
      display: inline-block; margin-top: 6px;
      font-size: 12px; font-weight: 600; color: var(--you);
      background: transparent; border: 0; padding: 0; cursor: pointer;
    }
    .map-popup .pop-open:hover { text-decoration: underline; }

    .menubar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      height: calc(28px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
      background: var(--bar);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--win-line);
      font-size: 13px;
    }
    .menubar strong { font-weight: 650; }
    .menubar-right { display: flex; align-items: center; gap: 8px; }
    #offline-badge { color: var(--ink-soft); }
    #install-btn {
      border: 0; background: transparent; padding: 2px 4px; border-radius: 5px; cursor: pointer; font-weight: 600;
    }
    #install-btn:hover { background: var(--row-hover); }
    #fs-btn {
      border: 0; background: transparent; padding: 3px 5px; border-radius: 6px;
      cursor: pointer; color: var(--ink); display: grid; place-items: center;
    }
    #fs-btn:hover { background: var(--row-hover); }
    #fs-btn.is-active { color: var(--you); }
    #fs-btn svg { display: block; }
    [hidden] { display: none !important; }

    .dock-wrap {
      position: fixed; left: 0; right: 0; z-index: 30;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex; justify-content: center;
      pointer-events: none;
    }
    .dock {
      pointer-events: auto;
      display: flex; align-items: flex-end; gap: 20px;
      margin: 0; padding: 9px 14px;
      list-style: none;
      border-radius: 26px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-edge);
      box-shadow: 0 12px 32px var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, .35);
    }
    .dock-item { position: relative; width: 56px; height: 56px; }

    .dock-btn {
      display: block; width: 56px; height: 56px; padding: 0; border: 0; background: none;
      cursor: pointer;
      transform-origin: 50% 100%;
      transform: scale(var(--s, 1));
      transition: transform .14s ease-out;
      -webkit-tap-highlight-color: transparent;
      border-radius: 14px;
    }
    .dock-btn svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .25)); }
    .dock-btn:focus-visible { outline: 3px solid var(--you); outline-offset: 3px; }
    .dock-btn:active svg { filter: brightness(.86) drop-shadow(0 2px 4px rgba(0, 0, 0, .25)); }

    .dock-btn.bounce svg { animation: bounce .7s cubic-bezier(.3, .7, .4, 1) 1; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-22px); }
      55% { transform: translateY(0); }
      75% { transform: translateY(-9px); }
    }

    .dock-item::after {
      content: ""; position: absolute; left: 50%; bottom: -7px;
      width: 4px; height: 4px; margin-left: -2px; border-radius: 50%;
      background: var(--ink); opacity: 0; transition: opacity .15s;
    }
    .dock-item[data-open="true"]::after { opacity: .75; }

    .tip {
      position: absolute; left: 50%; pointer-events: none; white-space: nowrap;
      bottom: calc(100% + 12px + (var(--s, 1) - 1) * 56px);
      transform: translateX(-50%);
      padding: 4px 10px; border-radius: 8px;
      background: var(--tip); color: var(--tip-ink);
      font-size: 13px; font-weight: 500;
      opacity: 0; transition: opacity .12s;
    }
    .dock-item:focus-within .tip { opacity: 1; }
    @media (hover: hover) { .dock-item:hover .tip { opacity: 1; } }

    .window {
      position: fixed; z-index: 25;
      inset: calc(44px + env(safe-area-inset-top, 0px)) 0 calc(112px + env(safe-area-inset-bottom, 0px)) 0;
      margin: auto;
      width: min(560px, calc(100% - 24px));
      height: min(520px, calc(100dvh - 170px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
      display: flex; flex-direction: column;
      background: var(--win);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--win-line);
      border-radius: 14px;
      box-shadow: 0 24px 60px var(--glass-shadow), 0 0 0 .5px rgba(0, 0, 0, .12);
      overflow: hidden;
      opacity: 0; transform: scale(.7);
      transition: opacity .18s ease-out, transform .22s cubic-bezier(.2, .8, .3, 1);
      outline: none;
    }
    .window.is-open { opacity: 1; transform: none; }

    .win-head {
      display: grid; grid-template-columns: 48px 1fr 48px; align-items: center;
      height: 44px; padding: 0 14px;
      border-bottom: 1px solid var(--win-line);
    }
    .win-back {
      width: 32px; height: 32px; padding: 0;
      border: 0; border-radius: 8px;
      background: transparent; color: var(--you);
      cursor: pointer; display: grid; place-items: center;
      transition: background .15s, transform .12s ease-out;
    }
    .win-back:hover { background: var(--row-hover); }
    .win-back:active { transform: scale(.94); }
    .win-back svg { width: 20px; height: 20px; }
    .win-back:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
    .win-title { margin: 0; text-align: center; font-size: 13px; font-weight: 650; }
    .win-body { flex: 1; overflow: auto; -webkit-user-select: text; user-select: text; position: relative; }

    .rows { list-style: none; margin: 0; padding: 6px; }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 10px;
    }

    @media (prefers-color-scheme: dark) {
      .people-picker { background: rgba(255, 255, 255, .04); }
    }
    .people-picker .person-card { padding: 6px 8px; }
    .person-check {
      flex: none;
      width: 20px; height: 20px; border-radius: 6px;
      border: 2px solid rgba(120, 128, 160, .5);
      display: grid; place-items: center;
      transition: background .12s, border-color .12s;
    }
    .person-card[aria-checked="true"] .person-check {
      background: var(--you); border-color: var(--you);
    }
    .person-card[aria-checked="true"] .person-check::after {
      content: "✓";
      color: #fff; font-size: 13px; line-height: 1;
    }

    /* ───────── Карточки групп + свайп ───────── */
    .group-row {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
    }
    .group-row .group-actions {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      display: flex;
      transform: translateX(100%);
      transition: transform .22s cubic-bezier(.2, .8, .3, 1);
      z-index: 1;
    }
    .group-row.revealed .group-actions { transform: translateX(0); }

    .group-action-btn {
      width: 72px; height: 100%;
      border: 0; padding: 0; cursor: pointer;
      display: grid; place-items: center;
      color: #fff;
      font: inherit;
    }
    .group-action-btn svg { width: 22px; height: 22px; }
    .group-action-btn.settings { background: #5C6690; }
    .group-action-btn.danger   { background: #C0392B; }

    .group-row .group-card {
      position: relative;
      z-index: 2;
      background: var(--win);
      transition: transform .22s cubic-bezier(.2, .8, .3, 1);
      touch-action: pan-y;
    }
    .group-row.revealed .group-card { transform: translateX(-144px); }

    /* На десктопе при наведении показываем действия */
    @media (hover: hover) and (pointer: fine) {
      .group-row:hover .group-actions { transform: translateX(0); }
      .group-row:hover .group-card { transform: translateX(-144px); }
      .group-row.revealed .group-actions { transform: translateX(0); }
      .group-row.revealed .group-card { transform: translateX(-144px); }
    }

    .group-card {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 10px;
      cursor: pointer;
    }
    .group-card:hover { background: var(--row-hover); }
    .group-avatar {
      flex: none; width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(#6E7EFF, #3D4EB8);
      background-size: cover; background-position: center;
      display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 18px;
      overflow: hidden;
    }
    .group-main { flex: 1; min-width: 0; }
    .group-name { font-weight: 600; }
    .group-sub { color: var(--ink-soft); font-size: 12px; }

    .group-form { display: grid; gap: 14px; padding: 16px; }
    .group-photo-row { display: flex; align-items: center; gap: 14px; }
    .group-photo {
      flex: none; width: 72px; height: 72px; border-radius: 16px;
      background: linear-gradient(#6E7EFF, #3D4EB8);
      background-size: cover; background-position: center;
      display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 26px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    }

    .radio-row { display: flex; flex-direction: column; gap: 6px; }
    .radio-opt {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      cursor: pointer;
    }
    .radio-opt:hover { background: var(--row-hover); }
    .radio-opt input { accent-color: var(--you); }
    .radio-opt .radio-label { font-size: 13px; }

    /* ───────── Правила ───────── */
    .legal-page {
      padding: 16px 18px 28px;
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .legal-page h3 {
      font-size: 14px;
      font-weight: 700;
      margin: 18px 0 6px;
      color: var(--ink);
    }
    .legal-page h3:first-child { margin-top: 0; }
    .legal-page p {
      margin: 0 0 10px;
      color: var(--ink-soft);
    }
    .legal-page .legal-note {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(61, 78, 184, .1);
      color: var(--ink);
      font-size: 12.5px;
    }
    @media (prefers-color-scheme: dark) {
      .legal-page .legal-note { background: rgba(110, 126, 255, .14); }
    }

    /* ───────── Чат техподдержки ───────── */
    .support-chat {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .support-chat-head {
      padding: 10px 14px 6px;
      color: var(--ink-soft);
      font-size: 12px;
      text-align: center;
    }
    .support-chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-msg {
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .chat-msg.me {
      align-self: flex-end;
      background: var(--you);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.them {
      align-self: flex-start;
      background: rgba(120, 128, 160, .18);
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }
    @media (prefers-color-scheme: dark) {
      .chat-msg.them { background: rgba(255, 255, 255, .08); }
    }
    .chat-msg .chat-msg-time {
      display: block;
      margin-top: 4px;
      font-size: 10.5px;
      opacity: .75;
      text-align: right;
    }
    .chat-msg.them .chat-msg-time { text-align: left; }
    .support-chat-form {
      display: flex; gap: 8px;
      padding: 8px 10px 10px;
      border-top: 1px solid var(--win-line);
      background: var(--win);
    }
    .support-chat-input {
      flex: 1;
      font: inherit; color: var(--ink);
      background: rgba(255, 255, 255, .55);
      border: 1px solid var(--win-line);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      -webkit-user-select: text; user-select: text;
    }
    @media (prefers-color-scheme: dark) {
      .support-chat-input { background: rgba(255, 255, 255, .08); }
    }
    .support-chat-input:focus {
      border-color: var(--you);
      box-shadow: 0 0 0 3px rgba(61, 78, 184, .25);
    }
    .support-chat-send {
      flex: none;
      border: 0; border-radius: 10px;
      padding: 0 16px;
      background: var(--you); color: #fff;
      cursor: pointer; font: inherit; font-weight: 600;
      transition: background .15s, transform .05s;
    }
    .support-chat-send:hover { background: #2F3EA0; }
    .support-chat-send:active { transform: scale(.97); }
    @media (prefers-color-scheme: dark) {
      .support-chat-send:hover { background: #5D6EE0; }
    }

    /* ═══════════ ЭКРАН АВТОРИЗАЦИИ ═══════════ */
    .auth-screen {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center;
      padding: 20px;
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(110,126,255,.28), transparent 60%),
        radial-gradient(900px 500px at 100% 100%, rgba(61,78,184,.35), transparent 60%),
        var(--land);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .auth-screen[hidden] { display: none !important; }

    .auth-card {
      width: min(440px, 100%);
      background: var(--win);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--win-line);
      border-radius: 18px;
      box-shadow: 0 24px 60px var(--glass-shadow), 0 0 0 .5px rgba(0,0,0,.12);
      padding: 26px 22px 20px;
      animation: auth-in .35s cubic-bezier(.2,.8,.3,1);
    }
    @keyframes auth-in {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }

    .auth-logo {
      display: grid; place-items: center;
      width: 64px; height: 64px; margin: 0 auto 12px;
      border-radius: 18px;
      background: linear-gradient(#8B9AFF, #3D4EB8);
      color: #fff; font-size: 30px; font-weight: 800;
      box-shadow: 0 10px 24px rgba(61,78,184,.45);
    }
    .auth-title {
      margin: 0 0 4px; text-align: center;
      font-size: 20px; font-weight: 700;
    }
    .auth-sub {
      margin: 0 0 18px; text-align: center;
      color: var(--ink-soft); font-size: 13px;
    }

    .auth-form { display: grid; gap: 12px; }
    .auth-field { display: grid; gap: 6px; }
    .auth-label {
      font-size: 12px; font-weight: 600; color: var(--ink-soft);
      padding-left: 4px;
    }
    .auth-input {
      width: 100%;
      font: inherit; color: var(--ink);
      background: rgba(255,255,255,.55);
      border: 1px solid var(--win-line);
      border-radius: 10px;
      padding: 11px 12px;
      outline: none;
      -webkit-user-select: text; user-select: text;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    @media (prefers-color-scheme: dark) {
      .auth-input { background: rgba(255,255,255,.08); }
    }
    .auth-input:focus {
      border-color: var(--you);
      box-shadow: 0 0 0 3px rgba(61,78,184,.25);
      background: rgba(255,255,255,.75);
    }
    @media (prefers-color-scheme: dark) {
      .auth-input:focus {
        background: rgba(255,255,255,.14);
        box-shadow: 0 0 0 3px rgba(110,126,255,.3);
      }
    }
    .auth-input.is-invalid {
      border-color: #C0392B;
      box-shadow: 0 0 0 3px rgba(192,57,43,.22);
    }

    .auth-error {
      color: #C0392B; font-size: 12.5px;
      padding: 8px 10px; border-radius: 8px;
      background: rgba(192,57,43,.1);
    }
    .auth-hint { font-size: 12px; color: var(--ink-soft); padding-left: 4px; }
    .auth-hint.is-invalid { color: #C0392B; }

    .auth-btn {
      width: 100%;
      border: 0; border-radius: 12px;
      padding: 12px 16px;
      font: inherit; font-weight: 650; font-size: 14px;
      cursor: pointer;
      background: var(--you); color: #fff;
      transition: background .15s, transform .05s, opacity .15s;
    }
    .auth-btn:hover { background: #2F3EA0; }
    @media (prefers-color-scheme: dark) {
      .auth-btn:hover { background: #5D6EE0; }
    }
    .auth-btn:active { transform: scale(.99); }
    .auth-btn[disabled] { opacity: .55; cursor: default; }

    .auth-btn-secondary {
      background: transparent; color: var(--you);
      border: 1px solid var(--win-line);
    }
    .auth-btn-secondary:hover { background: var(--row-hover); }

    .auth-links {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin-top: 4px; flex-wrap: wrap;
    }
    .auth-link {
      border: 0; background: transparent; color: var(--you);
      font: inherit; font-weight: 600; cursor: pointer;
      padding: 6px 4px; border-radius: 6px;
    }
    .auth-link:hover { text-decoration: underline; }

    .auth-divider {
      display: flex; align-items: center; gap: 10px;
      color: var(--ink-soft); font-size: 12px; margin: 4px 0;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: ""; flex: 1; height: 1px; background: var(--win-line);
    }

    .auth-steps {
      display: flex; gap: 6px; justify-content: center;
      margin: 0 0 14px;
    }
    .auth-step-dot {
      width: 26px; height: 5px; border-radius: 3px;
      background: rgba(120,128,160,.3);
      transition: background .2s, transform .2s;
    }
    .auth-step-dot.active { background: var(--you); transform: scaleY(1.3); }
    .auth-step-dot.done   { background: rgba(61,78,184,.55); }

    .auth-step-title {
      font-size: 15px; font-weight: 700; margin: 0 0 4px;
      text-align: center;
    }
    .auth-step-sub {
      font-size: 12.5px; color: var(--ink-soft);
      text-align: center; margin: 0 0 16px;
    }

    .gender-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .gender-opt {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 10px; border-radius: 12px;
      border: 2px solid var(--win-line);
      background: rgba(255,255,255,.35);
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
      font: inherit; color: var(--ink);
    }
    @media (prefers-color-scheme: dark) {
      .gender-opt { background: rgba(255,255,255,.05); }
    }
    .gender-opt:hover { transform: translateY(-1px); }
    .gender-opt[aria-pressed="true"] {
      border-color: var(--you);
      background: rgba(61,78,184,.12);
    }
    .gender-opt .gender-emoji { font-size: 26px; }
    .gender-opt .gender-label { font-size: 13px; font-weight: 600; }

    .auth-avatar-row {
      display: flex; align-items: center; gap: 14px;
    }
    .auth-avatar-preview {
      flex: none; width: 84px; height: 84px; border-radius: 50%;
      display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 30px;
      background: linear-gradient(#6E7EFF, #3D4EB8);
      background-size: cover; background-position: center;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    }
    .auth-avatar-side { display: grid; gap: 8px; justify-items: start; }

    .username-status {
      font-size: 12px; padding-left: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .username-status.ok { color: #2E9E5B; }
    .username-status.busy { color: #C0392B; }
    .username-status.checking { color: var(--ink-soft); }
    .username-status .spinner {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid currentColor; border-top-color: transparent;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .auth-age-row {
      display: flex; align-items: center; gap: 12px;
    }
    .auth-age-row input[type="range"] {
      flex: 1; accent-color: var(--you);
    }
    .auth-age-value {
      min-width: 42px; text-align: center;
      font-weight: 700; font-size: 15px;
    }

    /* ═══════════ Полноэкранный режим ═══════════ */
    #map {
      background: var(--land);
      will-change: transform;
      transform: translateZ(0);
      contain: strict;
    }
    :fullscreen,
    :-webkit-full-screen {
      background: var(--land);
    }
    :fullscreen .map-app,
    :-webkit-full-screen .map-app,
    :fullscreen #map,
    :-webkit-full-screen #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- ═══════════ ЭКРАН АВТОРИЗАЦИИ ═══════════ -->
  <section id="auth-screen" class="auth-screen" aria-label="Вход в приложение">
    <div class="auth-card" id="auth-card"></div>
  </section>

  <!-- Слой карты -->
  <div id="map-app" class="map-app">
    <div id="map" class="map-layer" aria-label="Карта"></div>
  </div>

  <!-- Градиенты для SVG-облака желания -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="wishCloudGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#A9B4FF"/>
        <stop offset="1" stop-color="#6E7EFF"/>
      </linearGradient>
      <linearGradient id="wishCloudGradDark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7C8BFF"/>
        <stop offset="1" stop-color="#3D4EB8"/>
      </linearGradient>
    </defs>
  </svg>

  <button id="geo-btn" class="geo-btn" type="button" aria-label="Показать моё местоположение" title="Моё местоположение">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/>
    </svg>
  </button>

  <!-- Колокольчик уведомлений -->
  <button id="notif-btn" type="button" aria-label="Уведомления" title="Уведомления">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6v-5a7 7 0 0 0-5-6.7V3.5a2 2 0 1 0-4 0v.8A7 7 0 0 0 5 11v5l-1.6 2.4c-.4.6 0 1.4.8 1.4h15.6c.8 0 1.2-.8.8-1.4L19 16z"/>
    </svg>
    <span class="badge" id="notif-badge" hidden>0</span>
  </button>

  <!-- Шестерёнка настроек -->
  <button id="settings-btn" type="button" aria-label="Настройки" title="Настройки">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 .1-1 7.6 7.6 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1l-.4-2.6h-3.9l-.4 2.6a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4L4.5 11a7.6 7.6 0 0 0-.1 1 7.6 7.6 0 0 0 .1 1l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.6h3.9l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
    </svg>
  </button>

  <header class="menubar">
    <strong>Карта</strong>
    <div class="menubar-right">
      <span id="offline-badge" hidden>Офлайн</span>
      <button id="install-btn" type="button" hidden>Установить</button>
      <button id="fs-btn" type="button" aria-label="Полноэкранный режим" title="Полноэкранный режим (F)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 0h2v5h-5v-2h3v-3z"/>
        </svg>
      </button>
    </div>
  </header>

  <section id="window" class="window" role="dialog" aria-labelledby="win-title" tabindex="-1" hidden>
    <div class="win-head">
      <button id="win-back" class="win-back" type="button" aria-label="Назад">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M15.4 4.6 8 12l7.4 7.4 1.4-1.4L10.8 12l6-6z"/>
        </svg>
      </button>
      <h2 id="win-title" class="win-title"></h2>
      <span></span>
    </div>
    <div id="win-body" class="win-body"></div>
  </section>

  <nav class="dock-wrap" aria-label="Приложения">
    <ul class="dock" id="dock">

      <li class="dock-item">
        <button class="dock-btn" type="button" data-app="map" aria-label="Карта">
          <svg viewBox="0 0 56 56" aria-hidden="true">
            <defs>
              <linearGradient id="g-map" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#A6B2FF"/><stop offset="1" stop-color="#3D4EB8"/>
              </linearGradient>
              <linearGradient id="g-map-gloss" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <rect width="56" height="56" rx="13" fill="url(#g-map)"/>
            <rect width="56" height="28" rx="13" fill="url(#g-map-gloss)"/>
            <path fill="#fff" d="M28 12c-7.2 0-13 5.6-13 12.5 0 9.2 13 21.5 13 21.5s13-12.3 13-21.5C41 17.6 35.2 12 28 12zm0 16.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
          </svg>
        </button>
        <span class="tip" aria-hidden="true">Карта</span>
      </li>

      <li class="dock-item">
        <button class="dock-btn" type="button" data-app="friends" aria-label="Друзья">
          <svg viewBox="0 0 56 56" aria-hidden="true">
            <defs>
              <linearGradient id="g-fr" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#7ED8FF"/><stop offset="1" stop-color="#2C7BC4"/>
              </linearGradient>
              <linearGradient id="g-fr-gloss" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <rect width="56" height="56" rx="13" fill="url(#g-fr)"/>
            <rect width="56" height="28" rx="13" fill="url(#g-fr-gloss)"/>
            <circle cx="22" cy="22" r="6.2" fill="#fff"/>
            <circle cx="36" cy="23" r="5" fill="#fff" opacity=".85"/>
            <path fill="#fff" d="M10 42c0-6.2 5.4-9.6 12-9.6S34 35.8 34 42z"/>
            <path fill="#fff" d="M34 42c0-4.6 2.8-7.6 7.5-7.6S49 37 49 42z" opacity=".85"/>

              <linearGradient id="g-gloss1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>

              <linearGradient id="g-gloss2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
            </defs>
