    if (!ids.length) { friends = []; scheduleStateSave(); return; }
    const { data: profs, error: pErr } = await supabaseClient.from('profiles').select('id,name,username,avatar').in('id', ids);
    if (pErr) { console.warn('[friends profiles]:', pErr.message); return; }
    friends = (profs || []).map((p) => ({ id: p.id, name: p.name, handle: '@' + p.username, avatar: p.avatar || '' }));
    // имя и фото запоминаем и отдельно: если человек перестанет быть другом, чат с ним в списке останется подписанным
    for (const f of friends) peopleCache.set(String(f.id), { id: String(f.id), name: f.name || 'Пользователь', handle: f.handle, avatar: f.avatar, gender: (peopleCache.get(String(f.id)) || {}).gender || '' });
    scheduleStateSave();
  }

  /* ═══════ REALTIME ═══════
     При каждой переподписке у каналов новые имена (rt:posts:2, rt:posts:3 …). На запрос канала с уже знакомым именем
     библиотека отдаёт прежний объект, а он в этот момент ещё закрывается после removeChannel: новая подписка умирала
     вместе с ним. Подписки пересоздаются при каждом возврате сети — после этого сообщения и уведомления
     переставали приходить до перезагрузки страницы. */
  let rtChannels = [], rtGen = 0;
  function subscribeRealtime() {
    rtChannels.forEach((c) => { try { supabaseClient.removeChannel(c); } catch {} });
    rtChannels = [];
    const gen = ++rtGen;
    const chan = (name) => supabaseClient.channel(`${name}:${gen}`);

    const ch1 = chan('rt:posts')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, async () => {
        await loadPostsFromDB();
        if (openApp === 'profile' && !win.hidden && winTitle.textContent === 'Воспоминания') quietly(showPlacesScreen);
      }).subscribe();
    rtChannels.push(ch1);

    const ch2 = chan('rt:wishes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'wishes' }, async () => {
        await loadWishesFromDB();
        scheduleFeedRender();
        if (openApp === 'profile' && !win.hidden && winTitle.textContent === 'Желания' && !win.querySelector('.modal-backdrop')) quietly(showWishesScreen);
      }).subscribe();
    rtChannels.push(ch2);

    const ch3 = chan('rt:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room_id=eq.general' }, (payload) => {
        chatMessages.push(payload.new);
        // Перерисовываем только если открыт именно общий чат, иначе затрём список чатов / личный диалог
        if (openApp === 'messenger' && winBody.querySelector('#chat-body')) renderMessengerList();
      }).subscribe();
    rtChannels.push(ch3);

    const ch4 = chan('rt:notifications')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: currentUser ? `user_id=eq.${currentUser.id}` : undefined }, (payload) => {
        const n = mapNotificationRow(payload.new);
        notifications.unshift(n);
        if (n.type === 'friend_request' && n.requestId) {
          // заявка в друзья — во вкладке «Друзья», с цифрой на вкладке
          pendingIncomingRequests.add(n.requestId);
          loadIncomingFriendRequests().then(refreshFriendsList);
        }
        if (n.type === 'group') {
          // приглашение в группу (во вкладке «Группы») или ответ на него — нужны свежие приглашения
          loadGroupInvitesFromDB().then(() => { if (openApp === 'notifications') refreshNotifications(); refreshGroupsList(); });
        }
        if (/^join_(request|accept|decline)$/.test(n.type)) {
          // заявка в мою группу или ответ на мою заявку (принятому следом придёт приглашение — вступим сами)
          Promise.all([loadJoinRequestsFromDB(), loadGroupInvitesFromDB()]).then(() => {
            syncRequestBadges(); refreshGroupsList();
            if (winBody.querySelector('[data-group-card]')) quietly(reopenGroupDetails);
          });
        }
        if (n.type === 'friend_accept') {
          // Наш запрос приняли — обновляем список друзей
          loadFriendsFromDB().then(refreshFriendsList);
        }
        if (['group_match', 'group_match_accept', 'match_vote', 'match_vote_result'].includes(n.type)) {
          // Запрос на match, match состоялся, голосование о союзе — нужны свежие match и чаты
          refreshGroupsWorld().then(() => {
            if (openApp === 'notifications') refreshNotifications();
            onMatchesChanged();
          });
        }
        updateBadge();
        if (openApp === 'notifications') refreshNotifications();
      }).subscribe();
    rtChannels.push(ch4);

    const ch5 = chan('rt:dm')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'dm_messages' }, (payload) => handleChatRealtime(payload, 'dm', normDmRow)).subscribe();
    rtChannels.push(ch5);

    // Групповые чаты: RLS пропускает только сообщения групп, где мы участники
    const chGroupMsg = chan('rt:group_messages')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'group_messages' }, (payload) => handleChatRealtime(payload, 'group', normGroupRow)).subscribe();
    rtChannels.push(chGroupMsg);

    // Совместные чаты групп после match
    const chMatchMsg = chan('rt:match_messages')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'match_messages' }, (payload) => handleChatRealtime(payload, 'match', normMatchRow)).subscribe();
    rtChannels.push(chMatchMsg);

    // Отметки «прочитано»: RLS пропускает мои, собеседников в личных чатах и участников моих групп
    const chReads = chan('rt:chat_reads')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_reads' }, (payload) => onChatReadRow(payload.new)).subscribe();
    rtChannels.push(chReads);

    // Голоса в совместном чате — счётчик обновляется у всех сразу
    const chMatchVotes = chan('rt:match_votes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'match_votes' }, (payload) => {
        const row = payload.new && payload.new.match_id != null ? payload.new : payload.old;
        if (chat && chat.type === 'match' && row && String(row.match_id) === String(chat.matchId)) refreshMatchVotePanel();
      }).subscribe();
    rtChannels.push(chMatchVotes);

    // Новые группы, их желания, составы и match — сразу в ленте у всех
    const chGroupsWorld = chan('rt:groups_world')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'groups' }, scheduleGroupsWorldRefresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'group_members' }, scheduleGroupsWorldRefresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'group_matches' }, (payload) => { applyMatchRealtime(payload); scheduleGroupsWorldRefresh(); })
      .subscribe();
    rtChannels.push(chGroupsWorld);

    // Нас удалили из друзей (или добавили) — обновляем список без перезагрузки
    const chFriends = chan('rt:friendships')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, async () => {
        await refreshFriendsData();
        refreshFriendsList();
      }).subscribe();
    rtChannels.push(chFriends);

  }

  /* ═══════ ЛЮДИ ИЗ ГРУПП ═══════
     Имена и фото тех, кто не в друзьях: участников моих групп, лидеров групп в ленте, участников групп с match */
  let groupMemberProfiles = new Map();

  /* Чьи имена и фото нужны:
     — друзей;
     — участников моих групп;
     — лидеров групп в ленте — они на карточках;
     — после match — всех участников групп, с которыми у моих групп match;
     — авторов желаний «для всех» — они в списке желаний. */
  function computeRelevantUserIds() {
    const ids = new Set();
    const myId = currentUser && currentUser.id;
    if (!myId) return ids;
    for (const f of friends) ids.add(f.id);
    for (const w of wishes) {
      if (w.audience === 'all' && !Array.isArray(w.coords) && w.authorId) ids.add(w.authorId);
    }
    for (const g of groups) {
      const mine = isGroupParticipant(g, myId);
      // Лидер чужой группы нужен, только если группа проходит фильтры (она в ленте)
      // Скрытые группы (закреплённый союз, распавшийся союз) не показываем вовсе
      if (mine || (!groupHiddenForMe(g) && groupPassesFilters(g))) ids.add(g.ownerId);
      // Участники всех групп, где я состою (лидером или участником), видят друг друга
      if (!mine) continue;
      for (const m of (g.members || [])) ids.add(m.id);
    }
    for (const m of myAcceptedMatches()) {
      for (const gid of [m.fromGroup, m.toGroup]) {
        const g = groupById(gid);
        if (!g) continue;
        ids.add(g.ownerId);
        for (const mem of (g.members || [])) ids.add(mem.id);
      }
    }
    ids.delete(myId);
    return ids;
  }

  async function loadGroupMemberProfiles() {
    const friendIds = new Set(friends.map((f) => f.id));
    // лидеры групп-ботов — не с сервера (их имена и фото в peopleCache, см. mergeBots)
    const ids = [...computeRelevantUserIds()].filter((id) => !friendIds.has(id) && !isBotId(id));
    if (!ids.length) { groupMemberProfiles = new Map(); return; }
    // Запасной вариант — имя и аватар, сохранённые в составе группы, а если сервер не ответил — то, что уже было
    const next = new Map();
    for (const g of groups) {
      for (const m of (g.members || [])) {
        if (ids.includes(m.id) && !next.has(m.id)) next.set(m.id, { id: m.id, name: m.name, handle: m.handle, avatar: m.avatar || '' });
      }
    }
    const { data, error } = await supabaseClient.from('profiles').select('id,name,username,avatar').in('id', ids);
    if (error) {
      console.warn('[group profiles] load:', error.message);
      for (const id of ids) if (groupMemberProfiles.has(id)) next.set(id, groupMemberProfiles.get(id));
    }
    for (const p of (data || [])) next.set(p.id, { id: p.id, name: p.name, handle: '@' + p.username, avatar: p.avatar || '' });
    groupMemberProfiles = next;
    scheduleFeedRender();
  }

  /* Перечитать друзей. loadGroupMemberProfiles нужен, чтобы имя и фото бывшего друга, оставшегося
     участником группы, по-прежнему были известны */
  async function refreshFriendsData() {
    await loadFriendsFromDB();
    await loadGroupMemberProfiles();
  }

  function personById(userId) {
    if (userId === (currentUser && currentUser.id)) return null;
    const f = friends.find((x) => x.id === userId);
    if (f) return f;
    if (groupMemberProfiles.has(userId)) return groupMemberProfiles.get(userId);
    return null;
  }

  // Плашка группы: фото, название, число участников (превью желания группы)
  function groupPillHtml(g, extraClass = '', attrs = '') {
    const name = ellipsize((g.name || 'Группа').trim(), 22);
    const count = (g.members || []).length + 1; // участники + лидер
    const ava = g.photo
      ? `<span class="group-pill-ava" style="background-image:url('${safeUrl(g.photo)}')"></span>`
      : `<span class="group-pill-ava">${escapeHtml(firstChar((g.name || '?').trim()).toUpperCase() || '?')}</span>`;
    return `<div class="group-pill ${extraClass}" ${attrs}>
        ${ava}
        <span class="group-pill-name">${escapeHtml(name)}</span>
        <span class="group-pill-count">${count}</span>
      </div>`;
  }

  /* ── Люди, которых нет среди друзей и знакомых по группам ──
     Кто прислал приглашение в группу, кто просится в группу: имя, фото и пол из profiles,
     пачкой и по необходимости. Того, кого нет в profiles, тоже запоминаем (missing), чтобы не спрашивать снова */
  const peopleCache = new Map();   // id → { id, name, handle, avatar, gender, missing? }
  let peopleGenderMissing = false;
  async function ensurePeople(ids) {
    // участников групп-ботов на сервере нет: их номер в запросе сломал бы весь запрос
    const need = [...new Set(ids.map(String))].filter((id) => id && !peopleCache.has(id) && !isBotId(id));
    let got = false;
    for (let i = 0; i < need.length; i += 100) {
      const part = need.slice(i, i + 100);
      const ask = (cols) => supabaseClient.from('profiles').select(cols).in('id', part);
      let { data, error } = await ask(peopleGenderMissing ? 'id,name,username,avatar' : 'id,name,username,avatar,gender');
      if (error && !peopleGenderMissing && /gender/i.test(error.message || '')) {
        peopleGenderMissing = true;
        ({ data, error } = await ask('id,name,username,avatar'));
      }
      if (error) { console.warn('[profiles] people:', error.message); return got; }
      const found = new Set();
      for (const p of (data || [])) {
        found.add(String(p.id));
        peopleCache.set(String(p.id), { id: String(p.id), name: p.name || 'Пользователь', handle: p.username ? '@' + p.username : '', avatar: p.avatar || '', gender: p.gender || '' });
      }
      for (const id of part) if (!found.has(id)) peopleCache.set(id, { id, name: '', handle: '', avatar: '', gender: '', missing: true });
      got = true;
    }
    return got;
  }

  function sharesGroupWithMe(userId) {
    const myId = currentUser && currentUser.id;
    return !!myId && groups.some((g) => isGroupParticipant(g, myId) && isGroupParticipant(g, userId));
  }

  /* Знак «feat» — две группы сливаются: два круга внахлёст, в каждом фото группы, а у группы без фото — её цвет
     (нет фото ни у одной — просто слияние двух цветов). Линза пересечения — их общий чат и союз, она подсвечивается
     по состоянию союза. Круги в координатах значка 44×44: радиус 13, центры в 16 и 28 */
  const FEAT_LENS = 'M22 10.47A13 13 0 0 1 22 33.53A13 13 0 0 1 22 10.47Z';
  function featClass(m) {
    const photo = !!m && [m.fromGroup, m.toGroup].some((gid) => { const g = groupById(gid); return !!g && !!safeUrl(g.photo); });
    return 'feat-ava' + (photo ? ' has-photo' : '') + (m && m.voteState ? ' is-' + escapeHtml(m.voteState) : '');
  }
  function featInnerHtml(m) {
    const circle = (gid, cls) => {
      const g = m ? groupById(gid) : null, url = g ? safeUrl(g.photo) : '';
      return `<i class="${cls}"${url ? ` style="background-image:url('${url}')"` : ''}></i>`;
    };
    return `${circle(m && m.fromGroup, 'fa')}${circle(m && m.toGroup, 'fb')}<svg viewBox="0 0 44 44" aria-hidden="true"><path class="fx" d="${FEAT_LENS}"/></svg>`;
  }
  // Значок совместного чата (и союза) нужного размера
  function featAvatarHtml(m, size = 0) {
    return `<span class="avatar group-chat-avatar match-chat-avatar ${featClass(m)}"${size ? ` style="width:${size}px;height:${size}px"` : ''}>${featInnerHtml(m)}</span>`;
  }

  /* ═══════ ОБЛАКО ЖЕЛАНИЯ ═══════
     Контур — «барашки» по краю суперэллипса, в который вписан текст: облако растёт под текст,
     а барашки не растягиваются. Снизу хвостик, его кончик — точка привязки у плашки. */
  const WISH_TEXT_MAX = 150;          // ширина текста в облаке (как max-width у .wc-measure)
  const wishSizeCache = new Map();
  const wishGeomCache = new Map();
  let wishMeasureEl = null;

  function wishTextInner(text, caption) {
    return `${caption ? `<span class="wc-cap">${escapeHtml(caption)}</span>` : ''}<span class="wc-msg">${escapeHtml(text)}</span>`;
  }

  function measureWishText(text, caption) {
    const key = text + '\u0001' + caption;
    let size = wishSizeCache.get(key);
    if (size) return size;
    if (!wishMeasureEl) {
      wishMeasureEl = document.createElement('div');
      wishMeasureEl.className = 'wc-text wc-measure';
      wishMeasureEl.setAttribute('aria-hidden', 'true');
      document.body.appendChild(wishMeasureEl);
    }
    wishMeasureEl.innerHTML = wishTextInner(text, caption);
    const r = wishMeasureEl.getBoundingClientRect();
    size = { w: Math.min(WISH_TEXT_MAX, Math.ceil(r.width)) + 2, h: Math.max(16, Math.ceil(r.height)) };
    wishSizeCache.set(key, size);
    return size;
  }

  // side: 'right' — облако справа от иконки, хвостик уходит влево вниз; 'left' — зеркально.
  // pair — над иконкой два облака: хвостик у края облака, чтобы облака разошлись в стороны
  function wishCloudGeometry(tw, th, side, pair = false) {
    const key = `${tw}x${th}:${side}:${pair ? 2 : 1}`;
    const hit = wishGeomCache.get(key);
    if (hit) return hit;
    const a = Math.max(50, tw / 2 / 0.9 + 9);
    const b = Math.max(25, th / 2 / 0.78 + 7);
    // контур — суперэллипс |x/a|⁴ + |y/b|⁴ = 1, обход по часовой стрелке (y вниз)
    const S = 480, P = [];
    for (let i = 0; i <= S; i++) {
      const t = (i / S) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
      P.push([a * Math.sign(c) * Math.sqrt(Math.abs(c)), b * Math.sign(s) * Math.sqrt(Math.abs(s))]);
    }
    // «взвешенная» длина контура: сверху барашки крупнее, снизу мельче
    const U = [0];
    for (let i = 1; i <= S; i++) {
      const w = 1.05 - 0.34 * ((P[i - 1][1] + P[i][1]) / 2 / b);
      U.push(U[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]) / w);
    }
    const total = U[S];
    const n = Math.max(7, Math.min(16, Math.round(total / 30)));
    const step = total / n;
    const dir = side === 'left' ? 1 : -1;   // куда смещён кончик хвостика
    // хвостик — снизу, ближе к стороне иконки: одна «ячейка» контура отдаётся под его основание
    let ti = 0, best = Infinity;
    for (let i = 0; i <= S; i++) {
      const d = Math.abs(P[i][0] - dir * a * (pair ? 0.55 : 0.42));
      if (P[i][1] > 0 && d < best) { best = d; ti = i; }
    }
    const at = (u) => {
      u = ((u % total) + total) % total;
      let lo = 0, hi = S;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (U[mid] <= u) lo = mid; else hi = mid; }
      const k = (u - U[lo]) / Math.max(1e-9, U[hi] - U[lo]);
      return [P[lo][0] + (P[hi][0] - P[lo][0]) * k, P[lo][1] + (P[hi][1] - P[lo][1]) * k];
    };
    const pts = [];
    for (let k = 0; k < n; k++) pts.push(at(U[ti] - step / 2 + k * step));

    const f = (p) => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    const bb = [Infinity, Infinity, -Infinity, -Infinity];
    const add = (x, y) => { bb[0] = Math.min(bb[0], x); bb[1] = Math.min(bb[1], y); bb[2] = Math.max(bb[2], x); bb[3] = Math.max(bb[3], y); };
    // барашки: дуги между соседними точками, выпуклые наружу
    const A = pts[0], B = pts[1];   // основание хвостика (обход снизу идёт справа налево)
    let d = `M${f(B)}`;
    for (let k = 1; k < n; k++) {
      const p = pts[k], q = pts[(k + 1) % n];
      const vx = q[0] - p[0], vy = q[1] - p[1], len = Math.hypot(vx, vy);
      const r = len * 0.56;
      d += `A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${f(q)}`;
      const h = Math.sqrt(Math.max(0, r * r - len * len / 4));
      const cx = (p[0] + q[0]) / 2 - (vy / len) * h, cy = (p[1] + q[1]) / 2 + (vx / len) * h;  // центр — внутри облака
      const a0 = Math.atan2(p[1] - cy, p[0] - cx);
      let da = Math.atan2(q[1] - cy, q[0] - cx) - a0;
      while (da > Math.PI) da -= 2 * Math.PI;
      while (da < -Math.PI) da += 2 * Math.PI;
      for (let j = 0; j <= 8; j++) add(cx + r * Math.cos(a0 + da * j / 8), cy + r * Math.sin(a0 + da * j / 8));
    }
    // хвостик: «рожок» спускается сбоку от плашки и загибается к её краю — кончик касается плашки снаружи,
    // не заходя на аватар и имя
    const M = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
    const T = [M[0] + dir * 13, M[1] + 27];
    const outer = dir < 0 ? A : B;
    const cOut = [outer[0] + dir * 1, M[1] + 24];
    const cIn = [M[0] + dir * 4, M[1] + 14];
    const c1 = dir < 0 ? cOut : cIn, c2 = dir < 0 ? cIn : cOut;
    d += `Q${f(c1)} ${f(T)}Q${f(c2)} ${f(B)}Z`;
    [A, B, T, c1, c2].forEach((p) => add(p[0], p[1]));

    const pad = 6;
    const x0 = bb[0] - pad, y0 = bb[1] - pad;
    const w = Math.ceil(bb[2] - bb[0] + pad * 2), hgt = Math.ceil(bb[3] - bb[1] + pad * 2);
    const geom = { w, h: hgt, vb: `${x0.toFixed(1)} ${y0.toFixed(1)} ${w} ${hgt}`, d, tipX: T[0] - x0, tipY: T[1] - y0, cx: -x0, cy: -y0 - 1 };
    wishGeomCache.set(key, geom);
    return geom;
  }

  function wishCloud({ text, caption = '', tone = 'me', side = 'right', pair = false, attrs = '' }) {
    text = String(text || '');
    const t = measureWishText(text, caption);
    const g = wishCloudGeometry(t.w, t.h, side, pair);
    const html = `<div class="wish-cloud is-${tone}" ${attrs} style="left:${(-g.tipX).toFixed(1)}px;top:${(-g.tipY).toFixed(1)}px;width:${g.w}px;height:${g.h}px;transform-origin:${g.tipX.toFixed(1)}px ${g.tipY.toFixed(1)}px">
        <svg width="${g.w}" height="${g.h}" viewBox="${g.vb}" aria-hidden="true"><path class="wc-edge" d="${g.d}"/><path class="wc-body" d="${g.d}"/></svg>
        <div class="wc-text" style="left:${(g.cx - t.w / 2).toFixed(1)}px;top:${(g.cy - t.h / 2).toFixed(1)}px;width:${t.w}px">${wishTextInner(text, caption)}</div>
      </div>`;
    return { html, g };
  }

  // Текущее желание человека — последнее (желания прежней версии, привязанные к точке, — не в счёт)
  function currentWishOf(userId) {
    const uid = String(userId);
    let best = null;
    for (const w of visibleWishes()) {
      if (String(w.authorId) !== uid || Array.isArray(w.coords)) continue;
      if (!best || (w.ts || 0) > (best.ts || 0)) best = w;
    }
    return best;
  }
  function myCurrentWish() { return currentUser ? currentWishOf(currentUser.id) : null; }

  /* ═══════ НАСТРОЙКИ ═══════ */
  const SETTINGS_KEY = 'app.settings.v1';
  const DEFAULT_SETTINGS = { notifications: true };
  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return { ...DEFAULT_SETTINGS };
      const parsed = JSON.parse(raw);
      if (parsed) { delete parsed.offline; delete parsed.geolocation; }   // прежние настройки: офлайн-режим и геопозиция
      return { ...DEFAULT_SETTINGS, ...parsed };
    } catch { return { ...DEFAULT_SETTINGS }; }
  }
  function saveSettings(s) { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch {} }
  let settings = loadSettings();

  /* ═══════ ТЕМА ═══════ */
  // Начальную тему ставит скрипт в <head> (до отрисовки), здесь — переключение из настроек и смена системной
  const THEME_KEY = 'app.theme';
  const themeMq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function getThemePref() { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch { return 'auto'; } }
  function resolvedTheme(pref = getThemePref()) {
    return pref === 'dark' || (pref !== 'light' && themeMq && themeMq.matches) ? 'dark' : 'light';
  }
  function applyTheme() {
    const th = resolvedTheme();
    const root = document.documentElement;
    root.setAttribute('data-theme', th);
    const meta = document.getElementById('meta-theme-color');
    if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--land').trim() || (th === 'dark' ? '#090C0B' : '#E9EBE6'));
  }
  function setThemePref(pref) {
    try { localStorage.setItem(THEME_KEY, pref); } catch {}
    // плавный переход цветов только на время смены темы
    document.documentElement.classList.add('theme-switching');
    applyTheme();
    setTimeout(() => document.documentElement.classList.remove('theme-switching'), 450);
    document.querySelectorAll('[data-theme-pref]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themePref === pref)));
  }
  if (themeMq) {
    const onSystemTheme = () => { if (getThemePref() === 'auto') applyTheme(); };
    if (themeMq.addEventListener) themeMq.addEventListener('change', onSystemTheme); else if (themeMq.addListener) themeMq.addListener(onSystemTheme);
  }
  applyTheme();

  /* ═══════ ЦВЕТОВАЯ СХЕМА ═══════
     Четыре схемы, у каждой светлый и тёмный вариант (его выбирает «Тема»). Вместе со схемой меняются
     значок вкладки, значок для «домашнего экрана» и манифест. */
  const PALETTE_KEY = 'app.palette';
  const PALETTES = { prism: { label: 'Призма', a: '#7B4DFF', b: '#00B3C7' }, acid: { label: 'Кислота', a: '#C6FF1A', b: '#0A0B08' }, ember: { label: 'Огонь', a: '#FF5B2E', b: '#2A130B' }, frost: { label: 'Иней', a: '#9EDCFF', b: '#0A1A38' } };
  function getPalette() { try { const p = localStorage.getItem(PALETTE_KEY); return PALETTES[p] ? p : 'prism'; } catch { return 'prism'; } }
  function applyPalette() {
    const p = getPalette();
    document.documentElement.setAttribute('data-palette', p);
    if (window.__paletteAssets) window.__paletteAssets(p);
    applyTheme();     // цвет системной панели браузера — по фону схемы
    Globe.tint();
  }
  function setPalette(p) {
    if (!PALETTES[p]) return;
    try { localStorage.setItem(PALETTE_KEY, p); } catch {}
    document.documentElement.classList.add('theme-switching');
    applyPalette();
    setTimeout(() => document.documentElement.classList.remove('theme-switching'), 450);
    document.querySelectorAll('[data-palette-pref]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.palettePref === p)));
  }

  function syncSettingsUi() {
    document.querySelectorAll('.switch[data-setting]').forEach((el) => {
      const key = el.dataset.setting;
      el.setAttribute('aria-checked', String(key === 'notifications' ? pushOn() : !!settings[key]));
    });
  }

  /* ═══════ ВОСПОМИНАНИЯ ═══════ */
  function jumpToPostInFeed(postId) {
    // чужое воспоминание, где меня нет, — отдельным экраном, а не в моей ленте
    if (!myPosts().some((x) => x.id === postId)) { showSinglePost(postId); return; }
    placesView = 'feed'; savePlacesView('feed'); showPlacesScreen();
    requestAnimationFrame(() => {
      const el = winBody.querySelector(`.post[data-post-id="${CSS.escape(String(postId))}"]`);
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    });
  }
  function showSinglePost(postId) {
    const p = posts.find((x) => x.id === postId);
    if (!p) return;
    if (openApp !== 'profile') showApp('profile');
    setScreen(() => {
      winTitle.textContent = 'Воспоминание';
      winBody.scrollTop = 0;
      winBody.innerHTML = renderPostsFeed([p]);
      bindCarousels();
    }, () => closeApp());
  }

  /* ═══════ ЖЕЛАНИЯ ═══════ */
  /* У человека одно текущее желание — последнее (его видно в профиле и в списке желаний); место — просто подпись,
     где. Желание группы хранится в groups.wish и видно на её карточке в ленте. */
  /* Желание живёт 12 часов с публикации, потом исчезает само. Удаляет его сервер по расписанию
     (supabase_wish_expiry.sql), а приложение прячет просроченные сразу, не дожидаясь сервера. */
  const WISH_TTL = 12 * 3600 * 1000;
  function wishAlive(w) { const ts = Number(w && w.ts); return !ts || Date.now() - ts < WISH_TTL; }
  function groupWishAlive(at) { const ts = at ? Date.parse(at) : NaN; return !ts || Date.now() - ts < WISH_TTL; }
  function wishLeftLabel(ts) {
    const left = Number(ts) + WISH_TTL - Date.now();
    if (!Number(ts) || left <= 0) return '';
    const h = Math.floor(left / 3600000);
    return 'исчезнет через ' + (h ? `${h} ч` : `${Math.max(1, Math.ceil(left / 60000))} мин`);
  }
  // Запасной путь, если задача на сервере не настроена: свои просроченные желания удаляю сам
  function cleanupMyExpiredWishes(rows) {
    if (!currentUser) return;
    const myId = String(currentUser.id);
    if (!rows.some((r) => String(r.author_id) === myId && !wishAlive({ ts: r.ts }))) return;
    supabaseClient.from('wishes').delete().eq('author_id', currentUser.id).lt('ts', Date.now() - WISH_TTL)
      .then(({ error }) => { if (error) console.warn('[wishes] expire:', error.message); });
  }
  function cleanupMyExpiredGroupWishes(rows) {
    if (!currentUser) return;
    for (const g of rows) {
      if (g.owner_id !== currentUser.id || !(g.wish || '').trim() || groupWishAlive(g.wish_at)) continue;
      supabaseClient.rpc('set_group_wish', { gid: String(g.id), wish_text: '' })
        .then(({ error }) => { if (error) console.warn('[group wish] expire:', error.message); });
    }
  }
  // Раз в минуту: истёкшие желания пропадают из ленты и экранов без перезагрузки
  setInterval(() => {
    if (!currentUser) return;
    const before = wishes.length;
    wishes = wishes.filter(wishAlive);
    let changed = wishes.length !== before;
    if (groups.some((g) => g.wish && !groupWishAlive(g.wishAt))) {
      groups = groups.map((g) => (g.wish && !groupWishAlive(g.wishAt) ? { ...g, wish: '' } : g));
      changed = true;
    }
    if (!changed) return;
    scheduleStateSave();
    scheduleFeedRender();
    rerenderWishContext();
    refreshGroupsList();
  }, 60000);

  function visibleWishes() {
    const myId = currentUser && String(currentUser.id);
    const friendIds = new Set(friends.map((f) => String(f.id)));
    return wishes.filter((w) => {
      if (!currentUser) return w.audience === 'all';
      if (String(w.authorId) === myId) return true;
      if (w.audience === 'all') return true;
      if (w.audience === 'friends') return friendIds.has(String(w.authorId));
      if (w.audience === 'group') return !!w.groupId && isGroupParticipant(groupById(w.groupId), currentUser.id);
      if (w.audience === 'me') return false;
      return true;
    });
  }

  const ICON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>`;
  const ICON_TRASH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`;
  const ICON_PLUS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;
  const ICON_CLOCK_MINI = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`;
  const ICON_FEED = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6.4 5.6 7a2.2 2.2 0 0 0-1.6 2.7l2.5 9.5a2.2 2.2 0 0 0 2.7 1.6l2.3-.6"/><rect x="8.75" y="3.25" width="11.5" height="16.5" rx="2.6"/></svg>`;

  function wishAudienceLabel(w) {
    if (w.audience === 'me') return '👤 Только мне';
    if (w.audience === 'friends') return '👥 Друзьям';
    if (w.audience === 'group') { const g = groupById(w.groupId); return '👥 ' + (g ? g.name : 'Группа'); }
    return '🌍 Всем';
  }
  function wishTimeLabel(ts) {
    return fmtRu(new Date(ts || Date.now()), DAY_TIME);
  }

  /* Превью: облако над плашкой.
     pillW — примерная ширина плашки, чтобы она не вылезала за край. Плашка с длинным именем вместе с облаком
     шире окна телефона — тогда превью целиком уменьшается (k), а не распирает экран вбок. */
  function wishPreviewHtml({ text, tone, caption = '', pillHtml, pillW }) {
    const { html, g } = wishCloud({ text, caption, tone, side: 'right' });
    const pillX = g.tipX - 1;      // правый край плашки: хвостик огибает её сбоку
    const pillTop = g.tipY - 10;
    const shift = Math.max(0, Math.round(pillW - pillX));
    const w = shift + g.w, h = Math.ceil(pillTop + 32);
    const k = Math.min(1, Math.max(200, winBody.clientWidth - 44) / w);   // 44 — поля экрана по бокам от превью
    return `<div class="wish-preview"><div class="wp-fit" style="width:${Math.floor(w * k)}px;height:${Math.ceil(h * k)}px">
        <div class="wp-stage" style="left:${shift}px;width:${g.w}px;height:${h}px;transform:scale(${k.toFixed(3)});transform-origin:${-shift}px 0">
          <span class="wish-anchor" style="left:${g.tipX.toFixed(1)}px;top:${g.tipY.toFixed(1)}px;margin:0">${html}</span>
          ${pillHtml.replace('class="', `style="left:${pillX.toFixed(1)}px;top:${pillTop.toFixed(1)}px" class="wp-pill `)}
        </div></div></div>`;
  }

  function myWishPreviewHtml(w) {
    const name = (profile.name || 'Я').trim();
    const ava = profile.avatar
      ? `<span class="user-badge-avatar" style="background-image:url('${safeUrl(profile.avatar)}')"></span>`
      : `<span class="user-badge-avatar">${escapeHtml(firstChar(name).toUpperCase() || '?')}</span>`;
    return wishPreviewHtml({
      text: w.text, tone: 'me',
      pillHtml: `<div class="user-badge-inner">${ava}<span class="user-badge-name">${escapeHtml(name)}</span></div>`,
      pillW: 42 + Math.min(18, name.length) * 7.2,
    });
  }

  function groupWishPreviewHtml(g) {
    return wishPreviewHtml({
      text: g.wish, tone: 'group',
      pillHtml: groupPillHtml(g),
      pillW: 78 + Math.min(22, (g.name || '').length) * 7.4,
    });
  }

  function wishCardHtml(w, mine) {
    const meta = [];
    if (w.place) meta.push('📍 ' + escapeHtml(w.place));
    meta.push(escapeHtml(wishAudienceLabel(w)));
    meta.push(wishTimeLabel(w.ts));
    if (wishLeftLabel(w.ts)) meta.push(wishLeftLabel(w.ts));
    const id = escapeHtml(w.id);
    return `
      <li class="wish-card" data-wish-id="${id}">
        ${mine ? '' : `<div class="wish-card-author">${escapeHtml(w.authorName || 'Пользователь')}</div>`}
        <div class="wish-card-text">${escapeHtml(w.text)}</div>
        <div class="wish-card-meta">${meta.join(' • ')}</div>
        ${mine ? `<div class="wish-card-actions">
          <button class="wa-btn" type="button" data-wish-edit="${id}">${ICON_EDIT}Изменить</button>
          <button class="wa-btn danger" type="button" data-wish-remove="${id}">${ICON_TRASH}Удалить</button>
        </div>` : ''}
      </li>`;
  }

      winBody.innerHTML = `

  // Изменить или загадать желание группы — окно с полем ввода
  async function editGroupWish(groupId) {
    const g = groupById(groupId);
    if (!g) return;
    const text = await promptModal({
      title: g.wish ? 'Желание группы' : 'Новое желание группы',
      text: 'Желание появится на карточке группы в ленте — его увидят все. Через 12 часов оно исчезнет само.',
      value: g.wish || '', placeholder: 'Например: сходить в кино сегодня вечером', maxLength: 120,
      confirmLabel: g.wish ? 'Сохранить' : 'Опубликовать',
    });
    if (text === null || text === (g.wish || '')) return;
    if (await saveGroupWish(groupId, text)) rerenderWishContext();
  }

  async function deleteGroupWish(groupId) {
    const ok = await confirmModal({ title: 'Удалить желание группы?', text: 'Желание исчезнет с карточки группы у всех.', confirmLabel: 'Удалить' });
    if (ok && await saveGroupWish(groupId, '')) rerenderWishContext();
  }

  // После изменения желания перерисовать открытый экран: список желаний или карточку группы
  function rerenderWishContext() {
    if ((openApp !== 'profile' && openApp !== 'groups') || win.hidden) return;
    if (winTitle.textContent === 'Желания') quietly(showWishesScreen);
    else if (groupDetailsId) quietly(reopenGroupDetails);
  }

  function showNewWishScreen(editingId = null) {
    setScreen(() => {
      const editing = editingId ? wishes.find((w) => w.id === editingId) : null;
      winTitle.textContent = editing ? 'Изменить желание' : 'Новое желание';
      winBody.scrollTop = 0;
      const currentText = editing ? editing.text : '';
      const currentPlace = editing ? (editing.place || '') : '';
      const currentAudience = editing ? editing.audience : 'all';
      const currentGroup = editing ? (editing.groupId || '') : '';
      const memberOf = myGroups();
      const groupOptions = memberOf.length
        ? memberOf.map((g) => `<option value="${escapeHtml(g.id)}" ${String(currentGroup) === String(g.id) ? 'selected' : ''}>${escapeHtml(g.name)}</option>`).join('')
        : `<option value="">— нет групп —</option>`;
      const replacing = !editing && myCurrentWish();

      winBody.innerHTML = `
        <form class="edit-form" id="wish-form" novalidate>
          <label class="edit-field"><span class="edit-label">Желание</span><textarea class="edit-textarea" id="wish-text" maxlength="200" required>${escapeHtml(currentText)}</textarea></label>
          <label class="edit-field">
            <span class="edit-label">Место (необязательно)</span>
            <input class="edit-input" type="text" id="wish-place" maxlength="80" value="${escapeHtml(currentPlace)}">
            <span class="edit-hint">Где — например, «Парк Горького».${replacing ? ' Новое желание заменит текущее.' : ''} Через 12 часов желание исчезнет само.</span>
          </label>
          <div class="edit-field">
            <span class="edit-label">Кому видно</span>
            <div class="radio-row">
              <label class="radio-opt"><input type="radio" name="wish-aud" value="all" ${currentAudience === 'all' ? 'checked' : ''}><span class="radio-label">Всем</span></label>
              <label class="radio-opt"><input type="radio" name="wish-aud" value="friends" ${currentAudience === 'friends' ? 'checked' : ''}><span class="radio-label">Только друзьям</span></label>
              <label class="radio-opt"><input type="radio" name="wish-aud" value="group" ${currentAudience === 'group' ? 'checked' : ''}><span class="radio-label">Участникам группы</span></label>
              <label class="radio-opt"><input type="radio" name="wish-aud" value="me" ${currentAudience === 'me' ? 'checked' : ''}><span class="radio-label">Только мне</span></label>
            </div>
          </div>
          <label class="edit-field" id="wish-group-field" style="${currentAudience === 'group' ? '' : 'display:none'}">
            <span class="edit-label">Группа</span>
            <select class="edit-input" id="wish-group">${groupOptions}</select>
          </label>
          <div class="edit-actions">
            <button type="button" class="btn" id="wish-cancel">Отмена</button>
            <button type="submit" class="btn btn-primary">${editing ? 'Сохранить' : 'Опубликовать'}</button>
          </div>
        </form>`;

      const textEl = winBody.querySelector('#wish-text');
      const placeEl = winBody.querySelector('#wish-place');
      const groupField = winBody.querySelector('#wish-group-field');
      const groupEl = winBody.querySelector('#wish-group');
      const syncGroupVisibility = () => {
        const val = winBody.querySelector('input[name="wish-aud"]:checked').value;
        groupField.style.display = (val === 'group') ? '' : 'none';
      };
      winBody.querySelectorAll('input[name="wish-aud"]').forEach((r) => r.addEventListener('change', syncGroupVisibility));
      syncGroupVisibility();
      winBody.querySelector('#wish-cancel').addEventListener('click', goBack);

      winBody.querySelector('#wish-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = textEl.value.trim(); if (!text) { textEl.focus(); return; }
        const place = placeEl.value.trim();
        const audience = winBody.querySelector('input[name="wish-aud"]:checked').value;
        const groupId = audience === 'group' ? (groupEl.value || null) : null;
        const submitBtn = winBody.querySelector('#wish-form [type="submit"]');
        const oldLabel = submitBtn.textContent;
        submitBtn.disabled = true; submitBtn.textContent = 'Сохраняем…';

        let error = null;
        if (editing) {
          const patch = { text, place, coords: null, audience, group_id: groupId };
          // желание прежней версии было привязано к точке — теперь оно становится текущим
          if (Array.isArray(editing.coords)) patch.ts = Date.now();
          ({ error } = await supabaseClient.from('wishes').update(patch).eq('id', editingId));
        } else if (replacing) {
          // текущее желание одно: новое заменяет его
          ({ error } = await supabaseClient.from('wishes').update({
            text, place, coords: null, audience, group_id: groupId, author_name: profile.name, ts: Date.now(),
          }).eq('id', replacing.id));
        } else {
          const id = 'w' + Date.now() + Math.random().toString(36).slice(2, 8);
          ({ error } = await supabaseClient.from('wishes').insert({
            id, author_id: currentUser.id, author_name: profile.name,
            text, place, coords: null, audience, group_id: groupId, ts: Date.now(),
          }));
        }
        submitBtn.disabled = false; submitBtn.textContent = oldLabel;
        if (error) {
          console.warn('[wishes] save:', error.message);
          alert('Не удалось сохранить желание: ' + error.message);
          return;
        }

        await loadWishesFromDB();
        scheduleFeedRender();
        showWishesScreen();
      });
    }, () => showWishesScreen());
  }

  function showAddFriendScreen() {
    setScreen(() => {
      winTitle.textContent = 'Найти друга';

      winBody.innerHTML = `
        <div class="edit-form">
          <label class="edit-field">

          </div>
        </div>
        <div id="search-result"></div>`;

      const input = winBody.querySelector('#search-username');
      const hint = winBody.querySelector('#search-hint');
      const result = winBody.querySelector('#search-result');

      async function trySearch() {
        const v = normalizeUsername(input.value);
        if (!isValidUsername(v)) { hint.classList.add('is-invalid'); hint.textContent = 'Латиница, цифры, «_» и «.», от 3 до 20 символов'; return; }
        hint.classList.remove('is-invalid');
        if (v === normalizeUsername(profile.handle)) { result.innerHTML = `<div class="empty-msg">Это ваш собственный username.</div>`; return; }

        const { data: found, error: sErr } = await supabaseClient.from('profiles').select('*').eq('username', v).maybeSingle();
        if (sErr) { console.error('[search profile]', sErr); }
        if (!found) { result.innerHTML = `<div class="empty-msg">Пользователь <b>@${escapeHtml(v)}</b> не найден.</div>`; return; }
        const relation = await friendRelationWith(found.id);
        const btnLabel = { friend: 'Уже друг', outgoing: 'Запрос отправлен', incoming: 'Принять запрос', none: 'Добавить' }[relation];
        const btnDisabled = relation === 'friend' || relation === 'outgoing';
        result.innerHTML = `
          <ul class="rows"><li class="person-card">
            ${avatarCircleHtml({ name: found.name, avatar: found.avatar }, 40)}
            <div class="person-main">
              <div class="person-name">${escapeHtml(found.name)}</div>
              <div class="person-handle">@${escapeHtml(found.username)}</div>
            </div>
            <button class="friend-add-btn" type="button" data-add-friend="${escapeHtml(found.id)}" ${btnDisabled ? 'disabled' : ''}>${btnLabel}</button>
          </li></ul>`;
      }

      winBody.querySelector('#search-go').addEventListener('click', trySearch);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') trySearch(); });
      winBody.querySelector('#search-cancel').addEventListener('click', goBack);
    }, () => showFriendsScreen());
  }

                </div>
                <div class="group-card" data-group-id="${escapeHtml(g.id)}" role="button" tabindex="0">

        : `<div class="empty-msg">Пока нет групп.<br>Нажмите <b>+</b> в правом верхнем углу, чтобы создать первую.</div>`;
      // приглашения мне — над списком, с кнопками ответа; нажатие на карточку открывает группу
      const invites = myPendingInvites();
      const invHtml = invites.length ? `

      return `

  }

  function bindGroupSwipe() {
    winBody.querySelectorAll('.group-row').forEach((row) => {
      const card = row.querySelector('.group-card'); if (!card) return;
      let startX = 0, startY = 0, dragging = false, decided = false, horizontal = false;
      const THRESHOLD = 6;
      card.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        dragging = true; decided = false; horizontal = false;
        startX = e.clientX; startY = e.clientY;
        try { card.setPointerCapture(e.pointerId); } catch {}
      });
      card.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if (!decided) {
          if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return;
          decided = true; horizontal = Math.abs(dx) > Math.abs(dy);
        }
        if (!horizontal) return;
        if (dx < -20) row.classList.add('revealed');
        else if (dx > 20) row.classList.remove('revealed');
      });
      const endDrag = (e) => { if (!dragging) return; dragging = false; decided = false; try { card.releasePointerCapture(e.pointerId); } catch {} };
      card.addEventListener('pointerup', endDrag);
      card.addEventListener('pointercancel', endDrag);
      card.addEventListener('contextmenu', (e) => { e.preventDefault(); row.classList.toggle('revealed'); });
    });
  }

  // backFn — куда вернуться (по умолчанию — к списку групп; из карточки группы — в карточку)
  function showCreateGroupScreen(editingId = null, backFn = null) {
    setScreen(() => {
      const editing = editingId ? groups.find((g) => g.id === editingId) : null;
      winTitle.textContent = editing ? 'Настройки группы' : 'Новая группа';
      winBody.scrollTop = 0;
      let groupPhoto = editing && editing.photo ? editing.photo : '';
      // В списке — друзья плюс текущие участники группы, которые не в друзьях:
      // иначе при сохранении они бы пропадали из группы
      const existingMembers = editing && editing.members ? editing.members : [];
      // Кому приглашение уже отправлено и ждёт ответа — они тоже отмечены
      const invitedIds = new Set(editing ? pendingInvitesOfGroup(editingId).map((i) => i.toId) : []);
      let selectedIds = new Set([...existingMembers.map((m) => m.id), ...invitedIds]);
      const friendIdSet = new Set(friends.map((f) => f.id));
      const known = [
        ...friends,
        ...existingMembers.filter((m) => !friendIdSet.has(m.id) && m.id !== (currentUser && currentUser.id)),
      ];
      const peopleHtml = known.length
        ? known.map((p) => `
            <li class="person-card" data-person-id="${escapeHtml(p.id)}" role="checkbox" aria-checked="${selectedIds.has(p.id) ? 'true' : 'false'}" tabindex="0">
              <span class="person-check"></span>
              ${avatarCircleHtml(p, 36)}
              <div class="person-main">
                <div class="person-name">${escapeHtml(p.name)}</div>
                <div class="person-handle">${escapeHtml(p.handle || '')}${invitedIds.has(p.id) ? ' · приглашение отправлено' : friendIdSet.has(p.id) ? '' : ' · участник, не в друзьях'}</div>
              </div>
            </li>`).join('')
        : `<li class="gf-empty">Сначала добавьте друзей — их можно будет пригласить.</li>`;

      // Форма — как «Редактировать профиль»: фото группы в спектральной рамке, поля и состав — карточками,
      // кнопки прилипают к низу окна
      winBody.innerHTML = `
        <form class="pe gf" id="group-form" novalidate>
          <section class="gf-hero">
            <button type="button" class="gf-photo" id="group-photo-pick" aria-label="Выбрать фото группы">
              <span class="gx-ava-ring"><span id="group-photo" class="gx-ava" ${groupPhoto ? `style="background-image:url('${safeUrl(groupPhoto)}')"` : ''}>${groupPhoto ? '' : escapeHtml((editing && editing.name ? firstChar(editing.name).toUpperCase() : 'Г'))}</span></span>
              <span class="gf-cam" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.2-1.8h5.4L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.4" r="3.3"/></svg></span>
            </button>
            <div class="gf-photo-acts">
              <span class="gf-hint">${groupPhoto ? 'Нажмите, чтобы сменить фото' : 'Добавьте фото — его увидят в ленте'}</span>
              <button type="button" class="gf-remove" id="group-photo-remove" ${groupPhoto ? '' : 'hidden'}>Удалить фото</button>
            </div>
            <input type="file" id="group-photo-input" accept="image/*" hidden>
          </section>
          <section class="pe-sec">
            <div class="pe-cap"><span>Название</span><span class="pe-count" id="gf-name-count"></span></div>
            <div class="pe-group">
              <label class="pe-field"><span class="pe-label">Как назовёте группу</span><input class="pe-input" type="text" id="group-name" maxlength="60" autocomplete="off" value="${editing ? escapeHtml(editing.name) : ''}" placeholder="Например, «Прогулки по выходным»"></label>
            </div>
          </section>
          <section class="pe-sec">
            <div class="pe-cap"><span>Участники</span><span class="pe-count" id="gf-sel-count"></span></div>
            <ul class="pe-group gf-people" id="group-people">${peopleHtml}</ul>
            <p class="pe-note">Отмеченным придёт приглашение — в группу они вступят, когда примут его. В ленте группа появится, когда в ней будет хотя бы двое. После match с другой группой у вас появится общий чат.</p>
          </section>
          <div class="pe-foot">
            <button type="button" class="btn btn-ghost" id="group-cancel">Отмена</button>
            ${editing ? `<button type="button" class="btn btn-danger" id="group-delete">Удалить</button>` : ''}
            <button type="submit" class="btn btn-primary">${editing ? 'Сохранить' : 'Создать группу'}</button>
          </div>
        </form>`;

      const photoEl = winBody.querySelector('#group-photo');
      const photoInput = winBody.querySelector('#group-photo-input');
      const photoRemove = winBody.querySelector('#group-photo-remove');
      const nameIn = winBody.querySelector('#group-name');
      const paintCounts = () => {
        winBody.querySelector('#gf-name-count').textContent = `${nameIn.value.length} / 60`;
        winBody.querySelector('#gf-sel-count').textContent = known.length ? `выбрано ${selectedIds.size}` : '';
        // без фото в рамке — первая буква названия
        if (!groupPhoto) photoEl.textContent = (firstChar(nameIn.value.trim()) || 'Г').toUpperCase();
      };
      paintCounts();
      nameIn.addEventListener('input', paintCounts);
      const peopleEl = winBody.querySelector('#group-people');

      winBody.querySelector('#group-photo-pick').addEventListener('click', () => photoInput.click());
      photoInput.addEventListener('change', async () => {
        const file = photoInput.files && photoInput.files[0];
        if (!file || !file.type.startsWith('image/')) return;
        try {
          groupPhoto = await fileToCompressedDataURL(file, 256, 0.85);
          photoEl.style.backgroundImage = `url('${groupPhoto}')`; photoEl.textContent = ''; photoRemove.hidden = false;
        } catch (e) { console.warn(e); }
      });
      photoRemove.addEventListener('click', () => { groupPhoto = ''; photoEl.style.backgroundImage = ''; photoRemove.hidden = true; paintCounts(); });

      peopleEl.addEventListener('click', (e) => {
        const card = e.target.closest('[data-person-id]'); if (!card) return;
        const id = card.dataset.personId;
        const isOn = card.getAttribute('aria-checked') === 'true';
        if (isOn) { selectedIds.delete(id); card.setAttribute('aria-checked', 'false'); }
        else {
          // человек уже состоит в другой группе — занят: пригласить его сюда нельзя
          const busy = !invitedIds.has(id) && !existingMembers.some((m) => m.id === id) ? busyGroupOf(id, editingId) : null;
          if (busy) {
            const p = known.find((x) => x.id === id), name = (p && p.name) || 'Этот человек';
            noticeModal({ title: `${name} уже в группе`, text: `${name} сейчас в группе «${busy.name || 'Группа'}» — пригласить в другую группу не получится, пока ${name} в ней.` });
            return;
          }
          selectedIds.add(id); card.setAttribute('aria-checked', 'true');
        }
        paintCounts();
      });

      winBody.querySelector('#group-cancel').addEventListener('click', goBack);

      const delBtn = winBody.querySelector('#group-delete');
      if (delBtn) {
        delBtn.addEventListener('click', async () => {
          const ok = await confirmModal({ title: 'Удалить группу?', text: 'Это действие нельзя отменить.', confirmLabel: 'Удалить' });
          if (!ok) return;
          // группа пропадает сразу, сервер догоняет в фоне; не вышло — она возвращается
          const before = groups;
          optimistic({
            apply() { groups = groups.filter((g) => String(g.id) !== String(editingId)); groupDetailsId = null; showGroupsScreen(); repaintGroupsWorld(); },
            send: () => supabaseClient.from('groups').delete().eq('id', editingId),
            undo() { groups = before; repaintGroupsWorld(); },
            fail: (error) => alert('Не удалось удалить группу: ' + (error.message || error)),
            sync: () => refreshGroupsWorld().then(refreshGroupsList),
          });
        });
      }

      winBody.querySelector('#group-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = winBody.querySelector('#group-name').value.trim();
        if (!name) { winBody.querySelector('#group-name').focus(); return; }
        const members = known.filter((p) => selectedIds.has(p.id));

        // повторные нажатия, пока идёт сохранение, не создают вторую группу
        const form = e.currentTarget;
        if (form.dataset.saving) return;
        form.dataset.saving = '1';
        form.querySelectorAll('button').forEach((b) => { b.disabled = true; });

        const gid = editing ? editingId : 'g' + Date.now() + Math.random().toString(36).slice(2, 6);

        // Меняем состав только по разнице: удаляем участников и отзываем приглашения у тех,
        // с кого сняли галочку; новым отмеченным отправляем приглашение. Остальные не трогаются.
        const memberIds = new Set(existingMembers.map((m) => m.id));
        const removedIds = [...memberIds].filter((id) => !selectedIds.has(id));
        const cancelledIds = [...invitedIds].filter((id) => !selectedIds.has(id));
        const added = members.filter((m) => !memberIds.has(m.id) && !invitedIds.has(m.id));

        // Группа появляется в списке сразу, а на сервер сохраняется в фоне.
        // Новые отмеченные участниками ещё не стали — они числятся приглашёнными
        const localMembers = existingMembers.filter((m) => selectedIds.has(m.id));
        if (editing) groups = groups.map((g) => (g.id === editingId ? { ...g, name, photo: groupPhoto, members: localMembers } : g));
        else groups = [{ id: gid, ownerId: currentUser.id, name, photo: groupPhoto, visibility: 'public', members: localMembers, wish: '', wishAt: null, unionWith: null }, ...groups];
        groupInvites = [
          ...groupInvites.filter((i) => !(i.groupId === String(gid) && cancelledIds.includes(i.toId))),
          ...added.map((m) => ({ id: 'tmp-' + gid + '-' + m.id, groupId: String(gid), fromId: currentUser.id, toId: m.id, status: 'pending' })),
        ];
        if (editing && backFn) { navDir = 'back'; try { backFn(); } finally { navDir = 'fwd'; } } else showGroupsScreen();
        scheduleFeedRender();
        const failed = async (what, error) => {
          console.warn('[groups] ' + what + ':', error.message);
          await refreshGroupsWorld();
          refreshGroupsList();
          alert((editing ? 'Не удалось сохранить группу: ' : 'Не удалось создать группу: ') + error.message);
        };

        if (editing) {
          const { error } = await supabaseClient.from('groups').update({ name, photo: groupPhoto }).eq('id', editingId);
          if (error) { await failed('update', error); return; }
          if (removedIds.length) {
            const { error: rmErr } = await supabaseClient.from('group_members').delete()
              .eq('group_id', editingId).in('user_id', removedIds);
            if (rmErr) console.warn('[group_members] delete:', rmErr.message);
          }
        } else {
          const { error } = await supabaseClient.from('groups').insert({
            id: gid, owner_id: currentUser.id, name, photo: groupPhoto, visibility: 'public',
          });
          if (error) { await failed('insert', error); return; }
        }

        if (cancelledIds.length) {
          const { error } = await supabaseClient.from('group_invites').delete()
            .eq('group_id', gid).eq('status', 'pending').in('to_id', cancelledIds);
          if (error) console.warn('[group_invites] cancel:', error.message);
        }

        // Новым отмеченным — приглашение: в группу они вступят, когда примут его
        let inviteError = null;
        if (added.length) {
          const { error } = await supabaseClient.rpc('send_group_invites', { gid: String(gid), user_ids: added.map((m) => m.id) });
          if (error) { console.warn('[rpc send_group_invites]', error.message); inviteError = error; }
        }

        await refreshGroupsWorld();
        refreshGroupsList();
        if (inviteError) {
          alert('Группа сохранена, но приглашения не отправлены: ' + inviteError.message
            + '\n\nЕсли приглашения ещё не настроены, выполните supabase_group_invites.sql в Supabase.');
        }
      });
    }, backFn || (() => showGroupsScreen()));
  }

  function membersLabel(n) {
    const m10 = n % 10, m100 = n % 100;
    const word = m10 === 1 && m100 !== 11 ? 'участник'
      : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? 'участника' : 'участников';
    return `${n} ${word}`;
  }

  // Лидер первым, затем участники
  function groupPeople(g) {
    const myId = currentUser && currentUser.id;
    const owner = g.ownerId === myId
      ? { id: myId, name: profile.name, handle: profile.handle, avatar: profile.avatar }
      : (friends.find((f) => f.id === g.ownerId) || groupMemberProfiles.get(g.ownerId)
        || (peopleCache.has(String(g.ownerId)) && !peopleCache.get(String(g.ownerId)).missing ? peopleCache.get(String(g.ownerId)) : null)
        || { id: g.ownerId, name: 'Лидер группы', handle: '', avatar: '' });
    return [{ ...owner, id: g.ownerId, leader: true }, ...(g.members || []).filter((m) => m.id !== g.ownerId)];
  }

  // Открытая карточка группы, куда из неё ведёт «назад» (список групп, лента, чат группы) и открыта ли она из чата группы
  let groupDetailsId = null;
  let groupDetailsBack = null;
  let groupDetailsChat = false;
  function reopenGroupDetails() { if (groupDetailsId) showGroupDetailsScreen(groupDetailsId, groupDetailsBack, groupDetailsChat); }

  // Кнопки ответа на входящий запрос match; viewGid — группа, которую можно посмотреть, прежде чем ответить
  function matchResponseButtonsHtml(m, viewGid = null) {
    const id = escapeHtml(m.id);
    return `<div class="notif-actions">
      <button class="btn btn-primary" type="button" data-gm-accept="${id}">Принять match</button>
      <button class="btn" type="button" data-gm-decline="${id}">Отклонить</button>
      ${viewGid ? `<button class="btn" type="button" data-view-group="${escapeHtml(viewGid)}">Посмотреть группу</button>` : ''}
    </div>`;
