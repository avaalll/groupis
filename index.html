  const PALETTE_KEY = 'app.palette';
  const PALETTES = { prism: { label: 'Призма', a: '#7B4DFF', b: '#00B3C7' }, acid: { label: 'Кислота', a: '#C6FF1A', b: '#0A0B08' }, ember: { label: 'Огонь', a: '#FF5B2E', b: '#2A130B' }, frost: { label: 'Иней', a: '#9EDCFF', b: '#0A1A38' } };
  function getPalette() { try { const p = localStorage.getItem(PALETTE_KEY); return PALETTES[p] ? p : 'prism'; } catch { return 'prism'; } }
  function applyPalette() {
    const p = getPalette();
    document.documentElement.setAttribute('data-palette', p);
    if (window.__paletteAssets) window.__paletteAssets(p);
    applyTheme();     // цвет системной панели браузера — по фону схемы
    Globe.tint();
  }
  function setPalette(p) {
    if (!PALETTES[p]) return;
    try { localStorage.setItem(PALETTE_KEY, p); } catch {}
    document.documentElement.classList.add('theme-switching');
    applyPalette();
    setTimeout(() => document.documentElement.classList.remove('theme-switching'), 450);
    document.querySelectorAll('[data-palette-pref]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.palettePref === p)));
  }

  /* ═══════ 3D-АВАТАР ═══════
     Человек собирается в коде, без готовых моделей, с пропорциями взрослого человека (около 7,5 «голов» роста).
     Голова — сфера, которой функция формы придаёт свод черепа, челюсть, скулы, глазницы и подбородок; нос, губы,
     уши, глаза с радужкой, веки с ресницами и брови — отдельные детали. Туловище задано сечениями по высоте
     (грудь, талия, бёдра, лопатки, ягодицы), руки и ноги — трубки с профилем мышц, кисти — с пальцами.
     Одежда — оболочки поверх тела со складками, швами, манжетами, молнией и шнурками; ткани получают
     нарисованные на canvas фактуры (трикотаж, футер, деним, нейлон, кожа, замша), волосы — пряди, которые
     ложатся на голову и плечи. Свет студийный: карта окружения для бликов, мягкие тени, контровой свет.
     Цвета задаются в sRGB и переводятся в линейное пространство, вывод — sRGB с тональной кривой ACES. */
  const AVATAR_KEY = 'avatar.3d.v2';
  const AVATAR_SKINS = {
    porcelain: { base: 0xF6DBC8, label: 'Фарфоровый' },
    light:     { base: 0xEEC5A3, label: 'Светлый' },
    tan:       { base: 0xD8A47C, label: 'Средний' },
    olive:     { base: 0xBA8A5F, label: 'Оливковый' },
    brown:     { base: 0x8E5B3C, label: 'Смуглый' },
    dark:      { base: 0x5B3927, label: 'Тёмный' },
  };
  const AVATAR_HAIR_COLORS = {
    black:    { hex: 0x1E1815, label: 'Чёрные' },
    espresso: { hex: 0x3D2A1E, label: 'Тёмно-каштановые' },
    chestnut: { hex: 0x704529, label: 'Каштановые' },
    blond:    { hex: 0xDAB878, label: 'Блонд' },
    ginger:   { hex: 0xB6562C, label: 'Рыжие' },
    platinum: { hex: 0xE6E0D6, label: 'Платиновые' },
    iris:     { hex: 0x8E78EC, label: 'Ирис' },
  };
  // Одежда: цвет верха и низа. Первые — в цветах «Призмы», дальше прежние
  const AVATAR_CLOTHES = {
    ink:   { body: 0x2A2A33, legs: 0x15151A, label: 'Графит' },
    iris:  { body: 0x6E58E0, legs: 0x22203A, label: 'Ирис' },
    ice:   { body: 0x3FB5C9, legs: 0x1D2440, label: 'Лёд' },
    rose:  { body: 0xE48DAF, legs: 0x2B2C40, label: 'Роза' },
    white: { body: 0xF0EFEB, legs: 0x34466B, label: 'Белый и деним' },
    rust:  { body: 0x8A4A2F, legs: 0x3F2C24, label: 'Ржавчина' },
    olive: { body: 0x4A6B33, legs: 0x2A1E16, label: 'Олива' },
    amber: { body: 0xD9A84A, legs: 0x3F2C24, label: 'Янтарь' },
    dark:  { body: 0x3F2C24, legs: 0x1F1611, label: 'Шоколад' },
  };
  const AVATAR_HAIR_STYLES = {
    male:   { none: 'Нет', buzz: 'Ёжик', short: 'Короткая', quiff: 'Кок', curly: 'Кудри' },
    female: { long: 'Длинные', bob: 'Каре', ponytail: 'Хвост', bun: 'Пучок', curly: 'Кудри' },
  };
  const AVATAR_OUTFITS = {
    male:   { tee: 'Футболка', hoodie: 'Худи', jacket: 'Куртка' },
    female: { tee: 'Топ', dress: 'Платье', hoodie: 'Худи' },
  };
  // Смена фигуры: причёска и одежда, которых у другой фигуры нет, заменяются на похожие
  const AVATAR_HAIR_SWAP = {
    male:   { long: 'short', bob: 'short', ponytail: 'short', bun: 'short' },
    female: { none: 'bob', buzz: 'bob', short: 'bob', quiff: 'bob' },
  };
  const AVATAR_OUTFIT_SWAP = { male: { dress: 'tee' }, female: { jacket: 'tee' } };
  // Старый формат: hair = none | short | long | blond | ginger — стиль и цвет вместе
  const AVATAR_LEGACY_HAIR = {
    none: ['none', 'espresso'], short: ['short', 'espresso'], long: ['long', 'chestnut'],
    blond: ['short', 'blond'], ginger: ['long', 'ginger'],
  };

  function defaultAvatarFor(gender) {
    return gender === 'female'
      ? { gender: 'female', skin: 'light', clothes: 'rose', hair: 'long', hairColor: 'chestnut', outfit: 'dress' }
      : { gender: 'male', skin: 'tan', clothes: 'ink', hair: 'short', hairColor: 'espresso', outfit: 'tee' };
  }

  // Любая конфигурация (своя, чужая, старого формата) → полная и допустимая для своей фигуры
  function normalizeAvatar(raw, genderHint) {
    const src = raw && typeof raw === 'object' ? raw : {};
    const gender = src.gender === 'female' || src.gender === 'male' ? src.gender : (genderHint === 'female' ? 'female' : 'male');
    const cfg = defaultAvatarFor(gender);
    if (AVATAR_SKINS[src.skin]) cfg.skin = src.skin;
    if (AVATAR_CLOTHES[src.clothes]) cfg.clothes = src.clothes;
    let hair = src.hair, color = src.hairColor;
    if (!AVATAR_HAIR_COLORS[color] && AVATAR_LEGACY_HAIR[hair]) [hair, color] = AVATAR_LEGACY_HAIR[hair];
    hair = AVATAR_HAIR_STYLES[gender][hair] ? hair : AVATAR_HAIR_SWAP[gender][hair];
    if (hair) cfg.hair = hair;
    if (AVATAR_HAIR_COLORS[color]) cfg.hairColor = color;
    const outfit = AVATAR_OUTFITS[gender][src.outfit] ? src.outfit : AVATAR_OUTFIT_SWAP[gender][src.outfit];
    if (outfit) cfg.outfit = outfit;
    return cfg;
  }

  // Аватар хранится по аккаунту: у разных людей на одном устройстве — свои
  function avatarStoreKey(uid) { return AVATAR_KEY + ':' + (uid || 'guest'); }
  function loadLocalAvatar(uid) {
    try { const raw = localStorage.getItem(avatarStoreKey(uid)); return raw ? JSON.parse(raw) : null; } catch { return null; }
  }
  function saveAvatarConfig(a) { try { localStorage.setItem(avatarStoreKey(currentUser && currentUser.id), JSON.stringify(a)); } catch {} }
  let avatarConfig = defaultAvatarFor('male');
  // Пока свой аватар не загружен, на сервер его не отправляем — иначе затрём сохранённый
  let avatarConfigReady = false;

  /* Свой аватар после входа: сначала тот, что сохранён на сервере (виден друзьям), потом — на этом
     устройстве, иначе — новый по полу из профиля. Старая конфигурация без пола получает фигуру по профилю. */
  async function loadMyAvatarConfig() {
    if (!currentUser) return;
    const uid = currentUser.id;
    let raw = null;
    try {
      const { data, error } = await supabaseClient.from('user_locations').select('avatar_config').eq('user_id', uid).maybeSingle();
      if (error) console.warn('[avatar] load:', error.message);
      raw = data && data.avatar_config;
    } catch (err) { console.warn('[avatar] load:', err); }
    if (!currentUser || currentUser.id !== uid) return;
    if (!raw || typeof raw !== 'object') raw = loadLocalAvatar(uid);
    avatarConfig = normalizeAvatar(raw, profile.gender);
    avatarConfigReady = true;
    saveAvatarConfig(avatarConfig);
    if (lastUserLocation && settings.geolocation) { placeUserMarker(lastUserLocation); upsertMyLocation(lastUserLocation); }
  }

  /* ── Пропорции ──
     Метры, ступни на y = 0, лицо смотрит в +z. Голова — от центра черепа (headY): skull — полуоси свода,
     jaw — суперэллипсоид челюсти, bumps — рельеф лица [x, y, z, σx, σy, σz, высота, зеркально].
     torso — сечения туловища [y, полуширина, глубина спереди, глубина сзади, сдвиг центра, «квадратность»],
     tbumps — рельеф тела [x, y, сторона (1 — грудь, −1 — спина), σx, σy выше, σy ниже, высота, зеркально, грудь]. */
  function avatarProportions(gender) {
    if (gender === 'female') return {
      fem: true, height: 1.68, headY: 1.574, headZ: 0.008,
      skull: { w: 0.072, top: 0.104, bot: 0.084, front: 0.087, back: 0.098 },
      jaw: { c: [0, -0.043, 0.022], r: [0.0545, 0.068, 0.065], n: 2.35 },
      bumps: [
        [0.029, 0.025, 0.081, 0.02, 0.008, 0.02, 0.0016, 1],     // надбровье
        [0.030, 0.0045, 0.077, 0.0185, 0.0125, 0.02, -0.0145, 1], // глазницы
        [0.051, -0.016, 0.062, 0.017, 0.012, 0.02, 0.0045, 1],   // скулы

        nb.push(avNorm(avCross(d1, [-Math.sin(ps), 0, Math.cos(ps)]))); nm.push(avNorm(avCross(d2, [-Math.sin(ps), 0, Math.cos(ps)])));
      }
      for (const [row, nrms, u] of [[base, nb, [0, 0.55]], [mid, nm, [0.55, 1]]]) {
        items.push({ pts: row.map((o) => o.q), side: row.map((o) => o.d), w: row.map((o) => o.l), n: nrms, u, anchor: 'edge' });
      }
      if (L > 0.001) {
        const lm = new THREE.Mesh(avStrips(THREE, items), lashTex);
        lm.userData.noShadow = true;
        pivot.add(lm);
      }
      return pivot;
    };
    const upLid = mkLid(true), loLid = mkLid(false);
    const bUp = -E.up * Math.PI / 180, bLo = E.lo * Math.PI / 180, bClose = 0.33;
    upLid.rotation.x = bUp; loLid.rotation.x = bLo;
    const car = new THREE.Mesh(new THREE.SphereGeometry(0.0017, 10, 8), M.caruncle);
    car.position.set(-s * r * 0.9, -0.0005, r * 0.36); g.add(car);
    return {
      ball,
      blink(k) { upLid.rotation.x = avMix(bUp, bClose, k); loLid.rotation.x = avMix(bLo, bLo - 0.05, k); },
    };
  }

  // Бровь — лента по надбровью с нарисованными волосками
  function avBrow(THREE, P, H, s) {
    const B = P.brow, n = 10, pts = [], nn = [], w = [], wk = 1.25;
    for (let k = 0; k < n; k++) {
      const t = k / (n - 1), x = s * avMix(0.0112, 0.056, t);
      const y = B.y + B.arch * Math.sin(Math.PI * Math.pow(t, 0.75)) - 0.0045 * t * t;
      const z = H.faceZ(x, y) + 0.0009;
      pts.push([x, y, z]); nn.push(H.normalAt(x, y, z));
      w.push(wk * B.w * (t < 0.15 ? avMix(0.8, 1, t / 0.15) : avMix(1, 0.38, (t - 0.15) / 0.85)));
    }
    return avStrips(THREE, [avStripItem(pts, nn, w, [0, 1], 'center', [0, 1, 0])]);
  }

  // ── Туловище: сечение на высоте y под углом th (0 — спереди, π/2 — к +x) ──
  function avTorsoModel(P) {
    const rows = P.torso, B = [];
    for (const b of P.tbumps) { B.push(b); if (b[7]) B.push([-b[0], ...b.slice(1)]); }
    const tab = rows.map((r) => r.slice());
    const prof = (y) => { const v = avTable(tab, y); return { a: v[0], bf: v[1], bb: v[2], zc: v[3], n: v[4] }; };
    const bustB = B.filter((b) => b[8]);
    const bustAmp = bustB.length ? bustB[0][6] : 0, bustY = bustB.length ? bustB[0][1] : 0;
    function point(y, th, cloth = 0) {
      const p = prof(y), s = Math.sin(th), c = Math.cos(th);
      const x = p.a * avPow(s, 2 / p.n), z = p.zc + (c >= 0 ? p.bf : p.bb) * avPow(c, 2 / p.n);
      let d = 0, bust = 0;
      for (const b of B) {
        const side = b[2] * c;
        if (side < -0.25) continue;
        const ex = (x - b[0]) / b[3], ey = (y - b[1]) / (y > b[1] ? b[4] : b[5]), q = ex * ex + ey * ey;
        if (q > 12) continue;
        const w = b[6] * avStep(-0.25, 0.55, side) * Math.exp(-0.5 * q);
        if (b[8]) bust += w; else d += w;
      }
      if (cloth && bustAmp && c > 0) {   // ткань не повторяет ложбинку и спадает с груди вниз
        const v = y >= bustY ? Math.exp(-0.5 * ((y - bustY) / 0.032) ** 2) : Math.exp(-(((bustY - y) / cloth) ** 2));
        bust = Math.max(bust, 0.88 * bustAmp * Math.exp(-0.5 * (x / 0.078) ** 2) * v * avStep(0, 0.6, c));
      }
      d += bust;
      const l = Math.hypot(x, z - p.zc) || 1;
      return [x + (x / l) * d, y, z + ((z - p.zc) / l) * d];
    }
    function frame(y, th, cloth = 0) {
      const p = point(y, th, cloth), a = point(y, th + 0.004, cloth), b = point(y, th - 0.004, cloth);
      const u = point(y + 0.0015, th, cloth), dn = point(y - 0.0015, th, cloth);
      return { p, n: avNorm(avCross(avSub(a, b), avSub(u, dn))) };
    }
    return { prof, point, frame, y0: rows[0][0], y1: rows[rows.length - 1][0] };
  }

  /* Оболочка туловища (кожа или одежда): столбцы по кругу, строки — от верхнего края yhi(th) до нижнего ylo(th),
     распределённые по длине дуги (плечи сверху получают достаточно строк). open(y) — полуширина выреза спереди
     в радианах (куртка нараспашку); cap — строк дна (оболочка закрывается снизу) */
  function avShell(THREE, T, o) {
    const { cols = 64, rows = 36, ylo, yhi, off = 0, cloth = 0, disp = null, open = null, uv = [8, 16], cap = 0, color = null, drape = null } = o;
    const fy = (f, th) => (typeof f === 'function' ? f(th) : f);
    const thAt = (u, y) => (open ? avMix(open(y), Math.PI * 2 - open(y), u) : Math.PI + u * Math.PI * 2);
    const NS = 56, grid = [];
    for (let i = 0; i <= cols; i++) {
      const u = i / cols;
      let th = thAt(u, 1.2), y1 = fy(yhi, th);
      th = thAt(u, y1); y1 = fy(yhi, th);
      const y0 = fy(ylo, thAt(u, fy(ylo, thAt(u, 1.0))));
      const sm = [];
      let acc = 0, prev = null, env = 0, py = y1;
      for (let k = 0; k <= NS; k++) {
        const y = avMix(y1, y0, k / NS), t2 = thAt(u, y), f = T.frame(y, t2, cloth), e = off + (disp ? disp(t2, y) : 0);
        const p = [f.p[0] + f.n[0] * e, f.p[1] + f.n[1] * e, f.p[2] + f.n[2] * e];
        if (drape) {   // ткань ниже груди свисает, а не облегает талию
          const zc = T.prof(y).zc, r = Math.hypot(p[0], p[2] - zc) || 1e-6;
          env = y > drape.y ? r : Math.max(r, env - drape.slope * (py - y));
          if (env > r) {
            let kk = env / r;
            if (drape.tuck) kk = 1 + (kk - 1) * avStep(y0, y0 + drape.tuck, y);   // низ заправлен в резинку
            p[0] *= kk; p[2] = zc + (p[2] - zc) * kk;
          }
        }
        py = y;
        if (prev) acc += Math.hypot(p[0] - prev[0], p[1] - prev[1], p[2] - prev[2]);
        sm.push({ p, acc, th: t2, y }); prev = p;
      }
      grid.push(sm);
    }
    const pick = (sm, j) => {
      const target = (j / rows) * sm[sm.length - 1].acc;
      let k = 1;
      while (k < sm.length - 1 && sm[k].acc < target) k++;
      const a = sm[k - 1], b = sm[k], t = avClamp((target - a.acc) / ((b.acc - a.acc) || 1));
      return { p: avLerp3(a.p, b.p, t), acc: target, th: avMix(a.th, b.th, t), y: avMix(a.y, b.y, t) };
    };
    const pts = grid.map((sm) => Array.from({ length: rows + 1 }, (_, j) => pick(sm, j)));
    const bottom = pts.map((c) => c[rows]);
    const zc = T.prof(bottom[0].y).zc, cy = bottom.reduce((s, b) => s + b.p[1], 0) / bottom.length - 0.014;
    const total = rows + cap;
    const at = (i, j) => {
      if (j <= rows) return pts[i][j].p;
      const f = (j - rows) / cap, b = bottom[i].p, a = Math.sin(f * Math.PI / 2);
      return [b[0] * (1 - a), avMix(b[1], cy, a), avMix(b[2], zc, a)];
    };
    const geo = avGrid(THREE, cols, total, at, {
      closed: !open, poleBottom: cap > 0,
      uv: (i, j) => [(i / cols) * uv[0], 1 - (j <= rows ? pts[i][j].acc : pts[i][rows].acc + (j - rows) * 0.01) * uv[1]],
      color: color ? (i, j) => { const q = pts[i][Math.min(j, rows)]; return color(q.th, q.y); } : null,
    });
    return { geo, top: pts.map((c) => c[0].p), bottom: bottom.map((b) => b.p), col: (i) => pts[i].map((q) => q.p), pts };
  }

  // ── Руки, кисти, ноги ──
  function avArm(P, s) {
    const S = P.shoulder, Eb = P.elbow, W = P.wrist;
    const sh = [s * S[0], S[1], S[2]], el = [s * Eb[0], Eb[1], Eb[2]], wr = [s * W[0], W[1], W[2]];
    const top = avAdd(sh, avNorm(avSub(sh, el)), 0.045);
    const l0 = avLen(avSub(sh, top)), l1 = avLen(avSub(el, sh)), l2 = avLen(avSub(wr, el)), tot = l0 + l1 + l2, tS = l0 / tot;
    const armT = (tc) => (tc - tS) / (1 - tS);
    // профиль руки: дельта у плеча, бицепс, локоть, мышцы предплечья, сплющенное запястье
    const shape = (tc, extra = 0) => {
      const t = armT(tc), v = avTable(P.armR, avClamp(t)), del = 0.008 * Math.exp(-(((t - 0.03) / 0.08) ** 2));
      return [v[0] + del + extra, v[1] + del * 0.8 + extra, 0.002 * Math.exp(-(((t - 0.3) / 0.15) ** 2)), s * del * 0.45];
    };
    return { pts: [top, sh, el, wr], sh, el, wr, tS, armT, shape, tAt: (t) => tS + t * (1 - tS) };
  }

  function avHand(THREE, P, s, arm, mat, parent, lod) {
    const k = P.hand, down = avNorm(avSub(arm.wr, arm.el));
    const out = avNorm(avSub([s, 0, 0], avScl(down, s * down[0])));
    const fwd = avScl(avNorm(avCross(down, out)), s);
    const W0 = arm.wr;
    const at = (a, b, c) => avAdd(avAdd(avAdd(W0, down, a * k), fwd, b * k), out, c * k);
    const ell = (pos, sx, sy, sz, seg = lod ? 20 : 12) => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(1, seg, Math.round(seg * 0.7)), mat);
      m.matrixAutoUpdate = false;
      m.matrix.makeBasis(new THREE.Vector3(...avScl(out, sx * k)), new THREE.Vector3(...avScl(down, sy * k)), new THREE.Vector3(...avScl(fwd, sz * k)));
      m.matrix.setPosition(pos[0], pos[1], pos[2]);
      parent.add(m);
    };
    ell(at(0.047, 0.002, 0.001), 0.0155, 0.054, 0.043);   // ладонь
    ell(at(0.034, 0.017, -0.006), 0.012, 0.024, 0.014);  // возвышение большого пальца
    const seg = (a, b, r, rb) => parent.add(new THREE.Mesh(avTube(THREE, [a, b], () => [r, r], { cols: lod ? 10 : 6, rows: 2, capA: 3, capB: 3, front: out }).geo, mat));
    if (lod) {
      const fingers = [[0.026, 0.074, 0.0088, 0.9], [0.009, 0.081, 0.0092, 1.0], [-0.009, 0.077, 0.0088, 1.1], [-0.025, 0.061, 0.0078, 1.25]];
      for (const [w, len, r, curl] of fingers) {
        let p = at(0.093 - Math.abs(w) * 0.12, w, 0.002), d = avNorm(avAdd(down, fwd, w * 1.4));
        const parts = [0.47, 0.3, 0.23], bend = [0.25, 0.45, 0.32];
        for (let i = 0; i < 3; i++) {
          const a = bend[i] * curl;
          d = avNorm(avAdd(avScl(d, Math.cos(a)), out, -Math.sin(a)));
          const q = avAdd(p, d, len * parts[i] * k);
          seg(p, q, r * k * (1 - i * 0.1));
          p = q;
        }
      }
    } else ell(at(0.11, 0.0, -0.004), 0.013, 0.04, 0.04);
    let p = at(0.028, 0.024, -0.007), d = avNorm(avAdd(avAdd(avScl(down, 0.72), fwd, 0.55), out, -0.32));
    for (const [len, r] of [[0.036, 0.0105], [0.03, 0.0094]]) {
      const q = avAdd(p, d, len * k);
      seg(p, q, r * k);
      p = q; d = avNorm(avAdd(avScl(d, 0.92), down, 0.38));
    }
  }

  function avLeg(P, s) {
    const hp = [s * P.hip[0], P.hip[1], 0], kn = [s * P.knee[0], P.knee[1], P.knee[2]], an = [s * P.ankle[0], P.ankle[1], P.ankle[2]];
    const top = avAdd(hp, [0, 1, 0], 0.035);
    const l0 = 0.035, l1 = avLen(avSub(kn, hp)), l2 = avLen(avSub(an, kn)), tot = l0 + l1 + l2, tS = l0 / tot;
    const legT = (tc) => (tc - tS) / (1 - tS);
    const shape = (tc, extra = 0) => {
      const t = legT(tc), v = avTable(P.legR, avClamp(t));
      return [v[0] + extra, v[1] + extra, v[2], -s * 0.012 * (1 - avStep(0, 0.3, t))];
    };
    return { pts: [top, hp, kn, an], hp, kn, an, tS, legT, shape, tAt: (t) => tS + t * (1 - tS) };
  }

  /* Обувь строится из сферы: подошва — скруглённый брусок по следу стопы, верх — купол над ней.
     u — поперёк (0 — край, 0,5 — верх), t — от пятки к носку */
  function avFootFrame(P, s) {
    const L = P.foot.len, Wd = P.foot.w, z0 = -0.068 * L / 0.275;
    const halfW = (t) => Wd * 0.5 * (0.72 + 0.1 * avStep(0, 0.35, t) + 0.2 * Math.exp(-(((t - 0.7) / 0.18) ** 2)));
    const endR = (t, a) => { const u = Math.max(0, (Math.abs(2 * t - 1) - a) / (1 - a)); return Math.sqrt(Math.max(0, 1 - u * u)); };
    const cx = (t) => s * 0.006 * Math.sin(Math.PI * t);
    const spring = (t) => 0.011 * Math.pow(avStep(0.8, 1, t), 1.5) + 0.004 * Math.pow(avStep(0.12, 0, t), 2);
    return { L, z0, halfW, endR, cx, spring };
  }
  function avShoe(THREE, P, s, M, parent, lod, kind) {
    const g = new THREE.Group();
    g.position.set(s * P.ankle[0], 0, P.ankle[2]);
    g.rotation.y = s * 0.1;
    parent.add(g);
    const F = avFootFrame(P, s), fem = P.fem, flat = kind === 'flat';
    const hs = flat ? 0.009 : fem ? 0.024 : 0.03;
    const sph = (ws, hsg) => new THREE.SphereGeometry(1, ws, hsg);
    const remap = (geo, fn) => {
      const p = geo.attributes.position, uv = geo.attributes.uv;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i), z = p.getZ(i), rr = Math.hypot(x, y);
        const xs = rr > 1e-6 ? x / rr : 0, ys = rr > 1e-6 ? y / rr : 0, t = (z + 1) / 2;
        const q = fn(xs, ys, t);
        p.setXYZ(i, q[0], q[1], q[2]);
        uv.setXY(i, 0.5 + Math.atan2(xs, ys) / Math.PI, 1 - t);
      }
      geo.computeVertexNormals();
      return geo;
    };
    // подошва (у кроссовок — с тёмным протектором снизу)
    const sole = remap(sph(lod ? 40 : 20, lod ? 16 : 10), (xs, ys, t) => [
      F.cx(t) + avPow(xs, 0.4) * F.halfW(t) * F.endR(t, 0.72), hs * (0.5 + 0.5 * avPow(ys, 0.3)) + F.spring(t), F.z0 + t * F.L,
    ]);
    const sc = [], sp = sole.attributes.position;
    for (let i = 0; i < sp.count; i++) { const k = sp.getY(i) - F.spring(1 - sole.attributes.uv.getY(i)) < hs * 0.22 ? (flat ? 1 : 0.6) : 1; sc.push(k, k, k); }
    sole.setAttribute('color', new THREE.Float32BufferAttribute(sc, 3));
    const sm = new THREE.Mesh(sole, M.sole); g.add(sm);
    const hProf = flat ? [[0, 0.03], [0.2, 0.028], [0.5, 0.028], [0.8, 0.032], [1, 0.024]]
      : [[0, 0.072], [0.18, 0.064], [0.42, 0.084], [0.62, 0.072], [0.82, 0.048], [0.95, 0.036], [1, 0.03]];
    const hk = fem ? 0.9 : 1;
    const upperAt = (xs, ys, t, lift = 0) => {
      const h = avTable(hProf, t)[0] * hk, base = hs - 0.004;
      const y = ys >= 0 ? base + Math.pow(ys, 0.85) * (h - base) : base + ys * 0.003;
      const k = ys >= 0 ? 1 : 1 + ys * 0.05;
      return [F.cx(t) + xs * F.halfW(t) * 0.97 * F.endR(t, 0.76) * k + xs * lift, y + F.spring(t) + Math.max(0, ys) * lift, F.z0 + t * F.L * 0.985];
    };
    if (flat) {
      // стопа и балетка с низкими бортами
      const foot = remap(sph(lod ? 36 : 18, lod ? 18 : 10), (xs, ys, t) => {
        const h = avTable([[0, 0.05], [0.18, 0.1], [0.32, 0.075], [0.55, 0.05], [0.8, 0.03], [1, 0.022]], t)[0];
        const y = ys >= 0 ? 0.008 + Math.pow(ys, 0.8) * (h - 0.008) : 0.008 + ys * 0.003;
        return [F.cx(t) + xs * F.halfW(t) * 0.9 * F.endR(t, 0.74), y + F.spring(t), F.z0 + 0.008 + t * F.L * 0.95];
      });
      g.add(new THREE.Mesh(foot, M.skin));
      const cut = (t) => (t > 0.78 ? 1 : t < 0.12 ? 0.036 : 0.021);
      const shell = remap(sph(lod ? 40 : 20, lod ? 18 : 10), (xs, ys, t) => {
        const q = upperAt(xs, ys, t, 0.0015), lim = cut(t) + F.spring(t);
        if (t <= 0.78) q[1] = Math.min(q[1], lim);
        return q;
      });
      g.add(new THREE.Mesh(shell, M.shoe));
      const bow = new THREE.Mesh(new THREE.SphereGeometry(0.006, 12, 8), M.shoe);
      bow.scale.set(1.6, 0.7, 0.8); bow.position.set(...upperAt(0, 1, 0.79, 0.002)); g.add(bow);
      return;
    }
    const upper = remap(sph(lod ? 48 : 24, lod ? 20 : 12), (xs, ys, t) => upperAt(xs, ys, t));
    g.add(new THREE.Mesh(upper, M.shoe));
    // шнурки крест-накрест между отверстиями
    const eye = (side, k) => {
      const u = 0.5 + side * 0.105, ang = (u - 0.5) * Math.PI;
      return upperAt(Math.sin(ang), Math.cos(ang), 0.45 + k * 0.06, 0.0018);
    };
    const laces = [];
    for (let k = 0; k < 4; k++) {
      laces.push(avTube(THREE, [eye(-1, k), eye(1, k + 1)], () => [0.0021, 0.0016], { cols: 6, rows: 3, capA: 2, capB: 2, front: [0, 1, 0] }).geo);
      laces.push(avTube(THREE, [eye(1, k), eye(-1, k + 1)], () => [0.0021, 0.0016], { cols: 6, rows: 3, capA: 2, capB: 2, front: [0, 1, 0] }).geo);
    }
    laces.push(avTube(THREE, [eye(-1, 4), eye(1, 4)], () => [0.0021, 0.0016], { cols: 6, rows: 3, capA: 2, capB: 2, front: [0, 1, 0] }).geo);
    g.add(new THREE.Mesh(avMerge(THREE, laces), M.lace));
    // кант вокруг щиколотки
    const collar = [];
    for (let k = 0; k <= 12; k++) { const a = Math.PI * (0.18 + 0.64 * (k / 12)); collar.push(upperAt(Math.cos(a), Math.sin(a) * 0.2 + 0.98, 0.02 + 0.16 * Math.sin(a), 0.002)); }
    g.add(new THREE.Mesh(avRing(THREE, collar, 0.0045, false, 20), M.shoe));
  }

  // ── Волосы ──
  // Линия роста волос: азимут (0 — спереди) → полярный угол от макушки, градусы
  const AV_HAIRLINES = {
    male: [[0, 45], [28, 46], [52, 52], [68, 70], [79, 99], [87, 90], [97, 70], [112, 74], [126, 101], [142, 118], [180, 129]],
    female: [[0, 43], [36, 46], [60, 58], [74, 80], [82, 97], [92, 74], [113, 79], [130, 104], [180, 131]],
    top: [[0, 49], [30, 50], [60, 55], [90, 61], [130, 75], [180, 85]],
  };
  function avLine(knots) {
    return (az) => {
      const a = Math.abs(az) * 180 / Math.PI;
      let i = 0;
      while (i < knots.length - 2 && a > knots[i + 1][0]) i++;
      const a0 = knots[i][0], p0 = knots[i][1], a1 = knots[i + 1][0], p1 = knots[i + 1][1], t = avClamp((a - a0) / (a1 - a0));
      return (p0 + (p1 - p0) * (0.5 - 0.5 * Math.cos(Math.PI * t))) * Math.PI / 180;
    };
  }
  /* Шапка волос: лучи из «полюса» (макушка, пробор, резинка хвоста) до линии роста — пряди текстуры
     расходятся из полюса, как настоящие. lift(t, d) — толщина над кожей (t: 0 у полюса, 1 у края) */
  function avHairCap(THREE, H, o) {
    const { pole, line, lift, cols = 72, rows = 20, rep = [6, 2], color = null, jitter = 0.03, seed = 1 } = o;
    const pd = avNorm(pole), ref = Math.abs(pd[1]) < 0.95 ? [0, 1, 0] : [0, 0, 1];
    const e1 = avNorm(avCross(ref, pd)), e2 = avCross(pd, e1);

          const root = cap.point(psi, t0, 0.004), ahead = cap.point(psi, Math.min(1, t0 + 0.08), 0.004);
          let axis = avStrand(root, avSub(ahead, root), { len: 0.24 + 0.08 * rnd(k, 53), seg: 18, stiff: [0.9, 0.6], collide: col, noFace: true, margin: () => 0.022 });
          axis = avCut(axis, -0.21 + 0.03 * rnd(k, 54));
          if (axis.length < 5) continue;
          coils.push(avCoilGeo(THREE, avHelix(avResample(axis, 40), 0.012, 0.007, 0.024, rnd(k, 55) * 6.28), 0.0048, lod));
        }
        for (let i = 0; i < (lod ? 80 : 30); i++) {   // мелкие завитки на макушке
          const psi = rnd(i, 61) * Math.PI * 2, t = Math.sqrt(rnd(i, 62)) * 0.55, root = cap.point(psi, t, -0.001), ax = avNorm(root), axisP = [];
          for (let k = 0; k <= 10; k++) axisP.push(avAdd(root, ax, (k / 10) * (0.016 + 0.01 * rnd(i, 63))));
          coils.push(avCoilGeo(THREE, avHelix(axisP, 0.0062, 0.0048, 0.0072, rnd(i, 64) * 6.28), 0.0026, lod));
        }
        add(avMerge(THREE, coils), M.coil);
      }
    }
    if (cards.length) {
      const items = avCards(cards, (p, k, i) => {
        const ax = cards[i].axis;
        if (!ax) return [0, Math.min(p[1], 0), p[1] < 0 ? -0.012 : 0];
        return ax[Math.min(ax.length - 1, Math.round((k / ((cards[i].n || 12) - 1)) * (ax.length - 1)))];
      });
      add(avStrips(THREE, items), M.card);
    }
    return g;
  }

  // ── Одежда ──
  function avClothes(THREE, P, T, cfg, M, group, lod, mk) {
    const fem = P.fem, outfit = cfg.outfit, extra = [];
    const C = lod ? 1 : 0.55;
    const cols = Math.round(72 * C), rows = Math.round(44 * C);
    const S = (n) => Math.max(6, Math.round(n * C));
    const fold = (th, y, a, k = 7) => a * (0.6 * Math.sin(k * th + 1.3) + 0.4 * Math.sin(2 * k * th + 0.4) + 0.5 * (avNoise(th * 5, y * 30, 0, 0, 3) - 0.5));
    const chest = P.chest;
    // складки футболки: драпировка от груди вниз, у подмышек — косые
    const pantsOff = fem ? 0.0065 : 0.009;
    // ниже пояса футболка всегда поверх джинсов
    const teeFolds = (amp) => (th, y) => fold(th, y, amp * avStep(chest, P.hemTee + 0.02, y)) + (pantsOff + 0.0045) * avStep(P.waist + 0.035, P.waist - 0.005, y)
      + 0.0018 * Math.sin((y - chest) * 120 + Math.abs(th) * 3) * Math.exp(-(((Math.abs(Math.sin(th)) - 0.95) / 0.14) ** 2)) * Math.exp(-(((y - chest) / 0.07) ** 2));
    const neckCurve = (yF, yB, pw = 1.6) => (th) => yB - (yB - yF) * Math.pow(0.5 + 0.5 * Math.cos(th), pw);
    const vNeck = (yF, yB) => (th) => { const a = Math.abs(Math.atan2(Math.sin(th), Math.cos(th))); return yB - (yB - yF) * Math.pow(Math.max(0, 1 - a / 0.95), 1.15) - (yB - yF) * 0.12 * (1 - a / Math.PI); };
    const hemWave = (y0) => (th) => y0 + 0.0035 * Math.sin(4 * th + 0.6) + 0.002 * Math.sin(9 * th);
    const N = P.neck;
    const neckPt = (th, y, e) => [(N.rx + e) * Math.sin(th), y, N.z + (N.rz + e) * Math.cos(th)];
    // воротник-резинка: полоса от выреза вверх, по коже основания шеи
    const ribCollar = (nf, h, off, mat) => {
      const band = avShell(THREE, T, { cols, rows: 5, ylo: (th) => nf(th) - 0.002, yhi: (th) => Math.min(T.y1 - 0.001, nf(th) + h), off, uv: [60, 20],
        disp: (th, y) => 0.0018 * Math.sin(Math.PI * avClamp((y - nf(th)) / h)) });
      mk(band.geo, mat);
      mk(avRing(THREE, band.top.slice(0, -1), 0.0024), mat);
    };
    const lipRing = (pts, r, mat, closed = true) => mk(avRing(THREE, closed ? pts.slice(0, -1) : pts, r, closed), mat);
    // рукав: трубка по руке от плеча до tEnd (доля руки), с подгибкой
    const sleeve = (s, tEnd, ease, mat, o = {}) => {
      const arm = avArm(P, s);
      const t0 = arm.tAt(0.075), t1 = arm.tAt(tEnd);
      const tube = avTube(THREE, arm.pts, (tc) => arm.shape(tc, ease(arm.armT(tc))), {
        t0, t1, cols: S(28), rows: S(o.rows || 18), capA: 8, capScale: 0.95, uv: [6, 18], disp: o.disp ? (tc, th) => o.disp(arm.armT(tc), th) : null,
      });
      mk(tube.geo, mat);
      if (!o.noLip) {
        const ring = [];
        for (let k = 0; k <= 24; k++) ring.push(tube.at(t1, (k / 24) * Math.PI * 2, -0.001));
        lipRing(ring, o.lip || 0.0028, mat);
      }
      return { arm, tube, t1 };
    };
    const cuff = (s, ease, mat) => {
      const arm = avArm(P, s), a = arm.tAt(0.89), b = arm.tAt(1.0);
      const tube = avTube(THREE, arm.pts, (tc) => arm.shape(tc, ease), { t0: a, t1: b, cols: S(24), rows: 4, uv: [24, 4] });
      mk(tube.geo, mat);
      const ring = [];
      for (let k = 0; k <= 20; k++) ring.push(tube.at(b, (k / 20) * Math.PI * 2, -0.0008));
      lipRing(ring, 0.003, mat);
    };
    const pants = () => {
      const legsM = M.denim;
      const pel = avShell(THREE, T, { cols, rows: S(14), ylo: P.crotch + 0.032, yhi: P.waist, off: pantsOff, cap: 4, uv: [12, 16] });
      mk(pel.geo, legsM);
      for (const s of [-1, 1]) {
        const leg = avLeg(P, s), straight = !fem;
        const t1 = leg.tAt(fem ? 0.985 : 1.012), t0 = leg.tAt(0.06);
        const tube = avTube(THREE, leg.pts, (tc) => {
          const t = leg.legT(tc), sh = leg.shape(tc), ease = fem ? avMix(0.006, 0.008, t) : avMix(0.013, 0.02, avStep(0.2, 0.7, t));
          const minR = straight ? avMix(0, 0.061, avStep(0.4, 0.62, t)) : 0;
          return [Math.max(sh[0] + ease, minR), Math.max(sh[1] + ease, minR), sh[2] * (straight ? 1 - avStep(0.45, 0.7, t) : 1), sh[3]];
        }, {
          t0, t1, cols: S(32), rows: S(36), uv: [7, 16], capA: 4, capScale: 0.6,
          disp: (tc, th) => {
            const t = leg.legT(tc);
            return 0.004 * Math.pow(Math.sin((t - 0.9) * 110 + th * 0.8), 2) * avStep(0.9, 0.98, t)
              + 0.0018 * Math.sin(t * 150) * Math.exp(-(((t - 0.52) / 0.05) ** 2)) * (Math.cos(th) < 0 ? 1 : 0.35)
              + 0.0012 * (avNoise(th * 4, t * 40, 0, 0, s + 5) - 0.5);
          },
          color: (tc, th) => {   // потёртости: светлее на бёдрах спереди и на коленях
            const t = leg.legT(tc), fr = Math.pow(Math.max(0, Math.cos(th)), 2);
            const k = 1 + 0.22 * fr * (Math.exp(-(((t - 0.22) / 0.14) ** 2)) + 0.7 * Math.exp(-(((t - 0.5) / 0.06) ** 2)));
            return [k, k, k];
          },
        });
        mk(tube.geo, M.denimVC);
        const ring = [];
        for (let k = 0; k <= 24; k++) ring.push(tube.at(t1, (k / 24) * Math.PI * 2, -0.001));
        lipRing(ring, 0.003, legsM);
        // швы: внутренний двойная строчка, внешний — шов
        const seamPts = (th, e) => { const o = []; for (let k = 0; k <= 16; k++) o.push(tube.at(avMix(0.02, t1 - 0.01, k / 16), th, e)); return o; };
        mk(avRing(THREE, seamPts(-s * Math.PI / 2 + 0.06 * s, 0.0016), 0.00055, false, 48), M.stitch, { shadow: false });
        mk(avRing(THREE, seamPts(-s * Math.PI / 2 - 0.06 * s, 0.0016), 0.00055, false, 48), M.stitch, { shadow: false });
        mk(avRing(THREE, seamPts(s * Math.PI / 2, 0.0012), 0.0009, false, 48), M.seam, { shadow: false });
        // задний карман
        const pk = [[0.17, -0.05], [0.6, -0.05], [0.57, -0.16], [0.38, -0.185], [0.19, -0.16], [0.17, -0.05]].map(([a, dy]) => {
          const f = T.frame(P.waist + dy, Math.PI - s * a), e = pantsOff + 0.0016;
          return avAdd(f.p, f.n, e);
        });
        mk(avRing(THREE, pk, 0.0007, false, 40), M.stitch, { shadow: false });
      }
    };

    if (outfit === 'tee' || outfit === 'jacket') {
      const male = !fem, under = outfit === 'jacket';
      const teeM = under ? M.teeWhite : M.top;
      const nf = male ? neckCurve(1.479, 1.508) : neckCurve(1.335, 1.402, 2.2);
      const tee = avShell(THREE, T, {
        cols, rows, ylo: hemWave(P.hemTee), yhi: nf, off: male ? 0.0055 : 0.0042, cloth: fem ? 0.09 : 0, disp: teeFolds(male ? 0.0022 : 0.0012), uv: [22, 16],
        drape: { y: chest, slope: male ? 0.28 : 0.4 },
      });
      mk(tee.geo, teeM);
      lipRing(tee.bottom, 0.0026, teeM);
      if (male) ribCollar(nf, 0.017, 0.0065, under ? M.ribWhite : M.rib);
      else lipRing(tee.top, 0.0024, M.rib);
      if (!under) for (const s of [-1, 1]) sleeve(s, male ? 0.42 : 0.33, (t) => avMix(0.007, 0.011, avStep(0, 0.4, t)), teeM);
    }
    if (outfit === 'jacket') {
      const open = (y) => 0.24 + 0.1 * avStep(1.28, 1.44, y);
      const puff = (th, y) => 0.0035 * Math.abs(Math.sin(y * 55 + 0.3 * Math.sin(3 * th))) + fold(th, y, 0.0016, 6);
      const body = avShell(THREE, T, { cols, rows, ylo: 1.035, yhi: (th) => 1.505 - 0.075 * Math.pow(0.5 + 0.5 * Math.cos(th), 1.4), off: 0.024, disp: puff, open, uv: [18, 16], drape: { y: chest, slope: 0.12, tuck: 0.035 } });
      mk(body.geo, M.jacket);
      const band = avShell(THREE, T, { cols, rows: S(6), ylo: 0.975, yhi: 1.04, off: 0.019, open, uv: [70, 16], drape: { y: 1.04, slope: 0 } });
      mk(band.geo, M.jRib);
      lipRing(band.bottom, 0.0032, M.jRib, false);
      // воротник-стойка
      const top = body.top, n = top.length - 1;
      const collar = avGrid(THREE, n, 5, (i, j) => {
        const b = top[i], th = Math.atan2(b[0], b[2] - N.z), q = neckPt(th, b[1] + 0.034, 0.012 + 0.006 * (j / 5)), v = j / 5;
        return avAdd(avLerp3(b, q, v), avNorm([b[0], 0, b[2] - N.z]), Math.sin(Math.PI * v) * 0.003);
      }, { uv: (i, j) => [(i / n) * 40, j / 5] });
      mk(avFacing(collar, [0, 0, -1]), M.jRib);
      // молния: тесьма и зубцы вдоль краёв полочек
      const zips = [];
      for (const [ci, sgn] of [[0, 1], [cols, -1]]) {
        const edge = body.col(ci).slice().reverse(), ptsE = [], nrm = [];
        const bandEdge = band.col(ci).slice().reverse();
        const all = [...bandEdge, ...edge.slice(1)];
        for (const p of all) { ptsE.push(p); nrm.push(avNorm([p[0], 0, p[2] - 0.01])); }
        const hint = [sgn, 0, 0];
        zips.push(avStripItem(ptsE, nrm, ptsE.map(() => 0.012), [0, 1], 'center', hint));
      }
      mk(avStrips(THREE, zips), M.zipTape);
      const teeth = zips.map((z) => ({ ...z, pts: z.pts.map((p, k) => avAdd(avAdd(p, z.n[k], 0.0012), z.side[k], -0.0045)), w: z.w.map(() => 0.0042), v: [0, 150] }));
      mk(avStrips(THREE, teeth), M.zipTeeth);
      for (const s of [-1, 1]) {
        sleeve(s, 0.92, () => 0.026, M.jacket, { disp: (t, th) => 0.0035 * Math.pow(Math.sin(t * 45), 2) + 0.002 * Math.sin(t * 90 + th) * avStep(0.45, 0.6, t) * (1 - avStep(0.6, 0.75, t)), noLip: true, rows: 30 });
        cuff(s, 0.01, M.jRib);
      }
      // карман на левом рукаве
      const arm = avArm(P, 1), sl = avTube(THREE, arm.pts, (tc) => arm.shape(tc, 0.026), {});
      const patch = avGrid(THREE, 6, 6, (i, j) => sl.at(arm.tAt(avMix(0.16, 0.34, j / 6)), avMix(0.6, 1.5, i / 6), 0.0035), {});
      mk(avFacing(patch, [1, 0, 0]), M.jacket);
      const zl = []; for (let k = 0; k <= 6; k++) zl.push(sl.at(arm.tAt(0.17), avMix(0.65, 1.45, k / 6), 0.0045));
      mk(avRing(THREE, zl, 0.0011, false, 12), M.zipTeeth, { shadow: false });
      extra.push([0, 1.49, -0.09, 0.05]);
    }
    if (outfit === 'hoodie') {
      const hemTop = fem ? 0.92 : 0.99, hemBot = fem ? 0.855 : 0.925, off = fem ? 0.012 : 0.016;
      const nf = fem ? neckCurve(1.35, 1.405) : neckCurve(1.455, 1.51);
      const folds = (th, y) => fold(th, y, 0.0035 * avStep(chest, hemTop + 0.02, y), 6) + 0.0075 * Math.exp(-(((y - hemTop - 0.018) / 0.018) ** 2))
        + 0.0025 * Math.sin(y * 95 + th * 2) * avStep(hemTop + 0.12, hemTop + 0.02, y);
      const body = avShell(THREE, T, { cols, rows, ylo: hemTop, yhi: nf, off, cloth: fem ? 0.12 : 0, disp: folds, uv: [12, 14], drape: { y: chest, slope: fem ? 0.22 : 0.16, tuck: 0.03 } });
      mk(body.geo, M.fleece);
      const band = avShell(THREE, T, { cols, rows: S(6), ylo: hemBot, yhi: hemTop + 0.006, off: Math.max(off - 0.005, pantsOff + 0.004), cloth: fem ? 0.12 : 0, uv: [70, 16] });
      mk(band.geo, M.hRib);
      lipRing(band.bottom, 0.0035, M.hRib);
      lipRing(band.top, 0.004, M.fleece);
      // карман-«кенгуру»: трапеция с косыми входами
      const py0 = hemTop + 0.006, py1 = hemTop + (fem ? 0.13 : 0.15);
      const pocket = avGrid(THREE, S(16), S(8), (i, j) => {
        const v = j / S(8), y = avMix(py1, py0, v), half = avMix(fem ? 0.42 : 0.46, fem ? 0.6 : 0.66, v), th = avMix(-half, half, i / S(16));
        const f = T.frame(y, th, fem ? 0.12 : 0), e = off + folds(th, y) + 0.0035 + 0.003 * Math.sin(Math.PI * v) * Math.cos(th * 1.5);
        return avAdd(f.p, f.n, e);
      }, {});
      mk(avFacing(pocket, [0, 0, 1]), M.fleece);
      for (const sgn of [-1, 1]) {
        const ed = [];
        for (let k = 0; k <= 8; k++) {
          const v = k / 8, y = avMix(py1, py0, v), th = sgn * avMix(fem ? 0.42 : 0.46, fem ? 0.6 : 0.66, v), f = T.frame(y, th, fem ? 0.12 : 0);
          ed.push(avAdd(f.p, f.n, off + folds(th, y) + 0.0045));
        }
        mk(avRing(THREE, ed, 0.0022, false, 16), M.fleece);
      }
      // капюшон лежит на плечах, внутренняя сторона темнее
      const k = fem ? 0.9 : 1, hy = fem ? 1.37 : 1.462;
      const hoodPts = [[-0.035, hy - 0.016, 0.082], [-0.1, hy + 0.012, 0.012], [-0.082, hy + 0.035, -0.078], [0, hy + 0.05, -0.108], [0.082, hy + 0.035, -0.078], [0.1, hy + 0.012, 0.012], [0.035, hy - 0.016, 0.082]]
        .map(([x, y, z]) => [x * k, y, z * k]);
      const hood = avTube(THREE, hoodPts, (t) => { const r = (0.014 + 0.026 * Math.sin(Math.PI * t) ** 1.3) * k; return [r, r * 0.85]; }, {
        cols: S(20), rows: S(40), capA: 3, capB: 3, front: [0, 1, 0], uv: [4, 10],
        color: (t, th) => { const inner = Math.max(0, -Math.cos(th)) * Math.sin(Math.PI * t); const c = 1 - 0.45 * inner; return [c, c, c]; },
      });
      mk(hood.geo, M.fleeceVC);
      for (let i = 1; i < hoodPts.length - 1; i++) extra.push([hoodPts[i][0], hoodPts[i][1], hoodPts[i][2], 0.03 * k]);
      // шнурки с наконечниками и люверсы
      for (const s of [-1, 1]) {
        const g0 = [s * 0.03 * k, hy - 0.012, 0.09 * k], cord = [g0, [s * 0.034 * k, hy - 0.08, 0.1 * k], [s * 0.036 * k, hy - 0.16, 0.112 * k], [s * 0.034 * k, hy - 0.2, 0.116 * k]];
        const c = cord.map((p) => { const f = T.frame(p[1], Math.atan2(p[0], 0.1), fem ? 0.12 : 0); return [p[0], p[1], Math.max(p[2], f.p[2] + off + 0.006)]; });
        mk(avTube(THREE, c, () => [0.0024, 0.0024], { cols: 6, rows: 10 }).geo, M.cord);
        const end = c[c.length - 1];
        mk(avTube(THREE, [end, avAdd(end, [0, -0.017, 0.001])], () => [0.0031, 0.0031], { cols: 8, rows: 2, capB: 2 }).geo, M.metal);
        const gr = new THREE.Mesh(new THREE.TorusGeometry(0.0045, 0.0014, 6, 14), M.metal);
        gr.position.set(...avAdd(g0, [0, 0, 0.004])); group.add(gr);
      }
      for (const s of [-1, 1]) {
        sleeve(s, 0.9, (t) => avMix(0.02, 0.016, avStep(0.6, 0.9, t)), M.fleece, {
          noLip: true, rows: 30,
          disp: (t, th) => 0.005 * Math.pow(Math.sin(t * 80 + th), 2) * avStep(0.7, 0.88, t) + 0.0025 * Math.sin(t * 60 + th * 2) * Math.exp(-(((t - 0.55) / 0.06) ** 2)),
        });
        cuff(s, 0.0085, M.hRib);
      }
    }
    if (outfit === 'dress') {
      const L = 0.05, bod = avShell(THREE, T, { cols, rows: S(30), ylo: 1.0, yhi: vNeck(1.29, 1.402), off: 0.0042, cloth: L, disp: teeFolds(0.0008), uv: [22, 16] });
      mk(bod.geo, M.top);
      lipRing(bod.top, 0.002, M.top);
      // юбка: по бёдрам, ниже — расклёшенная, со складками
      const yA = 1.035, yH = 0.87, yB = 0.44, sc = Math.round(96 * C), sr = Math.round(40 * C);
      const hipPt = (th) => { const f = T.frame(yH, th, L); return avAdd(f.p, f.n, 0.006); };
      const zc = T.prof(yH).zc;
      const skirt = avGrid(THREE, sc, sr, (i, j) => {
        const th = Math.PI + (i / sc) * Math.PI * 2, v = j / sr;
        const hem = yB + 0.006 * Math.sin(5 * th + 1) + 0.004 * Math.sin(11 * th);
        const y = avMix(yA, hem, v);
        let p;
        if (y >= yH) { const f = T.frame(y, th, L); p = avAdd(f.p, f.n, 0.0055 + 0.001 * Math.sin(th * 9)); }
        else {
          const h = hipPt(th), rr = avNorm([h[0], 0, h[2] - zc]), dn = yH - y;
          const fa = 0.017 * Math.pow(dn / (yH - yB), 1.25) * (0.55 * Math.sin(9 * th + 0.7) + 0.3 * Math.sin(17 * th + 2.1) + 0.15 * Math.sin(31 * th + 0.3));
          const flare = dn * 0.34 + dn * dn * 0.25;
          p = [h[0] + rr[0] * (flare + fa), y, h[2] + rr[2] * (flare + fa)];
          const blend = avStep(yH, yH - 0.05, y);
          if (blend < 1) { const f = T.frame(y, th, L), q = avAdd(f.p, f.n, 0.0055); p = avLerp3(q, p, Math.max(blend, 0)); p[1] = y; }
        }
        return p;
      }, { closed: true, uv: (i, j) => [(i / sc) * 30, 1 - j / sr * 9] });
      mk(skirt, M.skirt);
      const hemPts = [];
      for (let i = 0; i <= sc; i++) { const p = skirt.attributes.position; const k = sr * (sc + 1) + i; hemPts.push([p.getX(k), p.getY(k), p.getZ(k)]); }
      lipRing(hemPts, 0.0022, M.skirt);
      const belt = avShell(THREE, T, { cols, rows: 4, ylo: 1.0, yhi: 1.036, off: 0.0085, cloth: L, uv: [22, 16] });
      mk(belt.geo, M.belt);
      // бант сбоку
      const bf = T.frame(1.018, Math.PI * 0.42, L), bp = avAdd(bf.p, bf.n, 0.012);
      for (const s of [-1, 1]) {
        const loop = new THREE.Mesh(new THREE.TorusGeometry(0.014, 0.0045, 8, 18), M.belt);
        loop.position.set(...avAdd(bp, [0, 0, s * 0.013])); loop.rotation.set(0, Math.PI / 2 - 0.4, s * 0.5); loop.scale.set(1, 0.6, 1); group.add(loop);
        mk(avTube(THREE, [bp, avAdd(bp, [0.006, -0.05, s * 0.012]), avAdd(bp, [0.01, -0.1, s * 0.02])], () => [0.006, 0.0018], { cols: 8, rows: 8, capB: 2 }).geo, M.belt);
      }
      for (const s of [-1, 1]) sleeve(s, 0.3, (t) => avMix(0.009, 0.019, avStep(0, 0.3, t)), M.top);
    }

  /* ── Сборка фигуры ── opts.lod: 'high' — для больших холстов, 'low' — для маркера на карте */
  function buildAvatarGroup(THREE, rawCfg, opts = {}) {
    const cfg = normalizeAvatar(rawCfg);
    const lod = opts.lod === 'low' ? 0 : 1;
    const P = avatarProportions(cfg.gender), fem = P.fem;
    const H = avHeadModel(P), T = avTorsoModel(P);
    const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();
    const mixHex = (a, b, k) => new THREE.Color(a).lerp(new THREE.Color(b), k).getHex();
    const skinHex = AVATAR_SKINS[cfg.skin].base, hairHex = AVATAR_HAIR_COLORS[cfg.hairColor].hex, cloth = AVATAR_CLOTHES[cfg.clothes];
    const lightHair = cfg.hairColor === 'blond' || cfg.hairColor === 'platinum';
    const V2 = (a, b = a) => new THREE.Vector2(a, b);
    const std = (hex, o = {}) => new THREE.MeshStandardMaterial({ color: lin(hex), roughness: 0.8, metalness: 0, ...o });
    const phys = (hex, o = {}) => new THREE.MeshPhysicalMaterial({ color: lin(hex), roughness: 0.8, metalness: 0, ...o });
    const lo = !lod;
    const fabric = (hex, kind, o = {}) => {
      const t = avFabric(THREE, kind, lo);
      return phys(hex, { map: t.map, normalMap: t.normal, normalScale: V2(0.8), roughness: 0.88, sheenTint: lin(mixHex(hex, 0xffffff, 0.5)).multiplyScalar(0.45), envMapIntensity: 0.6, ...o });
    };
    const face = avFaceTex(THREE, P, H, lo), hairT = avHairTex(THREE, lo);
    const M = {};
    M.skin = std(skinHex, { roughness: 0.55, emissive: lin(mixHex(skinHex, 0xFF5030, 0.4)), emissiveIntensity: 0.05, envMapIntensity: 0.55 });
    M.face = M.skin.clone(); M.face.map = face.map; M.face.roughnessMap = face.rough; M.face.roughness = 1;
    M.lid = M.face;
    M.lip = phys(mixHex(skinHex, fem ? 0xB23E55 : 0xA4504E, fem ? 0.55 : 0.44), { roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.3, envMapIntensity: 0.7 });
    M.mouth = std(mixHex(skinHex, 0x4A1E1C, 0.6), { roughness: 0.7 });
    M.nostril = std(mixHex(skinHex, 0x2A1010, 0.82), { roughness: 0.9 });
    M.caruncle = std(mixHex(skinHex, 0xE07A7A, 0.55), { roughness: 0.3 });
    const iris = lightHair ? 0x5C7D9E : cfg.hairColor === 'ginger' ? 0x617846 : (cfg.skin === 'dark' || cfg.skin === 'brown') ? 0x3A2416 : fem ? 0x6B4A2E : 0x553722;
    M.eye = phys(0xffffff, { map: avEyeTex(THREE, iris, lo), roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.03 });
    const browHex = mixHex(hairHex, 0x2A1D16, lightHair ? 0.4 : cfg.hairColor === 'iris' ? 0.55 : 0.12);
    M.brow = std(browHex, { alphaMap: avBrowTex(THREE), alphaTest: 0.3, alphaToCoverage: true, side: THREE.DoubleSide, roughness: 0.75, envMapIntensity: 0.4 });
    M.lash = std(0x130E0C, { alphaMap: avLashTex(THREE), alphaTest: 0.3, alphaToCoverage: true, side: THREE.DoubleSide, roughness: 0.6 });
    M.gold = std(0xE3BE70, { metalness: 1, roughness: 0.25 });
    // волосы, одежда и обувь: материал создаётся при первом обращении — текстуры рисуются только для того, что надето
    const def = (name, make) => { let m = null; Object.defineProperty(M, name, { get: () => m || (m = make()) }); };
    const hairCol = lin(hairHex);
    const hairStd = (o) => { const m = std(hairHex, o); m.color.copy(hairCol); return m; };
    def('cap', () => { const t = hairT.cap; return hairStd({ map: t.map, normalMap: t.normal || null, normalScale: V2(0.6), roughness: 0.68, envMapIntensity: 0.26 }); });
    def('coil', () => M.cap);
    def('card', () => { const t = hairT.card; return hairStd({ map: t.map, alphaMap: t.alpha, normalMap: t.normal || null, normalScale: V2(0.45), alphaTest: 0.4, alphaToCoverage: true, side: THREE.DoubleSide, roughness: 0.7, envMapIntensity: 0.2 }); });
    def('curlVol', () => { const t = hairT.cap; return std(mixHex(hairHex, 0x000000, 0.25), { map: t.map, normalMap: t.normal || null, roughness: 0.55 }); });
    def('buzz', () => { const t = hairT.buzz; return std(hairHex, { map: t.map, normalMap: t.normal || null, normalScale: V2(0.5), roughness: 0.62, vertexColors: true, envMapIntensity: 0.45 }); });
    def('tie', () => std(0x1A1A1E, { roughness: 0.5 }));
    M.hairLin = hairCol; M.skinLin = lin(skinHex);
    const legsHex = cloth.legs, denimSheen = () => lin(mixHex(legsHex, 0xffffff, 0.3)).multiplyScalar(0.25);
    def('top', () => fabric(cloth.body, 'knit'));
    def('rib', () => fabric(mixHex(cloth.body, 0x000000, 0.08), 'rib'));
    def('teeWhite', () => fabric(0xF2F1EC, 'knit'));
    def('ribWhite', () => fabric(0xE6E4DE, 'rib'));
    def('skirt', () => fabric(cloth.body, 'knit', { side: THREE.DoubleSide }));
    def('belt', () => fabric(mixHex(cloth.body, 0x000000, 0.12), 'knit'));
    def('fleece', () => fabric(cloth.body, 'fleece'));
    def('fleeceVC', () => fabric(cloth.body, 'fleece', { vertexColors: true }));
    def('hRib', () => fabric(mixHex(cloth.body, 0x000000, 0.06), 'rib'));
    def('jacket', () => { const t = avFabric(THREE, 'nylon', lo); return std(cloth.body, { map: t.map, normalMap: t.normal, normalScale: V2(0.3), roughness: 0.46, envMapIntensity: 1.0 }); });
    def('jRib', () => fabric(mixHex(cloth.body, 0x000000, 0.18), 'rib'));
    def('zipTape', () => fabric(mixHex(cloth.body, 0x000000, 0.45), 'knit', { side: THREE.DoubleSide }));
    def('zipTeeth', () => { const z = lo ? {} : avZipTex(THREE); return std(0xB8BCC2, { map: z.map || null, normalMap: z.normal || null, metalness: 1, roughness: 0.32, side: THREE.DoubleSide }); });
    def('denim', () => fabric(legsHex, 'denim', { sheenTint: denimSheen(), roughness: 0.92 }));
    def('denimVC', () => fabric(legsHex, 'denim', { vertexColors: true, sheenTint: denimSheen(), roughness: 0.92 }));
    def('stitch', () => std(0xB98A3E, { roughness: 0.75 }));
    def('seam', () => std(mixHex(legsHex, 0x000000, 0.35), { roughness: 0.9 }));
    def('cord', () => fabric(0xF0EEE8, 'knit'));
    def('metal', () => std(0xC9CDD2, { metalness: 1, roughness: 0.28 }));
    const dress = cfg.outfit === 'dress';
    const shoeT = () => (lo ? { map: null, normal: null } : avShoeTex(THREE));
    if (dress) {
      def('shoe', () => phys(0x2A2427, { normalMap: avFabric(THREE, 'leather', lo).normal, roughness: 0.38, clearcoat: 0.4, clearcoatRoughness: 0.25 }));
      def('sole', () => std(0x1E1A1B, { roughness: 0.6, vertexColors: true }));
    } else if (fem) {
      def('shoe', () => { const t = shoeT(); return std(0xF4F2EE, { map: t.map, normalMap: t.normal, roughness: 0.42 }); });
      def('sole', () => std(0xEDEAE4, { roughness: 0.6, vertexColors: true }));
      def('lace', () => fabric(0xF6F5F2, 'knit'));
    } else {
      def('shoe', () => { const t = shoeT(); return phys(0x2F3036, { map: t.map, normalMap: t.normal, normalScale: V2(0.8), roughness: 0.92, sheenTint: lin(0x6A6C74).multiplyScalar(0.5) }); });
      def('sole', () => std(0xF0EEE9, { roughness: 0.6, vertexColors: true }));
      def('lace', () => fabric(0x3A3B40, 'knit'));
    }

    const group = new THREE.Group();
    const mk = (geo, mat, o = {}) => { const m = new THREE.Mesh(geo, mat); if (o.shadow === false) m.userData.noShadow = true; (o.parent || group).add(m); return m; };
    const S = (n) => Math.max(6, Math.round(n * (lod ? 1 : 0.55)));

    // кожа туловища у шеи и в вырезе
    const skinTop = avShell(THREE, T, { cols: S(56), rows: S(16), ylo: fem ? 1.25 : 1.36, yhi: T.y1, uv: [1, 1] });
    mk(skinTop.geo, M.skin);
    // шея (у мужской фигуры — с кадыком)
    const Nk = P.neck;
    const neck = avTube(THREE, [[0, Nk.y0, Nk.z], [0, avMix(Nk.y0, Nk.y1, 0.5), Nk.z + 0.002], [0, Nk.y1, Nk.z + 0.004]], (t, th) => {
      const k = 1 + 0.14 * avStep(0.3, 0, t) - 0.05 * avStep(0.4, 1, t);
      return [Nk.rx * k, Nk.rz * k];
    }, { cols: S(28), rows: S(14), capB: 3, disp: fem ? null : (t, th) => 0.005 * Math.exp(-(((t - 0.45) / 0.09) ** 2)) * Math.pow(Math.max(0, Math.cos(th)), 6) });
    mk(neck.geo, M.skin);
    // руки и кисти
    for (const s of [-1, 1]) {
      const arm = avArm(P, s);
      mk(avTube(THREE, arm.pts, (tc) => arm.shape(tc), { t0: arm.tAt(0.04), t1: 1, cols: S(24), rows: S(30), capA: 4, capScale: 0.35, capB: 3 }).geo, M.skin);
      avHand(THREE, P, s, arm, M.skin, group, lod);
    }
    // ноги (видны у платья) и обувь
    for (const s of [-1, 1]) {
      if (dress) {
        const leg = avLeg(P, s);
        mk(avTube(THREE, leg.pts, (tc) => leg.shape(tc), {
          t0: leg.tAt(0.09), t1: 1, cols: S(28), rows: S(36), capA: 4, capScale: 0.6, capB: 3,
          disp: (tc, th) => { const t = leg.legT(tc); return 0.005 * Math.exp(-(((t - 0.5) / 0.035) ** 2)) * Math.pow(Math.max(0, Math.cos(th)), 4) + 0.003 * Math.exp(-(((t - 0.985) / 0.02) ** 2)) * Math.pow(Math.abs(Math.sin(th)), 6); },
        }).geo, M.skin);
      }
      avShoe(THREE, P, s, M, group, lod, dress ? 'flat' : 'sneaker');
    }
    // одежда
    const extra = avClothes(THREE, P, T, cfg, M, group, lod, mk);

    // голова
    const head = new THREE.Group();
    head.position.set(0, P.headY, P.headZ);

    for (let i = 0; i < hp.count; i++) { const p = H.point(hp.getX(i), hp.getY(i), hp.getZ(i)); hp.setXYZ(i, p[0], p[1], p[2]); }
    hg.computeVertexNormals();
    const nr = hg.attributes.normal, fixRow = (ids) => { let x = 0, y = 0, z = 0; for (const i of ids) { x += nr.getX(i); y += nr.getY(i); z += nr.getZ(i); } const l = Math.hypot(x, y, z) || 1; for (const i of ids) nr.setXYZ(i, x / l, y / l, z / l); };
    for (let j = 0; j <= hs; j++) fixRow([j * (ws + 1), j * (ws + 1) + ws]);
    fixRow(Array.from({ length: ws + 1 }, (_, i) => i)); fixRow(Array.from({ length: ws + 1 }, (_, i) => hs * (ws + 1) + i));

    avLips(THREE, P, H, M, head, lod);
    const eyes = [-1, 1].map((s) => avEye(THREE, P, H, M, s, head, lod));
    for (const s of [-1, 1]) { avEar(THREE, P, H, M, s, head, lod); mk(avBrow(THREE, P, H, s), M.brow, { parent: head, shadow: false }); }

    group.traverse((o) => { if (o.isMesh) { o.castShadow = !o.userData.noShadow; o.receiveShadow = true; } });
    group.userData.head = head;
    group.userData.blink = (k) => eyes.forEach((e) => e.blink(k));
    group.userData.gaze = (t) => {
      let a = 0, b = 0;
      if (t >= 0) { const k = Math.floor(t / 1.9); a = (avHash(k, 1, 3) - 0.5) * 0.16; b = (avHash(k, 2, 3) - 0.5) * 0.1; }
      eyes.forEach((e) => { e.ball.rotation.y = a; e.ball.rotation.x = b; });
    };
    return group;
  }

  // Моргание: раз в несколько секунд, иногда дважды
  function avBlink(t) {
    const per = 4.3, k = Math.floor(t / per), ph = t - k * per - avHash(k, 9, 1) * 1.2;

    return Math.max(one(ph), avHash(k, 8, 1) > 0.75 ? one(ph - 0.38) : 0);
  }

  // Свет «студии»: тёплый основной (с тенями), холодный заполняющий и два контровых в цветах «Призмы»
  function addAvatarLights(THREE, scene, shadows) {
    scene.add(new THREE.HemisphereLight(0xFFFFFF, 0x5E5650, 0.14));
    const key = new THREE.DirectionalLight(0xFFF0E2, 1.3);
    key.position.set(1.4, 3.6, 2.1); key.target.position.set(0, 0.95, 0);
    scene.add(key, key.target);
    if (shadows) {
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.bias = -0.0004; key.shadow.normalBias = 0.006;
    }
    const fill = new THREE.DirectionalLight(0xD5DEFF, 0.2); fill.position.set(-2.6, 1.6, 2.2); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xD8CEFF, 0.5); rim.position.set(-2, 2.8, -3.2); scene.add(rim);
    const rim2 = new THREE.DirectionalLight(0xC2EEF2, 0.32); rim2.position.set(2.4, 1.8, -3); scene.add(rim2);
    return key;
  }
  // Тень основного света — по фигуре целиком или по голове и плечам
  function avAimShadow(key, P, framing) {
    const bust = framing === 'bust', c = key.shadow.camera;
    const ty = bust ? P.headY - 0.1 : P.height * 0.52, half = bust ? 0.32 : 0.62, halfY = bust ? 0.32 : 1.0;
    key.target.position.set(0, ty, 0);
    key.position.set(1.4, ty + 2.65, 2.1);
    c.left = -half; c.right = half; c.top = halfY; c.bottom = -halfY; c.near = 0.5; c.far = 7;
    c.updateProjectionMatrix();
  }
  // Карта окружения: купол (светлый верх, тёмный пол) и софтбоксы — для бликов на глазах, коже, волосах, металле
  function avatarEnvironment(THREE, renderer) {
    const scene = new THREE.Scene();
    const geo = new THREE.SphereGeometry(10, 32, 16), pa = geo.attributes.position, col = [];
    for (let i = 0; i < pa.count; i++) {
      const y = pa.getY(i) / 10, k = y > 0 ? 0.26 + 0.3 * Math.pow(y, 0.6) : 0.26 - 0.2 * Math.pow(-y, 0.5);
      col.push(k * 1.02, k, k * 0.97);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    const panel = (w, h, p, c, k) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide }));
      m.position.set(p[0], p[1], p[2]); m.lookAt(0, 1, 0); scene.add(m);
    };
    panel(3.2, 4.2, [4.2, 6.5, 5], 0xFFF2E6, 5.5);
    panel(4, 3, [-6, 3, 4.5], 0xDCE5FF, 1.6);
    panel(2.2, 5, [-3, 5, -6.5], 0xFFFFFF, 3);
    panel(6, 1.2, [0, 9, 0], 0xFFFFFF, 1.8);
    const pm = new THREE.PMREMGenerator(renderer), rt = pm.fromScene(scene, 0.035);
    pm.dispose();
    scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    return rt;
  }
  // Мягкая тень под ногами — градиент, а не тяжёлые карты теней
  function avatarShadow(THREE) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 2, 64, 64, 63);
    gr.addColorStop(0, 'rgba(0,0,0,0.42)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.16)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.55), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    mesh.rotation.x = -Math.PI / 2; mesh.position.y = 0.002;
    return mesh;
  }
  function makeAvatarRenderer(THREE, canvas, preserve, shadows = true) {
    const r = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: !!preserve });
    r.outputEncoding = THREE.sRGBEncoding;
    r.toneMapping = THREE.ACESFilmicToneMapping;
    r.toneMappingExposure = 1.0;
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    if (shadows) { r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; }
    return r;
  }
  function disposeObject(root) {

      const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
      ms.forEach((m) => {
        for (const k of ['map', 'normalMap', 'alphaMap', 'roughnessMap']) { const t = m[k]; if (t && !t.avShared) t.dispose(); }
        m.dispose();
      });
    });
  }

  /* Сцена с аватаром. framing: 'full' — в полный рост, 'bust' — портрет по плечи.
     Камера к новой точке переезжает плавно (в редакторе — кнопка «крупно»). renderer — для карты окружения и теней */
  function createAvatarScene(THREE, cfg, { framing = 'full', aspect = 1, renderer = null, lod = 'high' } = {}) {
    const scene = new THREE.Scene();
    const shadows = !!(renderer && renderer.shadowMap.enabled);
    const key = addAvatarLights(THREE, scene, shadows);
    scene.add(avatarShadow(THREE));
    let env = null;
    if (renderer) { try { env = avatarEnvironment(THREE, renderer); scene.environment = env.texture; } catch (err) { console.warn('[аватар] окружение:', err); } }
    const camera = new THREE.PerspectiveCamera(30, aspect, 0.05, 30);
    const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), curPos = new THREE.Vector3(), curLook = new THREE.Vector3();
    let group = null, P = null, mode = framing, aimed = false;
    const aim = () => {
      if (mode === 'bust') { camPos.set(0, P.headY - 0.055, 1.02); camLook.set(0, P.headY - 0.088, 0); }
      else { const hh = P.height; camPos.set(0, hh * 0.5 + 0.13, hh * 2.08); camLook.set(0, hh * 0.5 + 0.02, 0); }
      if (!aimed) { curPos.copy(camPos); curLook.copy(camLook); aimed = true; }
      if (shadows) avAimShadow(key, P, mode);
    };
    const setConfig = (c) => {
      if (group) { scene.remove(group); disposeObject(group); }
      group = buildAvatarGroup(THREE, c, { lod });
      P = avatarProportions(normalizeAvatar(c).gender);
      scene.add(group);
