    .menubar { transition: opacity .25s ease, transform .3s var(--ease); }
    .menubar .brand { gap: 8px; padding-right: 6px; }
    .menubar .brand img { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 2px var(--lime); }
    .menubar .brand span { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
    .menubar-right { gap: 2px; }
    #offline-badge {
      font-size: 11.5px; font-weight: 700; color: #fff; background: var(--hot);
      padding: 3px 9px; border-radius: 999px;
    }
    #install-btn {
      font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 999px;
      background: var(--you); color: #fff;
    }
    #install-btn:hover { background: var(--you); filter: brightness(1.1); }
    #fs-btn { width: 34px; height: 34px; border-radius: 50%; color: var(--ink-soft); transition: background .2s, color .2s, transform .25s var(--spring); }
    #fs-btn:hover { background: var(--row-hover); color: var(--you); }
    #fs-btn:active { transform: scale(.88); }

    /* ── Круглые кнопки поверх карты ── */
    .round-btn, #notif-btn, #settings-btn, #filter-btn, .geo-btn {
      width: 46px; height: 46px; border-radius: 50%;
      background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink);
      -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
      box-shadow: 0 10px 28px var(--glass-shadow);
      transition: transform .3s var(--spring), background .2s, color .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }
    #notif-btn, #settings-btn, #filter-btn { top: calc(12px + env(safe-area-inset-top, 0px)); left: auto; }
    #settings-btn { right: max(12px, env(safe-area-inset-right, 0px)); }
    #filter-btn   { right: calc(max(12px, env(safe-area-inset-right, 0px)) + 54px); }
    #notif-btn    { right: calc(max(12px, env(safe-area-inset-right, 0px)) + 108px); }
    .round-btn svg, #notif-btn svg, #settings-btn svg, #filter-btn svg, .geo-btn svg { width: 21px; height: 21px; }
    #notif-btn:hover, #settings-btn:hover, #filter-btn:hover, .geo-btn:hover { transform: translateY(-2px); color: var(--you); }
    #notif-btn:active, #settings-btn:active, #filter-btn:active, .geo-btn:active { transform: scale(.86); transition-duration: .12s; }
    #notif-btn.is-active, #settings-btn.is-active, #filter-btn.is-active, .geo-btn.is-active {
      background: var(--you); color: #fff; border-color: transparent;
      box-shadow: 0 10px 26px rgba(var(--you-rgb), .38);
    }
    #notif-btn .badge {
      top: -3px; right: -3px; min-width: 19px; height: 19px; line-height: 19px; border-radius: 10px;
      background: var(--hot); font-weight: 800; font-size: 10.5px;
      box-shadow: 0 0 0 2.5px var(--land);
    }
    #filter-btn .filter-dot { top: 8px; right: 8px; width: 9px; height: 9px; background: var(--lime); box-shadow: 0 0 0 2px var(--glass); }
    .geo-btn { right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); width: 50px; height: 50px; }

    /* ── Таб-панель ── */
    .dock-wrap { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 0 12px; }
    .dock {
      gap: 4px; padding: 6px; align-items: center;
      border-radius: 999px;
      background: #15131F; border: 1px solid rgba(255, 255, 255, .07);
      -webkit-backdrop-filter: none; backdrop-filter: none;
      box-shadow: 0 18px 44px rgba(6, 12, 10, .38), inset 0 1px 0 rgba(255, 255, 255, .05);
    }
    :root[data-theme="dark"] .dock { background: #1A201E; }
    .dock-item { width: auto; height: auto; }
    .dock-item::after { display: none; }
    .dock-btn {
      display: flex; align-items: center; justify-content: center;
      width: auto; height: 50px; min-width: 50px; padding: 0 14px;
      border-radius: 999px; color: rgba(242, 240, 250, .6);
      transform: none;
      transition: background .35s var(--ease), color .25s, padding .35s var(--ease), transform .3s var(--spring);
    }
    .dock-btn svg { width: 23px; height: 23px; flex: none; filter: none; }
    .dock-btn:hover { color: #fff; }
    .dock-btn:active { transform: scale(.88); transition-duration: .12s; }
    .dock-btn:active svg { filter: none; }
    .dock-btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
    .dock-label {
      max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap;
      font-weight: 800; font-size: 14px; letter-spacing: -0.01em;
      transition: max-width .4s var(--ease), opacity .25s ease, margin .4s var(--ease);
    }
    .dock-item[data-open="true"] .dock-btn { background: var(--lime); color: var(--lime-ink); padding: 0 18px 0 15px; }
    .dock-item[data-open="true"] .dock-label { max-width: 110px; opacity: 1; margin-left: 8px; }
    .tip { display: none !important; }

    /* ── Окно ── */
    .window {
      inset: calc(16px + env(safe-area-inset-top, 0px)) 0 calc(96px + env(safe-area-inset-bottom, 0px)) 0;
      width: min(580px, calc(100% - 24px));
      height: min(680px, calc(100dvh - 116px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
      border-radius: 28px; background: var(--win); border: 1px solid var(--win-line);
      -webkit-backdrop-filter: none; backdrop-filter: none;
      box-shadow: 0 30px 90px rgba(6, 12, 10, .35), 0 0 0 .5px rgba(0, 0, 0, .06);
      transform: translateY(26px) scale(.97);
      transition: opacity .22s ease, transform .45s var(--ease);
    }
    .window.is-open { transform: none; }
    .win-head { height: 62px; padding: 0 12px; grid-template-columns: 46px 1fr 46px; border-bottom: 0; }
    .win-back {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--field); color: var(--ink);
      transition: background .2s, transform .3s var(--spring);
    }
    .win-back:hover { background: var(--row-hover); color: var(--you); }
    .win-back:active { transform: scale(.86); }
    .win-title { font-size: 17px; font-weight: 800; }

    /* ── Списки, строки, карточки ── */
    .rows { padding: 6px 10px 10px; }
    .row, .person-card, .group-card, .chat-row { border-radius: 16px; }
    .row { padding: 12px 14px; }
    .row:hover, .person-card:hover, .chat-row:hover, .chat-row:focus { background: var(--row-hover); }
    .row-name, .person-card .person-name, .chat-row .chat-name, .group-name { font-weight: 700; }
    .chev { color: var(--ink-soft); opacity: .6; font-size: 18px; }
    .avatar, .group-avatar, .notif-icon { box-shadow: none; }
    .notif-icon { border-radius: 14px; }
    .group-avatar, .group-chat-avatar { border-radius: 14px; }
    .notif-unread::before { background: var(--lime); box-shadow: 0 0 0 2px var(--win); width: 8px; height: 8px; margin-top: -4px; }
    .sub-toolbar {
      padding: 4px 16px 10px; border-bottom: 0; background: var(--win);
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
    .sub-toolbar-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 13px;
      background: var(--lime); color: var(--lime-ink);
      box-shadow: 0 6px 16px rgba(var(--lime-rgb), .3);
      transition: transform .3s var(--spring);
    }
    .icon-btn:active { transform: scale(.86); }
    .profile-head { padding: 22px 16px 16px; }
    .profile-name { font-size: 22px; font-weight: 800; }
    .user-profile-name { font-weight: 800; font-size: 22px; }
    .user-profile-section-title, .avatar-group-title { font-weight: 800; letter-spacing: .07em; }
    .empty-msg, .notif-empty, .wish-empty, .places-empty { color: var(--ink-soft); }

    /* ── Кнопки ── */
    .btn {
      border-radius: 14px; padding: 10px 16px; font-weight: 700;
      background: var(--field); color: var(--ink);
      transition: background .2s, transform .3s var(--spring), filter .2s;
    }
    .btn:hover { background: var(--row-hover); }
    .btn:active { transform: scale(.95); transition-duration: .1s; }
    .btn-primary { background: var(--you); color: #fff; box-shadow: 0 8px 20px rgba(var(--you-rgb), .28); }
    .btn-primary:hover { background: var(--you); filter: brightness(1.08); }
    .btn-danger { background: #E5484D; color: #fff; }
    .btn-danger:hover { background: #E5484D; filter: brightness(1.08); }
    .btn-ghost { color: var(--you); }
    .friend-add-btn { border-radius: 12px; padding: 8px 14px; font-weight: 700; background: var(--you); }
    .seg-opt { border-radius: 16px; border-width: 1.5px; font-weight: 700; transition: border-color .2s, background .2s, transform .3s var(--spring); }
    .seg-opt:active { transform: scale(.96); }
    .seg-opt[aria-pressed="true"] { border-color: var(--you); background: var(--row-hover); }
    .switch { width: 46px; height: 28px; border-radius: 14px; background: rgba(120, 116, 150, .35); }
    .switch::after { top: 3px; left: 3px; width: 22px; height: 22px; transition: transform .3s var(--spring); }
    .switch[aria-checked="true"] { background: var(--you); }
    .switch[aria-checked="true"]::after { transform: translateX(18px); }

    /* ── Поля ввода ── */
    .edit-input, .edit-textarea, .username-wrap, .support-chat-input {
      border-radius: 14px; background: var(--field); border: 1.5px solid transparent;
    }
    .edit-input:focus, .edit-textarea:focus, .username-wrap:focus-within, .support-chat-input:focus {
      background: var(--win); border-color: var(--you); box-shadow: 0 0 0 4px rgba(var(--you-rgb), .18);
    }
    .edit-label { font-weight: 700; }
    .people-picker { border-radius: 16px; background: var(--field); border: 0; }

    /* ── Чаты ── */
    .chat-msg { border-radius: 20px; padding: 9px 14px; font-size: 14px; }
    .chat-msg.me { background: var(--you); border-bottom-right-radius: 6px; }
    .chat-msg.them { background: var(--field); border-bottom-left-radius: 6px; }
    .chat-msg.has-media { padding: 4px; }
    .chat-msg-author { color: var(--you); font-weight: 800; }
    .chat-msg.me .chat-msg-author { color: #fff; }
    .support-chat-head { font-weight: 700; }
    .support-chat-form { border-top: 0; padding: 8px 12px 12px; gap: 6px; background: var(--win); }
    .support-chat-input { border-radius: 999px; padding: 11px 16px; }
    .support-chat-send { border-radius: 999px; background: var(--you); transition: transform .3s var(--spring), filter .2s; }
    .support-chat-send:hover { background: var(--you); filter: brightness(1.08); }
    .support-chat-send:active { transform: scale(.88); }
    .chat-composer .support-chat-send { width: 44px; height: 44px; border-radius: 50%; }
    .chat-tool { border-radius: 50%; transition: background .2s, transform .3s var(--spring); }
    .chat-tool:active { transform: scale(.86); }
    .chat-recbar { border-top: 0; }

    /* ── Модальные окна, меню, попапы ── */
    .modal { border-radius: 26px; background: var(--win); -webkit-backdrop-filter: none; backdrop-filter: none; padding: 22px 20px 16px; }
    .modal-title { font-weight: 800; font-size: 17px; }
    .modal-backdrop { background: rgba(6, 12, 10, .5); }
    .popover { border-radius: 18px; background: var(--win); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .popover .pop-item { border-radius: 12px; font-weight: 600; }
    .map-popup { border-radius: 20px; background: var(--win); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .map-popup .pop-img { border-radius: 14px; }
    .post, .wish-card { border-radius: 20px; background: var(--win-2); border-color: var(--win-line); }
    .places-toolbar { background: var(--win); border-bottom: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .view-toggle { border-radius: 14px; background: var(--field); }
    .view-btn { border-radius: 11px; }
    .view-btn[aria-pressed="true"] { background: var(--win); color: var(--you); box-shadow: 0 2px 8px rgba(6, 12, 10, .1); }

    /* ── Маркеры на карте ── */
    .user-badge-inner { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--win); box-shadow: 0 6px 16px rgba(6, 12, 10, .22); }
    .user-badge::after { background: var(--win); }
    .user-badge-status { background: var(--lime); }
    .user-badge-name { font-weight: 700; }

    /* ── Экран входа ── */
    .auth-screen {
      background:
        radial-gradient(1100px 700px at 12% 25%, rgba(var(--you-rgb), .30), transparent 60%),
        radial-gradient(800px 560px at 100% 100%, rgba(var(--lime-rgb), .07), transparent 62%),
        #090C0B;
    }
    .auth-card {
      border-radius: 28px; background: rgba(14, 19, 17, .74);
      border-color: rgba(255, 255, 255, .08);
    }
    .auth-logo { border-radius: 20px; background: linear-gradient(145deg, var(--you-2), var(--you-deep)); box-shadow: 0 12px 28px rgba(var(--you-rgb), .45); }
    .auth-logo-img { border-radius: 50%; box-shadow: 0 0 0 3px var(--lime), 0 14px 30px rgba(0, 0, 0, .45); }
    .auth-title { font-weight: 800; }
    .auth-input { border-radius: 14px; background: rgba(255, 255, 255, .06); border: 1.5px solid transparent; }
    .auth-input:focus { border-color: var(--you); box-shadow: 0 0 0 4px rgba(var(--you-rgb), .22); }
    .auth-btn {
      border-radius: 16px; background: var(--lime); color: var(--lime-ink); font-weight: 800;
      box-shadow: 0 12px 30px rgba(var(--lime-rgb), .22);
      transition: transform .3s var(--spring), filter .2s;
    }
    .auth-btn:hover { filter: brightness(1.05); }
    .auth-btn:active { transform: scale(.96); }
    .auth-link { color: var(--you-soft); }
    .auth-step-dot.active { background: var(--lime); }
    .auth-step-dot.done { background: rgba(var(--lime-rgb), .45); }
    .gender-opt { border-radius: 18px; }
    .gender-opt[aria-pressed="true"] { border-color: var(--lime); background: rgba(var(--lime-rgb), .1); }

    /* ── Телефоны ── */
    @media (max-width: 640px) {
      .menubar { height: 42px; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); padding: 0 4px 0 4px; }
      .menubar .brand img { width: 32px; height: 32px; }
      .menubar .brand span { font-size: 15px; }
      #fs-btn { display: none; }
      .round-btn, #notif-btn, #settings-btn, #filter-btn { width: 42px; height: 42px; }
      #notif-btn, #settings-btn, #filter-btn { top: calc(10px + env(safe-area-inset-top, 0px)); left: auto; }
      #settings-btn { right: max(10px, env(safe-area-inset-right, 0px)); }
      #filter-btn   { right: calc(max(10px, env(safe-area-inset-right, 0px)) + 49px); }
      #notif-btn    { right: calc(max(10px, env(safe-area-inset-right, 0px)) + 98px); }
      .geo-btn { width: 46px; height: 46px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
      .dock-wrap { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
      .dock { gap: 2px; padding: 5px; max-width: calc(100vw - 20px); }
      .dock-btn { height: 48px; min-width: 48px; padding: 0 13px; width: auto; }
      .dock-item { width: auto; height: auto; }
      .dock-item[data-open="true"] .dock-btn { padding: 0 16px 0 13px; }
      .window {
        inset: calc(10px + env(safe-area-inset-top, 0px)) 8px calc(78px + env(safe-area-inset-bottom, 0px)) 8px;
        width: calc(100% - 16px); height: auto;
        max-height: calc(100dvh - 88px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        border-radius: 26px;
      }
      .win-head { height: 56px; padding: 0 10px; grid-template-columns: 44px 1fr 44px; }
      .win-title { font-size: 16px; }
    }
    @media (max-width: 380px) {
      .menubar .brand .brand-wordmark svg { height: 19px; }
      .dock-btn { padding: 0 11px; }
    }
    @media (max-height: 480px) and (orientation: landscape) {
      .menubar { top: calc(8px + env(safe-area-inset-top, 0px)); height: 40px; }
      #notif-btn, #settings-btn, #filter-btn { top: calc(8px + env(safe-area-inset-top, 0px)); width: 40px; height: 40px; }
      #filter-btn { right: calc(max(10px, env(safe-area-inset-right, 0px)) + 48px); }
      #notif-btn  { right: calc(max(10px, env(safe-area-inset-right, 0px)) + 96px); }
      .dock-btn { height: 42px; min-width: 42px; }
      .geo-btn { width: 42px; height: 42px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
      .window { inset: calc(8px + env(safe-area-inset-top, 0px)) 8px calc(64px + env(safe-area-inset-bottom, 0px)) 8px; max-height: none; height: auto; }
    }

    /* ── Фото профиля во всю ширину, листаются (как в Telegram) ── */
    .photo-hero {
      position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: min(62vh, 560px);
      overflow: hidden; background: #090C0B; -webkit-user-select: none; user-select: none;
    }
    .photo-hero.is-many { cursor: pointer; }
    .ph-track {
      display: flex; height: 100%; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
    }
    .ph-track::-webkit-scrollbar { display: none; }
    .ph-slide { flex: 0 0 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; }
    .ph-slide img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .photo-hero::before, .photo-hero::after { content: ''; position: absolute; left: 0; right: 0; pointer-events: none; z-index: 1; }
    .photo-hero::before { top: 0; height: 70px; background: linear-gradient(rgba(8,7,15,.38), transparent); }
    .photo-hero::after { bottom: 0; height: 46%; background: linear-gradient(transparent, rgba(8,7,15,.85)); }
    .ph-bars { position: absolute; top: 10px; left: 12px; right: 12px; z-index: 2; display: flex; gap: 4px; pointer-events: none; }
    .ph-bars span { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.35); transition: background .2s ease; }
    .ph-bars span.is-on { background: #fff; }
    .ph-caption { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 2; color: #fff; pointer-events: none; }
    .ph-name { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; text-shadow: 0 1px 10px rgba(0,0,0,.35); }
    .ph-handle { margin-top: 3px; font-size: 14px; color: rgba(255,255,255,.78); }
    /* Профиль с фото и 3D-аватаром целиком помещается в окно: фото занимает то, что осталось */
    .friend-fit .photo-hero { aspect-ratio: auto; max-height: none; height: clamp(170px, calc(min(680px, 100dvh - 116px) - 372px), 420px); }
    /* блок с аватаром растягивается до нижнего края окна — без пустого места под ним */
    .friend-fit { display: flex; flex-direction: column; min-height: 100%; }
    .friend-fit .photo-hero { flex: none; }
    .friend-fit .user-profile-view { flex: 1; display: flex; flex-direction: column; padding: 12px 16px 16px; gap: 10px; }
    .friend-fit .friend-avatar-card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .friend-fit .user-profile-section-title { margin: 0 0 2px; }
    .friend-fit .friend-avatar-stage { position: relative; display: block; flex: 1; height: auto; min-height: 168px; }
    /* холст подстраивается под высоту блока и не раздувает его */
    .friend-fit .friend-avatar-stage canvas {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: auto; height: min(100%, 240px); aspect-ratio: 1;
    }
    @media (max-width: 640px) {
      .friend-fit .photo-hero { height: clamp(160px, calc(100dvh - 446px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)), 420px); }
    }
    /* Свой профиль: фото + 6 пунктов меню помещаются в окно целиком */
    .me-fit .photo-hero { aspect-ratio: auto; max-height: none; height: clamp(150px, calc(min(680px, 100dvh - 116px) - 396px), 380px); }
    .me-fit.has-bio .photo-hero { height: clamp(150px, calc(min(680px, 100dvh - 116px) - 440px), 380px); }
    .me-fit .ph-bio-own { padding: 10px 18px 0; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    @media (max-width: 640px) {
      .me-fit .photo-hero { height: clamp(150px, calc(100dvh - 462px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)), 380px); }
      .me-fit.has-bio .photo-hero { height: clamp(150px, calc(100dvh - 506px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)), 380px); }
    }
    .profile-bio.ph-bio { text-align: left; margin: 0; }
    .profile-bio.ph-bio-own { padding: 14px 18px 4px; }
    @media (max-width: 640px) {
      .ph-name { font-size: 23px; }
      .ph-caption { left: 16px; bottom: 14px; }
    }

    /* ── Сетка фото в редактировании профиля ── */
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; transition: opacity .2s; }
    .photo-grid.is-busy { opacity: .55; pointer-events: none; }
    .pg-item, .pg-add { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; }
    .pg-item { background: var(--field) center / cover no-repeat; cursor: pointer; }
    .pg-item.is-main { cursor: default; box-shadow: inset 0 0 0 2px var(--you); }
    .pg-badge {
      position: absolute; left: 6px; bottom: 6px; padding: 3px 8px; border-radius: 999px;
      background: var(--lime); color: #15131F; font-size: 10.5px; font-weight: 800;
    }
    .pg-del {
      position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; border: 0; border-radius: 50%;
      display: grid; place-items: center; background: rgba(8,7,15,.62); color: #fff;
      font-size: 16px; line-height: 1; cursor: pointer;
    }
    .pg-del:hover { background: #E5484D; }
    .pg-add {
      display: grid; place-content: center; justify-items: center; gap: 4px;
      border: 1.5px dashed var(--ink-soft); background: transparent; color: var(--ink-soft);
      font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .pg-add:hover { color: var(--ink); border-color: var(--ink); }
    .pg-add svg { width: 22px; height: 22px; }

    /* ── Логотип-надпись Groupis (метка вместо «o») ── */
    .menubar .brand .brand-wordmark { display: block; padding: 0 10px 0 12px; color: var(--ink); line-height: 0; }
    .menubar .brand .brand-wordmark svg { display: block; height: 24px; width: auto; }
    /* «тень» под меткой: на светлой теме лайм почти не виден — там она фиолетовая */
    .brand-wordmark .wm-shadow { fill: #0FA383; opacity: .7; }
    :root[data-theme="dark"] .brand-wordmark .wm-shadow { fill: var(--lime); opacity: 1; }
    .auth-wordmark { display: block; height: 52px; width: auto; max-width: 100%; margin: 2px auto 16px; }
    @media (max-width: 640px) {
      .menubar .brand .brand-wordmark { padding: 0 8px 0 10px; }
      .menubar .brand .brand-wordmark svg { height: 21px; }
    }
    @media (orientation: portrait) { .auth-wordmark { height: 42px; margin-bottom: 12px; } }

    /* Низкий телефон стоя (SE и т. п.): карточке нужно больше места */
    @media (orientation: portrait) and (max-height: 700px) {
      .auth-card { max-height: 60dvh; padding: 16px 16px 14px; }
      .auth-logo, .auth-logo-img { width: 44px; height: 44px; margin-bottom: 6px; }
      .auth-sub { margin-bottom: 10px; }
    }

    /* ═══════════════════ ДИЗАЙН «СИГНАЛ» ═══════════════════
       Группы находят друг друга на карте, как радар. Отсюда два фирменных мотива:
       концентрические «сигнальные кольца» (маркеры групп и ваше место, активная вкладка, пустые экраны)
       и «feat» — два пересекающихся круга (match и союз групп). Цвета минимальны: нейтральная база,
       красно-оранжевый «сигнал» для действий и мятный «сонар» для статусов. */

    :root.theme-switching *, :root.theme-switching *::before, :root.theme-switching *::after {
      transition: background-color .4s ease, border-color .4s ease, color .3s ease, fill .4s ease !important;
    }

    /* ── Прокрутка внутри окна без полосы прокрутки: листается колесом, тачпадом и пальцем ── */
    .window, .window * { scrollbar-width: none; }
    .window ::-webkit-scrollbar, .window::-webkit-scrollbar { width: 0; height: 0; display: none; }

    .scrim { background: rgba(6, 12, 10, .38); }
    :root[data-theme="dark"] .scrim { background: rgba(0, 0, 0, .5); }

    /* ── Таб-панель: тёмная «капсула», активная вкладка светлая с сигнальной точкой ── */
    .dock, :root[data-theme="dark"] .dock { background: var(--dock); border-color: rgba(255, 255, 255, .06); }
    .dock { box-shadow: 0 18px 44px rgba(6, 12, 10, .3), inset 0 1px 0 rgba(255, 255, 255, .05); }
    .dock-btn { color: var(--dock-ink); position: relative; }
    .dock-btn:hover { color: var(--dock-on); }
    .dock-btn:focus-visible { outline-color: var(--you); }
    .dock-item[data-open="true"] .dock-btn { background: var(--dock-on); color: var(--dock-on-ink); }
    .dock-item[data-open="true"] .dock-btn::after {
      content: ""; position: absolute; left: 33px; top: 11px; width: 7px; height: 7px; border-radius: 50%;
      background: var(--you); box-shadow: 0 0 0 2px var(--dock-on);
      animation: dock-ping 2.6s ease-out infinite;
    }
    @keyframes dock-ping {
      0%   { box-shadow: 0 0 0 2px var(--dock-on), 0 0 0 2px rgba(var(--you-rgb), .55); }
      70%  { box-shadow: 0 0 0 2px var(--dock-on), 0 0 0 9px rgba(var(--you-rgb), 0); }
      100% { box-shadow: 0 0 0 2px var(--dock-on), 0 0 0 9px rgba(var(--you-rgb), 0); }
    }
    @media (max-width: 640px) { .dock-item[data-open="true"] .dock-btn::after { left: 31px; top: 10px; } }

    /* ── Круглые кнопки поверх карты: активная — «чернилами» ── */
    #notif-btn.is-active, #settings-btn.is-active, #filter-btn.is-active, .geo-btn.is-active {
      background: var(--ink); color: var(--win); box-shadow: 0 10px 26px var(--glass-shadow);
    }
    #notif-btn:hover, #settings-btn:hover, #filter-btn:hover, .geo-btn:hover { color: var(--you); }
    #notif-btn .badge { background: var(--you); }
    #filter-btn .filter-dot { background: var(--you); }
    .geo-btn { color: var(--ink); }

    /* ── Акцентные элементы ── */
    .icon-btn { background: var(--you); color: #fff; box-shadow: 0 8px 18px rgba(var(--you-rgb), .32); }
    .notif-unread::before { background: var(--you); }
    .switch[aria-checked="true"] { background: var(--lime-deep, #0FA383); }
    :root[data-theme="dark"] .switch[aria-checked="true"] { background: var(--lime); }
    :root[data-theme="dark"] .switch[aria-checked="true"]::after { background: #0B0F0D; }
    .seg-opt[aria-pressed="true"] { border-color: var(--ink); background: var(--field); }
    .pg-badge { background: var(--you); color: #fff; }
    .pg-item.is-main { box-shadow: inset 0 0 0 2px var(--you); }
    .edit-input:focus, .edit-textarea:focus, .username-wrap:focus-within, .support-chat-input:focus { box-shadow: 0 0 0 4px rgba(var(--you-rgb), .16); }
    .user-badge-status, .user-badge-status[aria-hidden] { background: var(--lime); }
    .avatar-online, .online-dot { background: var(--lime) !important; }

    /* ── Маркеры: друг из общей группы — мятная плашка, участник чужой группы — «чернильная» ── */
    .user-badge-inner.is-friend-group { background: rgba(8, 104, 85, .95); border-color: rgba(var(--lime-rgb), .5); }
    .user-badge-inner.is-friend-group .user-badge-group { color: #BFFBEA; }
    .user-dot-marker.is-friend-group { background: #0A6E5A !important; }
    .user-badge-inner.is-group { background: rgba(14, 20, 18, .94); border-color: rgba(var(--you-rgb), .5); }
    .user-badge-inner.is-group .user-badge-group { color: var(--you-soft); }
    .user-dot-marker.is-group { background: #0E1412 !important; }
    .map-group-chip { background: rgba(14, 20, 18, .95); border-color: rgba(var(--lime-rgb), .45); }
    .map-group-count { color: #BFFBEA; }
    .user-badge.is-leader::after { background: #0E1412; border-color: rgba(var(--lime-rgb), .45); }
    .user-dot-marker.is-leader { background: #0E1412 !important; box-shadow: 0 0 0 2px var(--lime), 0 2px 6px rgba(0,0,0,.35); }

    /* «Сигнальные кольца» на земле под маркером (сплющены — как будто лежат на карте) */
    .user-avatar-wrap { isolation: isolate; }
    .signal-rings { position: absolute; left: 50%; bottom: 1px; width: 0; height: 0; z-index: -1; pointer-events: none; }
    .signal-rings i {
      position: absolute; left: -30px; top: -11px; width: 60px; height: 22px; border-radius: 50%;
      border: 2px solid var(--ring, var(--you));
      opacity: 0; transform: scale(.25);
      animation: signal-ring 3s cubic-bezier(.15, .6, .3, 1) infinite;
    }
    .signal-rings i:nth-child(2) { animation-delay: 1.5s; }
    .signal-rings.is-group { --ring: var(--lime); }
    .signal-rings.is-me i { border-width: 1.5px; }
    @keyframes signal-ring {
      0%   { opacity: .95; transform: scale(.25); }
      100% { opacity: 0;   transform: scale(1.5); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal-rings i { animation: none; opacity: .45; transform: scale(.9); }
      .signal-rings i:nth-child(2) { display: none; }
      .dock-item[data-open="true"] .dock-btn::after { animation: none; }
    }

    /* ── Знак «feat»: две группы, линза пересечения — их общий чат / союз ── */
    .match-chat-avatar { background: var(--field) !important; padding: 0; overflow: hidden; }
    .feat-mark { width: 100%; height: 100%; display: block; }
    .feat-mark .fa { fill: var(--you); }
    .feat-mark .fb { fill: var(--lime); }
    .feat-mark .fx { fill: var(--ink); }
    .feat-mark.is-open .fx { animation: feat-pulse 1.6s ease-in-out infinite; }
    .feat-mark.is-approved .fx { fill: var(--win); }
    @keyframes feat-pulse { 50% { opacity: .35; } }

    /* ── Пустые экраны: маленький «радар» над текстом ── */
    .empty-msg::before, .notif-empty::before {
      content: ""; display: block; width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 50%;
      background:
        radial-gradient(circle, var(--you) 0 4px, transparent 4.5px),
        repeating-radial-gradient(circle, transparent 0 9px, rgba(var(--you-rgb), .28) 9.5px 10.5px, transparent 11px 17px);
      opacity: .9;
    }

    /* ── Выбор темы в настройках ── */
    .theme-block { display: grid; gap: 10px; padding: 8px 20px 6px; }
    .theme-head { display: grid; gap: 2px; }
    .theme-head .row-name { font-weight: 700; }
    .theme-head .row-sub { color: var(--ink-soft); font-size: 12.5px; }
    .theme-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .theme-opt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; font-size: 13px; }
    .theme-opt svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .theme-opt svg .fill { fill: currentColor; stroke: none; }
    .theme-opt[aria-pressed="true"] { color: var(--ink); }
    .theme-opt[aria-pressed="true"] svg { color: var(--you); }

    /* ── Экран входа: хвойно-чёрный фон с мягким сигнальным свечением и кольцами ── */
    .auth-screen {
      background:
        radial-gradient(900px 640px at 14% 22%, rgba(var(--you-rgb), .16), transparent 60%),
        radial-gradient(760px 560px at 100% 100%, rgba(var(--lime-rgb), .08), transparent 62%),
        #090C0B;
    }
    .auth-screen::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
      background: repeating-radial-gradient(circle at 14% 22%, transparent 0 58px, rgba(255, 255, 255, .035) 59px 60px);
      -webkit-mask-image: radial-gradient(900px 700px at 14% 22%, #000, transparent 70%);
      mask-image: radial-gradient(900px 700px at 14% 22%, #000, transparent 70%);
    }
    .auth-card { background: rgba(14, 19, 17, .78); border-color: rgba(255, 255, 255, .08); }
    .auth-btn { background: var(--you); color: #fff; box-shadow: 0 12px 30px rgba(var(--you-rgb), .32); }
    .auth-link { color: #9FF3DE; }
    .auth-input:focus { border-color: var(--you); box-shadow: 0 0 0 4px rgba(var(--you-rgb), .2); }
    .auth-step-dot.active { background: var(--you); }
    .auth-step-dot.done { background: rgba(var(--you-rgb), .45); }
    .gender-opt[aria-pressed="true"] { border-color: var(--you); background: rgba(var(--you-rgb), .1); }

    /* ═══════════════════ ЭКРАН ВХОДА: ГЛОБУС В ЦЕНТРЕ ═══════════════════
       Глобус — главная фигура сцены, под ним логотип. Карточка появляется прямо у активного крестика
       (сторону выбирает JS — так, чтобы не закрыть пунктир) и сворачивается обратно в него.
       Координаты глобуса приходят из JS: --gx/--gy — центр, --logo-y/--logo-h — логотип. */
    .auth-screen {
      display: block; padding: 0;
      background:
        radial-gradient(60vmax 50vmax at var(--gx, 50%) var(--gy, 45%), rgba(var(--lime-rgb), .075), transparent 62%),
        radial-gradient(80vmax 60vmax at 0% 0%, rgba(var(--you-rgb), .09), transparent 60%),
        radial-gradient(70vmax 60vmax at 100% 100%, rgba(var(--you-rgb), .05), transparent 60%),
        #070A09;
      transition: opacity 1s cubic-bezier(.4, 0, .2, 1);
    }
    .auth-screen::before {
      background: repeating-radial-gradient(circle at var(--gx, 50%) var(--gy, 45%), transparent 0 58px, rgba(255, 255, 255, .03) 59px 60px);
      -webkit-mask-image: radial-gradient(circle at var(--gx, 50%) var(--gy, 45%), #000 25%, transparent 72%);
      mask-image: radial-gradient(circle at var(--gx, 50%) var(--gy, 45%), #000 25%, transparent 72%);
      opacity: 0; transition: opacity 1.4s ease;
    }
    .auth-screen.is-ready::before { opacity: .6; }
    /* Влёт в карту: экран заволакивает светлыми «облаками» (карта под ними светлая — без вспышки) */
    .auth-screen::after {
      background: radial-gradient(circle at 50% 50%, #F7F8F5 0%, #E8ECE5 55%, #DCE2DA 100%);
      transition: opacity .9s cubic-bezier(.4, 0, .2, 1);
    }
    .globe-canvas { opacity: 0; transition: opacity 1.1s ease; }
    .auth-screen.is-ready .globe-canvas { opacity: 1; }
    .auth-globe-logo {
      position: absolute; z-index: 1; left: var(--gx, 50%); top: var(--logo-y, calc(100% - 90px));
      height: var(--logo-h, 44px); width: auto; max-width: 80vw;
      transform: translate(-50%, 10px); opacity: 0;
      pointer-events: none; -webkit-user-select: none; user-select: none;
      transition: opacity .9s ease .35s, transform 1.2s var(--ease) .35s;
    }
    .auth-screen.is-ready .auth-globe-logo { opacity: 1; transform: translate(-50%, 0); }
    .auth-screen.is-flying .auth-globe-logo { opacity: 0; transform: translate(-50%, 10px); transition: opacity .4s ease, transform .5s ease; }

    .auth-card {
      --cw: 350px;
      position: absolute; left: 50%; top: 50%; z-index: 3; margin: 0;
      width: min(var(--cw), calc(100vw - 24px));
      max-height: calc(100dvh - 24px);
      padding: 22px 22px 18px;
      border-radius: 24px;
      /* без backdrop-filter: размытие поверх 3D пересчитывается каждый кадр и даёт подлагивания */
      background: rgba(12, 17, 15, .94);
      -webkit-backdrop-filter: none; backdrop-filter: none;
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .05);
      will-change: transform, opacity;
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    }
    .auth-card[data-size="sm"] { --cw: 310px; }
    .auth-card[data-size="md"] { --cw: 350px; }
    .auth-card .auth-title { font-size: 20px; margin-bottom: 4px; }
    .auth-card .auth-sub { margin-bottom: 16px; }
    .auth-card .auth-step-title { font-size: 16px; }
    .auth-card .auth-step-sub { margin-bottom: 14px; }
    .auth-eyebrow {
      text-align: center; margin: 0 0 8px;
      font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: #9FF3DE;
    }
    .auth-card .auth-steps { margin-bottom: 12px; }
    .auth-card .auth-step-dot { width: 22px; }
    .auth-card[data-size="sm"] .auth-step-dot { width: 18px; }
    @media (max-width: 420px) {
      .auth-card { padding: 18px 16px 14px; border-radius: 22px; }
      .auth-card .auth-title { font-size: 18px; }
    }

    /* ═══════════════════ ДИЗАЙН «ПРИЗМА» ═══════════════════
       Основа — чистые нейтральные: графит в тёмной теме, фарфор в светлой. Цвет один — «спектр»:
       луч света, разложенный призмой (аква → синий → фиолетовый → орхидея). Он появляется там,
       где что-то происходит: активная вкладка, переключатели, своё место на карте, облака желаний,
       тонкое кольцо-всплеск из точки каждого нажатия. Главные кнопки — «чернильные»: чёрные
       на светлом, белые на тёмном. Блок стоит последним и переопределяет прежние темы. */
    @property --sweep { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

    :root {
      color-scheme: light;
      --c1: #00B3C7; --c2: #3D6BFF; --c3: #7B4DFF; --c4: #E0479E;
      --prism: linear-gradient(115deg, var(--c1) 0%, var(--c2) 34%, var(--c3) 66%, var(--c4) 100%);
      --prism-conic: conic-gradient(from 210deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c1));
      --prism-glow: -10px 10px 26px -12px var(--c1), 10px 10px 26px -12px var(--c4), 0 14px 26px -14px var(--c3);
      --prism-ink: #FFFFFF;
      --act: #111114; --act-ink: #FFFFFF;
      --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      --land: #EDECE9;
      --you: #6B4DFF; --you-rgb: 107, 77, 255; --you-2: #00B3C7; --you-deep: #6B4DFF; --you-soft: #B9A9FF;
      --lime: #00B3C7; --lime-rgb: 0, 179, 199; --lime-deep: #00899A; --lime-ink: #002A30;
      --hot: #F03E6E;
      --glass: rgba(251, 251, 250, .8); --glass-edge: rgba(17, 17, 20, .07); --glass-shadow: rgba(22, 22, 34, .16);
      --bar: rgba(251, 251, 250, .8);
      --ink: #111114; --ink-soft: #6D6D77;
      --win: #FBFBFA; --win-2: #F3F2F0; --win-line: rgba(17, 17, 20, .08);
      --row-hover: rgba(17, 17, 20, .045); --field: rgba(17, 17, 20, .05);
      --tip: rgba(17, 17, 20, .92); --tip-ink: #F3F3F5;
      --rim: rgba(255, 255, 255, .95);          /* световой кант по верхнему краю поверхностей */
      --me-card: rgba(255, 255, 255, .12);      /* карточка файла в своём сообщении */
      --ease: cubic-bezier(.16, 1, .3, 1);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --c1: #4FE3EE; --c2: #7C9CFF; --c3: #A98CFF; --c4: #FF8FD8;
      --prism-ink: #0B0B0E;
      --act: #F3F3F5; --act-ink: #0B0B0E;
      --land: #0B0B0E;
      --you: #9A80FF; --you-rgb: 154, 128, 255; --you-2: #4FE3EE; --you-deep: #8A6CFF; --you-soft: #CABDFF;
      --lime: #4FE3EE; --lime-rgb: 79, 227, 238; --lime-deep: #22B5C2; --lime-ink: #04191C;
      --hot: #FF5C85;
      --glass: rgba(22, 22, 27, .8); --glass-edge: rgba(255, 255, 255, .08); --glass-shadow: rgba(0, 0, 0, .55);
      --bar: rgba(22, 22, 27, .8);
      --ink: #F3F3F5; --ink-soft: #8C8C97;
      --win: #121216; --win-2: #18181D; --win-line: rgba(255, 255, 255, .075);
      --row-hover: rgba(255, 255, 255, .05); --field: rgba(255, 255, 255, .06);
      --tip: rgba(243, 243, 245, .94); --tip-ink: #0B0B0E;
      --rim: rgba(255, 255, 255, .07);
      --me-card: rgba(0, 0, 0, .07);
    }
    body { background: var(--land); }

    /* ── Шрифты: заголовки — Unbounded, мелкие подписи — моноширинные, «как на дисплее» ── */
    .win-title, .ph-name, .profile-name, .user-profile-name, .modal-title, .auth-title, .auth-step-title {
      font-family: var(--font-display); font-weight: 600; letter-spacing: -0.015em;
    }
    .win-title { font-size: 15px; }
    .ph-name { font-size: 22px; letter-spacing: -0.02em; }
    .profile-name, .user-profile-name { font-size: 19px; }
    .modal-title { font-size: 15px; }
    .sub-toolbar-title, .wish-section-title, .user-profile-section-title, .avatar-group-title, .edit-label, .auth-label, .auth-eyebrow {
      font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase;
    }
    .sub-toolbar-title, .wish-section-title, .user-profile-section-title, .avatar-group-title, .edit-label { color: var(--ink-soft); }
    .sub-toolbar-title::before, .wish-section-title::before, .user-profile-section-title::before {
      content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 9px 1px 0; border-radius: 2px;
      background: var(--prism); vertical-align: middle;
    }
    .row-time, .chat-row .chat-time, .chat-msg .chat-msg-time, .mv-count { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .02em; }

    /* ── Окно: раскрывается из нажатой кнопки, по краю пробегает спектр; сверху — тонкий световой штрих ── */
    .window {
      border-radius: 30px; background: var(--win); border: 1px solid var(--win-line);
      box-shadow: 0 40px 100px -24px rgba(8, 8, 14, .5), inset 0 1px 0 var(--rim);
      transform: translateY(36px) scale(.9);
      transition: opacity .3s ease, transform .64s var(--ease);
    }
    .window:not(.is-open) { transition: opacity .22s ease, transform .3s cubic-bezier(.5, 0, .75, 0); }
    .window.is-open { transform: none; }
    .window::before {
      content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none; border-radius: inherit;
      padding: 2px; opacity: 0;
      background: conic-gradient(from var(--sweep), transparent 0turn, var(--c1) .07turn, var(--c2) .17turn, var(--c3) .27turn, var(--c4) .37turn, transparent .48turn, transparent 1turn);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }
    .window.sweep::before { animation: edge-sweep 1.35s cubic-bezier(.3, .6, .3, 1) .06s both; }
    @keyframes edge-sweep {
      0% { opacity: 0; --sweep: -40deg; }
      14% { opacity: 1; }
      72% { opacity: 1; }
      100% { opacity: 0; --sweep: 330deg; }
    }
    .window::after {
      content: ""; position: absolute; top: 0; left: 20%; right: 20%; height: 1px; z-index: 6; pointer-events: none;
      background: var(--prism); opacity: .7;
      -webkit-mask: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
              mask: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
    }
    .win-head { height: 60px; }
    .win-back { width: 40px; height: 40px; border-radius: 50%; background: var(--field); color: var(--ink); }
    .win-back:hover { background: var(--row-hover); color: var(--ink); }
    .win-back svg { width: 20px; height: 20px; }
    /* заголовок «расшифровывается»: буквы перебираются и встают на место (текст в DOM при этом не меняется) */
    .win-title { position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .win-title.is-scrambling { color: transparent; }
    .win-title.is-scrambling::after {
      content: attr(data-scramble); position: absolute; inset: 0; color: var(--ink);
      white-space: nowrap; overflow: hidden;
    }

    /* ── Смена экранов: вперёд — справа, назад — слева, открытие — снизу; строки списков — лесенкой ── */
    .win-body:is(.scr-fwd, .scr-back, .scr-open) > * { animation: scr-in .5s var(--ease) both; }
    .win-body.scr-back > * { animation-name: scr-in-back; }
    .win-body.scr-open > * { animation-name: scr-rise; }
    .win-body.scr-fade > * { animation: fade-in .35s ease both; }
    .win-body:is(.scr-fwd, .scr-back, .scr-open) :is(.rows, .wish-list, .chats-list) > * { animation: row-in .55s var(--ease) both; }
    .win-body:is(.scr-fwd, .scr-back, .scr-open) :is(.rows, .wish-list, .chats-list) > :nth-child(2) { animation-delay: .03s; }
    .win-body:is(.scr-fwd, .scr-back, .scr-open) :is(.rows, .wish-list, .chats-list) > :nth-child(3) { animation-delay: .06s; }
    .win-body:is(.scr-fwd, .scr-back, .scr-open) :is(.rows, .wish-list, .chats-list) > :nth-child(4) { animation-delay: .09s; }
    .win-body:is(.scr-fwd, .scr-back, .scr-open) :is(.rows, .wish-list, .chats-list) > :nth-child(5) { animation-delay: .12s; }
    .win-body:is(.scr-fwd, .scr-back, .scr-open) :is(.rows, .wish-list, .chats-list) > :nth-child(6) { animation-delay: .15s; }
    .win-body:is(.scr-fwd, .scr-back, .scr-open) :is(.rows, .wish-list, .chats-list) > :nth-child(7) { animation-delay: .18s; }
    .win-body:is(.scr-fwd, .scr-back, .scr-open) :is(.rows, .wish-list, .chats-list) > :nth-child(n+8) { animation-delay: .21s; }
    @keyframes scr-in { from { opacity: 0; transform: translateX(28px); } }
    @keyframes scr-in-back { from { opacity: 0; transform: translateX(-28px); } }
    @keyframes scr-rise { from { opacity: 0; transform: translateY(16px); } }
    @keyframes row-in { from { opacity: 0; transform: translateY(12px); } }
    @keyframes fade-in { from { opacity: 0; } }

    /* ── Списки ── */
    .rows { padding: 4px 10px 12px; }
    .row { padding: 13px 14px; border-radius: 18px; transition: background .2s, transform .4s var(--spring); }
    .row-name { font-weight: 650; }
    .row.danger .row-name { color: var(--hot); }
    .person-card, .chat-row { border-radius: 18px; transition: background .2s, transform .4s var(--spring); }
    .person-card.is-link:hover { background: var(--row-hover); }
    .row[data-action]:active, .person-card.is-link:active, .chat-row:active { transform: scale(.975); transition-duration: .08s; }
    .chev {
      flex: none; width: 8px; height: 8px; margin-right: 5px; font-size: 0; color: var(--ink); opacity: .4;
      border-top: 1.7px solid currentColor; border-right: 1.7px solid currentColor; transform: rotate(45deg);
    }

    /* ── Кнопки: капсулы; главная — «чернильная» со спектральным свечением снизу ── */
    .btn {
      border-radius: 999px; padding: 11px 18px; font-weight: 700; font-size: 13.5px; letter-spacing: -.005em;
      background: var(--field); color: var(--ink);
      transition: background .2s, transform .4s var(--spring), box-shadow .3s, filter .2s;
    }
    .btn:hover { background: var(--row-hover); }
    .btn:active { transform: scale(.94); transition-duration: .08s; }
    .btn-primary, .friend-add-btn, #install-btn, .wa-btn.primary { background: var(--act); color: var(--act-ink); box-shadow: var(--prism-glow); }
    .btn-primary:hover, .friend-add-btn:hover, #install-btn:hover, .wa-btn.primary:hover { background: var(--act); filter: brightness(1.15); }
    :root[data-theme="dark"] .btn-primary:hover, :root[data-theme="dark"] .wa-btn.primary:hover { filter: brightness(.92); }
    .friend-add-btn { border-radius: 999px; padding: 8px 15px; transition: transform .4s var(--spring), filter .2s; }
    .friend-add-btn:active { transform: scale(.94); }
    .friend-add-btn[disabled] { background: var(--field); color: var(--ink-soft); box-shadow: none; }
    .btn-danger, .btn-danger:hover { background: var(--hot); color: #fff; box-shadow: none; }
    .btn-ghost { color: var(--ink); }
    .wa-btn.danger, .wa-icon.danger { color: var(--hot); }
    .icon-btn {
      position: relative; width: 40px; height: 40px; border-radius: 50%;
      background: var(--act); color: var(--act-ink); box-shadow: var(--prism-glow);
      transition: transform .45s var(--spring);
    }
    .icon-btn svg { display: none; }
    .icon-btn::before, .icon-btn::after {
      content: ""; position: absolute; left: 50%; top: 50%; width: 15px; height: 2px; margin: -1px 0 0 -7.5px;
      border-radius: 2px; background: currentColor; transition: transform .45s var(--spring);
    }
    .icon-btn::after { transform: rotate(90deg); }
    .icon-btn:hover::before { transform: rotate(90deg); }
    .icon-btn:hover::after { transform: rotate(180deg); }
    .icon-btn:active { transform: scale(.86); }

    /* ── Поля и переключатели ── */
    .edit-input, .edit-textarea, .username-wrap, .support-chat-input { border-radius: 16px; background: var(--field); border: 1.5px solid transparent; }
    .support-chat-input { border-radius: 999px; }
    .edit-input:focus, .edit-textarea:focus, .username-wrap:focus-within, .support-chat-input:focus {
      background: var(--win); border-color: var(--ink); box-shadow: 0 0 0 4px rgba(var(--you-rgb), .14);
    }
    .edit-input.is-invalid, .username-wrap:has(.edit-input.is-invalid) { border-color: var(--hot); box-shadow: 0 0 0 4px rgba(240, 62, 110, .16); }
    .edit-hint.is-invalid { color: var(--hot); }
    .switch { width: 48px; height: 28px; border-radius: 999px; background: var(--field); box-shadow: inset 0 0 0 1px var(--win-line); }
    .switch::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--prism); opacity: 0; transition: opacity .3s ease; }
    .switch::after { top: 3px; left: 3px; width: 22px; height: 22px; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .28); transition: transform .5s var(--spring); }
    .switch[aria-checked="true"], :root[data-theme="dark"] .switch[aria-checked="true"] { background: var(--field); }
    .switch[aria-checked="true"]::before { opacity: 1; }
    .switch[aria-checked="true"]::after, :root[data-theme="dark"] .switch[aria-checked="true"]::after { transform: translateX(20px); background: #fff; }
    .seg-opt { border-radius: 18px; }
    .seg-opt[aria-pressed="true"] { border-color: var(--ink); background: var(--field); }
    .theme-opt[aria-pressed="true"] svg { stroke: url(#prismIcon); color: var(--ink); }
    .theme-opt[aria-pressed="true"] svg .fill { fill: url(#prismIcon); }
    .person-card[aria-checked="true"] .person-check { background: var(--act); border-color: var(--act); }
    .person-card[aria-checked="true"] .person-check::after { color: var(--act-ink); }
    .avatar-pill[aria-pressed="true"] { background: var(--act); color: var(--act-ink); }
    .avatar-swatch[aria-pressed="true"] { border-color: var(--ink); }
    .view-btn[aria-pressed="true"] { color: var(--ink); }

    /* ── Чаты: свои сообщения — «чернилами», новые появляются с пружинкой ── */
    .chat-msg.me { background: var(--act); color: var(--act-ink); }
    .chat-msg.me .chat-msg-author { color: var(--act-ink); opacity: .7; }
    .chat-msg.me .chat-file, .chat-msg.me .chat-media-fallback { background: var(--me-card); }
    .chat-msg-author { color: var(--you); }
    .chat-msg.is-new { animation: bubble-in .45s var(--spring) both; }
    .chat-msg.me.is-new { transform-origin: 100% 100%; }
    .chat-msg.them.is-new { transform-origin: 0 100%; }
    @keyframes bubble-in { from { opacity: 0; transform: translateY(10px) scale(.86); } }
    .support-chat-send, .support-chat-send:hover { background: var(--act); color: var(--act-ink); filter: none; }
    .chat-composer .support-chat-send { box-shadow: var(--prism-glow); }
    .chat-tool { color: var(--ink); }

    /* ── Мелкие акценты ── */
    .notif-icon { border-radius: 16px; }
    .notif-unread::before { background: var(--prism); box-shadow: 0 0 0 2px var(--win); }
    .pg-badge, .post-thumb.cover-badge::after { background: var(--act); color: var(--act-ink); }
    .pg-item.is-main { box-shadow: inset 0 0 0 2px var(--ink); }
    .group-action-btn.settings { background: #6D6D77; }
    .group-action-btn.danger { background: var(--hot); }
    .feat-mark .fa { fill: var(--c3); }
    .feat-mark .fb { fill: var(--c1); }
    /* пустой экран — тонкое вращающееся спектральное кольцо */
    .empty-msg::before, .notif-empty::before {
      width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%;
      background: var(--prism-conic);
      -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2.2px), #000 calc(100% - 1.6px));
              mask: radial-gradient(closest-side, transparent calc(100% - 2.2px), #000 calc(100% - 1.6px));
      animation: orb-spin 8s linear infinite; opacity: .95;
    }
    @keyframes orb-spin { to { transform: rotate(1turn); } }

    /* ── Окна поверх: подтверждения, меню, затемнение ── */
    .scrim { background: rgba(12, 12, 18, .26); }
    :root[data-theme="dark"] .scrim { background: rgba(0, 0, 0, .5); }
    .modal-backdrop { background: rgba(8, 8, 12, .42); animation: fade-in .25s ease both; }
    .modal { border-radius: 28px; box-shadow: 0 40px 90px -20px rgba(0, 0, 0, .5), inset 0 1px 0 var(--rim); animation: modal-in .5s var(--spring) both; }
    .popover { border-radius: 18px; box-shadow: 0 24px 50px -16px rgba(0, 0, 0, .35), inset 0 1px 0 var(--rim); animation: modal-in .35s var(--spring) both; transform-origin: 100% 0; }
    .popover .pop-item.danger { color: var(--hot); }
    .popover .pop-item.danger:hover { background: rgba(240, 62, 110, .1); }
    @keyframes modal-in { from { opacity: 0; transform: translateY(14px) scale(.94); } }

    /* ── Панель вкладок: стеклянный «остров», капсула перетекает к выбранной вкладке ── */
    .dock-wrap { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 0 12px; }
    .dock, :root[data-theme="dark"] .dock {
      position: relative; gap: 0; padding: 5px; align-items: stretch;
      border-radius: 28px; background: var(--glass); border: 1px solid var(--glass-edge);
      -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
      box-shadow: 0 22px 48px -18px var(--glass-shadow), inset 0 1px 0 var(--rim);
    }
    .dock-item { position: relative; z-index: 1; width: 72px; height: auto; }
    .dock-btn, .dock-item[data-open="true"] .dock-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      width: 100%; height: 54px; min-width: 0; padding: 0; border-radius: 22px;
      background: transparent; color: var(--ink-soft);
      transition: color .3s ease, transform .45s var(--spring);
    }
    .dock-btn:hover { color: var(--ink); }
    .dock-item[data-open="true"] .dock-btn { color: var(--ink); }
    .dock-item[data-open="true"] .dock-btn::after { content: none; }
    .dock-btn svg { width: 23px; height: 23px; overflow: visible; }
    .dock-btn .ic-fill, .map-tools .ic-fill, .geo-btn .ic-fill { fill: currentColor; stroke: none; }
    .dock-item[data-open="true"] .dock-btn svg { stroke: url(#prismIcon); }
    .dock-item[data-open="true"] .dock-btn .ic-fill { fill: url(#prismIcon); }
    .dock-label, .dock-item[data-open="true"] .dock-label {
      max-width: none; opacity: 1; margin: 0; overflow: visible;
      font-size: 10.5px; font-weight: 700; letter-spacing: .01em; line-height: 1;
    }
    /* радар «Карты»: у открытой вкладки луч вращается */
    .dock-btn .ic-sweep { transform-box: view-box; transform-origin: 12px 12px; }
    .dock-item[data-open="true"] .ic-sweep { animation: radar-sweep 3.4s linear infinite; }
    @keyframes radar-sweep { to { transform: rotate(1turn); } }
    .dock-btn.is-tapped svg { animation: tab-tap .55s var(--spring); }
    @keyframes tab-tap { 30% { transform: scale(.76) rotate(-8deg); } 65% { transform: scale(1.12); } }
    /* «жидкая» капсула: передний край догоняет вкладку раньше заднего — на ходу она вытягивается */
    .dock-pill {
      position: absolute; top: 5px; bottom: 5px; left: 5px; right: auto; z-index: 0; list-style: none;
      border-radius: 22px; background: var(--field);
      box-shadow: inset 0 0 0 1px var(--win-line), inset 0 1px 0 var(--rim);
      transition: left var(--tl, .45s) var(--el, var(--ease)), right var(--tr, .45s) var(--er, var(--ease)), opacity .25s ease, transform .4s var(--spring);
    }
    .dock-pill::after {
      content: ""; position: absolute; left: 50%; bottom: 3px; width: 18px; height: 2.5px; margin-left: -9px;
      border-radius: 3px; background: var(--prism); box-shadow: 0 0 12px rgba(var(--you-rgb), .55);
    }
    .dock-pill.is-hidden { opacity: 0; transform: scale(.6); }
    .dock-pill:not(.is-ready) { transition: none; }

    /* ── Логотип и инструменты карты: две стеклянные капсулы сверху ── */
    .menubar {
      height: 48px; padding: 0 6px 0 4px; border-radius: 999px;
      background: var(--glass); border: 1px solid var(--glass-edge);
      box-shadow: 0 16px 36px -14px var(--glass-shadow), inset 0 1px 0 var(--rim);
    }
    .brand-wordmark .wm-shadow { fill: var(--c2); opacity: .32; }
    :root[data-theme="dark"] .brand-wordmark .wm-shadow { fill: var(--c1); opacity: .6; }
    .map-tools {
      position: fixed; z-index: 19; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
      display: flex; align-items: center; gap: 2px; height: 48px; padding: 0 4px;
      border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge);
      -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%);
      box-shadow: 0 16px 36px -14px var(--glass-shadow), inset 0 1px 0 var(--rim);
      transition: opacity .25s ease, transform .35s var(--ease);
    }
    .map-tools #notif-btn, .map-tools #filter-btn, .map-tools #settings-btn {
      position: relative; top: auto; right: auto; bottom: auto; left: auto;
      width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink);
      box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none;
      transition: background .2s, color .2s, transform .4s var(--spring);
    }
    .map-tools #notif-btn:hover, .map-tools #filter-btn:hover, .map-tools #settings-btn:hover { background: var(--field); color: var(--ink); transform: none; }
    .map-tools #notif-btn:active, .map-tools #filter-btn:active, .map-tools #settings-btn:active { transform: scale(.84); transition-duration: .08s; }
    .map-tools #notif-btn.is-active, .map-tools #filter-btn.is-active, .map-tools #settings-btn.is-active { background: var(--act); color: var(--act-ink); box-shadow: none; }
    .map-tools svg, .geo-btn svg { width: 21px; height: 21px; }
    .map-tools svg { transition: transform .5s var(--spring); }
    .map-tools #settings-btn:hover svg { transform: rotate(60deg); }
    #notif-btn .badge {
      top: 2px; right: 1px; min-width: 18px; height: 18px; line-height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--prism); color: var(--prism-ink); font-weight: 800; box-shadow: 0 0 0 2px var(--win);
    }
    #filter-btn .filter-dot { top: 8px; right: 8px; width: 8px; height: 8px; background: var(--prism); box-shadow: 0 0 0 2px var(--win); }
    body.app-window .map-tools { opacity: 0; transform: translateY(-8px); pointer-events: none; }
    body.app-window .map-tools #notif-btn, body.app-window .map-tools #filter-btn, body.app-window .map-tools #settings-btn { display: grid !important; }
    body.auth-locked .map-tools { display: none; }
    .geo-btn {
      width: 50px; height: 50px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink);
      box-shadow: 0 16px 36px -14px var(--glass-shadow), inset 0 1px 0 var(--rim);
    }
    .geo-btn:hover { color: var(--ink); }
    .geo-btn.is-active { background: var(--glass); color: var(--ink); border-color: var(--glass-edge); box-shadow: 0 16px 36px -14px var(--glass-shadow), inset 0 1px 0 var(--rim); }
    .geo-btn.is-active svg { stroke: url(#prismIcon); }
    .geo-btn.is-active .ic-fill { fill: url(#prismIcon); }

    /* ── Маркеры на карте ── */
    .user-badge-inner { background: var(--win); border: 1px solid var(--win-line); box-shadow: 0 10px 22px -8px rgba(10, 10, 16, .38); }
    .user-badge::after { background: var(--win); }
    .user-badge-avatar { background-color: var(--you); }
    .user-badge-status, .user-badge-status[aria-hidden] { background: var(--c1); }
    .user-dot-marker { background: var(--you); box-shadow: 0 0 0 4px rgba(var(--you-rgb), .25), 0 2px 6px rgba(0, 0, 0, .35); }
    .user-badge-inner.is-friend-group { background: #0D3C45; border-color: rgba(var(--lime-rgb), .5); }
    .user-badge-inner.is-friend-group .user-badge-group { color: #A5F1F7; }
    .user-dot-marker.is-friend-group { background: #0D8A98 !important; }
    .user-badge-inner.is-group { background: #131318; border-color: rgba(var(--you-rgb), .55); }
    .user-badge-inner.is-group .user-badge-group { color: #CABDFF; }
    .user-dot-marker.is-group { background: #131318 !important; }
    .map-group-chip { background: #131318; border-color: rgba(var(--lime-rgb), .45); box-shadow: 0 10px 22px -8px rgba(0, 0, 0, .45); }
    .map-group-ava { background: linear-gradient(145deg, var(--c1), var(--c3)); }
    .map-group-count { color: #A5F1F7; background: rgba(255, 255, 255, .1); }
    .user-badge.is-leader::after { background: #131318; border-color: rgba(var(--lime-rgb), .45); }
    .user-dot-marker.is-leader { background: #131318 !important; box-shadow: 0 0 0 2px var(--c1), 0 2px 6px rgba(0, 0, 0, .35); }
    /* кольца под маркером — спектральные (у групп — холодная часть спектра) */
    .signal-rings i {
      border: 0; background: var(--prism-conic);
      -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2.4px), #000 calc(100% - 1.6px));
              mask: radial-gradient(closest-side, transparent calc(100% - 2.4px), #000 calc(100% - 1.6px));
    }
    .signal-rings.is-group i { background: linear-gradient(90deg, var(--c1), var(--c2), var(--c1)); }
    /* облака желаний: кант-спектр (у групп — аква → синий) */
    /* спрятанное облако (перекрывало бы другое) и облачко «…» вместо него */
    .wish-cloud { transition: transform .25s var(--ease), opacity .22s ease, visibility 0s; }
    .wish-cloud.is-tucked { opacity: 0; visibility: hidden; pointer-events: none; transition: transform .25s var(--ease), opacity .22s ease, visibility 0s linear .22s; }
    .wish-peek {
      position: absolute; top: -24px; left: 0; display: none; align-items: center; justify-content: center; gap: 2.5px;
      width: 30px; height: 18px; border-radius: 10px; pointer-events: auto; cursor: pointer;
      border: 1.5px solid transparent; background: linear-gradient(var(--win), var(--win)) padding-box, var(--prism) border-box;
      box-shadow: 0 4px 10px -3px rgba(0, 0, 0, .35);
      transform: scale(var(--wish-k, 1)); transform-origin: 0 100%;
      animation: wc-in .4s var(--spring) both;
    }
    .wish-anchor.is-left .wish-peek { left: auto; right: 0; transform-origin: 100% 100%; }
    .wish-peek i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink); opacity: .7; }
    .wish-anchor.is-tucked .wish-peek { display: flex; }
    .wish-anchor.is-tucked.is-pair ~ .wish-anchor.is-tucked .wish-peek { top: -44px; }    .wish-cloud { --wc-fill: #FFFFFF; --wc-ink: #111114; --wc-edge: #111114; --wc-accent: url(#wcPrism); --wc-cap: var(--c3); }
    .wish-cloud.is-group { --wc-accent: url(#wcCool); --wc-cap: var(--lime-deep); }
    :root[data-theme="dark"] .wish-cloud { --wc-fill: #141419; --wc-ink: #F3F3F5; --wc-edge: #050507; --wc-cap: var(--c3); }
    :root[data-theme="dark"] .wish-cloud.is-group { --wc-cap: var(--c1); }
    .wish-place-dot { background: var(--prism); }
    /* воспоминания — белые «полароиды» */
    .memory-card, :root[data-theme="dark"] .memory-card { background: #FFFFFF; }
    .memory-card::after, :root[data-theme="dark"] .memory-card::after { background: rgba(17, 17, 20, .14); }
    .memory-card .mc-img.no-photo { background: #EEEDEA; color: #6D6D77; }
    .memory-marker::after, :root[data-theme="dark"] .memory-marker::after { background: #111114; }
    .memory-more, :root[data-theme="dark"] .memory-more { background: #111114; }

    /* ── Появление интерфейса после входа: капсулы съезжаются к краям ── */
    body.chrome-enter .menubar { animation: chrome-down .8s var(--ease) .05s both; }
    body.chrome-enter .map-tools { animation: chrome-down .8s var(--ease) .14s both; }
    body.chrome-enter .dock-wrap { animation: chrome-up .9s var(--spring) .2s both; }
    body.chrome-enter .geo-btn { animation: chrome-pop .7s var(--spring) .38s both; }
    @keyframes chrome-down { from { opacity: 0; transform: translateY(-22px) scale(.96); } }
    @keyframes chrome-up { from { opacity: 0; transform: translateY(40px) scale(.94); } }
    @keyframes chrome-pop { from { opacity: 0; transform: scale(.4); } }

    /* ── Всплеск при нажатии: тонкое спектральное кольцо расходится из точки касания ── */
    .tap-layer { position: fixed; inset: 0; z-index: 400; pointer-events: none; overflow: hidden; contain: strict; }
    .tap-ring {
      position: absolute; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 50%;
      background: conic-gradient(from 210deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c1));
      -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 4.2px), #000 calc(100% - 3.2px), #000 calc(100% - .6px), transparent 100%);
              mask: radial-gradient(closest-side, transparent calc(100% - 4.2px), #000 calc(100% - 3.2px), #000 calc(100% - .6px), transparent 100%);
      animation: tap-ring .62s cubic-bezier(.2, .8, .25, 1) forwards;
    }
    @keyframes tap-ring {
      0% { transform: scale(.1); opacity: 1; }
      45% { opacity: .95; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* ── Экран входа: космос всегда тёмный, спектр — пастельный ── */
    .auth-screen {
      --c1: #4FE3EE; --c2: #7C9CFF; --c3: #A98CFF; --c4: #FF8FD8;
      --prism: linear-gradient(115deg, #4FE3EE 0%, #7C9CFF 34%, #A98CFF 66%, #FF8FD8 100%);
      --prism-glow: -12px 12px 28px -14px #4FE3EE, 12px 12px 28px -14px #FF8FD8, 0 16px 30px -16px #A98CFF;
      background:
        radial-gradient(60vmax 50vmax at var(--gx, 50%) var(--gy, 45%), rgba(124, 156, 255, .10), transparent 62%),
        radial-gradient(70vmax 55vmax at 0% 0%, rgba(169, 140, 255, .10), transparent 60%),
        radial-gradient(70vmax 55vmax at 100% 100%, rgba(79, 227, 238, .07), transparent 60%),
        #07070A;
    }
    .auth-card {
      background: rgba(13, 13, 17, .94); border: 1px solid rgba(255, 255, 255, .08); border-radius: 26px; color: #F3F3F5;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .06);
    }
    .auth-title, .auth-step-title { color: #F3F3F5; }
    .auth-card .auth-title { font-size: 18px; }
    .auth-card .auth-step-title { font-size: 15px; }
    .auth-sub, .auth-step-sub, .auth-hint, .auth-divider, .auth-label { color: #8C8C97; }
    .auth-label { padding-left: 4px; }
    .auth-eyebrow { background: var(--prism); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .auth-input, .auth-card .edit-input, .auth-card .edit-textarea, .auth-card .username-wrap {
      background: rgba(255, 255, 255, .06); border: 1.5px solid transparent; border-radius: 16px; color: #F3F3F5;
    }
    .auth-input::placeholder { color: #5E5E68; }
    .auth-input:focus, .auth-card .edit-input:focus, .auth-card .edit-textarea:focus, .auth-card .username-wrap:focus-within {
      background: rgba(255, 255, 255, .08); border-color: rgba(243, 243, 245, .85); box-shadow: 0 0 0 4px rgba(169, 140, 255, .22);
    }
    .auth-card .username-prefix { color: #8C8C97; }
    .auth-btn {
      border-radius: 999px; background: #F3F3F5; color: #0B0B0E; font-weight: 800; letter-spacing: -.005em;
      box-shadow: var(--prism-glow); transition: transform .4s var(--spring), box-shadow .3s ease, filter .2s;
    }
    .auth-btn:hover { filter: none; box-shadow: -14px 14px 34px -12px #4FE3EE, 14px 14px 34px -12px #FF8FD8, 0 18px 34px -14px #A98CFF; }
    .auth-btn:active { transform: scale(.95); }
    .auth-link, .auth-link:hover {
      background: var(--prism); -webkit-background-clip: text; background-clip: text; color: transparent;
      text-decoration-color: rgba(169, 140, 255, .7);
    }
    .auth-step-dot { background: rgba(255, 255, 255, .14); }
    .auth-step-dot.active { background: var(--prism); }
    .auth-step-dot.done { background: rgba(255, 255, 255, .42); }
    .gender-opt { border-radius: 18px; border-color: rgba(255, 255, 255, .1); background: rgba(255, 255, 255, .04); }
    .gender-opt[aria-pressed="true"] { border-color: #A98CFF; background: rgba(169, 140, 255, .12); }
    .auth-age-row input[type="range"] { accent-color: #A98CFF; }
    .auth-card .btn { background: rgba(255, 255, 255, .08); color: #F3F3F5; box-shadow: none; }
    .auth-card .btn-ghost { color: #CABDFF; }
    .auth-avatar-preview { background: linear-gradient(145deg, #4FE3EE, #8A6CFF); }

    /* ── 3D-аватар: сцена редактора, образцы, маркер на карте ── */
    .avatar-editor { gap: 18px; grid-template-columns: minmax(0, 1fr); }
    .avatar-stage {
      height: 300px; border-radius: 26px; cursor: grab; touch-action: pan-y;
      background:
        radial-gradient(70% 55% at 50% 100%, rgba(var(--you-rgb), .16), transparent 70%),
        radial-gradient(60% 60% at 50% 30%, rgba(var(--lime-rgb), .08), transparent 70%),
        var(--field);
      box-shadow: inset 0 0 0 1px var(--win-line);
    }
    .avatar-stage:active { cursor: grabbing; }
    .avatar-stage-hint {
      position: absolute; left: 16px; top: 14px; pointer-events: none;
      font: 500 10px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); opacity: .75;
      transition: opacity .4s ease;
    }
    .avatar-zoom {
      position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border: 0; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer; color: var(--ink);
      background: var(--glass); box-shadow: 0 8px 20px -8px var(--glass-shadow), inset 0 1px 0 var(--rim), inset 0 0 0 1px var(--glass-edge);
      transition: transform .4s var(--spring), background .2s, color .2s;

    .avatar-zoom svg { width: 19px; height: 19px; }
    .avatar-zoom:active { transform: scale(.86); }
    .avatar-zoom[aria-pressed="true"] { background: var(--act); color: var(--act-ink); }
    .avatar-controls { display: grid; gap: 16px; }
    .avatar-row { gap: 9px; }
    .avatar-swatch {
      width: 34px; height: 34px; border: 0; border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .14);
      transition: transform .4s var(--spring), box-shadow .2s;
    }
    .avatar-swatch[aria-pressed="true"] { transform: scale(1.06); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .14), 0 0 0 2.5px var(--win), 0 0 0 4.5px var(--ink); }
    :root[data-theme="dark"] .avatar-swatch { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); }
    :root[data-theme="dark"] .avatar-swatch[aria-pressed="true"] { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), 0 0 0 2.5px var(--win), 0 0 0 4.5px var(--ink); }
    .avatar-stage.is-touched .avatar-stage-hint { opacity: 0; }
    .avatar-pill { border-radius: 999px; padding: 8px 15px; font-weight: 650; transition: background .2s, color .2s, transform .4s var(--spring); }
    .avatar-pill:active, .avatar-swatch:active { transform: scale(.9); transition-duration: .08s; }
    .user-avatar-wrap { width: 44px; height: 44px; }
    .user-profile-avatar:not(.no-3d) { background: radial-gradient(circle at 50% 80%, rgba(var(--you-rgb), .2), transparent 70%), var(--field); }
    /* выбор пола при регистрации — портреты аватаров */
    .gender-opt .gender-ava {

    }

  <script>
  'use strict';

  /* ═══════ SUPABASE ═══════ */
  const SUPABASE_URL = 'https://zioxwmynfbrmmouduhbf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_YBsh_W2dBbk1ZIZk1y3yBg_7X2iVE3P';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function isThreeAvailable() {

  }

  /* ═══════ 3D-ГЛОБУС ═══════
     Экран входа: на глобусе крестики-этапы, между ними пунктир по дуге большого круга.
     Каждый шаг: пунктир дорисовывается к новой точке, глобус плавно доворачивается,
     появляется крестик. В конце — «полёт» камеры к поверхности (flyIn). */
  const Globe = (() => {
    let renderer = null, scene = null, camera = null, earth = null, glow = null;
    let rafId = null, running = false, initialized = false, flying = false;
    const markers = [];        // { vec, sprite, line } — line ведёт из предыдущей точки
    const tweens = [];         // { start, dur, update(t), res }
    const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
    // Куда «смотрит» активный крестик (из центра глобуса); пересчитывается под ориентацию экрана
    const camDir = new THREE.Vector3(0.35, 0, 1).normalize();
    let camDist = 3.4;          // расстояние камеры — подбирается так, чтобы глобус влезал в экран
    let lockedHeight = 0;       // высота холста, пока открыта экранная клавиатура
    let currentDir = null;
    let layoutInfo = null;      // { cx, cy, r, logoTop, logoH, portrait, w, h } — раскладка сцены в пикселях
    let readyResolve = null;
    const readyPromise = new Promise((r) => { readyResolve = r; });
    const layoutListeners = [];
    // Стороны, с которых карточка может встать у крестика, и отступы карточки от крестика и от краёв экрана
    const SIDES = { right: [1, 0], left: [-1, 0], above: [0, -1], below: [0, 1] };
    const CARD_GAP = 26, CARD_EDGE = 12;

    const STEP_ANGLE = 0.62;
    const MAX_TURN = Math.PI * 35 / 180;
    const MARKER_RADIUS = 1.04;
    const LINE_RADIUS = 1.004;   // почти на поверхности — у края глобуса пунктир с обратной стороны не выглядывает
    const MIN_MARKER_DIST = 0.45;
    const MARKER_SIZE = 0.22;
    const ROT_DUR = 1600, LINE_DUR = 1150, POP_DUR = 560;

    const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    function tween(dur, update) {
      if (!initialized || !running) { update(1); return Promise.resolve(); }
      // start берём из первого кадра — те же часы, что у requestAnimationFrame
      return new Promise((res) => tweens.push({ start: null, dur: Math.max(1, dur), update, res }));
    }

    function latLonToVec3(lat, lon, r) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      return new THREE.Vector3(
        -r * Math.sin(phi) * Math.cos(theta),
         r * Math.cos(phi),
         r * Math.sin(phi) * Math.sin(theta)
      );
    }

    function slerpVec(a, b, t) {
      const ang = a.angleTo(b);
      if (ang < 1e-6) return a.clone();
      const s = Math.sin(ang);
      return a.clone().multiplyScalar(Math.sin((1 - t) * ang) / s).add(b.clone().multiplyScalar(Math.sin(t * ang) / s));
    }

    function makeMarkerTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.save();
      ctx.translate(64, 64);
      ctx.rotate(Math.PI / 4);
      ctx.strokeStyle = '#F5F6FF';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#9D86FF';
      ctx.shadowBlur = 14;
      const arm = 22;
      ctx.beginPath();
      ctx.moveTo(-arm, 0); ctx.lineTo(arm, 0);
      ctx.moveTo(0, -arm); ctx.lineTo(0, arm);
      ctx.stroke();
      ctx.restore();
      const tex = new THREE.CanvasTexture(c);
      if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function addMarkerSprite(vec) {
      const mat = new THREE.SpriteMaterial({ map: makeMarkerTexture(), transparent: true, depthTest: true, depthWrite: false });
      const s = new THREE.Sprite(mat);
      s.position.copy(vec.clone().multiplyScalar(MARKER_RADIUS));
      s.scale.set(0, 0, 0);
      s.userData.alpha = 1;   // «своя» прозрачность; итоговая ещё гасится, когда крестик уходит за край
      earth.add(s);
      return s;
    }

    /* Пунктир по дуге большого круга: каждый штрих — узкий четырёхугольник,
       лежащий на сфере. Дорисовка — через drawRange по штрихам. */
    function buildDashedArc(a, b) {
      const len = a.angleTo(b) * LINE_RADIUS;
      const DASH = 0.032, GAP = 0.022, W = 0.009;
      const n = Math.max(1, Math.floor((len + GAP) / (DASH + GAP)));
      const pos = [], idx = [];
      const at = (s) => slerpVec(a, b, s / len).normalize().multiplyScalar(LINE_RADIUS);
      for (let i = 0; i < n; i++) {
        const s0 = i * (DASH + GAP), s1 = Math.min(len, s0 + DASH);
        const p0 = at(s0), p1 = at(s1);
        const mid = p0.clone().add(p1).normalize();
        const side = new THREE.Vector3().subVectors(p1, p0).cross(mid).normalize().multiplyScalar(W / 2);
        const base = pos.length / 3;
        for (const p of [p0.clone().sub(side), p0.clone().add(side), p1.clone().add(side), p1.clone().sub(side)]) pos.push(p.x, p.y, p.z);
        idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setIndex(idx);
      geo.setDrawRange(0, 0);
      const mat = new THREE.MeshBasicMaterial({ color: 0xDCE2FF, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData.dashCount = n;
      earth.add(mesh);
      return mesh;
    }
    function setArcProgress(mesh, t) {
      mesh.geometry.setDrawRange(0, Math.ceil(mesh.userData.dashCount * t) * 6);
    }

    function disposeObj(o) {
      if (!o) return;
      if (o.parent) o.parent.remove(o);
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    }

    function perpendicular(v) {
      const ref = Math.abs(v.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      return new THREE.Vector3().crossVectors(v, ref).normalize();
    }

    // Лежит ли точка p (единичный вектор) на дуге a→b
    function onArc(p, a, b) { return Math.abs(a.angleTo(p) + p.angleTo(b) - a.angleTo(b)) < 1e-4; }
    function arcsIntersect(a1, a2, b1, b2) {
      const n1 = new THREE.Vector3().crossVectors(a1, a2);
      const n2 = new THREE.Vector3().crossVectors(b1, b2);
      const l = new THREE.Vector3().crossVectors(n1, n2);
      if (l.lengthSq() < 1e-12) return false;
      l.normalize();
      return [l, l.clone().negate()].some((p) => onArc(p, a1, a2) && onArc(p, b1, b2));
    }

    // Следующая точка маршрута при заданном повороте курса
    function buildNext(prevVec, prevDir, turn) {
      const dir0 = prevDir ? prevDir.clone() : perpendicular(prevVec);
      dir0.sub(prevVec.clone().multiplyScalar(dir0.dot(prevVec))).normalize();
      const dir = dir0.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(prevVec, turn)).normalize();
      const axis = new THREE.Vector3().crossVectors(prevVec, dir).normalize();
      const vec = prevVec.clone().applyQuaternion(new THREE.Quaternion().setFromAxisAngle(axis, STEP_ANGLE)).normalize();
      const newDir = vec.clone().sub(prevVec.clone().multiplyScalar(vec.dot(prevVec))).normalize();
      return { vec, dir: newDir };
    }
    // Не близко к прошлым точкам и без пересечения с нарисованными отрезками — путь не перекрещивается
    function validNext(prevVec, vec) {
      if (markers.some((m) => vec.distanceTo(m.vec) < MIN_MARKER_DIST)) return false;
      for (let i = 0; i < markers.length - 2; i++) {
        if (arcsIntersect(prevVec, vec, markers[i].vec, markers[i + 1].vec)) return false;
      }
      return true;
    }

    /* ── Где встанет карточка ──
       Активный крестик всегда в одной точке экрана (camDir). Карточка встаёт рядом с ним с той стороны,
       где влезает и куда не идёт пунктир от предыдущего крестика. Если пунктир «мешает» всем подходящим
       сторонам, глобус при повороте чуть проворачивается вокруг крестика (roll). */
    const scrA = { x: 0, y: 0 }, scrB = { x: 0, y: 0 };
    function toScreen(localVec, q, out) {
      tmpA.copy(localVec).multiplyScalar(MARKER_RADIUS).applyQuaternion(q).add(earth.position).project(camera);
      out.x = (tmpA.x + 1) / 2 * layoutInfo.w;
      out.y = (1 - tmpA.y) / 2 * layoutInfo.h;
      return out;
    }
    function sideFits(side, m, size) {
      const { w, h } = layoutInfo;
      if (side === 'right') return m.x + CARD_GAP + size.w <= w - CARD_EDGE && size.h <= h - 2 * CARD_EDGE;
