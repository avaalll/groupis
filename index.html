    const hero = winBody.querySelector('.photo-hero.is-many');
    if (!hero || e.target.closest('input, textarea')) return;
    photoHeroStep(hero, e.key === 'ArrowLeft' ? -1 : 1);
  });

  // Ползунки фильтров: применяем сразу — лента обновляется в следующем кадре
  winBody.addEventListener('input', (e) => {
    if (e.target.id !== 'flt-age' && e.target.id !== 'flt-spread') return;
    if (e.target.id === 'flt-age') feedFilters.age = Number(e.target.value);
    else feedFilters.spread = Number(e.target.value);
    syncFiltersUi();
    applyFeedFilters();
  });

  winBody.addEventListener('click', async (e) => {
    // ── тема оформления ──
    const themeBtn = e.target.closest('[data-theme-pref]');
    if (themeBtn) { setThemePref(themeBtn.dataset.themePref); return; }
    const palBtn = e.target.closest('[data-palette-pref]');
    if (palBtn) { setPalette(palBtn.dataset.palettePref); return; }
    // ── фильтры групп ──
    if (e.target.closest('[data-flt-age-toggle]')) {
      e.stopImmediatePropagation(); // общий обработчик .switch не должен переключить его второй раз
      feedFilters.ageOn = !feedFilters.ageOn;
      e.target.closest('[data-flt-age-toggle]').setAttribute('aria-checked', String(feedFilters.ageOn));
      syncFiltersUi(); applyFeedFilters();
      return;
    }
    const compBtn = e.target.closest('[data-flt-comp]');
    if (compBtn) { feedFilters.comp = compBtn.dataset.fltComp; syncFiltersUi(); applyFeedFilters(); return; }
    const spreadBtn = e.target.closest('[data-flt-spread]');
    if (spreadBtn) { feedFilters.spread = Number(spreadBtn.dataset.fltSpread); syncFiltersUi(); applyFeedFilters(); return; }
    if (e.target.closest('[data-flt-reset]')) {
      feedFilters = { ...DEFAULT_FILTERS };
      winBody.innerHTML = APPS.filters.render(); syncFiltersUi(); applyFeedFilters();
      return;
    }
    if (e.target.closest('[data-flt-done]')) { showFeedApp(); return; }

    // ── сообщения чата: меню, закреплённое, выбор нескольких ──
    const msgAct = e.target.closest('[data-msg-act]');
    if (msgAct) {
      const id = msgAct.dataset.msgId, act = msgAct.dataset.msgAct;
      closePostMenus();
      const m = chatMsgById(id);
      if (!m) return;
      if (act === 'reply') setChatReply(id);
      else if (act === 'react') toggleChatReaction(id, msgAct.dataset.emoji);
      else if (act === 'edit') setChatEdit(id);
      else if (act === 'readers') openReadersModal(m);
      else if (act === 'pin') setChatMessagePinned(id, !m.pinned);
      else if (act === 'copy') { try { await navigator.clipboard.writeText(m.content || ''); } catch (err) { console.warn('[copy]', err); } }
      else if (act === 'forward') openForwardPicker([id]);
      else if (act === 'select') toggleChatSelected(id);
      else if (act === 'delete') deleteChatMessages([id]);
      return;
    }
    if (e.target.closest('[data-reply-cancel]')) { setChatReply(null); return; }
    if (e.target.closest('[data-edit-cancel]')) { setChatEdit(null); return; }
    const reactChip = e.target.closest('[data-react-chip]');
    if (reactChip) {
      const bubble = reactChip.closest('.chat-msg[data-msg-id]');
      if (bubble) toggleChatReaction(bubble.dataset.msgId, reactChip.dataset.reactChip);
      return;
    }
    const shareOpen = e.target.closest('[data-share-open]');
    if (shareOpen) { openSharedGroup(shareOpen.dataset.shareOpen); return; }
    const shareGroupBtn = e.target.closest('[data-share-group]');
    if (shareGroupBtn) { shareGroupFlow(shareGroupBtn.dataset.shareGroup, shareGroupBtn); return; }
    const replyTo = e.target.closest('[data-reply-to]');
    if (replyTo) { jumpToChatMessage(replyTo.dataset.replyTo); return; }
    const msgAva = e.target.closest('[data-msg-ava]');
    if (msgAva) { openChatMember(msgAva.dataset.msgAva); return; }
    const pinOff = e.target.closest('[data-pin-off]');
    if (pinOff) { setChatMessagePinned(pinOff.dataset.pinOff, false); return; }
    if (e.target.closest('#chat-pin')) { jumpToPinned(); return; }
    if (e.target.closest('[data-sel-cancel]')) { setChatSelecting(false); return; }
    if (e.target.closest('[data-sel-forward]')) { if (chat) openForwardPicker([...chat.selected]); return; }
    if (e.target.closest('[data-sel-delete]')) { if (chat) deleteChatMessages([...chat.selected]); return; }

    // ── чат: вложения, запись, просмотр ──
    const attachBtn = e.target.closest('[data-chat-attach]');
    if (attachBtn) {
      // в чате группы у участника (не лидера) скрепка открывает меню: файл или предложение лидеру
      const g = chat && chat.type === 'group' ? groupById(chat.groupId) : null;
      if (g && currentUser && g.ownerId !== currentUser.id) { openChatAttachMenu(attachBtn); return; }
      const f = winBody.querySelector('#chat-file'); if (f) f.click();
      return;
    }
    // ── заявки на вступление в группу ──
    const joinBtn = e.target.closest('[data-join-group]');
    if (joinBtn) { requestJoinGroup(joinBtn.dataset.joinGroup); return; }
    const jrBtn = e.target.closest('[data-jr-accept], [data-jr-decline]');
    if (jrBtn) { answerJoinRequest(jrBtn.dataset.jrAccept || jrBtn.dataset.jrDecline, jrBtn.hasAttribute('data-jr-accept')); return; }
    const proposeBtn = e.target.closest('[data-propose-yes], [data-propose-no]');
    if (proposeBtn) {
      proposeBtn.disabled = true;
      await answerProposal(proposeBtn.dataset.proposeYes || proposeBtn.dataset.proposeNo, proposeBtn.hasAttribute('data-propose-yes'));
      return;
    }
    const recBtn = e.target.closest('[data-chat-rec]');
    if (recBtn) { startChatRecording(recBtn.dataset.chatRec); return; }
    if (e.target.closest('[data-chat-rec-cancel]')) { stopChatRecording(true); return; }
    if (e.target.closest('[data-chat-rec-send]')) { stopChatRecording(false); return; }
    const fileEl = e.target.closest('[data-chat-file]');
    if (fileEl) {
      const name = fileEl.dataset.fileName || 'file';
      const path = fileEl.dataset.mediaPath;
      const cached = path ? mediaUrlCache.get(path) : null;
      const fresh = !path || (cached && cached.exp > Date.now());
      // PDF и то, что браузер показывает сам, открывается во вкладке по обычной ссылке
      if (fresh && fileEl.getAttribute('href') && isInlineViewable(fileExt(name))) return;
      e.preventDefault();
      let url = fresh ? fileEl.getAttribute('href') : null;
      if (!url && path) {
        // ссылка устарела (чат открыт больше часа) или ещё не подставлена — берём новую
        const { data, error } = await supabaseClient.storage.from(CHAT_BUCKET).createSignedUrl(path, 3600);
        if (error || !data) { alert('Не удалось открыть файл: ' + (error ? error.message : '')); return; }
        url = data.signedUrl;
        mediaUrlCache.set(path, { url, exp: Date.now() + 50 * 60 * 1000 });
        fileEl.href = url;
      }
      if (!url) return;
      if (isInlineViewable(fileExt(name))) window.open(url, '_blank', 'noopener');
      else downloadChatFile(url, name);
      return;
    }
    const photoEl = e.target.closest('[data-open-photo]');
    if (photoEl && photoEl.src) { openPhotoViewer(photoEl.src); return; }
    const circleEl = e.target.closest('[data-circle]');
    if (circleEl) { toggleCircle(circleEl); primeChatQueue(circleEl.querySelector('video')); return; }
    const voicePlay = e.target.closest('[data-voice-play]');
    if (voicePlay) { const box = voicePlay.closest('[data-voice]'); toggleVoice(box); primeChatQueue(box.querySelector('audio')); return; }
    // полоска «сейчас играет»
    if (e.target.closest('[data-player-toggle]')) { toggleChatPlayer(); primeChatQueue(nowPlaying); return; }
    if (e.target.closest('[data-player-close]')) { stopChatPlayer(); return; }
    if (e.target.closest('[data-player-jump]')) {
      const msgEl = nowPlaying && nowPlaying.closest('.chat-msg[data-msg-id]');
      if (msgEl) jumpToChatMessage(msgEl.dataset.msgId);
      return;
    }
    const voiceSeek = e.target.closest('[data-voice-seek]');
    if (voiceSeek) { seekVoice(voiceSeek.closest('[data-voice]'), e.clientX); return; }
    // ── список чатов: кнопки под свайпом строки ──
    const chatMuteSet = e.target.closest('[data-mute-set]');
    if (chatMuteSet) { closePostMenus(); closeChatSwipes(); await setChatMute(chatMuteSet.dataset.muteKey, chatMuteSet.dataset.muteSet); return; }
    const chatMuteBtn = e.target.closest('[data-chat-mute]');
    if (chatMuteBtn) { openChatMuteMenu(chatMuteBtn.dataset.chatMute, chatMuteBtn); return; }
    const chatDelBtn = e.target.closest('[data-chat-delete]');
    if (chatDelBtn) { closeChatSwipes(); await deleteChatForMe(chatDelBtn.dataset.chatDelete); return; }
    const chatsTabBtn = e.target.closest('[data-chats-tab]');
    if (chatsTabBtn) { setChatsTab(chatsTabBtn.dataset.chatsTab); return; }
    const groupChatBtn = e.target.closest('[data-open-group-chat]');
    if (groupChatBtn) {
      const gid = groupChatBtn.dataset.openGroupChat;
      // из списка чатов «назад» ведёт в список, из карточки группы — обратно в карточку
      const fromList = !!winBody.querySelector('#chats-list');
      const back = groupDetailsBack;
      await showGroupChatScreen(gid, fromList ? null : () => showGroupDetailsScreen(gid, back));
      return;
    }
    // ── голосование о союзе в совместном чате: значок у скрепки открывает и закрывает окошко голосования ──
    if (e.target.closest('[data-vote-tool]')) { if (votePop && votePop.isConnected) closeVotePop(); else openVotePop(); return; }
    if (e.target.closest('[data-vote-start]') && chat && chat.type === 'match') { await startMatchVote(chat.matchId); return; }
    const voteBtn = e.target.closest('[data-vote-yes], [data-vote-no]');
    if (voteBtn && chat && chat.type === 'match') {
      winBody.querySelectorAll('.mv-btn').forEach((b) => { b.disabled = true; });
      await castMatchVote(chat.matchId, voteBtn.hasAttribute('data-vote-yes'));
      return;
    }
    const matchChatBtn = e.target.closest('[data-open-match-chat]');
    if (matchChatBtn) {
      // «назад»: в список чатов, в карточку союза, в уведомления или в карточку группы — откуда пришли
      const back = winBody.querySelector('#chats-list') ? null
        : winBody.querySelector('[data-union-card]') ? reopenUnionDetails
        : openApp === 'notifications' && !currentBackHandler ? () => showApp('notifications') : reopenGroupDetails;
      await showMatchChatScreen(matchChatBtn.dataset.openMatchChat, back);
      return;
    }
    // ── союз: карточка из списка групп, из неё — карточки двух групп ──
    const unionCard = e.target.closest('[data-union-id]');
    if (unionCard) { showUnionDetailsScreen(unionCard.dataset.unionId); return; }
    const unionGroup = e.target.closest('[data-union-group]');
    if (unionGroup) { showGroupDetailsScreen(unionGroup.dataset.unionGroup, reopenUnionDetails); return; }
    // ── посмотреть группу: из уведомления (фото группы, «Посмотреть группу») или из запроса в карточке своей группы ──
    const viewGroup = e.target.closest('[data-view-group]');
    if (viewGroup) {
      e.stopPropagation();
      const gid = viewGroup.dataset.viewGroup;
      if (!groupById(gid)) { alert('Этой группы больше нет.'); return; }
      let back = null;
      if (openApp === 'notifications' && !currentBackHandler) back = () => showApp('notifications');
      else if (groupDetailsId) { const id = groupDetailsId, b = groupDetailsBack; back = () => showGroupDetailsScreen(id, b); }
      showGroupDetailsScreen(gid, back);
      return;
    }

    // ── воспоминание: отмеченный человек → его профиль, отмеченная группа → её участники ──
    const postPerson = e.target.closest('[data-post-person]');
    const postGroup = e.target.closest('[data-post-group]');
    if (postPerson || postGroup) {
      const postEl = e.target.closest('.post');
      const pid = postEl && postEl.dataset.postId;
      const back = winTitle.textContent === 'Воспоминание' ? () => showSinglePost(pid) : () => showPlacesScreen();
      if (postPerson) { const uid = postPerson.dataset.postPerson; showFriendProfile(uid, personById(uid), back); return; }
      const gid = postGroup.dataset.postGroup;
      if (gid && groupById(gid)) showGroupDetailsScreen(gid, back);
      else alert('Этой группы больше нет.');
      return;
    }

    // ── группы и match ──
    const viewProfile = e.target.closest('[data-view-profile]');
    // кнопки внутри строки («Чат», «×») обрабатываются ниже — профиль по ним не открываем
    if (viewProfile && !e.target.closest('button')) {
      const uid = viewProfile.dataset.viewProfile;
      const from = viewProfile.dataset.profileBack;
      const back = from === 'friends' ? showFriendsScreen : from === 'union' ? reopenUnionDetails : reopenGroupDetails;
      showFriendProfile(uid, personById(uid) || chatPersonById(uid), back);
      return;
    }
    // ── желание группы: изменить / загадать / удалить ──
    const gwEdit = e.target.closest('[data-gwish-edit]');
    if (gwEdit) { await editGroupWish(gwEdit.dataset.gwishEdit); return; }
    const gwDel = e.target.closest('[data-gwish-delete]');
    if (gwDel) { await deleteGroupWish(gwDel.dataset.gwishDelete); return; }
    // карточка match: от какой из моих групп предложить (знак слева и кнопка следуют за выбором)
    const matchFrom = e.target.closest('[data-match-from]');
    if (matchFrom) {
      const cta = matchFrom.closest('.gx-cta'), mine = groupById(matchFrom.dataset.matchFrom);
      if (!cta || !mine) return;
      cta.querySelectorAll('[data-match-from]').forEach((b) => b.setAttribute('aria-pressed', String(b === matchFrom)));
      const btn = cta.querySelector('[data-match-send]');
      if (btn) btn.dataset.matchSend = String(mine.id);
      const disc = cta.querySelector('.gx-disc.is-a');
      if (disc) disc.outerHTML = gxDiscHtml(mine, 'is-a');
      return;
    }
    if (e.target.closest('[data-action="open-feed"]')) { closeApp(); return; }
    const matchSend = e.target.closest('[data-match-send]');
    if (matchSend) {
      matchSend.disabled = true;
      // карточка сразу показывает «Запрос отправлен», ответ сервера приходит в фоне
      const status = await sendGroupMatch(matchSend.dataset.matchSend, matchSend.dataset.matchTo);
      if (status === 'accepted') { await matchFxIdle(); alert('У этой группы уже был запрос к вам — match состоялся! Общий чат создан.'); }
      return;
    }
    const gmBtn = e.target.closest('[data-gm-accept], [data-gm-decline]');
    if (gmBtn) {
      e.stopPropagation();
      const accept = gmBtn.hasAttribute('data-gm-accept');
      const matchId = accept ? gmBtn.dataset.gmAccept : gmBtn.dataset.gmDecline;
      // карточка (или уведомления) меняется сразу, у принятого — анимация match; сервер догоняет в фоне
      const done = respondGroupMatch(matchId, accept);
      if (accept) {
        await matchFxIdle();   // сначала доигрывает анимация match
        const doIt = await confirmModal({ title: 'Match!', text: 'Общий чат двух групп создан. Открыть его?', confirmLabel: 'Открыть чат', cancelLabel: 'Позже', tone: 'primary' });
        if (doIt && await done) {
          if (openApp !== 'messenger' && openApp !== 'profile' && openApp !== 'groups') showApp('groups');
          await showMatchChatScreen(matchId, null);
        }
      }
      return;
    }

    // ── приглашение в группу: вступить / отклонить ──
    // карточка приглашения во вкладке «Группы» (мимо кнопок) — посмотреть группу, прежде чем ответить
    const inviteCard = e.target.closest('[data-invite-group]');
    if (inviteCard && !e.target.closest('button')) { showGroupDetailsScreen(inviteCard.dataset.inviteGroup); return; }
    const giBtn = e.target.closest('[data-gi-accept], [data-gi-decline]');
    if (giBtn) {
      e.stopPropagation();
      const accept = giBtn.hasAttribute('data-gi-accept');
      const inviteId = accept ? giBtn.dataset.giAccept : giBtn.dataset.giDecline;
      respondGroupInvite(inviteId, accept);   // экран меняется сразу, сервер догоняет в фоне
      return;
    }

    if (e.target.closest('[data-action="open-places"]')) { showPlacesScreen(); return; }
    if (e.target.closest('[data-action="open-wishes"]')) { showWishesScreen(); return; }
    if (e.target.closest('[data-action="new-wish"]')) { showNewWishScreen(); return; }
    if (e.target.closest('[data-action="edit-profile"]')) { showEditProfile(); return; }
    if (e.target.closest('[data-action="open-settings"]')) { showSettingsScreen(); return; }
    if (e.target.closest('[data-action="open-friends"]')) { showFriendsScreen(); return; }
    if (e.target.closest('[data-action="add-friend"]')) { showAddFriendScreen(); return; }
    if (e.target.closest('[data-action="open-groups"]')) { showGroupsScreen(); return; }
    if (e.target.closest('[data-action="create-group"]')) { showCreateGroupScreen(); return; }
    if (e.target.closest('[data-action="back-to-groups"]')) { goBack(); return; }
    if (e.target.closest('[data-action="open-rules"]')) { showRulesScreen(); return; }
    if (e.target.closest('[data-action="open-tour"]')) { openTour(); return; }
    if (e.target.closest('[data-action="open-support"]')) { showSupportChatScreen(); return; }
    if (e.target.closest('[data-action="logout"]')) {
      if (await confirmModal({ title: 'Выйти из аккаунта?', text: 'На этом устройстве нужно будет войти заново.', confirmLabel: 'Выйти' })) logout();
      return;
    }

    const wEdit = e.target.closest('[data-wish-edit]');
    if (wEdit) { showNewWishScreen(wEdit.dataset.wishEdit); return; }
    const wRm = e.target.closest('[data-wish-remove]');
    if (wRm) {
      const id = wRm.dataset.wishRemove;
      const ok = await confirmModal({ title: 'Удалить желание?', text: 'Желание исчезнет у всех. Это действие нельзя отменить.', confirmLabel: 'Удалить' });
      if (!ok) return;
      const { error } = await supabaseClient.from('wishes').delete().eq('id', id);
      if (error) { alert('Не удалось удалить желание: ' + error.message); return; }
      await loadWishesFromDB(); scheduleFeedRender(); quietly(showWishesScreen);
      return;
    }
    const leaveBtn = e.target.closest('[data-leave-group]');
    if (leaveBtn) { e.stopPropagation(); await leaveGroup(leaveBtn.dataset.leaveGroup); return; }
    // настройки группы из её карточки — «назад» возвращает в карточку
    const groupEdit = e.target.closest('[data-group-edit]');
    if (groupEdit) {
      const gid = groupEdit.dataset.groupEdit, back = groupDetailsBack;
      showCreateGroupScreen(gid, () => showGroupDetailsScreen(gid, back));
      return;
    }
    if (e.target.closest('[data-action="new-chat"]')) { openNewChatPicker(); return; }
    const gearBtn = e.target.closest('[data-group-settings]');
    if (gearBtn) { e.stopPropagation(); showCreateGroupScreen(gearBtn.dataset.groupSettings); return; }
    const delBtn = e.target.closest('[data-group-delete]');
    if (delBtn) {
      e.stopPropagation();
      const id = delBtn.dataset.groupDelete;
      const ok = await confirmModal({ title: 'Удалить группу?', text: 'Это действие нельзя отменить.', confirmLabel: 'Удалить' });
      if (!ok) return;
      // группа пропадает из списка сразу, сервер догоняет в фоне
      groups = groups.filter((g) => String(g.id) !== String(id));
      refreshGroupsList(); scheduleFeedRender();
      const { error } = await supabaseClient.from('groups').delete().eq('id', id);
      await refreshGroupsWorld(); refreshGroupsList();
      if (error) alert('Не удалось удалить группу: ' + error.message);
      return;
    }

    const groupCard = e.target.closest('.group-card[data-group-id]');
    if (groupCard) {
      const row = groupCard.closest('.group-row');
      if (row && row.classList.contains('revealed')) { row.classList.remove('revealed'); return; }
      showGroupDetailsScreen(groupCard.dataset.groupId);
      return;
    }

    const addFriendBtn = e.target.closest('[data-add-friend]');
    if (addFriendBtn) {
      const fid = addFriendBtn.dataset.addFriend;
      if (!fid || fid === currentUser.id || friends.some((f) => f.id === fid)) return;
      // Не добавляем сразу — отправляем запрос, человек подтвердит его в уведомлениях.
      // Если от него уже был встречный запрос, сервер сразу примет его.
      // Кнопка отвечает сразу, запрос уходит в фоне; не ушёл — кнопка возвращается
      const label = addFriendBtn.textContent;
      addFriendBtn.disabled = true;
      addFriendBtn.textContent = 'Запрос отправлен';
      supabaseClient.rpc('send_friend_request', { target: fid }).then(async ({ data: status, error: reqErr }) => {
        if (reqErr) {
          console.error('[rpc send_friend_request]', reqErr);
          addFriendBtn.disabled = false; addFriendBtn.textContent = label;
          alert('Не удалось отправить запрос: ' + reqErr.message);
          return;
        }
        if (status !== 'accepted' && status !== 'already_friends') return;
        addFriendBtn.textContent = 'Уже друг';
        // в профиле — теперь можно написать
        if (addFriendBtn.id === 'friend-add' && addFriendBtn.isConnected) addFriendBtn.outerHTML = `<button type="button" class="btn btn-primary" id="friend-open-chat" data-open-dm="${escapeHtml(fid)}">Написать</button>`;
        await loadFriendsFromDB();
        await loadIncomingFriendRequests();
        refreshFriendsList();
      }, (err) => { addFriendBtn.disabled = false; addFriendBtn.textContent = label; alert('Не удалось отправить запрос: ' + (err.message || err)); });
      return;
    }

    const frBtn = e.target.closest('[data-fr-accept], [data-fr-decline]');
    if (frBtn) {
      e.stopPropagation();
      const accept = frBtn.hasAttribute('data-fr-accept');
      const reqId = accept ? frBtn.dataset.frAccept : frBtn.dataset.frDecline;
      respondFriendRequest(reqId, accept);   // экран меняется сразу, сервер догоняет в фоне
      return;
    }

    const rmFriendBtn = e.target.closest('[data-remove-friend]');
    if (rmFriendBtn) {
      const fid = rmFriendBtn.dataset.removeFriend;
      const who = friends.find((f) => String(f.id) === String(fid));
      const ok = await confirmModal({
        title: `Удалить ${who ? '«' + ellipsize(who.name || who.handle || 'друга', 30) + '»' : 'друга'} из друзей?`,
        text: 'Переписка с ним останется в «Чатах».',
        confirmLabel: 'Да, удалить', cancelLabel: 'Нет',
      });
      if (!ok) return;
      // из списка — сразу; сервер догоняет в фоне
      const before = friends;
      optimistic({
        apply() { friends = friends.filter((f) => String(f.id) !== String(fid)); refreshFriendsList(); scheduleStateSave(); },
        send: () => supabaseClient.rpc('remove_friend', { friend_uuid: fid }),
        undo() { friends = before; refreshFriendsList(); scheduleStateSave(); },
        fail: (error) => alert('Не удалось удалить из друзей: ' + (error.message || error)),
        sync: () => refreshFriendsData().then(refreshFriendsList),
      });
      return;
    }

    const dmBtn = e.target.closest('[data-open-dm]');
    if (dmBtn) { await showDmScreen(dmBtn.dataset.openDm); return; }

    const viewBtn = e.target.closest('[data-view]');
    if (viewBtn) {
      placesView = viewBtn.dataset.view === 'grid' ? 'grid' : 'feed';
      savePlacesView(placesView);
      quietly(showPlacesScreen); winBody.scrollTop = 0; animateScreen('fade'); return;
    }
    if (e.target.closest('[data-action="new-post"]')) { showNewPost(); return; }

    const menuBtn = e.target.closest('[data-post-menu]');
    if (menuBtn) { openPostMenu(menuBtn.dataset.postMenu, menuBtn); return; }
    const rm = e.target.closest('[data-remove-post]');
    if (rm) { closePostMenus(); deletePost(rm.dataset.removePost); return; }

    const cell = e.target.closest('.grid-cell[data-post-id]');
    if (cell) {
      jumpToPostInFeed(cell.dataset.postId);
    }
  });

  winBody.addEventListener('click', (e) => {
    const sw = e.target.closest('.switch'); if (!sw) return;
    const key = sw.dataset.setting;
    const next = !(sw.getAttribute('aria-checked') === 'true');
    sw.setAttribute('aria-checked', String(next));
    if (key) {
      settings = { ...settings, [key]: next }; saveSettings(settings);
      // включение — запрос разрешения; не дали или не поддерживается — переключатель возвращается назад
      if (key === 'notifications') {
        if (next) enablePush().then(syncSettingsUi);
        else disablePush().catch((err) => console.warn('[push] disable:', err));
      }
    }
  });

  winBody.addEventListener('click', async (e) => {
    const row = e.target.closest('[data-notif-id]');
    if (row) {
      const id = row.dataset.notifId;
      const n = notifications.find((x) => x.id === id);
      // нажатие мимо кнопок открывает то, о чём уведомление; «назад» возвращает к уведомлениям
      if (n && !e.target.closest('button, a, [data-view-group]')) openNotificationTarget(n);
      await supabaseClient.from('notifications').update({ read: true }).eq('id', id);
      notifications = notifications.map((n) => n.id === id ? { ...n, read: true } : n);
      updateBadge();
    }
  });

  /* ── Сообщение в чате: долгое нажатие или правая кнопка — меню; в режиме выбора нажатие отмечает ── */
  let msgPressTimer = null, msgPressFired = false, msgPressAt = null;
  const chatMsgAt = (target) => {
    const el = target.closest && target.closest('#chat-view-body .chat-msg[data-msg-id]');
    return el && !el.classList.contains('is-pending') ? el : null;
  };
  const msgPressDone = () => { msgPressFired = true; setTimeout(() => { msgPressFired = false; }, 700); };
  winBody.addEventListener('pointerdown', (e) => {
    clearTimeout(msgPressTimer);
    const el = chatMsgAt(e.target);
    // по ссылке в тексте долгое нажатие тоже открывает меню сообщения (ответить, переслать); по файлу — нет
    if (!el || e.pointerType === 'mouse' || e.target.closest('audio, a:not(.chat-link)')) return;
    const id = el.dataset.msgId, x = e.clientX, y = e.clientY;
    msgPressAt = { x, y };
    msgPressTimer = setTimeout(() => {
      msgPressDone();
      if (navigator.vibrate) { try { navigator.vibrate(10); } catch {} }
      if (chat && chat.selecting) toggleChatSelected(id); else openMsgMenu(id, x, y);
    }, 480);
  });
  winBody.addEventListener('pointermove', (e) => {
    if (msgPressAt && Math.hypot(e.clientX - msgPressAt.x, e.clientY - msgPressAt.y) > 10) { clearTimeout(msgPressTimer); msgPressAt = null; }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => winBody.addEventListener(type, () => { clearTimeout(msgPressTimer); msgPressAt = null; }));
  winBody.addEventListener('contextmenu', (e) => {
    const el = chatMsgAt(e.target);
    if (!el) return;
    e.preventDefault();
    clearTimeout(msgPressTimer);
    if (msgPressFired) return;   // меню уже открыто долгим нажатием
    msgPressDone();
    if (chat && chat.selecting) toggleChatSelected(el.dataset.msgId); else openMsgMenu(el.dataset.msgId, e.clientX, e.clientY);
  });
  /* Свайп сообщения влево — ответить на него. Сообщение едет за пальцем; дотянули до отметки — справа
     загорается стрелка, отпустили — над полем ввода появляется цитата. Работает пальцем на экране,
     мышью (зажать и потянуть влево) и двумя пальцами на тачпаде.
     dx везде ниже — на сколько сообщение сдвинули влево (положительное число). */
  const SWIPE_REPLY = 56, SWIPE_MAX = 84;
  const swipePaint = (el, dx) => {
    el.classList.add('is-swiping');
    el.style.transform = `translateX(${-dx}px)`;
    const ready = dx >= SWIPE_REPLY;
    if (ready && !el.classList.contains('is-swipe-ready') && navigator.vibrate) { try { navigator.vibrate(8); } catch {} }
    el.classList.toggle('is-swipe-ready', ready);
  };
  const swipeReset = (el) => { el.classList.remove('is-swiping', 'is-swipe-ready'); el.style.transform = ''; };
  // Жест начался: тянут влево и заметно сильнее, чем по вертикали (иначе это прокрутка ленты)
  const swipeStarts = (dx, dy) => dx >= 12 && dx >= Math.abs(dy) * 1.5;
  const swipeTarget = (e) => {
    if (!chat || chat.selecting) return null;
    const el = chatMsgAt(e.target);
    return el && !e.target.closest('video, [data-voice-seek]') ? el : null;
  };

  // ── пальцем ──
  let msgSwipe = null;
  winBody.addEventListener('touchstart', (e) => {
    msgSwipe = null;
    const el = e.touches.length === 1 ? swipeTarget(e) : null;
    if (el) msgSwipe = { el, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, lock: false };
  }, { passive: true });
  winBody.addEventListener('touchmove', (e) => {
    const s = msgSwipe;
    if (!s) return;
    const dx = s.x - e.touches[0].clientX, dy = e.touches[0].clientY - s.y;
    if (!s.lock) {
      if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)) { msgSwipe = null; return; }
      if (!swipeStarts(dx, dy)) return;
      s.lock = true;
      clearTimeout(msgPressTimer); msgPressAt = null;
    }
    // ленту по горизонтали браузер и так не двигает (у сообщения touch-action: pan-y), поэтому обработчик
    // пассивный: прокрутка пальцем не ждёт скрипт и не подтормаживает
    s.dx = Math.max(0, Math.min(SWIPE_MAX, dx));
    swipePaint(s.el, s.dx);
  }, { passive: true });
  const endMsgSwipe = (fire) => {
    const s = msgSwipe;
    msgSwipe = null;
    if (!s || !s.lock) return;
    swipeReset(s.el);
    if (fire && s.dx >= SWIPE_REPLY) setChatReply(s.el.dataset.msgId);
  };
  winBody.addEventListener('touchend', () => endMsgSwipe(true));
  winBody.addEventListener('touchcancel', () => endMsgSwipe(false));

  // ── мышью: зажать сообщение левой кнопкой и потянуть влево ──
  let mouseSwipe = null;
  winBody.addEventListener('pointerdown', (e) => {
    mouseSwipe = null;
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    const el = swipeTarget(e);
    if (!el || e.target.closest('audio, a, button, input')) return;
    mouseSwipe = { el, x: e.clientX, y: e.clientY, dx: 0, lock: false };
  });
  addEventListener('pointermove', (e) => {
    const s = mouseSwipe;
    if (!s || e.pointerType !== 'mouse') return;
    if (!(e.buttons & 1)) { endMouseSwipe(false); return; }   // кнопку отпустили за пределами окна
    const dx = s.x - e.clientX, dy = e.clientY - s.y;
    if (!s.lock) {
      if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)) { mouseSwipe = null; return; }
      if (!swipeStarts(dx, dy)) return;
      s.lock = true;
    }
    s.dx = Math.max(0, Math.min(SWIPE_MAX, dx));
    swipePaint(s.el, s.dx);
  });
  const endMouseSwipe = (fire) => {
    const s = mouseSwipe;
    mouseSwipe = null;
    if (!s || !s.lock) return;
    swipeReset(s.el);
    msgPressDone();   // отпускание кнопки после перетаскивания — не нажатие: фото и файл не открываются
    if (fire && s.dx >= SWIPE_REPLY) setChatReply(s.el.dataset.msgId);
  };
  addEventListener('pointerup', (e) => { if (e.pointerType === 'mouse') endMouseSwipe(true); });
  addEventListener('pointercancel', (e) => { if (e.pointerType === 'mouse') endMouseSwipe(false); });
  // фото в сообщении не «вытаскивается» из ленты, пока его тянут мышью
  winBody.addEventListener('dragstart', (e) => { if (chatMsgAt(e.target)) e.preventDefault(); });

  /* ── тачпадом: два пальца влево по сообщению ──
     Тачпад присылает прокрутку (wheel): движение пальцев влево — положительный deltaX. Ответ включается сразу,
     как только сообщение дотянули до отметки; остаток жеста и его инерция гасятся, пока прокрутка не стихнет.
     Обработчик пассивный: иначе любая прокрутка ленты тачпадом ждёт скрипт и на ноутбуке подёргивается, пока
     приложение занято (догружает чат). Уход «назад» по истории свайпом гасит overscroll-behavior. */
  let wheelSwipe = null;
  const endWheelSwipe = () => {
    const s = wheelSwipe;
    wheelSwipe = null;
    if (s) { clearTimeout(s.timer); swipeReset(s.el); }
  };
  winBody.addEventListener('wheel', (e) => {
    let s = wheelSwipe;
    if (!s) {
      if (e.ctrlKey || e.deltaX <= 0 || Math.abs(e.deltaX) < Math.abs(e.deltaY) * 1.5) return;
      const el = swipeTarget(e);
      if (!el) return;
      s = wheelSwipe = { el, dx: 0, done: false, timer: 0 };
    }
    clearTimeout(s.timer);
    s.timer = setTimeout(endWheelSwipe, 180);
    if (s.done) return;
    const step = e.deltaMode === 1 ? e.deltaX * 16 : e.deltaX;
    s.dx = Math.max(0, Math.min(SWIPE_MAX, s.dx + step));
    swipePaint(s.el, s.dx);
    if (s.dx >= SWIPE_REPLY) {
      s.done = true;
      const id = s.el.dataset.msgId;
      setTimeout(() => swipeReset(s.el), 140);   // стрелка успевает показаться, и сообщение возвращается
      setChatReply(id);
    }
  }, { passive: true });

  /* ── Список чатов: свайп строки влево открывает «Уведомления» и «Удалить», вправо — прячет ── */
  let chatRowSwipe = null, chatRowSwipedAt = 0;
  winBody.addEventListener('pointerdown', (e) => {
    chatRowSwipe = null;
    const row = e.target.closest && e.target.closest('#chats-list .chat-row');
    const wrap = row ? row.parentElement : (e.target.closest && e.target.closest('.chat-swipe'));
    if (!e.target.closest || !e.target.closest('.popover')) closeChatSwipes(wrap);   // нажали мимо — открытая строка закрывается
    if (!row || (e.pointerType === 'mouse' && e.button !== 0)) return;
    chatRowSwipe = { wrap, x: e.clientX, y: e.clientY, horizontal: null };
  });
  addEventListener('pointermove', (e) => {
    const s = chatRowSwipe;
    if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (s.horizontal === null) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      s.horizontal = Math.abs(dx) > Math.abs(dy);
      if (!s.horizontal) { chatRowSwipe = null; return; }   // это прокрутка списка
    }
    if (dx < -24) { s.wrap.classList.add('revealed'); chatRowSwipedAt = Date.now(); }
    else if (dx > 24) { s.wrap.classList.remove('revealed'); chatRowSwipedAt = Date.now(); }
  });
  ['pointerup', 'pointercancel'].forEach((type) => addEventListener(type, () => { chatRowSwipe = null; }));
  winBody.addEventListener('contextmenu', (e) => {
    const row = e.target.closest && e.target.closest('#chats-list .chat-row');
    if (!row) return;
    e.preventDefault();
    row.parentElement.classList.toggle('revealed');
    chatRowSwipedAt = Date.now();
  });
  // после свайпа отпускание — не нажатие; нажатие по сдвинутой строке только закрывает её
  winBody.addEventListener('click', (e) => {
    const row = e.target.closest && e.target.closest('#chats-list .chat-row');
    if (!row) return;
    const open = row.parentElement.classList.contains('revealed');
    if (!open && Date.now() - chatRowSwipedAt > 450) return;
    e.preventDefault(); e.stopPropagation();
    if (open && Date.now() - chatRowSwipedAt > 450) row.parentElement.classList.remove('revealed');
  }, true);

  // На погружении — раньше остальных обработчиков: в режиме выбора нажатие не открывает фото и файлы
  winBody.addEventListener('click', (e) => {
    const el = chatMsgAt(e.target);
    if (!el) return;
    if (msgPressFired) { msgPressFired = false; e.preventDefault(); e.stopPropagation(); return; }
    if (!chat || !chat.selecting) return;
    e.preventDefault(); e.stopPropagation();
    toggleChatSelected(el.dataset.msgId);
  }, true);

  /* Двойное нажатие на сообщение (пальцем или мышью) — реакция QUICK_REACTION, повторное двойное — снимает её.
     По фото, видео, голосовому, файлу, цитате и плашкам реакций у нажатия своё действие — там не срабатывает */
  let lastMsgTap = null;
  winBody.addEventListener('click', (e) => {
    const el = chatMsgAt(e.target);
    if (!el || !chat || chat.selecting
      || e.target.closest('img, video, audio, a, button, [data-voice], [data-circle], .chat-reply, .chat-reacts, .chat-share')) { lastMsgTap = null; return; }
    const now = Date.now(), id = el.dataset.msgId, t = lastMsgTap;
    if (t && t.id === id && now - t.at < 350 && Math.hypot(e.clientX - t.x, e.clientY - t.y) < 30) {
      lastMsgTap = null;
      toggleChatReaction(id, QUICK_REACTION);
      return;
    }
    lastMsgTap = { id, at: now, x: e.clientX, y: e.clientY };
  });

  /* ═══════ DOCK ═══════ */
  dock.addEventListener('click', (e) => {
    const btn = e.target.closest('.dock-btn'); if (!btn) return;
    const id = btn.dataset.app;
    // иконка «пружинит», а телефон отвечает лёгким щелчком (где есть вибро)
    btn.classList.remove('is-tapped');
    void btn.offsetWidth;
    btn.classList.add('is-tapped');
    if (openApp !== id && navigator.vibrate) { try { navigator.vibrate(8); } catch {} }
    if (openApp === id && id !== 'feed') closeApp(); else showApp(id, btn);
  });
  dock.addEventListener('animationend', (e) => {
    const btn = e.target.closest && e.target.closest('.dock-btn');
    if (btn && e.animationName === 'tab-tap') btn.classList.remove('is-tapped');
  });

  document.getElementById('win-back').addEventListener('click', goBack);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeApp(); });
  // Клик по затемнённой ленте за окном — закрыть окно и вернуться к ленте
  document.getElementById('scrim').addEventListener('click', () => closeApp());

  updateBadge();

  /* ═══════ СТАРТ ═══════ */
  // Пользователь из сессии, сохранённой supabase-js на устройстве (если сервер её отклонил, она уже стёрта)
  function storedSessionUser() {
    try {
      const raw = localStorage.getItem('sb-' + new URL(SUPABASE_URL).hostname.split('.')[0] + '-auth-token');
      const saved = raw ? JSON.parse(raw) : null;
      return saved && saved.user && saved.user.id ? saved.user : null;
    } catch { return null; }
  }

  async function bootApp() {
    /* Вход с прошлого раза сохранён на устройстве — приложение открывается сразу по нему, не дожидаясь сервера.
       Просроченный токен supabase-js обновит сам; если сессию отозвали, придёт SIGNED_OUT и откроется экран входа. */
    let user = storedSessionUser();
    if (!user) {
      try {
        const { data } = await supabaseClient.auth.getSession();
        user = data && data.session ? data.session.user : null;
      } catch (err) { console.warn('[auth] сессия:', err); }
    }
    if (user) {
      currentUser = user;
      const uid = user.id;
      // Профиль — сразу из кеша на устройстве; свежий с сервера подменяет его, когда придёт
      const freshRow = loadProfileRow(uid).then((r) => { if (r) KV.set('profile:' + uid, r); return r; }, () => null);
      let row = await KV.get('profile:' + uid);
      const fromCache = !!row;
      if (!row) row = await freshRow;
      applyUserToProfileFromRow(row || null, currentUser.email);
      if (fromCache) {
        freshRow.then((r) => {
          if (!r || !currentUser || currentUser.id !== uid) return;
          applyUserToProfileFromRow(r, currentUser.email);
        });
      }
      document.body.classList.remove('auth-locked');
      authScreen.hidden = true;
      showFeedApp();
      playChromeEnter();
      await enterAppAfterLogin();
      return;
    }
    document.body.classList.add('auth-locked');
    authScreen.hidden = false;
    showAuthScene();
    dropDevicePush();   // входа нет — подписка прошлого аккаунта этого устройства больше не нужна
    renderAuthLogin();
  }

  // Глобус и логотип проявляются, когда текстура Земли готова — без «пустого» шара и рывков
  function showAuthScene() {
    loadThree().then(() => {
      Globe.init();
      if (!authScreen.hidden) Globe.start();   // пока грузился three.js, могли уже войти
      syncAuthLayout();
      Globe.ready().then(() => { syncAuthLayout(); authScreen.classList.add('is-ready'); });
    });
  }

  supabaseClient.auth.onAuthStateChange((event, s) => {
    accessToken = s ? s.access_token : null;   // для отметки «ушёл из сети», которую шлём при закрытии страницы
    if (event === 'SIGNED_OUT') handleSignedOut();
  });

  bootApp();

  /* UI hookup */
  const offlineBadge = document.getElementById('offline-badge');
  const syncOnline = () => { offlineBadge.hidden = navigator.onLine; };
  addEventListener('online', syncOnline); addEventListener('offline', syncOnline); syncOnline();

  // Связь вернулась: пока её не было, изменения с сервера не приходили — перечитываем данные и подписки
  let wasOffline = !navigator.onLine, reconnectTimer = null;
  addEventListener('offline', () => { wasOffline = true; });
  addEventListener('online', () => {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(async () => {
      if (!wasOffline || !navigator.onLine || !currentUser) return;
      wasOffline = false;
      const uid = currentUser.id;
      const same = () => currentUser && currentUser.id === uid;
      try {
        const row = await loadProfileRow(uid);
        if (!same()) return;
        if (row) { applyUserToProfileFromRow(row, currentUser.email); KV.set('profile:' + uid, row); }
        await Promise.all([
          loadHiddenMessages(), loadPostsFromDB(), loadWishesFromDB(), loadGroupsFromDB(),
          loadNotificationsFromDB(), loadFriendsFromDB(), loadGroupStats(),
        ]);
        if (!same()) return;
        subscribeRealtime();
        updateFilterDot(); updateBadge();
        await loadGroupMemberProfiles();
        if (!same()) return;
        scheduleFeedRender();
        refreshGroupsList(); refreshFriendsList(); refreshNotifications();
        refreshChatSummariesSoon();
        refreshOpenChat();   // сообщения, пришедшие в открытый чат, пока не было связи
      } catch (err) { console.warn('[сеть] обновление после возврата связи:', err); }
    }, 1500);
  });

  let installEvent = null;
  const installBtn = document.getElementById('install-btn');
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvent = e; installBtn.hidden = false; });
  installBtn.addEventListener('click', async () => { if (!installEvent) return; installEvent.prompt(); await installEvent.userChoice; installEvent = null; installBtn.hidden = true; });
  addEventListener('appinstalled', () => { installBtn.hidden = true; });

  const notifBtn = document.getElementById('notif-btn');
  if (notifBtn) notifBtn.addEventListener('click', () => { if (openApp === 'notifications') showFeedApp(); else showApp('notifications', notifBtn); });
  const filterBtn = document.getElementById('filter-btn');
  if (filterBtn) filterBtn.addEventListener('click', () => { if (openApp === 'filters') showFeedApp(); else showApp('filters', filterBtn); });

  /* Fullscreen */
  const fsBtn = document.getElementById('fs-btn');
  const fsRoot = document.documentElement;
  function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  async function toggleFullscreen() {
    try {
      if (isFullscreen()) { if (document.exitFullscreen) await document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); }
      else {
        if (fsRoot.requestFullscreen) await fsRoot.requestFullscreen({ navigationUI: 'hide' });
        else if (fsRoot.webkitRequestFullscreen) fsRoot.webkitRequestFullscreen();
      }
    } catch (err) {}
  }
  if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
  ['fullscreenchange', 'webkitfullscreenchange'].forEach((evt) => document.addEventListener(evt, () => {
    if (fsBtn) fsBtn.classList.toggle('is-active', isFullscreen());
  }));

  /* ── Поворот экрана и смена размера окна ──
     Капсулу панели вкладок и поле чата пересчитываем при любом изменении. На iPad и iPhone новые
     размеры приходят не сразу после поворота, поэтому повторяем пересчёт несколько раз. */
  let kbState = '';   // экранная клавиатура (см. ниже): '' — её нет, 'guess' — вот-вот выедет, 'open' — на экране
  let relayoutTimers = [];
  function relayoutNow() {
    if (dockPill) { dockPill.classList.remove('is-ready'); dockPillLeft = null; dockGeom = null; moveDockPill(); }
    fitChatInput(winBody.querySelector('#chat-text'));   // ширина поля чата могла измениться — текст переносится иначе
  }
  function relayoutApp() {
    relayoutTimers.forEach(clearTimeout);
    requestAnimationFrame(relayoutNow);
    relayoutTimers = [120, 350, 700, 1200].map((ms) => setTimeout(relayoutNow, ms));
  }
  addEventListener('resize', relayoutApp);
  addEventListener('orientationchange', relayoutApp);
  addEventListener('pageshow', relayoutApp);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) relayoutApp(); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', relayoutApp);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', relayoutApp);

  /* ── Экранная клавиатура на телефонах ──
     Когда выезжает клавиатура, страница не становится ниже — клавиатура просто закрывает её нижнюю часть
     (на Android с interactive-widget=resizes-content страница ужимается сама, и почти всё ниже ей не нужно).
     iPhone при этом ещё и прокручивает всю страницу, чтобы поле ввода встало посередине видимой части:
     шапка окна уезжает за верх экрана. Поэтому:
     1) окно приложения ставится ровно в видимую над клавиатурой часть экрана (visualViewport), а панель
        вкладок на это время прячется (html.kb-open в стилях);
     2) окно ужимается сразу при нажатии на поле — по высоте клавиатуры, запомненной с прошлого раза, —
        не дожидаясь, пока она выедет (kbState = 'guess'): поле ни на миг не оказывается под клавиатурой;
     3) на iPhone страницу удерживаем на месте: в момент фокуса поле на один кадр «уносится» далеко вверх,
        и Safari считает, что прокручивать нечего; если страница всё же уехала — возвращаем её;
     4) пока клавиатура открыта, страницу нельзя сдвинуть пальцем — листается только то, что листается
        внутри окна.
     Клавиатура «открыта», если в фокусе текстовое поле и видимая часть заметно ниже обычной высоты экрана.
     Приближение страницы при фокусе в поле (iPhone) убрано отдельно: шрифт полей 16px и maximum-scale=1. */
  const kbHtml = document.documentElement;
  const kbTouch = matchMedia('(pointer: coarse)');
  const KB_SAVED = 'kb.height.v1';
  let kbBase = { w: 0, h: 0 }, kbRaf = 0, kbPoll = 0;
  let kbGuessUntil = 0, kbMiss = 0, kbResets = 0, kbBefore = 0, kbInWindow = false, kbFinger = null, kbTapBroken = false;
  const isTextField = (el) => !!el && !el.disabled && !el.readOnly && (el.tagName === 'TEXTAREA' || el.isContentEditable
    || (el.tagName === 'INPUT' && !/^(checkbox|radio|range|button|submit|reset|file|color|image|hidden)$/i.test(el.type)));
  // только сенсорные экраны: на ноутбуке окно браузера просто сделали ниже — это не клавиатура
  const kbField = (el) => kbTouch.matches && isTextField(el);

  function kbMeasure() {
    // обычная высота экрана — наибольшая, что была при этой ширине (поворот экрана её сбрасывает)
    if (Math.abs(innerWidth - kbBase.w) > 1) kbBase = { w: innerWidth, h: 0 };
    kbBase.h = Math.max(kbBase.h, innerHeight, kbHtml.clientHeight);
  }
  // Высота клавиатуры, запомненная с прошлого раза, — отдельно для экрана стоя и лёжа
  function kbSaved() {
    try { const v = JSON.parse(localStorage.getItem(KB_SAVED) || '{}'); return v && typeof v === 'object' ? v : {}; } catch { return {}; }
  }
  function kbRemember(height) {
    if (!(height > 120)) return;
    const all = kbSaved(), key = kbBase.h >= kbBase.w ? 'p' : 'l';
    if (Math.abs((Number(all[key]) || 0) - height) < 2) return;
    all[key] = Math.round(height);
    try { localStorage.setItem(KB_SAVED, JSON.stringify(all)); } catch {}
  }
  // Какую клавиатуру ждать: как в прошлый раз; если её здесь ещё не видели — на телефоне стоя она занимает около 40% экрана
  function kbGuessHeight() {
    const portrait = kbBase.h >= kbBase.w;
    const saved = Number(kbSaved()[portrait ? 'p' : 'l']) || 0;
    if (saved > 120 && saved < kbBase.h * 0.8) return saved;
    return portrait && kbBase.w < 600 ? Math.round(kbBase.h * 0.4) : 0;
  }

  // Окно приложения — в видимую часть экрана: top — где она начинается (страницу могло сдвинуть), height — её высота
  function kbPlace(top, height) {
    const t = Math.max(0, Math.round(top)) + 'px', h = Math.max(100, Math.round(height)) + 'px';
    if (kbHtml.style.getPropertyValue('--kb-top') !== t) kbHtml.style.setProperty('--kb-top', t);
    if (kbHtml.style.getPropertyValue('--kb-h') !== h) kbHtml.style.setProperty('--kb-h', h);
    kbHtml.classList.add('kb-open');
  }
  function kbBegin(state) {
    if (!kbState) document.addEventListener('touchmove', kbHoldPage, { passive: false, capture: true });
    kbState = state;
  }
  function kbEnd() {
    kbState = '';
    kbResets = 0;
    document.removeEventListener('touchmove', kbHoldPage, true);
    kbHtml.classList.remove('kb-open');
    kbHtml.style.removeProperty('--kb-top');
    kbHtml.style.removeProperty('--kb-h');
    // iPhone иногда оставляет страницу сдвинутой после того, как клавиатура спряталась
    if (window.scrollY || document.scrollingElement.scrollTop) window.scrollTo(0, 0);
    // показывая поле над клавиатурой, браузер мог сдвинуть и то, что двигаться не должно (у этих блоков overflow: hidden)
    for (const box of [document.body, win, authScreen]) {
      if (box && (box.scrollTop || box.scrollLeft)) { box.scrollTop = 0; box.scrollLeft = 0; }
    }
    relayoutApp();
  }

  function syncKeyboard() {
    kbRaf = 0;
    const vv = window.visualViewport;
    if (!vv) return;
    kbMeasure();
    const field = document.activeElement;
    const typing = kbField(field) && vv.scale < 1.05;   // страницу увеличили пальцами — её раскладку не трогаем
    const visible = vv.height * vv.scale;
    if (typing && kbBase.h - visible > 120) {
      const first = kbState !== 'open';
      kbBegin('open');
      kbMiss = 0;
      kbInWindow = !!field.closest('#window');
      /* Страница всё же уехала вверх (так делает iPhone) — возвращаем её: окно и так стоит над клавиатурой.
         Не вышло за несколько попыток — не спорим с телефоном: окно встанет в видимую часть там, куда она уехала. */
      if (kbInWindow && kbResets < 3 && (vv.offsetTop > 0.5 || window.scrollY > 0.5)) { kbResets++; window.scrollTo(0, 0); }
      kbPlace(vv.offsetTop, vv.height);
      if (first) {
        kbRemember((kbBefore > visible + 120 ? kbBefore : kbBase.h) - visible);
        if (kbInWindow) kbReveal(field);
        syncKeyboardSoon();   // сразу перепроверяем: после возврата страницы положение видимой части меняется
      }
      return;
    }
    if (kbState === 'guess' && typing) {
      if (performance.now() < kbGuessUntil) return;   // клавиатура ещё выезжает
      kbMiss++;                                        // поле в фокусе, а клавиатуры нет — подключена настоящая; дважды так — больше не угадываем
    }
    if (kbState) kbEnd();
  }
  const syncKeyboardSoon = () => { if (!kbRaf) kbRaf = requestAnimationFrame(syncKeyboard); };

  // Окно стало ниже — поле, в которое печатают, должно остаться на виду: прокручиваем содержимое окна, а не страницу
  function kbReveal(field) {
    if (!field || field.id === 'chat-text') return;   // поле чата и так стоит у нижнего края окна
    for (let box = field.parentElement; box && box !== document.body; box = box.parentElement) {
      if (box.scrollHeight <= box.clientHeight + 1 || !/auto|scroll/.test(getComputedStyle(box).overflowY)) continue;
      const b = box.getBoundingClientRect(), f = field.getBoundingClientRect();
      const foot = box.querySelector('.pe-foot');   // кнопки, прилипшие к низу окна, закрывают его нижнюю часть
      const low = b.bottom - 16 - (foot ? foot.offsetHeight : 0);
      if (f.bottom > low) box.scrollTop += f.bottom - low;
      else if (f.top < b.top + 16) box.scrollTop -= b.top + 16 - f.top;
      return;
    }
  }

  /* iPhone, отдав фокус полю, прокручивает страницу так, чтобы поле встало посередине видимой части.
     На один кадр «уносим» поле далеко вверх: Safari видит, что оно выше экрана, прокручивать вверх некуда —
     и страница остаётся на месте. */
  function kbHoldStill(el) {
    if (el.kbHeld) return;
    el.kbHeld = true;
    const was = el.style.transform;
    el.style.transform = 'translateY(-2000px)';
    const back = () => { if (el.kbHeld) { el.style.transform = was; el.kbHeld = false; } };
    requestAnimationFrame(back);
    setTimeout(back, 150);   // страховка: поле вернётся на место, даже если кадр не отрисуется
  }

  function kbOnFocus(e) {
    const el = e.target;
    kbInWindow = !!(el && el.closest && el.closest('#window'));
    if (kbInWindow && kbField(el)) {
      if (IS_IOS) kbHoldStill(el);
      const vv = window.visualViewport;
      if (!kbState && vv.scale < 1.05) {
        kbMeasure();
        kbBefore = vv.height * vv.scale;
        // клавиатура выедет через долю секунды — окно ужимаем уже сейчас, чтобы поле не оказалось под ней
        const guess = kbMiss < 2 && kbBase.h - kbBefore < 120 ? kbGuessHeight() : 0;
        if (guess && kbBefore - guess > 160) {
          kbBegin('guess');
          kbGuessUntil = performance.now() + 1100;
          kbPlace(vv.offsetTop, kbBefore - guess);
        }
      }
    }
    syncKeyboardSoon();
    watchKeyboard();
  }

  // Палец на экране: откуда начал движение и что было под ним
  document.addEventListener('touchstart', (e) => {
    const t = e.touches.length === 1 ? e.touches[0] : null;
    kbFinger = t ? { x: t.clientX, y: t.clientY, at: performance.now(), target: e.target, mode: '' } : null;
  }, { passive: true, capture: true });

  // Может ли что-то под пальцем прокрутиться в эту сторону (dy > 0 — палец идёт вниз, содержимое едет к началу)
  function kbCanScroll(el, dy) {
    for (let box = el; box && box.nodeType === 1 && box !== document.body; box = box.parentElement) {
      if (box.scrollHeight <= box.clientHeight + 1 || !/auto|scroll/.test(getComputedStyle(box).overflowY)) continue;
      if (dy > 0 ? box.scrollTop > 0 : box.scrollTop + box.clientHeight < box.scrollHeight - 1) return true;
    }
    return false;
  }
  /* Пока клавиатура открыта, страница под ней «свободна»: iPhone и часть браузеров на Android дают сдвинуть её
     пальцем вместе со всем приложением. Оставляем только прокрутку внутри окна (лента сообщений, списки).
     Обработчик подключается, только пока открыта клавиатура: без неё прокрутка пальцем не ждёт скрипт. */
  function kbHoldPage(e) {
    const f = kbFinger;
    if (!f || !kbState || !kbInWindow || e.touches.length !== 1) return;   // два пальца — щипок, его не трогаем
    if (f.mode === 'hold') { if (e.cancelable) e.preventDefault(); return; }
    if (f.mode) return;
    const t = e.touches[0], dx = t.clientX - f.x, dy = t.clientY - f.y;
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;   // палец лишь дрогнул при нажатии — это не прокрутка, нажатие не трогаем
    // вбок страница не едет; в самом поле ввода палец двигает курсор и выделение — это не трогаем
    if (Math.abs(dx) > Math.abs(dy) || (f.target === document.activeElement && isTextField(f.target))) { f.mode = 'free'; return; }
    f.mode = kbCanScroll(f.target, dy) ? 'free' : 'hold';
    if (f.mode === 'hold' && e.cancelable) e.preventDefault();
  }

  /* Нажатие на поле ввода на iPhone. Фокус отдаём полю сами — уже «унесённому» и с запретом прокрутки:
     если ждать, пока это сделает Safari, он успевает запомнить место поля и всё равно двигает страницу.
     Курсор при этом встаёт в конец текста; чтобы поставить его в середину, по полю нажимают ещё раз. */
  function kbTapFocus(e) {
    const f = kbFinger, t = e.changedTouches[0], el = e.target;
    if (kbTapBroken || !f || f.mode || !t || e.touches.length || !e.cancelable) return;
    if (performance.now() - f.at > 500 || Math.hypot(t.clientX - f.x, t.clientY - f.y) > 10) return;   // не нажатие: держали или вели пальцем
    if (!kbField(el) || el === document.activeElement || !el.closest('#window')) return;
    e.preventDefault();
    kbHoldStill(el);
    try { el.focus({ preventScroll: true }); } catch { el.focus(); }
    if (document.activeElement !== el) kbTapBroken = true;   // фокус не встал — дальше поля нажимаются как обычно
  }
  if (IS_IOS) document.addEventListener('touchend', kbTapFocus, { capture: true });

  /* У приложения, установленного на экран «Домой», iPhone не всегда сообщает, что клавиатура выехала
     (события visualViewport теряются). Поэтому, пока в фокусе текстовое поле, перепроверяем сами. */
  function watchKeyboard() {
    clearInterval(kbPoll); kbPoll = 0;
    if (!kbField(document.activeElement)) return;
    let n = 0;
    kbPoll = setInterval(() => {
      if (!kbField(document.activeElement)) { clearInterval(kbPoll); kbPoll = 0; }
      if (++n < 14 || n % 4 === 0) syncKeyboardSoon();   // первые полторы секунды часто, дальше — раз в полсекунды
    }, 120);
  }
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', syncKeyboardSoon);
    visualViewport.addEventListener('scroll', syncKeyboardSoon);
    addEventListener('scroll', syncKeyboardSoon, { passive: true });
    document.addEventListener('focusin', kbOnFocus);
    // фокус ушёл — клавиатура уезжает; проверяем ещё раз, когда она уже спряталась
    document.addEventListener('focusout', () => { syncKeyboardSoon(); setTimeout(syncKeyboardSoon, 350); });
  }

  /* ── Версия приложения и её обновление ──
     Страница открывается из кеша мгновенно, а свежая в это время подгружается в фоне (sw.js). Раньше свежая
     включалась только со следующего запуска: после обновления сайта приложение нужно было открыть дважды,
     и до этого исправления выглядели «не дошедшими». Теперь страница сама смотрит, какая версия лежит в кеше
     (метка app-build в самом начале страницы):
     — приложение только что открыли и в нём ещё ничего не делают — оно сразу перезагружается на новую версию;
     — позже, чтобы не прерывать человека, новая версия ждёт: включится при следующем запуске или после
       долгого простоя в фоне (UPDATE_IDLE_MS).
     Кнопки «обновить» нет намеренно: приложение обновляется само. */
  const APP_BUILD = (document.querySelector('meta[name="app-build"]') || {}).content || '';
  let appUpdateReady = false;
  // Метка сборки страницы, которая лежит в кеше сервис-воркера (читаем только её начало)
  async function cachedAppBuild() {
    if (!window.caches) return '';
    const url = new URL('./index.html', location.href).href;
    let newest = '';
    for (const name of await caches.keys()) {
      if (!name.startsWith('groupis-') || name.startsWith('groupis-static-')) continue;
      const res = await (await caches.open(name)).match(url);
      if (!res || !res.body) continue;
      const reader = res.body.getReader();
      let head = new Uint8Array(0);
      while (head.length < 4096) {
        const { value, done } = await reader.read();
        if (value) { const next = new Uint8Array(head.length + value.length); next.set(head); next.set(value, head.length); head = next; }
        if (done) break;
      }
      reader.cancel().catch(() => {});
      const m = /<meta\s+name="app-build"\s+content="([^"]*)"/.exec(new TextDecoder().decode(head.subarray(0, 8192)));
      if (m && m[1] > newest) newest = m[1];
    }
    return newest;
  }
  const AUTOUPDATE_KEY = 'groupis.autoupdate';
  // В кеше лежит версия новее той, что на экране
  function appUpdateFound() {
    appUpdateReady = true;
    /* Приложение только что открыли и в нём ещё ничего не делают — новую версию включаем сразу.
       Не чаще раза в две минуты: что бы ни случилось, страница не должна перезагружаться по кругу. */
    let last = 0;
    try { last = Number(sessionStorage.getItem(AUTOUPDATE_KEY)) || 0; } catch {}
    const idle = performance.now() < 25000 && !chat && !isTextField(document.activeElement)
      && !document.querySelector('.photo-viewer, .crop-backdrop, .modal-backdrop');
    if (!idle || Date.now() - last < 120000) return;
    try { sessionStorage.setItem(AUTOUPDATE_KEY, String(Date.now())); } catch { return; }
    saveScreenState();
    location.reload();
  }
  async function checkAppUpdate() {
    if (!APP_BUILD || appUpdateReady) return appUpdateReady;
    let cached = '';
    try { cached = await cachedAppBuild(); } catch (err) { console.warn('[update] check:', err); return false; }
    if (!(cached > APP_BUILD)) return false;   // метки — «год-месяц-день часы:минуты», сравниваются как строки
    if (!appUpdateReady) appUpdateFound();
    return true;
  }
  if (window.caches) {
    // сервис-воркер подгружает свежую страницу в первые секунды после запуска — тогда и смотрим, не новее ли она
    [3000, 7000, 13000, 21000].forEach((ms) => setTimeout(checkAppUpdate, ms));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(checkAppUpdate, 6000); });
  }

  if ('serviceWorker' in navigator) {
    /* Новая версия, которую не включили сразу (см. выше), включается сама, только если приложение было
       свёрнуто долго (UPDATE_IDLE_MS): тогда это незаметно — как новый запуск. Раньше она включалась
       перезагрузкой, как только приложение сворачивали, — и на ноутбуке переход на соседнюю вкладку
       браузера на пару секунд перезагружал страницу. */
    const UPDATE_IDLE_MS = 30 * 60 * 1000;
    const hadController = !!navigator.serviceWorker.controller;
    let updateReady = false, hiddenAt = 0, updateTimer = 0, updateCheckedAt = 0;
    navigator.serviceWorker.addEventListener('controllerchange', async () => {
      if (!hadController) return;   // первая установка — обновлять нечего
      updateReady = true;
      if (await checkAppUpdate()) return;   // в кеше страница новее — она уже отмечена, а то и включена
      /* Метки совпали. Либо страница только что сама перезагрузилась на эту версию (тогда всё уже сделано),
         либо метку сборки забыли поменять — тогда новый сервис-воркер сам по себе признак новой версии. */
      let last = 0;
      try { last = Number(sessionStorage.getItem(AUTOUPDATE_KEY)) || 0; } catch {}
      if (!appUpdateReady && Date.now() - last > 120000) appUpdateFound();
    });
    document.addEventListener('visibilitychange', () => {
      clearTimeout(updateTimer);
      if (document.hidden) {
        hiddenAt = Date.now();
        updateTimer = setTimeout(() => { if ((updateReady || appUpdateReady) && document.hidden) location.reload(); }, UPDATE_IDLE_MS);
        return;
      }
      // телефон «заморозил» свёрнутое приложение и таймер не сработал — обновляемся при возвращении после долгого перерыва
      if ((updateReady || appUpdateReady) && hiddenAt && Date.now() - hiddenAt >= UPDATE_IDLE_MS) location.reload();
      hiddenAt = 0;
    });
    addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        // Установленное приложение подолгу не закрывают: проверяем обновление при возвращении в него, не чаще раза в 5 минут
        document.addEventListener('visibilitychange', () => {
          if (document.hidden || !navigator.onLine || Date.now() - updateCheckedAt < 5 * 60 * 1000) return;
          updateCheckedAt = Date.now();
          reg.update().catch(() => {});
        });
      }).catch((err) => console.warn('SW', err));
    });
  }

  /* Если браузер всё же выгрузил вкладку сам (так делают Safari и Chrome, когда не хватает памяти) или
     страницу обновили, при новой загрузке открывается тот же экран: открытый чат или раздел.
     Хранится в sessionStorage — только для этой вкладки и только 30 минут. */
  const SCREEN_KEY = 'groupis.screen';
  function saveScreenState() {
    if (!currentUser) return;
    try {
      sessionStorage.setItem(SCREEN_KEY, JSON.stringify({
        at: Date.now(), uid: String(currentUser.id),
        open: openApp && openApp !== 'feed' ? openApp : '', chat: chat ? chatKey(chat) : '',
      }));
    } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveScreenState(); });
  addEventListener('pagehide', saveScreenState);

  </script>
</body>
</html>
