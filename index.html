  <script src="./three.min.js"></script>

  <script>
  'use strict';

  function isThreeAvailable() {
    return typeof window.THREE !== 'undefined' && window.THREE.WebGLRenderer;
  }

  /* ═══════════════════════════════════════════════════════════
     АВТОРИЗАЦИЯ И РЕГИСТРАЦИЯ
     ═══════════════════════════════════════════════════════════ */

  const USERS_KEY   = 'users.v1';
  const SESSION_KEY = 'session.v1';

  function loadUsers() {
    try {
      const raw = localStorage.getItem(USERS_KEY);
      if (!raw) return [];
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }
  function saveUsers(list) {
    try { localStorage.setItem(USERS_KEY, JSON.stringify(list)); } catch {}
  }
  function loadSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch { return null; }
  }
  function saveSession(s) {
    try {
      if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    } catch {}
  }

  let users = loadUsers();
  let session = loadSession();

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const PHONE_RE = /^\+?[0-9\s\-()]{7,20}$/;

  function isEmail(v) { return EMAIL_RE.test(String(v).trim()); }
  function isPhone(v) { return PHONE_RE.test(String(v).trim()); }
  function isLogin(v) { return isEmail(v) || isPhone(v); }

  function normalizeLogin(v) {
    v = String(v).trim();
    if (isPhone(v)) return v.replace(/[\s\-()]/g, '');
    return v.toLowerCase();
  }

  const USERNAME_RE_AUTH = /^[a-zA-Z][a-zA-Z0-9_.]{2,19}$/;
  function normalizeUsername(raw) {
    return String(raw).trim().replace(/^@+/, '').toLowerCase();
  }
  function isValidUsername(raw) {
    return USERNAME_RE_AUTH.test(normalizeUsername(raw));
  }

  function isUsernameTaken(raw) {
    const u = normalizeUsername(raw).toLowerCase();
    if (!u) return false;
    if (users.some((x) => x.username === u)) return true;
    if (typeof FAKE_USERS !== 'undefined' && FAKE_USERS.some(
      (f) => f.handle.replace(/^@/, '').toLowerCase() === u
    )) return true;
    return false;
  }

  function findUserByLogin(login) {
    const key = normalizeLogin(login);
    return users.find((u) => u.email === key || u.phone === key) || null;
  }
  function findUserByUsername(username) {
    const u = normalizeUsername(username);
    return users.find((x) => x.username === u) || null;
  }

  function hashPassword(pwd) {
    let h = 5381;
    for (let i = 0; i < pwd.length; i++) {
      h = ((h << 5) + h) ^ pwd.charCodeAt(i);
    }
    return 'h' + (h >>> 0).toString(36) + '_' + pwd.length;
  }
  function verifyPassword(pwd, hash) {
    return hashPassword(pwd) === hash;
  }

  function applyUserToProfile(user) {
    profile = {
      ...DEFAULT_PROFILE,
      name:   user.name   || DEFAULT_PROFILE.name,
      handle: '@' + (user.username || DEFAULT_PROFILE.handle.replace(/^@/, '')),
      bio:    user.bio    || '',
      avatar: user.avatar || '',
    };
    saveProfile(profile);
  }

  function startSession(user) {
    session = { userId: user.id, ts: Date.now() };
    saveSession(session);
    applyUserToProfile(user);
    document.body.classList.remove('auth-locked');
    authScreen.hidden = true;
    if (lastUserLocation && settings.geolocation) {
      placeUserMarker(lastUserLocation);
      syncWishMarkers();
    }
  }

  function logout() {
    saveSession(null);
    session = null;
    profile = { ...DEFAULT_PROFILE };
    saveProfile(profile);
    document.body.classList.add('auth-locked');
    authScreen.hidden = false;
    closeApp();
    renderAuthLogin();
  }

  const authScreen = document.getElementById('auth-screen');
  const authCard   = document.getElementById('auth-card');

  function authHeader({ title, sub, icon = '🔐' }) {
    return `
      <div class="auth-logo" aria-hidden="true">${icon}</div>
      <h1 class="auth-title">${escapeHtml(title)}</h1>
      <p class="auth-sub">${escapeHtml(sub)}</p>
    `;
  }

  function showAuthError(el, msg) {
    el.textContent = msg;
    el.hidden = false;
  }

  function renderAuthLogin() {
    authCard.innerHTML = `
      ${authHeader({ title: 'Добро пожаловать', sub: 'Войдите, чтобы продолжить', icon: '🗺️' })}
      <form class="auth-form" id="auth-login-form" novalidate>
        <label class="auth-field">
          <span class="auth-label">Почта, телефон или @username</span>
          <input class="auth-input" type="text" id="login-ident"
                 autocomplete="username" autocapitalize="off" spellcheck="false"
                 placeholder="you@example.com, +7 900 000-00-00 или @username">
        </label>
        <label class="auth-field">
          <span class="auth-label">Пароль</span>
          <input class="auth-input" type="password" id="login-pwd"
                 autocomplete="current-password" placeholder="Ваш пароль">
        </label>
        <div id="login-error" class="auth-error" hidden></div>
        <button class="auth-btn" type="submit">Войти</button>
        <div class="auth-links">
          <button class="auth-link" type="button" id="go-register">Создать аккаунт</button>
          <button class="auth-link" type="button" id="go-forgot">Забыли пароль?</button>
        </div>
      </form>
    `;

    const form  = authCard.querySelector('#auth-login-form');
    const ident = authCard.querySelector('#login-ident');
    const pwd   = authCard.querySelector('#login-pwd');
    const err   = authCard.querySelector('#login-error');

    authCard.querySelector('#go-register').addEventListener('click', renderAuthRegister);
    authCard.querySelector('#go-forgot').addEventListener('click', renderAuthForgot);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      err.hidden = true;

      const idVal = ident.value.trim();
      const pw    = pwd.value;

      if (!idVal) { showAuthError(err, 'Введите почту, телефон или username'); ident.focus(); return; }
      if (!pw)    { showAuthError(err, 'Введите пароль'); pwd.focus(); return; }

      let user = null;
      if (isLogin(idVal)) {
        user = findUserByLogin(idVal);
      } else {
        user = findUserByUsername(idVal);
      }

      if (!user || !verifyPassword(pw, user.passwordHash)) {
        showAuthError(err, 'Неверные данные для входа. Проверьте логин и пароль.');
        pwd.select();
        return;
      }

      startSession(user);
    });
  }

  function renderAuthForgot() {
    authCard.innerHTML = `
      ${authHeader({ title: 'Восстановление', sub: 'Введите почту или телефон от аккаунта', icon: '🔑' })}
      <form class="auth-form" id="auth-forgot-form" novalidate>
        <label class="auth-field">
          <span class="auth-label">Почта или телефон</span>
          <input class="auth-input" type="text" id="forgot-ident"
                 autocapitalize="off" spellcheck="false"
                 placeholder="you@example.com или +7 900 000-00-00">
        </label>
        <div id="forgot-error" class="auth-error" hidden></div>
        <div id="forgot-ok" class="auth-error" hidden
             style="background:rgba(46,158,91,.12);color:#2E9E5B"></div>
        <button class="auth-btn" type="submit">Сбросить пароль</button>
        <div class="auth-links">
          <button class="auth-link" type="button" id="back-login">← Назад ко входу</button>
        </div>
      </form>
    `;

    const form  = authCard.querySelector('#auth-forgot-form');
    const ident = authCard.querySelector('#forgot-ident');
    const err   = authCard.querySelector('#forgot-error');
    const ok    = authCard.querySelector('#forgot-ok');

    authCard.querySelector('#back-login').addEventListener('click', renderAuthLogin);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      err.hidden = true; ok.hidden = true;

      const v = ident.value.trim();
      if (!v) { showAuthError(err, 'Введите почту или телефон'); return; }

      const user = findUserByLogin(v);
      if (!user) { showAuthError(err, 'Аккаунт с такими данными не найден'); return; }

      const temp = 'temp' + Math.floor(100000 + Math.random() * 900000);
      user.passwordHash = hashPassword(temp);
      saveUsers(users);

      ok.textContent = `Пароль сброшен. Временный пароль: ${temp}. Сохраните его и смените после входа.`;
      ok.hidden = false;
    });
  }

  const REG_STEPS = ['name', 'username', 'gender', 'password', 'age', 'photo', 'bio'];

  function renderAuthRegister() {
    const draft = {
      name: '', username: '', gender: '', password: '',
      age: 18, avatar: '', bio: '',
      email: '', phone: '',
    };
    let stepIdx = 0;

    function renderStep() {
      const step = REG_STEPS[stepIdx];
      const dots = REG_STEPS.map((_, i) => {
        const cls = i === stepIdx ? 'active' : (i < stepIdx ? 'done' : '');
        return `<span class="auth-step-dot ${cls}"></span>`;
      }).join('');

      const stepInfo = {
        name:     { t: 'Как вас зовут?',        s: 'Это имя увидят другие пользователи' },
        username: { t: 'Придумайте username',   s: 'Латиница, цифры, «_» и «.», от 3 до 20 символов' },
        gender:   { t: 'Ваш пол',               s: 'Поможет точнее подбирать компанию' },
        password: { t: 'Придумайте пароль',     s: 'Минимум 6 символов' },
        age:      { t: 'Сколько вам лет?',      s: 'Возраст можно будет изменить позже' },
        photo:    { t: 'Добавьте фото',         s: 'Необязательно, но с ним уютнее' },
        bio:      { t: 'Расскажите о себе',     s: 'Пара слов — и профиль готов' },
      }[step];

      authCard.innerHTML = `
        ${authHeader({ title: 'Создание аккаунта', sub: `Шаг ${stepIdx + 1} из ${REG_STEPS.length}`, icon: '✨' })}
        <div class="auth-steps">${dots}</div>
        <h2 class="auth-step-title">${escapeHtml(stepInfo.t)}</h2>
        <p class="auth-step-sub">${escapeHtml(stepInfo.s)}</p>
        <form class="auth-form" id="reg-form" novalidate>
          <div id="reg-step-body"></div>
          <div id="reg-error" class="auth-error" hidden></div>
          <div class="auth-links" style="justify-content:space-between">
            <button class="auth-link" type="button" id="reg-back">← Назад</button>
            <button class="auth-btn" type="submit" style="width:auto;min-width:140px" id="reg-next">
              ${step === 'bio' ? 'Завершить' : 'Далее'}
            </button>
          </div>
        </form>
      `;

      authCard.querySelector('#reg-back').addEventListener('click', () => {
        if (stepIdx === 0) { renderAuthLogin(); return; }
        stepIdx--;
        renderStep();
      });

      const body = authCard.querySelector('#reg-step-body');
      const err  = authCard.querySelector('#reg-error');
      const form = authCard.querySelector('#reg-form');

      if (step === 'name') {
        body.innerHTML = `
          <label class="auth-field">
            <span class="auth-label">Имя</span>
            <input class="auth-input" type="text" id="reg-name" maxlength="60"
                   value="${escapeHtml(draft.name)}" placeholder="Например, Алексей">
          </label>`;
        setTimeout(() => authCard.querySelector('#reg-name').focus(), 50);

      } else if (step === 'username') {
        body.innerHTML = `
          <label class="auth-field">
            <span class="auth-label">Username</span>
            <div class="username-wrap">
              <span class="username-prefix" aria-hidden="true">@</span>
              <input class="edit-input username-input" type="text" id="reg-username"
                     maxlength="20" autocapitalize="off" autocorrect="off" spellcheck="false"
                     value="${escapeHtml(draft.username)}" placeholder="username">
            </div>
            <span class="username-status" id="uname-status"></span>
          </label>`;
        const unameEl = authCard.querySelector('#reg-username');
        const status  = authCard.querySelector('#uname-status');
        let checkTimer = null;

        const runCheck = () => {
          const v = normalizeUsername(unameEl.value);
          unameEl.value = v;
          if (!v) { status.textContent = ''; status.className = 'username-status'; return; }
          if (!isValidUsername(v)) {
            status.textContent = 'Неверный формат';
            status.className = 'username-status busy';
            return;
          }
          status.innerHTML = `<span class="spinner"></span> Проверяем…`;
          status.className = 'username-status checking';
          clearTimeout(checkTimer);
          checkTimer = setTimeout(() => {
            if (isUsernameTaken(v)) {
              status.textContent = 'Этот username уже занят';
              status.className = 'username-status busy';
            } else {
              status.textContent = 'Свободно ✓';
              status.className = 'username-status ok';
            }
          }, 350);
        };
        unameEl.addEventListener('input', runCheck);
        if (draft.username) runCheck();
        setTimeout(() => unameEl.focus(), 50);

      } else if (step === 'gender') {
        body.innerHTML = `
          <div class="gender-row" id="gender-row">
            <button class="gender-opt" type="button" data-gender="male"
                    aria-pressed="${draft.gender === 'male'}">
              <span class="gender-emoji">👨</span>
              <span class="gender-label">Мужской</span>
            </button>
            <button class="gender-opt" type="button" data-gender="female"
                    aria-pressed="${draft.gender === 'female'}">
              <span class="gender-emoji">👩</span>
              <span class="gender-label">Женский</span>
            </button>
          </div>`;
        authCard.querySelectorAll('.gender-opt').forEach((b) => {
          b.addEventListener('click', () => {
            draft.gender = b.dataset.gender;
            authCard.querySelectorAll('.gender-opt').forEach((x) => {
              x.setAttribute('aria-pressed', String(x.dataset.gender === draft.gender));
            });
          });
        });

      } else if (step === 'password') {
        body.innerHTML = `
          <label class="auth-field">
            <span class="auth-label">Пароль</span>
            <input class="auth-input" type="password" id="reg-pwd"
                   autocomplete="new-password" placeholder="Минимум 6 символов">
          </label>
          <label class="auth-field">
            <span class="auth-label">Повторите пароль</span>
            <input class="auth-input" type="password" id="reg-pwd2"
                   autocomplete="new-password" placeholder="Ещё раз">
          </label>`;
        setTimeout(() => authCard.querySelector('#reg-pwd').focus(), 50);

      } else if (step === 'age') {
        body.innerHTML = `
          <div class="auth-age-row">
            <input type="range" id="reg-age" min="10" max="100" value="${draft.age}">
            <span class="auth-age-value" id="reg-age-value">${draft.age}</span>
          </div>`;
        const r = authCard.querySelector('#reg-age');
        const v = authCard.querySelector('#reg-age-value');
        r.addEventListener('input', () => {
          v.textContent = r.value;
          draft.age = Number(r.value);
        });

      } else if (step === 'photo') {
        body.innerHTML = `
          <div class="auth-avatar-row">
            <div class="auth-avatar-preview" id="reg-avatar">${
              draft.avatar ? '' : escapeHtml((draft.name || '?').charAt(0).toUpperCase() || '?')
            }</div>
            <div class="auth-avatar-side">
              <button type="button" class="btn" id="reg-avatar-pick">Выбрать фото</button>
              <button type="button" class="btn-ghost" id="reg-avatar-remove" ${draft.avatar ? '' : 'hidden'}>Удалить</button>
              <input type="file" id="reg-avatar-input" accept="image/*" hidden>
            </div>
          </div>`;
        const prev = authCard.querySelector('#reg-avatar');
        const inp  = authCard.querySelector('#reg-avatar-input');
        const rm   = authCard.querySelector('#reg-avatar-remove');
        if (draft.avatar) {
          prev.style.backgroundImage = `url('${draft.avatar}')`;
          prev.textContent = '';
        }
        authCard.querySelector('#reg-avatar-pick').addEventListener('click', () => inp.click());
        inp.addEventListener('change', () => {
          const file = inp.files && inp.files[0];
          if (!file || !file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const max = 256;
              const s = Math.min(1, max / Math.max(img.width, img.height));
              const w = Math.round(img.width * s);
              const h = Math.round(img.height * s);
              const c = document.createElement('canvas');
              c.width = w; c.height = h;
              c.getContext('2d').drawImage(img, 0, 0, w, h);
              draft.avatar = c.toDataURL('image/jpeg', 0.85);
              prev.style.backgroundImage = `url('${draft.avatar}')`;
              prev.textContent = '';
              rm.hidden = false;
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
        rm.addEventListener('click', () => {
          draft.avatar = '';
          prev.style.backgroundImage = '';
          prev.textContent = (draft.name || '?').charAt(0).toUpperCase() || '?';
          rm.hidden = true;
        });

      } else if (step === 'bio') {
        body.innerHTML = `
          <label class="auth-field">
            <span class="auth-label">О себе</span>
            <textarea class="edit-textarea" id="reg-bio" maxlength="300"
                      placeholder="Чем увлекаетесь, где любите бывать?">${escapeHtml(draft.bio)}</textarea>
          </label>
          <div class="auth-divider">Контакт для входа</div>
          <label class="auth-field">
            <span class="auth-label">Почта или телефон</span>
            <input class="auth-input" type="text" id="reg-contact"
                   value="${escapeHtml(draft.email || draft.phone)}"
                   autocapitalize="off" spellcheck="false"
                   placeholder="you@example.com или +7 900 000-00-00">
          </label>
          <div class="auth-hint">По нему вы будете входить и сможете восстановить пароль.</div>`;
        setTimeout(() => authCard.querySelector('#reg-bio').focus(), 50);
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        err.hidden = true;

        if (step === 'name') {
          const v = authCard.querySelector('#reg-name').value.trim();
          if (v.length < 2) { showAuthError(err, 'Введите имя (минимум 2 символа)'); return; }
          draft.name = v;
          stepIdx++; renderStep(); return;
        }

        if (step === 'username') {
          const v = normalizeUsername(authCard.querySelector('#reg-username').value);
          if (!isValidUsername(v)) {
            showAuthError(err, 'Username: латиница, цифры, «_» и «.», от 3 до 20 символов');
            return;
          }
          if (isUsernameTaken(v)) {
            showAuthError(err, 'Этот username уже занят, выберите другой');
            return;
          }
          draft.username = v;
          stepIdx++; renderStep(); return;
        }

        if (step === 'gender') {
          if (!draft.gender) { showAuthError(err, 'Выберите пол'); return; }
          stepIdx++; renderStep(); return;
        }

        if (step === 'password') {
          const p1 = authCard.querySelector('#reg-pwd').value;
          const p2 = authCard.querySelector('#reg-pwd2').value;
          if (p1.length < 6) { showAuthError(err, 'Пароль должен быть не короче 6 символов'); return; }
          if (p1 !== p2)     { showAuthError(err, 'Пароли не совпадают'); return; }
          draft.password = p1;
          stepIdx++; renderStep(); return;
        }

        if (step === 'age') {
          draft.age = Number(authCard.querySelector('#reg-age').value) || 18;
          stepIdx++; renderStep(); return;
        }

        if (step === 'photo') {
          stepIdx++; renderStep(); return;
        }

        const contact = authCard.querySelector('#reg-contact').value.trim();
        if (!contact) { showAuthError(err, 'Укажите почту или телефон'); return; }
        if (!isLogin(contact)) {
          showAuthError(err, 'Введите корректную почту или телефон');
          return;
        }

        const email = isEmail(contact) ? normalizeLogin(contact) : '';
        const phone = isPhone(contact) ? normalizeLogin(contact) : '';

        const exists = users.find((u) =>
          (email && u.email === email) || (phone && u.phone === phone)
        );
        if (exists) {
          showAuthError(err, 'Аккаунт с таким контактом уже существует. Войдите.');
          return;
        }

        const newUser = {
          id: 'u' + Date.now(),
          name: draft.name,
          username: draft.username,
          gender: draft.gender,
          age: draft.age,
          avatar: draft.avatar,
          bio: authCard.querySelector('#reg-bio').value.trim(),
          email,
          phone,
          passwordHash: hashPassword(draft.password),
          createdAt: Date.now(),
        };

        users = [newUser, ...users];
        saveUsers(users);

        startSession(newUser);
      });
    }

    renderStep();
  }

  /* ═══════════ 1. 2ГИС + геокодер ═══════════ */
  const MAPGL_API_KEY = '48802321-3481-4b6a-9ff4-58e05aa0fd8b';
  const MAP_START_LOCATION = { center: [37.6156, 55.7558], zoom: 11 };

  let map2gis = null;
  const placeMarkers = new Map();
  const wishMarkers = new Map();
  let openPopupMarker = null;

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Не удалось загрузить ' + src));
      document.head.appendChild(s);
    });
  }

  async function init2GisMap() {
    try {
      await loadScript('https://mapgl.2gis.com/api/js/v1');
      map2gis = new mapgl.Map('map', {
        center: MAP_START_LOCATION.center,
        zoom: MAP_START_LOCATION.zoom,
        key: MAPGL_API_KEY,
      });
      map2gis.on('click', () => {
        if (openApp !== null) {
          closeApp();
        } else {
          closePopup();
        }
      });
      syncPostMarkers();
      syncWishMarkers();
      startGeolocation();
    } catch (err) {
      console.error('[карта] не удалось загрузить 2ГИС:', err);
    }
  }

  /* ═══════════ Настройки ═══════════ */
  const SETTINGS_KEY = 'app.settings.v1';
  const DEFAULT_SETTINGS = { notifications: true, geolocation: true };
  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return { ...DEFAULT_SETTINGS };
      const parsed = JSON.parse(raw);
      // Убираем устаревший ключ offline, если он ещё остался в localStorage
      if (parsed && 'offline' in parsed) delete parsed.offline;
      return { ...DEFAULT_SETTINGS, ...parsed };
    } catch { return { ...DEFAULT_SETTINGS }; }
  }
  function saveSettings(s) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch {}
  }
  let settings = loadSettings();

  /* ═══════════ 3D-аватар ═══════════ */
  const AVATAR_KEY = 'avatar.3d.v1';

  const AVATAR_SKINS = {
    light: { base: 0xF1C9A5 },
    tan:   { base: 0xD9A276 },
    brown: { base: 0xA66A44 },
    dark:  { base: 0x6B3E27 },
  };
  const AVATAR_CLOTHES = {
    rust:  { body: 0x8A4A2F, legs: 0x3F2C24 },
    olive: { body: 0x4A6B33, legs: 0x2A1E16 },
    amber: { body: 0xD9A84A, legs: 0x3F2C24 },
    dark:  { body: 0x3F2C24, legs: 0x1F1611 },
  };
  const AVATAR_HAIRS = {
    none:   { color: null,     style: 'none' },
    short:  { color: 0x3F2C24, style: 'short' },
    long:   { color: 0x5C3A24, style: 'long' },
    blond:  { color: 0xD9A84A, style: 'short' },
    ginger: { color: 0xB85C2B, style: 'long' },
  };
  const DEFAULT_AVATAR = { skin: 'tan', clothes: 'rust', hair: 'short' };

  function loadAvatarConfig() {
    try {
      const raw = localStorage.getItem(AVATAR_KEY);
      if (!raw) return { ...DEFAULT_AVATAR };
      return { ...DEFAULT_AVATAR, ...JSON.parse(raw) };
    } catch { return { ...DEFAULT_AVATAR }; }
  }
  function saveAvatarConfig(a) {
    try { localStorage.setItem(AVATAR_KEY, JSON.stringify(a)); } catch {}
  }
  let avatarConfig = loadAvatarConfig();

  function buildAvatarGroup(THREE, cfg) {
    const skin = AVATAR_SKINS[cfg.skin] || AVATAR_SKINS.tan;
    const clothes = AVATAR_CLOTHES[cfg.clothes] || AVATAR_CLOTHES.rust;
    const hair = AVATAR_HAIRS[cfg.hair] || AVATAR_HAIRS.short;

    const group = new THREE.Group();
    const skinMat = new THREE.MeshStandardMaterial({ color: skin.base, roughness: 0.55 });
    const clothMat = new THREE.MeshStandardMaterial({ color: clothes.body, roughness: 0.85 });
    const legsMat = new THREE.MeshStandardMaterial({ color: clothes.legs, roughness: 0.85 });

    const add = (mesh, x, y, z) => {
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      group.add(mesh);
      return mesh;
    };

    add(new THREE.Mesh(new THREE.SphereGeometry(0.32, 32, 24), skinMat), 0, 1.55, 0);
    const earGeo = new THREE.SphereGeometry(0.07, 16, 12);
    add(new THREE.Mesh(earGeo, skinMat), -0.32, 1.55, 0);
    add(new THREE.Mesh(earGeo, skinMat),  0.32, 1.55, 0);
    const eyeGeo = new THREE.SphereGeometry(0.045, 16, 12);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1F1611, roughness: 0.25 });
    add(new THREE.Mesh(eyeGeo, eyeMat), -0.12, 1.58, 0.29);
    add(new THREE.Mesh(eyeGeo, eyeMat),  0.12, 1.58, 0.29);
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.12, 16), skinMat), 0, 1.28, 0);
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.36, 0.75, 24), clothMat), 0, 0.85, 0);
    const shoulderGeo = new THREE.SphereGeometry(0.17, 20, 16);
    add(new THREE.Mesh(shoulderGeo, clothMat), -0.34, 1.13, 0);
    add(new THREE.Mesh(shoulderGeo, clothMat),  0.34, 1.13, 0);
    const armGeo = new THREE.CylinderGeometry(0.09, 0.08, 0.7, 16);
    const armL = add(new THREE.Mesh(armGeo, clothMat), -0.42, 0.75, 0);
    armL.rotation.z = 0.12;
    const armR = add(new THREE.Mesh(armGeo, clothMat),  0.42, 0.75, 0);
    armR.rotation.z = -0.12;
    const handGeo = new THREE.SphereGeometry(0.09, 16, 12);
    add(new THREE.Mesh(handGeo, skinMat), -0.45, 0.4, 0);
    add(new THREE.Mesh(handGeo, skinMat),  0.45, 0.4, 0);
    const legGeo = new THREE.CylinderGeometry(0.12, 0.11, 0.45, 16);
    add(new THREE.Mesh(legGeo, legsMat), -0.14, 0.23, 0);
    add(new THREE.Mesh(legGeo, legsMat),  0.14, 0.23, 0);
    const shoeGeo = new THREE.BoxGeometry(0.2, 0.1, 0.32);
    const shoeMat = new THREE.MeshStandardMaterial({ color: 0x1F1611, roughness: 0.9 });
    add(new THREE.Mesh(shoeGeo, shoeMat), -0.14, 0.05, 0.04);
    add(new THREE.Mesh(shoeGeo, shoeMat),  0.14, 0.05, 0.04);

    if (hair.color) {
      const hairMat = new THREE.MeshStandardMaterial({ color: hair.color, roughness: 0.8 });
      const cap = new THREE.Mesh(
        new THREE.SphereGeometry(0.335, 32, 24, 0, Math.PI * 2, 0, Math.PI / 1.8),
        hairMat
      );
      add(cap, 0, 1.55, 0);
      if (hair.style === 'long') {
        const back = new THREE.Mesh(
          new THREE.CylinderGeometry(0.28, 0.32, 0.5, 20, 1, true),
          hairMat
        );
        add(back, 0, 1.32, -0.05);
      }
    }

    return group;
  }

  function renderAvatarToCanvas(canvas, size, cfg) {
    if (!isThreeAvailable()) return false;
    const THREE = window.THREE;
    try {
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(size, size, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 20);
      camera.position.set(0, 1.5, 3.6);
      camera.lookAt(0, 1.0, 0);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const key = new THREE.DirectionalLight(0xffd9b3, 1.15);
      key.position.set(3, 5, 3);
      key.castShadow = true;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0x8fa0ff, 0.45);
      fill.position.set(-3, 3, -2);
      scene.add(fill);

      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(0.7, 24),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18 })
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = 0.001;
      scene.add(shadow);

      const group = buildAvatarGroup(THREE, cfg);
      scene.add(group);

      let angle = 0, raf = null;
      function tick() {
        angle += 0.008;
        group.rotation.y = Math.sin(angle) * 0.35;
        renderer.render(scene, camera);
        raf = requestAnimationFrame(tick);
      }
      tick();

      canvas.__avatarStop = () => { if (raf) cancelAnimationFrame(raf); raf = null; };
      return true;
    } catch (err) {
      console.warn('[аватар] не удалось отрендерить 3D:', err);
      return false;
    }
  }

  /* ═══════════ Пользовательский маркер ═══════════ */
  let userLocationMarker = null;
  let userLocationWatchId = null;
  let lastUserLocation = null;
  let userAvatarCanvas = null;

  function placeUserMarker(coords) {
    if (!map2gis) return;

    if (userLocationMarker) {
      try {
        if (userAvatarCanvas && userAvatarCanvas.__avatarStop) userAvatarCanvas.__avatarStop();
        userLocationMarker.destroy();
      } catch {}
      userLocationMarker = null;
      userAvatarCanvas = null;
    }

    const use3D = isThreeAvailable();
    const wrap = document.createElement('div');
    wrap.className = 'user-avatar-wrap';

    const nameInitial = (profile.name || '?').trim().charAt(0).toUpperCase() || '?';
    const displayName = (profile.name || '').trim();
    const handle = (profile.handle || '').trim();
    let label = displayName || handle || 'Я';
    if (label.length > 18) label = label.slice(0, 17) + '…';

    const avatarInner = profile.avatar
      ? `<div class="user-badge-avatar" style="background-image:url('${profile.avatar}')"></div>`
      : `<div class="user-badge-avatar">${escapeHtml(nameInitial)}</div>`;

    const badge = document.createElement('div');
    badge.className = 'user-badge';
    badge.dataset.clickable = 'true';
    badge.innerHTML = `
      <div class="user-badge-inner">
        ${avatarInner}
        <span class="user-badge-name">${escapeHtml(label)}</span>
        <span class="user-badge-status" aria-hidden="true"></span>
      </div>
    `;
    badge.addEventListener('click', (e) => {
      e.stopPropagation();
      showApp('profile');
      showUserProfileScreen();
    });
    wrap.appendChild(badge);

    if (use3D) {
      const inner = document.createElement('div');
      inner.className = 'user-avatar-marker';
      const canvas = document.createElement('canvas');
      canvas.width = 26; canvas.height = 26;
      inner.appendChild(canvas);
      wrap.appendChild(inner);
      const ok = renderAvatarToCanvas(canvas, 26, avatarConfig);
      if (ok) userAvatarCanvas = canvas;
      else inner.className = 'user-dot-marker';
    } else {
      const dot = document.createElement('div');
      dot.className = 'user-dot-marker';
      wrap.appendChild(dot);
    }

    userLocationMarker = new mapgl.HtmlMarker(map2gis, {
      coordinates: coords,
      html: wrap,
      anchor: use3D ? [0.5, 0.85] : [0.5, 0.5],
      preventMapInteractions: true,
    });
  }

  function startGeolocation() {
    if (!settings.geolocation) return;
    if (!('geolocation' in navigator)) return;

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const coords = [pos.coords.longitude, pos.coords.latitude];
        lastUserLocation = coords;
        if (map2gis) { map2gis.setCenter(coords); map2gis.setZoom(16); }
        placeUserMarker(coords);
        syncWishMarkers();
        const btn = document.getElementById('geo-btn');
        if (btn) btn.classList.add('is-active');
      },
      (err) => console.info('[гео] позиция недоступна:', err.message),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );

    if (userLocationWatchId === null) {
      userLocationWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const coords = [pos.coords.longitude, pos.coords.latitude];
          lastUserLocation = coords;
          placeUserMarker(coords);
          syncWishMarkers();
        },
        (err) => console.info('[гео] watchPosition:', err.message),
        { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 }
      );
    }
  }

  function stopGeolocation() {
    if (userLocationWatchId !== null) {
      try { navigator.geolocation.clearWatch(userLocationWatchId); } catch {}
      userLocationWatchId = null;
    }
    if (userLocationMarker) {
      try {
        if (userAvatarCanvas && userAvatarCanvas.__avatarStop) userAvatarCanvas.__avatarStop();
        userLocationMarker.destroy();
      } catch {}
      userLocationMarker = null;
    }
    userAvatarCanvas = null;
    lastUserLocation = null;
    const btn = document.getElementById('geo-btn');
    if (btn) btn.classList.remove('is-active');
  }

  function goToUserLocation() {
    if (!map2gis) return;
    if (!settings.geolocation) {
      settings.geolocation = true;
      saveSettings(settings);
      syncSettingsUi();
      startGeolocation();
      return;
    }
    if (lastUserLocation) {
      map2gis.setCenter(lastUserLocation);
      map2gis.setZoom(16);
      placeUserMarker(lastUserLocation);
      syncWishMarkers();
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const coords = [pos.coords.longitude, pos.coords.latitude];
        lastUserLocation = coords;
        map2gis.setCenter(coords);
        map2gis.setZoom(16);
        placeUserMarker(coords);
        syncWishMarkers();
        const btn = document.getElementById('geo-btn');
        if (btn) btn.classList.add('is-active');
      },
      (err) => console.warn('[гео] не удалось получить позицию:', err.message),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function syncSettingsUi() {
    document.querySelectorAll('.switch[data-setting]').forEach((el) => {
      const key = el.dataset.setting;
      el.setAttribute('aria-checked', String(!!settings[key]));
    });
  }

  document.getElementById('geo-btn').addEventListener('click', goToUserLocation);

  /* ═══════════ Маркеры воспоминаний ═══════════ */
  function buildMemoryMarkerElement(post) {
    const imgs = postImages(post);
    const el = document.createElement('div');
    el.className = 'memory-marker';

    if (!imgs.length) {
      el.innerHTML = `
        <div class="memory-fan">
          <div class="memory-card" style="transform: translate(-50%, -50%) rotate(0deg);">
            <div class="mc-img no-photo"></div>
          </div>
        </div>`;
      return el;
    }

    if (imgs.length === 1) {
      el.innerHTML = `
        <div class="memory-fan">
          <div class="memory-card" style="transform: translate(-50%, -50%) rotate(0deg);">
            <div class="mc-img" style="background-image:url('${imgs[0]}')"></div>
          </div>
        </div>`;
      return el;
    }

    const max = 4;
    const visible = Math.min(imgs.length, max);
    const total = visible;
    const anglesByCount = { 2: [-12, 6], 3: [-14, 0, 14], 4: [-18, -6, 6, 18] };
    const shiftsByCount = { 2: [-11, 11], 3: [-16, 0, 16], 4: [-20, -7, 7, 20] };
    const angles = anglesByCount[total] || anglesByCount[4];
    const shifts = shiftsByCount[total] || shiftsByCount[4];

    const cards = [];
    for (let i = 0; i < total; i++) {
      const imgIndex = (total - 1 - i);
      const src = imgs[imgIndex] || imgs[0];
      cards.push({ src, angle: angles[i], shift: shifts[i], z: i + 1 });
    }
    const hiddenCount = Math.max(0, imgs.length - total);

    el.innerHTML = `
      <div class="memory-fan">
        ${cards.map((c) => `
          <div class="memory-card" style="
            transform: translate(-50%, -50%) translateX(${c.shift}px) rotate(${c.angle}deg);
            z-index: ${c.z};
          ">
            <div class="mc-img" style="background-image:url('${c.src}')"></div>
          </div>
        `).join('')}
        ${hiddenCount > 0 ? `<span class="memory-more">+${hiddenCount}</span>` : ''}
      </div>`;

    return el;
  }

  function syncPostMarkers() {
    if (!map2gis) return;

    const aliveIds = new Set(posts.filter((p) => Array.isArray(p.coords)).map((p) => p.id));

    for (const [id, marker] of [...placeMarkers.entries()]) {
      if (!aliveIds.has(id)) {
        try { marker.destroy(); } catch {}
        placeMarkers.delete(id);
      }
    }

    for (const p of posts) {
      if (!Array.isArray(p.coords)) continue;

      if (placeMarkers.has(p.id)) {
        const oldMarker = placeMarkers.get(p.id);
        try { oldMarker.destroy(); } catch {}
        placeMarkers.delete(p.id);
      }

      const html = buildMemoryMarkerElement(p);
      html.addEventListener('click', (e) => {
        e.stopPropagation();
        openPostPopup(p);
      });

      const marker = new mapgl.HtmlMarker(map2gis, {
        coordinates: p.coords,
        html,
        anchor: [0.5, 1],
        preventMapInteractions: false,
      });

      placeMarkers.set(p.id, marker);
    }
  }

  function openPostPopup(post) {
    closePopup();
    if (!map2gis) return;

    const cover = (Array.isArray(post.images) && post.images[0]) || post.image || '';

    const wrap = document.createElement('div');
    wrap.className = 'map-popup';
    wrap.innerHTML = `
      ${cover ? `<img class="pop-img" src="${cover}" alt="">` : ''}
      <div class="pop-place">📍 ${escapeHtml(post.place || '')}</div>
      ${post.caption ? `<div class="pop-caption">${escapeHtml(post.caption)}</div>` : ''}
      <button type="button" class="pop-open">Открыть воспоминание</button>
    `;
    wrap.querySelector('.pop-open').addEventListener('click', (e) => {
      e.stopPropagation();
      closePopup();
      jumpToPostInFeed(post.id);
    });

    openPopupMarker = new mapgl.HtmlMarker(map2gis, {
      coordinates: post.coords,
      html: wrap,
      anchor: [0.5, 1],
      preventMapInteractions: false,
    });
  }

  function closePopup() {
    if (!openPopupMarker || !map2gis) { openPopupMarker = null; return; }
    try { openPopupMarker.destroy(); } catch {}
    openPopupMarker = null;
  }

  function jumpToPostInFeed(postId) {
    showApp('profile');
    showPlacesScreen();
    placesView = 'feed';
    savePlacesView('feed');
    showPlacesScreen();
    requestAnimationFrame(() => {
      const idx = posts.findIndex((x) => x.id === postId);
      const el = winBody.querySelectorAll('.post')[idx];
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    });
  }

  function flyToPost(post) {
    if (!map2gis || !Array.isArray(post.coords)) return;
    map2gis.setCenter(post.coords);
    map2gis.setZoom(15);
  }

  async function geocodePlace(placeText) {
    if (!placeText) return null;
    const url = new URL('https://catalog.api.2gis.com/3.0/items/geocode');
    url.searchParams.set('q', placeText);
    url.searchParams.set('fields', 'items.point');
    url.searchParams.set('key', MAPGL_API_KEY);

    try {
      const res = await fetch(url.toString());
      if (!res.ok) { console.warn('[геокодер] HTTP', res.status); return null; }
      const data = await res.json();
      const items = (data && data.result && data.result.items) || [];
      if (!items.length) { console.info('[геокодер] ничего не найдено:', placeText); return null; }
      const point = items[0].point;
      if (!point || typeof point.lon !== 'number' || typeof point.lat !== 'number') return null;
      return [point.lon, point.lat];
    } catch (err) {
      console.warn('[геокодер] ошибка запроса:', err);
      return null;
    }
  }

  /* ═══════════ Желания ═══════════ */
  const WISHES_KEY = 'wishes.v1';

  function loadWishes() {
    try {
      const raw = localStorage.getItem(WISHES_KEY);
      if (!raw) return [];
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }
  function saveWishes(list) {
    try { localStorage.setItem(WISHES_KEY, JSON.stringify(list)); } catch {}
  }
  let wishes = loadWishes();

  const MY_USER_ID = 'me';

  function visibleWishes() {
    const myGroupIds = new Set(groups.map((g) => g.id));
    return wishes.filter((w) => {
      const audience = w.audience || (w.groupId ? 'group' : 'all');
      if (w.authorId === MY_USER_ID) return true;
      if (audience === 'all') return true;
      if (audience === 'friends') return true;
      if (audience === 'group') return w.groupId && myGroupIds.has(w.groupId);
      return false;
    });
  }

  function wishesToRenderAsMarkers() {
    return visibleWishes().filter((w) => {
      if (w.authorId === MY_USER_ID && !Array.isArray(w.coords)) return true;
      return Array.isArray(w.coords);
    });
  }

  function wishCoordinates(w) {
    if (w.authorId === MY_USER_ID && !Array.isArray(w.coords)) {
      return lastUserLocation;
    }
    return Array.isArray(w.coords) ? w.coords : null;
  }

  function buildWishMarkerElement(wish) {
    const el = document.createElement('div');
    el.className = 'wish-marker';

    const text = escapeHtml(wish.text || '');
    const author = wish.authorName ? escapeHtml(wish.authorName) : '';

    el.innerHTML = `
      <svg class="wish-cloud-shape" viewBox="0 0 220 140" preserveAspectRatio="none" aria-hidden="true">
        <path class="cloud-body" d="
          M 44 118
          C 20 118, 6 104, 6 86
          C 6 68, 20 56, 38 56
          C 40 36, 60 20, 82 20
          C 98 20, 112 28, 120 42
          C 128 26, 146 14, 166 14
          C 190 14, 210 32, 212 56
          C 216 58, 218 62, 218 70
          C 218 88, 204 102, 184 104
          C 180 114, 166 124, 150 124
          C 140 124, 132 121, 124 114
          C 116 122, 102 126, 90 126
          C 72 126, 56 120, 48 110
          Z"/>
      </svg>
      <div class="wish-cloud-content">
        ${text}
        ${author ? `<span class="wish-author">${author}</span>` : ''}
      </div>
    `;
    return el;
  }

  function syncWishMarkers() {
    if (!map2gis) return;

    const list = wishesToRenderAsMarkers().filter((w) => Array.isArray(wishCoordinates(w)));
    const alive = new Set(list.map((w) => w.id));

    for (const [id, marker] of [...wishMarkers.entries()]) {
      if (!alive.has(id)) {
        try { marker.destroy(); } catch {}
        wishMarkers.delete(id);
      }
    }

    for (const w of list) {
      const coords = wishCoordinates(w);
      if (!coords) continue;

      if (wishMarkers.has(w.id)) {
        try { wishMarkers.get(w.id).destroy(); } catch {}
        wishMarkers.delete(w.id);
      }

      const html = buildWishMarkerElement(w);
      html.addEventListener('click', (e) => {
        e.stopPropagation();
        showApp('profile');
        showWishesScreen();
      });

      const pinnedToUser = w.authorId === MY_USER_ID && !Array.isArray(w.coords);
      const marker = new mapgl.HtmlMarker(map2gis, {
        coordinates: coords,
        html,
        anchor: [0.5, 1],
        offset: pinnedToUser ? [0, -34] : [0, 0],
        preventMapInteractions: false,
      });

      wishMarkers.set(w.id, marker);
    }
  }

  function bindCarousels() {
    winBody.querySelectorAll('[data-carousel]').forEach((el) => {
      const slides = el.querySelector('.slides');
      const dots = [...el.querySelectorAll('.dot')];
      const counter = el.querySelector('[data-idx]');
      const prevBtn = el.querySelector('.arrow.prev');
      const nextBtn = el.querySelector('.arrow.next');
      if (!slides) return;

      const count = dots.length || (slides.children.length || 1);
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'region');
      el.setAttribute('aria-label', 'Галерея фотографий. Листайте стрелками влево и вправо.');

      const currentIndex = () => {
        const w = slides.clientWidth || 1;
        return Math.max(0, Math.min(count - 1, Math.round(slides.scrollLeft / w)));
      };
      const goTo = (i, behavior = 'smooth') => {
        const idx = Math.max(0, Math.min(count - 1, i));
        slides.scrollTo({ left: idx * slides.clientWidth, behavior });
      };
      const updateUi = () => {
        const i = currentIndex();
        dots.forEach((d, k) => d.classList.toggle('active', k === i));
        if (counter) counter.textContent = String(i + 1);
        if (prevBtn) prevBtn.disabled = i === 0;
        if (nextBtn) nextBtn.disabled = i === count - 1;
      };

      slides.addEventListener('scroll', updateUi, { passive: true });
      prevBtn && prevBtn.addEventListener('click', () => goTo(currentIndex() - 1));
      nextBtn && nextBtn.addEventListener('click', () => goTo(currentIndex() + 1));
      dots.forEach((d, i) => d.addEventListener('click', () => goTo(i)));

      el.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); goTo(currentIndex() + 1); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(currentIndex() - 1); }
        else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
        else if (e.key === 'End') { e.preventDefault(); goTo(count - 1); }
      });

      let dragging = false, startX = 0, startScroll = 0, moved = false;
      slides.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse') return;
        dragging = true; moved = false;
        startX = e.clientX; startScroll = slides.scrollLeft;
        slides.classList.add('is-dragging');
        try { slides.setPointerCapture(e.pointerId); } catch {}
      });
      slides.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 3) moved = true;
        slides.scrollLeft = startScroll - dx;
      });
      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        slides.classList.remove('is-dragging');
        try { slides.releasePointerCapture(e.pointerId); } catch {}
        if (moved) goTo(currentIndex());
        else el.focus({ preventScroll: true });
      };
      slides.addEventListener('pointerup', endDrag);
      slides.addEventListener('pointercancel', endDrag);
      slides.addEventListener('pointerleave', (e) => { if (dragging) endDrag(e); });

      el.addEventListener('click', (e) => {
        if (!e.target.closest('.arrow') && !e.target.closest('.dot')) {
          el.focus({ preventScroll: true });
        }
      });

      updateUi();
    });
  }

  function confirmModal({ title, text, confirmLabel = 'Удалить', cancelLabel = 'Отмена' }) {
    return new Promise((resolve) => {
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      back.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <h3 class="modal-title">${escapeHtml(title)}</h3>
          <p class="modal-text">${escapeHtml(text)}</p>
          <div class="modal-actions">
            <button type="button" class="btn" data-cancel>${escapeHtml(cancelLabel)}</button>
            <button type="button" class="btn btn-danger" data-confirm>${escapeHtml(confirmLabel)}</button>
          </div>
        </div>`;
      winBody.appendChild(back);

      const cleanup = () => back.remove();
      const onCancel = () => { cleanup(); resolve(false); };
      const onConfirm = () => { cleanup(); resolve(true); };

      back.querySelector('[data-cancel]').addEventListener('click', onCancel);
      back.querySelector('[data-confirm]').addEventListener('click', onConfirm);
      back.addEventListener('click', (e) => { if (e.target === back) onCancel(); });
      const onKey = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); document.removeEventListener('keydown', onKey, true); onCancel(); }
      };
      document.addEventListener('keydown', onKey, true);
      back.querySelector('[data-confirm]').focus();
    });
  }

    posts = posts.filter((x) => x.id !== postId);
    savePosts(posts);

      const fileInput = winBody.querySelector('#post-input');
      const countEl = winBody.querySelector('#photo-count');
      const placeInput = winBody.querySelector('#post-place');

      function refreshGrid() {
        grid.innerHTML = pendingImages.map((src, i) => `
          <div class="post-thumb ${i === 0 ? 'cover-badge' : ''}" data-idx="${i}" style="background-image:url('${src}')">

      refreshGrid();

      winBody.querySelector('#post-pick').addEventListener('click', () => fileInput.click());

      grid.addEventListener('click', (e) => {
        const b = e.target.closest('[data-remove]');
        if (!b) return;
        const i = Number(b.dataset.remove);
        pendingImages.splice(i, 1);
        refreshGrid();

      fileInput.addEventListener('change', async () => {
        const files = [...(fileInput.files || [])];
        fileInput.value = '';
        if (!files.length) return;
        for (const file of files) {
          if (pendingImages.length >= MAX_PHOTOS) break;
          if (!file.type.startsWith('image/')) continue;
          try {
            const dataUrl = await fileToCompressedDataURL(file, 1280, 0.85);
            pendingImages.push(dataUrl);
          } catch (err) {

        refreshGrid();

        e.preventDefault();

        syncPostMarkers();
        showPlacesScreen();

        if (coords && map2gis) {
          map2gis.setCenter(coords);

        }
      });
    }, () => showPlacesScreen());
  }

  function fileToCompressedDataURL(file, maxSide = 1280, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error);
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('image decode error'));
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  let avatarStageCleanup = null;
  function setupAvatarStage(canvas) {
    if (avatarStageCleanup) { avatarStageCleanup(); avatarStageCleanup = null; }
    if (!isThreeAvailable()) {
      canvas.style.display = 'none';
      const msg = document.createElement('div');
      msg.style.cssText = 'display:grid;place-items:center;height:100%;color:var(--ink-soft);font-size:13px;text-align:center;padding:20px;';
      msg.textContent = '3D-просмотр недоступен. Проверьте, что файл three.min.js лежит рядом с main.html.';
      canvas.parentNode.appendChild(msg);
      return;
    }

    const THREE = window.THREE;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(canvas.clientWidth || 480, canvas.clientHeight || 240, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, (canvas.clientWidth || 480) / (canvas.clientHeight || 240), 0.1, 100);
    camera.position.set(0, 1.5, 4);
    camera.lookAt(0, 1.0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const key = new THREE.DirectionalLight(0xffd9b3, 1.2);
    key.position.set(3, 5, 3);
    key.castShadow = true;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x8fa0ff, 0.45);
    fill.position.set(-3, 3, -2);
    scene.add(fill);

    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(0.7, 32),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18 })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.001;
    scene.add(shadow);

    let group = buildAvatarGroup(THREE, avatarConfig);
    scene.add(group);

    let t = 0, raf = null;
    function tick() {
      t += 0.012;
      group.rotation.y = Math.sin(t) * 0.6;
      renderer.render(scene, camera);
      raf = requestAnimationFrame(tick);
    }
    tick();

    function onResize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize);

    canvas.__avatarRefresh = () => {
      scene.remove(group);
      group.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
          else o.material.dispose();
        }
      });
      group = buildAvatarGroup(THREE, avatarConfig);
      scene.add(group);
    };

    avatarStageCleanup = () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
    };
  }

  function bindGroupSwipe() {
    winBody.querySelectorAll('.group-row').forEach((row) => {
      const card = row.querySelector('.group-card');
      if (!card) return;

      let startX = 0, startY = 0;
      let dragging = false, decided = false, horizontal = false;
      const THRESHOLD = 6;

      card.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        dragging = true;
        decided = false;
        horizontal = false;
        startX = e.clientX;
        startY = e.clientY;
        try { card.setPointerCapture(e.pointerId); } catch {}
      });

      card.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (!decided) {
          if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return;
          decided = true;
          horizontal = Math.abs(dx) > Math.abs(dy);
        }
        if (!horizontal) return;

        if (dx < -20) row.classList.add('revealed');
        else if (dx > 20) row.classList.remove('revealed');
      });

      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        decided = false;
        try { card.releasePointerCapture(e.pointerId); } catch {}
      };
      card.addEventListener('pointerup', endDrag);
      card.addEventListener('pointercancel', endDrag);

      card.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        row.classList.toggle('revealed');
      });
    });

    winBody.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.group-row')) return;
      winBody.querySelectorAll('.group-row.revealed').forEach((r) => r.classList.remove('revealed'));
    });
  }

        showGroupsScreen();
      });

  const SUPPORT_KEY = 'support.chat.v1';

  function loadSupportChat() {
    try {
      const raw = localStorage.getItem(SUPPORT_KEY);
      if (!raw) return [];
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }
  function saveSupportChat(list) {
    try { localStorage.setItem(SUPPORT_KEY, JSON.stringify(list)); } catch {}
  }
  let supportChat = loadSupportChat();

  function fmtTime(ts) {
    const d = new Date(ts || Date.now());
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  function renderSupportChatHtml() {
    if (!supportChat.length) {
      return `<div class="support-chat-head">Напишите нам — отвечаем в течение дня</div>
              <div class="support-chat-body" id="support-body">
                <div class="chat-msg them">Здравствуйте! Это техподдержка приложения «Карта». Опишите, пожалуйста, вашу проблему.<span class="chat-msg-time">${fmtTime(Date.now())}</span></div>
              </div>`;
    }
    return `<div class="support-chat-head">Техподдержка</div>
            <div class="support-chat-body" id="support-body">
              ${supportChat.map((m) => `
                <div class="chat-msg ${m.from === 'me' ? 'me' : 'them'}">
                  ${escapeHtml(m.text)}
                  <span class="chat-msg-time">${fmtTime(m.ts)}</span>
                </div>
              `).join('')}
            </div>`;
  }

  function showSupportChatScreen() {
    setScreen(() => {
      winTitle.textContent = 'Техподдержка';
      winBody.scrollTop = 0;

      winBody.innerHTML = `
        <div class="support-chat">
          ${renderSupportChatHtml()}
          <form class="support-chat-form" id="support-form" novalidate>
            <input class="support-chat-input" type="text" id="support-input"
                   placeholder="Опишите проблему…" maxlength="500" autocomplete="off">
            <button class="support-chat-send" type="submit">Отправить</button>
          </form>
        </div>
      `;

      // Стилизуем контейнер, чтобы flex работал по всей высоте окна
      winBody.style.display = 'flex';
      winBody.style.flexDirection = 'column';
      winBody.style.padding = '0';

      const form  = winBody.querySelector('#support-form');
      const input = winBody.querySelector('#support-input');
      const bodyEl = winBody.querySelector('#support-body');

      // Прокрутка вниз
      if (bodyEl) bodyEl.scrollTop = bodyEl.scrollHeight;
      setTimeout(() => { try { input.focus(); } catch {} }, 50);

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        supportChat.push({ from: 'me', text, ts: Date.now() });
        input.value = '';
        saveSupportChat(supportChat);

        // Перерисовываем ленту и ставим автоответ через секунду
        const body = winBody.querySelector('#support-body');
        if (body) {
          const el = document.createElement('div');
          el.className = 'chat-msg me';
          el.innerHTML = `${escapeHtml(text)}<span class="chat-msg-time">${fmtTime(Date.now())}</span>`;
          body.appendChild(el);
          body.scrollTop = body.scrollHeight;
        }

        setTimeout(() => {
          const reply = 'Спасибо за обращение! Мы получили ваш запрос и ответим в ближайшее время.';
          supportChat.push({ from: 'them', text: reply, ts: Date.now() });
          saveSupportChat(supportChat);
          const b = winBody.querySelector('#support-body');
          if (b) {
            const el = document.createElement('div');
            el.className = 'chat-msg them';
            el.innerHTML = `${escapeHtml(reply)}<span class="chat-msg-time">${fmtTime(Date.now())}</span>`;
            b.appendChild(el);
            b.scrollTop = b.scrollHeight;
          }
        }, 900);
      });
    }, () => {
      // Возвращаем win-body к стандартному поведению при уходе с чата
      winBody.style.display = '';
      winBody.style.flexDirection = '';
      winBody.style.padding = '';
      showApp('settings');
    });
  }

  function renderUserProfileAvatar(canvas, size, cfg) {
    if (!isThreeAvailable()) return null;
    const THREE = window.THREE;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(size, size, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 20);
    camera.position.set(0, 1.5, 3.8);
    camera.lookAt(0, 1.0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const key = new THREE.DirectionalLight(0xffd9b3, 1.15);
    key.position.set(3, 5, 3);
    key.castShadow = true;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x8fa0ff, 0.45);
    fill.position.set(-3, 3, -2);
    scene.add(fill);

    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(0.7, 24),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.16 })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.001;
    scene.add(shadow);

    const group = buildAvatarGroup(THREE, cfg);
    scene.add(group);

    let angle = 0, raf = null;
    function tick() {
      angle += 0.008;
      group.rotation.y = Math.sin(angle) * 0.35;
      renderer.render(scene, camera);
      raf = requestAnimationFrame(tick);
    }
    tick();

    return () => {
      if (raf) cancelAnimationFrame(raf);
      renderer.dispose();
    };
  }

  function renderFeedForUser(list) {
    if (!list.length) return '';
    return `

          const multi = imgs.length > 1;
          const mediaHtml = multi
            ? `

                <div class="slides">
                  ${imgs.map((src) => `<div class="slide"><img src="${src}" alt="" loading="lazy"></div>`).join('')}

                  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6 8 12l7.4 7.4 1.4-1.4L10.8 12l6-6z"/></svg>
                </button>

                  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.6 4.6 7.2 6l6 6-6 6 1.4 1.4L16 12z"/></svg>
                </button>
                <span class="counter"><span data-idx>1</span>/${imgs.length}</span>
                <div class="dots">
                  ${imgs.map((_, i) => `<button type="button" class="dot ${i === 0 ? 'active' : ''}" aria-label="Фото ${i + 1}"></button>`).join('')}
                </div>
              </div>`
            : `<img class="post-media" src="${imgs[0] || ''}" alt="" loading="lazy">`;

          return `
            <article class="post" data-post-id="${p.id}">
              <header class="post-head">
                ${profile.avatar
                  ? `<span class="avatar" style="background-image:url('${profile.avatar}')"></span>`
                  : `<span class="avatar" style="background:linear-gradient(#6E7EFF,#3D4EB8)">${escapeHtml((profile.name || '?').trim().charAt(0).toUpperCase() || '?')}</span>`}
                <div class="row-main">
                  <div class="post-author">${escapeHtml(p.author || profile.name)}</div>
                  <div class="post-place">📍 ${escapeHtml(p.place || '')}</div>
                </div>
                <span class="row-time">${escapeHtml(p.time || '')}</span>
              </header>
              ${mediaHtml}
              ${p.caption ? `<div class="post-body"><div class="post-caption">${escapeHtml(p.caption)}</div></div>` : ''}
            </article>`;
        }).join('')}
      </div>`;
  }

  function showEditProfile() {
    setScreen(() => {
      if (avatarStageCleanup) { avatarStageCleanup(); avatarStageCleanup = null; }
      if (userProfileAvatarCleanup) { userProfileAvatarCleanup(); userProfileAvatarCleanup = null; }
      winTitle.textContent = 'Редактировать профиль';
      winBody.scrollTop = 0;

      winBody.innerHTML = `
        <form class="edit-form" id="edit-form" novalidate>
          <div class="edit-field">
            <span class="edit-label">Фото профиля</span>
            <div class="avatar-edit">
              <div id="avatar-preview" class="avatar-preview">${
                profile.avatar
                  ? ''
                  : escapeHtml((profile.name || '?').trim().charAt(0).toUpperCase() || '?')
              }</div>
              <div class="avatar-edit-side">
                <button type="button" class="btn" id="avatar-pick">Выбрать фото</button>
                <button type="button" class="btn-ghost" id="avatar-remove" ${profile.avatar ? '' : 'hidden'}>Удалить фото</button>
                <input type="file" id="avatar-input" accept="image/*" hidden>
              </div>
            </div>
          </div>

          <label class="edit-field">
            <span class="edit-label">Имя</span>
            <input class="edit-input" type="text" id="edit-name" maxlength="60" value="${escapeHtml(profile.name)}" placeholder="Как вас зовут?">
          </label>

          <label class="edit-field">
            <span class="edit-label">Имя пользователя</span>
            <div class="username-wrap">
              <span class="username-prefix" aria-hidden="true">@</span>
              <input class="edit-input username-input" type="text" id="edit-username"
                     maxlength="20" autocapitalize="off" autocorrect="off" spellcheck="false"
                     value="${escapeHtml(profile.handle.replace(/^@/, ''))}"
                     placeholder="username">
            </div>
            <span class="edit-hint" id="username-hint">Латиница, цифры, «_» и «.», от 3 до 20 символов</span>
          </label>

          <label class="edit-field">
            <span class="edit-label">О себе</span>
            <textarea class="edit-textarea" id="edit-bio" maxlength="300" placeholder="Пара слов о себе">${escapeHtml(profile.bio)}</textarea>
          </label>

          <div class="edit-actions">
            <button type="button" class="btn" id="edit-cancel">Отмена</button>
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </form>
      `;

      const previewEl = winBody.querySelector('#avatar-preview');
      const removeBtn = winBody.querySelector('#avatar-remove');
      const fileInput = winBody.querySelector('#avatar-input');
      const nameEl = winBody.querySelector('#edit-name');
      const usernameEl = winBody.querySelector('#edit-username');
      const usernameHint = winBody.querySelector('#username-hint');

      if (profile.avatar) {
        previewEl.style.backgroundImage = `url('${profile.avatar}')`;
        previewEl.textContent = '';
      }

      nameEl.addEventListener('input', () => {
        if (profile.avatar) return;
        const letter = nameEl.value.trim().charAt(0).toUpperCase() || '?';
        previewEl.textContent = letter;
      });

      const validateUsernameField = () => {
        const v = normalizeUsernameInput(usernameEl.value);
        const ok = isValidUsernameInput(v);
        usernameEl.classList.toggle('is-invalid', !ok);
        usernameHint.classList.toggle('is-invalid', !ok);
        return ok;
      };

      usernameEl.addEventListener('input', () => {
        const cleaned = usernameEl.value
          .replace(/^@+/, '')
          .replace(/\s+/g, '')
          .replace(/[^a-zA-Z0-9_.]/g, '');
        if (cleaned !== usernameEl.value) {
          const pos = usernameEl.selectionStart;
          usernameEl.value = cleaned;
          try { usernameEl.setSelectionRange(pos, pos); } catch {}
        }
        validateUsernameField();
      });
      usernameEl.addEventListener('blur', () => {
        usernameEl.value = normalizeUsernameInput(usernameEl.value);
        validateUsernameField();
      });

      winBody.querySelector('#avatar-pick').addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file || !file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const max = 256;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

            previewEl.style.backgroundImage = `url('${dataUrl}')`;
            previewEl.textContent = '';
            previewEl.dataset.pending = dataUrl;
            removeBtn.hidden = false;
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      removeBtn.addEventListener('click', () => {
        previewEl.style.backgroundImage = '';
        const letter = nameEl.value.trim().charAt(0).toUpperCase() || '?';
        previewEl.textContent = letter;
        delete previewEl.dataset.pending;
        removeBtn.hidden = true;
      });

      winBody.querySelector('#edit-cancel').addEventListener('click', goBack);

      winBody.querySelector('#edit-form').addEventListener('submit', (e) => {
        e.preventDefault();

        const newName = nameEl.value.trim() || DEFAULT_PROFILE.name;
        const newBio = winBody.querySelector('#edit-bio').value.trim();

        const uname = normalizeUsernameInput(usernameEl.value) || DEFAULT_PROFILE.handle.replace(/^@/, '');
        if (!isValidUsernameInput(uname)) {
          usernameEl.classList.add('is-invalid');
          usernameHint.classList.add('is-invalid');
          usernameEl.focus();
          return;
        }

        let newAvatar;
        if (previewEl.dataset.pending !== undefined) newAvatar = previewEl.dataset.pending;
        else if (previewEl.style.backgroundImage) newAvatar = profile.avatar;
        else newAvatar = '';

        profile = { ...profile, name: newName, handle: '@' + uname, bio: newBio, avatar: newAvatar };
        saveProfile(profile);

        if (session && session.userId) {
          const idx = users.findIndex((u) => u.id === session.userId);
          if (idx >= 0) {
            users[idx] = {
              ...users[idx],
              name: newName,
              username: uname,
              bio: newBio,
              avatar: newAvatar,
            };
            saveUsers(users);
          }
        }

        if (lastUserLocation && settings.geolocation) {
          placeUserMarker(lastUserLocation);
          syncWishMarkers();
        }

        showProfileScreen();
      });
    }, () => showProfileScreen());
  }

  if (!reduceMotion) {
    dock.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      items.forEach((li) => {
        const r = li.getBoundingClientRect();
        const d = e.clientX - (r.left + r.width / 2);
        const s = 1 + 0.3 * Math.exp(-(d * d) / (2 * 70 * 70));
        li.style.setProperty('--s', s.toFixed(3));
      });
    });
    dock.addEventListener('pointerleave', () => items.forEach((li) => li.style.removeProperty('--s')));
  }

  updateBadge();

  /* ═══════════ Старт: сессия или экран входа ═══════════ */
  function bootApp() {
    if (session && session.userId) {
      const user = users.find((u) => u.id === session.userId);
      if (user) {
        applyUserToProfile(user);
        document.body.classList.remove('auth-locked');
        authScreen.hidden = true;
        showMapApp();
        return;
      }
      saveSession(null);
      session = null;
    }

    document.body.classList.add('auth-locked');
    authScreen.hidden = false;
    renderAuthLogin();
  }

  bootApp();

  const openParam = new URLSearchParams(location.search).get('open');
  if (openParam && APPS[openParam] && !document.body.classList.contains('auth-locked')) {
    showApp(openParam, dock.querySelector(`[data-app="${openParam}"]`));
  }

  const offlineBadge = document.getElementById('offline-badge');
  const syncOnline = () => { offlineBadge.hidden = navigator.onLine; };
  addEventListener('online', syncOnline); addEventListener('offline', syncOnline); syncOnline();

  let installEvent = null;
  const installBtn = document.getElementById('install-btn');
  addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installEvent = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener('click', async () => {
    if (!installEvent) return;
    installEvent.prompt();
    await installEvent.userChoice;
    installEvent = null;
    installBtn.hidden = true;
  });
  addEventListener('appinstalled', () => { installBtn.hidden = true; });

  /* Кнопка-колокольчик уведомлений */
  const notifBtn = document.getElementById('notif-btn');
  if (notifBtn) {
    notifBtn.addEventListener('click', () => {
      if (openApp === 'notifications') showMapApp();
      else showApp('notifications', notifBtn);
    });
  }

  /* Кнопка-шестерёнка настроек */
  const settingsBtn = document.getElementById('settings-btn');
  if (settingsBtn) {
    settingsBtn.addEventListener('click', () => {
      if (openApp === 'settings') showMapApp();
      else showApp('settings', settingsBtn);
    });
  }

  /* ═══════════ Полноэкранный режим (по кнопке) ═══════════ */
  const fsBtn = document.getElementById('fs-btn');
  const fsRoot = document.documentElement;

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  async function toggleFullscreen() {
    const mapEl = document.getElementById('map');
    try {
      if (isFullscreen()) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else {
        if (mapEl) {
          mapEl.style.width = window.innerWidth + 'px';
          mapEl.style.height = window.innerHeight + 'px';
        }
        if (mapEl) void mapEl.offsetHeight;

        if (fsRoot.requestFullscreen) {
          await fsRoot.requestFullscreen({ navigationUI: 'hide' });
        } else if (fsRoot.webkitRequestFullscreen) {
          fsRoot.webkitRequestFullscreen();
        }
        if (mapEl) {
          mapEl.style.width = '100%';
          mapEl.style.height = '100%';
        }
        fullscreenKick();
      }
    } catch (err) {
      console.info('[fullscreen] не удалось переключить:', err && err.message);
    }
  }

  if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);

  function syncFullscreenBtn() {
    if (!fsBtn) return;
    fsBtn.classList.toggle('is-active', isFullscreen());
  }

  let fsKickRaf = 0;
  function fullscreenKick() {
    cancelAnimationFrame(fsKickRaf);
    fsKickRaf = requestAnimationFrame(() => {
      if (map2gis) {
        try {
          if (typeof map2gis.invalidateSize === 'function') map2gis.invalidateSize();
          else if (typeof map2gis.resize === 'function') map2gis.resize();
        } catch {}
      }
    });
  }

  ['fullscreenchange', 'webkitfullscreenchange'].forEach((evt) => {
    document.addEventListener(evt, () => {
      syncFullscreenBtn();
      fullscreenKick();
    });
  });
  syncFullscreenBtn();

  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k !== 'f' && k !== 'F' && k !== 'а' && k !== 'А') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    toggleFullscreen();
  });

  if ('serviceWorker' in navigator) {
    addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('SW не зарегистрирован:', err));
    });
  }

  init2GisMap();
  </script>
</body>
</html>
