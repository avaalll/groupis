      transition: background .2s, color .2s;
    }
    .chat-tab[aria-selected="true"] { background: var(--win); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .14); }
    .chats-list[data-tab="dm"] .chats-pane[data-pane="group"],
    .chats-list[data-tab="group"] .chats-pane[data-pane="dm"] { display: none; }
    /* строка чата сдвигается свайпом влево и открывает кнопки «Уведомления» и «Удалить» */
    .chat-swipe { position: relative; overflow: hidden; border-radius: 18px; -webkit-user-select: none; user-select: none; }
    .chat-swipe-actions {
      position: absolute; top: 0; right: 0; bottom: 0; display: flex; border-radius: 18px; overflow: hidden;
      transform: translateX(100%); transition: transform .28s var(--ease);
    }
    .chat-swipe-actions .group-action-btn { width: 64px; }
    .chat-swipe-actions .group-action-btn svg { fill: none; }
    .chat-swipe .chat-row { touch-action: pan-y; transition: background .2s, transform .28s var(--ease); }
    .chat-swipe.revealed .chat-swipe-actions { transform: none; }
    .chat-swipe.revealed .chat-row, .chat-swipe.revealed .chat-row:active { transform: translateX(-134px); }
    .chat-muted { display: inline-block; vertical-align: -2px; margin-left: 6px; color: var(--ink-soft); }
    .chat-muted svg { display: block; width: 14px; height: 14px; }
    .chat-row.is-muted .unread-pill { background: var(--field); color: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--win-line); }
    .chat-row.is-muted.has-unread .chat-last { animation: none; background: none; -webkit-text-fill-color: currentColor; color: var(--ink-soft); }
    /* непрочитанное в списке: имя жирнее, а текст сообщения переливается спектром — пока чат не откроют */
    .chat-row.has-unread .chat-name { font-weight: 700; }
    .chat-row.has-unread .chat-last {
      font-weight: 700; color: var(--ink);
      background: linear-gradient(100deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c1)) 0 0 / 300% 100%;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: unread-shine 3.2s linear infinite;
    }
    @keyframes unread-shine { to { background-position: -300% 0; } }
    @media (prefers-reduced-motion: reduce) { .chat-row.has-unread .chat-last { animation: none; } }
    /* ── Отметки у времени своего сообщения, как в Telegram: часы — отправляется, галочка — отправлено,
       две — прочитано. Галочки видны, когда известно, кто что прочитал (reads-on) ── */
    .chat-ticks { display: none; margin-left: 4px; vertical-align: -1.5px; }
    .chat-ticks svg {
      display: block; width: 17px; height: 11.5px; overflow: visible;
      fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .chat-msg.is-pending .chat-ticks, #chat-view-body.reads-on .chat-ticks { display: inline-block; }
    .chat-ticks .tick-read, .chat-msg.is-read .chat-ticks .tick-sent { display: none; }
    .chat-msg.is-read .chat-ticks .tick-read { display: inline; }
    /* время у отправленного чуть приглушено, а две галочки — в полную силу: прочитанное видно с одного взгляда */
    .chat-msg.me.is-read .chat-msg-time { opacity: .95; }
    /* ── Пересланное сообщение: чьё оно ── */
    .chat-fwd {
      margin: 0 0 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      line-height: 1.3; opacity: .82;
    }
    .chat-msg.has-media .chat-fwd { margin: 2px 6px 5px; }
    .chat-msg.is-circle .chat-fwd { margin: 0 4px 5px; color: var(--ink-soft); opacity: 1; }
    /* ── Кнопка «вниз»: видна, когда ленту отлистали вверх; на ней — сколько сообщений пришло за это время ── */
    .chat-down-wrap { position: relative; flex: none; height: 0; z-index: 3; }
    .chat-down {
      position: absolute; right: 12px; bottom: 10px; width: 40px; height: 40px; padding: 0;
      display: grid; place-items: center; border-radius: 50%; cursor: pointer;
      background: var(--glass); color: var(--ink); border: 1px solid var(--glass-edge);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: 0 10px 24px -10px rgba(0, 0, 0, .45), inset 0 1px 0 var(--rim, transparent);
      opacity: 0; visibility: hidden; transform: translateY(10px) scale(.86);
      transition: opacity .2s ease, transform .3s var(--spring, ease), visibility 0s .3s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .chat-down.is-on { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
    .chat-down:hover { background: var(--win-2); }
    .chat-down.is-on:active { transform: scale(.9); }
    .chat-down svg { width: 22px; height: 22px; }
    .chat-down .unread-pill { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 0 2px var(--win); }
    @media (prefers-reduced-motion: reduce) { .chat-down { transition: opacity .2s ease, visibility 0s .2s; transform: none; } }
    /* ── Ответ на сообщение: цитата в сообщении, плашка над полем ввода, свайп влево ── */
    .chat-reply {
      display: grid; gap: 1px; margin: 0 0 5px; padding: 4px 8px; max-width: 100%; min-width: 0;
      border-left: 3px solid currentColor; border-radius: 6px; background: rgba(127, 127, 140, .2);
      font-size: 13px; line-height: 1.3; cursor: pointer;
    }
    .chat-msg.has-media .chat-reply { margin: 2px 2px 5px; }
    .chat-reply b { font-weight: 700; }
    .chat-reply b, .chat-reply span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-reply span { opacity: .85; }
    .chat-reply-bar { margin: 0 12px 2px; cursor: default; }
    .chat-reply-bar:hover { background: var(--field); }
    .chat-reply-bar[hidden] { display: none; }
    #chat-view-body { overflow-x: hidden; overscroll-behavior-x: contain; }
    #chat-view-body .chat-msg { touch-action: pan-y; }
    #chat-view-body .chat-msg:not(.is-swiping) { transition: opacity .2s ease, box-shadow .2s ease, transform .28s var(--spring, ease); }
    #chat-view-body .chat-msg.is-swiping::after {
      content: "↩"; position: absolute; top: 50%; right: -40px; width: 28px; height: 28px; margin-top: -14px;
      display: grid; place-items: center; border-radius: 50%; background: var(--field); color: var(--ink);
      font-size: 15px; font-weight: 700; opacity: .35; transform: scale(.7); transition: opacity .15s, transform .25s var(--spring, ease);
    }
    #chat-view-body .chat-msg.is-swipe-ready::after { opacity: 1; transform: scale(1); }
    /* ── «Печатает…» в шапке чата: вместо «Чат с …», пока собеседник пишет, записывает или отправляет файл ── */
    .support-chat-head.is-typing { color: var(--you); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 16px; padding-right: 16px; }
    .typing-dots { display: inline-flex; gap: 3px; margin-left: 5px; vertical-align: middle; }
    .typing-dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: typing-dot 1.2s ease-in-out infinite; }
    .typing-dots i:nth-child(2) { animation-delay: .15s; }
    .typing-dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes typing-dot { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
    /* ── Групповой чат: кто прочитал сообщение ── */
    .readers-list { list-style: none; margin: 4px -8px 14px; padding: 0; max-height: min(52vh, 360px); overflow: auto; }
    .readers-list .person-card { padding: 8px 10px; cursor: default; }
    .readers-none { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }
    /* ── Групповой и совместный чат, как в Telegram: слева от чужих сообщений — аватар автора, над ними — имя.
       Сообщения одного человека подряд (промежутки меньше 15 минут) — серия: имя над первым, аватар у последнего,
       внутри серии сообщения стоят теснее (syncChatRuns). В совместном чате рядом с именем — группа человека ── */
    #chat-view-body.is-group .chat-msg.them { margin-left: 40px; }
    #chat-view-body.is-group .chat-msg.is-run-cont { margin-top: -5px; }
    #chat-view-body.is-group .chat-msg.them.is-run-cont { border-top-left-radius: 6px; }
    #chat-view-body.is-group .chat-msg.me.is-run-cont { border-top-right-radius: 6px; }
    .chat-msg.is-run-cont > .chat-msg-author { display: none; }
    .chat-msg-ava {
      position: absolute; left: -40px; bottom: 0; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%;
      background: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .chat-msg-ava .avatar { width: 32px !important; height: 32px !important; font-size: 13px; }
    .chat-msg.is-run-more > .chat-msg-ava { display: none; }
    .chat-msg-origin { color: var(--ink-soft); font-weight: 500; }

    /* ── Чат: меню сообщения, выбор нескольких, закреплённое ── */
    .chat-msg { position: relative; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: opacity .2s ease, box-shadow .2s ease; }
    .chat-view.is-selecting .chat-msg { cursor: pointer; }
    /* Плашка даты: по центру ленты, стоит на своём месте перед первым сообщением дня */
    .chat-date { align-self: center; flex: none; margin: 4px 0 2px; pointer-events: none; -webkit-user-select: none; user-select: none; }
    .chat-date span {
      display: block; padding: 4px 11px; border-radius: 999px;
      background: var(--glass); border: 1px solid var(--glass-edge);
      color: var(--ink-soft); font-size: 12px; font-weight: 600; line-height: 1.3; white-space: nowrap;
    }
    /* размытие под плашкой нужно только плавающей — она лежит поверх сообщений; у плашек в ленте под ними
       ровный фон окна, а размытие на каждой из них заметно тормозит прокрутку на ноутбуках */
    .chat-date-float span { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    /* Плавающая дата у верха ленты: видна, пока листают; её выталкивает плашка следующего дня */
    .chat-date-float { position: absolute; left: 50%; top: 0; z-index: 2; margin: 0; transform: translateX(-50%); opacity: 0; transition: opacity .2s ease; }
    .chat-date-float.is-on { opacity: 1; }
    .chat-date.is-floating { visibility: hidden; }
    .chat-view.is-selecting .chat-msg:not(.is-selected) { opacity: .5; }
    .chat-msg.is-selected { box-shadow: 0 0 0 2px var(--win), 0 0 0 4px var(--c2); }
    .chat-msg.is-flash { animation: msg-flash 1.2s ease; }
    @keyframes msg-flash { 0%, 55% { box-shadow: 0 0 0 2px var(--win), 0 0 0 4px var(--c3); } }
    .chat-pin {
      display: flex; align-items: center; gap: 10px; margin: 0 12px 6px; padding: 7px 6px 7px 10px;
      border-radius: 16px; background: var(--field); cursor: pointer; transition: background .2s;
    }
    .chat-pin:hover { background: var(--row-hover); }
    .chat-pin::before { content: ""; flex: none; width: 3px; align-self: stretch; border-radius: 3px; background: var(--prism); }
    .chat-pin-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
    .chat-pin-cap { font: 500 11px var(--font-ui); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
    .chat-pin-text { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-pin-x {
      flex: none; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft);
      font-size: 19px; line-height: 1; cursor: pointer; transition: background .2s, color .2s;
    }
    .chat-pin-x:hover { background: var(--win); color: var(--ink); }
    /* «Сейчас играет» (syncChatPlayer): над лентой, как в Telegram; снизу — тонкая полоска хода */
    .chat-player {
      position: relative; display: flex; align-items: center; gap: 10px; margin: 0 12px 6px; padding: 5px 4px 7px 5px;
      border-radius: 16px; background: var(--win-2); box-shadow: inset 0 0 0 1px var(--win-line); overflow: hidden;
      animation: scr-rise .3s var(--ease) both;
    }
    .chat-player[hidden] { display: none; }
    .cp-toggle {
      flex: none; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
      display: grid; place-items: center; background: var(--prism); color: var(--prism-ink);
      transition: transform .3s var(--spring);
    }
    .cp-toggle:active { transform: scale(.88); }
    .cp-toggle svg { width: 17px; height: 17px; }
    .cp-ic-play { margin-left: 2px; }
    .cp-ic-pause, .chat-player.is-playing .cp-ic-play { display: none; }
    .chat-player.is-playing .cp-ic-pause { display: block; }
    .cp-main { flex: 1; min-width: 0; display: grid; gap: 1px; cursor: pointer; }
    .cp-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cp-sub { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cp-close {
      flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft);
      font-size: 20px; line-height: 1; cursor: pointer; transition: background .2s, color .2s;
    }
    .cp-close:hover { background: var(--field); color: var(--ink); }
    .cp-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--field); }
    .cp-bar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); background: var(--prism); transition: width .25s linear; }
    .chat-selbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px 12px; background: var(--win); }
    .chat-selbar .btn { padding: 10px 14px; font-size: 13px; }
    .chat-selbar .btn:disabled { opacity: .4; cursor: default; }
    .chat-sel-count { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 13px; white-space: nowrap; }
    .msg-menu { z-index: 8; min-width: 190px; transform-origin: 0 0; }
    .fwd-list { list-style: none; margin: 4px -8px 14px; padding: 0; max-height: min(46vh, 320px); overflow: auto; }
    .fwd-list .person-card { padding: 8px 10px; cursor: pointer; }
    .del-actions { flex-wrap: wrap; }
    /* Меню сообщения, как в Telegram: сверху ряд реакций (стрелка раскрывает все), под ним — короткий список действий,
       остальное — в «Ещё» */
    .popover.msg-ctx {
      display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 0; width: max-content; max-width: calc(100% - 16px);
      padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none;
    }
    .msg-ctx > .msg-reacts, .msg-ctx > .msg-menu-list {
      border-radius: 18px; background: var(--win); border: 1px solid var(--win-line);
      box-shadow: 0 24px 50px -16px rgba(0, 0, 0, .35), inset 0 1px 0 var(--rim, transparent);
    }
    .msg-menu-list { padding: 6px; min-width: 200px; align-self: flex-start; }
    .msg-reacts { padding: 4px; align-self: flex-start; }
    .msg-reacts-row { display: flex; align-items: center; gap: 2px; }
    .msg-reacts-all { display: grid; grid-template-columns: repeat(7, 38px); gap: 2px; max-height: 196px; overflow-y: auto; overscroll-behavior: contain; }
    .msg-react-opt, .msg-react-more {
      width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer;
      display: grid; place-items: center; font-size: 23px; line-height: 1; color: var(--ink);
      transition: transform .3s var(--spring, ease), background .15s;
    }
    .msg-react-opt:hover, .msg-react-more:hover { background: var(--row-hover); }
    .msg-react-opt:hover { transform: scale(1.18); }
    .msg-react-opt:active { transform: scale(.9); }
    .msg-react-opt.is-on { background: var(--field); box-shadow: inset 0 0 0 1.5px var(--ink); }
    .msg-react-more { width: 32px; height: 32px; margin-left: 2px; background: var(--field); }
    .msg-react-more svg { width: 18px; height: 18px; transition: transform .25s var(--ease, ease); }
    .msg-react-more[aria-expanded="true"] svg { transform: rotate(180deg); }
    .msg-menu-list .pop-chev { margin-left: auto; font-size: 18px; line-height: 1; opacity: .55; }
    .msg-menu-list .pop-back { color: var(--ink-soft); }
    .msg-menu-list .pop-back .pop-chev { margin: 0 2px 0 0; }
    /* Реакции под сообщением: нажатие на свою снимает её, на чужую — ставит такую же */
    .chat-reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; clear: both; }   /* под временем — оно стоит в строке текста */
    .chat-msg.has-media .chat-reacts { margin: 6px 4px 0; }
    .chat-msg.is-circle .chat-reacts { margin-top: 4px; }
    .chat-react {
      display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px;
      border: 0; border-radius: 999px; cursor: pointer; font: inherit; font-size: 15px; line-height: 1;
      background: var(--field); color: inherit; box-shadow: inset 0 0 0 1px var(--win-line);
      transition: transform .3s var(--spring, ease), background .2s;
    }
    .chat-react b { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chat-react.is-mine { background: var(--act); color: var(--act-ink); box-shadow: none; }
    .chat-msg.me .chat-react { background: var(--me-card); box-shadow: none; }
    .chat-msg.me .chat-react.is-mine { background: var(--act-ink); color: var(--act); }
    .chat-react:active { transform: scale(.88); }
    /* Реакция появляется тихо: плашка проступает и чуть подрастает — без вылетающих эмодзи и искр */
    .chat-react.is-pop { animation: react-pop .22s ease-out both; }
    @keyframes react-pop { from { opacity: 0; transform: scale(.85); } }
    .chat-react-emo { display: inline-block; }
    /* ── Анимация match (playMatchFx): знаки двух групп съезжаются и сливаются, вспыхивает линза общего,
       по кругу расходится «сигнал», ниже — «Match» и названия. Около двух секунд, нажатие закрывает раньше ── */
    .match-fx {
      position: fixed; inset: 0; z-index: 900;
      display: grid; place-content: center; justify-items: center; gap: 10px; padding: 0 24px;
      background: radial-gradient(circle at 50% 45%, rgba(8, 10, 16, .48), rgba(8, 10, 16, .8));
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
      animation: mfx-in .22s ease-out both; transition: opacity .25s ease;
    }
    .match-fx.is-out { opacity: 0; }
    .mfx-stage { position: relative; width: 132px; height: 72px; margin-bottom: 10px; }
    .mfx-disc {
      position: absolute; top: 4px; width: 64px; height: 64px; border-radius: 50%;
      display: grid; place-items: center; font: 600 24px/1 var(--font-ui); color: #fff;
      background: var(--c3) center / cover no-repeat; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .7);
    }
    .mfx-disc.is-a { left: 18px; animation: mfx-a .56s cubic-bezier(.16, 1, .3, 1) .06s both; }
    .mfx-disc.is-b { left: 50px; background-color: var(--c1); animation: mfx-b .56s cubic-bezier(.16, 1, .3, 1) .06s both; }
    @keyframes mfx-a { from { transform: translateX(-60px) scale(.8); opacity: 0; } 45% { opacity: 1; } }
    @keyframes mfx-b { from { transform: translateX(60px) scale(.8); opacity: 0; } 45% { opacity: 1; } }
    .mfx-lens { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .mfx-lens path {
      fill: #fff; opacity: 0; transform-box: fill-box; transform-origin: center;
      filter: drop-shadow(0 0 8px var(--c2)); animation: mfx-lens .5s cubic-bezier(.2, .9, .25, 1) .5s forwards;
    }
    @keyframes mfx-lens { from { opacity: 0; transform: scaleY(.2); } 45% { opacity: 1; } to { opacity: .9; transform: none; } }
    .mfx-ring {
      position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%;
      border: 1.5px solid var(--c2); opacity: 0; animation: mfx-ring .9s cubic-bezier(.15, .6, .3, 1) .54s forwards;
    }
    .mfx-ring + .mfx-ring { animation-delay: .7s; }
    @keyframes mfx-ring { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.6); } }
    .mfx-cap {
      font: 600 12px/1 var(--font-ui); letter-spacing: .42em; text-indent: .42em; text-transform: uppercase;
      opacity: .72; animation: mfx-up .4s ease-out .62s both;
    }
    .mfx-names { font: 600 17px/1.3 var(--font-ui); max-width: 320px; text-align: center; overflow-wrap: anywhere; animation: mfx-up .4s ease-out .7s both; }
    @keyframes mfx-up { from { opacity: 0; transform: translateY(8px); } }
    @keyframes mfx-in { from { opacity: 0; } }
    /* match не случился: знаки съезжаются, сталкиваются и отлетают в стороны, «сигнал» — тревожного цвета */
    .match-fx.is-no .mfx-disc.is-a { animation: mfx-a-no 1s cubic-bezier(.3, .7, .2, 1) .06s both; }
    .match-fx.is-no .mfx-disc.is-b { animation: mfx-b-no 1s cubic-bezier(.3, .7, .2, 1) .06s both; }
    @keyframes mfx-a-no {
      0% { transform: translateX(-60px) scale(.8); opacity: 0; } 25% { opacity: 1; }
      38% { transform: translateX(4px) scale(1); } 54% { transform: translateX(-30px) rotate(-10deg); }
      72% { transform: translateX(-18px) rotate(-3deg); } 100% { transform: translateX(-22px) rotate(-5deg); }
    }
    @keyframes mfx-b-no {
      0% { transform: translateX(60px) scale(.8); opacity: 0; } 25% { opacity: 1; }
      38% { transform: translateX(-4px) scale(1); } 54% { transform: translateX(30px) rotate(10deg); }
      72% { transform: translateX(18px) rotate(3deg); } 100% { transform: translateX(22px) rotate(5deg); }
    }
    .match-fx.is-no .mfx-ring { border-color: var(--hot); animation-delay: .4s; }
    .match-fx.is-no .mfx-ring + .mfx-ring { animation-delay: .52s; }
    .match-fx.is-no .mfx-cap { font: 600 17px/1.3 var(--font-ui); letter-spacing: -.01em; text-indent: 0; text-transform: none; opacity: 1; }
    .match-fx.is-no .mfx-names { font-size: 14px; font-weight: 500; opacity: .7; }

    /* ── Итог голосования о союзе (playVoteFx): кольцо голосов, печать или трещина ──
       Деления по числу участников зажигаются голосами: «за» — спектром по часовой от верха, «против» — красным против
       часовой; у отметок большинства решается исход. --t — когда (в секундах) голоса досчитаны */
    .vote-fx { gap: 8px; }
    .vfx-stage { position: relative; width: 168px; height: 168px; margin-bottom: 12px; }
    .vfx-ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .vfx-seg { fill: none; stroke-width: 5; stroke-linecap: round; }
    .vfx-seg.is-base { stroke: rgba(255, 255, 255, .13); }
    .vfx-seg.is-yes { stroke: url(#vfxYes); }
    .vfx-seg.is-no { stroke: var(--hot); }
    .vfx-seg.is-lit { opacity: 0; animation: vfx-lit .34s cubic-bezier(.2, .9, .3, 1.4) calc(var(--d) * 1s) forwards; }
    @keyframes vfx-lit { 0% { opacity: 0; stroke-width: 2; } 60% { opacity: 1; stroke-width: 8; } 100% { opacity: 1; stroke-width: 5; } }
    .vfx-mark { stroke: rgba(255, 255, 255, .7); stroke-width: 1.6; stroke-linecap: round; opacity: 0; animation: vfx-show .3s ease .2s forwards; }
    @keyframes vfx-show { to { opacity: 1; } }
    /* «за»: кольцо замыкается — печать спектром, от неё расходится свет */
    .vfx-seal { fill: none; stroke: url(#vfxYes); stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
      filter: drop-shadow(0 0 6px var(--c2)); animation: vfx-seal .7s cubic-bezier(.6, 0, .2, 1) calc(var(--t) * 1s) forwards; }
    @keyframes vfx-seal { 0% { opacity: 1; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    .vfx-glow { position: absolute; inset: 12px; border-radius: 50%; border: 2px solid var(--c2); opacity: 0; pointer-events: none;
      animation: vfx-glow 1.1s cubic-bezier(.15, .6, .3, 1) calc(var(--t) * 1s + .55s) forwards; }
    .vfx-glow + .vfx-glow { animation-delay: calc(var(--t) * 1s + .75s); }
    @keyframes vfx-glow { from { opacity: .85; transform: scale(.92); } to { opacity: 0; transform: scale(1.7); } }
    /* «против»: кольцо трескается у верха, половины расходятся и гаснут */
    .vote-fx.is-no .vfx-half { transform-box: view-box; transform-origin: 84px 84px; animation: vfx-crack 1.05s cubic-bezier(.3, .6, .2, 1) calc(var(--t) * 1s) forwards; }
    .vote-fx.is-no .vfx-half.is-left { --dir: -1; }
    .vote-fx.is-no .vfx-half.is-right { --dir: 1; }
    @keyframes vfx-crack {
      0% { transform: none; opacity: 1; }
      16% { transform: translateX(calc(var(--dir) * 3px)) rotate(calc(var(--dir) * 3deg)); opacity: 1; }
      55% { transform: translateX(calc(var(--dir) * 16px)) translateY(4px) rotate(calc(var(--dir) * 11deg)); opacity: .9; }
      100% { transform: translateX(calc(var(--dir) * 30px)) translateY(12px) rotate(calc(var(--dir) * 19deg)); opacity: 0; }
    }
    .vote-fx.is-no .vfx-glow { border-color: var(--hot); animation-delay: calc(var(--t) * 1s); }
    .vote-fx.is-no .vfx-glow + .vfx-glow { animation-delay: calc(var(--t) * 1s + .14s); }
    /* знаки групп в середине кольца: сходятся в общий (как у match) или расходятся */
    .vfx-disc {
      position: absolute; top: 58px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
      font: 600 20px/1 var(--font-ui); color: #fff; background: var(--c3) center / cover no-repeat; box-shadow: 0 10px 26px -10px rgba(0, 0, 0, .75);
    }
    .vfx-disc.is-a { left: 34px; }
    .vfx-disc.is-b { left: 82px; background-color: var(--c1); }
    .vote-fx:not(.is-no) .vfx-disc.is-a { animation: vfx-a-yes .55s cubic-bezier(.16, 1, .3, 1) calc(var(--t) * 1s) forwards; }
    .vote-fx:not(.is-no) .vfx-disc.is-b { animation: vfx-b-yes .55s cubic-bezier(.16, 1, .3, 1) calc(var(--t) * 1s) forwards; }
    @keyframes vfx-a-yes { to { transform: translateX(10px); } }
    @keyframes vfx-b-yes { to { transform: translateX(-10px); } }
    .vote-fx.is-no .vfx-disc.is-a { animation: vfx-a-no .8s cubic-bezier(.3, .7, .2, 1) calc(var(--t) * 1s) forwards; }
    .vote-fx.is-no .vfx-disc.is-b { animation: vfx-b-no .8s cubic-bezier(.3, .7, .2, 1) calc(var(--t) * 1s) forwards; }
    @keyframes vfx-a-no { to { transform: translateX(-12px) rotate(-8deg); filter: saturate(.4) brightness(.8); } }
    @keyframes vfx-b-no { to { transform: translateX(12px) rotate(8deg); filter: saturate(.4) brightness(.8); } }
    .vfx-lens { position: absolute; left: 48px; top: 58px; width: 72px; height: 52px; overflow: visible; }
    .vfx-lens path { fill: #fff; opacity: 0; transform-box: fill-box; transform-origin: center; filter: drop-shadow(0 0 8px var(--c2));
      animation: mfx-lens .5s cubic-bezier(.2, .9, .25, 1) calc(var(--t) * 1s + .35s) forwards; }
    .vfx-eyebrow { font: 600 11px/1 var(--font-ui); letter-spacing: .32em; text-indent: .32em; text-transform: uppercase; opacity: .6; animation: mfx-up .4s ease-out .1s both; }
    .vfx-title { font: 600 22px/1.2 var(--font-ui); letter-spacing: -0.02em; animation: mfx-up .45s ease-out calc(var(--t) * 1s + .3s) both; }
    .vfx-names { font: 500 14px/1.35 var(--font-ui); max-width: 300px; text-align: center; opacity: .75; overflow-wrap: anywhere; animation: mfx-up .45s ease-out calc(var(--t) * 1s + .42s) both; }
    .vfx-sub { font: 500 13px/1.4 var(--font-ui); max-width: 300px; text-align: center; opacity: .6; animation: mfx-up .45s ease-out calc(var(--t) * 1s + .54s) both; }
    .vote-fx.is-no .vfx-title { color: #FFD3DE; }
    @media (prefers-reduced-motion: reduce) {
      .vote-fx .vfx-seg.is-lit, .vfx-seal, .vfx-lens path { animation: none !important; opacity: 1; stroke-dashoffset: 0; }
      .vote-fx.is-no .vfx-half { animation: none !important; opacity: .35; }
    }
    @media (prefers-reduced-motion: reduce) {
      .match-fx, .match-fx * { animation: none !important; }
      .mfx-lens path { opacity: .9; }
    }
    .chat-edited { opacity: .8; font-style: italic; }
    /* Поле ввода в несколько строк: растёт до 6 строк (fitChatInput), дальше прокручивается; кнопки — по нижнему краю */
    .chat-composer { align-items: flex-end; }
    .chat-composer .chat-tool { margin-bottom: 4px; }
    .chat-composer .chat-textarea {
      display: block; box-sizing: border-box; resize: none; overflow-y: hidden;
      line-height: 1.35; max-height: calc(6 * 1.35em + 25px); border-radius: 22px;
      white-space: pre-wrap; overflow-wrap: anywhere; scrollbar-width: thin;
    }
    /* переносы строк, набранные в сообщении, сохраняются; длинное слово или ссылка не распирают пузырь */
    .chat-text, .chat-caption { white-space: pre-wrap; overflow-wrap: anywhere; }
    /* ссылка в сообщении: в своём — цветом текста с подчёркиванием, в чужом — цветом акцента */
    .chat-link { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; -webkit-tap-highlight-color: transparent; }
    .chat-msg.them .chat-link { color: var(--you); }
    @media (hover: hover) { .chat-link:hover { text-decoration-thickness: 2px; } }
    /* Шапка открытого чата, как в Telegram: имя, под ним «в сети» / «был(а) …» / «печатает», справа — аватар */
    .win-title.has-sub { line-height: 1.2; }
    .win-title.has-sub.is-link { cursor: pointer; }
    .win-title-name { display: block; overflow: hidden; text-overflow: ellipsis; }
    .win-title-sub {
      display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font: 500 12px/1.25 var(--font-ui); letter-spacing: 0; color: var(--ink-soft);
    }
    .win-title-sub:empty { display: none; }
    .win-title-sub.is-online, .win-title-sub.is-typing { color: var(--you); }
    .win-peer {
      width: 40px; height: 40px; border-radius: 50%; overflow: hidden; cursor: pointer; flex: none;
      display: grid; place-items: center; transition: transform .35s var(--spring, ease);
      -webkit-tap-highlight-color: transparent;
    }
    .win-peer[hidden] { display: none; }
    .win-peer:active { transform: scale(.88); }
    .win-peer.is-group { border-radius: 14px; }
    .win-peer > .avatar { width: 40px !important; height: 40px !important; font-size: 16px; }
    /* Редактирование: плашка над полем ввода, кнопка отправки — галочка */
    .chat-reply-bar.is-edit .chat-pin-cap { color: var(--you); }

    /* ── Экранная клавиатура на телефонах (см. syncKeyboard): окно ужимается до видимой над клавиатурой части,
       панель вкладок на это время прячется ── */
    /* верх окна — там же, где без клавиатуры на телефоне (10px под «чёлкой»): при её появлении шапка не прыгает,
       поднимается только нижний край. --kb-top — где начинается видимая часть экрана, --kb-h — её высота */
    html.kb-open .window {
      top: calc(var(--kb-top, 0px) + 10px + env(safe-area-inset-top, 0px));
      bottom: calc(100% - var(--kb-top, 0px) - var(--kb-h, 100%) + 8px);
      height: auto; max-height: 680px;
    }
    html.kb-open .dock-wrap, html.kb-open .push-ask { visibility: hidden; }
    /* iPhone приближает страницу, когда фокус попадает в поле со шрифтом меньше 16px, — и сам назад не отдаляет:
       поле ввода «наезжает», а кнопка «Отправить» уезжает за край. Поэтому на сенсорных экранах у всех полей шрифт
       не меньше 16px. !important обязателен: у полей свои классы (.support-chat-input, .edit-textarea…) с
       font: inherit — без него класс перебивает это правило, и у поля чата шрифт оставался 14px. */
    @media (pointer: coarse) {
      input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), textarea, select { font-size: max(16px, 1em) !important; }
    }
    html.is-ios input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), html.is-ios textarea, html.is-ios select { font-size: max(16px, 1em) !important; }
    /* Прокрутка внутри окна не передаётся странице: на телефоне с открытой клавиатурой иначе вместе с лентой
       сообщений сдвигается всё приложение */
    .win-body, .support-chat-body, .chats-list, .people-picker, .fwd-list, .readers-list { overscroll-behavior: contain; }
    /* По полю чата ведут пальцем — страница под клавиатурой не едет; когда текста больше шести строк, поле листается само */
    .chat-composer .chat-textarea { touch-action: pan-x; overscroll-behavior: contain; }
    .chat-composer .chat-textarea.is-long { touch-action: pan-x pan-y; }
    /* невидимая копия поля чата: по ней fitChatInput узнаёт, сколько строк занимает текст */
    .chat-composer .chat-textarea.chat-textarea-mirror {
      position: absolute; left: 0; top: 0; z-index: -1; flex: none;
      height: 0; min-height: 0; max-height: none; overflow: hidden;
      visibility: hidden; pointer-events: none;
    }

    /* На телефоне панель вкладок — во всю ширину, вкладки делят её поровну */
    @media (max-width: 520px) {
      .dock-wrap { padding: 0 max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
      .dock, :root[data-theme="dark"] .dock { flex: 1; max-width: 440px; }
      .dock-item { flex: 1 1 0; width: auto; min-width: 0; }
    }
    /* Телефон лёжа: панель вкладок стоит ниже — иначе окно над ней наезжало на неё на пару пикселей */
    @media (max-height: 480px) and (orientation: landscape) {
      .dock-wrap { bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
    }
    /* Узкие телефоны (до 360px): поле сообщения не должно сжиматься так, что в нём не помещается даже подпись */
    @media (max-width: 360px) {
      .chat-composer { padding-left: 8px; padding-right: 8px; gap: 3px; }
      .chat-composer .chat-tool { width: 32px; }
      .chat-composer .chat-textarea { padding-left: 12px; padding-right: 12px; }
    }
    .chat-composer .chat-textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Самые узкие экраны (до 350px): логотип с кнопкой «Установить» иначе наезжает на кнопки справа */
    @media (max-width: 350px) {
      .menubar .brand .brand-wordmark { padding: 0 6px 0 8px; }
      .menubar .brand .brand-wordmark svg { height: 18px; }
      #install-btn { padding: 5px 8px; font-size: 11px; }
    }
