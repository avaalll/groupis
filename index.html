      for (const el of body.children) if (!el.dataset.sized) { el.dataset.sized = '1'; keepBottom.observe(el); }
    };
    // лента меняется из многих мест (новое сообщение, удаление, перерисовка) — плашки дат следуют за ней.
    // Перерисовка и дорисовка старых сообщений делают эту работу сами, в одну раскладку, и снимают очередь
    // наблюдателя (__chatMo.takeRecords) — остаётся только __chatSync
    const mo = new MutationObserver(() => { syncChatDates(body); syncChatRuns(body); syncChatReadMarks(); watchSizes(); syncChatDown(); });
    mo.observe(body, { childList: true });
    body.__chatMo = mo;
    body.__chatSync = () => { syncChatReadMarks(); watchSizes(); };
    watchSizes();
    syncChatReadMarks();
    syncChatRuns(body, false);
    /* Порядок ради одной раскладки вместо четырёх: замер пузырей (раскладка) → ширина ленты и прокрутка вниз
       по готовой раскладке → запись новых ширин. Раньше каждое чтение после записи раскладывало ленту заново */
    const applyWidths = measureChatBubbles(body.children);
    // окно стало шире или уже — строки переносятся иначе, ширину пузырей подбираем заново
    let fitWidth = body.clientWidth;
    if (window.ResizeObserver) new ResizeObserver(() => {
      if (body.clientWidth === fitWidth || !body.isConnected) return;
      fitWidth = body.clientWidth;
      fitChatBubbles(body.children);
    }).observe(body);
    scrollChatToBottom();
    applyWidths();
    hydrateChatMedia(body);
    if (split) paintOlderRows(chat);
    winBody.querySelector('#chat-composer').addEventListener('submit', (e) => { e.preventDefault(); sendChatText(); });
    // нажатие «Отправить» не забирает фокус у поля — на телефоне клавиатура не прячется после каждого сообщения
    winBody.querySelector('#chat-composer .support-chat-send').addEventListener('mousedown', (e) => {
      if (document.activeElement === winBody.querySelector('#chat-text')) e.preventDefault();
    });
    winBody.querySelector('#chat-file').addEventListener('change', onChatFilesPicked);
    const c = chat;
    const textEl = winBody.querySelector('#chat-text');
    textEl.addEventListener('input', () => { fitChatInput(textEl); sendTyping(c, typingNowKind(c)); });
    textEl.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && (c.editing || c.replyTo)) { e.preventDefault(); if (c.editing) setChatEdit(null); else setChatReply(null); return; }
      /* Как в Telegram и WhatsApp: на компьютере Enter отправляет, Shift+Enter — новая строка;
         на телефоне Enter на клавиатуре — новая строка, отправка — кнопкой. Во время набора иероглифов
         и подсказок (isComposing) Enter принадлежит клавиатуре */
      if (e.key === 'Enter' && !e.shiftKey && !e.altKey && !e.isComposing && e.keyCode !== 229 && !touchTyping.matches) {
        e.preventDefault();
        sendChatText();
      }
    });
    if (chat.type === 'match') refreshMatchVotePanel();
    syncChatPinBar();
    syncChatSelectionUi();
    syncChatReplyBar();
    paintTyping(chat);
  }

  /* ── Ответ на сообщение: пункт «Ответить» в меню или свайп сообщения влево ── */
  function msgAuthorName(m) {
    if (isMyMsg(m)) return profile.name || 'Вы';
    return m.authorName || chatPersonById(m.fromId).name;
  }
  function replySnapshot(m) {
    return { id: String(m.id), name: msgAuthorName(m), text: cutChars(chatPreviewText(m), 140) };
  }
  function setChatReply(id) {
    const m = id == null ? null : chatMsgById(id);
    if (!chat || (m && m.pending)) return;
    if (m && chat.editing) setChatEdit(null);   // ответ и правка вместе не бывают
    chat.replyTo = m || null;
    syncChatReplyBar();
    if (m) { const input = winBody.querySelector('#chat-text'); if (input) input.focus({ preventScroll: true }); }
  }
  // Плашка над полем ввода: «Ответ · …» или «Редактирование»; кнопка отправки при правке — галочка
  function syncChatReplyBar() {
    const el = winBody.querySelector('#chat-reply-bar');
    if (!el || !chat) return;
    // сообщение, на которое отвечали или которое правили, успели удалить
    if (chat.replyTo && !chat.messages.includes(chat.replyTo)) chat.replyTo = null;
    if (chat.editing && !chat.messages.includes(chat.editing)) setChatEdit(null);
    const edit = chat.editing, m = edit || chat.replyTo;
    el.hidden = !m;
    el.classList.toggle('is-edit', !!edit);
    el.innerHTML = m ? `
      <div class="chat-pin-main">
        <span class="chat-pin-cap">${edit ? 'Редактирование' : 'Ответ · ' + escapeHtml(msgAuthorName(m))}</span>
        <span class="chat-pin-text">${escapeHtml(chatPreviewText(m) || 'Сообщение')}</span>
      </div>
      ${edit ? '<button type="button" class="chat-pin-x" data-edit-cancel aria-label="Отменить правку" title="Отменить правку">×</button>'
        : '<button type="button" class="chat-pin-x" data-reply-cancel aria-label="Не отвечать" title="Не отвечать">×</button>'}` : '';
    const send = winBody.querySelector('#chat-composer .support-chat-send');
    if (send && send.dataset.mode !== (edit ? 'edit' : 'send')) {
      send.dataset.mode = edit ? 'edit' : 'send';
      send.innerHTML = edit ? ICON_CHECK : ICON_SEND;
      send.setAttribute('aria-label', edit ? 'Сохранить' : 'Отправить');
    }
    if (m && chat.stick) scrollChatToBottom();
  }
  function jumpToChatMessage(id) {
    if (!chatBubbleEl(id)) flushOlderRows();   // старое сообщение ещё не дорисовано — дорисовываем ленту целиком
    const el = chatBubbleEl(id);
    if (!el) return;
    chatFollowUntil = 0;   // человек сам ушёл к старому сообщению — лента больше не держится у конца
    el.parentElement.autoTop = null;
    el.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
    el.classList.remove('is-flash'); void el.offsetWidth; el.classList.add('is-flash');
  }

  /* ── Голосование в совместном чате ── */
  async function refreshMatchVotePanel() {
    const c = chat;
    if (!c || c.type !== 'match') return;
    const m = groupMatches.find((x) => x.id === String(c.matchId));
    if (!m) return;
    const votes = m.voteState === 'open' ? await loadMatchVotes(m.id) : [];
    if (chat !== c) return;
    renderMatchVotePanel(m, votes);
  }

  /* Союз закреплён — над лентой одна тихая строка. Само голосование — значок «две сирены» рядом со скрепкой:
     лидеру — чтобы начать его, всем — пока оно идёт; нажатие открывает окошко над полем ввода (openVotePop) */
  function renderMatchVotePanel(m, votes) {
    if (chat && chat.type === 'match') chat.vote = { m, votes };
    const el = winBody.querySelector('#match-vote');
    if (el) {
      el.dataset.state = m.voteState;
      el.innerHTML = m.voteState === 'approved' ? `<span class="mv-done">${ICON_FEAT_MINI}Союз закреплён</span>` : '';
    }
    const tool = winBody.querySelector('#chat-vote-tool');
    const myId = currentUser && currentUser.id;
    const open = m.voteState === 'open', voted = votes.some((v) => v.user_id === myId);
    if (tool) {
      tool.hidden = !(open || (m.voteState === 'none' && isMatchLeader(m, myId)));
      tool.classList.toggle('is-open', open);
      tool.classList.toggle('is-voted', voted);
      const label = open ? (voted ? 'Голосование о союзе: вы проголосовали' : 'Голосование о союзе: проголосуйте') : 'Начать голосование о союзе';
      tool.title = label;
      tool.setAttribute('aria-label', label);
      if (tool.hidden) closeVotePop();
    }
    if (votePop && votePop.isConnected) { votePop.innerHTML = votePopHtml(m, votes); placeVotePop(); return; }
    /* Голосование идёт, а я ещё не голосовал — окошко всплывает над значком само: когда голосование началось, пока
       чат открыт, или когда я захожу в чат. Один раз за заход: закрыл — до следующего захода не мешает */
    const c = chat;
    if (c && tool && !tool.hidden && open && !voted && !c.votePopped && !c.selecting && !chatRec && !chatRecPending) {
      c.votePopped = true;
      requestAnimationFrame(() => { if (chat === c && !(votePop && votePop.isConnected)) openVotePop(true); });
    }
  }

  let votePop = null;
  function votePopHtml(m, votes) {
    const myId = currentUser && currentUser.id;
    const total = Math.max(1, matchParticipantIds(m).length);
    const what = '«за» — в ленте вы будете видеть только друг друга, «против» — союз распадётся и чат удалится.';
    if (m.voteState !== 'open') {
      return `
        <div class="vp-title">Остаться только друг с другом?</div>
        <div class="vp-hint">Решат участники обеих групп: ${what}</div>
        <div class="vp-actions"><button type="button" class="mv-btn is-start" data-vote-start>Начать голосование</button></div>`;
    }
    const yes = votes.filter((v) => v.vote).length;
    const no = votes.filter((v) => !v.vote).length;
    const mine = votes.find((v) => v.user_id === myId);
    return `
      <div class="vp-eyebrow">${ICON_SIRENS}Голосование о союзе</div>
      <div class="vp-head"><span class="vp-title">Остаёмся только друг с другом?</span><span class="vp-count">${yes + no} из ${total}</span></div>
      <div class="mv-bar"><span class="mv-yes" style="width:${(yes / total * 100).toFixed(1)}%"></span><span class="mv-no" style="width:${(no / total * 100).toFixed(1)}%"></span></div>
      <div class="vp-actions">
        <button type="button" class="mv-btn yes ${mine && mine.vote ? 'is-on' : ''}" data-vote-yes>За · ${yes}</button>
        <button type="button" class="mv-btn no ${mine && !mine.vote ? 'is-on' : ''}" data-vote-no>Против · ${no}</button>
      </div>
      <div class="vp-hint">Решает ${Math.ceil(total / 2)} из ${total}: ${what}</div>`;
  }
  // над полем ввода, левым краем — у значка
  function placeVotePop() {
    const tool = winBody.querySelector('#chat-vote-tool');
    if (!votePop || !tool) return;
    const r = winBody.getBoundingClientRect(), a = tool.getBoundingClientRect();
    votePop.style.left = Math.max(8, Math.min(a.left - r.left - 6, r.width - votePop.offsetWidth - 8)) + 'px';
    votePop.style.top = Math.max(8, a.top - r.top - votePop.offsetHeight - 10 + winBody.scrollTop) + 'px';
  }
  function closeVotePop() {
    if (votePop) votePop.remove();
    votePop = null;
  }
  // auto — окошко всплыло само (голосование началось): появляется заметнее, с «сигналом» от значка
  function openVotePop(auto = false) {
    const c = chat;
    if (!c || !c.vote) return;
    closePostMenus();
    const pop = document.createElement('div');
    pop.className = 'popover vote-pop' + (auto ? ' is-pop' : '');
    if (auto) {
      const tool = winBody.querySelector('#chat-vote-tool');
      if (tool) { tool.classList.remove('is-ping'); void tool.offsetWidth; tool.classList.add('is-ping'); }
      if (navigator.vibrate && !reduceMotion) { try { navigator.vibrate(10); } catch {} }
    }
    pop.setAttribute('role', 'dialog');
    pop.setAttribute('aria-label', 'Голосование о союзе');
    pop.innerHTML = votePopHtml(c.vote.m, c.vote.votes);
    winBody.appendChild(pop);
    votePop = pop;
    placeVotePop();
    const onDocDown = (ev) => {
      if (pop.contains(ev.target) || (ev.target.closest && ev.target.closest('#chat-vote-tool'))) return;
      if (votePop === pop) closeVotePop();
      document.removeEventListener('pointerdown', onDocDown, true);
    };
    setTimeout(() => document.addEventListener('pointerdown', onDocDown, true), 0);
  }

  // match изменился (realtime или наш голос): распался — закрываем чат, иначе обновляем панель
  function onMatchesChanged() {
    const c = chat;
    if (!c) return;
    const kick = (text) => {
      leaveChat();
      winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
      showMessengerScreen();
      if (text) setTimeout(() => alert(text), 50);
    };
    // открыт чат группы, а меня в ней больше нет (вышел на другом устройстве) или группа исчезла
    if (c.type === 'group') {
      const g = groupById(c.groupId);
      if (!g) kick('Группы больше нет — её чат удалён');
      else if (!isGroupParticipant(g, currentUser && currentUser.id)) kick('Вы больше не в этой группе');
      return;
    }
    if (c.type !== 'match') return;
    const m = groupMatches.find((x) => x.id === String(c.matchId));
    if (!m) { kick('Одной из групп больше нет — совместный чат удалён'); return; }
    // союз распался по голосованию — об этом уже говорит анимация итога (playVoteFx), окно с текстом не нужно
    if (m.status !== 'accepted') { kick(voteFxQueued.has(m.id) ? null : 'Союз распался — совместный чат удалён'); return; }
    // вышел из своей группы — из совместного чата её match тоже
    if (!myAcceptedMatches().some((x) => x.id === m.id)) { kick('Вы больше не в группе этого match — совместный чат закрыт'); return; }
    refreshMatchVotePanel();
  }

  /* ── Покинуть группу ──
     Выйти может любой участник и лидер (у лидера лидерство переходит другому участнику). Остаётся меньше двух
     человек — группа исчезает целиком, вместе с чатом и match. Из совместных чатов match человек пропадает сам:
     они видны только участникам групп. Всё это делает функция leave_group на сервере (supabase_leave_group.sql) */
  async function leaveGroup(gid) {
    const g = groupById(gid), myId = currentUser && currentUser.id;
    if (!g || !isGroupParticipant(g, myId)) return;
    const vanish = groupPeople(g).length - 1 < 2;
    const inMatch = groupMatches.some((m) => m.status === 'accepted' && (m.fromGroup === String(gid) || m.toGroup === String(gid)));
    const text = vanish
      ? `В группе останется меньше двух человек — она исчезнет вместе с чатом${inMatch ? ' и match' : ''}.`
      : `${g.ownerId === myId ? 'Лидером станет другой участник. ' : ''}Вы пропадёте из чата группы${inMatch ? ' и из совместных чатов её match' : ''}.`;
    const ok = await confirmModal({ title: `Покинуть «${ellipsize(g.name || 'Группа', 40)}»?`, text, confirmLabel: 'Покинуть' });
    if (!ok) return;
    // чат группы и совместные чаты её match у меня больше не открываются
    const keys = ['group:' + gid, ...groupMatches.filter((m) => m.fromGroup === String(gid) || m.toGroup === String(gid)).map((m) => 'match:' + m.id)];
    const before = groups;
    optimistic({
      apply() {
        // группа уходит из «Моих групп» сразу (у оставшихся она живёт дальше — вернётся в ленту после сверки)
        groups = groups.filter((x) => String(x.id) !== String(gid));
        for (const key of keys) { chatLast.delete(key); chatUnread.delete(key); chatHistoryCache.delete(key); }
        if (chat && keys.includes(chatKey(chat))) leaveChat();
        groupDetailsId = null;
        if (openApp === 'groups') showGroupsScreen();
        repaintGroupsWorld();
        paintChatsList();
      },
      send: () => supabaseClient.rpc('leave_group', { gid: String(gid) }),
      undo() { groups = before; repaintGroupsWorld(); paintChatsList(); refreshChatSummariesSoon(); },
      fail: (error) => alert('Не удалось покинуть группу: ' + (error.message || error)
        + (/function|schema cache|could not find/i.test(error.message || '') ? '\n\nВыполните supabase_leave_group.sql в Supabase.' : '')),
      sync: () => refreshGroupsWorld().then(() => { refreshGroupsList(); paintChatsList(); refreshChatSummariesSoon(); }),
    });
  }

  async function startMatchVote(matchId) {
    const { error } = await supabaseClient.rpc('start_match_vote', { match_id: Number(matchId) });
    if (error) { alert('Не удалось начать голосование: ' + error.message); return; }
    await loadGroupMatchesFromDB();
    refreshMatchVotePanel();
  }

  async function castMatchVote(matchId, vote) {
    const { data: result, error } = await supabaseClient.rpc('cast_match_vote', { match_id: Number(matchId), vote });
    if (error) { alert('Не удалось проголосовать: ' + error.message); return; }
    if (result === 'open') { refreshMatchVotePanel(); return; }
    // голосование решено моим голосом — для анимации итога счёт известен: голоса до меня и мой
    const myId = currentUser && currentUser.id;
    const before = chat && chat.vote && String(chat.vote.m.id) === String(matchId) ? chat.vote.votes : [];
    voteFxTally.set(String(matchId), [...before.filter((v) => v.user_id !== myId), { user_id: myId, vote }]);
    // союз закреплён или распался: обновляем ленту, чаты, группы
    await refreshGroupsWorld();
    onMatchesChanged();
  }

  function scrollChatToBottom(smooth = false) {
    const body = winBody.querySelector('#chat-view-body');
    if (!body) return;
    if (smooth && !reduceMotion) { body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' }); return; }
    body.scrollTop = body.scrollHeight;
    body.autoTop = body.scrollTop;   // эту прокрутку сделал скрипт — плавающая дата на неё не показывается
    body.autoHeight = body.scrollHeight;
  }
  /* «У конца ленты» — до низа меньше CHAT_END_GAP или последнее сообщение хотя бы краем на экране.
     У конца новые сообщения ведут ленту за собой; дальше от него лента стоит, а на кнопке «вниз» растёт счётчик.
     Одна граница на то и другое: раньше лента переставала ехать за сообщениями уже в 80px от низа, а кнопка
     появлялась только после 160px — между ними новое сообщение уходило под край без кнопки и без счётчика. */
  const CHAT_END_GAP = 160;
  function chatNearEnd(body) {
    const gap = body.scrollHeight - body.scrollTop - body.clientHeight;
    if (gap < CHAT_END_GAP) return true;
    const last = body.lastElementChild;
    return !!last && gap < last.offsetHeight;
  }
  // Ведёт ли лента за новыми сообщениями: была у конца после последней прокрутки — или у конца прямо сейчас
  function chatFollowing(c) {
    const body = winBody.querySelector('#chat-view-body');
    return c.stick !== false || (!!body && chatNearEnd(body));
  }
  /* Кто двигает ленту: человек (палец, колесо, полоса прокрутки) или скрипт. Пока человек листает — и ещё секунду
     после, пока лента едет по инерции, — его прокрутку не перебиваем. chatFollowUntil — до какого момента лента
     держится у конца после того, как сама доехала до нового сообщения */
  let chatUserAt = 0, chatFingers = 0, chatFollowUntil = 0;
  const CHAT_FOLLOW_MS = 1500;
  function watchChatUserScroll(body) {
    const mark = (e) => { chatUserAt = performance.now(); if (e.touches) chatFingers = e.touches.length; };
    for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel', 'wheel', 'pointerdown']) body.addEventListener(type, mark, { passive: true });
  }
  const chatUserScrolling = () => chatFingers > 0 || performance.now() - chatUserAt < 1000;
  /* Кнопка «вниз», как в Telegram: появляется, когда ленту отлистали вверх, и возвращает к последним сообщениям.
     Пока лента отлистана, новые сообщения не сдёргивают её вниз — на кнопке растёт счётчик (chat.below) */
  function syncChatDown() {
    const body = winBody.querySelector('#chat-view-body'), btn = winBody.querySelector('#chat-down');
    if (!body || !btn || !chat) return;
    btn.classList.toggle('is-on', !chatNearEnd(body));
    const n = chat.below || 0, badge = btn.lastElementChild;
    badge.hidden = !n;
    badge.textContent = n > 99 ? '99+' : String(n);
  }

  function chatBubbleEl(id) {
    return winBody.querySelector(`#chat-view-body [data-msg-id="${CSS.escape(String(id))}"]`);
  }

  // stay — ленту не трогаем: её отлистали вверх, а сообщение чужое
  function appendChatBubble(m, stay = false) {
    const body = winBody.querySelector('#chat-view-body');
    if (!body) return;
    const empty = body.querySelector('.empty-msg');
    if (empty) empty.remove();
    body.insertAdjacentHTML('beforeend', chatBubbleHtml(m));
    const el = body.lastElementChild;
    syncChatDates(body);
    syncChatRuns(body, false);   // продолжает серию — имя над ним не нужно, аватар переходит к нему
    fitChatBubbles([el]);
    el.classList.add('is-new');   // новое сообщение «выпрыгивает»
    // ответ лидера на предложение — у самого предложения вместо кнопок появляется итог
    if (m.answer) { const pm = chatMsgById(m.answer.to); if (pm) replaceChatBubble(pm.id, pm); }
    hydrateChatMedia(body);
    if (!stay) { chatFollowUntil = performance.now() + CHAT_FOLLOW_MS; scrollChatToBottom(); }
  }

  function replaceChatBubble(oldId, m) {
    const el = chatBubbleEl(oldId);
    if (!el) return;
    el.insertAdjacentHTML('afterend', chatBubbleHtml(m));
    const next = el.nextElementSibling;
    el.remove();
    syncChatRuns(next.parentElement, false);
    fitChatBubbles([next]);
    hydrateChatMedia(winBody.querySelector('#chat-view-body'));
  }

  function chatMediaFolder(c) {
    if (c.type === 'dm') {
      const [a, b] = [String(currentUser.id), String(c.peerId)].sort();
      return `dm/${a}/${b}`;
    }
    if (c.type === 'match') return `match/${c.matchId}`;
    return `group/${c.groupId}`;
  }

  function baseMime(type) { return String(type || '').split(';')[0].trim(); }

  function extForMime(type) {
    return ({
      'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif',
      'video/mp4': 'mp4', 'video/webm': 'webm', 'video/quicktime': 'mov',
      'audio/webm': 'webm', 'audio/mp4': 'm4a', 'audio/ogg': 'ogg', 'audio/mpeg': 'mp3', 'audio/aac': 'aac',
    })[baseMime(type)] || 'bin';
  }

  /* Ответ на сообщение хранится в колонке reply (supabase_chat_reply.sql): { id, name, text } — снимок того,
     на что ответили; у пересланного там же — автор оригинала (см. normForward). Без колонки сообщение уходит
     обычным: без цитаты и без подписи «Переслано». */
  let chatReplyMissing = false;
  async function insertChatRow(c, fields) {
    if (chatReplyMissing) fields = { ...fields, reply: null };
    let res = await insertChatRowRaw(c, fields);
    if (res.error && fields.reply && /reply/i.test(res.error.message || '')) {
      chatReplyMissing = true;
      res = await insertChatRowRaw(c, { ...fields, reply: null });
      alert(`Сообщение отправлено без ${fields.reply.fwd ? 'подписи «Переслано»' : fields.reply.share ? 'карточки группы' : 'цитаты'}: чтобы работали ответы и пересылка с автором, выполните supabase_chat_reply.sql в Supabase.`);
    }
    return res;
  }
  async function insertChatRowRaw(c, { kind, content, mediaPath, duration, fileName, fileSize, reply }) {
    // имя и размер — только у файлов: так фото/голосовые работают и без миграции supabase_chat_files.sql
    const fileCols = kind === 'file' ? { file_name: fileName || null, file_size: fileSize || null } : {};
    if (reply) fileCols.reply = reply;
    if (c.type === 'dm') {
      const row = { from_id: currentUser.id, to_id: c.peerId, content: content || '' };
      if (reply) row.reply = reply;
      // Для текста шлём только старые поля — так текст работает и до выполнения миграции
      if (kind !== 'text') Object.assign(row, { kind, media_path: mediaPath, duration: duration || null }, fileCols);
      const { data, error } = await supabaseClient.from('dm_messages').insert(row).select().single();
      return { data: data ? normDmRow(data) : null, error };
    }
    const row = {
      user_id: currentUser.id, author_name: profile.name,
      content: content || '', kind, media_path: mediaPath || null, duration: duration || null, ...fileCols,
    };
    if (c.type === 'match') {
      row.match_id = Number(c.matchId);
      const { data, error } = await supabaseClient.from('match_messages').insert(row).select().single();
      return { data: data ? normMatchRow(data) : null, error };
    }
    row.group_id = c.groupId;
    const { data, error } = await supabaseClient.from('group_messages').insert(row).select().single();
    return { data: data ? normGroupRow(data) : null, error };
  }

  // special — запись для колонки reply вместо цитаты: предложение в чате группы или ответ лидера на него
  async function sendChatMessage({ kind = 'text', content = '', blob = null, duration = null, fileName = null, special = null }) {
    const c = chat;
    if (!c || !currentUser) return;
    let mediaPath = null, localUrl = null;
    const fileSize = kind === 'file' && blob ? blob.size : null;
    if (blob) {
      // у документа берём его собственное расширение (в хранилище — служебное имя, настоящее — в file_name)
      const ext = kind === 'file' ? (fileExt(fileName) || 'bin') : extForMime(blob.type);
      mediaPath = `${chatMediaFolder(c)}/${currentUser.id}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      localUrl = URL.createObjectURL(blob);
    }
    const tmp = {
      id: 'tmp-' + Date.now() + Math.random().toString(36).slice(2, 6),
      fromId: currentUser.id, toId: c.peerId || null, groupId: c.groupId || null, matchId: c.matchId || null, authorName: profile.name,
      content, kind, mediaPath, duration, fileName, fileSize, localUrl, pending: true, createdAt: new Date().toISOString(),
    };
    // отвечаем на сообщение — цитата уходит с первым отправленным, плашка над полем ввода убирается
    const reply = special || (c.replyTo ? replySnapshot(c.replyTo) : null);
    if (special) { tmp.propose = normPropose(special); tmp.answer = normAnswer(special); }
    else if (reply) { tmp.reply = reply; c.replyTo = null; if (chat === c) syncChatReplyBar(); }
    c.messages.push(tmp);
    if (chat === c) appendChatBubble(tmp);
    // фото, видео и документы, пока грузятся, — у собеседника «отправляет файл» (голосовые и кружки уходят быстро)
    const showsUpload = !!blob && ['image', 'video', 'file'].includes(kind);
    if (showsUpload) typingUpload(c, 1);
    try {
      if (blob) {
        const { error: upErr } = await supabaseClient.storage.from(CHAT_BUCKET)
          .upload(mediaPath, blob, { contentType: baseMime(blob.type) || 'application/octet-stream', upsert: false });
        if (upErr) throw upErr;
      }
      const { data, error } = await insertChatRow(c, { kind, content, mediaPath, duration, fileName, fileSize, reply });
      if (error) throw error;
      // своё фото, голосовое или кружок сразу остаётся на устройстве — при следующем открытии чата не скачивается
      if (blob && ['image', 'voice', 'circle'].includes(kind)) rememberMediaBlob(mediaPath, blob, localUrl);
      if (data) { data.localUrl = localUrl; finalizeChatMessage(c, tmp.id, data); noteChatMessage(data, true); }
      saveChatCache(c);
    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      console.warn('[chat] send:', msg);
      c.messages = c.messages.filter((x) => x.id !== tmp.id);
      if (chat === c) { const el = chatBubbleEl(tmp.id); if (el) el.remove(); }
      // Документы требуют миграции: без неё хранилище не примет тип файла, а таблица — kind='file'
      const needsSql = kind === 'file' && /mime|file_name|file_size|kind_check|check constraint/i.test(msg);
      alert('Не удалось отправить: ' + msg + (needsSql ? '\n\nВыполните supabase_chat_files.sql в Supabase.' : ''));
    } finally {
      if (showsUpload) typingUpload(c, -1);
    }
  }

  function finalizeChatMessage(c, tmpId, real) {
    const idx = c.messages.findIndex((x) => x.id === tmpId);
    if (idx === -1) return; // уже заменили копией из realtime
    if (c.messages.some((x) => x.id === real.id)) {
      c.messages.splice(idx, 1);
      if (chat === c) { const el = chatBubbleEl(tmpId); if (el) el.remove(); }
      return;
    }
    c.messages[idx] = real;
    if (chat === c) replaceChatBubble(tmpId, real);
  }

  // Новое сообщение из realtime (личное или групповое)
  function onIncomingChatRow(m) {
    if (sharedLive) sharedLive.offer(m);   // открыт профиль или карточка этого чата — фото, ссылка, файл появляются во вкладках
    const c = chat;
    const belongs = c && (
      c.type === 'dm'
        ? m.groupId === null && m.matchId === null && (String(m.fromId) === String(c.peerId) || String(m.toId) === String(c.peerId))
        : c.type === 'match'
          ? m.matchId !== null && String(m.matchId) === String(c.matchId)
          : m.groupId !== null && String(m.groupId) === String(c.groupId));
    if (!belongs) {
      rememberIncomingMessage(m);
      noteChatMessage(m, false);
      return;
    }
    // сообщение пришло — подпись «печатает» у его автора снимаем сразу
    if (c.typing && c.typing.delete(String(m.fromId))) paintTyping(c);
    if (c.messages.some((x) => x.id === m.id)) return;
    // ленту отлистали вверх — чужое сообщение читающего вниз не сдёргивает: оно ждёт под кнопкой «вниз»
    const away = !isMyMsg(m) && !chatFollowing(c);
    // чат открыт, но приложение свёрнуто (или лента отлистана) — сообщение ещё не видели; отметка снимется позже
    noteChatMessage(m, !document.hidden && !away);
    if (String(m.fromId) === String(currentUser.id)) {
      // Своё сообщение может прийти раньше ответа на insert — заменяем черновик, а не дублируем
      const tmp = c.messages.find((x) => x.pending && x.kind === m.kind &&
        (m.mediaPath ? x.mediaPath === m.mediaPath : x.content === m.content));
      if (tmp) {
        m.localUrl = tmp.localUrl;
        c.messages[c.messages.indexOf(tmp)] = m;
        replaceChatBubble(tmp.id, m);
        saveChatCache(c);
        return;
      }
    }
    c.messages.push(m);
    appendChatBubble(m, away);
    saveChatCache(c);
    if (away) { c.below = (c.below || 0) + 1; syncChatDown(); } else markChatRead(c);
  }

  function sendChatText() {
    const input = winBody.querySelector('#chat-text');
    if (!input) return;
    const text = input.value.trim();
    const edit = chat && chat.editing;
    if (edit) {
      // у текста пустым он быть не может (для этого есть «Удалить»), у фото и файла подпись можно стереть
      if (!text && (edit.kind || 'text') === 'text') return;
      setChatEdit(null);
      editChatMessage(edit, text);
      return;
    }
    if (!text) return;
    input.value = '';
    fitChatInput(input);
    sendTyping(chat, typingNowKind(chat));
    sendChatMessage({ kind: 'text', content: text });
  }

  function imageFileToBlob(file, maxSide = 1600, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image decode error')); };
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/jpeg', quality);
      };
      img.src = url;
    });
  }

  async function onChatFilesPicked(e) {
    const input = e.target;
    const files = [...(input.files || [])];
    input.value = '';
    for (const file of files) {
      if (file.type.startsWith('image/')) {
        // GIF отправляем как есть, чтобы не потерять анимацию; остальное — сжимаем
        const blob = file.type === 'image/gif' ? file : await imageFileToBlob(file).catch(() => file);
        sendChatMessage({ kind: 'image', blob });
      } else if (file.type.startsWith('video/')) {
        if (file.size > MAX_VIDEO_BYTES) { alert(`Видео «${file.name}» больше 50 МБ`); continue; }
        sendChatMessage({ kind: 'video', blob: file });
      } else {
        // Любой другой файл — PDF, документ, таблица, архив — уходит карточкой с именем и размером
        if (BLOCKED_FILE_EXT.has(fileExt(file.name))) { alert(`Файл «${file.name}» нельзя отправить: исполняемые файлы и скрипты запрещены`); continue; }
        if (file.size > MAX_VIDEO_BYTES) { alert(`Файл «${file.name}» больше 50 МБ`); continue; }
        if (!file.size) { alert(`Файл «${file.name}» пустой`); continue; }
        sendChatMessage({ kind: 'file', blob: file, fileName: file.name });
      }
    }
  }

  /* ── Запись голосовых и видеокружков ── */
  let chatRec = null; // { kind, recorder, stream, chunks, startedAt, timer, discard, chat }
  let chatRecPending = null;   // нажали «записать», а микрофон или камера ещё включаются: { kind, chat }

  function pickRecorderMime(kind) {
    // Сначала MP4 (H.264/AAC): так пишет iPhone, и такой файл играет и в Safari, и в Chrome.
    // WebM — запасной вариант для браузеров без записи в MP4.
    const list = kind === 'voice'
      ? ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus']
      : ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4',
         'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm'];
    return list.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  }

  async function startChatRecording(kind) {
    if (chatRec || chatRecPending || !chat) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      alert('Запись не поддерживается в этом браузере (нужен HTTPS или localhost)');
      return;
    }
    const c = chat;
    /* Панель записи — сразу по нажатию: микрофон и тем более камера включаются на телефоне до секунды, и раньше
       всё это время казалось, что кнопка не сработала. Время пойдёт, когда запись действительно началась;
       «Отмена» или «Отправить» до этого — просто ничего не записано */
    const pending = { kind, chat: c };
    chatRecPending = pending;
    setRecordingUi(true, kind, null);
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia(kind === 'voice'
        ? { audio: { echoCancellation: true, noiseSuppression: true } }
        : { audio: true, video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } } });
    } catch (err) {
      console.warn('[chat rec] getUserMedia:', err);
      if (chatRecPending !== pending) return;   // уже отменили — сообщать не о чем
      chatRecPending = null;
      setRecordingUi(false);
      alert(kind === 'voice' ? 'Нет доступа к микрофону' : 'Нет доступа к камере или микрофону');
      return;
    }
    if (chatRecPending !== pending || chat !== c || chatRec) {
      stream.getTracks().forEach((t) => t.stop());
      if (chatRecPending === pending) { chatRecPending = null; setRecordingUi(false); }
      return;
    }
    chatRecPending = null;

    const mimeType = pickRecorderMime(kind);
    const opts = {};
    if (mimeType) opts.mimeType = mimeType;
    if (kind === 'circle') opts.videoBitsPerSecond = 1000000;
    const recorder = new MediaRecorder(stream, opts);
    const rec = { kind, recorder, stream, chunks: [], startedAt: Date.now(), timer: null, discard: false, chat: c };
    chatRec = rec;

    recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) rec.chunks.push(ev.data); };
    recorder.onstop = () => {
      finishRecordingUi(rec);
      if (rec.discard || !rec.chunks.length || chat !== rec.chat) return;
      const duration = (Date.now() - rec.startedAt) / 1000;
      if (duration < 0.7) return; // случайное нажатие
      const type = recorder.mimeType || (rec.chunks[0] && rec.chunks[0].type) || mimeType
        || (kind === 'voice' ? 'audio/mp4' : 'video/mp4');
      sendChatMessage({ kind, blob: new Blob(rec.chunks, { type }), duration: Math.round(duration * 10) / 10 });
    };
    // Без timeslice: Safari на iPhone при записи кусками склеивает битый файл,
    // который потом не воспроизводится. Весь файл придёт одним куском при stop().
    recorder.start();
    setRecordingUi(true, kind, stream);
    sendTyping(c, kind);

    const maxSec = kind === 'voice' ? MAX_VOICE_SEC : MAX_CIRCLE_SEC;
    rec.timer = setInterval(() => {
      const sec = (Date.now() - rec.startedAt) / 1000;
      const t = winBody.querySelector('#chat-rec-time');
      if (t) t.textContent = fmtDuration(sec);
      sendTyping(c, kind);   // подтверждение для собеседника — не чаще раза в 3 с
      if (sec >= maxSec) stopChatRecording(false);
    }, 250);
  }

  function finishRecordingUi(rec) {
    clearInterval(rec.timer);
    rec.stream.getTracks().forEach((t) => t.stop());
    if (chatRec === rec) chatRec = null;
    setRecordingUi(false);
    sendTyping(rec.chat, typingNowKind(rec.chat));
  }

  function stopChatRecording(discard) {
    const rec = chatRec;
    if (!rec && chatRecPending) { chatRecPending = null; setRecordingUi(false); return; }   // запись так и не началась
    if (!rec) return;
    rec.discard = discard;
    if (rec.recorder.state !== 'inactive') rec.recorder.stop();
    else finishRecordingUi(rec);
  }

  function setRecordingUi(on, kind, stream) {
    const composer = winBody.querySelector('#chat-composer');
    const bar = winBody.querySelector('#chat-recbar');
    const prev = winBody.querySelector('#chat-rec-preview');
    if (composer) composer.hidden = on;
    if (bar) bar.hidden = !on;
    if (on) {
      const label = winBody.querySelector('#chat-rec-label');
      if (label) label.textContent = kind === 'voice' ? 'Голосовое' : 'Видеокружок';
      const t = winBody.querySelector('#chat-rec-time');
      if (t) t.textContent = '0:00';
    }
    if (prev) {
      const v = prev.querySelector('video');
      if (on && kind === 'circle') { v.srcObject = stream; v.play().catch(() => {}); prev.hidden = false; }
      else { if (v) v.srcObject = null; prev.hidden = true; }
    }
  }

  /* ── Просмотр фото и видео ──
     Фото целиком вписано в экран. Нажатие на фото увеличивает его вокруг точки нажатия (до настоящего размера,
     но не меньше чем вдвое) — дальше оно листается колесом, тачпадом, пальцем или перетаскивается мышью;
     ещё одно нажатие возвращает обратно. Закрыть: крестик, Esc или нажатие мимо фото.
     Если открыт набор (вкладка «Медиа» в профиле собеседника), его листают стрелки по краям, клавиши ← и →
     и смахивание пальцем по фото; видео открывается со своими кнопками управления.
     items — [{ kind: 'image' | 'video', src }]; вместо src может быть resolve(): адрес файла узнаётся,
     когда до него долистали. */
  let closePhotoViewer = null;
  function openPhotoViewer(src) { openMediaViewer([{ kind: 'image', src }], 0); }
  function openMediaViewer(items, start = 0) {
    if (closePhotoViewer) closePhotoViewer();
    // клавиатура телефона не должна закрывать собой фото
    const focused = document.activeElement;
    if (focused && focused !== document.body && focused.blur) { try { focused.blur(); } catch {} }
    const many = items.length > 1;
    const icon = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
    const back = document.createElement('div');
    back.className = 'photo-viewer';
    back.setAttribute('role', 'dialog');
    back.setAttribute('aria-modal', 'true');
    back.setAttribute('aria-label', 'Просмотр фото и видео');
    back.innerHTML = `
      <div class="pv-stage"></div>
      ${many ? `<span class="pv-count" aria-live="polite"></span>
      <button type="button" class="pv-nav pv-prev" data-pv-step="-1" aria-label="Предыдущее" title="Предыдущее">${icon('M14.5 5.5 8 12l6.5 6.5')}</button>
      <button type="button" class="pv-nav pv-next" data-pv-step="1" aria-label="Следующее" title="Следующее">${icon('M9.5 5.5 16 12l-6.5 6.5')}</button>` : ''}
      <button type="button" class="pv-close" aria-label="Закрыть" title="Закрыть">${icon('M6 6l12 12M18 6 6 18')}</button>`;
    const stage = back.querySelector('.pv-stage');
    let index = -1, media = null, zoomed = false, drag = null, dragged = false, finger = null, turn = 0;
    const isPhoto = () => !!media && media.tagName === 'IMG';

    const setZoom = (on, x, y) => {
      if (on === zoomed) return;
      if (!on) {
        zoomed = false;
        back.classList.remove('is-zoomed');
        if (media) media.style.width = media.style.height = '';
        return;
      }
      if (!isPhoto()) return;
      const img = media, fit = img.getBoundingClientRect();
      if (!img.naturalWidth || !fit.width) return;   // фото ещё не загрузилось
      let k = img.naturalWidth / fit.width;
      if (!(k >= 1.5)) k = 2;                         // фото и так показано почти в настоящем размере — увеличиваем вдвое
      k = Math.min(k, 5);
      const fx = (x - fit.left) / fit.width, fy = (y - fit.top) / fit.height;
      zoomed = true;
      img.style.width = Math.round(fit.width * k) + 'px';
      img.style.height = Math.round(fit.height * k) + 'px';
      back.classList.add('is-zoomed');
      // точка, по которой нажали, остаётся под пальцем или курсором
      const big = img.getBoundingClientRect();
      stage.scrollLeft += big.left + fx * big.width - x;
      stage.scrollTop += big.top + fy * big.height - y;
    };

    // Показать фото или видео под номером i
    const show = async (i) => {
      i = Math.max(0, Math.min(items.length - 1, i));
      if (i === index) return;
      index = i;
      const mine = ++turn;
      setZoom(false);
      stage.textContent = '';
      media = null;
      if (many) {
        back.querySelector('.pv-count').textContent = `${i + 1} / ${items.length}`;
        back.querySelector('.pv-prev').disabled = i === 0;
        back.querySelector('.pv-next').disabled = i === items.length - 1;
      }
      const item = items[i];
      let url = item.src || '';
      if (!url && item.resolve) { try { url = (await item.resolve()) || ''; } catch { url = ''; } }
      if (mine !== turn || !back.isConnected || !url) return;   // пока узнавали адрес, уже перелистнули или закрыли
      if (item.kind === 'video') {
        media = document.createElement('video');
        media.controls = true;
        media.autoplay = true;
        media.setAttribute('playsinline', '');
      } else {
        media = document.createElement('img');
        media.alt = '';
        media.draggable = false;
      }
      media.src = url;
      stage.appendChild(media);
    };

    const onKey = (e) => {
      if (e.key === 'Escape') {
        e.preventDefault(); e.stopPropagation();   // Esc закрывает только просмотр, окно под ним остаётся
        close();
      } else if (many && !zoomed && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault(); e.stopPropagation();
        show(index + (e.key === 'ArrowLeft' ? -1 : 1));
      }
    };
    // увеличенное фото перетаскивается мышью (пальцем и тачпадом оно листается само)
    const onMove = (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!dragged && Math.hypot(dx, dy) < 5) return;
      dragged = true;
      stage.classList.add('is-dragging');
      stage.scrollLeft = drag.left - dx;
      stage.scrollTop = drag.top - dy;
    };
    const onUp = () => { drag = null; stage.classList.remove('is-dragging'); };
    function close() {
      turn++;
      document.removeEventListener('keydown', onKey, true);
      removeEventListener('pointermove', onMove);
      removeEventListener('pointerup', onUp);
      removeEventListener('pointercancel', onUp);
      back.remove();
      if (closePhotoViewer === close) closePhotoViewer = null;
    }

    stage.addEventListener('pointerdown', (e) => {
      dragged = false;
      if (!zoomed || e.pointerType !== 'mouse' || e.button !== 0) return;
      e.preventDefault();
      drag = { x: e.clientX, y: e.clientY, left: stage.scrollLeft, top: stage.scrollTop };
    });
    // смахивание пальцем по фото листает набор (у видео свои жесты — перемотка по полосе)
    stage.addEventListener('touchstart', (e) => {
      finger = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
    }, { passive: true });
    stage.addEventListener('touchend', (e) => {
      const from = finger, t = e.changedTouches[0];
      finger = null;
      if (!many || !from || !t || zoomed || !isPhoto()) return;
      const dx = t.clientX - from.x, dy = t.clientY - from.y;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) show(index + (dx < 0 ? 1 : -1));
    }, { passive: true });
    back.addEventListener('click', (e) => {
      if (e.target.closest('.pv-close')) { close(); return; }
      const step = e.target.closest('[data-pv-step]');
      if (step) { show(index + Number(step.dataset.pvStep)); return; }
      if (dragged) { dragged = false; return; }   // кнопку отпустили после перетаскивания — это не нажатие
      const r = media ? media.getBoundingClientRect() : null;
      const onMedia = !!r && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (!onMedia) close();
      else if (isPhoto()) setZoom(!zoomed, e.clientX, e.clientY);   // у видео нажатие — это его кнопки
    });
    document.addEventListener('keydown', onKey, true);
    addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
    addEventListener('pointercancel', onUp);
    document.body.appendChild(back);
    closePhotoViewer = close;
    show(start);
  }

  /* Нажали «играть» на голосовом или кружке, а ссылка на файл ещё подставляется (сообщение только что пришло,
     чат только что открыли) — раньше нажатие просто терялось. Теперь кнопка ждёт файл и включает его сама;
     повторное нажатие, пока ждёт, — передумали */
  function waitToPlay(box) {
    const stop = () => { delete box.dataset.wantPlay; box.classList.remove('is-wait'); };
    if (box.dataset.wantPlay) { stop(); return; }
    box.dataset.wantPlay = '1';
    box.classList.add('is-wait');
    setTimeout(() => { if (box.dataset.wantPlay) stop(); }, 15000);
  }
  function playWanted(el) {
    const box = el.closest && el.closest('[data-want-play]');
    if (!box || !box.isConnected) return;
    delete box.dataset.wantPlay;
    box.classList.remove('is-wait');
    if (box.matches('[data-voice]')) toggleVoice(box); else if (box.matches('[data-circle]')) toggleCircle(box);
  }

  // Кружок: по умолчанию крутится без звука; тап — проиграть со звуком, повторный тап — пауза
  function toggleCircle(wrap) {
    const video = wrap.querySelector('video');
    if (!video) return;
    if (!video.src) { waitToPlay(wrap); return; }
    if (video.muted) {
      // играет одно сообщение: другой кружок со звуком возвращается к беззвучному повтору, голосовое — на паузу
      if (nowPlaying && nowPlaying !== video) { if (nowPlaying.tagName === 'VIDEO') stopChatPlayer(); else nowPlaying.pause(); }
      video.muted = false; video.loop = false; video.currentTime = 0;
      const backToLoop = () => {
        video.muted = true; video.loop = true; video.onended = null;
        const w = video.closest('.chat-circle-wrap');   // лента могла перерисоваться — кружок тот же, обёртка новая
        if (w) w.classList.remove('is-playing');
        video.play().catch(() => {});
      };
      // телефон не дал включить звук без нажатия — кружок возвращается к беззвучному повтору, а не замирает
      video.play().catch((err) => {
        if (!err || err.name !== 'NotAllowedError' || video.muted) return;
        backToLoop();
        if (nowPlaying === video) { nowPlaying = null; syncChatPlayer(); }
      });
      const ring = wrap.querySelector('.ccr-on');
      if (ring) ring.style.strokeDashoffset = '100';
      wrap.classList.add('is-playing');
      video.onended = () => { backToLoop(); playNextInQueue(video); };
      // уже крутился без звука — события «play» не будет, полоску «сейчас играет» включаем сами
      nowPlaying = video;
      syncChatPlayer();
    } else if (video.paused) video.play().catch(() => {});
    else video.pause();
  }
  // Шкала по контуру кружка: сколько прослушано. Плавно — по кадрам, пока кружок звучит
  let circleRingRaf = 0;
  function paintCircleRing() {
    circleRingRaf = 0;
    const v = nowPlaying;
    if (!v || v.tagName !== 'VIDEO' || !v.isConnected || v.muted) return;
    const wrap = v.closest('.chat-circle-wrap'), ring = wrap && wrap.querySelector('.ccr-on');
    const msgEl = v.closest('.chat-msg[data-msg-id]'), m = msgEl ? chatMsgById(msgEl.dataset.msgId) : null;
    const dur = (isFinite(v.duration) && v.duration > 0 ? v.duration : 0) || (m && Number(m.duration)) || 0;
    if (ring) ring.style.strokeDashoffset = String(100 - (dur ? Math.min(100, v.currentTime / dur * 100) : 0));
    if (!v.paused && !v.ended) circleRingRaf = requestAnimationFrame(paintCircleRing);
  }

  /* ── Голосовое: свой плеер ──
     «Волна» — условная: высоты полосок считаются из адреса файла, поэтому у одного сообщения она всегда
     одна и та же. Полоски до текущего места яркие; нажатие по волне перематывает. */
  const VOICE_BARS = 30;
  function voiceBarsHtml(seed) {
    let h = 7;
    for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    let out = '';
    for (let i = 0; i < VOICE_BARS; i++) {
      h = (h * 1103515245 + 12345) >>> 0;
      out += `<i style="height:${22 + ((h >>> 16) % 79)}%"></i>`;
    }
    return out;
  }
  // у записей с телефона браузер часто не знает длину файла — тогда берём сохранённую в сообщении
  function voiceDuration(box) {
    const a = box.querySelector('audio');
    return a && isFinite(a.duration) && a.duration > 0 ? a.duration : Number(box.dataset.dur) || 0;
  }
  function paintVoice(box) {
    const a = box.querySelector('audio');
    if (!a) return;
    const dur = voiceDuration(box), playing = !a.paused && !a.ended;
    box.classList.toggle('is-playing', playing);
    const bars = box.querySelectorAll('.cv-wave i');
    const on = dur ? Math.round(Math.min(1, a.currentTime / dur) * bars.length) : 0;
    bars.forEach((b, i) => b.classList.toggle('is-on', i < on));
    const label = box.querySelector('.chat-voice-dur');
    if (label) label.textContent = fmtDuration(a.currentTime > 0 ? a.currentTime : dur);
    const btn = box.querySelector('.cv-play');
    if (btn) btn.setAttribute('aria-label', playing ? 'Пауза' : 'Воспроизвести');
  }
  function toggleVoice(box) {
    const a = box.querySelector('audio');
    if (!a) return;
    if (!a.getAttribute('src')) { markVoiceHeard(box); waitToPlay(box); return; }
    if (!a.paused) { a.pause(); return; }
    markVoiceHeard(box);
    winBody.querySelectorAll('.chat-voice audio').forEach((o) => { if (o !== a) o.pause(); });   // играет одно голосовое
    if (nowPlaying && nowPlaying.tagName === 'VIDEO') stopChatPlayer();                          // и не вместе с кружком
    a.play().catch(() => {});
  }
  /* ── Прослушано или нет ──
     Чужое голосовое, которое ещё не включали, горит ярко (.is-unheard); после первого нажатия «играть» (или когда
     до него дошла очередь) — обычное. Что прослушано, помнит устройство, отдельно для каждого аккаунта.
     Голосовые, пришедшие до первого запуска этой версии, считаются прослушанными — иначе после обновления
     загорелась бы вся старая переписка */
  const HEARD_MAX = 3000;
  let heardVoices = null;   // { uid, base, ids }
  const heardStoreKey = (uid) => 'chat.heard.v1:' + uid;
  function heardStore() {
    const uid = currentUser ? String(currentUser.id) : '';
    if (heardVoices && heardVoices.uid === uid) return heardVoices;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(heardStoreKey(uid)) || 'null'); } catch {}
    heardVoices = { uid, base: (saved && Number(saved.base)) || Date.now(), ids: new Set((saved && saved.ids) || []) };
    if (!saved) saveHeard();
    return heardVoices;
  }
  function saveHeard() {
    const h = heardVoices;
    if (!h || !h.uid) return;
    if (h.ids.size > HEARD_MAX) h.ids = new Set([...h.ids].slice(-HEARD_MAX));
    try { localStorage.setItem(heardStoreKey(h.uid), JSON.stringify({ base: h.base, ids: [...h.ids] })); } catch {}
  }
  const heardKey = (id) => `${chat ? chat.type : ''}:${id}`;
  function isUnheardVoice(m) {
    if (!currentUser || m.kind !== 'voice' || m.pending || String(m.fromId) === String(currentUser.id)) return false;
    const h = heardStore();
    return msgTs(m) > h.base && !h.ids.has(heardKey(m.id));
  }
  function markVoiceHeard(box) {
    if (!box || !box.classList.contains('is-unheard')) return;
    box.classList.remove('is-unheard');
    const msgEl = box.closest('.chat-msg[data-msg-id]');
    if (!msgEl) return;
    heardStore().ids.add(heardKey(msgEl.dataset.msgId));
    saveHeard();
  }
  function seekVoice(box, clientX) {
    const a = box.querySelector('audio'), wave = box.querySelector('.cv-wave'), dur = voiceDuration(box);
    if (!a || !a.getAttribute('src') || !dur) return;
    const r = wave.getBoundingClientRect();
    try { a.currentTime = Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * dur; } catch {}
    paintVoice(box);
  }

  /* ── «Сейчас играет»: полоска над лентой, как в Telegram ──
     Пока звучит голосовое или кружок со звуком (или стоит на паузе посередине), над лентой — чьё это сообщение,
     время, пауза и крестик, который останавливает. Нажатие на имя — к самому сообщению */
  let nowPlaying = null;   // <audio> голосового или <video> кружка
  function syncChatPlayer() {
    const bar = winBody.querySelector('#chat-player');
    if (!bar) return;
    const el = nowPlaying && nowPlaying.isConnected ? nowPlaying : null;
    if (!el) { nowPlaying = null; if (!bar.hidden) bar.hidden = true; return; }
    const circle = el.tagName === 'VIDEO';
    const msgEl = el.closest('.chat-msg[data-msg-id]');
    const m = msgEl ? chatMsgById(msgEl.dataset.msgId) : null;
    const dur = circle ? ((isFinite(el.duration) && el.duration > 0 ? el.duration : 0) || (m && Number(m.duration)) || 0)
      : voiceDuration(el.closest('.chat-voice'));
    const playing = !el.paused && !el.ended;
    bar.hidden = false;
    bar.classList.toggle('is-playing', playing);
    bar.querySelector('.cp-title').textContent = m ? msgAuthorName(m) : (circle ? 'Видеосообщение' : 'Голосовое сообщение');
    bar.querySelector('.cp-sub').textContent = (circle ? 'Видеосообщение' : 'Голосовое сообщение') + ' · '
      + fmtDuration(el.currentTime) + (dur ? ' / ' + fmtDuration(dur) : '');
    bar.style.setProperty('--p', (dur ? Math.min(100, el.currentTime / dur * 100) : 0).toFixed(1) + '%');
    const btn = bar.querySelector('[data-player-toggle]');
    btn.setAttribute('aria-label', playing ? 'Пауза' : 'Воспроизвести');
  }
  function stopChatPlayer() {
    const el = nowPlaying;
    nowPlaying = null;
    if (el && el.isConnected) {
      if (el.tagName === 'VIDEO') {
        // кружок возвращается к беззвучному повтору, как после конца
        el.muted = true; el.loop = true; el.onended = null;
        const wrap = el.closest('.chat-circle-wrap');
        if (wrap) wrap.classList.remove('is-playing');
        try { el.currentTime = 0; } catch {}
        el.play().catch(() => {});
      } else {
        el.pause();
        try { el.currentTime = 0; } catch {}
        const box = el.closest('.chat-voice');
        if (box) paintVoice(box);
      }
    }
    syncChatPlayer();
  }
  function toggleChatPlayer() {
    const el = nowPlaying;
    if (!el || !el.isConnected) return;
    if (el.tagName === 'AUDIO') { toggleVoice(el.closest('.chat-voice')); return; }
    if (el.paused) el.play().catch(() => {}); else el.pause();
  }

  /* ── Сообщения: кеш переписки, закрепление, выбор, удаление, пересылка ── */
  const chatHistoryCache = new Map();   // ключ чата → сообщения (последние CHAT_KEEP)
  function chatKey(c) { return c.type === 'dm' ? 'dm:' + c.peerId : c.type === 'match' ? 'match:' + c.matchId : 'group:' + c.groupId; }
  function saveChatCache(c) {
    if (!currentUser || !c) return;
    const list = c.messages.filter((m) => !m.pending).slice(-CHAT_KEEP).map(({ localUrl, pending, ...m }) => m);
    const key = chatKey(c);
    chatHistoryCache.set(key, list);
    KV.set(`chat:${currentUser.id}:${key}`, list);
  }
  // Сообщение в чат, который сейчас не открыт: дописываем в его сохранённую переписку —
  // когда чат откроют, оно уже будет на месте, а не появится после ответа сервера
  async function rememberIncomingMessage(m) {
    if (!currentUser) return;
    const uid = currentUser.id, key = msgChatKey(m);
    prefetchChatMedia([m]);
    let list = chatHistoryCache.get(key);
    if (!list) {
      const saved = await KV.get(`chat:${uid}:${key}`);
      if (!currentUser || currentUser.id !== uid) return;
      list = chatHistoryCache.get(key) || (Array.isArray(saved) ? saved : null);
      if (!list) return;   // переписки на устройстве нет — её целиком загрузит preheatChats или сам чат
      chatHistoryCache.set(key, list);
    }
    if (list.some((x) => String(x.id) === String(m.id))) return;
    list.push(m);
    if (list.length > CHAT_KEEP) list.splice(0, list.length - CHAT_KEEP);
    KV.set(`chat:${uid}:${key}`, list);
  }

  /* После входа, в фоне: переписки всех чатов и вложения последних сообщений — на устройство.
     Тогда любой чат, даже тот, что ещё не открывали, появляется сразу и с фото. */
  /* Работа фоновая, поэтому она уступает дорогу: не чаще раза в 30 минут, только 20 чатов, и пока человек
     сидит в каком-то чате или приложение свёрнуто — ждёт, чтобы не отнимать сеть у того, что он смотрит. */
  let chatsPrefetching = false;
  const PREFETCH_EVERY = 30 * 60 * 1000;
  async function prefetchChats() {
    if (chatsPrefetching || !currentUser) return;
    const uid = currentUser.id;
    const stampKey = 'chat.prefetch.v1:' + uid;
    try { if (Date.now() - Number(localStorage.getItem(stampKey) || 0) < PREFETCH_EVERY) return; } catch {}
    chatsPrefetching = true;
    const mine = () => currentUser && currentUser.id === uid;
    const idle = async () => { while (mine() && (chat || document.hidden)) await new Promise((r) => setTimeout(r, 3000)); };
    try {
      for (const { spec } of forwardTargets().slice(0, 20)) {
        await idle();
        if (!mine()) return;
        const key = chatKey(spec);
        if (chat && chatKey(chat) === key) continue;   // открытый чат обновляет себя сам
        let list = await loadChatHistory(spec);
        if (!mine()) return;
        if (list && !(chat && chatKey(chat) === key)) {
          chatHistoryCache.set(key, list);
          KV.set(`chat:${uid}:${key}`, list);
        } else list = chatHistoryCache.get(key) || (await KV.get(`chat:${uid}:${key}`));
        if (Array.isArray(list)) { await idle(); await prefetchChatMedia(list, 12); }
      }
      KV.mediaPrune(MEDIA_KEEP);
      try { localStorage.setItem(stampKey, String(Date.now())); } catch {}
    } catch (err) { console.warn('[chat prefetch]', err); }
    finally { chatsPrefetching = false; }
  }

  /* «Удалить у меня»: сообщение остаётся у остальных, а у меня скрыто. Список скрытых хранится
     на устройстве и, если выполнен supabase_chat_actions.sql, на сервере — тогда он общий для всех моих устройств */
  const hiddenMsgs = { dm: new Set(), group: new Set(), match: new Set() };
  const hiddenStoreKey = () => 'chat.hidden.v1:' + (currentUser ? currentUser.id : 'guest');
  function isHiddenMsg(kind, id) { return !!hiddenMsgs[kind] && hiddenMsgs[kind].has(String(id)); }
  function saveHiddenLocal() {
    try {
      localStorage.setItem(hiddenStoreKey(), JSON.stringify({ dm: [...hiddenMsgs.dm], group: [...hiddenMsgs.group], match: [...hiddenMsgs.match] }));
    } catch {}
  }
  async function loadHiddenMessages() {
    if (!currentUser) return;
    try {
      const saved = JSON.parse(localStorage.getItem(hiddenStoreKey()) || '{}');
      for (const kind of Object.keys(hiddenMsgs)) (saved[kind] || []).forEach((id) => hiddenMsgs[kind].add(String(id)));
    } catch {}
    const { data, error } = await supabaseClient.from('chat_hidden_messages').select('chat_kind, msg_id').eq('user_id', currentUser.id);
    if (error) { console.warn('[chat hidden] load:', error.message); return; }
    for (const r of (data || [])) if (hiddenMsgs[r.chat_kind]) hiddenMsgs[r.chat_kind].add(String(r.msg_id));
    saveHiddenLocal();
  }
  async function hideChatMessagesForMe(c, list) {
    const ids = list.map((m) => String(m.id));
    ids.forEach((id) => hiddenMsgs[c.type].add(id));
    saveHiddenLocal();
    removeChatMessagesLocal(c.type, ids);
    setChatSelecting(false);
    const { error } = await supabaseClient.from('chat_hidden_messages').upsert(
      ids.map((id) => ({ user_id: currentUser.id, chat_kind: c.type, msg_id: id })),
      { onConflict: 'user_id,chat_kind,msg_id', ignoreDuplicates: true });
    // без таблицы на сервере сообщение остаётся скрытым на этом устройстве
    if (error) console.warn('[chat hidden] save:', error.message);
  }

  function chatMsgById(id) { return chat ? chat.messages.find((x) => String(x.id) === String(id)) || null : null; }
  // Ленту подменили свежей с сервера: «отвечаем на» и «правим» переводим на новые копии тех же сообщений
  function relinkChatRefs(c) {
    for (const k of ['replyTo', 'editing']) {
      if (c[k] && !c.messages.includes(c[k])) c[k] = c.messages.find((m) => String(m.id) === String(c[k].id)) || c[k];
    }
  }
  function isMyMsg(m) { return !!m && !!currentUser && String(m.fromId) === String(currentUser.id); }
  const chatSqlHint = (error) => /function|schema cache|could not find|pinned/i.test(error.message || '')
    ? '\n\nВыполните supabase_chat_actions.sql в Supabase.' : '';

  /* Лента перерисовалась (сервер подтвердил отправку, пришла отметка о прочтении, новое сообщение), а голосовое
     или кружок в ней звучит — на место нового плеера ставим тот же, играющий: звук не обрывается, полоска
     «сейчас играет» не пропадает. Своё только что отправленное сообщение после подтверждения получает другой
     номер — тогда находим его по файлу */
  function keepPlayingMedia(body, el, key) {
    const sel = el.tagName === 'AUDIO' ? '.chat-voice audio' : 'video.chat-circle';
    const all = [...body.querySelectorAll(sel)];
    const fresh = (key.id && all.find((x) => (x.closest('.chat-msg[data-msg-id]') || { dataset: {} }).dataset.msgId === key.id))
      || (key.path && all.find((x) => x.dataset.mediaPath === key.path))
      || (key.src && all.find((x) => x.getAttribute('src') === key.src));
    if (!fresh) { nowPlaying = null; el.pause(); syncChatPlayer(); return; }
    if (!el.dataset.mediaPath && fresh.dataset.mediaPath) el.dataset.mediaPath = fresh.dataset.mediaPath;
    fresh.replaceWith(el);   // в том же шаге — браузер не ставит его на паузу
    if (el.tagName === 'AUDIO') paintVoice(el.closest('.chat-voice'));
    else if (key.loud) el.closest('.chat-circle-wrap').classList.add('is-playing');
    syncChatPlayer();
    if (el.tagName === 'VIDEO') paintCircleRing();
  }
  /* ── Длинная лента — по частям ──
     Лента в 300 сообщений целиком — это заметная пауза на телефоне при каждом открытии чата (разметка, раскладка
     всех пузырей). Поэтому сначала рисуются последние CHAT_FIRST_ROWS сообщений — их и видно, — а более старые
     дорисовываются сверху порциями по CHAT_ROWS_CHUNK в свободные моменты; лента при этом стоит на месте */
  /* Порции крупные: раскладка ленты-колонки стоит почти одинаково при любой порции (браузер перекладывает её
     целиком), поэтому 3 порции по 100 вместо 14 по 20 — и чат перестал подвисать, пока дорисовывается */
  const CHAT_FIRST_ROWS = 30, CHAT_ROWS_CHUNK = 100;
  let olderRowsJob = 0, olderRowsChat = null;   // чат, у которого лента ещё дорисовывается сверху
  function chatRowsHtml(list) { return list.length ? list.map(chatBubbleHtml).join('') : chatEmptyHtml(); }
  function chatSplitIndex(list) { return list.length > CHAT_FIRST_ROWS + CHAT_ROWS_CHUNK ? list.length - CHAT_FIRST_ROWS : 0; }
  /* Дорисовать сверху до count сообщений, что идут перед первым показанным; лента остаётся там, где её смотрят.
     Место считается от первого сообщения на экране, а не от номера в списке: пока лента дорисовывается, в список
     успевают прийти новые сообщения. Возвращает, сколько ещё осталось выше (0 — лента дорисована) */
  function prependChatRows(c, count) {
    const body = winBody.querySelector('#chat-view-body');
    if (!body || chat !== c) return 0;
    const first = body.querySelector('.chat-msg[data-msg-id]');
    const end = first ? c.messages.findIndex((m) => String(m.id) === first.dataset.msgId) : -1;
    if (end <= 0) return 0;
    const start = Math.max(0, end - count);
    const stick = chatFollowing(c), fromBottom = body.scrollHeight - body.scrollTop;
    body.insertAdjacentHTML('afterbegin', c.messages.slice(start, end).map(chatBubbleHtml).join(''));
    const added = [...body.children].slice(0, end - start);
    /* Лента раскладывается один раз на порцию: плашки и серии (запись) → замер пузырей (раскладка) → прокрутка
       по готовой раскладке → новые ширины. Раньше — 3–4 раза (плашки сами прокручивали ленту, потом замер, потом
       прокрутка, потом наблюдатель ленты), и чат на 300 сообщений подвисал на сотни миллисекунд */
    syncChatDates(body, false);
    syncChatRuns(body, false);
    if (stick) scrollChatToBottom();
    else { body.scrollTop = body.scrollHeight - fromBottom; body.autoTop = body.scrollTop; body.autoHeight = body.scrollHeight; }
    // ширину пузырей — когда сообщения подъедут к экрану: сейчас они выше него, а замер всех сразу был самой
    // долгой частью дорисовки (высоту подгонка не меняет — лента не сдвинется)
    fitBubblesWhenNear(added, body);
    if (body.__chatMo) { body.__chatMo.takeRecords(); body.__chatSync(); }   // работа наблюдателя ленты уже сделана
    hydrateChatMedia(body);
    return start;
  }
  // Подогнать ширину пузырей, когда они окажутся ближе чем в 700px от видимой части ленты
  let bubbleFitIO = null;
  function fitBubblesWhenNear(els, body) {
    if (!window.IntersectionObserver) { fitChatBubbles(els); return; }
    if (!bubbleFitIO || bubbleFitIO.root !== body) {
      if (bubbleFitIO) bubbleFitIO.disconnect();
      bubbleFitIO = new IntersectionObserver((entries) => {
        const near = [];
        for (const e of entries) if (e.isIntersecting) { near.push(e.target); bubbleFitIO.unobserve(e.target); }
        if (near.length && near[0].isConnected) fitChatBubbles(near);
      }, { root: body, rootMargin: '700px 0px' });
    }
    for (const el of els) if (el.classList.contains('chat-msg')) bubbleFitIO.observe(el);
  }
  function paintOlderRows(c) {
    const job = ++olderRowsJob;
    olderRowsChat = c;
    const later = (fn) => (window.requestIdleCallback ? requestIdleCallback(fn, { timeout: 250 }) : setTimeout(fn, 50));
    const step = () => {
      if (job !== olderRowsJob) return;
      // ленту листают, а до верха ещё далеко — не перебиваем прокрутку (на iPhone сдвиг ленты гасит инерцию)
      const body = winBody.querySelector('#chat-view-body');
      if (body && chatUserScrolling() && body.scrollTop > body.clientHeight) { setTimeout(() => later(step), 200); return; }
      if (prependChatRows(c, CHAT_ROWS_CHUNK) > 0) later(step); else if (job === olderRowsJob) olderRowsChat = null;
    };
    // первая порция — после первого кадра: открытый чат уже на экране
    requestAnimationFrame(() => later(step));
  }
  // Дорисовать всё, что осталось, прямо сейчас (переход к старому сообщению)
  function flushOlderRows() {
    const c = olderRowsChat;
    olderRowsJob++; olderRowsChat = null;
    if (c && chat === c) prependChatRows(c, Infinity);
  }

  function rerenderChatBody() {
    const body = winBody.querySelector('#chat-view-body');
    if (!body || !chat) return;
    const stick = chatFollowing(chat);
    const playing = nowPlaying && body.contains(nowPlaying) ? nowPlaying : null;
    const playingKey = playing && { id: (playing.closest('.chat-msg[data-msg-id]') || { dataset: {} }).dataset.msgId,
      path: playing.dataset.mediaPath || '', src: playing.getAttribute('src') || '', loud: !!playing.closest('.chat-circle-wrap.is-playing') };
    // по частям — только когда ничего не звучит и лента у конца: иначе звучащее или читаемое сообщение может быть в старой части
    olderRowsJob++; olderRowsChat = null;
    const split = !playing && stick ? chatSplitIndex(chat.messages) : 0;
    body.innerHTML = chatRowsHtml(chat.messages.slice(split));
    if (split) paintOlderRows(chat);
    if (playing) keepPlayingMedia(body, playing, playingKey);
    // одна раскладка: замер → прокрутка по готовой раскладке → ширины (см. prependChatRows)
    syncChatDates(body, false);
    syncChatRuns(body, false);
    const applyWidths = measureChatBubbles(body.children);
    if (stick) scrollChatToBottom();
    applyWidths();
    if (body.__chatMo) { body.__chatMo.takeRecords(); body.__chatSync(); }
    hydrateChatMedia(body);
    syncChatPinBar();
    syncChatSelectionUi();
    requestAnimationFrame(syncChatDown);   // кнопке «вниз» нужна раскладка — берём ту, что браузер всё равно сделает для кадра
  }

  // События realtime по сообщениям: новое, изменённое (закрепили / открепили) и удалённое
  function handleChatRealtime(payload, kind, norm) {
    if (!currentUser) return;
    if (payload.eventType === 'DELETE') {
      const id = payload.old && payload.old.id;
      if (id != null) {
        removeChatMessagesLocal(kind, [id]);
        // удалённое было последним в чате — забываем его: сводка возьмёт новое последнее с сервера
        for (const [key, m] of chatLast) if (key.startsWith(kind + ':') && String(m.id) === String(id)) chatLast.delete(key);
      }
      refreshChatSummariesSoon();   // удалённое могло быть последним или непрочитанным
      return;
    }
    const r = payload.new;
    if (!r) return;
    if (kind === 'dm' && r.from_id !== currentUser.id && r.to_id !== currentUser.id) return;
    const m = norm(r);
    if (payload.eventType !== 'UPDATE') { onIncomingChatRow(m); return; }
    // сообщение отредактировали — если оно последнее в чате, меняется и строка в списке чатов
    const lastKey = msgChatKey(m), last = chatLast.get(lastKey);
    if (last && String(last.id) === String(m.id) && last.content !== m.content) { chatLast.set(lastKey, m); paintChatsList(); }
    const c = chat;
    if (!c || c.type !== kind) return;
    const idx = c.messages.findIndex((x) => String(x.id) === String(m.id));
    if (idx === -1) return;
    const old = c.messages[idx];
    const sameText = old.pinned === m.pinned && old.content === m.content && (old.editedAt || null) === m.editedAt;
    const sameReacts = reactKey(old) === reactKey(m);
    if (sameText && sameReacts) return;
    // «отвечаем на» и «правим» указывают на сообщение — переводим их на его новую копию
    const merged = { ...m, localUrl: old.localUrl };
    if (c.editing === old) c.editing = merged;
    if (c.replyTo === old) c.replyTo = merged;
    c.messages[idx] = merged;
    if (sameText) {
      // поменялись только реакции — перерисовываем одни плашки, кружок и фото не пересоздаются
      const added = Object.entries(m.reactions || {}).find(([uid, e]) => !old.reactions || old.reactions[uid] !== e);
      paintChatReacts(merged, added ? added[1] : '');
      saveChatCache(c);
      return;
    }
    c.pinIdx = null;
    replaceChatBubble(m.id, merged);
    syncChatPinBar();
    saveChatCache(c);
    // собеседник исправил сообщение, а чат открыт — правку видно, автору уходит «Прочитано»
    if (!isMyMsg(merged) && merged.editedAt) markChatRead(c);
  }

  function removeChatMessagesLocal(kind, ids) {
    const c = chat;
    if (!c || c.type !== kind) return;
    const gone = new Set(ids.map(String));
    if (!c.messages.some((m) => gone.has(String(m.id)))) return;
    c.messages = c.messages.filter((m) => !gone.has(String(m.id)));
    gone.forEach((id) => { const el = chatBubbleEl(id); if (el) el.remove(); c.selected.delete(id); });
    if (!c.selected.size) c.selecting = false;
    c.pinIdx = null;
    const body = winBody.querySelector('#chat-view-body');
    if (body && !c.messages.length) body.innerHTML = `<div class="empty-msg">Начните диалог.</div>`;
    syncChatPinBar();
    syncChatSelectionUi();
    if (c.editing || c.replyTo) syncChatReplyBar();   // удалили то, что правили или на что отвечали
    saveChatCache(c);
  }

  /* Закреплённое — полоса над лентой. Если закреплено несколько, нажатие листает их от нового к старому */
  function pinnedMessages() { return chat ? chat.messages.filter((m) => m.pinned && !m.pending) : []; }
  function syncChatPinBar() {
    const el = winBody.querySelector('#chat-pin');
    if (!el || !chat) return;
    const pins = pinnedMessages();
    if (!pins.length) { el.hidden = true; el.innerHTML = ''; return; }
    chat.pinIdx = Math.min(chat.pinIdx == null ? pins.length - 1 : chat.pinIdx, pins.length - 1);
    const m = pins[chat.pinIdx];
    el.hidden = false;
    el.innerHTML = `
      <div class="chat-pin-main">
        <span class="chat-pin-cap">Закреплено${pins.length > 1 ? ` · ${chat.pinIdx + 1} из ${pins.length}` : ''}</span>
        <span class="chat-pin-text">${escapeHtml(chatPreviewText(m) || 'Сообщение')}</span>
      </div>
      <button type="button" class="chat-pin-x" data-pin-off="${escapeHtml(m.id)}" aria-label="Открепить" title="Открепить">×</button>`;
  }
  function jumpToPinned() {
    const pins = pinnedMessages();
    if (!pins.length) return;
    const idx = Math.min(chat.pinIdx == null ? pins.length - 1 : chat.pinIdx, pins.length - 1);
    if (!chatBubbleEl(pins[idx].id)) flushOlderRows();
    const el = chatBubbleEl(pins[idx].id);
    if (el) {
      chatFollowUntil = 0;   // переход к закреплённому — лента больше не держится у конца
      el.parentElement.autoTop = null;
      el.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
      el.classList.remove('is-flash'); void el.offsetWidth; el.classList.add('is-flash');
    }
    chat.pinIdx = (idx - 1 + pins.length) % pins.length;
    syncChatPinBar();
  }
  async function setChatMessagePinned(id, pin) {
    const c = chat, m = chatMsgById(id);
    if (!c || !m || m.pending) return;
    const apply = (value) => {
      m.pinned = value; c.pinIdx = null;
      if (chat !== c) return;
      replaceChatBubble(m.id, m); syncChatPinBar(); syncChatSelectionUi(); saveChatCache(c);
    };
    apply(pin);   // сразу на экране, сервер — в фоне
    const { error } = await supabaseClient.rpc('set_chat_message_pinned', { chat_kind: c.type, msg_id: String(m.id), pin });
    if (error) {
      console.warn('[chat pin]', error.message);
      apply(!pin);
      alert('Не удалось ' + (pin ? 'закрепить' : 'открепить') + ' сообщение: ' + error.message + chatSqlHint(error));
    }
  }

  /* Выбор нескольких сообщений: вместо поля ввода — панель «Переслать / Удалить» */
  function setChatSelecting(on) {
    if (!chat) return;
    chat.selecting = on;
    if (!on) chat.selected.clear();
    syncChatSelectionUi();
  }
  function toggleChatSelected(id) {
    if (!chat) return;
    const key = String(id);
    if (chat.selected.has(key)) chat.selected.delete(key); else chat.selected.add(key);
    chat.selecting = chat.selected.size > 0;
    syncChatSelectionUi();
  }
  function syncChatSelectionUi() {
    const view = winBody.querySelector('.chat-view');
    if (!view || !chat) return;
    view.classList.toggle('is-selecting', chat.selecting);
    view.querySelectorAll('#chat-view-body .chat-msg[data-msg-id]').forEach((el) => el.classList.toggle('is-selected', chat.selected.has(el.dataset.msgId)));
    const bar = view.querySelector('#chat-selbar'), composer = view.querySelector('#chat-composer');
    if (bar) bar.hidden = !chat.selecting;
    if (composer && !chatRec && !chatRecPending) composer.hidden = chat.selecting;
    const count = view.querySelector('#chat-sel-count');
    if (count) count.textContent = `Выбрано: ${chat.selected.size}`;
    const del = view.querySelector('[data-sel-delete]');
    if (del) del.disabled = !chat.selected.size;
  }

  /* Меню сообщения — по долгому нажатию или правой кнопке мыши. Сверху ряд реакций (стрелка раскрывает все),
     под ним главное: «Ответить», «Редактировать», «Переслать», «Удалить»; остальное — в «Ещё» */
  const ICON_CHEV_DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9.5 6 6 6-6"/></svg>';
  function openMsgMenu(id, x, y) {
    const m = chatMsgById(id);
    if (!m || m.pending) return;
    closePostMenus();
    const pop = document.createElement('div');
    pop.className = 'popover msg-menu msg-ctx';
    const mid = escapeHtml(m.id);
    const item = (act, label, danger = false) =>
      `<button class="pop-item ${danger ? 'danger' : ''}" type="button" data-msg-act="${act}" data-msg-id="${mid}">${label}</button>`;
    const mine = myReaction(m);
    const emo = (e) => `<button type="button" class="msg-react-opt ${e === mine ? 'is-on' : ''}" data-msg-act="react" data-emoji="${escapeHtml(e)}" data-msg-id="${mid}" aria-label="Реакция ${escapeHtml(e)}">${escapeHtml(e)}</button>`;
    // своё сообщение в групповом чате: кто его прочитал — «Sasha + 3», по нажатию весь список
    const readers = isMyMsg(m) && chat.type !== 'dm' && chatReadsReady && !chatReadsMissing ? item('readers', readersLabel(chatReaders(m))) : '';
    const main = item('reply', 'Ответить')
      + (canEditMsg(m) ? item('edit', 'Редактировать') : '')
      + item('forward', 'Переслать')
      + '<button class="pop-item" type="button" data-msg-page="more">Ещё<span class="pop-chev" aria-hidden="true">›</span></button>'
      + item('delete', 'Удалить', true);
    const more = '<button class="pop-item pop-back" type="button" data-msg-page="main"><span class="pop-chev" aria-hidden="true">‹</span>Назад</button>'
      + readers
      + item('pin', m.pinned ? 'Открепить' : 'Закрепить')
      + ((m.content || '').trim() ? item('copy', 'Копировать текст') : '')
      + item('select', 'Выбрать');
    pop.innerHTML = `
      <div class="msg-reacts" role="group" aria-label="Реакции">
        <div class="msg-reacts-row">${REACTS_TOP.map(emo).join('')}<button type="button" class="msg-react-more" data-react-expand aria-expanded="false" aria-label="Все реакции" title="Все реакции">${ICON_CHEV_DOWN}</button></div>
        <div class="msg-reacts-all" hidden>${[...REACTS_TOP, ...REACTS_MORE].map(emo).join('')}</div>
      </div>
      <div class="msg-menu-list" data-page="main">${main}</div>
      <div class="msg-menu-list" data-page="more" hidden>${more}</div>`;
    winBody.appendChild(pop);
    // меню не вылезает за края окна; когда его содержимое меняется (раскрыли реакции, «Ещё»), место пересчитывается
    const place = () => {
      const r = winBody.getBoundingClientRect();
      const left = Math.max(8, Math.min(x - r.left, r.width - pop.offsetWidth - 8));
      const top = Math.max(8, Math.min(y - r.top, r.height - pop.offsetHeight - 8));
      pop.style.left = left + 'px';
      pop.style.top = (top + winBody.scrollTop) + 'px';
    };
    place();
    pop.addEventListener('click', (ev) => {
      const page = ev.target.closest('[data-msg-page]');
      const expand = ev.target.closest('[data-react-expand]');
      if (!page && !expand) return;   // реакции и пункты меню обрабатывает общий обработчик [data-msg-act]
      ev.stopPropagation();
      if (page) pop.querySelectorAll('.msg-menu-list').forEach((el) => { el.hidden = el.dataset.page !== page.dataset.msgPage; });
      if (expand) {
        const open = expand.getAttribute('aria-expanded') !== 'true';
        expand.setAttribute('aria-expanded', String(open));
        pop.querySelector('.msg-reacts-all').hidden = !open;
        pop.querySelectorAll('.msg-reacts-row .msg-react-opt').forEach((el) => { el.hidden = open; });
      }
      place();
    });
    const onDocDown = (ev) => {
      if (pop.contains(ev.target)) return;
      pop.remove();
      document.removeEventListener('pointerdown', onDocDown, true);
    };
    setTimeout(() => document.addEventListener('pointerdown', onDocDown, true), 0);
  }

  // Окно удаления: «У меня» — скрыть только у себя, «У всех» — удалить из чата (только свои сообщения)
  function deleteChoiceModal({ count, canAll }) {
    return new Promise((resolve) => {
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      back.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
