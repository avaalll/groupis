          <h3 class="modal-title">${count > 1 ? `Удалить сообщения (${count})?` : 'Удалить сообщение?'}</h3>
          <p class="modal-text">${canAll
            ? '«У меня» — сообщение исчезнет только у вас, у остальных останется. «У всех» — исчезнет у всех участников чата, вернуть его нельзя.'
            : 'Сообщение исчезнет только у вас, у остальных участников оно останется. Удалить у всех можно только свои сообщения.'}</p>
          <div class="modal-actions del-actions">
            <button type="button" class="btn" data-pick="">Отмена</button>
            <button type="button" class="btn ${canAll ? '' : 'btn-danger'}" data-pick="me">У меня</button>
            ${canAll ? '<button type="button" class="btn btn-danger" data-pick="all">У всех</button>' : ''}
          </div>
        </div>`;
      modalHost().appendChild(back);
      back.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-pick]');
        if (!btn && e.target !== back) return;
        back.remove();
        resolve(btn ? btn.dataset.pick || null : null);
      });
    });
  }

  async function deleteChatMessages(ids) {
    const c = chat;
    if (!c) return;
    const list = ids.map(chatMsgById).filter((m) => m && !m.pending);
    if (!list.length) return;
    const pick = await deleteChoiceModal({ count: list.length, canAll: list.every(isMyMsg) });
    if (!pick || chat !== c) return;
    if (pick === 'me') { await hideChatMessagesForMe(c, list); return; }
    const gone = list.map((m) => String(m.id));
    removeChatMessagesLocal(c.type, gone);   // сразу с экрана, сервер — в фоне
    setChatSelecting(false);
    const { error } = await supabaseClient.rpc('delete_chat_messages', { chat_kind: c.type, ids: gone });
    if (error) {
      console.warn('[chat delete]', error.message);
      alert('Не удалось удалить: ' + error.message + chatSqlHint(error));
      const fresh = await loadChatHistory(c);
      if (fresh && chat === c) { c.messages = fresh; rerenderChatBody(); saveChatCache(c); }
      return;
    }
    const paths = list.map((m) => m.mediaPath).filter(Boolean);
    if (paths.length) supabaseClient.storage.from(CHAT_BUCKET).remove(paths).then(() => {}, () => {});
  }

  /* Пересылка: копия сообщения в другой чат. Файл копируется в папку того чата — у его участников
     есть доступ только к ней. С копией уходит автор оригинала («Переслано от …»); у сообщения, которое
     пересылают дальше, автор остаётся прежним — тот, кто написал его первым */
  function forwardSnapshot(m) {
    const from = m.forward || { uid: String(m.fromId), name: isMyMsg(m) ? profile.name || profile.handle || '' : msgAuthorName(m) };
    return { fwd: true, id: String(m.id), uid: from.uid, name: cutChars(from.name, 80), text: '' };
  }
  function forwardTargets() {
    const out = [];
    for (const g of myGroups()) {
      const ava = g.photo
        ? `<span class="avatar group-chat-avatar" style="width:36px;height:36px;background-image:url('${safeUrl(g.photo)}')"></span>`
        : `<span class="avatar group-chat-avatar" style="width:36px;height:36px;background:linear-gradient(145deg, var(--c1), var(--c2))">${escapeHtml(firstChar(g.name || '?').toUpperCase())}</span>`;
      out.push({ spec: { type: 'group', groupId: g.id }, name: g.name || 'Группа', sub: 'Чат группы', ava });
    }
    for (const m of myAcceptedMatches()) {
      out.push({ spec: { type: 'match', matchId: String(m.id) }, name: matchTitle(m), sub: 'Совместный чат',
        ava: featAvatarHtml(m, 36) });
    }
    for (const f of friends) {
      out.push({ spec: { type: 'dm', peerId: f.id }, name: f.name || f.handle || 'Пользователь', sub: f.handle || '', ava: avatarCircleHtml(f, 36) });
    }
    // и те, с кем есть переписка, хотя они уже не в друзьях
    const friendIds = new Set(friends.map((f) => String(f.id)));
    for (const id of dmChatPeers()) {
      if (friendIds.has(String(id))) continue;
      const p = dmPeer(id);
      out.push({ spec: { type: 'dm', peerId: id }, name: p.name, sub: p.handle || '', ava: avatarCircleHtml(p, 36) });
    }
    return out;
  }
  async function forwardMessage(m, target) {
    let mediaPath = null;
    if (m.mediaPath) {
      mediaPath = `${chatMediaFolder(target)}/${currentUser.id}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${fileExt(m.mediaPath) || 'bin'}`;
      const { error } = await supabaseClient.storage.from(CHAT_BUCKET).copy(m.mediaPath, mediaPath);
      if (error) throw error;
      if (mediaBlobUrls.has(m.mediaPath)) mediaBlobUrls.set(mediaPath, mediaBlobUrls.get(m.mediaPath));
    }
    const { data, error } = await insertChatRow(target, {
      kind: m.kind || 'text', content: m.content || '', mediaPath,
      duration: m.duration, fileName: m.fileName, fileSize: m.fileSize, reply: forwardSnapshot(m),
    });
    if (error) throw error;
    const list = data && chatHistoryCache.get(chatKey(target));
    if (list && !list.some((x) => String(x.id) === String(data.id))) list.push(data);
  }
  function openForwardPicker(ids) {
    const c = chat;
    if (!c) return;
    const wanted = new Set(ids.map(String));
    const msgs = c.messages.filter((m) => wanted.has(String(m.id)) && !m.pending);
    if (!msgs.length) return;
    const targets = forwardTargets().filter((t) => chatKey(t.spec) !== chatKey(c));
    if (!targets.length) { alert('Пересылать пока некуда: нет других чатов.'); return; }
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <h3 class="modal-title">${msgs.length > 1 ? `Переслать сообщения (${msgs.length})` : 'Переслать сообщение'}</h3>
        <ul class="fwd-list">${targets.map((t, i) => `
          <li class="person-card" data-fwd="${i}" role="checkbox" aria-checked="false" tabindex="0">
            <span class="person-check"></span>
            ${t.ava}
            <div class="person-main">
              <div class="person-name">${escapeHtml(t.name)}</div>
              <div class="person-handle">${escapeHtml(t.sub)}</div>
            </div>
          </li>`).join('')}</ul>
        <div class="modal-actions">
          <button type="button" class="btn" data-cancel>Отмена</button>
          <button type="button" class="btn btn-primary" data-send disabled>Отправить</button>
        </div>
      </div>`;
    modalHost().appendChild(back);
    const sendBtn = back.querySelector('[data-send]');
    const chosen = () => [...back.querySelectorAll('[data-fwd][aria-checked="true"]')].map((el) => targets[Number(el.dataset.fwd)]);
    back.addEventListener('click', async (e) => {
      if (e.target === back || e.target.closest('[data-cancel]')) { if (!sendBtn.dataset.busy) back.remove(); return; }
      const row = e.target.closest('[data-fwd]');
      if (row && !sendBtn.dataset.busy) {
        row.setAttribute('aria-checked', String(row.getAttribute('aria-checked') !== 'true'));
        sendBtn.disabled = !chosen().length;
        return;
      }
      if (!e.target.closest('[data-send]') || sendBtn.dataset.busy) return;
      const list = chosen();
      if (!list.length) return;
      sendBtn.dataset.busy = '1'; sendBtn.disabled = true; sendBtn.textContent = 'Отправляем…';
      let failed = 0, lastError = null;
      for (const t of list) {
        for (const m of msgs) {
          try { await forwardMessage(m, t.spec); }
          catch (err) { failed++; lastError = err; console.warn('[chat forward]', err); }
        }
      }
      back.remove();
      if (chat === c) setChatSelecting(false);
      if (failed) alert(`Не удалось переслать (${failed}): ` + ((lastError && lastError.message) || lastError));
    });
  }

  /* ── Открытие / закрытие чата ── */
  /* ── «Печатает», «записывает голосовое сообщение», «отправляет файл» ──
     Сигнал уходит по закрытому каналу Supabase Realtime только участникам этого чата и в базу не пишется.
     Кто может слушать канал, решает правило в базе (supabase_chat_typing.sql): без него канал не откроется,
     подписи просто не будет — переписка работает как прежде. У собеседника подпись живёт 6 с, пока мы
     её подтверждаем каждые 3 с; закрыли приложение — она исчезнет сама. */
  const TYPING_ONE = { text: 'печатает', voice: 'записывает голосовое сообщение', circle: 'записывает голосовое сообщение', file: 'отправляет файл' };
  const TYPING_MANY = { text: 'печатают', voice: 'записывают голосовые сообщения', circle: 'записывают голосовые сообщения', file: 'отправляют файлы' };
  const TYPING_TTL = 6000, TYPING_EVERY = 3000;
  let typingWarned = false;

  function typingTopic(c) {
    if (c.type === 'dm') return 'typing:dm:' + [String(currentUser.id), String(c.peerId)].sort().join(':');
    return c.type === 'match' ? 'typing:match:' + c.matchId : 'typing:group:' + c.groupId;
  }
  /* Канал прошлого захода в тот же чат может ещё закрываться (вышли в профиль собеседника и сразу вернулись):
     библиотека отдала бы его вместо нового, и подпись «печатает» перестала бы работать. Новый открываем,
     когда старый закрылся */
  const typingClosing = new Map();   // тема канала → промис его закрытия
  function joinTyping(c) {
    if (!currentUser) return;
    c.typing = new Map();                 // id участника → { kind, until }
    c.typingSent = { kind: '', at: 0 };
    const topic = typingTopic(c);
    const open = () => {
      if (chat !== c || c.typingChannel || !currentUser) return;
      const ch = supabaseClient.channel(topic, { config: { private: true, broadcast: { self: false } } });
      ch.on('broadcast', { event: 'typing' }, ({ payload }) => onTypingSignal(c, payload));
      ch.subscribe((status) => {
        c.typingOk = status === 'SUBSCRIBED' && c.typingChannel === ch;
        if (c.typingOk) sendTyping(c, typingNowKind(c));   // уже начали печатать, пока канал открывался
        if ((status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') && !typingWarned) {
          typingWarned = true;
          console.warn('[typing] канал не открылся — выполните supabase_chat_typing.sql в Supabase');
        }
      });
      c.typingChannel = ch;
    };
    const closing = typingClosing.get(topic);
    if (closing) closing.then(open, open); else open();
  }
  function leaveTyping(c) {
    if (!c || !c.typingChannel) return;
    const ch = c.typingChannel, wasActive = c.typingOk && c.typingSent.kind;
    const topic = String(ch.topic || '').replace(/^realtime:/, '');
    c.typingChannel = null; c.typingOk = false;
    clearInterval(c.typingTimer); c.typingTimer = 0;
    clearInterval(c.uploadTimer); c.uploadTimer = 0;
    const done = (async () => {
      // собеседник сразу перестаёт видеть подпись, а не через 6 секунд
      if (wasActive && currentUser) { try { await ch.send({ type: 'broadcast', event: 'typing', payload: { uid: String(currentUser.id), kind: '' } }); } catch {} }
      try { await supabaseClient.removeChannel(ch); } catch {}
      // сервер не ответил на выход — убираем канал сами, иначе он так и останется в списке библиотеки
      if (supabaseClient.getChannels().includes(ch)) { try { ch.teardown(); } catch {} }
    })();
    typingClosing.set(topic, done);
    done.finally(() => { if (typingClosing.get(topic) === done) typingClosing.delete(topic); });
  }
  // Чем я сейчас занят в этом чате: запись важнее отправки файла, отправка — важнее набора текста
  function typingNowKind(c) {
    if (chatRec && chatRec.chat === c) return chatRec.kind;
    if (c.uploads) return 'file';
    const input = chat === c && !c.editing && winBody.querySelector('#chat-text');   // правка старого — не «печатает»
    return input && input.value.trim() ? 'text' : '';
  }
  // kind: text | voice | circle | file, '' — перестал. Одно и то же — не чаще раза в 3 с
  function sendTyping(c, kind) {
    if (!c || !c.typingOk || !c.typingChannel || !currentUser) return;
    const now = Date.now(), last = c.typingSent;
    if (kind === last.kind && (!kind || now - last.at < TYPING_EVERY)) return;
    c.typingSent = { kind, at: now };
    c.typingChannel.send({ type: 'broadcast', event: 'typing', payload: { uid: String(currentUser.id), kind } }).catch(() => {});
  }
  function typingUpload(c, delta) {
    c.uploads = Math.max(0, (c.uploads || 0) + delta);
    clearInterval(c.uploadTimer); c.uploadTimer = 0;
    if (c.uploads) c.uploadTimer = setInterval(() => sendTyping(c, typingNowKind(c)), 1000);
    sendTyping(c, typingNowKind(c));
  }
  function onTypingSignal(c, p) {
    if (!p || chat !== c || !currentUser || String(p.uid) === String(currentUser.id)) return;
    if (TYPING_ONE[p.kind]) c.typing.set(String(p.uid), { kind: p.kind, until: Date.now() + TYPING_TTL });
    else c.typing.delete(String(p.uid));
    paintTyping(c);
  }
  // Подпись под именем в шапке чата вместо «в сети»: в личном — «печатает», в групповом — с именем
  function paintTyping(c) {
    if (!c || !c.typing) return;
    const now = Date.now();
    for (const [uid, t] of c.typing) if (t.until <= now) c.typing.delete(uid);
    const list = [...c.typing];
    if (list.length && !c.typingTimer) c.typingTimer = setInterval(() => paintTyping(c), 1000);
    if (!list.length && c.typingTimer) { clearInterval(c.typingTimer); c.typingTimer = 0; }
    const sub = chat === c && document.getElementById('win-sub');
    if (!sub) return;
    if (!list.length) {
      if (sub.classList.contains('is-typing')) { sub.classList.remove('is-typing'); delete sub.dataset.typing; paintChatSub(c); }
      return;
    }
    const firstName = (uid) => (chatPersonById(uid).name || 'Участник').trim().split(/\s+/)[0];
    const [[uid0, t0]] = list;
    const text = c.type === 'dm' ? TYPING_ONE[t0.kind]
      : list.length === 1 ? `${firstName(uid0)} ${TYPING_ONE[t0.kind]}`
      : list.length === 2 ? `${firstName(uid0)} и ${firstName(list[1][0])} ${TYPING_MANY[t0.kind]}`
      : `${firstName(uid0)} и ещё ${list.length - 1} ${TYPING_MANY[t0.kind]}`;
    if (sub.dataset.typing === text && sub.classList.contains('is-typing')) return;
    sub.dataset.typing = text;
    sub.className = 'win-title-sub is-typing';
    sub.textContent = text;
    sub.insertAdjacentHTML('beforeend', '<span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>');
  }

  /* ── Шапка открытого чата: имя собеседника или группы, под ним статус, справа — аватар ──
     Нажатие на имя или аватар открывает профиль собеседника, карточку группы или карточку союза (совместный чат):
     участники, что прислали в чат (медиа, ссылки, файлы); «назад» вернёт в чат. */
  const winPeer = document.getElementById('win-peer');
  function chatHeaderAvatarHtml(c) {
    if (c.type === 'dm') {
      const p = chatPersonById(c.peerId);
      return avatarCircleHtml({ name: c.winTitle || p.name, avatar: p.avatar }, 40);
    }
    if (c.type === 'match') {
      const m = groupMatches.find((x) => x.id === String(c.matchId));
      return featAvatarHtml(m);
    }
    const g = groupById(c.groupId);
    if (g && g.photo) return `<span class="avatar group-chat-avatar" style="background-image:url('${safeUrl(g.photo)}')"></span>`;
    return `<span class="avatar group-chat-avatar" style="background:linear-gradient(145deg, var(--c1), var(--c2))">${escapeHtml(firstChar((g && g.name) || '?').toUpperCase())}</span>`;
  }
  function paintChatHeader(c) {
    if (chat !== c) return;
    winTitle.classList.add('has-sub', 'is-link');
    winTitle.innerHTML = `<span class="win-title-name">${escapeHtml(c.winTitle)}</span><span class="win-title-sub" id="win-sub"></span>`;
    winPeer.innerHTML = chatHeaderAvatarHtml(c);
    winPeer.className = 'win-peer' + (c.type === 'dm' ? '' : ' is-group');
    winPeer.setAttribute('aria-label', c.type === 'dm' ? 'Профиль: ' + c.winTitle : c.winTitle);
    winPeer.hidden = false;
    paintChatSub(c);
  }
  function clearChatHeader() {
    winTitle.classList.remove('has-sub', 'is-link');
    winPeer.hidden = true;
    winPeer.innerHTML = '';
  }
  // Статус под именем: «в сети» / «был(а) …», в группе — «5 участников, 2 в сети». Пока кто-то печатает — его подпись
  function paintChatSub(c) {
    const sub = chat === c && document.getElementById('win-sub');
    if (!sub || (c.typing && c.typing.size)) return;
    let text = '', online = false;
    if (c.type === 'dm') ({ text, online } = presenceStatus(c.peerId));
    else if (c.type === 'group') {
      const g = groupById(c.groupId);
      if (g) {
        const people = groupPeople(g), myId = currentUser && String(currentUser.id);
        const on = 1 + people.filter((p) => String(p.id) !== myId && isOnline(p.id)).length;   // я тоже в сети
        text = membersLabel(people.length) + (on > 1 ? `, ${on} в сети` : '');
      }
    } else {
      const m = groupMatches.find((x) => x.id === String(c.matchId));
      if (m) text = membersLabel(matchParticipantIds(m).length);
    }
    sub.className = 'win-title-sub' + (online ? ' is-online' : '');
    sub.textContent = text;
  }
  function openChatPeer() {
    const c = chat;
    if (!c) return;
    const spec = { type: c.type, peerId: c.peerId, groupId: c.groupId, matchId: c.matchId };
    const back = c.backFn, reopen = () => openChat(spec, back);
    leaveChat();
    winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
    if (spec.type === 'dm') showFriendProfile(spec.peerId, personById(spec.peerId), reopen);
    else if (spec.type === 'match') showUnionDetailsScreen(spec.matchId, reopen, true);
    else showGroupDetailsScreen(spec.groupId, reopen, true);
  }
  // Аватар автора в групповом чате — профиль этого человека; «назад» возвращает в чат
  function openChatMember(uid) {
    const c = chat;
    if (!c || !uid || (currentUser && String(uid) === String(currentUser.id))) return;
    const spec = { type: c.type, peerId: c.peerId, groupId: c.groupId, matchId: c.matchId };
    const back = c.backFn, reopen = () => openChat(spec, back);
    leaveChat();
    winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
    showFriendProfile(uid, personById(uid) || chatPersonById(uid), reopen);
  }
  winPeer.addEventListener('click', openChatPeer);
  winPeer.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openChatPeer(); } });
  document.getElementById('win-title').addEventListener('click', (e) => { if (e.currentTarget.classList.contains('is-link')) openChatPeer(); });

  /* ── «В сети» ──
     Пока приложение открыто и на экране, оно раз в 45 с отмечается на сервере (supabase_presence.sql),
     при сворачивании — отмечает уход. Чужие отметки отдаются только о друзьях и участниках общих групп.
     «В сети» — отметка свежее двух минут: если уход отметить не успели (закрыли вкладку, пропала сеть),
     статус погаснет сам. Без таблицы на сервере строка статуса просто не показывается. */
  const presence = new Map();   // id → { online, at, gender }
  const PRESENCE_EVERY = 45000, ONLINE_FRESH = 120000;
  let presenceMissing = false, presenceTimer = 0, accessToken = null;
  function presenceError(error) {
    if (/function|schema cache|could not find|does not exist/i.test(error.message || '')) {
      if (!presenceMissing) console.warn('[presence] нет функций — выполните supabase_presence.sql в Supabase');
      presenceMissing = true;
    } else console.warn('[presence]', error.message);
  }
  function isOnline(uid) {
    const p = presence.get(String(uid));
    return !!p && p.online && Date.now() - p.at < ONLINE_FRESH;
  }
  function presenceStatus(uid) {
    const p = presence.get(String(uid));
    if (!p) return { text: '', online: false };
    if (isOnline(uid)) return { text: 'в сети', online: true };
    const was = p.gender === 'female' ? 'была' : p.gender === 'male' ? 'был' : 'был(а)';
    if (!p.at) return { text: 'не в сети', online: false };
    const d = new Date(p.at), now = new Date(), ago = now - d;
    if (ago < 60000) return { text: `${was} только что`, online: false };
    if (ago < 3600000) return { text: `${was} ${Math.floor(ago / 60000)} мин назад`, online: false };
    const yest = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    if (d.toDateString() === now.toDateString()) return { text: `${was} в ${fmtTime(p.at)}`, online: false };
    if (d.toDateString() === yest.toDateString()) return { text: `${was} вчера в ${fmtTime(p.at)}`, online: false };
    const date = fmtRu(d, d.getFullYear() === now.getFullYear() ? DAY_MONTH : DAY_MONTH_YEAR).replace(/\s*г\.$/, '');
    return { text: `${was} ${date}`, online: false };
  }
  async function loadPresence(ids) {
    const myId = currentUser && String(currentUser.id);
    const list = [...new Set(ids.map(String))].filter((id) => id && id !== myId && !isBotId(id)).slice(0, 200);
    if (presenceMissing || !list.length) return;
    try {
      const { data, error } = await supabaseClient.rpc('get_presence', { ids: list });
      if (error) { presenceError(error); return; }
      for (const r of (data || [])) presence.set(String(r.uid), { online: !!r.is_online, at: Date.parse(r.seen_at) || 0, gender: r.gender || '' });
    } catch (err) { console.warn('[presence] load:', err); }
  }
  // Статус собеседника (или участников группы) открытого чата: сразу и затем раз в 30 с
  function watchChatPresence(c) {
    clearInterval(c.presenceTimer);
    const ids = () => c.type === 'dm' ? [c.peerId]
      : c.type === 'group' && groupById(c.groupId) ? groupPeople(groupById(c.groupId)).map((p) => p.id) : [];
    const tick = async () => { await loadPresence(ids()); paintChatSub(c); };
    tick();
    c.presenceTimer = setInterval(() => { if (chat === c && !document.hidden) tick(); }, 30000);
  }
  function sendPresence(online) {
    if (!currentUser || presenceMissing) return;
    if (online) {
      supabaseClient.rpc('set_presence', { p_online: true }).then(({ error }) => { if (error) presenceError(error); }, () => {});
      return;
    }
    // уход: обычный запрос браузер обрывает, когда страница скрывается или закрывается, — keepalive доживает
    if (!accessToken) return;
    try {
      fetch(SUPABASE_URL + '/rest/v1/rpc/set_presence', {
        method: 'POST', keepalive: true,
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_online: false }),
      }).catch(() => {});
    } catch {}
  }
  function startPresence() {
    clearInterval(presenceTimer); presenceTimer = 0;
    if (!currentUser || document.hidden) return;
    sendPresence(true);
    presenceTimer = setInterval(() => sendPresence(true), PRESENCE_EVERY);
  }
  function stopPresence(markOffline) {
    clearInterval(presenceTimer); presenceTimer = 0;
    if (markOffline) sendPresence(false);
  }
  document.addEventListener('visibilitychange', () => {
    if (!currentUser) return;
    if (document.hidden) stopPresence(true); else startPresence();
  });
  addEventListener('pagehide', () => stopPresence(true));

  function leaveChat() {
    nowPlaying = null;
    if (chatRec || chatRecPending) stopChatRecording(true);
    leaveTyping(chat);
    if (chat) clearInterval(chat.presenceTimer);
    if (chat) clearChatHeader();
    chat = null;
    reportActiveChat();
  }

  /* Чат открывается сразу из переписки, сохранённой на устройстве; свежая версия с сервера
     подтягивается следом и подменяет ленту, только если что-то изменилось */
  async function openChat(spec, backFn) {
    if (spec.type === 'match' && isBotId(spec.matchId)) { botNoChat(); return; }   // match с группой-ботом — чата нет
    leaveChat();
    const c = { ...spec, messages: [], selected: new Set(), selecting: false, pinIdx: null, backFn };
    // в шапке окна — имя собеседника, название группы или «Группа × Группа»
    if (c.type === 'dm') {
      // собеседник может быть уже не в друзьях — имя тогда из profiles (peopleCache)
      const peer = friends.find((f) => f.id === c.peerId) || groupMemberProfiles.get(c.peerId), p = dmPeer(c.peerId);
      c.winTitle = peer ? (peer.name || peer.handle || 'Пользователь') : p.unknown ? 'Личный чат' : p.name;
      if (!peer && p.unknown) ensurePeople([c.peerId]).then((got) => {
        if (!got || chat !== c || dmPeer(c.peerId).unknown) return;
        c.winTitle = dmPeer(c.peerId).name;
        paintChatHeader(c);
      });
    } else if (c.type === 'match') {
      const m = groupMatches.find((x) => x.id === String(c.matchId));
      c.winTitle = m ? matchTitle(m) : 'Совместный чат';
    } else {
      const g = groups.find((x) => String(x.id) === String(c.groupId));
      c.winTitle = g ? g.name : 'Групповой чат';
    }
    chat = c;
    reportActiveChat();
    joinTyping(c);
    const show = () => setScreen(() => {
      paintChatHeader(c);
      watchChatPresence(c);
      winBody.scrollTop = 0;
      winBody.style.display = 'flex'; winBody.style.flexDirection = 'column'; winBody.style.padding = '0';
      renderChatView();
    }, () => {
      leaveChat();
      winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
      (backFn || showMessengerScreen)();
    });

    const key = chatKey(c);
    let cached = chatHistoryCache.get(key);
    if (!cached && currentUser) {
      cached = await KV.get(`chat:${currentUser.id}:${key}`);
      if (chat !== c) return; // пока читали кеш, пользователь ушёл
      if (Array.isArray(cached)) chatHistoryCache.set(key, cached); else cached = null;
    }
    if (cached) {
      const cleared = chatClearedAt(key);
      c.messages = cached.filter((m) => !isHiddenMsg(c.type, m.id) && msgTs(m) > cleared);
      await warmChatMedia(c.messages, 40, 120);
      if (chat !== c) return;
    } else c.loading = true;   // переписки на устройстве нет — экран открывается сразу, лента подставится следом
    show();
    markChatRead(c);
    loadChatReads(c);   // кто дочитал чат — для «Прочитано» и списка прочитавших

    const fresh = await loadChatHistory(c);
    if (chat !== c) return; // пока грузили, пользователь ушёл
    if (c.loading) {
      c.loading = false;
      if (fresh) {
        // то, что успели отправить или получить за время загрузки, остаётся в конце ленты
        const ids = new Set(fresh.map((m) => String(m.id)));
        c.messages = [...fresh, ...c.messages.filter((m) => m.pending || !ids.has(String(m.id)))];
        relinkChatRefs(c);
        await warmChatMedia(c.messages, 40, 120);
        if (chat !== c) return;
      }
      rerenderChatBody();
    }
    else if (fresh) mergeFreshHistory(c, fresh);
    if (fresh) saveChatCache(c);
    markChatRead(c);
  }

  /* Свежая переписка с сервера поверх показанной из кеша. Обычно отличие — несколько новых сообщений
     в конце: их дописываем, не трогая остальную ленту (иначе она мигает и заново грузит вложения).
     Перерисовываем целиком, только если что-то удалили или изменили. */
  function mergeFreshHistory(c, fresh) {
    const id = (m) => String(m.id);
    const order = (list) => list.map(id).join(',');
    // шапка сообщения — цитата или «Переслано от …»: у копии, сохранённой прежней версией приложения, она могла быть другой
    const head = (m) => (m.forward ? 'f:' + m.forward.name : m.reply ? 'r:' + m.reply.id : '');
    // что могло измениться у сообщения, пока чат был закрыт: закрепление, правка текста, реакции
    const ver = (m) => [m.pinned ? 1 : 0, m.content, m.editedAt || '', reactKey(m), head(m)].join('\u0001');
    const sending = c.messages.filter((m) => m.pending);
    const old = c.messages.filter((m) => !m.pending);
    const freshIds = new Set(fresh.map(id)), oldById = new Map(old.map((m) => [id(m), m]));
    const added = fresh.filter((m) => !oldById.has(id(m)));
    const gone = old.filter((m) => !freshIds.has(id(m)));
    const same = order(old.filter((m) => freshIds.has(id(m)))) === order(fresh.filter((m) => oldById.has(id(m))));
    const changed = fresh.filter((m) => oldById.has(id(m)) && ver(m) !== ver(oldById.get(id(m))));
    if (same && !added.length && !gone.length && !changed.length) return;
    const body = winBody.querySelector('#chat-view-body');
    const firstFresh = msgTs(fresh[0]), lastOld = msgTs(old[old.length - 1]);
    // «пропавшие» старше загруженного окна — они не удалены, просто не попали в последние CHAT_KEEP
    const tailOnly = same && body && old.length && !sending.length
      && (fresh.length >= CHAT_KEEP ? gone.every((m) => msgTs(m) < firstFresh) : !gone.length)
      && added.every((m) => msgTs(m) >= lastOld);
    for (const m of fresh) { const o = oldById.get(id(m)); if (o && o.localUrl) m.localUrl = o.localUrl; }
    if (!tailOnly) { c.messages = [...fresh, ...sending]; relinkChatRefs(c); rerenderChatBody(); return; }
    c.messages = [...gone, ...fresh];
    relinkChatRefs(c);
    // изменённые перерисовываем по одному — остальная лента не мигает и не грузит вложения заново
    for (const m of changed) {
      const o = oldById.get(id(m));
      if (o.pinned === m.pinned && o.content === m.content && (o.editedAt || null) === m.editedAt && head(o) === head(m)) paintChatReacts(m);
      else replaceChatBubble(m.id, m);
    }
    if (changed.length) { c.pinIdx = null; syncChatPinBar(); syncChatReplyBar(); }
    if (!added.length) return;
    const follow = chatFollowing(c);   // до вставки: потом до низа далеко уже из-за самих новых сообщений
    body.insertAdjacentHTML('beforeend', added.map(chatBubbleHtml).join(''));
    syncChatDates(body);
    syncChatRuns(body, false);
    fitChatBubbles(added.map((m) => chatBubbleEl(m.id)).filter(Boolean));
    hydrateChatMedia(body);
    if (follow) { chatFollowUntil = performance.now() + CHAT_FOLLOW_MS; scrollChatToBottom(); }
  }

  /* Вернулись в приложение (или вернулась связь), а чат открыт. Пока телефон был заблокирован или приложение
     свёрнуто, realtime молчал, а пропущенное он не досылает: лента так и стояла без новых сообщений, пока чат
     не открыть заново, — при этом чат уже отмечался прочитанным. Догружаем переписку и дописываем новое */
  async function refreshOpenChat(retry = true) {
    const c = chat;
    if (!c || c.loading || !currentUser) return;
    const fresh = await loadChatHistory(c);
    if (chat !== c || c.loading) return;
    // телефон только что проснулся, и сети ещё нет — пробуем ещё раз чуть позже
    if (!fresh) { if (retry) setTimeout(() => { if (chat === c) refreshOpenChat(false); }, 3000); return; }
    mergeFreshHistory(c, fresh);
    saveChatCache(c);
    markChatRead(c);
  }

  function showDmScreen(peerId) { return openChat({ type: 'dm', peerId }); }
  function showGroupChatScreen(groupId, backFn) { return openChat({ type: 'group', groupId }, backFn); }
  function showMatchChatScreen(matchId, backFn) { return openChat({ type: 'match', matchId: String(matchId) }, backFn); }

  /* ═══════ APPS ═══════ */
  const APPS = {
    messenger: { title: 'Сообщения', render: () => `<div class="empty-msg">Загружаем чат…</div>` },
    groups: { title: 'Группы', render: () => groupsListHtml() },
    friends: {
      title: 'Друзья',
      render: () => {
        const rowsHtml = friends.length
          ? `<ul class="rows">${friends.map((f) => `

                ${avatarCircleHtml(f, 40)}

                  <div class="person-name">${escapeHtml(f.name)}</div>
                  <div class="person-handle">${escapeHtml(f.handle)}</div>
                </div>
                <button class="btn" type="button" data-open-dm="${escapeHtml(f.id)}">Чат</button>
                <button class="btn btn-danger" type="button" data-remove-friend="${escapeHtml(f.id)}" aria-label="Удалить из друзей" title="Удалить из друзей">×</button>
              </li>`).join('')}</ul>`
          : `<div class="empty-msg">Пока нет друзей.<br>Нажмите <b>+</b> в правом верхнем углу, чтобы найти человека по @username.</div>`;
        // входящие заявки — над списком, с кнопками ответа
        const reqs = incomingFriendRequests.filter((r) => pendingIncomingRequests.has(r.id));
        const reqHtml = reqs.length ? `
          <section class="req-block" aria-label="Заявки в друзья">
            <div class="req-head"><span class="req-title">Заявки в друзья</span><span class="unread-pill">${reqs.length}</span></div>
            <ul class="req-list">${reqs.map((r) => `
              <li class="req-card" data-view-profile="${escapeHtml(r.fromId)}" data-profile-back="friends" role="button" tabindex="0">
                ${avatarCircleHtml(r, 44)}
                <div class="req-main">
                  <div class="person-name">${escapeHtml(r.name)}</div>

                </div>
                <div class="req-actions">
                  <button class="btn btn-primary" type="button" data-fr-accept="${escapeHtml(r.id)}">Принять</button>
                  <button class="btn" type="button" data-fr-decline="${escapeHtml(r.id)}">Отклонить</button>
                </div>
              </li>`).join('')}
            </ul>
          </section>` : '';
        return `
          <div class="sub-toolbar">

            <span class="sub-toolbar-spacer"></span>
            <button class="icon-btn" type="button" data-action="add-friend" aria-label="Найти друга"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></button>
          </div>
          ${reqHtml}${rowsHtml}`;

    profile: {
      title: 'Профиль',
      render: () => {
        const photos = photosOrAvatar(myPhotos, profile.avatar).filter((ph) => safeUrl(ph.url));
        // Фото ужимается по высоте окна, чтобы весь список под ним помещался без прокрутки
        const head = photos.length
          ? `<div class="me-fit ${profile.bio ? 'has-bio' : ''}">${photoHeroHtml(photos, profile.name, profile.handle)}
             ${profile.bio ? `<div class="profile-bio ph-bio ph-bio-own">${escapeHtml(profile.bio)}</div>` : ''}</div>`
          : `<div class="profile-head">
              ${profileAvatarHtml(84)}
              <div class="profile-name">${escapeHtml(profile.name)}</div>
              <div class="profile-handle">${escapeHtml(profile.handle)}</div>
              ${profile.bio ? `<div class="profile-bio">${escapeHtml(profile.bio)}</div>` : ''}
            </div>`;
        return `

          ${[
            ['open-wishes', 'Желания', 'Чем хотите заняться — видно 12 часов'],

            ['edit-profile', 'Редактировать профиль', 'Фото, имя и пара слов о себе'],
            ['open-settings', 'Настройки', 'Тема, уведомления, помощь и выход'],
          ].map(([act, name, sub]) => `
          <li class="row" data-action="${act}" role="button" tabindex="0"><div class="row-main"><div class="row-name">${name}</div><div class="row-sub">${escapeHtml(sub)}</div></div><span class="chev">›</span></li>`).join('')}
        </ul>`;

      render: () => {
        const list = shownNotifications();
        if (!list.length) return `<div class="notif-empty">Пока нет уведомлений</div>`;
        return `

            <div class="flt-foot">

    settings: {

      render: () => {
        const pref = getThemePref();
        const themeOpt = (key, label, icon) =>
          `<button type="button" class="seg-opt theme-opt" data-theme-pref="${key}" aria-pressed="${pref === key}">${icon}<span>${label}</span></button>`;
        const sun = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';

        const auto = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" class="fill"/></svg>';
        return `
        <div class="theme-block">
          <div class="theme-head"><span class="row-name">Тема</span><span class="row-sub">Оформление приложения</span></div>
          <div class="seg theme-seg">${themeOpt('auto', 'Авто', auto)}${themeOpt('light', 'Светлая', sun)}${themeOpt('dark', 'Тёмная', moon)}</div>
        </div>
        <div class="theme-block">
          <div class="theme-head"><span class="row-name">Цвета</span><span class="row-sub">Схема оформления и значок приложения</span></div>
          <div class="seg pal-seg">${Object.entries(PALETTES).map(([key, p]) => `
            <button type="button" class="seg-opt pal-opt" data-palette-pref="${key}" aria-pressed="${getPalette() === key}">
              <span class="pal-dot" style="background:linear-gradient(135deg, ${p.a} 0 50%, ${p.b} 50% 100%)"></span><span>${p.label}</span>
            </button>`).join('')}</div>
        </div>
        <ul class="rows">
          <li class="row">
            <div class="row-main"><div class="row-name">Уведомления</div><div class="row-sub">Сообщения и приглашения — на это устройство</div></div>
            <button class="switch" type="button" role="switch" data-setting="notifications" aria-checked="${pushOn()}"></button>
          </li>
          <li class="row" data-action="open-tour" role="button" tabindex="0">
            <div class="row-main"><div class="row-name">Как пользоваться</div><div class="row-sub">Коротко о ленте, группах, match и желаниях</div></div>
            <span class="chev">›</span>
          </li>
          <li class="row" data-action="open-rules" role="button" tabindex="0">
            <div class="row-main"><div class="row-name">Правила</div><div class="row-sub">Правила пользования и ответственность</div></div>
            <span class="chev">›</span>
          </li>
          <li class="row" data-action="open-support" role="button" tabindex="0">
            <div class="row-main"><div class="row-name">Техподдержка</div><div class="row-sub">Связаться с техподдержкой</div></div>
            <span class="chev">›</span>
          </li>
          <li class="row danger" data-action="logout" role="button" tabindex="0">
            <div class="row-main"><div class="row-name">Выйти из аккаунта</div></div>
            <span class="chev">›</span>
          </li>
        </ul>`;
      }
    }
  };

  /* ═══════ ОБЩИЕ ФУНКЦИИ ═══════ */
  /* С кем воспоминание: «@автор + @друг, @друг» или «@автор + «Группа»».
     Имена сохраняются в самом воспоминании — подпись не меняется, даже если потом кто-то удалится из друзей */
  function postWithLabel(p) {
    const c = p && p.companions;
    if (!c) return '';
    const rest = c.group && c.group.name ? `«${c.group.name}»`
      : (c.users || []).map((u) => u.handle || u.name).filter(Boolean).join(', ');
    if (!rest) return '';
    return `${c.by || p.author || ''} + ${rest}`;
  }

  // Подпись с кнопками: отмеченного человека можно открыть, группу — посмотреть её участников
  function postWithHtml(p) {
    const c = p && p.companions;
    if (!postWithLabel(p)) return '';
    const myId = currentUser && String(currentUser.id);
    const person = (id, text) => id && String(id) !== myId
      ? `<button type="button" class="pw-link" data-post-person="${escapeHtml(id)}">${escapeHtml(text)}</button>`
      : escapeHtml(text);
    const rest = c.group && c.group.name
      ? `<button type="button" class="pw-link" data-post-group="${escapeHtml(c.group.id || '')}">«${escapeHtml(c.group.name)}»</button>`
      : (c.users || []).filter((u) => u.handle || u.name).map((u) => person(u.id, u.handle || u.name)).join(', ');
    return `${person(p.authorId, c.by || p.author || '')} + ${rest}`;
  }

  /* Воспоминание одно на всех: запись одна, а в «Воспоминаниях» его видят автор
     и все отмеченные — друзья и участники отмеченной группы */
  function postIncludesMe(p) {
    const myId = currentUser && String(currentUser.id);
    if (!myId || !p) return false;
    if (String(p.authorId) === myId) return true;
    const c = p.companions;
    if (!c) return false;
    if ((c.users || []).some((u) => String(u.id) === myId)) return true;
    return !!(c.group && c.group.id && isGroupParticipant(groupById(c.group.id), currentUser.id));
  }
  function myPosts() { return posts.filter(postIncludesMe); }

  function postImages(p) {
    if (Array.isArray(p.images) && p.images.length) return p.images;
    if (p.image) return [p.image];
    return [];
  }

  function avatarCircleHtml(person, size = 40) {
    const letter = firstChar((person.name || '?').trim()).toUpperCase() || '?';
    if (person.avatar) return `<span class="avatar" style="width:${size}px;height:${size}px;background-image:url('${safeUrl(person.avatar)}')"></span>`;
    return `<span class="avatar" style="width:${size}px;height:${size}px;background:linear-gradient(145deg, var(--you-2), var(--you-deep))">${escapeHtml(letter)}</span>`;
  }

  /* Шапка профиля с фото во всю ширину: видна выбранная при добавлении область. Несколько фото листаются
     свайпом, полоски сверху показывают, какое открыто. Нажатие раскрывает фото целиком (как в Telegram),
     повторное — сворачивает обратно; в раскрытом виде нажатие у левого или правого края листает фото. */
  function photoHeroHtml(photos, name, handle) {
    const many = photos.length > 1;
    return `
      <div class="photo-hero ${many ? 'is-many' : ''}" data-photo-hero>
        <div class="ph-track">${photos.map((ph, i) => `
          <div class="ph-slide"><img src="${safeUrl(ph.url)}" alt="" draggable="false" ${i ? 'loading="lazy"' : ''} style="${cropStyle(ph.crop)}"></div>`).join('')}
        </div>
        ${many ? `<div class="ph-bars" aria-hidden="true">${photos.map((_, i) => `<span class="${i ? '' : 'is-on'}"></span>`).join('')}</div>` : ''}
        <div class="ph-caption">
          <div class="ph-name">${escapeHtml(name)}</div>
          <div class="ph-handle">${escapeHtml(handle)}</div>
        </div>
      </div>`;
  }

  function photoHeroStep(hero, delta) {
    const track = hero.querySelector('.ph-track');
    const n = track.children.length;
    const cur = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    const next = Math.max(0, Math.min(n - 1, cur + delta));
    if (next !== cur) track.scrollTo({ left: next * track.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  // Высота раскрытого фото: по пропорциям открытого снимка, но не выше 80% экрана
  function photoHeroIndex(hero) {
    const track = hero.querySelector('.ph-track');
    return Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  }
  function photoHeroFullHeight(hero) {
    const img = hero.querySelectorAll('.ph-slide img')[photoHeroIndex(hero)];
    const w = hero.clientWidth;
    const ratio = img && img.naturalWidth ? img.naturalHeight / img.naturalWidth : 1;
    const cap = window.innerHeight * 0.8;
    hero.classList.toggle('is-capped', w * ratio > cap + 1 || w * ratio < 159);
    return Math.round(Math.max(160, Math.min(w * ratio, cap)));
  }
  function setPhotoHeroExpanded(hero, on) {
    if (on === hero.classList.contains('is-expanded')) return;
    const from = hero.offsetHeight;
    if (on) {
      hero.style.height = from + 'px';
      void hero.offsetHeight;
      hero.classList.add('is-expanded');
      hero.style.height = photoHeroFullHeight(hero) + 'px';
      return;
    }
    // обратно — к высоте, которую задаёт вёрстка: меряем её без анимации и плавно возвращаемся
    hero.classList.remove('is-expanded');
    hero.style.transition = 'none';
    hero.style.height = '';
    const to = hero.offsetHeight;
    hero.style.height = from + 'px';
    void hero.offsetHeight;
    hero.style.transition = '';
    hero.style.height = to + 'px';
    const clear = (e) => {
      if (e && e.target !== hero) return;
      hero.removeEventListener('transitionend', clear);
      if (!hero.classList.contains('is-expanded')) hero.style.height = '';
    };
    hero.addEventListener('transitionend', clear);
    setTimeout(clear, 600);
  }
  // В раскрытом виде листнули к другому фото (или оно догрузилось) — подгоняем высоту под него
  function syncPhotoHeroHeight(hero) {
    if (hero && hero.classList.contains('is-expanded')) hero.style.height = photoHeroFullHeight(hero) + 'px';
  }
  function onPhotoHeroTap(hero, clientX) {
    if (!hero.classList.contains('is-expanded')) { setPhotoHeroExpanded(hero, true); return; }
    const r = hero.getBoundingClientRect(), f = (clientX - r.left) / r.width;
    if (hero.classList.contains('is-many') && (f < 0.28 || f > 0.72)) { photoHeroStep(hero, f < 0.5 ? -1 : 1); return; }
    setPhotoHeroExpanded(hero, false);
  }

  function profileAvatarHtml(size = 84) {
    if (profile.avatar) return `<span class="avatar-preview" style="width:${size}px;height:${size}px;background-image:url('${safeUrl(profile.avatar)}')"></span>`;
    const letter = firstChar((profile.name || '?').trim()).toUpperCase() || '?';
    return `<span class="avatar-preview" style="width:${size}px;height:${size}px">${escapeHtml(letter)}</span>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  /* Строки режем по символам, а не по половинкам эмодзи: charAt(0) и slice у имени «🏀 Баскетбол» отдают половину
     мяча — в аватаре и на обрезе подписи появлялся «�», а обрезанная так цитата ответа не сохранялась в базе (JSON) */
  function firstChar(s) { for (const ch of String(s || '')) return ch; return ''; }
  function cutChars(s, n) { const a = Array.from(String(s || '')); return a.length > n ? a.slice(0, n).join('') : a.join(''); }
  // не длиннее n символов вместе с многоточием
  function ellipsize(s, n) { const a = Array.from(String(s || '')); return a.length > n ? a.slice(0, n - 1).join('') + '…' : a.join(''); }
  /* URL картинки для вставки в HTML-шаблон (src="…" или url('…')).
     Пропускает только data:image/…;base64 и ссылки на наш Supabase, остальное — пустая строка.
     Чужой адрес не пропускаем: картинка с постороннего сервера выдала бы его владельцу IP каждого, кто её увидел. */
  function safeUrl(u) {
    const s = String(u || '').trim();
    if (/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i.test(s)) return s;
    if (s.startsWith(SUPABASE_URL + '/') && /^https:\/\/[^\s"'()<>\\]+$/i.test(s)) return s;
    return '';
  }
  function normalizeUsernameInput(raw) { return String(raw).trim().replace(/^@+/, '').toLowerCase(); }
  function isValidUsernameInput(u) { return /^[a-zA-Z][a-zA-Z0-9_.]{2,19}$/.test(u); }

  const NOTIF_ICON = {
    message: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 3C6.9 3 3 6.5 3 10.8c0 2.2 1.1 4.2 3 5.6-.2 1-.7 2-1.5 2.9 1.6-.2 3-.8 4.1-1.6.8.2 1.6.3 2.4.3 5.1 0 9-3.5 9-7.8S17.1 3 12 3z"/></svg>`,
    geo:     `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>`,
    system:  `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2 1 21h22L12 2zm0 6 6.5 11h-13L12 8zm-1 3v4h2v-4h-2zm0 5v2h2v-2h-2z"/></svg>`,
    friend_request: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M15 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`,
    friend_accept:  `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>`,
    group_match:    `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>`,
    group_match_accept: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
    match_vote:        `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M5 3h14v12H5zM8 7h8v2H8zm0 3h5v2H8zM3 17h18v4H3z"/></svg>`,
    match_vote_result: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
    group:   `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>`,
    join_request: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M15 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`,
    join_accept:  `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>`,
    join_decline: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M18.3 5.71 12 12.01l-6.3-6.3-1.41 1.41 6.3 6.3-6.3 6.3 1.41 1.41 6.3-6.3 6.3 6.3 1.41-1.41-6.3-6.3 6.3-6.3z"/></svg>`,
  };
  // Значки уведомлений — оттенки одного спектра; match — весь спектр целиком
  const NOTIF_COLOR = {
    message: 'linear-gradient(145deg, var(--c1), var(--c3))',
    geo:     'linear-gradient(145deg, var(--c1), var(--c2))',
    system:  'linear-gradient(145deg, #3A3A44, #16161B)',
    group:   'linear-gradient(145deg, var(--c2), var(--c3))',
    friend_request: 'linear-gradient(145deg, var(--c1), var(--c2))',
    friend_accept:  'linear-gradient(145deg, var(--c1), #23C48E)',
    group_match:        'var(--prism)',
    group_match_accept: 'linear-gradient(145deg, var(--c3), var(--c4))',
    match_vote:         'linear-gradient(145deg, var(--c1), var(--c3))',
    match_vote_result:  'linear-gradient(145deg, var(--c2), var(--c4))',
    join_request:       'linear-gradient(145deg, var(--c2), var(--c3))',
    join_accept:        'linear-gradient(145deg, var(--c1), #23C48E)',
    join_decline:       'linear-gradient(145deg, #3A3A44, #16161B)',
  };
  function friendRequestActionsHtml(n) {
    if (n.type !== 'friend_request' || !n.requestId) return '';
    const outcome = friendRequestOutcome.get(n.requestId);
    if (outcome === 'accepted') return `<div class="notif-status">Вы приняли запрос</div>`;
    if (outcome === 'declined') return `<div class="notif-status">Запрос отклонён</div>`;
    if (!pendingIncomingRequests.has(n.requestId)) return `<div class="notif-status">Запрос уже обработан</div>`;
    const id = escapeHtml(n.requestId);
    return `<div class="notif-actions">
      <button class="btn btn-primary" type="button" data-fr-accept="${id}">Принять</button>
      <button class="btn" type="button" data-fr-decline="${id}">Отклонить</button>
    </div>`;
  }
  // Приглашение в группу: уведомление типа «group» с номером приглашения
  function groupInviteActionsHtml(n) {
    if (n.type !== 'group' || !n.requestId) return '';
    const outcome = groupInviteOutcome.get(n.requestId);
    if (outcome === 'accepted') return `<div class="notif-status">Вы вступили в группу</div>`;
    if (outcome === 'declined') return `<div class="notif-status">Приглашение отклонено</div>`;
    if (!pendingIncomingInvite(n.requestId)) return `<div class="notif-status">Приглашение уже обработано</div>`;
    const id = escapeHtml(n.requestId);
    return `<div class="notif-actions">
      <button class="btn btn-primary" type="button" data-gi-accept="${id}">Вступить</button>
      <button class="btn" type="button" data-gi-decline="${id}">Отклонить</button>
    </div>`;
  }
  function groupMatchActionsHtml(n) {
    if (!n.requestId || n.type === 'group') return '';
    const live = groupMatches.find((x) => x.id === n.requestId && x.status === 'accepted');
    const openBtn = `<div class="notif-actions"><button class="btn btn-primary" type="button" data-open-match-chat="${escapeHtml(n.requestId)}">Открыть чат</button></div>`;
    // Голосование и match: кнопка чата — только пока союз жив (распавшийся чат удалён)
    if (n.type === 'match_vote' || n.type === 'match_vote_result' || n.type === 'group_match_accept') return live ? openBtn : '';
    if (n.type !== 'group_match') return '';
    const outcome = groupMatchOutcome.get(n.requestId);
    if (outcome === 'accepted') return `<div class="notif-actions"><button class="btn btn-primary" type="button" data-open-match-chat="${escapeHtml(n.requestId)}">Открыть чат</button></div>`;
    if (outcome === 'declined') return `<div class="notif-status">Запрос отклонён</div>`;
    const m = groupMatches.find((x) => x.id === n.requestId);
    if (m && m.status === 'accepted') return `<div class="notif-actions"><button class="btn btn-primary" type="button" data-open-match-chat="${escapeHtml(m.id)}">Открыть чат</button></div>`;
    if (!pendingIncomingMatch(n.requestId)) return `<div class="notif-status">Запрос уже обработан</div>`;
    // прежде чем ответить, можно посмотреть группу, которая прислала запрос
    return matchResponseButtonsHtml(m, m.fromGroup);
  }
  function notifIconHtml(type) {
    const svg = NOTIF_ICON[type] || NOTIF_ICON.system;
    const bg = NOTIF_COLOR[type] || NOTIF_COLOR.system;
    return `<span class="notif-icon" style="background:${bg}">${svg}</span>`;
  }
  /* Значок уведомления: у приглашения в группу и у запроса на match — фото группы (нажатие открывает её карточку),
     у match и голосования о союзе — общий знак двух групп, у остальных — значок по типу */
  function notifAvatarHtml(n) {
    let g = null, m = null;
    if (n.requestId && n.type === 'group') {
      const inv = groupInvites.find((i) => i.id === n.requestId);
      g = inv ? groupById(inv.groupId) : null;
    } else if (n.requestId && /^(group_match|group_match_accept|match_vote|match_vote_result)$/.test(n.type)) {
      m = groupMatches.find((x) => x.id === n.requestId) || null;
      if (m && n.type === 'group_match') g = groupById(m.fromGroup);
    }
    if (g) {
      const url = safeUrl(g.photo);
      return `<span class="notif-icon notif-group" data-view-group="${escapeHtml(g.id)}" role="button" title="${escapeHtml(g.name || 'Группа')}"
        style="${url ? `background-image:url('${url}')` : `background:${NOTIF_COLOR.group}`}">${url ? '' : escapeHtml(firstChar((g.name || '?').trim()).toUpperCase() || '?')}</span>`;
    }
    if (m && groupById(m.fromGroup) && groupById(m.toGroup)) return featAvatarHtml(m, 40);
    return notifIconHtml(n.type);
  }
  /* В уведомлениях нет заявок в друзья и приглашений в группы — они во вкладках «Друзья» и «Группы», с кнопками
     ответа, — и начала голосования о союзе: оно всплывает в самом совместном чате */
  function notifShown(n) {
    // подарки (из прежнего магазина) не показываем
    if (n.type === 'friend_request' || n.type === 'match_vote' || n.type === 'gift') return false;
    return !(n.type === 'group' && n.requestId);
  }
  function shownNotifications() { return notifications.filter(notifShown); }
  // Куда ведёт уведомление: друг — во вкладку «Друзья», запрос на match — в карточку группы, match и голосование —
  // в совместный чат
  function openNotificationTarget(n) {
    const back = () => showApp('notifications');
    const m = n.requestId ? groupMatches.find((x) => x.id === n.requestId) : null;
    if (n.type === 'friend_accept' || n.type === 'friend_request') { showApp('friends'); return; }
    if (/^join_(request|accept|decline)$/.test(n.type)) {
      // заявка в группу — её карточка: у лидера там раздел «Заявки», у принятого — уже его группа
      const r = n.requestId ? joinRequests.find((x) => x.id === n.requestId) : null;
      if (r && groupById(r.groupId)) showGroupDetailsScreen(r.groupId, back); else showApp('groups');
      return;
    }
    if (n.type === 'group' && n.requestId) {
      const inv = groupInvites.find((i) => i.id === n.requestId);
      if (inv && groupById(inv.groupId)) showGroupDetailsScreen(inv.groupId, back);
      return;
    }
    if (n.type === 'group_match' && m && groupById(m.fromGroup)) { showGroupDetailsScreen(m.fromGroup, back); return; }
    if (/^(group_match_accept|match_vote|match_vote_result)$/.test(n.type) && m && m.status === 'accepted') showMatchChatScreen(m.id, back);
  }
  function unreadCount() { return shownNotifications().filter((n) => !n.read).length; }
  function updateBadge() {
    const badge = document.getElementById('notif-badge'); if (!badge) return;
    const n = unreadCount();
    if (n > 0) { badge.textContent = n > 99 ? '99+' : String(n); badge.hidden = false; } else { badge.hidden = true; }
  }

  /* ═══════ НАВИГАЦИЯ ═══════ */
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dock = document.getElementById('dock');
  const items = [...dock.querySelectorAll('.dock-item')];
  const win = document.getElementById('window');
  const winTitle = document.getElementById('win-title');
  const winBody = document.getElementById('win-body');
  let openApp = null, closeTimer = null;
  let currentBackHandler = null;
  let placesView = (() => { try { return localStorage.getItem('places.view.v1') === 'grid' ? 'grid' : 'feed'; } catch { return 'feed'; } })();

  function savePlacesView(v) { try { localStorage.setItem('places.view.v1', v); } catch {} }

  /* ── Движение между экранами ──
     navDir — откуда пришли: вперёд (новый экран выезжает справа) или назад (слева). */
  let navDir = 'fwd';
  let screenAnimTimer = null;
  const SCREEN_ANIM = ['scr-fwd', 'scr-back', 'scr-open', 'scr-fade'];
  /* Обновление открытого экрана «на месте» — когда пришли новые данные (ответ сервера, realtime),
     а человек никуда не переходил. Без анимации смены экрана и без сброса прокрутки: иначе экран
     мигает на каждое событие. Переходы между экранами по-прежнему анимируются. */
  let quietRender = false;
  function quietly(fn) {
    const top = winBody.scrollTop;
    winBody.classList.remove(...SCREEN_ANIM);
    quietRender = true;
    try { fn(); } finally { quietRender = false; }
    winBody.scrollTop = top;
  }
  /* Анимации смены экрана висят на детях окна, а их только что создали заново (новое содержимое) — новые
     элементы анимируются сами. Раньше здесь был «перезапуск» через offsetWidth: он заставлял браузер посреди
     нажатия разложить всё окно, а потом ещё раз — уже в кадре */
  function animateScreen(kind) {
    if (reduceMotion || quietRender) return;
    winBody.classList.remove('scr-fwd', 'scr-back', 'scr-open', 'scr-fade');
    winBody.classList.add('scr-' + kind);
    clearTimeout(screenAnimTimer);
    // снимаем класс, чтобы перерисовки по realtime не анимировались заново
    screenAnimTimer = setTimeout(() => winBody.classList.remove('scr-fwd', 'scr-back', 'scr-open', 'scr-fade'), 700);
  }
  /* По краю окна пробегает спектр — при открытии окна и смене вкладки. Только на компьютере: на телефоне это
     перерисовка всего окна в каждом кадре как раз тогда, когда окно выезжает. Перезапуск — сменой имени
     анимации (sweep ↔ sweep-b), без принудительного пересчёта раскладки */
  let sweepTimer = null, sweepAlt = false;
  const coarsePointer = matchMedia('(pointer: coarse)');
  function playWindowSweep() {
    if (reduceMotion || quietRender || coarsePointer.matches) return;
    sweepAlt = !sweepAlt;
    win.classList.remove('sweep', 'sweep-b');
    win.classList.add(sweepAlt ? 'sweep-b' : 'sweep');
    clearTimeout(sweepTimer);
    sweepTimer = setTimeout(() => win.classList.remove('sweep', 'sweep-b'), 1500);
  }
  function setScreen(renderFn, backFn) {
    currentBackHandler = (typeof backFn === 'function') ? backFn : null;
    renderFn();
    animateScreen(navDir === 'back' ? 'back' : 'fwd');
    syncWinClear();
  }
  // «Метла» в шапке — только на самом списке уведомлений и только когда есть что очищать
  function syncWinClear() {
    const btn = document.getElementById('win-clear');
    if (btn) btn.hidden = !(openApp === 'notifications' && !currentBackHandler && shownNotifications().length);
  }
  function goBack() {
    if (typeof currentBackHandler === 'function') {
      const b = currentBackHandler;
      currentBackHandler = null;
      navDir = 'back';
      try { b(); } finally { navDir = 'fwd'; }
    } else closeApp();
  }
  function resetScreenStack() { currentBackHandler = null; }
  function setDots() {
    items.forEach((li) => { li.dataset.open = String(li.querySelector('.dock-btn').dataset.app === openApp); });
    const nBtn = document.getElementById('notif-btn'); if (nBtn) nBtn.classList.toggle('is-active', openApp === 'notifications');
    const sBtn = document.getElementById('settings-btn'); if (sBtn) sBtn.classList.toggle('is-active', openApp === 'settings');
    const fBtn = document.getElementById('filter-btn'); if (fBtn) fBtn.classList.toggle('is-active', openApp === 'filters');
    syncWinClear();
    moveDockPill();
  }

  /* ── «Жидкая» капсула вкладок ──
     Передний край догоняет новую вкладку быстрее заднего: на ходу капсула вытягивается,
     а у цели сжимается обратно с лёгкой пружиной — как капля. */
  const dockPill = dock.querySelector('.dock-pill');
  let dockPillLeft = null;
  /* Где стоят вкладки — меряем один раз (и заново при смене размера окна и загрузке шрифта). Раньше мерили при
     каждом переключении — сразу после смены классов страницы, и браузер посреди нажатия пересчитывал стили
     и раскладку всего экрана */
  let dockGeom = null;
  function measureDock() {
    if (!dock.offsetWidth) return null;   // панель скрыта (экран входа) — мерить нечего
    // где панель на экране — без учёта анимаций (transform), как она стоит в раскладке
    let x = 0, y = 0;
    for (let el = dock; el; el = el.offsetParent) { x += el.offsetLeft; y += el.offsetTop; }
    return { x, y, w: dock.clientWidth, items: items.map((li) => ({ left: li.offsetLeft, width: li.offsetWidth })) };
  }
  // Где кнопка вкладки на экране — из запомненной раскладки панели: замер посреди нажатия раскладывал бы
  // всё, что успело измениться (например, ленту чата на 300 сообщений, из которого как раз уходят)
  function dockBtnRect(btn) {
    const li = btn && btn.closest ? btn.closest('.dock-item') : null;
    const i = li ? items.indexOf(li) : -1;
    if (i < 0) return null;
    if (!dockGeom) dockGeom = measureDock();
    const g = dockGeom && dockGeom.items[i];
    return g && g.width ? { left: dockGeom.x + g.left, width: g.width, top: dockGeom.y } : null;
  }
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { dockGeom = null; dockPillLeft = null; moveDockPill(); });
  function moveDockPill() {
    if (!dockPill) return;
    const i = items.findIndex((x) => x.dataset.open === 'true');
    if (i < 0) { dockPill.classList.add('is-hidden'); return; }
    if (!dockGeom) dockGeom = measureDock();
    const g = dockGeom && dockGeom.items[i];
    if (!g || !g.width) { dockGeom = null; dockPill.classList.add('is-hidden'); return; }
    const left = g.left;
    const right = dockGeom.w - g.left - g.width;
    if (dockPillLeft !== null && left !== dockPillLeft) {
      const toRight = left > dockPillLeft;
      const lead = 'cubic-bezier(.3, 1.35, .5, 1)', trail = 'cubic-bezier(.6, 0, .2, 1)';
      dockPill.style.setProperty('--tl', toRight ? '.5s' : '.34s');
      dockPill.style.setProperty('--tr', toRight ? '.34s' : '.5s');
      dockPill.style.setProperty('--el', toRight ? trail : lead);
      dockPill.style.setProperty('--er', toRight ? lead : trail);
    }
    dockPill.style.left = left + 'px';
    dockPill.style.right = right + 'px';
    dockPill.classList.remove('is-hidden');
    if (dockPillLeft === null) requestAnimationFrame(() => requestAnimationFrame(() => dockPill.classList.add('is-ready')));
    dockPillLeft = left;
  }
  addEventListener('resize', () => {
    if (!dockPill) return;
    dockPill.classList.remove('is-ready');
    dockPillLeft = null; dockGeom = null;
    moveDockPill();
  });

  // Интерфейс «съезжается» к краям — после входа и при запуске с уже открытой сессией
  function playChromeEnter() {
    if (reduceMotion) return;
    document.body.classList.remove('chrome-enter');
    void document.body.offsetWidth;
    document.body.classList.add('chrome-enter');
    setTimeout(() => document.body.classList.remove('chrome-enter'), 1600);
  }

  function showFeedApp() {
    leaveChat();
    clearTimeout(closeTimer); closePostMenus();
    win.querySelectorAll(':scope > .modal-backdrop').forEach((el) => el.remove());   // незакрытые окна подтверждения
    winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
    win.classList.remove('is-open', 'sweep', 'sweep-b');
    closeTimer = setTimeout(() => { win.hidden = true; }, reduceMotion ? 0 : 300);
    resetScreenStack();
    openApp = 'feed';
    document.body.classList.remove('app-window');
    document.body.classList.add('app-feed');
    setDots();
    if (feedDirty) renderFeed();
  }

  // Левый край окна не зависит от содержимого — меряем его один раз (и заново при смене размера экрана)
  let winLeft = null;
  addEventListener('resize', () => { winLeft = null; });
  function showApp(id, fromBtn) {
    if (id === 'feed') { showFeedApp(); return; }
    if (matchDeck) closeMatchDeck();
    if (id === 'messenger') { showMessengerScreen(); return; }
    const app = APPS[id]; if (!app) return;
    // кнопку вкладки берём из запомненной раскладки панели, остальные (сверху) меряем до изменений на странице
    const br = fromBtn ? dockBtnRect(fromBtn) || fromBtn.getBoundingClientRect() : null;
    if (winLeft === null && !win.hidden) winLeft = win.offsetLeft;
    leaveChat();
    clearTimeout(closeTimer); closePostMenus();
    winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
    winTitle.textContent = app.title;
    const html = app.render();
    winBody.innerHTML = html;
    winBody.scrollTop = 0;
    win.hidden = false;
    if (winLeft === null) winLeft = win.offsetLeft;   // только при самом первом открытии окна
    // окно растёт из нажатой кнопки: по горизонтали — от неё, по вертикали — снизу (из панели) или сверху.
    // Высота окна зависит от содержимого, поэтому «снизу» — в процентах от неё, без замера
    const ox = br ? Math.round(br.left + br.width / 2 - winLeft) + 'px' : '50%';
    const oy = br && br.top < innerHeight / 2 ? '-40px' : 'calc(100% + 60px)';
    win.style.transformOrigin = `${ox} ${oy}`;
    requestAnimationFrame(() => win.classList.add('is-open'));
    animateScreen(navDir === 'back' ? 'back' : 'open');
    if (navDir !== 'back') playWindowSweep();
    resetScreenStack();
    openApp = id;
    document.body.classList.remove('app-feed');
    document.body.classList.add('app-window');
    setDots();
    if (id === 'settings') syncSettingsUi();
    if (id === 'filters') syncFiltersUi();
    if (id === 'profile') ensureMyPhotos();
    if (id === 'groups') bindGroupSwipe();
    // что сейчас на экране — тот же HTML, что только что вставили (раньше список строился второй раз)
    if (id === 'friends') friendsListShown = html;
    if (id === 'notifications') notifListShown = html;
    if (id === 'notifications' && currentUser) {
      supabaseClient.from('notifications').update({ read: true }).eq('user_id', currentUser.id).eq('read', false)
        .then(() => { notifications = notifications.map((n) => ({ ...n, read: true })); updateBadge(); });
    }
    // фокус — последним: ему нужна готовая раскладка, и после него страница уже не меняется до кадра
    win.focus({ preventScroll: true });
  }

  function closeApp() { showFeedApp(); }

  // Подписи и счётчик на экране фильтров
  function syncFiltersUi() {
    if (openApp !== 'filters') return;
    const f = feedFilters;
    const q = (s) => winBody.querySelector(s);
    const ageEl = q('#flt-age');
    if (!ageEl) return;
    q('#flt-age-block').classList.toggle('is-off', !f.ageOn);
    q('#flt-age-sub').textContent = f.ageOn ? 'Средний возраст группы' : 'Любой';
    q('#flt-age-val').innerHTML = `${f.spread ? `${f.age - f.spread}–${f.age + f.spread}` : f.age}<small>лет</small>`;
    // заливка дорожки ползунка — до бегунка
    ageEl.style.setProperty('--p', ((f.age - ageEl.min) / (ageEl.max - ageEl.min) * 100).toFixed(1) + '%');
    winBody.querySelectorAll('[data-flt-spread]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.fltSpread) === f.spread)));
    winBody.querySelectorAll('[data-flt-comp]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.fltComp === f.comp)));
    const myId = currentUser && currentUser.id;
    const others = groups.filter((g) => !isGroupParticipant(g, myId) && !groupHiddenForMe(g));
    const passed = others.filter(groupPassesFilters).length;
    q('#flt-count').textContent = others.length
      ? `В ленте ${passed} из ${others.length}`
      : 'Других групп пока нет';
  }

  // Уведомления обновляются на месте: без сброса прокрутки и только если список действительно изменился
  let notifListShown = '';
  function refreshNotifications() {
    updateBadge();
    if (openApp !== 'notifications' || win.hidden) return;
    syncWinClear();
    if (currentBackHandler) return;   // открыт вложенный экран — список не трогаем
    const html = APPS.notifications.render();
    if (html === notifListShown) return;
    winBody.classList.remove(...SCREEN_ANIM);
    notifListShown = html;
    winBody.innerHTML = html;
  }

  document.getElementById('win-clear').addEventListener('click', async () => {
    if (!shownNotifications().length || !currentUser) return;
    const ok = await confirmModal({
      title: 'Очистить уведомления?',
      text: 'Все уведомления будут удалены. Это действие нельзя отменить.',
      confirmLabel: 'Очистить',
    });
    if (!ok) return;
    const before = notifications;
    notifications = [];
    refreshNotifications();
    const { data, error } = await supabaseClient.from('notifications').delete().eq('user_id', currentUser.id).select('id');
    // без права на удаление база молча ничего не удаляет — тогда возвращаем список
    if (error || (data && data.length === 0 && before.length)) {
      console.error('[notifications] clear:', error || 'нет права на удаление (RLS)');
      notifications = before;
      refreshNotifications();
      alert('Не удалось очистить уведомления' + (error ? ': ' + error.message : ''));
    }
  });

  function showPlacesScreen() {
    if (openApp !== 'profile') showApp('profile');
    setScreen(() => {
      closePostMenus();
      winTitle.textContent = 'Воспоминания';
      winBody.scrollTop = 0;
      winBody.innerHTML = renderPlaces();
      bindCarousels();
    }, () => showApp('profile'));
  }

  function renderPlaces() {
    const isGrid = placesView === 'grid';
    return `
      <div class="places-toolbar">
        <div class="view-toggle" role="group">
          <button class="view-btn" type="button" data-view="grid" aria-pressed="${isGrid}"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg></button>
          <button class="view-btn" type="button" data-view="feed" aria-pressed="${!isGrid}"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 5h16v2H4V5zm0 6h16v2H4v-2zm0 6h16v2H4v-2z"/></svg></button>
        </div>
        <span class="places-spacer"></span>
        <button class="view-btn" type="button" data-action="new-post"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></button>
      </div>
      ${isGrid ? renderGrid() : renderPostsFeed()}`;
  }

  // «Воспоминания» списком (не путать с лентой групп — renderFeed)
  function renderPostsFeed(list = myPosts()) {
    if (!list.length) return placesEmptyHtml();
    return `<div class="feed">${list.map((p) => {
      const imgs = postImages(p);
      const multi = imgs.length > 1;
      const mediaHtml = multi
        ? `<div class="post-carousel" data-carousel tabindex="0"><div class="slides">${imgs.map((src) => `<div class="slide"><img src="${safeUrl(src)}" loading="lazy" draggable="false"></div>`).join('')}</div>
            <button type="button" class="pc-arrow prev" data-pc-step="-1" aria-label="Предыдущее фото"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button type="button" class="pc-arrow next" data-pc-step="1" aria-label="Следующее фото"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
            <span class="counter"><span data-idx>1</span>/${imgs.length}</span>
            <div class="dots">${imgs.map((_, i) => `<button class="dot ${i === 0 ? 'active' : ''}" type="button"></button>`).join('')}</div></div>`
        : `<img class="post-media" src="${safeUrl(imgs[0])}" loading="lazy">`;
      const isMine = p.authorId === (currentUser && currentUser.id);
      return `<article class="post" data-post-id="${escapeHtml(p.id)}">
        <header class="post-head">
          <span class="avatar" style="background:linear-gradient(145deg, var(--you-2), var(--you-deep))">${escapeHtml(firstChar((p.author || '?').trim()).toUpperCase() || '?')}</span>
          <div class="row-main">
            <div class="post-author ${postWithLabel(p) ? 'is-with' : ''}">${postWithHtml(p) || escapeHtml(p.author || '')}</div>
            <div class="post-place">📍 ${escapeHtml(p.place || '')}</div>
          </div>
          <span class="row-time">${escapeHtml(p.time || '')}</span>
          ${isMine ? `<button type="button" class="post-menu-btn" data-post-menu="${escapeHtml(p.id)}"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg></button>` : ''}
        </header>
        ${mediaHtml}
        ${p.caption ? `<div class="post-body"><div class="post-caption">${escapeHtml(p.caption)}</div></div>` : ''}
      </article>`;
    }).join('')}</div>`;
  }

  function renderGrid(list = myPosts()) {
    if (!list.length) return placesEmptyHtml();
    return `<div class="grid">${list.map((p) => {
      const imgs = postImages(p);
      const badge = imgs.length > 1 ? `<span class="cell-multi">${imgs.length}</span>` : '';
      return `<div class="grid-cell" data-post-id="${escapeHtml(p.id)}" role="button" tabindex="0">
        <img src="${safeUrl(imgs[0])}" loading="lazy">${badge}
        ${p.caption ? `<span class="cell-caption">${escapeHtml(p.caption)}</span>` : ''}
      </div>`;
    }).join('')}</div>`;
  }

  function placesEmptyHtml() {
    return `<div class="places-empty">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5 11 16.5 14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      Пока нет воспоминаний.<br>Нажмите кнопку ниже, чтобы добавить первое.
      <div><button class="btn btn-primary" type="button" data-action="new-post">Новое воспоминание</button></div>
    </div>`;
  }

  function bindCarousels() {
    winBody.querySelectorAll('[data-carousel]').forEach((el) => {
      const slides = el.querySelector('.slides'); if (!slides) return;
      const dots = [...el.querySelectorAll('.dot')];
      const counter = el.querySelector('[data-idx]');
      const prev = el.querySelector('.pc-arrow.prev'), next = el.querySelector('.pc-arrow.next');
      const count = slides.children.length;
      const clamp = (i) => Math.max(0, Math.min(count - 1, i));
      const currentIndex = () => clamp(Math.round(slides.scrollLeft / (slides.clientWidth || 1)));
      let target = 0;   // куда листаем сейчас: при быстрых нажатиях стрелок шаг идёт от него, а не от середины анимации
      const goTo = (i) => { target = clamp(i); slides.scrollTo({ left: target * slides.clientWidth, behavior: 'smooth' }); paint(target); };
      const paint = (i) => {
        dots.forEach((d, k) => d.classList.toggle('active', k === i));
        if (counter) counter.textContent = String(i + 1);
        if (prev) prev.disabled = i === 0;
        if (next) next.disabled = i === count - 1;
      };
      let settleTimer = 0, drag = null;
      slides.addEventListener('scroll', () => {
        if (drag) return;
        clearTimeout(settleTimer);
        settleTimer = setTimeout(() => { target = currentIndex(); paint(target); }, 80);
      }, { passive: true });
      dots.forEach((d, i) => d.addEventListener('click', (e) => { e.stopPropagation(); goTo(i); }));
      [prev, next].forEach((b) => b && b.addEventListener('click', (e) => { e.stopPropagation(); goTo(target + Number(b.dataset.pcStep)); }));
      el.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        e.preventDefault(); e.stopPropagation();
        goTo(target + (e.key === 'ArrowLeft' ? -1 : 1));
      });

      // Мышью: зажал и тянешь в сторону. На сенсорных экранах листает сам браузер (scroll-snap).
      slides.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse' || e.button !== 0) return;
        drag = { x: e.clientX, left: slides.scrollLeft, from: currentIndex(), moved: false };
        slides.setPointerCapture(e.pointerId);
        slides.classList.add('is-dragging');
      });
      slides.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.x;
        if (Math.abs(dx) > 4) drag.moved = true;
        slides.scrollLeft = drag.left - dx;
      });
      const endDrag = (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.x, from = drag.from;
        const w = slides.clientWidth || 1;
        drag = null;
        slides.classList.remove('is-dragging');
        // хватает короткого рывка: дальше 15% ширины — следующее фото
        goTo(Math.abs(dx) > w * 0.15 ? from + (dx < 0 ? 1 : -1) : from);
      };
      slides.addEventListener('pointerup', endDrag);
      slides.addEventListener('pointercancel', endDrag);
      paint(0);
    });
  }

  function openPostMenu(postId, anchorEl) {
    closePostMenus();

    pop.innerHTML = `
      <button class="pop-item danger" type="button" data-remove-post="${escapeHtml(postId)}">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 7h12v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7zm3-3h6l1 2h4v2H4V6h4l1-2z"/></svg>

    const aRect = anchorEl.getBoundingClientRect();
    const scrollTop = winBody.scrollTop;
    let left = aRect.right - bodyRect.left - pop.offsetWidth;
    let top = aRect.bottom - bodyRect.top + scrollTop + 6;
    if (left < 8) left = 8;
    if (left > bodyRect.width - pop.offsetWidth - 8) left = bodyRect.width - pop.offsetWidth - 8;
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
    const onDocClick = (ev) => { if (!pop.contains(ev.target) && !anchorEl.contains(ev.target)) { closePostMenus(); document.removeEventListener('pointerdown', onDocClick, true); } };
    setTimeout(() => document.addEventListener('pointerdown', onDocClick, true), 0);
