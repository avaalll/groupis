      const away = (side, roll) => {
        q.copy(q0);
        if (roll) q.premultiply(rq.setFromAxisAngle(camDir, roll));
        toScreen(near, q, scrA);
        const dx = scrA.x - m.x, dy = scrA.y - m.y, len = Math.hypot(dx, dy) || 1;
        const [sx, sy] = SIDES[side];
        return (-dx * sx - dy * sy) / len;
      };
      let best = null, fallback = null;
      for (const side of list) {
        if (!near) {
          const cost = sidePenalty(side);
          if (!best || cost < best.cost) best = { side, roll: 0, cost };
          continue;
        }
        const a0 = away(side, 0);
        if (!fallback || a0 > fallback.score) fallback = { side, roll: 0, score: a0, cost: 5 };
        let found = null;
        for (let k = 0; k <= maxRollSteps && found === null; k++) {
          for (const sign of k ? [1, -1] : [1]) {
            const roll = sign * k * Math.PI / 36;   // шаг 5°
            if (away(side, roll) >= 0.64) { found = roll; break; }   // пунктир не ближе 50° к карточке
          }
        }
        if (found === null) continue;
        const cost = Math.abs(found) * 0.6 + sidePenalty(side);
        if (!best || cost < best.cost) best = { side, roll: found, cost };
      }
      best = best || fallback || { side: list[0], roll: 0, cost: 9 };
      const target = q0.clone();
      if (best.roll) target.premultiply(new THREE.Quaternion().setFromAxisAngle(camDir, best.roll));
      return { side: best.side, cost: best.cost, target };
    }

    function rotateToQ(target, dur, ease = easeInOut) {
      const from = earth.quaternion.clone();
      return tween(dur, (t) => { earth.quaternion.copy(from).slerp(target, ease(t)); });
    }

    function popSprite(sprite) {
      return tween(POP_DUR, (t) => { const s = MARKER_SIZE * Math.max(0, easeOutBack(t)); sprite.scale.set(s, s, s); });
    }

    // Первый крестик: глобус «доплывает» к нему с небольшого разворота, пока проявляется
    async function placeFirst(size) {
      if (!initialized) return null;
      const lat = (Math.random() * 90) - 45;
      const lon = (Math.random() * 360) - 180;
      const vec = latLonToVec3(lat, lon, 1).normalize();
      currentDir = perpendicular(vec);
      const m = { vec, sprite: addMarkerSprite(vec), line: null };
      markers.push(m);
      earth.quaternion.identity();
      const plan = planFor(vec, null, size);
      earth.quaternion.copy(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -0.6).multiply(plan.target));
      // 0.9 с: при easeOut глобус почти весь путь проходит в начале — раньше последние полсекунды он стоял,
      // а человек ждал, когда появится форма входа
      await rotateToQ(plan.target, 900, easeOut);
      await Promise.race([popSprite(m.sprite), wait(200)]);
      return plan.side;
    }

    /* Следующий этап: пунктир от текущего крестика к новому, глобус доворачивается, появляется крестик.
       Из нескольких вариантов следующей точки берём тот, при котором карточке удобнее всего встать. */
    async function advance(size) {
      if (!initialized) return null;
      const prev = markers[markers.length - 1];
      if (!prev) return placeFirst(size);
      let best = null;
      // из первого крестика путь может пойти в любую сторону, дальше — плавно, без резких поворотов
      const first = markers.length === 1;
      const N = first ? 36 : 25;
      for (let i = 0; i < N; i++) {
        const turn = first
          ? (i / N) * Math.PI * 2
          : ((i / (N - 1)) * 2 - 1) * MAX_TURN * 1.8 + (Math.random() - 0.5) * 0.06;
        const cand = buildNext(prev.vec, currentDir, turn);
        if (!validNext(prev.vec, cand.vec)) continue;
        const plan = planFor(cand.vec, prev.vec, size);
        const cost = plan.cost + (first ? 0 : Math.abs(turn) * 0.35) + Math.random() * 0.12;
        if (!best || cost < best.cost) best = { cand, plan, cost };
      }
      if (!best) {
        const cand = buildNext(prev.vec, currentDir, 0);
        best = { cand, plan: planFor(cand.vec, prev.vec, size) };
      }
      currentDir = best.cand.dir;
      const m = { vec: best.cand.vec, sprite: null, line: buildDashedArc(prev.vec, best.cand.vec) };
      markers.push(m);
      const rot = rotateToQ(best.plan.target, ROT_DUR);
      await tween(LINE_DUR, (t) => setArcProgress(m.line, easeInOut(t)));
      m.sprite = addMarkerSprite(m.vec);
      popSprite(m.sprite);
      await Promise.all([rot, wait(220)]);
      return best.plan.side;
    }

    // Плавно погасить крестики и пунктиры (у крестика меняем userData.alpha, у пунктира — opacity)
    function fadeTargets(list) {
      const items = [];
      for (const m of list) {
        if (m.sprite) items.push({ get: () => m.sprite.userData.alpha, set: (v) => { m.sprite.userData.alpha = v; } });
        if (m.line) items.push({ get: () => m.line.material.opacity, set: (v) => { m.line.material.opacity = v; } });
      }
      const from = items.map((it) => it.get());
      return (k) => items.forEach((it, i) => it.set(from[i] * (1 - k)));
    }

    function fadeOutMarker(m, dur) {
      const apply = fadeTargets([m]);
      return tween(dur, apply).then(() => { disposeObj(m.sprite); disposeObj(m.line); });
    }

    function recomputeDir() {
      if (markers.length >= 2) {
        const a = markers[markers.length - 2].vec, b = markers[markers.length - 1].vec;
        currentDir = b.clone().sub(a.clone().multiplyScalar(b.dot(a))).normalize();
      } else if (markers.length) currentDir = perpendicular(markers[0].vec);
      else currentDir = null;
    }

    /* Шаг назад: последний крестик и его пунктир гаснут, глобус возвращается к предыдущему */
    async function back(size) {
      if (!initialized || markers.length < 2) return null;
      const m = markers.pop();
      recomputeDir();
      const cur = markers[markers.length - 1], prev = markers[markers.length - 2];
      const plan = planFor(cur.vec, prev ? prev.vec : null, size);
      await Promise.all([fadeOutMarker(m, 380), rotateToQ(plan.target, 1100)]);
      return plan.side;
    }

    /* Оставить только первый крестик (возврат ко входу) */
    async function resetToFirst(size) {
      if (!initialized) return null;
      if (!markers.length) return placeFirst(size);
      const extra = markers.splice(1);
      recomputeDir();
      const plan = planFor(markers[0].vec, null, size);
      await Promise.all([...extra.map((m) => fadeOutMarker(m, 420)), rotateToQ(plan.target, 1300)]);
      return plan.side;
    }

    /* Сторона карточки без шага по маршруту (сменилось содержимое или размер окна):
       глобус только выравнивается к крестику, без проворота */
    function realign(size) {
      const cur = markers[markers.length - 1];
      if (!initialized || !cur || flying) return null;
      const prev = markers[markers.length - 2];
      const plan = planFor(cur.vec, prev ? prev.vec : null, size, 0);
      earth.quaternion.copy(plan.target);
      return plan.side;
    }

    function clearAll() {
      while (markers.length) { const m = markers.pop(); disposeObj(m.sprite); disposeObj(m.line); }
      currentDir = null;
    }

    // Экранные координаты последнего крестика — оттуда «вылетает» карточка
    function markerScreenPos() {
      if (!initialized) return null;
      const m = markers[markers.length - 1];
      if (!m || !m.sprite) return null;
      earth.updateMatrixWorld();
      const p = new THREE.Vector3();
      m.sprite.getWorldPosition(p);
      p.project(camera);
      return { x: (p.x + 1) / 2 * window.innerWidth, y: (1 - p.y) / 2 * window.innerHeight };
    }

    /* «Полёт к Земле»: камера летит в последний крестик и почти касается поверхности.
       Остальные крестики и пунктир гаснут сразу, а крестик-цель растёт навстречу и тает у самой земли. */
    async function flyIn(dur, onProgress) {
      if (!initialized) return;
      flying = true;
      earth.scale.setScalar(1); if (glow) glow.scale.setScalar(1);
      earth.updateMatrixWorld();
      const center = earth.position.clone();
      const last = markers[markers.length - 1];
      const target = last
        ? last.vec.clone().applyQuaternion(earth.quaternion).add(center)
        : center.clone().add(camDir);
      const normal = target.clone().sub(center).normalize();
      // Останавливаемся низко над поверхностью, но не вплотную — иначе текстура расплывается в пятно
      const endPos = target.clone().add(normal.clone().multiplyScalar(0.22));
      const startPos = camera.position.clone();
      const startLook = new THREE.Vector3(0, 0, 0);
      const look = new THREE.Vector3();
      camera.near = 0.01; camera.updateProjectionMatrix();
      const fadeOthers = fadeTargets(markers.map((m) => (m === last ? { line: m.line } : m)));
      const fadeLast = fadeTargets(last && last.sprite ? [{ sprite: last.sprite }] : []);
      await tween(dur, (t) => {
        // smootherstep: без рывка на старте и мягкое торможение у поверхности
        const e = t * t * t * (t * (t * 6 - 15) + 10);
        camera.position.lerpVectors(startPos, endPos, e);
        const k = Math.min(1, t * 1.6);
        look.lerpVectors(startLook, target, k * k * (3 - 2 * k));
        camera.lookAt(look);
        fadeOthers(Math.min(1, t / 0.3));
        fadeLast(Math.min(1, Math.max(0, (t - 0.5) / 0.28)));
        if (onProgress) onProgress(t);
      });
    }

    // Вернуть камеру и глобус в исходное состояние (после выхода из аккаунта)
    function resetView() {
      tweens.length = 0;
      clearAll();
      flying = false;
      if (!initialized) return;
      camera.near = 0.1;
      updateGlobePosition();
      earth.quaternion.identity();
    }

    /* Раскладка: глобус — главная фигура в центре экрана, под ним логотип.
       Активный крестик стоит в одной точке диска: на широком экране — чуть выше центра (карточка встаёт сбоку),
       на телефоне стоя — в нижней части (карточка встаёт над ним). Размер глобуса задаём расстоянием камеры. */
    function updateGlobePosition() {
      if (!earth || !camera) return;
      const w = window.innerWidth, h = lockedHeight || window.innerHeight;
      const t = Math.tan((camera.fov / 2) * Math.PI / 180);
      const portrait = h > w * 1.05;
      const logoH = Math.round(Math.max(28, Math.min(50, h * 0.05)));
      const gap = Math.round(Math.max(12, Math.min(30, h * 0.03)));
      const margin = Math.max(14, h * 0.035);
      // диаметр с запасом на ореол (1.08 радиуса)
      const D = Math.max(160, Math.min(w * (portrait ? 0.86 : 0.6), (h - logoH - gap - margin * 2) / 1.08, 860));
      const blockH = D + gap + logoH;
      // на телефоне стоя глобус чуть ниже середины: над крестиком нужно место для карточки
      const top = portrait
        ? Math.max(margin, Math.min(h - margin - blockH, h * 0.55 - D / 2))
        : Math.max(margin, (h - blockH) / 2);
      const cx = w / 2, cy = top + D / 2;
      // диаметр глобуса в пикселях ≈ h / (D·tg(fov/2)) — отсюда расстояние камеры
      camDist = Math.min(16, Math.max(2.2, h / (D * t)));
      const H = 2 * camDist * t, W = H * (w / h);
      const x = (cx / w - 0.5) * W, y = (0.5 - cy / h) * H;
      earth.position.set(x, y, 0);
      if (glow) glow.position.set(x, y, 0);
      if (!flying) {
        camera.position.set(0, 0, camDist);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
        camera.updateMatrixWorld();
      }
      // активный крестик: точка видимой полусферы, смещённая от центра диска на долю радиуса (y — вниз)
      const off = portrait ? { x: 0, y: 0.3 } : { x: 0, y: -0.08 };
      const toCam = new THREE.Vector3(-x, -y, camDist).normalize();
      const right = new THREE.Vector3(1, 0, 0).addScaledVector(toCam, -toCam.x).normalize();
      const up = new THREE.Vector3().crossVectors(toCam, right).normalize();
      camDir.copy(toCam).multiplyScalar(Math.sqrt(1 - off.x * off.x - off.y * off.y))
        .addScaledVector(right, off.x).addScaledVector(up, -off.y).normalize();
      layoutInfo = { cx, cy, r: D / 2, logoTop: top + D + gap, logoH, portrait, w, h };
    }

    // Чёткость холста без перегрузки: на больших экранах с высокой плотностью пикселей ограничиваем разрешение
    function pixelRatio() {
      const dpr = window.devicePixelRatio || 1;
      return Math.max(1, Math.min(dpr, 2, Math.sqrt(3.6e6 / (window.innerWidth * window.innerHeight))));
    }

    function onResize() {
      if (!renderer) return;
      const w = window.innerWidth, h = window.innerHeight;
      const canvas = renderer.domElement;
      // На Android экранная клавиатура уменьшает высоту окна. Чтобы глобус не прыгал и не сжимался,
      // пока человек печатает, оставляем холст прежнего размера — лишнее просто обрежется снизу.
      const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
      const prevW = renderer.getSize(new THREE.Vector2()).x;
      if (typing && w === prevW && h < (lockedHeight || camera.userData.h || h)) {
        if (!lockedHeight) lockedHeight = camera.userData.h || h;
        canvas.style.height = lockedHeight + 'px';
        return;
      }
      lockedHeight = 0;
      canvas.style.height = '';
      camera.userData.h = h;
      renderer.setPixelRatio(pixelRatio());
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      if (!flying) {
        updateGlobePosition();
        layoutListeners.forEach((fn) => { try { fn(); } catch (err) { console.warn('[globe layout]', err); } });
      }
    }

    function init() {
      if (initialized || !isThreeAvailable()) return;
      const canvas = document.getElementById('globe-canvas');
      if (!canvas) return;
      const THREE = window.THREE;
      tmpA = new THREE.Vector3(); tmpB = new THREE.Vector3();
      camDir = new THREE.Vector3(0.35, 0, 1).normalize();

      const w = window.innerWidth, h = window.innerHeight;
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(pixelRatio());
      renderer.setSize(w, h, false);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
      camera.position.set(0, 0, 3.4);
      camera.lookAt(0, 0, 0);
      camera.userData.h = h;

      // Свет «призмы»: холодный белый основной и два цветных контровых — фиолетовый и аква
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const key = new THREE.DirectionalLight(0xDCE4FF, 1.1);
      key.position.set(5, 3, 5);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xA77BFF, 0.7);
      rim.position.set(-5, -3, -3);
      scene.add(rim);
      const rim2 = new THREE.DirectionalLight(0x45D9E8, 0.45);
      rim2.position.set(4, -4, -2);
      scene.add(rim2);

      const fallbackMat = new THREE.MeshPhongMaterial({ color: 0x12131C, emissive: 0x2A2F6B, emissiveIntensity: 0.35, shininess: 8 });
      earth = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), fallbackMat);
      scene.add(earth);

      glow = new THREE.Mesh(
        new THREE.SphereGeometry(1.08, 48, 48),
        new THREE.MeshBasicMaterial({ color: 0x8C7CFF, transparent: true, opacity: 0.09, side: THREE.BackSide })
      );
      scene.add(glow);

      rimLight = rim; rimLight2 = rim2; keyLight = key;
      initialized = true;
      tint();
      updateGlobePosition();
      window.addEventListener('resize', onResize);

      // Шейдеры крестика и пунктира собираем заранее — иначе первый крестик появляется с рывком
      const warm = new THREE.Vector3(0, 0, 1);
      const warmSprite = addMarkerSprite(warm);
      const warmLine = buildDashedArc(warm, new THREE.Vector3(0, 1, 0));
      const compile = () => { try { renderer.compile(scene, camera); } catch {} };
      compile();
      disposeObj(warmSprite); disposeObj(warmLine);

      // Текстура Земли лежит в проекте (и в кеше офлайн). Глобус показываем, когда она готова,
      // чтобы не было «пустого» шара и рывка при подмене материала
      const done = () => {
        // два кадра: текстура загрузится в видеокарту до начала анимаций
        requestAnimationFrame(() => requestAnimationFrame(() => readyResolve()));
      };
      new THREE.TextureLoader().load(
        'img/earth-dark.jpg',
        (tex) => {
          if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
          earth.material = new THREE.MeshPhongMaterial({
            map: tex, color: 0xC2C8F2, emissive: 0x10122A, emissiveIntensity: 0.55, shininess: 6, specular: 0x343A70,
          });
          earthTex = tex;
          tintEarth();
          compile();
          if (!running) renderer.render(scene, camera);
          done();
        },
        undefined,
        done
      );
      setTimeout(() => readyResolve(), 3500);   // сеть зависла — показываем глобус без текстуры
    }

    function ready() {
      // three.js ещё грузится — ждём его, иначе карточка встанет до того, как появится глобус
      if (!isThreeAvailable()) return threeLoad ? threeLoad.then(() => (isThreeAvailable() ? ready() : undefined)) : Promise.resolve();
      if (!initialized) init();
      return readyPromise;
    }
    function layout() { return layoutInfo; }
    function onLayout(fn) { layoutListeners.push(fn); }

    /* В покое глобус только «дышит» (±1% за десяток секунд) — для этого хватает 20 кадров в секунду. Раньше он
       перерисовывался каждый кадр, и на телефоне основной поток был занят глобусом, пока человек вводит почту
       и пароль. Переходы между экранами и полёт — по-прежнему в полную частоту кадров */
    let lastDraw = 0;
    function tick(now) {
      if (!running) return;
      rafId = requestAnimationFrame(tick);
      if (!tweens.length && !flying && now - lastDraw < 48) return;
      lastDraw = now;

      for (let i = tweens.length - 1; i >= 0; i--) {
        const tw = tweens[i];
        if (tw.start === null) tw.start = now;
        const t = Math.min(1, Math.max(0, (now - tw.start) / tw.dur));
        tw.update(t);
        if (t >= 1) { tweens.splice(i, 1); tw.res(); }
      }

      if (earth && !flying) {
        // лёгкое «дыхание» глобуса
        const s = 1 + Math.sin(now * 0.0006) * 0.012;
        earth.scale.setScalar(s);
        if (glow) glow.scale.setScalar(s);
      }
      // Крестик, ушедший на обратную сторону, плавно гаснет, а не просвечивает у края глобуса
      if (earth && markers.length) {
        earth.updateMatrixWorld();
        for (const m of markers) {
          if (!m.sprite) continue;
          m.sprite.getWorldPosition(tmpA);
          tmpB.copy(tmpA).sub(earth.position).normalize();          // нормаль поверхности
          tmpA.subVectors(camera.position, tmpA).normalize();      // направление на камеру
          const vis = Math.min(1, Math.max(0, (tmpB.dot(tmpA) - 0.08) / 0.22));
          m.sprite.material.opacity = m.sprite.userData.alpha * vis;
        }
      }
      renderer.render(scene, camera);
    }

    function start() {
      if (!initialized) init();
      if (!renderer || running) return;
      running = true;
      rafId = requestAnimationFrame(tick);
    }

    function stop() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      // незавершённые анимации доводим до конца, чтобы никто не ждал их вечно
      while (tweens.length) { const tw = tweens.pop(); tw.update(1); tw.res(); }
    }

    document.addEventListener('visibilitychange', () => {
      const scr = document.getElementById('auth-screen');
      if (!scr) return;
      if (document.hidden) stop();
      else if (!scr.hidden && initialized) start();
    });

    return { init, start, stop, advance, back, resetToFirst, realign, markerScreenPos, flyIn, resetView, ready, layout, onLayout, tint };
  })();

  /* ═══════ АВТОРИЗАЦИЯ ═══════ */
  let currentUser = null;
  let profile = { name: 'Ваше имя', handle: '@username', bio: '', avatar: '' };

  /* Фото профиля: их может быть несколько (таблица profile_photos), свежее — главное.
     Уменьшенная копия главного фото хранится в profiles.avatar — её видно в чатах, списках и на карточках групп. */
  const PHOTO_MAX_SIDE = 1080, PHOTO_QUALITY = 0.82, PHOTOS_LIMIT = 10;
  let myPhotos = null;               // [{ id, url }], свежие первыми; null — ещё не загружали
  let profilePhotosMissing = false;  // таблицы нет (не выполнен supabase_profile_photos.sql) — одно фото, как раньше

  function isMissingTableError(error) {
    return !!error && (error.code === '42P01' || error.code === 'PGRST205');
  }

  let photoCropMissing = false;      // нет колонки crop (не выполнен supabase_photo_crop.sql) — фото без выбранной области

  function isMissingCropError(error) {
    return !!error && /crop/i.test(error.message || '') && (error.code === '42703' || error.code === 'PGRST204' || /column/i.test(error.message || ''));
  }

  async function loadProfilePhotos(userId) {
    if (profilePhotosMissing || !userId) return null;
    const query = (cols) => supabaseClient.from('profile_photos')
      .select(cols).eq('user_id', userId)
      .order('created_at', { ascending: false }).limit(PHOTOS_LIMIT);
    try {
      let { data, error } = await query(photoCropMissing ? 'id, data, created_at' : 'id, data, created_at, crop');
      if (error && isMissingCropError(error)) {
        photoCropMissing = true;
        ({ data, error } = await query('id, data, created_at'));
      }
      if (error) {
        if (isMissingTableError(error)) profilePhotosMissing = true;
        console.warn('[profile_photos] load:', error.message);
        return null;
      }
      return (data || []).map((r) => ({ id: r.id, url: r.data, at: r.created_at, crop: normCrop(r.crop) }));
    } catch (err) { console.warn('[profile_photos] exception:', err); return null; }
  }

  // Новое фото в галерею (с выбранной областью, если колонка crop есть)
  async function insertProfilePhoto(userId, data, crop) {
    const row = { user_id: userId, data };
    if (crop && !photoCropMissing) row.crop = crop;
    let { error } = await supabaseClient.from('profile_photos').insert(row);
    if (error && row.crop && isMissingCropError(error)) {
      photoCropMissing = true;
      delete row.crop;
      ({ error } = await supabaseClient.from('profile_photos').insert(row));
      if (!error) alert('Фото сохранено, но без выбранной области: выполните supabase_photo_crop.sql в Supabase.');
    }
    return { error };
  }

  /* ── Область фото ──
     Фото хранится целиком, а рядом — какая его часть видна в профиле: { x, y, z }.
     x, y (0…1) — точка фото, которая стоит в той же доле рамки (как object-position), z — приближение.
     Так рамка любой формы (квадрат в профиле, широкая полоса над аватаром) показывает выбранное место,
     а по нажатию фото раскрывается целиком. */
  function normCrop(c) {
    if (!c || typeof c !== 'object') return null;
    const x = Number(c.x), y = Number(c.y), z = Number(c.z);
    if (![x, y, z].every(Number.isFinite)) return null;
    return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)), z: Math.min(4, Math.max(1, z)) };
  }
  function cropStyle(crop) {
    const c = normCrop(crop);
    if (!c) return '';
    const p = `${(c.x * 100).toFixed(2)}% ${(c.y * 100).toFixed(2)}%`;
    return `object-position:${p};transform-origin:${p};transform:scale(${c.z.toFixed(3)})`;
  }

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('image decode error'));
      img.src = url;
    });
  }

  // Квадратная миниатюра выбранной области — для чатов и списков
  async function cropThumbDataUrl(url, crop, side = 256, quality = 0.85) {
    const img = await loadImage(url);
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const c = normCrop(crop) || { x: 0.5, y: 0.5, z: 1 };
    const F = Math.min(iw, ih) / c.z;
    const sx = c.x * (iw - F), sy = c.y * (ih - F);
    const out = Math.round(Math.min(side, F));
    const canvas = document.createElement('canvas'); canvas.width = canvas.height = out;
    canvas.getContext('2d').drawImage(img, sx, sy, F, F, 0, 0, out, out);
    return canvas.toDataURL('image/jpeg', quality);
  }

  /* Окно выбора области: фото двигается пальцем или мышью, приближается щипком, колесом или ползунком.
     Возвращает { x, y, z } или null, если человек отменил. */
  async function openPhotoCropper(url, { title = 'Область фото', done = 'Готово' } = {}) {
    let img;
    try { img = await loadImage(url); } catch { return { x: 0.5, y: 0.5, z: 1 }; }
    const iw = img.naturalWidth, ih = img.naturalHeight;
    return new Promise((resolve) => {
      const back = document.createElement('div');
      back.className = 'crop-backdrop';
      back.innerHTML = `
        <div class="crop-modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
          <div class="crop-title">${escapeHtml(title)}</div>
          <div class="crop-stage"><img src="${escapeHtml(url)}" alt="" draggable="false"><span class="crop-grid" aria-hidden="true"></span><span class="crop-ring" aria-hidden="true"></span></div>
          <div class="crop-hint">Перетащите фото и приблизьте его — так его увидят в профиле. Круг — как фото видно в чатах.</div>
          <div class="crop-zoom">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5M8 10.5h5"/></svg>
            <input type="range" class="flt-range" min="1" max="4" step="0.01" value="1" aria-label="Приближение">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5M10.5 8v5M8 10.5h5"/></svg>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn" data-crop-cancel>Отмена</button>
            <button type="button" class="btn btn-primary" data-crop-done>${escapeHtml(done)}</button>
          </div>
        </div>`;
      document.body.appendChild(back);
      const stage = back.querySelector('.crop-stage');
      const im = stage.querySelector('img');
      const range = back.querySelector('input[type="range"]');
      const c = { x: 0.5, y: 0.5, z: 1 };
      const paint = () => {
        im.style.cssText = cropStyle(c);
        range.value = c.z;
        range.style.setProperty('--p', ((c.z - 1) / 3 * 100).toFixed(1) + '%');
      };
      // приближение вокруг точки рамки (fx, fy — доли рамки): точка фото под ней остаётся на месте
      const zoomTo = (z, fx = 0.5, fy = 0.5) => {
        z = Math.min(4, Math.max(1, z));
        const F0 = Math.min(iw, ih);
        const at = (cz, p, f, n) => { const vis = F0 / cz; return (p * (n - vis) + f * vis) / n; };   // точка фото под долей рамки
        const ux = at(c.z, c.x, fx, iw), uy = at(c.z, c.y, fy, ih);
        const solve = (u, f, n) => { const vis = F0 / z; return n - vis > 0.5 ? Math.min(1, Math.max(0, (u * n - f * vis) / (n - vis))) : 0.5; };
        c.x = solve(ux, fx, iw); c.y = solve(uy, fy, ih); c.z = z;
        paint();
      };
      const pointers = new Map();
      let last = null;
      const onDown = (e) => {
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { stage.setPointerCapture(e.pointerId); } catch {}
        last = null;
      };
      const onMove = (e) => {
        if (!pointers.has(e.pointerId)) return;
        const prev = pointers.get(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const W = stage.clientWidth, s = W / Math.min(iw, ih);
        if (pointers.size === 1) {
          // перетаскивание: фото идёт за пальцем
          const ox = c.z * iw * s - W, oy = c.z * ih * s - W;
          if (ox > 0.5) c.x = Math.min(1, Math.max(0, c.x - (e.clientX - prev.x) / ox));
          if (oy > 0.5) c.y = Math.min(1, Math.max(0, c.y - (e.clientY - prev.y) / oy));
          paint();
        } else if (pointers.size === 2) {
          const [a, b] = [...pointers.values()];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          const r = stage.getBoundingClientRect();
          const fx = ((a.x + b.x) / 2 - r.left) / r.width, fy = ((a.y + b.y) / 2 - r.top) / r.height;
          if (last) zoomTo(c.z * dist / last, fx, fy);
          last = dist;
        }
      };
      const onUp = (e) => { pointers.delete(e.pointerId); last = null; };
      stage.addEventListener('pointerdown', onDown);
      stage.addEventListener('pointermove', onMove);
      stage.addEventListener('pointerup', onUp);
      stage.addEventListener('pointercancel', onUp);
      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        const r = stage.getBoundingClientRect();
        zoomTo(c.z * Math.exp(-e.deltaY * 0.0015), (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
      }, { passive: false });
      range.addEventListener('input', () => zoomTo(Number(range.value)));
      const finish = (v) => { document.removeEventListener('keydown', onKey, true); back.remove(); resolve(v); };
      const onKey = (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); finish(null); }
        else if (e.key === 'Enter') { e.preventDefault(); finish(normCrop(c)); }
      };
      document.addEventListener('keydown', onKey, true);
      back.querySelector('[data-crop-cancel]').addEventListener('click', () => finish(null));
      back.querySelector('[data-crop-done]').addEventListener('click', () => finish(normCrop(c)));
      paint();
    });
  }

  // Что показывать: фото из таблицы, а если их нет — единственное старое фото из profiles.avatar
  function photosOrAvatar(rows, avatar) {
    if (rows && rows.length) return rows;
    return avatar ? [{ id: null, url: avatar }] : [];
  }

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const USERNAME_RE_AUTH = /^[a-zA-Z][a-zA-Z0-9_.]{2,19}$/;

  function isEmail(v) { return EMAIL_RE.test(String(v).trim()); }
  function normalizeUsername(raw) { return String(raw).trim().replace(/^@+/, '').toLowerCase(); }
  function isValidUsername(raw) { return USERNAME_RE_AUTH.test(normalizeUsername(raw)); }

  function applyUserToProfileFromRow(row, fallbackEmail) {
    if (!row) {
      profile = { name: fallbackEmail ? fallbackEmail.split('@')[0] : 'Пользователь', handle: '@user', bio: '', avatar: '' };
      return;
    }
    profile = {
      name: row.name || (fallbackEmail ? fallbackEmail.split('@')[0] : 'Пользователь'),
      handle: '@' + (row.username || 'user'),
      bio: row.bio || '',
      avatar: row.avatar || '',
      gender: row.gender || '',
      age: row.age || null,
    };
  }

  /* Сохранить профиль. Если в таблице ещё нет колонок gender/age
     (не выполнен supabase_group_filters.sql) — сохраняем без них, чтобы не ломать регистрацию. */
  async function upsertProfileRow(row) {
    const res = await supabaseClient.from('profiles').upsert(row);
    if (res.error && /gender|age/i.test(res.error.message || '')) {
      console.warn('[profiles] нет колонок gender/age — выполните supabase_group_filters.sql');
      const { gender, age, ...rest } = row;
      return supabaseClient.from('profiles').upsert(rest);
    }
    return res;
  }

  async function loadProfileRow(userId) {
    if (!userId) return null;
    const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', userId).maybeSingle();
    if (error) { console.warn('[profiles] load:', error.message); return null; }
    return data;
  }

  async function isUsernameTakenRemote(uname) {
    const u = normalizeUsername(uname).toLowerCase();
    if (!u) return false;
    const { data, error } = await supabaseClient.from('profiles').select('id').eq('username', u).maybeSingle();
    if (error) { console.warn('[username check]', error.message); return false; }
    return !!data;
  }

  /* Сброс состояния сессии: вызывается и при ручном выходе, и по событию SIGNED_OUT.
     Повторный вызов безопасен. */
  function handleSignedOut() {
    if (!currentUser && !authScreen.hidden) return;
    stopPresence(false); presence.clear();
    currentUser = null;
    profile = { name: 'Ваше имя', handle: '@username', bio: '', avatar: '' };
    myPhotos = null;

    rtChannels.forEach((c) => { try { supabaseClient.removeChannel(c); } catch {} });
    rtChannels = [];
    groupMemberProfiles.clear();
    posts = []; wishes = []; groups = []; notifications = []; friends = [];
    leaveChat(); mediaUrlCache.clear(); chatMessages = []; supportMessages = []; chatsListShown = '';
    peerReads.clear(); myServerReads.clear(); chatReadsReady = false; peerDmReadsLoaded = false;
    chatPrefs.clear(); chatPrefsUid = null;
    chatLast.clear(); chatUnread.clear(); chatSummaryLoaded = false; chatSummarySeq++; clearTimeout(chatSummaryTimer); updateChatBadges();
    pendingIncomingRequests = new Set(); incomingFriendRequests = []; friendRequestOutcome.clear();
    peopleCache.clear();
    groupMatches = []; groupMatchOutcome.clear(); groupInvites = []; groupInviteOutcome.clear(); groupDetailsId = null; groupDetailsBack = null;
    unionDetails = null; syncMatchButton(); syncRequestBadges();
    groupStats = new Map();
    membersFullAt = 0;
    resetBots();
    feedReset();
    updateBadge();
    clearLocalCaches();
    // вход здесь больше не действует (вышли сами или сессию завершили) — push этого аккаунта сюда приходить не должны
    dropDevicePush();

    document.body.classList.add('auth-locked');
    authScreen.classList.remove('is-diving', 'is-leaving');
    authScreen.hidden = false;
    closeApp();
    Globe.resetView();
    showAuthScene();
    authBusy = false; authCardShown = false;
    renderAuthLogin();
  }

  /* Выход — только на этом устройстве (scope: 'local'). Без этого библиотека завершает сессии аккаунта на всех
     устройствах сразу: вышли на компьютере — и телефон через какое-то время выбрасывает на экран входа, а push
     на него при этом продолжают приходить */
  async function logout() {
    const uid = currentUser && currentUser.id;
    stopPresence(true);   // пока вход ещё действует — отмечаем, что ушли из сети
    // push-подписка этого устройства — пока она есть (это быстро: спрашиваем сам браузер, не сервер)
    let endpoint = pushEndpoint;
    if (!endpoint && pushSupported()) {
      try { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); endpoint = sub ? sub.endpoint : null; } catch {}
    }
    // Экран входа — сразу. Раньше выход ждал, пока сервер отвяжет push (до 2,5 с), и приложение «подвисало».
    // Теперь отвязка и сам выход из сессии идут в фоне: права у библиотеки остаются до signOut
    handleSignedOut();
    (async () => {
      if (endpoint) {
        await Promise.race([
          supabaseClient.from('push_subscriptions').delete().eq('endpoint', endpoint).then(({ error }) => { if (error) console.warn('[push] delete:', error.message); }),
          new Promise((r) => setTimeout(r, 5000)),
        ]).catch(() => {});
      }
      // за это время могли войти в другой аккаунт — тогда его сессию не трогаем
      const { data } = await supabaseClient.auth.getSession().catch(() => ({ data: null }));
      const s = data && data.session;
      if (!s || !s.user || s.user.id === uid) await supabaseClient.auth.signOut({ scope: 'local' }).catch(() => {});
    })();
  }

  /* ═══════ PUSH-УВЕДОМЛЕНИЯ ═══════
     Уведомления на само устройство — приходят, даже когда приложение закрыто. Сначала спрашиваем сами
     (карточка «Включить уведомления?»), и только по нажатию — системный запрос разрешения: браузеры
     показывают его лишь в ответ на действие человека. Дальше устройство подписывается на push,
     подписка сохраняется в Supabase (supabase_push.sql), а рассылает уведомления функция send-push.
     На iPhone и iPad push работает только в приложении, добавленном на экран «Домой». */
  const VAPID_PUBLIC_KEY = 'BCNjRh_ZQGsyESbFGUczG_OAYR1q_ZNSuHGMpjG-pBr0xQHbPm85lYHyNpFQGw1wC3SuwEPujuzgyPkT0J2K9zM';
  const PUSH_ASKED_KEY = 'push.asked.v1';
  const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  // Уведомления действительно включены на этом устройстве: настройка + разрешение браузера
  function pushOn() { return !!settings.notifications && pushSupported() && Notification.permission === 'granted'; }
  function pushUnsupportedHint() {
    return IS_IOS
      ? 'На iPhone и iPad уведомления работают только в приложении на экране «Домой».\n\nОткройте GroupIS в Safari, нажмите «Поделиться» → «На экран „Домой“» и включите уведомления уже там.'
      : 'Этот браузер не поддерживает push-уведомления.';
  }
  function vapidKeyBytes() {
    const b64 = VAPID_PUBLIC_KEY.replace(/-/g, '+').replace(/_/g, '/');
    return Uint8Array.from(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)), (c) => c.charCodeAt(0));
  }
  function pushRegistration() {
    return Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('service worker не запущен')), 8000))]);
  }

  // Разрешение уже есть: подписать устройство и сохранить подписку за текущим аккаунтом
  async function syncPushSubscription() {
    if (!currentUser || !pushSupported() || Notification.permission !== 'granted') return false;
    const reg = await pushRegistration();
    const opts = { userVisibleOnly: true, applicationServerKey: vapidKeyBytes() };
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      try { sub = await reg.pushManager.subscribe(opts); }
      catch (err) {
        // осталась подписка со старым ключом — пересоздаём
        const old = await reg.pushManager.getSubscription();
        if (!old) throw err;
        await old.unsubscribe();
        sub = await reg.pushManager.subscribe(opts);
      }
    }
    const j = sub.toJSON();
    pushEndpoint = j.endpoint;
    const { error } = await supabaseClient.rpc('save_push_subscription', {
      p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth,
    });
    if (error) throw error;
    pushSavedAt = Date.now();
    return true;
  }
  /* Подписка устройства привязана на сервере к сессии входа (supabase_push_sessions.sql): рассылка пропускает и стирает
     подписки устройств, где вход уже не действует. Чтобы подписка работающего устройства не устаревала, приложение
     обновляет её при запуске и потом раз в несколько часов, когда его открывают */
  let pushSavedAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !currentUser || !pushOn() || Date.now() - pushSavedAt < 6 * 3600 * 1000) return;
    syncPushSubscription().catch((err) => console.warn('[push] sync:', err));
  });

  // Включить по действию человека: системный запрос разрешения, затем подписка
  async function enablePush() {
    if (!pushSupported()) { alert(pushUnsupportedHint()); return false; }
    let perm = Notification.permission;
    if (perm === 'default') { try { perm = await Notification.requestPermission(); } catch { perm = Notification.permission; } }
    if (perm !== 'granted') {
      if (perm === 'denied') alert('Уведомления запрещены для этого сайта. Разрешите их в настройках браузера (значок слева от адреса) или в настройках телефона и включите снова.');
      return false;
    }
    try { return await syncPushSubscription(); }
    catch (err) {
      console.warn('[push] subscribe:', err);
      const msg = (err && err.message) || String(err);
      alert('Не удалось включить уведомления: ' + msg
        + (/save_push_subscription|schema cache|could not find/i.test(msg) ? '\n\nВыполните supabase_push.sql в Supabase.' : ''));
      return false;
    }
  }

  /* Вход на этом устройстве закончился (вышли, сессию завершили на сервере, её срок истёк), а подписка на push
     осталась: убираем её в самом браузере. Строку на сервере без входа не удалить, но рассылка (send-push) получит
     от браузера отказ (410) и сотрёт её сама — уведомления сюда больше не придут */
  async function dropDevicePush() {
    if (!pushSupported()) return;
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && await reg.pushManager.getSubscription();
      if (sub) await sub.unsubscribe();
    } catch (err) { console.warn('[push] drop:', err); }
    pushEndpoint = null; activeChatSent = null;
  }

  // Выключить на этом устройстве: подписка удаляется и с сервера, и из браузера
  async function disablePush() {
    if (!pushSupported()) return;
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    pushEndpoint = null; activeChatSent = null;
    if (!sub) return;
    if (currentUser) {
      const { error } = await supabaseClient.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
      if (error) console.warn('[push] delete:', error.message);
    }
    await sub.unsubscribe();
  }

  /* После входа: разрешение уже дано — тихо обновляем подписку; ещё не спрашивали — показываем карточку.
     «Не сейчас» запоминается: повторно не спрашиваем, включить можно в настройках. */
  function maybeAskPush() {
    if (!currentUser || !settings.notifications || !pushSupported()) return;
    if (Notification.permission === 'granted') { syncPushSubscription().catch((err) => console.warn('[push] sync:', err)); return; }
    if (Notification.permission === 'denied' || document.querySelector('.push-ask')) return;
    try { if (localStorage.getItem(PUSH_ASKED_KEY)) return; } catch {}
    const card = document.createElement('div');
    card.className = 'push-ask';
    card.setAttribute('role', 'dialog');
    card.setAttribute('aria-label', 'Включить уведомления');
    card.innerHTML = `
      <div>
        <h3 class="modal-title">Включить уведомления?</h3>
        <p class="modal-text">Сообщения, запросы в друзья, приглашения в группы и match будут приходить на это устройство, даже когда GroupIS закрыт.</p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" data-push-later>Не сейчас</button>
        <button type="button" class="btn btn-primary" data-push-allow>Включить</button>
      </div>`;
    const close = () => { try { localStorage.setItem(PUSH_ASKED_KEY, '1'); } catch {} card.remove(); };
    card.querySelector('[data-push-later]').addEventListener('click', close);
    card.querySelector('[data-push-allow]').addEventListener('click', async () => {
      close();
      await enablePush();
      syncSettingsUi();
    });
    document.body.appendChild(card);
  }

     Карточки по главным функциям: сверху — значок раздела, ниже — что это и зачем. Пока карточки открыты, остальной

    chats: '<svg viewBox="0 0 24 24"><path d="M7.5 17.06 4.2 18.6 4.42 13.39A7 7 0 1 1 7.5 17.06Z"/><circle class="ic-fill" cx="18" cy="17.8" r="2.4"/></svg>',
    wish: '<svg viewBox="0 0 24 24"><path d="M7 18.5h10a4 4 0 0 0 .6-7.96A5.5 5.5 0 0 0 7 9.5a4.5 4.5 0 0 0 0 9z"/><path class="ic-fill" d="M12 16c-1.5-1.1-2.4-2-2.4-3a1.25 1.25 0 0 1 2.4-.65 1.25 1.25 0 0 1 2.4.65c0 1-.9 1.9-2.4 3z"/></svg>',
    memories: '<svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="13.5" rx="3"/><path d="M8.5 6l1.5-2.5h4L15.5 6"/><circle class="ic-stroke" cx="12" cy="12.75" r="3.5"/></svg>',
  };
  const TOUR_STEPS = [
    { icon: 'feed', title: 'Лента — главный экран',
      text: 'Здесь одна за другой идут группы: фото, состав, средний возраст и чем они хотят заняться. Нажмите на карточку — откроется группа целиком.' },
    { icon: 'swipe', title: 'Смахивайте карточки',
      text: 'Вправо — группа понравилась, влево — дальше. То же — кнопками под карточкой. Посмотренные группы не повторяются сутки.' },
    { icon: 'filters', title: 'Фильтры',
      text: 'Кнопка с ползунками сверху: средний возраст и состав групп — в ленте останутся только подходящие.' },
    { icon: 'groups', title: 'Группы',
      text: 'Соберите компанию во вкладке «Группы» и пригласите друзей. Когда в группе двое и больше, она появляется в ленте у других.' },
    { icon: 'match', title: 'Match между группами',
      text: 'Лидер группы смахивает понравившуюся группу вправо — её лидер получает запрос на match. Согласились — открывается общий чат двух групп.' },
    { icon: 'join', title: 'Пока без группы?',
      text: 'Смахните группу вправо — её лидер получит заявку и сможет принять вас. А участник группы так показывает находку своим в чате группы.' },
    { icon: 'vote', title: 'Голосование о союзе',
      text: 'В общем чате лидер нажимает «сирены» и запускает голосование. Если большинство за — группы остаются только друг у друга.' },
    { icon: 'chats', title: 'Чаты',
      text: 'Пишите друзьям и группам, отправляйте голосовые и видеокружки — кнопки рядом с полем ввода.' },
    { icon: 'wish', title: 'Желания',
      text: 'Профиль → «Желания»: напишите, чем хотите заняться. Желание группы видно на её карточке в ленте 12 часов.' },
    { icon: 'memories', title: 'Воспоминания',
      text: 'Добавляйте фото с прогулок и отмечайте, с кем были, — они хранятся в профиле.' },
  ];
  function openTour() {
    return new Promise((resolve) => {
      document.querySelectorAll('.tour').forEach((el) => el.remove());
      let step = 0;
      const el = document.createElement('div');
      el.className = 'tour';
      el.setAttribute('role', 'dialog');
      el.setAttribute('aria-modal', 'true');
      el.setAttribute('aria-label', 'Как пользоваться GroupIS');
      const paint = (dir = 0) => {
        const s = TOUR_STEPS[step], last = step === TOUR_STEPS.length - 1;
        el.innerHTML = `
          <div class="tour-card">
            <div class="tour-art${dir ? (dir > 0 ? ' is-fwd' : ' is-back') : ''}" aria-hidden="true">${TOUR_ICON[s.icon] || ''}</div>
            <div class="tour-body">
              <div class="tour-title">${s.title}</div>
              <div class="tour-text">${s.text}</div>
            </div>
            <div class="tour-dots" aria-hidden="true">${TOUR_STEPS.map((_, i) => `<i class="${i === step ? 'is-on' : ''}"></i>`).join('')}</div>
            <div class="tour-acts">
              <button type="button" class="btn" data-tour-skip>${last ? 'Назад' : 'Пропустить'}</button>
              <button type="button" class="btn btn-primary" data-tour-next>${last ? 'Начать' : 'Далее'}</button>
            </div>
          </div>`;
      };
      const go = (to) => {
        if (to < 0 || to >= TOUR_STEPS.length || to === step) return;
        const dir = to > step ? 1 : -1;
        step = to;
        el.classList.add('is-stepped');   // карточка уже на месте — дальше меняется только её содержимое
        paint(dir);
      };
      const close = () => {
        document.removeEventListener('keydown', onKey, true);
        document.body.classList.remove('tour-open');
        el.classList.add('is-out');
        setTimeout(() => el.remove(), 220);
        resolve(true);
      };
      const onKey = (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); close(); }
        else if (e.key === 'ArrowRight') go(step + 1);
        else if (e.key === 'ArrowLeft') go(step - 1);
      };
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-tour-next]')) { if (step < TOUR_STEPS.length - 1) go(step + 1); else close(); return; }
        if (e.target.closest('[data-tour-skip]')) { if (step === TOUR_STEPS.length - 1) go(step - 1); else close(); return; }
        if (e.target === el) close();
      });
      // листать пальцем: влево — дальше, вправо — назад
      let sx = null, sy = 0;
      el.addEventListener('pointerdown', (e) => { if (e.target.closest('.tour-card') && !e.target.closest('button')) { sx = e.clientX; sy = e.clientY; } });
      el.addEventListener('pointerup', (e) => {
        if (sx === null) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        sx = null;
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) go(step + (dx < 0 ? 1 : -1));
      });
      el.addEventListener('pointercancel', () => { sx = null; });
      document.addEventListener('keydown', onKey, true);
      paint();
      document.body.appendChild(el);
      document.body.classList.add('tour-open');   // интерфейс за карточками уходит (окно, панели, кнопки сверху)
    });
  }
  // Знакомство ещё не показывали на этом устройстве — показать (ответ: показали ли)
  async function maybeShowTour() {
    if (!currentUser || !authScreen.hidden) return false;
    const key = TOUR_KEY + currentUser.id;
    try { if (localStorage.getItem(key)) return false; localStorage.setItem(key, '1'); } catch { return false; }
    // как раз идёт анимация match — знакомство откроется следом
    while (currentUser && document.querySelector('.match-fx')) await new Promise((r) => setTimeout(r, 400));
    await openTour();
    return true;
  }

  /* Какой чат сейчас открыт на экране: сервер (send-push) не шлёт push о сообщениях в него на это устройство.
     Отметка обновляется каждые 30 с; если приложение закрыли и она не снялась, на сервере она быстро устаревает. */
  let pushEndpoint = null, activeChatSent = null, activeChatAt = 0, activeChatTimer = 0;
  function reportActiveChat() {
    clearTimeout(activeChatTimer);
    activeChatTimer = setTimeout(sendActiveChat, 250);   // выход из чата и вход в другой — одним запросом
  }
  async function sendActiveChat() {
    if (!currentUser || !pushSupported() || Notification.permission !== 'granted') return;
    const value = chat && !document.hidden ? chatKey(chat) : '';
    if (value === activeChatSent && (!value || Date.now() - activeChatAt < 25000)) return;
    if (!pushEndpoint) {
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        const sub = reg && await reg.pushManager.getSubscription();
        pushEndpoint = sub ? sub.endpoint : null;
      } catch {}
      if (!pushEndpoint) return;
    }
    activeChatSent = value; activeChatAt = Date.now();
    const { error } = await supabaseClient.rpc('set_push_active_chat', { p_endpoint: pushEndpoint, p_chat: value });
    if (error) { console.warn('[push] active chat:', error.message); activeChatSent = null; }
  }
  setInterval(() => { if (chat && !document.hidden) sendActiveChat(); }, 30000);
  document.addEventListener('visibilitychange', reportActiveChat);

  /* Переход по нажатию на уведомление: chat (dm:<id>, group:<id>, match:<id>) — сразу в этот чат,
     «Назад» из него ведёт в список чатов; иначе — в раздел open */
  function openPushTarget(open, chatRef) {
    // голосование о союзе и ответ на match ведут в совместный чат: open = chat:match:<id> (не в списке непрочитанных)
    if (!chatRef && /^chat:/.test(open || '')) { chatRef = open.slice(5); open = 'messenger'; }
    const m = /^(dm|group|match):(.+)$/.exec(chatRef || '');
    if (m) {
      const [, type, id] = m;
      // адрес чата приходит из ссылки — пропускаем только настоящий id, а не произвольный текст
      const idOk = type === 'dm' ? /^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(id)
        : type === 'match' ? /^\d+$/.test(id) : /^[\w-]+$/.test(id);
      if (!idOk) { showApp('messenger'); return; }
      showApp('messenger');
      openChat(type === 'dm' ? { type, peerId: id } : type === 'group' ? { type, groupId: id } : { type, matchId: id });
      return;
    }
    if (open === 'settings') showSettingsScreen();
    else if (open === 'messenger' || (open && APPS[open])) showApp(open);
  }

  // Нажали на уведомление при открытом приложении — сервис-воркер просит показать нужный раздел или чат
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || !currentUser) return;
      if (d.type === 'push-in') return;   // пришёл push, а приложение открыто — всё и так придёт по realtime
      if (d.type !== 'push-open') return;
      openPushTarget(d.open, d.chat);
    });
  }

  const authScreen = document.getElementById('auth-screen');
  const authCard   = document.getElementById('auth-card');

  // Логотип живёт под глобусом, поэтому в карточках — только заголовок
  function authHeader({ title, sub = '' }) {
    return `
      <h1 class="auth-title">${escapeHtml(title)}</h1>
      <p class="auth-sub">${escapeHtml(sub)}</p>
    `;
  }
  function showAuthError(el, msg) { el.textContent = msg; el.hidden = false; }
  // Запрос не дошёл до сервера (нет сети или адрес Supabase недоступен у оператора) — это не «неверный пароль»
  const NO_SERVER_TEXT = 'Нет связи с сервером. Проверьте интернет; если он есть — сервер недоступен в этой сети, попробуйте Wi‑Fi или VPN.';
  function isNetworkError(error) {
    if (!error) return false;
    return error.name === 'AuthRetryableFetchError' || error.status === 0
      || /failed to fetch|networkerror|load failed|network request failed|fetch/i.test(error.message || '');
  }
  // Ширина карточки под содержимое: 'sm' — одно поле, 'md' — несколько полей
  function setAuthCardSize(size) { authCard.dataset.size = size; }

  /* ── Карточка появляется у крестика на глобусе и прячется обратно в него ── */
  let authBusy = false;        // идёт переход между экранами — новые нажатия игнорируем
  let authCardShown = false;
  let authCardSide = 'right';
  const AUTH_CARD_GAP = 26, AUTH_CARD_EDGE = 12;   // как CARD_GAP / CARD_EDGE в Globe
  const authMotion = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const nextFrames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

  function authCardSize() {
    authCard.style.maxHeight = '';
    return { w: authCard.offsetWidth, h: authCard.offsetHeight };
  }

  /* Поставить карточку у крестика с выбранной стороны. Точка роста (transform-origin) — в самом крестике:
     карточка «распускается» из него и в него же сворачивается. */
  function placeAuthCard(side) {
    const W = window.innerWidth, H = window.innerHeight, E = AUTH_CARD_EDGE, G = AUTH_CARD_GAP;
    authCard.style.maxHeight = '';
    let cw = authCard.offsetWidth, ch = authCard.offsetHeight;
    const pos = Globe.markerScreenPos();
    if (!pos) {   // без 3D — просто по центру
      authCard.style.left = Math.round((W - cw) / 2) + 'px';
      authCard.style.top = Math.round(Math.max(E, (H - ch) / 2)) + 'px';
      authCard.style.transformOrigin = '50% 50%';
      return;
    }
    const avail = side === 'above' ? pos.y - G - E : side === 'below' ? H - E - pos.y - G : H - 2 * E;
    if (ch > avail) {   // не влезает целиком — карточка прокручивается внутри
      authCard.style.maxHeight = Math.max(180, Math.floor(avail)) + 'px';
      ch = authCard.offsetHeight;
    }
    let left, top;
    if (side === 'right') { left = pos.x + G; top = pos.y - ch / 2; }
    else if (side === 'left') { left = pos.x - G - cw; top = pos.y - ch / 2; }
    else if (side === 'above') { left = pos.x - cw / 2; top = pos.y - G - ch; }
    else { left = pos.x - cw / 2; top = pos.y + G; }
    left = Math.round(Math.min(Math.max(left, E), W - E - cw));
    top = Math.round(Math.min(Math.max(top, E), H - E - ch));
    authCard.style.left = left + 'px';
    authCard.style.top = top + 'px';
    authCard.style.transformOrigin = `${(pos.x - left).toFixed(1)}px ${(pos.y - top).toFixed(1)}px`;
    authCard.dataset.side = side;
    authCardSide = side;
  }

  // Логотип под глобусом и центр фоновых колец — по раскладке глобуса
  function syncAuthLayout() {
    const L = Globe.layout();
    if (!L) return;
    const s = authScreen.style;
    s.setProperty('--gx', L.cx.toFixed(0) + 'px');
    s.setProperty('--gy', L.cy.toFixed(0) + 'px');
    s.setProperty('--logo-y', L.logoTop.toFixed(0) + 'px');
    s.setProperty('--logo-h', L.logoH + 'px');
  }
  let authRelayoutTimer = null;
  Globe.onLayout(() => {
    syncAuthLayout();
    clearTimeout(authRelayoutTimer);
    authRelayoutTimer = setTimeout(() => {
      if (authBusy || !authCardShown || authScreen.hidden) return;
      placeAuthCard(Globe.realign(authCardSize()) || authCardSide);
    }, 120);
  });

  function runAuthCardAnim(frames, opts) {
    return new Promise((resolve) => {
      const last = frames[frames.length - 1];
      let anim;
      try { anim = authCard.animate(frames, { fill: 'forwards', ...opts }); }
      catch { Object.assign(authCard.style, last); resolve(); return; }
      anim.onfinish = () => {
        Object.assign(authCard.style, last);
        anim.cancel();
        resolve();
      };
    });
  }

  // Только transform и opacity — их браузер анимирует на видеокарте, без перерисовки
  async function authCardOut() {
    if (!authCardShown) return;
    authCardShown = false;
    authCard.style.pointerEvents = 'none';
    if (authCard.contains(document.activeElement)) document.activeElement.blur();
    await runAuthCardAnim(
      [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.04)', opacity: 0 }],
      { duration: authMotion() ? 360 : 0, easing: 'cubic-bezier(.5, 0, .75, 0)' });
  }

  async function authCardIn() {
    await runAuthCardAnim(
      [{ transform: 'scale(.04)', opacity: 0 }, { opacity: 1, offset: 0.3 }, { transform: 'scale(1)', opacity: 1 }],
      { duration: authMotion() ? 560 : 0, easing: 'cubic-bezier(.2, .9, .25, 1.04)' });
    authCard.style.pointerEvents = '';
    authCardShown = true;
    // На компьютере сразу ставим курсор в поле; на телефоне не открываем клавиатуру сама по себе
    if (!matchMedia('(pointer: coarse)').matches) {
      const f = authCard.querySelector('input:not([type="range"]):not([type="file"]):not([type="hidden"]), textarea');
      if (f) f.focus({ preventScroll: true });
    }
  }

  /* Переход между экранами входа: карточка сворачивается в крестик → новое содержимое (пока невидимо)
     меряем → глобус делает шаг и сам выбирает, с какой стороны крестика карточке встать → карточка
     распускается из нового крестика. globeStep(size) возвращает сторону. */
  async function authTransition(globeStep, paint) {
    if (authBusy) return;
    authBusy = true;
    try {
      await authCardOut();
      paint();
      // первый показ: ждём текстуру глобуса и шрифт, чтобы размер карточки был точным, а анимация — ровной
      await Promise.race([Promise.all([Globe.ready(), document.fonts ? document.fonts.ready : null]), new Promise((r) => setTimeout(r, 3000))]);
      const size = authCardSize();
      const side = (globeStep ? await globeStep(size) : Globe.realign(size)) || authCardSide;
      placeAuthCard(side);
      await authCardIn();
    } catch (err) {
      console.warn('[auth transition]', err);
      if (!authCard.innerHTML) paint();
      placeAuthCard(authCardSide);
      Object.assign(authCard.style, { opacity: '1', transform: 'none', pointerEvents: '' });
      authCardShown = true;
    } finally {
      authBusy = false;
    }
  }

  /* Вход выполнен: карточка сворачивается в крестик, камера летит в него, у самой земли экран
     заволакивает светлыми «облаками» — под ними собирается лента — и проявляется приложение.
     beforeReveal — работа, которую делаем, пока экран закрыт (до 0.7 с: дальше лента откроется и догрузится
     на месте). Весь вход — около 2.5 с; раньше было почти 6 */
  async function playAuthExit(beforeReveal) {
    if (authScreen.hidden) { if (beforeReveal) await beforeReveal(); return; }
    authBusy = true;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const motion = authMotion();
    try {
      await authCardOut();
      authScreen.classList.add('is-flying');      // логотип гаснет
      if (motion) {
        let clouded = false;
        await Globe.flyIn(1600, (t) => {
          if (!clouded && t > 0.6) { clouded = true; authScreen.classList.add('is-diving'); }
        });
        authScreen.classList.add('is-diving');
        await wait(120);                           // «облака» сомкнулись полностью
      } else authScreen.classList.add('is-diving');
      Globe.stop();                                // глобус закрыт — освобождаем видеокарту
      if (beforeReveal) await Promise.race([Promise.resolve().then(beforeReveal).catch((err) => console.warn('[enter app]', err)), wait(700)]);
      // данные не успели — лента всё равно открывается (с тем, что уже есть) и обновится на месте
      document.body.classList.remove('auth-locked');
      // панель вкладок и кнопку Match мерили, пока они были скрыты, — перемеряем
      setDots(); fitMatchButton();
      renderFeed();
      await nextFrames();
      playChromeEnter();                           // капсулы интерфейса съезжаются к краям, пока экран входа тает
      authScreen.classList.add('is-leaving');
      await wait(motion ? 520 : 0);
    } catch (err) {
      console.warn('[auth exit]', err);
    } finally {
      authScreen.hidden = true;
      authScreen.classList.remove('is-diving', 'is-leaving', 'is-flying');
      Globe.stop();
      Globe.resetView();
      authCard.innerHTML = '';
      Object.assign(authCard.style, { opacity: '', transform: '', pointerEvents: '', maxHeight: '' });
      authCardShown = false;
      authBusy = false;
    }
  }

  // Вход — первый крестик на глобусе; сюда же возвращаемся из регистрации и восстановления
  function renderAuthLogin() { return authTransition((size) => Globe.resetToFirst(size), paintAuthLogin); }

  function paintAuthLogin() {
    setAuthCardSize('md');
    authCard.innerHTML = `
      ${authHeader({ title: 'Добро пожаловать', sub: 'Войдите, чтобы продолжить' })}
      <form class="auth-form" id="auth-login-form" novalidate>
        <label class="auth-field">
          <span class="auth-label">Почта или @username</span>
          <input class="auth-input" type="text" id="login-ident" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="you@example.com или @username">
        </label>
        <label class="auth-field">
          <span class="auth-label">Пароль</span>
          <input class="auth-input" type="password" id="login-pwd" autocomplete="current-password" placeholder="Ваш пароль">
        </label>
        <div id="login-error" class="auth-error" hidden></div>
        <button class="auth-btn" type="submit" id="login-submit">Войти</button>
        <div class="auth-links">
          <button class="auth-link" type="button" id="go-register">Создать аккаунт</button>
          <button class="auth-link" type="button" id="go-forgot">Забыли пароль?</button>
        </div>
      </form>
    `;

    const form = authCard.querySelector('#auth-login-form');
    const ident = authCard.querySelector('#login-ident');
    const pwd = authCard.querySelector('#login-pwd');
    const err = authCard.querySelector('#login-error');
    const submit = authCard.querySelector('#login-submit');

    authCard.querySelector('#go-register').addEventListener('click', renderAuthRegister);
    authCard.querySelector('#go-forgot').addEventListener('click', renderAuthForgot);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submit.disabled) return;   // уже входим — повторное нажатие не шлёт второй запрос
      err.hidden = true;
      const idVal = ident.value.trim();
      const pw = pwd.value;
      if (!idVal) { showAuthError(err, 'Введите почту или username'); return; }
      if (!pw) { showAuthError(err, 'Введите пароль'); return; }

      // Сразу видно, что вход идёт: раньше кнопка молчала, пока сервер искал username и проверял пароль
      const label = submit.textContent;
      submit.disabled = true;
      submit.textContent = 'Входим…';
      const fail = (text) => { submit.disabled = false; submit.textContent = label; showAuthError(err, text); };

      let email = idVal;
      if (!isEmail(idVal)) {
        const uname = normalizeUsername(idVal);
        const { data: foundEmail, error: rpcErr } = await supabaseClient.rpc('get_email_by_username', { uname });
        if (rpcErr || !foundEmail) {
          console.error('[rpc get_email_by_username]', rpcErr);
          fail(isNetworkError(rpcErr) ? NO_SERVER_TEXT : 'Пользователь с таким username не найден.');
          return;
        }
        email = foundEmail;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pw });
      if (error) {
        console.error('[signIn]', error);
        fail(isNetworkError(error) ? NO_SERVER_TEXT : 'Неверная почта/username или пароль.');
        return;
      }

      currentUser = data.user;
      // Профиль догружается, пока камера летит к Земле, — раньше полёт ждал его ответа
      const uid = currentUser.id, mail = currentUser.email;
      applyUserToProfileFromRow(null, mail);
      const profileReady = loadProfileRow(uid).then((row) => {
        if (!currentUser || currentUser.id !== uid) return;
        applyUserToProfileFromRow(row, mail);
        if (row) KV.set('profile:' + uid, row);   // следующий запуск откроет профиль из кеша
      }, () => {});
      await enterAppAfterLogin(profileReady);
    });
  }

  // Восстановление пароля — следующий крестик от входа
  function renderAuthForgot() { return authTransition((size) => Globe.advance(size), paintAuthForgot); }

  function paintAuthForgot() {
    setAuthCardSize('sm');
    authCard.innerHTML = `
      ${authHeader({ title: 'Восстановление', sub: 'Введите почту от аккаунта' })}
      <form class="auth-form" id="auth-forgot-form" novalidate>
        <label class="auth-field">
          <span class="auth-label">Почта</span>
          <input class="auth-input" type="email" id="forgot-email" placeholder="you@example.com">
        </label>
        <div id="forgot-error" class="auth-error" hidden></div>
        <div id="forgot-ok" class="auth-error" hidden style="background:rgba(74,208,122,.14);color:#4AD07A"></div>
        <button class="auth-btn" type="submit">Отправить письмо</button>
        <div class="auth-links">
          <button class="auth-link" type="button" id="back-login">← Назад ко входу</button>
        </div>
      </form>
    `;
    const form = authCard.querySelector('#auth-forgot-form');
    const email = authCard.querySelector('#forgot-email');
    const err = authCard.querySelector('#forgot-error');
    const ok = authCard.querySelector('#forgot-ok');
    authCard.querySelector('#back-login').addEventListener('click', renderAuthLogin);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true; ok.hidden = true;
      const v = email.value.trim();
      if (!isEmail(v)) { showAuthError(err, 'Введите корректную почту'); return; }
      const { error } = await supabaseClient.auth.resetPasswordForEmail(v, {
        redirectTo: window.location.origin + window.location.pathname,
      });
      if (error) { console.error('[resetPassword]', error); showAuthError(err, error.message); return; }
      ok.textContent = 'Если аккаунт существует, письмо отправлено.';
      ok.hidden = false;
    });
  }

  const REG_STEPS = ['name', 'username', 'gender', 'password', 'age', 'photo', 'bio'];

  function renderAuthRegister() {
    const draft = { name: '', username: '', gender: '', password: '', age: 18, avatar: '', photo: '', bio: '', email: '' };
    let stepIdx = 0;

    // Каждый шаг регистрации — новый крестик: вперёд пунктир к следующему, назад — возврат к прошлому
    const go = (delta) => authTransition(
      (size) => (delta > 0 ? Globe.advance(size) : Globe.back(size)),
      () => { stepIdx += delta; renderStep(); });
    // Карточка по размеру шага: одно поле — узкая, пароль и «о себе» — шире
    const STEP_SIZE = { name: 'sm', username: 'sm', gender: 'sm', password: 'md', age: 'sm', photo: 'sm', bio: 'md' };

    function renderStep() {
      const step = REG_STEPS[stepIdx];

      const dots = REG_STEPS.map((_, i) => {
        const cls = i === stepIdx ? 'active' : (i < stepIdx ? 'done' : '');
        return `<span class="auth-step-dot ${cls}"></span>`;
      }).join('');
      const stepInfo = {
        name:     { t: 'Как вас зовут?', s: 'Это имя увидят другие пользователи' },
        username: { t: 'Придумайте username', s: 'Латиница, цифры, «_» и «.», от 3 до 20 символов' },
        gender:   { t: 'Ваш пол', s: 'Поможет точнее подбирать компанию' },
        password: { t: 'Придумайте пароль', s: 'Минимум 6 символов' },
        age:      { t: 'Сколько вам лет?', s: 'Возраст можно будет изменить позже' },
        photo:    { t: 'Добавьте фото', s: 'Необязательно' },
        bio:      { t: 'Расскажите о себе', s: 'Пара слов — и профиль готов' },
      }[step];

      setAuthCardSize(STEP_SIZE[step] || 'md');
      authCard.innerHTML = `
        <div class="auth-eyebrow">Регистрация · ${stepIdx + 1} из ${REG_STEPS.length}</div>
        <div class="auth-steps">${dots}</div>
        <h2 class="auth-step-title">${escapeHtml(stepInfo.t)}</h2>
        <p class="auth-step-sub">${escapeHtml(stepInfo.s)}</p>
        <form class="auth-form" id="reg-form" novalidate>
          <div id="reg-step-body"></div>
          <div id="reg-error" class="auth-error" hidden></div>
          <div class="auth-links" style="justify-content:space-between">
            <button class="auth-link" type="button" id="reg-back">← Назад</button>
            <button class="auth-btn" type="submit" style="width:auto;min-width:140px" id="reg-next">
              ${step === 'bio' ? 'Завершить' : 'Далее'}
            </button>
          </div>
        </form>
      `;

      authCard.querySelector('#reg-back').addEventListener('click', () => {
        if (stepIdx === 0) { renderAuthLogin(); return; }
        go(-1);
      });

      const body = authCard.querySelector('#reg-step-body');
      const err = authCard.querySelector('#reg-error');
      const form = authCard.querySelector('#reg-form');

      if (step === 'name') {
        body.innerHTML = `<label class="auth-field"><span class="auth-label">Имя</span><input class="auth-input" type="text" id="reg-name" maxlength="60" value="${escapeHtml(draft.name)}" placeholder="Например, Алексей"></label>`;
      } else if (step === 'username') {
        body.innerHTML = `
          <label class="auth-field">
            <span class="auth-label">Username</span>
            <div class="username-wrap"><span class="username-prefix" aria-hidden="true">@</span>
              <input class="edit-input username-input" type="text" id="reg-username" maxlength="20" autocapitalize="off" autocorrect="off" spellcheck="false" value="${escapeHtml(draft.username)}" placeholder="username">
            </div>
            <span class="username-status" id="uname-status"></span>
          </label>`;
        const unameEl = authCard.querySelector('#reg-username');
        const status = authCard.querySelector('#uname-status');
        let checkTimer = null;
        const runCheck = () => {
          const v = normalizeUsername(unameEl.value);
          unameEl.value = v;
          if (!v) { status.textContent = ''; status.className = 'username-status'; return; }
          if (!isValidUsername(v)) { status.textContent = 'Неверный формат'; status.className = 'username-status busy'; return; }
          status.innerHTML = `<span class="spinner"></span> Проверяем…`;
          status.className = 'username-status checking';
          clearTimeout(checkTimer);
          checkTimer = setTimeout(async () => {
            if (await isUsernameTakenRemote(v)) { status.textContent = 'Этот username уже занят'; status.className = 'username-status busy'; }
            else { status.textContent = 'Свободно ✓'; status.className = 'username-status ok'; }
          }, 350);
        };
        unameEl.addEventListener('input', runCheck);
      } else if (step === 'gender') {
        body.innerHTML = `
          <div class="gender-row" id="gender-row">
            <button class="gender-opt" type="button" data-gender="male" aria-pressed="${draft.gender === 'male'}"><span class="gender-emoji">👨</span><span class="gender-label">Мужской</span></button>
            <button class="gender-opt" type="button" data-gender="female" aria-pressed="${draft.gender === 'female'}"><span class="gender-emoji">👩</span><span class="gender-label">Женский</span></button>
          </div>`;
        authCard.querySelectorAll('.gender-opt').forEach((b) => {
          b.addEventListener('click', () => {
            draft.gender = b.dataset.gender;
            authCard.querySelectorAll('.gender-opt').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.gender === draft.gender)));
          });
        });
      } else if (step === 'password') {
        body.innerHTML = `
          <label class="auth-field"><span class="auth-label">Пароль</span><input class="auth-input" type="password" id="reg-pwd" autocomplete="new-password" placeholder="Минимум 6 символов"></label>
          <label class="auth-field"><span class="auth-label">Повторите пароль</span><input class="auth-input" type="password" id="reg-pwd2" autocomplete="new-password" placeholder="Ещё раз"></label>`;
      } else if (step === 'age') {
        body.innerHTML = `<div class="auth-age-row"><input type="range" id="reg-age" min="18" max="100" value="${draft.age}"><span class="auth-age-value" id="reg-age-value">${draft.age}</span></div>`;
        const r = authCard.querySelector('#reg-age');
        const v = authCard.querySelector('#reg-age-value');
        r.addEventListener('input', () => { v.textContent = r.value; draft.age = Number(r.value); });
      } else if (step === 'photo') {
        body.innerHTML = `
          <div class="auth-avatar-row">
            <div class="auth-avatar-preview" id="reg-avatar">${draft.avatar ? '' : escapeHtml(firstChar(draft.name || '?').toUpperCase() || '?')}</div>
            <div class="auth-avatar-side">
              <button type="button" class="btn" id="reg-avatar-pick">Выбрать фото</button>
              <button type="button" class="btn-ghost" id="reg-avatar-remove" ${draft.avatar ? '' : 'hidden'}>Удалить</button>
              <input type="file" id="reg-avatar-input" accept="image/*" hidden>
            </div>
          </div>`;
        const prev = authCard.querySelector('#reg-avatar');
        const inp = authCard.querySelector('#reg-avatar-input');
        const rm = authCard.querySelector('#reg-avatar-remove');
        if (draft.avatar) { prev.style.backgroundImage = `url('${draft.avatar}')`; prev.textContent = ''; }
        authCard.querySelector('#reg-avatar-pick').addEventListener('click', () => inp.click());
        inp.addEventListener('change', async () => {
          const file = inp.files && inp.files[0];
          inp.value = '';
          if (!file || !file.type.startsWith('image/')) return;
          // крупная копия — первое фото в галерее профиля, маленькая (draft.avatar) — выбранная область, для чатов и списков
          try {
            const photo = await fileToCompressedDataURL(file, PHOTO_MAX_SIDE, PHOTO_QUALITY);
            const crop = await openPhotoCropper(photo);
            if (!crop) return;
            draft.photo = photo; draft.crop = crop;
            draft.avatar = await cropThumbDataUrl(photo, crop);
            prev.style.backgroundImage = `url('${draft.avatar}')`;
            prev.textContent = '';
            rm.hidden = false;
          } catch (err) { console.warn('[reg photo]', err); }
        });
        rm.addEventListener('click', () => {
          draft.avatar = ''; draft.photo = ''; draft.crop = null;
          prev.style.backgroundImage = '';
          prev.textContent = firstChar(draft.name || '?').toUpperCase() || '?';
          rm.hidden = true;
        });
      } else if (step === 'bio') {
        body.innerHTML = `
          <label class="auth-field"><span class="auth-label">О себе</span><textarea class="edit-textarea" id="reg-bio" maxlength="300">${escapeHtml(draft.bio)}</textarea></label>
          <div class="auth-divider">Контакт для входа</div>
          <label class="auth-field"><span class="auth-label">Почта</span><input class="auth-input" type="email" id="reg-email" value="${escapeHtml(draft.email)}" placeholder="you@example.com"></label>`;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.hidden = true;

        if (step === 'name') {
          const v = authCard.querySelector('#reg-name').value.trim();
          if (v.length < 2) { showAuthError(err, 'Введите имя'); return; }
          draft.name = v; go(1); return;
        }
        if (step === 'username') {
          const v = normalizeUsername(authCard.querySelector('#reg-username').value);
          if (!isValidUsername(v)) { showAuthError(err, 'Username: латиница, цифры, «_» и «.», от 3 до 20 символов'); return; }
          if (await isUsernameTakenRemote(v)) { showAuthError(err, 'Этот username уже занят'); return; }
          draft.username = v; go(1); return;
        }
        if (step === 'gender') {
          if (!draft.gender) { showAuthError(err, 'Выберите пол'); return; }
          go(1); return;
        }
        if (step === 'password') {
          const p1 = authCard.querySelector('#reg-pwd').value;
          const p2 = authCard.querySelector('#reg-pwd2').value;
          if (p1.length < 6) { showAuthError(err, 'Пароль минимум 6 символов'); return; }
          if (p1 !== p2) { showAuthError(err, 'Пароли не совпадают'); return; }
          draft.password = p1; go(1); return;
        }
        if (step === 'age') { draft.age = Number(authCard.querySelector('#reg-age').value) || 18; go(1); return; }
        if (step === 'photo') { go(1); return; }

        const emailVal = authCard.querySelector('#reg-email').value.trim();
        if (!isEmail(emailVal)) { showAuthError(err, 'Введите корректную почту'); return; }
        draft.email = emailVal.toLowerCase();

        const submitBtn = authCard.querySelector('#reg-form [type="submit"]');
        submitBtn.disabled = true;
        const oldLabel = submitBtn.textContent;
        submitBtn.textContent = 'Создаём…';

        const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
          email: draft.email,
          password: draft.password,
          options: {
            data: { name: draft.name, username: draft.username },
            emailRedirectTo: window.location.origin + window.location.pathname,
          },
        });

        if (signUpError) {
          console.error('[signUp]', signUpError);
          submitBtn.disabled = false; submitBtn.textContent = oldLabel;
          showAuthError(err, signUpError.message || 'Не удалось создать аккаунт');
          return;
        }

        const uid = signUpData.user && signUpData.user.id;
        if (uid) {
          const { error: profErr } = await upsertProfileRow({
            id: uid, name: draft.name, username: draft.username,
            bio: authCard.querySelector('#reg-bio') ? authCard.querySelector('#reg-bio').value.trim() : '',
            avatar: draft.avatar || '',
            gender: draft.gender || null, age: draft.age || null,
          });
          if (profErr) {
            console.error('[profiles] upsert error:', profErr);
            submitBtn.disabled = false; submitBtn.textContent = oldLabel;
            showAuthError(err, 'Профиль не сохранён: ' + profErr.message);
            return;
          }
        }

        if (!signUpData.session) {
          submitBtn.disabled = false; submitBtn.textContent = oldLabel;
          authTransition(null, () => {
          setAuthCardSize('sm');
          authCard.innerHTML = `
            ${authHeader({ title: 'Проверьте почту', sub: 'Мы отправили письмо для подтверждения аккаунта' })}
