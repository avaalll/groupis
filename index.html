            <div class="auth-links" style="justify-content:center"><button class="auth-link" type="button" id="back-login-2">← Ко входу</button></div>`;
          authCard.querySelector('#back-login-2').addEventListener('click', renderAuthLogin);
          });
          return;
        }

        currentUser = signUpData.user;
        if (draft.photo && draft.avatar) {
          const { error: phErr } = await insertProfilePhoto(currentUser.id, draft.photo, draft.crop);
          if (phErr) console.warn('[profile_photos] first photo:', phErr.message);
        }
        applyUserToProfileFromRow({
          name: draft.name, username: draft.username,
          bio: authCard.querySelector('#reg-bio') ? authCard.querySelector('#reg-bio').value.trim() : '',
          avatar: draft.avatar || '',
          gender: draft.gender, age: draft.age,
        }, draft.email);
        await enterAppAfterLogin();
      });
    }
    // Из входа — пунктир к первому шагу регистрации
    return authTransition((size) => Globe.advance(size), renderStep);
  }

  async function enterAppAfterLogin(profileReady = null) {
    const returning = authScreen.hidden;   // открыли приложение с уже сохранённым входом
    // После входа с паролем лента под экраном входа остаётся скрытой до «облаков»: пока камера летит,
    // браузер не рисует её впустую под непрозрачным экраном
    if (returning) document.body.classList.remove('auth-locked');
    startPresence();   // «в сети» для друзей и участников групп
    if (openApp === null) showFeedApp();   // главная вкладка — «Лента»: капсула панели встаёт на место
    // Данные с прошлого запуска — сразу в память: экраны открываются мгновенно, а сервер потом обновит их на месте.
    // После входа с паролем полёт начинается сразу, кеш читается параллельно с ним
    const hydrated = hydrateStateFromCache();
    if (returning) {
      await hydrated;
      renderFeed();
      openAppFromShortcut();   // открыли по нажатию на уведомление — нужный чат показываем сразу
    }
    // Данные грузятся по сети, пока камера летит к Земле. После кеша: воспоминания, которые уже лежат
    // на устройстве, заново не скачиваются
    const loading = hydrated.then(() => Promise.all([
      loadHiddenMessages(),
      loadPostsFromDB(),
      loadWishesFromDB(),
      loadGroupsFromDB(),
      loadNotificationsFromDB(),
      loadFriendsFromDB(),
      loadGroupStats(),
    ]));
    // А ленту собираем, когда экран закрыт «облаками»: на открывшемся экране всё уже на месте, без рывков
    await playAuthExit(async () => {
      await Promise.all([loading, profileReady]);
      document.body.classList.remove('auth-locked');
      setDots(); fitMatchButton();
      updateFilterDot();
      subscribeRealtime();
      updateBadge();
      await loadGroupMemberProfiles();   // имена и фото лидеров на карточках ленты
      renderFeed();
      // экран, открытый по данным из кеша, обновляем свежими — на месте, без анимации
      refreshGroupsList(); refreshFriendsList(); refreshNotifications();
      // последние сообщения и непрочитанное — сразу: счётчик на вкладке «Чаты» виден, даже если её не открывали
      loadChatSummaries().then((ok) => { if (ok) paintChatsList(); preheatChats(); });
    });
    if (!returning) openAppFromShortcut();
    setTimeout(prefetchChats, 8000);   // когда интерфейс уже на месте и первые данные загрузились
    setTimeout(ensureChatWall, 5000);  // узор обоев чатов — заранее, чтобы первое открытие чата его не рисовало
    // знакомство с приложением (один раз на устройстве), а уже после него — вопрос про уведомления
    setTimeout(async () => { const shown = await maybeShowTour(); setTimeout(maybeAskPush, shown ? 800 : 2200); }, 1800);
  }

  /* Ярлыки из manifest.webmanifest: ./?open=messenger|profile|settings;
     запуск по нажатию на уведомление: ./?open=messenger&chat=dm:<id> */
  function openAppFromShortcut() {
    const params = new URLSearchParams(location.search);
    const target = params.get('open');
    const chatRef = params.get('chat');
    if (!target && !chatRef) { restoreScreenState(); return; }
    params.delete('open'); params.delete('chat');
    const qs = params.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
    openPushTarget(target, chatRef);
  }
  // Экран, открытый перед тем, как вкладку выгрузили или обновили (см. saveScreenState)
  function restoreScreenState() {
    let s = null;
    try { s = JSON.parse(sessionStorage.getItem('groupis.screen') || 'null'); sessionStorage.removeItem('groupis.screen'); } catch {}
    if (!s || !currentUser || s.uid !== String(currentUser.id) || !(Date.now() - s.at < 30 * 60 * 1000)) return;
    if (!s.chat && !['messenger', 'groups', 'friends', 'profile', 'notifications', 'settings'].includes(s.open)) return;
    openPushTarget(s.open, s.chat);
  }

  /* ═══════ КЕШ НА УСТРОЙСТВЕ ═══════
     Чтобы экраны открывались сразу, а не после ответа сервера, на устройстве хранятся:
     — снимок данных приложения (группы, друзья, желания, воспоминания, уведомления);
     — переписки по чатам и профили людей;
     — фото, голосовые и кружки из чатов (в Cache Storage — подписанные ссылки каждый раз новые,
       поэтому обычный кеш браузера их не запоминает).
     Сервер остаётся главным: после показа из кеша данные перечитываются и экран обновляется на месте.
     При выходе из аккаунта кеш стирается. */
  const KV = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      try {
        const rq = indexedDB.open('groupis-cache', 2);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          for (const name of ['kv', 'media']) if (!db.objectStoreNames.contains(name)) db.createObjectStore(name);
        };
        rq.onsuccess = () => {
          const db = rq.result;
          db.onversionchange = () => { db.close(); dbp = null; };
          res(db);
        };
        rq.onerror = () => rej(rq.error);
      } catch (err) { rej(err); }
    }));
    const run = (stores, mode, fn) => open().then((db) => new Promise((res, rej) => {
      const tx = db.transaction(stores, mode);
      const rq = fn(tx);
      tx.oncomplete = () => res(rq && rq.result);
      tx.onerror = tx.onabort = () => rej(tx.error);
    })).catch((err) => { console.warn('[cache]', err); return undefined; });
    return {
      get: (k) => run('kv', 'readonly', (tx) => tx.objectStore('kv').get(k)),
      set: (k, v) => run('kv', 'readwrite', (tx) => tx.objectStore('kv').put(v, k)),
      clear: () => run(['kv', 'media'], 'readwrite', (tx) => { tx.objectStore('kv').clear(); tx.objectStore('media').clear(); }),
      mediaGet: (k) => run('media', 'readonly', (tx) => tx.objectStore('media').get(k)),
      mediaSet: (k, v) => run('media', 'readwrite', (tx) => tx.objectStore('media').put(v, k)),
      // оставить не больше max файлов — самые старые удаляются
      mediaPrune: (max) => run('media', 'readwrite', (tx) => {
        const store = tx.objectStore('media'), all = [];
        store.openCursor().onsuccess = (e) => {
          const cur = e.target.result;
          if (cur) { all.push([cur.key, (cur.value && cur.value.at) || 0]); cur.continue(); return; }
          if (all.length <= max) return;
          all.sort((a, b) => a[1] - b[1]).slice(0, all.length - max).forEach(([k]) => store.delete(k));
        };
      }),
    };
  })();

  /* Снимок пишется, когда браузер свободен (не посреди анимации или смахивания): запись в IndexedDB копирует
     данные в основном потоке. Воспоминания и свои фото (фото прямо в записях — мегабайты) меняются редко —
     их пишем отдельно и только когда они изменились; раньше они копировались при каждом обновлении групп */
  const whenIdle = (fn) => (window.requestIdleCallback ? requestIdleCallback(fn, { timeout: 4000 }) : setTimeout(fn, 200));
  const postsSig = (list) => (list || []).map((p) => p.id + ':' + (p.images || []).length + ':' + (p.caption || '').length).join(',');
  const photosSig = (list) => (Array.isArray(list) ? list.map((p) => p.id || (p.url || '').length).join(',') : 'none');
  let stateSaveTimer = null, savedPostsSig = null, savedPhotosSig = null;
  function scheduleStateSave() {
    if (!currentUser) return;
    const uid = currentUser.id;
    clearTimeout(stateSaveTimer);
    stateSaveTimer = setTimeout(() => whenIdle(() => {
      if (!currentUser || currentUser.id !== uid) return;
      // группы-боты и всё, что с ними связано, на устройстве не храним — они добавляются при каждом запуске
      KV.set('state:' + uid, {
        wishes, friends, notifications, groupInvites,
        groups: groups.filter((g) => !isBotGroup(g)), groupMatches: groupMatches.filter((m) => !isBotId(m.id)),
        groupStats: [...groupStats].filter(([id]) => !isBotId(id)), at: Date.now(),
      });
      const ps = postsSig(posts);
      if (ps !== savedPostsSig) { savedPostsSig = ps; KV.set('posts:' + uid, posts); }
      const fs = photosSig(myPhotos);
      if (fs !== savedPhotosSig && Array.isArray(myPhotos)) { savedPhotosSig = fs; KV.set('photos:' + uid, myPhotos); }
    }), 1500);
  }
  // Снимок с прошлого запуска — в память, пока сервер ещё не ответил. Заполняем только пустое
  async function hydrateStateFromCache() {
    if (!currentUser) return;
    const uid = currentUser.id;
    const [s, cachedPosts, cachedPhotos] = await Promise.all([KV.get('state:' + uid), KV.get('posts:' + uid), KV.get('photos:' + uid)]);
    if (!s || !currentUser || currentUser.id !== uid) return;
    // снимок прежней версии хранил воспоминания и фото внутри себя
    const postsList = Array.isArray(cachedPosts) ? cachedPosts : Array.isArray(s.posts) ? s.posts : null;
    const photosList = Array.isArray(cachedPhotos) ? cachedPhotos : Array.isArray(s.myPhotos) ? s.myPhotos : null;
    if (Array.isArray(cachedPosts)) savedPostsSig = postsSig(cachedPosts);
    if (Array.isArray(cachedPhotos)) savedPhotosSig = photosSig(cachedPhotos);
    if (!posts.length && postsList) posts = postsList;
    s.myPhotos = photosList;
    if (!wishes.length && Array.isArray(s.wishes)) wishes = s.wishes.filter(wishAlive);
    if (Array.isArray(s.groups) && s.groups.length) groupsLoaded = true;
    if (!groups.length && Array.isArray(s.groups)) groups = s.groups.map((g) => (g.wish && !groupWishAlive(g.wishAt) ? { ...g, wish: '' } : g));
    if (!friends.length && Array.isArray(s.friends)) friends = s.friends;
    if (!notifications.length && Array.isArray(s.notifications)) notifications = s.notifications;
    if (!groupMatches.length && Array.isArray(s.groupMatches)) groupMatches = s.groupMatches;
    if (!groupInvites.length && Array.isArray(s.groupInvites)) groupInvites = s.groupInvites;
    if (myPhotos === null && Array.isArray(s.myPhotos)) myPhotos = s.myPhotos;
    if (!groupStats.size && Array.isArray(s.groupStats)) groupStats = new Map(s.groupStats);
    mergeBots();
    syncRequestBadges();
    const chatList = await KV.get('chatlist2:' + uid);
    if (!chatsListShown && typeof chatList === 'string' && currentUser && currentUser.id === uid) chatsListShown = chatList;
    // ссылки на файлы чатов, подписанные в прошлый раз, ещё действуют — вложения показываются без запроса к серверу
    const signed = await KV.get('signed:' + uid);
    if (Array.isArray(signed) && currentUser && currentUser.id === uid) {
      const now = Date.now();
      for (const [path, v] of signed) if (v && v.exp > now && !mediaUrlCache.has(path)) mediaUrlCache.set(path, v);
    }
    updateBadge();
    scheduleFeedRender();
  }

  /* Медиа из чатов. Файл хранится на устройстве (IndexedDB), в памяти — готовая ссылка на него:
     сообщение рисуется сразу с картинкой, без заглушки. Для фото запоминается и размер — место под него
     занято заранее, лента не прыгает. */
  const MEDIA_BLOB_MAX = 25 * 1024 * 1024;
  const MEDIA_KEEP = 600;                 // сколько файлов держим на устройстве
  const SIGN_TTL = 3 * 24 * 3600;         // срок подписанной ссылки, секунды
  const mediaBlobUrls = new Map();        // путь → ссылка на файл в памяти
  const mediaDims = new Map();            // путь → [ширина, высота] фото
  const mediaLoading = new Map();         // путь → идущая загрузка
  if ('caches' in window) caches.delete('groupis-chat-media-v1').catch(() => {});   // прежнее хранилище

  async function cachedMediaUrl(path) {
    if (mediaBlobUrls.has(path)) return mediaBlobUrls.get(path);
    const rec = await KV.mediaGet(path);
    if (!rec || !rec.blob) return null;
    if (mediaBlobUrls.has(path)) return mediaBlobUrls.get(path);
    let url;
    try { url = URL.createObjectURL(rec.blob); } catch { return null; }
    mediaBlobUrls.set(path, url);
    if (rec.w && rec.h) mediaDims.set(path, [rec.w, rec.h]);
    return url;
  }
  async function rememberMediaBlob(path, blob, url) {
    mediaBlobUrls.set(path, url || URL.createObjectURL(blob));
    if (blob.size > MEDIA_BLOB_MAX) return;
    let w = 0, h = 0;
    if ((blob.type || '').startsWith('image/') && window.createImageBitmap) {
      try { const bmp = await createImageBitmap(blob); w = bmp.width; h = bmp.height; bmp.close(); } catch {}
    }
    if (w && h) mediaDims.set(path, [w, h]);
    await KV.mediaSet(path, { blob, w, h, at: Date.now() });
  }
  // Скачать по подписанной ссылке, запомнить и вернуть локальную ссылку; при ошибке — null
  async function fetchMediaToCache(path, signedUrl) {
    try {
      const res = await fetch(signedUrl);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      await rememberMediaBlob(path, blob);
      return mediaBlobUrls.get(path);
    } catch (err) { console.warn('[media cache] fetch:', err); return null; }
  }
  // Файл окажется на устройстве: если он уже там — берём его, иначе скачиваем (один раз, даже если просили дважды)
  function ensureMediaCached(path, signedUrl) {
    if (mediaBlobUrls.has(path)) return Promise.resolve(mediaBlobUrls.get(path));
    if (mediaLoading.has(path)) return mediaLoading.get(path);
    const p = cachedMediaUrl(path).then((url) => url || fetchMediaToCache(path, signedUrl))
      .finally(() => mediaLoading.delete(path));
    mediaLoading.set(path, p);
    return p;
  }

  /* Подписанные ссылки на файлы чатов живут несколько дней и хранятся на устройстве */
  function freshSignedUrl(path) {
    const c = mediaUrlCache.get(path);
    return c && c.exp > Date.now() ? c.url : null;
  }
  let signedSaveTimer = null;
  function saveSignedUrls() {
    if (!currentUser) return;
    const uid = currentUser.id;
    clearTimeout(signedSaveTimer);
    signedSaveTimer = setTimeout(() => {
      if (!currentUser || currentUser.id !== uid) return;
      const now = Date.now();
      KV.set('signed:' + uid, [...mediaUrlCache].filter(([, v]) => v.exp > now).slice(-2000));
    }, 800);
  }
  async function signMediaPaths(paths) {
    const need = [...new Set(paths)].filter((p) => p && !freshSignedUrl(p));
    if (!need.length) return;
    const now = Date.now();
    try {
      const { data, error } = await supabaseClient.storage.from(CHAT_BUCKET).createSignedUrls(need, SIGN_TTL);
      if (error) console.warn('[chat media] sign:', error.message);
      for (const item of (data || [])) {
        if (item.signedUrl) mediaUrlCache.set(item.path, { url: item.signedUrl, exp: now + (SIGN_TTL - 3600) * 1000 });
      }
      saveSignedUrls();
    } catch (err) { console.warn('[chat media] sign:', err); }
  }

  const KEEP_KINDS = ['image', 'voice', 'circle'];   // что скачиваем на устройство целиком
  function keepablePaths(list, max) {
    return [...new Set(list.filter((m) => m.mediaPath && !m.localUrl && KEEP_KINDS.includes(m.kind)).slice(-max).map((m) => m.mediaPath))];
  }
  // Перед показом чата: файлы последних сообщений, уже лежащие на устройстве, — в память (это быстро)
  async function warmChatMedia(list, max = 40, wait = 300) {
    const paths = keepablePaths(list, max).filter((p) => !mediaBlobUrls.has(p));
    if (!paths.length) return;
    await Promise.race([Promise.all(paths.map(cachedMediaUrl)), new Promise((r) => setTimeout(r, wait))]);
  }
  // В фоне: скачать на устройство вложения последних сообщений, которых там ещё нет
  async function prefetchChatMedia(list, max = 30) {
    if (navigator.connection && navigator.connection.saveData) return;
    const missing = [];
    for (const p of keepablePaths(list, max)) if (!(await cachedMediaUrl(p))) missing.push(p);
    if (!missing.length) return;
    await signMediaPaths(missing);
    let i = 0;
    const worker = async () => {
      while (i < missing.length) {
        const p = missing[i++], url = freshSignedUrl(p);
        if (url) await ensureMediaCached(p, url);
      }
    };
    await Promise.all([worker(), worker(), worker()]);
  }

  function clearLocalCaches() {
    clearTimeout(stateSaveTimer);
    savedPostsSig = null; savedPhotosSig = null;
    KV.clear();
    clearTimeout(signedSaveTimer);
    mediaBlobUrls.forEach((url) => { try { URL.revokeObjectURL(url); } catch {} });
    mediaBlobUrls.clear();
    mediaDims.clear();
    mediaLoading.clear();
    chatHistoryCache.clear();
    friendProfileCache.clear();
    Object.values(hiddenMsgs).forEach((set) => set.clear());
  }

  /* ═══════ ГЛОБАЛЬНЫЕ МАССИВЫ ═══════ */
  let posts = [];
  let wishes = [];
  let groups = [];
  let groupsLoaded = false;   // группы хоть раз загружены (с сервера или из кеша) — пустая лента значит «групп нет»
  let notifications = [];
  let friends = [];

  /* ═══════ ЗАГРУЗКИ ИЗ SUPABASE ═══════ */
  /* Даты по-русски. toLocaleString с параметрами при каждом вызове заново собирает форматтер — на телефоне это около
     миллисекунды, а вызовов сотни (уведомления, воспоминания, плашки дней). Форматтер на каждый набор параметров
     создаётся один раз */
  const ruDateFormats = new Map();
  function fmtRu(d, opts) {
    const key = JSON.stringify(opts);
    let f = ruDateFormats.get(key);
    if (!f) { f = new Intl.DateTimeFormat('ru-RU', opts); ruDateFormats.set(key, f); }
    return f.format(d);
  }
  const DAY_TIME = { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' };
  const DAY_MONTH = { day: 'numeric', month: 'long' };
  const DAY_MONTH_YEAR = { day: 'numeric', month: 'long', year: 'numeric' };
  function mapPostRow(r) {
    return {
      id: r.id, authorId: r.author_id, author: r.author_name,
      images: Array.isArray(r.images) ? r.images : [],
      place: r.place, caption: r.caption,
      coords: Array.isArray(r.coords) ? r.coords : null,
      companions: r.companions && typeof r.companions === 'object' ? r.companions : null,
      ts: r.ts, time: r.ts ? fmtRu(new Date(r.ts), DAY_TIME) : '',
    };
  }

  /* Фото воспоминаний лежат прямо в записи, поэтому весь список весит мегабайты. После публикации воспоминание
     не меняется — сначала спрашиваем только номера, а целиком скачиваем лишь те, которых ещё нет на устройстве */
  async function loadPostsFromDB() {
    const { data: heads, error } = await supabaseClient.from('posts').select('id').order('ts', { ascending: false }).limit(500);
    if (error) { console.warn('[posts] load:', error.message); return; }
    const known = new Map(posts.map((p) => [p.id, p]));
    const missing = (heads || []).map((h) => h.id).filter((id) => !known.has(id));
    for (let i = 0; i < missing.length; i += 50) {
      const { data, error: rowsErr } = await supabaseClient.from('posts').select('*').in('id', missing.slice(i, i + 50));
      if (rowsErr) { console.warn('[posts] load rows:', rowsErr.message); return; }
      for (const r of (data || [])) known.set(r.id, mapPostRow(r));
    }
    posts = (heads || []).map((h) => known.get(h.id)).filter(Boolean);
    scheduleStateSave();
  }

  async function loadWishesFromDB() {
    const { data, error } = await supabaseClient.from('wishes').select('*').order('ts', { ascending: false }).limit(500);
    if (error) { console.warn('[wishes] load:', error.message); return; }
    wishes = (data || []).map((r) => ({
      id: r.id, authorId: r.author_id, authorName: r.author_name,
      text: r.text, place: r.place,
      coords: Array.isArray(r.coords) ? r.coords : null,
      audience: r.audience, groupId: r.group_id, ts: r.ts,
    })).filter(wishAlive);
    cleanupMyExpiredWishes(data || []);
    scheduleStateSave();
  }

  /* В каждой строке состава лежит копия аватарки (фото ~25 КБ), и все составы вместе весят мегабайты. Раньше
     они скачивались целиком при каждом изменении любой группы у кого угодно (realtime) — и каждый раз долго
     разбирались. Теперь целиком — при запуске и не чаще раза в 30 минут, а в остальные разы — только состав:
     аватарки знакомых участников берутся из прошлой загрузки, догружаются только аватарки новых */
  let membersFullAt = 0;
  async function loadGroupsFromDB() {
    const { data: gr, error: gErr } = await supabaseClient.from('groups').select('*').order('created_at', { ascending: false });
    if (gErr) { console.warn('[groups] load:', gErr.message); return; }
    const ids = (gr || []).map((g) => g.id);
    let membersByGroup = {};
    // составы не загрузились (сбой сети) — остаются прежние: иначе все группы на миг «пустеют» и пропадают из ленты
    let membersFailed = false;
    if (ids.length) {
      const full = !membersFullAt || Date.now() - membersFullAt > 30 * 60 * 1000;
      const { data: mem, error: mErr } = await supabaseClient.from('group_members')
        .select(full ? '*' : 'group_id,user_id,name,username').in('group_id', ids);
      if (mErr) { console.warn('[group_members] load:', mErr.message); membersFailed = true; }
      else {
        const known = new Map();   // аватарки участников, уже загруженные раньше ('' — фото нет)
        if (!full) for (const g of groups) for (const m of (g.members || [])) known.set(String(m.id), m.avatar || '');
        const missing = new Set();
        for (const m of (mem || [])) {
          const uid = String(m.user_id);
          const avatar = full ? (m.avatar || '') : known.has(uid) ? known.get(uid) : null;
          if (avatar === null) missing.add(uid);
          if (!membersByGroup[m.group_id]) membersByGroup[m.group_id] = [];
          membersByGroup[m.group_id].push({ id: m.user_id, name: m.name, handle: '@' + m.username, avatar: avatar || '' });
        }
        if (full) membersFullAt = Date.now();
        if (missing.size) {
          const { data: av, error: avErr } = await supabaseClient.from('group_members').select('user_id,avatar')
            .in('user_id', [...missing]).in('group_id', ids);
          if (avErr) console.warn('[group_members] avatars:', avErr.message);
          const byUser = new Map((av || []).map((r) => [String(r.user_id), r.avatar || '']));
          for (const list of Object.values(membersByGroup)) for (const x of list) if (missing.has(String(x.id))) x.avatar = byUser.get(String(x.id)) || '';
        }
      }
    }
    const prevMembers = new Map(groups.map((g) => [String(g.id), g.members]));
    groups = (gr || []).map((g) => ({
      id: g.id, ownerId: g.owner_id, name: g.name, photo: g.photo,
      visibility: g.visibility, members: membersByGroup[g.id] || (membersFailed && prevMembers.get(String(g.id))) || [],
      wish: groupWishAlive(g.wish_at) ? (g.wish || '').trim() : '', wishAt: g.wish_at || null,
      unionWith: g.union_with != null ? String(g.union_with) : null,
    }));
    groupsLoaded = true;
    mergeBots();   // тестовые группы-боты — к группам с сервера
    cleanupMyExpiredGroupWishes(gr || []);
    scheduleStateSave();
    // приглашения и запросы на match могли загрузиться раньше групп — тогда их ещё не к чему было привязать
    syncRequestBadges();
    syncMatchButton();
    scheduleFeedRender();
  }

  /* ═══════ MATCH МЕЖДУ ГРУППАМИ ═══════
     RLS отдаёт только match тех групп, где мы состоим. */
  let groupMatches = [];
  const groupMatchOutcome = new Map(); // id запроса → 'accepted' | 'declined' (ответ дан в этой сессии)

  async function loadGroupMatchesFromDB() {
    if (!currentUser) { groupMatches = []; syncMatchButton(); return; }
    const { data, error } = await supabaseClient.from('group_matches').select('*');
    if (error) { console.warn('[group_matches] load:', error.message); return; }
    const accepted = new Set(groupMatches.filter((m) => m.status === 'accepted').map((m) => m.id));
    groupMatches = (data || []).map(mapMatchRow);
    mergeBots();   // запросы match с группами-ботами живут только в приложении
    scheduleStateSave();
    const fresh = groupMatches.filter((m) => m.status === 'accepted' && !accepted.has(m.id));
    if (fresh.length) onNewMatchChats(fresh);
    noteAcceptedMatches();
    noteDeclinedMatches();
    noteVoteResults();
    syncMatchButton();
  }

  /* У моей группы новый match — его совместный чат оживает сразу, без перезагрузки: подписки realtime
     пересоздаются (как при запуске), пустая заготовка переписки, сохранённая до match, забывается,
     а последние сообщения чатов перечитываются */
  function onNewMatchChats(list) {
    for (const m of list) chatHistoryCache.delete('match:' + m.id);
    if (rtChannels.length) subscribeRealtime();
    refreshChatSummariesSoon();
  }

  function mapMatchRow(r) {
    return {
      id: String(r.id), fromGroup: String(r.from_group), toGroup: String(r.to_group),
      fromOwner: r.from_owner, toOwner: r.to_owner, status: r.status, createdAt: r.created_at,
      voteState: r.vote_state || 'none', voteStartedBy: r.vote_started_by || null,
    };
  }
  /* Запрос на match приняли или отклонили — изменение приходит по realtime со всей строкой. Применяем его сразу:
     анимация match (или отказа) начинается без ожидания полной перезагрузки групп, которая идёт следом */
  function applyMatchRealtime(payload) {
    const r = payload && payload.new;
    if (!currentUser || !r || r.id == null || !r.status) return;
    const m = mapMatchRow(r);
    const i = groupMatches.findIndex((x) => x.id === m.id);
    const was = i >= 0 ? groupMatches[i] : null;
    if (i >= 0) groupMatches[i] = m; else groupMatches.push(m);
    if (m.status === 'accepted' && (!was || was.status !== 'accepted')) onNewMatchChats([m]);
    noteAcceptedMatches();
    noteDeclinedMatches();
    noteVoteResults();
    syncMatchButton();
  }

  /* ── Кнопка «Match» ──
     Пока запрос на match ждёт ответа, у лидеров обеих групп справа сверху пульсирует кнопка «Match»: у того, кому
     прислали запрос, — открыть группу, которая его прислала, и ответить; у того, кто отправил, — посмотреть, кому
     он отправлен (там пульс спокойнее). Капсула с уведомлениями и фильтрами отъезжает влево и уступает ей место. */
  const matchBtn = document.getElementById('match-btn');
  let matchBtnGroup = null;   // чью карточку открыть по нажатию
  let matchBtnItems = [];     // все запросы, которые показывает кнопка: [{ m, other, mine, incoming }]
  /* Кнопка видна всем участникам групп, а не только лидерам: участник тоже может посмотреть, кто предлагает match
     его группе (ответить — принять или отклонить — может только лидер) */
  function syncMatchButton() {
    const myId = currentUser && currentUser.id;
    const newest = (a, b) => (Date.parse(b.createdAt) || 0) - (Date.parse(a.createdAt) || 0);
    const pending = myId ? groupMatches.filter((m) => m.status === 'pending') : [];
    const inMine = (gid) => isGroupParticipant(groupById(gid), myId);
    const incoming = pending.filter((m) => m.toOwner === myId || inMine(m.toGroup)).sort(newest);
    const outgoing = pending.filter((m) => m.fromOwner === myId || inMine(m.fromGroup)).sort(newest);
    matchDeckLists = {
      in: incoming.map((m) => ({ m, other: m.fromGroup, mine: m.toGroup, incoming: true })),
      out: outgoing.map((m) => ({ m, other: m.toGroup, mine: m.fromGroup, incoming: false })),
    };
    matchBtnItems = incoming.length ? matchDeckLists.in : matchDeckLists.out;
    matchBtnGroup = matchBtnItems.length ? matchBtnItems[0].other : null;
    if (matchDeck) { if (matchBtnItems.length) renderMatchDeck(); else closeMatchDeck(); }
    const on = !!matchBtnGroup;
    matchBtn.hidden = !on;
    matchBtn.classList.toggle('is-waiting', !incoming.length);
    // в углу кнопки — сколько всего запросов (полученные и отправленные), по отдельности — во вкладках колоды
    const total = new Set([...incoming, ...outgoing].map((m) => m.id)).size;
    const count = matchBtn.querySelector('.match-btn-count');
    const shown = total > 99 ? '99+' : String(total);
    if (count.textContent !== shown) count.textContent = shown;
    count.hidden = !total;
    const label = incoming.length ? 'Вашей группе предлагают match' : 'Запрос на match ждёт ответа';
    matchBtn.setAttribute('aria-label', label);
    matchBtn.title = label;
    document.body.classList.toggle('has-match-btn', on);
    fitMatchButton();
    scheduleFeedRender();   // у карточек ленты меняются «Хотят match с вами» и действие смахивания
  }
  /* Капсула отъезжает ровно на ширину кнопки и не должна наехать на логотип слева. Тесно — у кнопки остаётся только
     значок; всё ещё тесно (узкий экран и кнопка «Установить» рядом с логотипом) — «Установить» прячется, пока кнопка видна */
  function fitMatchButton() {
    const body = document.body;
    body.classList.remove('match-tight');
    matchBtn.classList.remove('is-compact');
    if (matchBtn.hidden) return;
    const logo = document.querySelector('.menubar'), tools = document.getElementById('top-tools');
    // offsetLeft/offsetWidth — без сдвига капсулы, который ещё может анимироваться
    const fits = () => logo.offsetLeft + logo.offsetWidth + 8 <= tools.offsetLeft - matchBtn.offsetWidth - 6;
    if (!fits()) matchBtn.classList.add('is-compact');
    if (!fits()) {
      body.classList.add('match-tight');
      matchBtn.classList.remove('is-compact');   // «Установить» спрятана — может, теперь хватит места и для подписи
      if (!fits()) matchBtn.classList.add('is-compact');
    }
    body.style.setProperty('--mt-shift', -(matchBtn.offsetWidth + 6) + 'px');
  }
  matchBtn.addEventListener('click', () => {
    if (!matchBtnGroup) return;
    if (matchDeck) closeMatchDeck(); else openMatchDeck();
  });

  /* ── Колода запросов на match ──
     Над лентой — карточки групп: вкладка «Полученные» (кто предлагает match нам) и «Отправленные» (кому предложили мы).
     Карточки делят ширину поровну: одна — большая, с крупным фото; чем их больше, тем они мельче, а самые мелкие
     показывают только фото и название. Нажатие на большую карточку открывает группу; мелкая карточка
     раскрывается поверх остальных целиком, нажатие мимо неё сворачивает её обратно. «Посмотреть группу» открывает
     её карточку. Закрыть — крестик, повторное нажатие на кнопку Match или переход в любой раздел */
  let matchDeck = null, matchDeckActive = null, matchDeckTab = 'in', matchDeckLists = { in: [], out: [] }, matchDeckPop = null;
  const MDECK_MAX = 760, MDECK_GAP = 10, MDECK_CARD_MAX = 420, MDECK_CARD_MIN = 84;
  function openMatchDeck() {
    showFeedApp();
    if (!matchDeck) {
      matchDeck = document.createElement('section');
      matchDeck.className = 'mdeck';
      matchDeck.setAttribute('aria-label', 'Запросы на match');
      document.body.appendChild(matchDeck);
      matchDeck.addEventListener('click', onMatchDeckClick);
    }
    matchDeckActive = null;
    matchDeckTab = matchDeckLists.in.length ? 'in' : 'out';
    renderMatchDeck();
  }
  function closeMatchDeck() {
    if (!matchDeck) return;
    const el = matchDeck;
    matchDeck = null;
    closeMatchDeckPop(true);
    el.classList.add('is-out');
    setTimeout(() => el.remove(), 240);
  }
  function matchDeckCardHtml({ m, other, mine, incoming }, i) {
    const g = groupById(other), my = groupById(mine);
    if (!g) return '';
    const url = safeUrl(g.photo), st = groupStatsText(g);
    return `<article class="mdeck-card${String(other) === matchDeckActive ? ' is-active' : ''}" data-mdeck-group="${escapeHtml(other)}" data-mdeck-i="${i}" role="button" tabindex="0">
        <span class="mdeck-ava"${url ? ` style="background-image:url('${url}')"` : ''}>${url ? '' : escapeHtml(firstChar((g.name || '?').trim()).toUpperCase() || '?')}</span>
        <div class="mdeck-name">${escapeHtml(g.name || 'Группа')}</div>
        <div class="mdeck-sub">${escapeHtml(membersLabel(groupPeople(g).length))}${st ? ' · ' + escapeHtml(st) : ''}</div>
        ${g.wish ? `<div class="mdeck-wish">☁ ${escapeHtml(g.wish)}</div>` : ''}
        <div class="mdeck-to">${incoming ? 'Хотят match с' : 'Запрос от'} «${escapeHtml(ellipsize((my && my.name) || 'Группа', 22))}»</div>
        <button type="button" class="mdeck-open" data-mdeck-open="${escapeHtml(other)}" data-mdeck-match="${escapeHtml(m.id)}">Посмотреть группу</button>
      </article>`;
  }
  function renderMatchDeck() {
    if (!matchDeck) return;
    closeMatchDeckPop(true);
    const list = matchDeckLists[matchDeckTab] || [];
    const tab = (id, label) => `<button type="button" class="mdeck-tab" role="tab" data-mdeck-tab="${id}" aria-selected="${matchDeckTab === id}">${label}<span class="mdeck-count">${matchDeckLists[id].length}</span></button>`;
    const cards = list.map(matchDeckCardHtml).join('');
    matchDeck.innerHTML = `
      <div class="mdeck-head">
        <div class="mdeck-tabs" role="tablist">${tab('in', 'Полученные')}${tab('out', 'Отправленные')}</div>
        <button type="button" class="mdeck-x" data-mdeck-close aria-label="Закрыть" title="Закрыть">×</button>
      </div>
      <div class="mdeck-stage">
        <div class="mdeck-row">${cards || `<div class="mdeck-empty">${matchDeckTab === 'in' ? 'Вашим группам пока не предлагали match' : 'Отправленных запросов нет'}</div>`}</div>
      </div>`;
    fitMatchDeck();
  }
  /* Размер карточек — по ширине, которая достаётся каждой: lg — крупное фото и всё о группе, md — фото поменьше,
     sm — только фото и название (такая карточка раскрывается по нажатию) */
  function fitMatchDeck() {
    const row = matchDeck && matchDeck.querySelector('.mdeck-row');
    if (!row) return;
    const n = row.querySelectorAll('.mdeck-card').length || 1;
    const w = Math.min(MDECK_CARD_MAX, (Math.min(MDECK_MAX, innerWidth - 24) - MDECK_GAP * (n - 1)) / n);
    row.classList.remove('is-lg', 'is-md', 'is-sm');
    row.classList.add(w >= 300 ? 'is-lg' : w >= 150 ? 'is-md' : 'is-sm');
  }
  addEventListener('resize', () => { if (matchDeck) { closeMatchDeckPop(true); fitMatchDeck(); } });

  // Мелкая карточка раскрывается поверх остальных: из того места, где стоит, и туда же уезжает обратно
  function openMatchDeckPop(card) {
    closeMatchDeckPop(true);
    const stage = matchDeck.querySelector('.mdeck-stage');
    const item = (matchDeckLists[matchDeckTab] || [])[Number(card.dataset.mdeckI)];
    if (!stage || !item) return;
    const pop = document.createElement('div');
    pop.className = 'mdeck-pop';
    pop.innerHTML = matchDeckCardHtml(item, card.dataset.mdeckI);
    pop.firstElementChild.classList.add('is-active');
    stage.appendChild(pop);
    const c = card.getBoundingClientRect(), p = pop.getBoundingClientRect();
    pop.style.transformOrigin = `${(c.left + c.width / 2 - p.left).toFixed(0)}px ${(c.top + c.height / 2 - p.top).toFixed(0)}px`;
    matchDeck.classList.add('has-pop');
    card.classList.add('is-source');
    matchDeckPop = { pop, card };
  }
  function closeMatchDeckPop(instant = false) {
    const cur = matchDeckPop;
    if (!cur) return;
    matchDeckPop = null;
    cur.card.classList.remove('is-source');
    if (matchDeck) matchDeck.classList.remove('has-pop');
    if (instant || reduceMotion) { cur.pop.remove(); return; }
    cur.pop.classList.add('is-out');
    setTimeout(() => cur.pop.remove(), 230);
  }
  // Нажатие мимо раскрытой карточки — она уезжает обратно (нажатие по другой мелкой карточке раскрывает уже её)
  document.addEventListener('pointerdown', (e) => {
    if (!matchDeckPop || matchDeckPop.pop.contains(e.target)) return;
    if (e.target.closest && e.target.closest('.mdeck-row .mdeck-card, .mdeck-head')) return;
    closeMatchDeckPop();
  }, true);
  function onMatchDeckClick(e) {
    if (e.target.closest('[data-mdeck-close]')) { closeMatchDeck(); return; }
    const tabBtn = e.target.closest('[data-mdeck-tab]');
    if (tabBtn) {
      if (tabBtn.dataset.mdeckTab !== matchDeckTab) { matchDeckTab = tabBtn.dataset.mdeckTab; matchDeckActive = null; renderMatchDeck(); }
      return;
    }
    const open = e.target.closest('[data-mdeck-open]');
    if (open) {
      const gid = open.dataset.mdeckOpen, tab = matchDeckTab;
      closeMatchDeck();
      showApp('groups', matchBtn);
      showGroupDetailsScreen(gid, () => {
        closeApp();
        if (!matchBtnItems.length) return;
        openMatchDeck();
        if (matchDeckLists[tab].length && tab !== matchDeckTab) { matchDeckTab = tab; renderMatchDeck(); }
      });
      return;
    }
    if (e.target.closest('.mdeck-pop')) return;
    const card = e.target.closest('[data-mdeck-group]');
    if (!card) return;
    const gid = card.dataset.mdeckGroup;
    matchDeckActive = gid;
    matchDeck.querySelectorAll('.mdeck-row .mdeck-card').forEach((c) => c.classList.toggle('is-active', c === card));
    // мелкая карточка раскрывается поверх остальных, у большой — сразу открываем группу
    if (card.closest('.mdeck-row.is-sm')) {
      if (matchDeckPop && matchDeckPop.card === card) closeMatchDeckPop(); else openMatchDeckPop(card);
      return;
    }
    card.querySelector('[data-mdeck-open]').click();
  }
  // другой размер экрана, появилась или пропала кнопка «Установить», догрузился шрифт — подгоняем заново
  addEventListener('resize', fitMatchButton);
  ['beforeinstallprompt', 'appinstalled'].forEach((type) => addEventListener(type, () => setTimeout(fitMatchButton, 0)));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitMatchButton).catch(() => {});

  /* ═══════ АНИМАЦИЯ MATCH ═══════
     Группы сделали match — у всех участников обеих групп, а не только у лидеров, на пару секунд: знаки групп съезжаются
     и сливаются в общий, расходится «сигнал», ниже — «Match» и названия (стили .match-fx). Каждый match показывается
     один раз на устройстве: увиденные помнятся в localStorage. Пока этого списка нет (первый запуск этой версии, новое
     устройство), уже существующие match считаются увиденными — иначе анимация сыграла бы для всех старых разом;
     match, запрос на который отправили больше двух недель назад, тоже не показываем.
     Сервер отдаёт только match моих групп, поэтому список — сразу «мои». */
  const MATCH_FX_KEY = 'match.fx.v1:';
  let matchFxQueue = [], matchFxRun = null;
  function noteAcceptedMatches() {
    if (!currentUser) return;
    const key = MATCH_FX_KEY + currentUser.id;
    let seen = null;
    try { seen = JSON.parse(localStorage.getItem(key) || 'null'); } catch {}
    const accepted = groupMatches.filter((m) => m.status === 'accepted');
    const fresh = Array.isArray(seen) ? accepted.filter((m) => !seen.includes(m.id)) : [];
    if (Array.isArray(seen) && !fresh.length) return;
    const all = [...new Set([...(Array.isArray(seen) ? seen : []), ...accepted.map((m) => m.id)])].slice(-200);
    try { localStorage.setItem(key, JSON.stringify(all)); } catch {}
    for (const m of fresh) if (Date.now() - (Date.parse(m.createdAt) || 0) < 14 * 86400000) queueMatchFx(m);
  }

  /* Match не случился: группе, которая его предложила, — та же анимация, только знаки групп не сливаются,
     а отталкиваются друг от друга, и вместо «Match» — одна из фраз, каждый раз случайная. Показывается один раз
     на устройстве, как и match; отклонённые до первого запуска этой версии считаются увиденными */
  const MATCH_NO_KEY = 'match.no.v1:';
  const MATCH_NO_PHRASES = ['Match не случился', 'Видно, не судьба', 'Не в этот раз', 'Звёзды не сошлись',
    'Сигналы разошлись', 'Пока не совпало', 'Мимо радара', 'В другой раз повезёт'];
  function noteDeclinedMatches() {
    if (!currentUser) return;
    const key = MATCH_NO_KEY + currentUser.id;
    let seen = null;
    try { seen = JSON.parse(localStorage.getItem(key) || 'null'); } catch {}
    // запрос могут отправить снова после отказа — тогда отказ на него новый
    const tag = (m) => m.id + ':' + (m.createdAt || '');
    const declined = groupMatches.filter((m) => m.status === 'declined');
    const fresh = Array.isArray(seen) ? declined.filter((m) => !seen.includes(tag(m))) : [];
    if (Array.isArray(seen) && !fresh.length) return;
    const all = [...new Set([...(Array.isArray(seen) ? seen : []), ...declined.map(tag)])].slice(-200);
    try { localStorage.setItem(key, JSON.stringify(all)); } catch {}
    for (const m of fresh) if (Date.now() - (Date.parse(m.createdAt) || 0) < 14 * 86400000) queueMatchFx(m, 'no');
  }
  function queueMatchFx(m, kind = 'yes') {
    matchFxQueue.push([m, kind]);
    if (matchFxRun) return;
    matchFxRun = (async () => {
      while (matchFxQueue.length) {
        // приложение свёрнуто или ещё на экране входа — ждём, пока человек его увидит
        while (currentUser && (document.hidden || !authScreen.hidden)) await new Promise((r) => setTimeout(r, 500));
        if (!currentUser) { matchFxQueue = []; break; }
        // при запуске группы грузятся вместе с match — даём им пару секунд, чтобы показать названия и фото
        const [m, k] = matchFxQueue[0];
        for (let i = 0; i < 30 && !(groupById(m.fromGroup) && groupById(m.toGroup)); i++) await new Promise((r) => setTimeout(r, 150));
        matchFxQueue.shift();
        // об отказе узнаёт только группа, которая предлагала match
        if (k === 'no' && !isGroupParticipant(groupById(m.fromGroup), currentUser.id)) continue;
        await playMatchFx(m, k);
      }
    })().finally(() => { matchFxRun = null; });
  }
  // Дождаться, пока анимация доиграет (например, перед окном «Открыть общий чат?»)
  const matchFxIdle = () => matchFxRun || Promise.resolve();
  function playMatchFx(m, kind = 'yes') {
    const no = kind === 'no';
    return new Promise((resolve) => {
      const disc = (gid, cls) => {
        const g = groupById(gid), url = g ? safeUrl(g.photo) : '';
        const letter = url ? '' : escapeHtml(firstChar(((g && g.name) || '?').trim()).toUpperCase());
        return `<span class="mfx-disc ${cls}"${url ? ` style="background-image:url('${url}')"` : ''}>${letter}</span>`;
      };
      const el = document.createElement('div');
      el.className = 'match-fx' + (no ? ' is-no' : '');
      el.setAttribute('role', 'status');
      const cap = no ? MATCH_NO_PHRASES[Math.floor(Math.random() * MATCH_NO_PHRASES.length)] : 'Match';
      el.innerHTML = `
        <div class="mfx-stage" aria-hidden="true">
          <span class="mfx-ring"></span><span class="mfx-ring"></span>
          ${disc(m.fromGroup, 'is-a')}${disc(m.toGroup, 'is-b')}
          ${no ? '' : '<svg class="mfx-lens" viewBox="0 0 132 72"><path d="M66 8.29A32 32 0 0 1 66 63.71A32 32 0 0 1 66 8.29Z"/></svg>'}
        </div>
        <div class="mfx-cap">${escapeHtml(cap)}</div>
        <div class="mfx-names">${escapeHtml(matchTitle(m))}</div>`;
      document.body.appendChild(el);
      let done = false, timer = 0;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        el.classList.add('is-out');
        setTimeout(() => { el.remove(); resolve(); }, 260);
      };
      el.addEventListener('click', finish);   // нажатие — закрыть раньше
      timer = setTimeout(finish, no ? 2100 : 1700);
      // в момент слияния (или столкновения) — лёгкий щелчок, где телефон это умеет
      if (navigator.vibrate && !reduceMotion) setTimeout(() => { if (!done) { try { navigator.vibrate(no ? [8, 70, 8] : 12); } catch {} } }, no ? 440 : 560);
    });
  }

  /* ═══════ ИТОГ ГОЛОСОВАНИЯ О СОЮЗЕ ═══════
     Голосование решено — у всех участников обеих групп на пару секунд «печать союза»: кольцо из делений по числу
     участников зажигается голосами («за» — спектром по часовой от верха, «против» — красным против часовой), у отметок
     большинства решается исход. «За» — кольцо замыкается в печать, знаки групп сходятся в общий; «против» — кольцо
     трескается и расходится, знаки групп тоже. Каждый итог показывается один раз на устройстве; кто проголосовал
     решающим, видит его сразу, остальные — когда придёт изменение (или при следующем запуске). Голоса неизвестны —
     кольцо из ровных делений, без счёта. */
  const VOTE_FX_KEY = 'vote.fx.v1:';
  const voteFxTally = new Map();   // id match → голоса, известные на этом устройстве (решающий голос был мой)
  const voteFxQueued = new Set();  // итоги, которые уже показаны или ждут показа в этом запуске
  const voteResultOf = (m) => (m.status === 'dissolved' ? 'no' : m.status === 'accepted' && m.voteState === 'approved' ? 'yes' : null);
  function noteVoteResults() {
    if (!currentUser) return;
    const key = VOTE_FX_KEY + currentUser.id;
    let seen = null;
    try { seen = JSON.parse(localStorage.getItem(key) || 'null'); } catch {}
    const tag = (m) => m.id + ':' + voteResultOf(m);
    const decided = groupMatches.filter(voteResultOf);
    // первый запуск этой версии — прежние итоги считаются увиденными, иначе они сыграли бы все разом
    const fresh = Array.isArray(seen) ? decided.filter((m) => !seen.includes(tag(m))) : [];
    if (Array.isArray(seen) && !fresh.length) return;
    const all = [...new Set([...(Array.isArray(seen) ? seen : []), ...decided.map(tag)])].slice(-200);
    try { localStorage.setItem(key, JSON.stringify(all)); } catch {}
    for (const m of fresh) {
      if (voteFxQueued.has(m.id)) continue;
      voteFxQueued.add(m.id);
      showVoteFx(m, voteResultOf(m));
    }
  }
  let voteFxChain = Promise.resolve();
  function showVoteFx(m, result) {
    voteFxChain = voteFxChain.then(async () => {
      await matchFxIdle();   // match и итоги голосования не накладываются друг на друга
      while (currentUser && (document.hidden || !authScreen.hidden)) await new Promise((r) => setTimeout(r, 500));
      if (!currentUser) return;
      let votes = voteFxTally.get(m.id) || null;
      if (!votes) {
        // голоса других — с сервера, если успеют за секунду (после распада союза их может уже не быть)
        votes = await Promise.race([loadMatchVotes(m.id).catch(() => []), new Promise((r) => setTimeout(() => r([]), 1000))]);
      }
      await playVoteFx(m, result, votes || []);
    }).catch((err) => console.warn('[vote fx]', err));
  }
  function playVoteFx(m, result, votes) {
    const no = result === 'no';
    const total = Math.max(0, matchParticipantIds(m).length);
    const yes = votes.filter((v) => v.vote).length, against = votes.filter((v) => !v.vote).length;
    const counted = total > 1 && yes + against > 0 && yes + against <= total;
    const N = counted ? total : 12, need = counted ? Math.ceil(total / 2) : 0;
    const lit = counted ? { yes, no: against } : (no ? { yes: 0, no: N } : { yes: N, no: 0 });
    const step = Math.min(0.12, 0.9 / Math.max(lit.yes, lit.no, 1));
    const t = 0.35 + Math.max(lit.yes, lit.no, 1) * step + 0.2;   // когда голоса досчитаны и решается исход
    // кольцо: деления по часовой от верха; «за» — с начала, «против» — с конца (против часовой)
    const R = 70, seg = 360 / N, gap = Math.min(5, seg * 0.28);
    const pt = (a) => { const r = (a - 90) * Math.PI / 180; return `${(84 + R * Math.cos(r)).toFixed(2)} ${(84 + R * Math.sin(r)).toFixed(2)}`; };
    const arc = (k) => `M${pt(k * seg + gap / 2)}A${R} ${R} 0 0 1 ${pt((k + 1) * seg - gap / 2)}`;
    const halves = { left: '', right: '' };
    for (let k = 0; k < N; k++) {
      const side = (k + 0.5) * seg < 180 ? 'right' : 'left';
      let cls = '', d = 0;
      if (k < lit.yes) { cls = 'is-yes'; d = 0.35 + k * step; }
      else if (k >= N - lit.no) { cls = 'is-no'; d = 0.35 + (N - 1 - k) * step; }
      halves[side] += `<path class="vfx-seg is-base" d="${arc(k)}"/>`
        + (cls ? `<path class="vfx-seg is-lit ${cls}" style="--d:${d.toFixed(2)}" d="${arc(k)}"/>` : '');
    }
    const tick = (a) => { const r = (a - 90) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return `<line class="vfx-mark" x1="${(84 + 78 * c).toFixed(1)}" y1="${(84 + 78 * s).toFixed(1)}" x2="${(84 + 85 * c).toFixed(1)}" y2="${(84 + 85 * s).toFixed(1)}"/>`; };
    const marks = need ? tick(need * seg) + tick(360 - need * seg) : '';
    const disc = (gid, cls) => {
      const g = groupById(gid), url = g ? safeUrl(g.photo) : '';
      const letter = url ? '' : escapeHtml(firstChar(((g && g.name) || '?').trim()).toUpperCase());
      return `<span class="vfx-disc ${cls}"${url ? ` style="background-image:url('${url}')"` : ''}>${letter}</span>`;
    };
    const sub = no
      ? (counted ? `Против — ${against} из ${total} · совместный чат удалён` : 'Совместный чат удалён — группы больше не видят друг друга')
      : (counted ? `За — ${yes} из ${total} · в ленте только вы друг у друга` : 'Теперь в ленте — только вы друг у друга');
    return new Promise((resolve) => {
      const el = document.createElement('div');
      el.className = 'match-fx vote-fx' + (no ? ' is-no' : '');
      el.setAttribute('role', 'status');
      el.style.setProperty('--t', t.toFixed(2));
      el.innerHTML = `
        <div class="vfx-eyebrow">Голосование о союзе</div>
        <div class="vfx-stage" aria-hidden="true">
          <span class="vfx-glow"></span><span class="vfx-glow"></span>
          <svg class="vfx-ring" viewBox="0 0 168 168">
            <g class="vfx-half is-left">${halves.left}</g><g class="vfx-half is-right">${halves.right}</g>
            ${marks}
            ${no ? '' : `<circle class="vfx-seal" cx="84" cy="84" r="${R}" pathLength="1" transform="rotate(-90 84 84)"/>`}
          </svg>
          ${disc(m.fromGroup, 'is-a')}${disc(m.toGroup, 'is-b')}
          ${no ? '' : '<svg class="vfx-lens" viewBox="0 0 72 52"><path d="M36 4.6A26 26 0 0 1 36 47.4A26 26 0 0 1 36 4.6Z"/></svg>'}
        </div>
        <div class="vfx-title">${no ? 'Союз распался' : 'Союз закреплён'}</div>
        <div class="vfx-names">${escapeHtml(matchTitle(m))}</div>
        <div class="vfx-sub">${escapeHtml(sub)}</div>`;
      document.body.appendChild(el);
      let done = false, timer = 0;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        el.classList.add('is-out');
        setTimeout(() => { el.remove(); resolve(); }, 260);
      };
      el.addEventListener('click', finish);   // нажатие — закрыть раньше
      timer = setTimeout(finish, (t + (no ? 2.4 : 2.6)) * 1000);
      // в миг печати (или трещины) — лёгкий щелчок, где телефон это умеет
      if (navigator.vibrate && !reduceMotion) setTimeout(() => { if (!done) { try { navigator.vibrate(no ? [8, 60, 8] : [10, 40, 18]); } catch {} } }, t * 1000);
    });
  }

  /* ═══════ ПРИГЛАШЕНИЯ В ГРУППУ ═══════
     Лидер отмечает людей — им приходит приглашение; участником человек становится, когда примет его.
     Пока в группе только лидер, в ленте её нет: она появляется, когда участников двое и больше.
     RLS отдаёт только приглашения, которые отправил я или которые отправили мне. */
  let groupInvites = [];
  const groupInviteOutcome = new Map(); // id приглашения → 'accepted' | 'declined' (ответ дан в этой сессии)

  async function loadGroupInvitesFromDB() {
    if (!currentUser) { groupInvites = []; syncRequestBadges(); return; }
    const { data, error } = await supabaseClient.from('group_invites').select('*');
    if (error) { console.warn('[group_invites] load:', error.message); return; }
    groupInvites = (data || []).map((r) => ({
      id: String(r.id), groupId: String(r.group_id), fromId: r.from_id, toId: r.to_id, status: r.status,
      createdAt: r.created_at || null,
    }));
    scheduleStateSave();
    syncRequestBadges();
    // приглашение пришло в ответ на мою заявку — вступаем сразу
    if (joinRequests.length) autoAcceptRequestedInvites();
    // кто пригласил — имя на карточке приглашения во вкладке «Группы»
    const inviters = myPendingInvites().map((i) => i.fromId);
    if (inviters.length && await ensurePeople(inviters)) refreshGroupsList();
  }
  function pendingInvitesOfGroup(gid) {
    return groupInvites.filter((i) => i.status === 'pending' && i.groupId === String(gid));
  }
  // Приглашения мне, на которые я ещё не ответил, — они во вкладке «Группы» над списком моих групп
  function myPendingInvites() {
    const myId = currentUser && currentUser.id;
    if (!myId) return [];
    return groupInvites.filter((i) => i.status === 'pending' && i.toId === myId && groupById(i.groupId) && !groupInviteOutcome.has(i.id))
      .sort((a, b) => (Date.parse(b.createdAt) || 0) - (Date.parse(a.createdAt) || 0));
  }
  function pendingIncomingInvite(id) {
    const myId = currentUser && currentUser.id;
    return groupInvites.some((i) => i.id === String(id) && i.status === 'pending' && i.toId === myId);
  }
  // Группа видна в ленте, когда в ней кроме лидера есть хотя бы один участник
  function groupInFeed(g) { return !!g && (g.members || []).length >= 1; }

  /* ── Мгновенный отклик ──
     Раньше каждое действие (друзья, группы, match, заявки) сначала ждало сервер, потом перечитывало группы и друзей
     (ещё несколько запросов подряд) и только тогда меняло экран — на мобильном интернете это 1–2 секунды «подвисания».
     Теперь: apply — сразу меняет данные и экран; send — запрос к серверу в фоне; не вышло — undo откатывает
     изменение и fail показывает причину; вышло — sync тихо сверяет данные с сервером. Ответ — промис «удалось ли» */
  function optimistic({ apply, send, undo, fail, sync }) {
    apply();
    return (async () => {
      let error = null, result = null;
      try { result = await send(); error = result && result.error; } catch (err) { error = err; }
      if (error) {
        console.error('[действие]', error);
        try { undo(); } catch (err) { console.warn('[откат]', err); }
        if (fail) fail(error);
        return false;
      }
      if (sync) Promise.resolve().then(() => sync(result)).catch((err) => console.warn('[сверка]', err));
      return true;
    })();
  }
  // Я как участник группы (для мгновенного вступления, пока сервер не прислал свежий состав)
  const meAsMember = () => ({ id: currentUser.id, name: profile.name, handle: profile.handle, avatar: profile.avatar || '' });
  // Перерисовать всё, что зависит от групп: список, открытая карточка, значки, лента
  function repaintGroupsWorld() {
    syncRequestBadges(); syncMatchButton();
    refreshGroupsList();
    if (winBody.querySelector('[data-group-card]')) quietly(reopenGroupDetails);
    scheduleFeedRender();
    scheduleStateSave();
  }

  function respondGroupInvite(inviteId, accept) {
    const id = String(inviteId);
    const inv = groupInvites.find((i) => i.id === id);
    const before = { groups, notifications };
    return optimistic({
      apply() {
        groupInviteOutcome.set(id, accept ? 'accepted' : 'declined');
        notifications = notifications.map((n) => n.requestId === id && n.type === 'group' ? { ...n, read: true } : n);
        // вступил — я сразу в составе группы: она в «Моих группах»
        if (accept && inv && currentUser) {
          groups = groups.map((g) => (String(g.id) === inv.groupId && !isGroupParticipant(g, currentUser.id) ? { ...g, members: [...(g.members || []), meAsMember()] } : g));
        }
        repaintGroupsWorld(); refreshNotifications();
      },
      send: () => supabaseClient.rpc(accept ? 'accept_group_invite' : 'decline_group_invite', { invite_id: Number(id) }),
      undo() { groupInviteOutcome.delete(id); groups = before.groups; notifications = before.notifications; repaintGroupsWorld(); refreshNotifications(); },
      fail: (err) => alert('Не удалось ответить на приглашение: ' + (err.message || err)),
      sync: () => (accept ? refreshGroupsWorld() : loadGroupInvitesFromDB()).then(() => { refreshGroupsList(); refreshNotifications(); }),
    });
  }

  /* ═══════ ЗАЯВКИ НА ВСТУПЛЕНИЕ В ГРУППУ ═══════
     Человек без группы видит в ленте чужую группу и просится в неё (смахивает вправо или «Попроситься в группу» в карточке).
     Лидеру приходит заявка — в карточке своей группы (раздел «Заявки»), цифрой на вкладке «Группы» и уведомлением;
     он отвечает «Принять» или «Отклонить». Принятому уходит обычное приглашение, и его приложение само вступает в
     группу — заявку-то подавал он. Таблица и функции — supabase_join_requests.sql; пока их нет, кнопка подскажет */
  let joinRequests = [];          // видимые мне: мои заявки и заявки в группы, которые я веду
  let joinRequestsMissing = false;
  async function loadJoinRequestsFromDB() {
    if (!currentUser) { joinRequests = []; return; }
    const { data, error } = await supabaseClient.from('group_join_requests').select('*').order('created_at', { ascending: false });
    if (error) {
      if (/relation|does not exist|schema cache|could not find/i.test(error.message || '')) joinRequestsMissing = true;
      else console.warn('[join requests] load:', error.message);
      return;
    }
    joinRequestsMissing = false;
    joinRequests = (data || []).map((r) => ({ id: String(r.id), groupId: String(r.group_id), userId: String(r.user_id), status: r.status, createdAt: r.created_at || null }));
    mergeBots();   // заявки в группы-боты — только в приложении
    syncRequestBadges();
    scheduleFeedRender();
    // кто просится — имена и фото для заявок в мои группы
    const ids = joinRequestsToMe().map((r) => r.userId);
    if (ids.length && await ensurePeople(ids)) { refreshGroupsList(); if (winBody.querySelector('[data-group-card]')) quietly(reopenGroupDetails); }
    autoAcceptRequestedInvites();
  }
  // Моя последняя заявка в эту группу (или null)
  const myJoinRequest = (gid) => joinRequests.find((r) => r.groupId === String(gid) && currentUser && r.userId === String(currentUser.id)) || null;
  // Ждущие ответа заявки в группы, которые я веду
  function joinRequestsToMe(gid = null) {
    const myId = currentUser && String(currentUser.id);
    const led = new Set(groups.filter((g) => String(g.ownerId) === myId).map((g) => String(g.id)));
    return joinRequests.filter((r) => r.status === 'pending' && r.userId !== myId && led.has(r.groupId) && (gid == null || r.groupId === String(gid)));
  }
  function requestJoinGroup(gid) {
    const g = groupById(gid);
    if (!g || !currentUser) return Promise.resolve(false);
    if (isBotGroup(g)) return botJoin(gid);   // тестовая группа-бот — только в приложении
    const busy = busyGroupOf(currentUser.id);
    if (busy) { noticeModal({ title: 'Вы уже в группе', text: `Вы в группе «${busy.name || 'Группа'}» — попроситься в другую можно, когда выйдете из неё.` }); return Promise.resolve(false); }
    const tmpId = 'tmp-' + Date.now(), before = joinRequests;
    return optimistic({
      apply() {
        joinRequests = [{ id: tmpId, groupId: String(gid), userId: String(currentUser.id), status: 'pending', createdAt: new Date().toISOString() }, ...joinRequests];
        if (winBody.querySelector('[data-group-card]')) quietly(reopenGroupDetails);
      },
      send: () => supabaseClient.rpc('request_join_group', { gid: String(gid) }),
      undo() { joinRequests = before; if (winBody.querySelector('[data-group-card]')) quietly(reopenGroupDetails); },
      fail(error) {
        if (isMissingRpc(error)) alert('Заявки в группы ещё не настроены — выполните supabase_join_requests.sql в Supabase.');
        else if (/already in a group/i.test(error.message || '')) noticeModal({ title: 'Вы уже в группе', text: 'Попроситься в другую группу можно, когда выйдете из своей.' });
        else alert('Не удалось отправить заявку: ' + (error.message || error));
      },
      // настоящий номер заявки — вместо временного
      sync({ data }) { joinRequests = joinRequests.map((r) => (r.id === tmpId ? { ...r, id: String(data) } : r)); },
    });
  }
  function answerJoinRequest(reqId, accept) {
    const r = joinRequests.find((x) => x.id === String(reqId));
    if (!r) return Promise.resolve(false);
    const was = r.status;
    return optimistic({
      apply() { r.status = accept ? 'accepted' : 'declined'; syncRequestBadges(); refreshGroupsList(); if (winBody.querySelector('[data-group-card]')) quietly(reopenGroupDetails); },
      send: () => supabaseClient.rpc('answer_join_request', { req_id: Number(reqId), accept }),
      undo() { r.status = was; syncRequestBadges(); refreshGroupsList(); if (winBody.querySelector('[data-group-card]')) quietly(reopenGroupDetails); },
      fail: (error) => alert('Не удалось ответить на заявку: ' + (error.message || error) + (isMissingRpc(error) ? '\n\nВыполните supabase_join_requests.sql в Supabase.' : '')),
      async sync() {
        if (!accept) return;
        // в группу принятый вступит сам, по обычному приглашению: состав меняет та же функция, что и всегда
        const { error: invErr } = await supabaseClient.rpc('send_group_invites', { gid: r.groupId, user_ids: [r.userId] });
        if (invErr) alert('Заявка принята, но приглашение не отправлено: ' + invErr.message);
        await loadGroupInvitesFromDB();
        refreshGroupsList();
      },
    });
  }
  // Лидер принял мою заявку и прислал приглашение — вступаем сами (заявку подавал я)
  let autoAccepting = false;
  async function autoAcceptRequestedInvites() {
    if (autoAccepting || !currentUser) return;
    autoAccepting = true;
    try {
      for (const inv of myPendingInvites()) {
        const req = joinRequests.find((r) => r.groupId === inv.groupId && r.userId === String(currentUser.id) && r.status !== 'declined');
        if (req && !groupInviteOutcome.has(inv.id)) await respondGroupInvite(inv.id, true);
      }
    } finally { autoAccepting = false; }
  }

  /* ═══════ СОЮЗ ГРУПП И ГОЛОСОВАНИЕ ═══════
     Закреплённый союз (≥ 50% «за»): участники двух групп видят в ленте только друг друга,
     а сами группы скрыты от остальных. Распавшийся союз (≥ 50% «против»): группы больше
     не видят друг друга и не могут снова сделать match. */
  function unionPartner(g) {
    if (!g || !g.unionWith) return null;
    return groupById(g.unionWith);   // партнёр мог удалить группу — тогда союза нет
  }
  // Мой закреплённый союз: { mine, partner } или null
  function myUnion() {
    for (const g of myGroups()) {
      const partner = unionPartner(g);
      if (partner) return { mine: g, partner };
    }
    return null;
  }
  // Союз с группой распался (статус dissolved) — она для нас скрыта навсегда
  function dissolvedWithMyGroups(g) {
    const gid = String(g.id);
    const mine = new Set(myGroups().map((x) => String(x.id)));
    return groupMatches.some((m) => m.status === 'dissolved' &&
      ((m.fromGroup === gid && mine.has(m.toGroup)) || (m.toGroup === gid && mine.has(m.fromGroup))));
  }
  // Скрыта ли чужая группа от меня в ленте и в списках
  function groupHiddenForMe(g) {
    const myId = currentUser && currentUser.id;
    if (!g || isGroupParticipant(g, myId)) return false;
    if (!groupInFeed(g)) return true;                         // в группе пока только лидер
    const u = myUnion();
    if (u) return String(g.id) !== String(u.partner.id);   // в союзе видим только партнёра
    if (unionPartner(g)) return true;                        // чужой закреплённый союз скрыт от всех
    return dissolvedWithMyGroups(g);
  }

  // Все участники союза: лидеры и участники обеих групп
  function matchParticipantIds(m) {
    const ids = new Set();
    for (const gid of [m.fromGroup, m.toGroup]) {
      const g = groupById(gid);
      if (!g) continue;
      ids.add(g.ownerId);
      for (const mem of (g.members || [])) ids.add(mem.id);
    }
    return [...ids];
  }
  function isMatchLeader(m, uid) {
    return [m.fromGroup, m.toGroup].some((gid) => { const g = groupById(gid); return g && g.ownerId === uid; });
  }

  async function loadMatchVotes(matchId) {
    const { data, error } = await supabaseClient.from('match_votes').select('user_id, vote').eq('match_id', Number(matchId));
    if (error) { console.warn('[match votes] load:', error.message); return []; }
    return data || [];
  }

  function groupById(id) { return groups.find((g) => String(g.id) === String(id)) || null; }
  function isGroupParticipant(g, uid) { return !!g && !!uid && (g.ownerId === uid || (g.members || []).some((m) => m.id === uid)); }
  // В какой группе человек уже состоит (лидером или участником), кроме exceptGid, — или null: человек свободен
  function busyGroupOf(uid, exceptGid = null) {
    return groups.find((g) => String(g.id) !== String(exceptGid) && isGroupParticipant(g, uid)) || null;
  }
  function groupsOwnedBy(uid) { return groups.filter((g) => g.ownerId === uid); }

  function matchTitle(m) {
    const a = groupById(m.fromGroup), b = groupById(m.toGroup);
    return `${a ? a.name : 'Группа'} × ${b ? b.name : 'Группа'}`;
  }

  // Принятые match, где я состою в одной из групп
  function myAcceptedMatches() {
    const myId = currentUser && currentUser.id;
    // match с группой-ботом сюда не входит: у него нет совместного чата, союза и голосования на сервере
    return groupMatches.filter((m) => m.status === 'accepted' && !isBotId(m.id) &&
      (isGroupParticipant(groupById(m.fromGroup), myId) || isGroupParticipant(groupById(m.toGroup), myId)));
  }

  // Запись match между двумя группами (в любом направлении)
  function matchBetween(gidA, gidB) {
    const a = String(gidA), b = String(gidB);
    return groupMatches.find((m) => (m.fromGroup === a && m.toGroup === b) || (m.fromGroup === b && m.toGroup === a)) || null;
  }

  function pendingIncomingMatch(id) {
    const m = groupMatches.find((x) => x.id === String(id));
    return !!m && m.status === 'pending' && m.toOwner === (currentUser && currentUser.id);
  }

  function respondGroupMatch(matchId, accept) {
    if (isBotId(matchId)) return botRespondMatch(matchId, accept);   // запрос от группы-бота
    const id = String(matchId);
    const before = { groupMatches, notifications };
    return optimistic({
      apply() {
        groupMatchOutcome.set(id, accept ? 'accepted' : 'declined');
        notifications = notifications.map((n) => n.requestId === id && n.type === 'group_match' ? { ...n, read: true } : n);
        // ответ виден сразу: запрос уходит из колоды и с кнопки «Match», у принятого — анимация match
        groupMatches = groupMatches.map((m) => (m.id === id ? { ...m, status: accept ? 'accepted' : 'declined' } : m));
        if (accept) noteAcceptedMatches();
        repaintGroupsWorld();
        if (openApp === 'notifications') refreshNotifications();
      },
      send: () => supabaseClient.rpc(accept ? 'accept_group_match' : 'decline_group_match', { match_id: Number(id) }),
      undo() { groupMatchOutcome.delete(id); groupMatches = before.groupMatches; notifications = before.notifications; repaintGroupsWorld(); if (openApp === 'notifications') refreshNotifications(); },
      fail: (error) => alert('Не удалось ответить на запрос: ' + (error.message || error)),
      sync: () => refreshGroupsWorld().then(() => { if (accept) onNewMatchChats(groupMatches.filter((m) => m.id === id)); }),
    });
  }

  // Ответ — промис статуса от сервера ('pending' | 'accepted' …) или null, если запрос не ушёл
  function sendGroupMatch(fromGid, toGid) {
    if (isBotId(toGid) || isBotId(fromGid)) return botSendMatch(fromGid, toGid);   // группа-бот ответит сама
    const a = groupById(fromGid), b = groupById(toGid);
    const tmpId = 'tmp-' + Date.now(), before = groupMatches;
    let status = null;
    return optimistic({
      apply() {
        // запрос отправлен — карточка и кнопка «Match» показывают это сразу
        groupMatches = [...groupMatches, { id: tmpId, fromGroup: String(fromGid), toGroup: String(toGid), fromOwner: a ? a.ownerId : null, toOwner: b ? b.ownerId : null,
          status: 'pending', createdAt: new Date().toISOString(), voteState: 'none', voteStartedBy: null }];
        repaintGroupsWorld();
      },
      send: async () => { const r = await supabaseClient.rpc('send_group_match', { from_gid: String(fromGid), to_gid: String(toGid) }); status = r.data; return r; },
      undo() { groupMatches = before; repaintGroupsWorld(); },
      fail: (error) => alert('Не удалось отправить запрос: ' + (error.message || error)),
      sync: async () => { await loadGroupMatchesFromDB(); if (status === 'accepted') await refreshGroupsWorld(); repaintGroupsWorld(); },
    }).then((ok) => (ok ? status || 'pending' : null));
  }

  /* ═══════ ФИЛЬТРЫ ЛЕНТЫ ═══════
     Отбирают чужие группы в ленте — по среднему возрасту и составу. Свои группы в ленту не попадают вовсе. */
  const FILTERS_KEY = 'feed.filters.v1';
  const DEFAULT_FILTERS = { ageOn: false, age: 20, spread: 2, comp: 'all' };
  const COMP_LABELS = { all: 'Любой', male: 'Только парни', female: 'Только девушки', mixed: 'Смешанный' };
  const FILTER_AGE_MIN = 18, FILTER_AGE_MAX = 70;
  function loadFilters() {
    try {
      // фильтры прежней версии переносим как есть — без «расстояния», его больше нет
      const raw = localStorage.getItem(FILTERS_KEY) || localStorage.getItem('map.filters.v1');
      const f = raw ? { ...DEFAULT_FILTERS, ...JSON.parse(raw) } : { ...DEFAULT_FILTERS };
      delete f.radius;
      // порог 18+ : старое сохранённое значение ниже 18 подтягиваем к 18, чтобы ползунок и число совпадали
      f.age = Math.min(FILTER_AGE_MAX, Math.max(FILTER_AGE_MIN, Number(f.age) || DEFAULT_FILTERS.age));
      return f;
    } catch { return { ...DEFAULT_FILTERS }; }
  }
  function saveFilters() {
    try { localStorage.setItem(FILTERS_KEY, JSON.stringify(feedFilters)); localStorage.removeItem('map.filters.v1'); } catch {}
  }
  let feedFilters = loadFilters();

  // Сводка по группам: средний возраст и сколько парней/девушек (считает сервер)
  let groupStats = new Map();
  let groupStatsFailed = false;
  async function loadGroupStats() {
    if (!currentUser) { groupStats = new Map(); return; }
    const { data, error } = await supabaseClient.rpc('get_group_stats');
    if (error) { console.warn('[group stats]', error.message); groupStatsFailed = true; return; }
    groupStatsFailed = false;
    groupStats = new Map((data || []).map((r) => [String(r.group_id), {
      avgAge: r.avg_age != null ? Number(r.avg_age) : null,
      males: r.males || 0, females: r.females || 0, total: r.total || 0,
    }]));
    mergeBots();   // сводка групп-ботов: средний возраст и состав
    scheduleFeedRender();
  }

  function groupComposition(st) {
    if (!st) return null;
    if (st.males && st.females) return 'mixed';
    if (st.males) return 'male';
    if (st.females) return 'female';
    return null; // пол участников не указан
  }

  function groupStatsText(g) {
    const st = groupStats.get(String(g.id));
    if (!st) return '';
    const bits = [];
    if (st.avgAge != null) bits.push(`средний возраст ${Math.round(st.avgAge)}`);
    const comp = groupComposition(st);
    if (comp) bits.push({ male: 'парни', female: 'девушки', mixed: 'смешанный состав' }[comp]);
    return bits.join(' · ');
  }

  function filtersActive() { return !!feedFilters.ageOn || feedFilters.comp !== 'all'; }

  function groupPassesFilters(g) {
    if (!filtersActive()) return true;
    const st = groupStats.get(String(g.id));
    if (feedFilters.ageOn) {
      // «20 лет, ±0» — средний возраст, который округляется до 20
      if (!st || st.avgAge == null || Math.abs(st.avgAge - feedFilters.age) > feedFilters.spread + 0.5) return false;
    }
    if (feedFilters.comp !== 'all' && groupComposition(st) !== feedFilters.comp) return false;
    return true;
  }

  function updateFilterDot() {
    const dot = document.getElementById('filter-dot');
    if (dot) dot.hidden = !filtersActive();
  }

  let filtersApplyTimer = null;
  function applyFeedFilters() {
    saveFilters();
    updateFilterDot();
    scheduleFeedRender();
    clearTimeout(filtersApplyTimer);
    // Имена и фото нужны лидерам групп, которые только что прошли фильтр
    filtersApplyTimer = setTimeout(() => loadGroupMemberProfiles(), 200);
  }

  /* Перечитать группы, match, сводку, приглашения и заявки — и всё, что от них зависит */
  async function refreshGroupsWorld() {
    await Promise.all([loadGroupsFromDB(), loadGroupMatchesFromDB(), loadGroupStats(), loadGroupInvitesFromDB(), loadJoinRequestsFromDB()]);
    await loadGroupMemberProfiles();
    scheduleFeedRender();
  }

  /* Любое изменение любой группы (у кого угодно) перечитывает все группы с фото и составами — это тяжёлый запрос.
     Изменения приходят пачками, поэтому ждём 1.2 с тишины и читаем один раз; пока приложение свёрнуто — не читаем
     вовсе, а обновляемся один раз, когда его откроют */
  let groupsWorldTimer = null, groupsWorldStale = false;
  function scheduleGroupsWorldRefresh() {
    clearTimeout(groupsWorldTimer);
    if (document.hidden) { groupsWorldStale = true; return; }
    groupsWorldTimer = setTimeout(async () => {
      await refreshGroupsWorld();
      onMatchesChanged();   // открытый совместный чат: обновить голосование или закрыть, если союз распался
      // Открытый список групп обновляем на месте, чтобы он не показывал устаревшее
      refreshGroupsList();
    }, 1200);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !groupsWorldStale || !currentUser) return;
    groupsWorldStale = false;
    scheduleGroupsWorldRefresh();
  });

  async function loadNotificationsFromDB() {
    if (!currentUser) { notifications = []; return; }
    const { data, error } = await supabaseClient.from('notifications')
      .select('*').eq('user_id', currentUser.id)
      .order('created_at', { ascending: false }).limit(100);
    if (error) { console.warn('[notifications] load:', error.message); return; }
    notifications = (data || []).map(mapNotificationRow);
    await Promise.all([loadIncomingFriendRequests(), loadGroupMatchesFromDB(), loadGroupInvitesFromDB(), loadJoinRequestsFromDB()]);
    refreshNotifications();
    scheduleStateSave();
  }

  // «Группа feat Группа» в текстах с сервера — как везде в приложении: «Группа × Группа»
  const unFeat = (s) => (typeof s === 'string' ? s.replace(/ feat /g, ' × ') : s);
  function mapNotificationRow(n) {
    return {
      id: String(n.id), type: n.type, title: unFeat(n.title), text: unFeat(n.text), read: !!n.read, at: n.created_at || null,
      requestId: n.request_id != null ? String(n.request_id) : null,
      time: fmtRu(new Date(n.created_at), DAY_TIME),
    };
  }

  /* ═══════ ЗАПРОСЫ В ДРУЗЬЯ ═══════
     Входящие заявки показываются во вкладке «Друзья» (над списком), а не в уведомлениях */
  let pendingIncomingRequests = new Set();   // id входящих запросов, ожидающих ответа
  let incomingFriendRequests = [];           // [{ id, fromId, name, handle, avatar }] — свежие первыми
  const friendRequestOutcome = new Map();    // id запроса → 'accepted' | 'declined' (ответ дан в этой сессии)

  async function loadIncomingFriendRequests() {
    if (!currentUser) { pendingIncomingRequests = new Set(); incomingFriendRequests = []; syncRequestBadges(); return; }
    const { data, error } = await supabaseClient.from('friend_requests')
      .select('*').eq('to_id', currentUser.id).eq('status', 'pending');
    if (error) { console.warn('[friend_requests] load:', error.message); return; }
    const rows = (data || []).sort((a, b) => (Date.parse(b.created_at) || 0) - (Date.parse(a.created_at) || 0));
    // имена и фото отправителей; не ответил сервер — остаются известные
    const known = new Map(incomingFriendRequests.map((r) => [String(r.fromId), r]));
    const ids = [...new Set(rows.map((r) => r.from_id))].filter(Boolean);
    let profs = [];
    if (ids.length) {
      const { data: p, error: pErr } = await supabaseClient.from('profiles').select('id,name,username,avatar').in('id', ids);
      if (pErr) console.warn('[friend_requests] profiles:', pErr.message); else profs = p || [];
    }
    const byId = new Map(profs.map((p) => [String(p.id), p]));
    pendingIncomingRequests = new Set(rows.map((r) => String(r.id)));
    incomingFriendRequests = rows.map((r) => {
      const p = byId.get(String(r.from_id)), was = known.get(String(r.from_id));
      return {
        id: String(r.id), fromId: String(r.from_id),
        name: (p && p.name) || (was && was.name) || 'Пользователь',
        handle: p ? '@' + p.username : (was ? was.handle : ''),
        avatar: (p && p.avatar) || (was && was.avatar) || '',
      };
    });
    syncRequestBadges();
  }

  /* Цифры на вкладках «Друзья» и «Группы»: сколько заявок в друзья и приглашений в группы ждут ответа */
  function syncRequestBadges() {
    const put = (id, n) => {
      const el = document.getElementById(id);
      if (el) { el.textContent = n > 99 ? '99+' : String(n); el.hidden = !(n > 0); }
    };
    put('friends-badge', currentUser ? incomingFriendRequests.length : 0);
    put('groups-badge', currentUser ? myPendingInvites().length + joinRequestsToMe().length : 0);
  }

  /* Состояние отношений с пользователем для кнопки в поиске */
  async function friendRelationWith(userId) {
    if (friends.some((f) => f.id === userId)) return 'friend';
    const { data, error } = await supabaseClient.from('friend_requests')
      .select('id, from_id, to_id')
      .eq('status', 'pending')
      .or(`and(from_id.eq.${currentUser.id},to_id.eq.${userId}),and(from_id.eq.${userId},to_id.eq.${currentUser.id})`);
    if (error) { console.warn('[friend_requests] relation:', error.message); return 'none'; }
    const rows = data || [];
    if (rows.some((r) => r.from_id === currentUser.id)) return 'outgoing';
    if (rows.some((r) => r.from_id === userId)) return 'incoming';
    return 'none';
  }

  function respondFriendRequest(requestId, accept) {
    const id = String(requestId);
    const req = incomingFriendRequests.find((r) => r.id === id);
    const before = { list: incomingFriendRequests, pending: new Set(pendingIncomingRequests), friends, notifications };
    const repaint = () => { syncRequestBadges(); refreshFriendsList(); refreshNotifications(); scheduleStateSave(); };
    return optimistic({
      apply() {
        pendingIncomingRequests.delete(id);
        incomingFriendRequests = incomingFriendRequests.filter((r) => r.id !== id);
        friendRequestOutcome.set(id, accept ? 'accepted' : 'declined');
        notifications = notifications.map((n) => n.requestId === id ? { ...n, read: true } : n);
        // принял — человек сразу в друзьях
        if (accept && req && !friends.some((f) => String(f.id) === String(req.fromId))) {
          friends = [...friends, { id: req.fromId, name: req.name || 'Пользователь', handle: req.handle || '', avatar: req.avatar || '' }];
        }
        repaint();
      },
      send: () => supabaseClient.rpc(accept ? 'accept_friend_request' : 'decline_friend_request', { req_id: Number(id) }),
      undo() {
        incomingFriendRequests = before.list; pendingIncomingRequests = before.pending; friends = before.friends; notifications = before.notifications;
        friendRequestOutcome.delete(id); repaint();
      },
      fail: (error) => alert('Не удалось ответить на запрос: ' + (error.message || error)),
      sync: async () => { if (!accept) return; await loadFriendsFromDB(); await loadGroupMemberProfiles(); refreshFriendsList(); },
    });
  }

  /* Сбой сети не стирает друзей: список остаётся прежним до следующей удачной загрузки. Раньше пустой список
     на миг стирал друзей, и они не возвращались до перезагрузки */
  async function loadFriendsFromDB() {
    if (!currentUser) { friends = []; return; }
    const { data, error } = await supabaseClient.from('friendships').select('friend_id').eq('user_id', currentUser.id);
    if (error) { console.warn('[friends] load:', error.message); return; }
    const ids = (data || []).map((r) => r.friend_id);
