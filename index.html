      background: var(--prism); color: var(--prism-ink); font-weight: 800; box-shadow: 0 0 0 2px var(--win);
    }
    #filter-btn .filter-dot { top: 8px; right: 8px; width: 8px; height: 8px; background: var(--prism); box-shadow: 0 0 0 2px var(--win); }
    body.app-window .map-tools { opacity: 0; transform: translateY(-8px); pointer-events: none; }
    body.app-window .map-tools #notif-btn, body.app-window .map-tools #filter-btn, body.app-window .map-tools #settings-btn { display: grid !important; }
    body.auth-locked .map-tools { display: none; }
    .geo-btn {
      width: 50px; height: 50px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink);
      box-shadow: 0 16px 36px -14px var(--glass-shadow), inset 0 1px 0 var(--rim);
    }
    .geo-btn:hover { color: var(--ink); }
    .geo-btn.is-active { background: var(--glass); color: var(--ink); border-color: var(--glass-edge); box-shadow: 0 16px 36px -14px var(--glass-shadow), inset 0 1px 0 var(--rim); }
    .geo-btn.is-active svg { stroke: url(#prismIcon); }
    .geo-btn.is-active .ic-fill { fill: url(#prismIcon); }

    /* ── Маркеры на карте ── */
    .user-badge-inner { background: var(--win); border: 1px solid var(--win-line); box-shadow: 0 10px 22px -8px rgba(10, 10, 16, .38); }
    .user-badge::after { background: var(--win); }
    .user-badge-avatar { background-color: var(--you); }
    .user-badge-status, .user-badge-status[aria-hidden] { background: var(--c1); }
    .user-dot-marker { background: var(--you); box-shadow: 0 0 0 4px rgba(var(--you-rgb), .25), 0 2px 6px rgba(0, 0, 0, .35); }
    .user-badge-inner.is-friend-group { background: #0D3C45; border-color: rgba(var(--lime-rgb), .5); }
    .user-badge-inner.is-friend-group .user-badge-group { color: #A5F1F7; }
    .user-dot-marker.is-friend-group { background: #0D8A98 !important; }
    .user-badge-inner.is-group { background: #131318; border-color: rgba(var(--you-rgb), .55); }
    .user-badge-inner.is-group .user-badge-group { color: var(--you-soft); }
    .user-dot-marker.is-group { background: #131318 !important; }
    .map-group-chip { background: #131318; border-color: rgba(var(--lime-rgb), .45); box-shadow: 0 10px 22px -8px rgba(0, 0, 0, .45); }
    .map-group-ava { background: linear-gradient(145deg, var(--c1), var(--c3)); }
    .map-group-count { color: #A5F1F7; background: rgba(255, 255, 255, .1); }
    .user-badge.is-leader::after { background: #131318; border-color: rgba(var(--lime-rgb), .45); }
    .user-dot-marker.is-leader { background: #131318 !important; box-shadow: 0 0 0 2px var(--c1), 0 2px 6px rgba(0, 0, 0, .35); }
    /* кольца под маркером — спектральные (у групп — холодная часть спектра) */
    .signal-rings i {
      border: 0; background: var(--prism-conic);
      -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2.4px), #000 calc(100% - 1.6px));
              mask: radial-gradient(closest-side, transparent calc(100% - 2.4px), #000 calc(100% - 1.6px));
    }
    .signal-rings.is-group i { background: linear-gradient(90deg, var(--c1), var(--c2), var(--c1)); }
    /* облака желаний: кант-спектр (у групп — аква → синий) */
    /* спрятанное облако (перекрывало бы другое) и облачко «…» вместо него */
    .wish-cloud { transition: transform .25s var(--ease), opacity .22s ease, visibility 0s; }
    .wish-cloud.is-tucked { opacity: 0; visibility: hidden; pointer-events: none; transition: transform .25s var(--ease), opacity .22s ease, visibility 0s linear .22s; }
    .wish-peek {
      position: absolute; top: -24px; left: 0; display: none; align-items: center; justify-content: center; gap: 2.5px;
      width: 30px; height: 18px; border-radius: 10px; pointer-events: auto; cursor: pointer;
      border: 1.5px solid transparent; background: linear-gradient(var(--win), var(--win)) padding-box, var(--prism) border-box;
      box-shadow: 0 4px 10px -3px rgba(0, 0, 0, .35);
      transform: scale(var(--wish-k, 1)); transform-origin: 0 100%;
      animation: wc-in .4s var(--spring) both;
    }
    .wish-anchor.is-left .wish-peek { left: auto; right: 0; transform-origin: 100% 100%; }
    .wish-peek i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink); opacity: .7; }
    .wish-anchor.is-tucked .wish-peek { display: flex; }
    .wish-anchor.is-tucked.is-pair ~ .wish-anchor.is-tucked .wish-peek { top: -44px; }    .wish-cloud { --wc-fill: #FFFFFF; --wc-ink: #111114; --wc-edge: #111114; --wc-accent: url(#wcPrism); --wc-cap: var(--c3); }
    .wish-cloud.is-group { --wc-accent: url(#wcCool); --wc-cap: var(--lime-deep); }
    :root[data-theme="dark"] .wish-cloud { --wc-fill: #141419; --wc-ink: #F3F3F5; --wc-edge: #050507; --wc-cap: var(--c3); }
    :root[data-theme="dark"] .wish-cloud.is-group { --wc-cap: var(--c1); }
    .wish-place-dot { background: var(--prism); }
    /* воспоминания — белые «полароиды» */
    .memory-card, :root[data-theme="dark"] .memory-card { background: #FFFFFF; }
    .memory-card::after, :root[data-theme="dark"] .memory-card::after { background: rgba(17, 17, 20, .14); }
    .memory-card .mc-img.no-photo { background: #EEEDEA; color: #6D6D77; }
    .memory-marker::after, :root[data-theme="dark"] .memory-marker::after { background: #111114; }
    .memory-more, :root[data-theme="dark"] .memory-more { background: #111114; }

    /* ── Появление интерфейса после входа: капсулы съезжаются к краям ── */
    body.chrome-enter .menubar { animation: chrome-down .8s var(--ease) .05s both; }
    body.chrome-enter .map-tools { animation: chrome-down .8s var(--ease) .14s both; }
    body.chrome-enter .dock-wrap { animation: chrome-up .9s var(--spring) .2s both; }
    body.chrome-enter .geo-btn { animation: chrome-pop .7s var(--spring) .38s both; }
    @keyframes chrome-down { from { opacity: 0; transform: translateY(-22px) scale(.96); } }
    @keyframes chrome-up { from { opacity: 0; transform: translateY(40px) scale(.94); } }
    @keyframes chrome-pop { from { opacity: 0; transform: scale(.4); } }

    /* ── Всплеск при нажатии: тонкое спектральное кольцо расходится из точки касания ── */
    .tap-layer { position: fixed; inset: 0; z-index: 400; pointer-events: none; overflow: hidden; contain: strict; }
    .tap-ring {
      position: absolute; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 50%;
      background: conic-gradient(from 210deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c1));
      -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 4.2px), #000 calc(100% - 3.2px), #000 calc(100% - .6px), transparent 100%);
              mask: radial-gradient(closest-side, transparent calc(100% - 4.2px), #000 calc(100% - 3.2px), #000 calc(100% - .6px), transparent 100%);
      animation: tap-ring .62s cubic-bezier(.2, .8, .25, 1) forwards;
    }
    @keyframes tap-ring {
      0% { transform: scale(.1); opacity: 1; }
      45% { opacity: .95; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* ── Экран входа: космос всегда тёмный, спектр — пастельный ── */
    .auth-screen {
      --c1: var(--a1); --c2: var(--a2); --c3: var(--a3); --c4: var(--a4);
      --prism: linear-gradient(115deg, var(--c1) 0%, var(--c2) 34%, var(--c3) 66%, var(--c4) 100%);
      --prism-glow: -12px 12px 28px -14px var(--c1), 12px 12px 28px -14px var(--c4), 0 16px 30px -16px var(--c3);
      background:
        radial-gradient(60vmax 50vmax at var(--gx, 50%) var(--gy, 45%), color-mix(in srgb, var(--c2) 10%, transparent), transparent 62%),
        radial-gradient(70vmax 55vmax at 0% 0%, color-mix(in srgb, var(--c3) 10%, transparent), transparent 60%),
        radial-gradient(70vmax 55vmax at 100% 100%, color-mix(in srgb, var(--c1) 7%, transparent), transparent 60%),
        var(--a-bg);
    }
    .auth-card {
      background: var(--a-card); border: 1px solid rgba(255, 255, 255, .08); border-radius: 26px; color: #F3F3F5;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .06);
    }
    .auth-title, .auth-step-title { color: #F3F3F5; }
    .auth-card .auth-title { font-size: 18px; }
    .auth-card .auth-step-title { font-size: 15px; }
    .auth-sub, .auth-step-sub, .auth-hint, .auth-divider, .auth-label { color: #8C8C97; }
    .auth-label { padding-left: 4px; }
    .auth-eyebrow { background: var(--prism); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .auth-input, .auth-card .edit-input, .auth-card .edit-textarea, .auth-card .username-wrap {
      background: rgba(255, 255, 255, .06); border: 1.5px solid transparent; border-radius: 16px; color: #F3F3F5;
    }
    .auth-input::placeholder { color: #5E5E68; }
    .auth-input:focus, .auth-card .edit-input:focus, .auth-card .edit-textarea:focus, .auth-card .username-wrap:focus-within {
      background: rgba(255, 255, 255, .08); border-color: rgba(243, 243, 245, .85); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c3) 22%, transparent);
    }
    .auth-card .username-prefix { color: #8C8C97; }
    .auth-btn {
      border-radius: 999px; background: var(--a-act); color: var(--a-act-ink); font-weight: 800; letter-spacing: -.005em;
      box-shadow: var(--prism-glow); transition: transform .4s var(--spring), box-shadow .3s ease, filter .2s;
    }
    .auth-btn:hover { filter: none; box-shadow: -14px 14px 34px -12px var(--c1), 14px 14px 34px -12px var(--c4), 0 18px 34px -14px var(--c3); }
    .auth-btn:active { transform: scale(.95); }
    .auth-link, .auth-link:hover {
      background: var(--prism); -webkit-background-clip: text; background-clip: text; color: transparent;
      text-decoration-color: color-mix(in srgb, var(--c3) 70%, transparent);
    }
    .auth-step-dot { background: rgba(255, 255, 255, .14); }
    .auth-step-dot.active { background: var(--prism); }
    .auth-step-dot.done { background: rgba(255, 255, 255, .42); }
    .gender-opt { border-radius: 18px; border-color: rgba(255, 255, 255, .1); background: rgba(255, 255, 255, .04); }
    .gender-opt[aria-pressed="true"] { border-color: var(--c3); background: color-mix(in srgb, var(--c3) 12%, transparent); }
    .auth-age-row input[type="range"] { accent-color: var(--c3); }
    .auth-card .btn { background: rgba(255, 255, 255, .08); color: #F3F3F5; box-shadow: none; }
    .auth-card .btn-ghost { color: var(--c3); }
    .auth-avatar-preview { background: linear-gradient(145deg, var(--c1), var(--c3)); }

    /* ── Фильтры: две спокойные карточки и нижняя строка с итогом ── */
    .flt { display: flex; flex-direction: column; gap: 10px; min-height: 100%; padding: 4px 14px 16px; }
    .flt-card { display: grid; gap: 16px; padding: 18px; border-radius: 24px; background: var(--field); }
    .flt-head { display: flex; align-items: center; gap: 12px; }
    .flt-head-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
    .flt-title { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
    .flt-sub { font-size: 12.5px; color: var(--ink-soft); }
    .flt-card.is-off .flt-age-body { display: none; }
    .flt-age-body { display: grid; gap: 12px; animation: scr-rise .35s var(--ease) both; }
    .flt-big { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 34px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
    .flt-big small { font: 500 10.5px var(--font-mono); letter-spacing: .13em; text-transform: uppercase; color: var(--ink-soft); }
    .flt-range { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer; --p: 0%; }
    .flt-range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--prism) 0 / var(--p) 100% no-repeat, var(--win-line); }
    .flt-range::-moz-range-track { height: 6px; border-radius: 3px; background: var(--prism) 0 / var(--p) 100% no-repeat, var(--win-line); }
    .flt-range::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .32), 0 0 0 .5px rgba(0, 0, 0, .08); transition: transform .3s var(--spring); }
    .flt-range::-moz-range-thumb { width: 24px; height: 24px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .32), 0 0 0 .5px rgba(0, 0, 0, .08); }
    .flt-range:active::-webkit-slider-thumb { transform: scale(1.15); }
    .flt-range:focus-visible { outline: none; }
    .flt-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 2px 8px rgba(0, 0, 0, .32), 0 0 0 4px rgba(var(--you-rgb), .3); }
    .flt-spread { display: flex; align-items: center; gap: 6px; }
    .flt-spread-label { flex: 1; font: 500 10.5px var(--font-mono); letter-spacing: .13em; text-transform: uppercase; color: var(--ink-soft); }
    .flt-chip {
      min-width: 44px; padding: 7px 10px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--win); color: var(--ink-soft); font: 700 12.5px "Manrope", system-ui, sans-serif; font-variant-numeric: tabular-nums;
      transition: background .2s, color .2s, transform .4s var(--spring);
    }
    .flt-chip:active { transform: scale(.9); transition-duration: .08s; }
    .flt-chip[aria-pressed="true"] { background: var(--act); color: var(--act-ink); }
    .flt-comp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .flt-opt {
      display: grid; justify-items: center; gap: 8px; padding: 14px 2px 12px; border: 0; border-radius: 18px; cursor: pointer;
      background: transparent; color: var(--ink-soft); font: 700 12px "Manrope", system-ui, sans-serif; letter-spacing: -.005em;
      transition: background .25s, color .2s, box-shadow .25s, transform .4s var(--spring);
    }
    .flt-opt svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .flt-opt:hover { color: var(--ink); }
    .flt-opt:active { transform: scale(.93); transition-duration: .08s; }
    .flt-opt[aria-pressed="true"] { background: var(--win); color: var(--ink); box-shadow: 0 6px 16px -8px var(--glass-shadow), inset 0 1px 0 var(--rim), inset 0 0 0 1px var(--win-line); }
    .flt-opt[aria-pressed="true"] svg { stroke: url(#prismIcon); }
    .flt-warn { padding: 0 6px; font-size: 12px; color: var(--hot); }
    .flt-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding: 14px 4px 0; }
    .flt-count { flex: 1; min-width: 0; font: 500 10.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
    .flt-foot .btn-ghost { background: transparent; color: var(--ink-soft); padding: 11px 10px; }
    .flt-foot .btn-ghost:hover { color: var(--ink); text-decoration: none; }
    @media (max-width: 420px) {
      .flt-foot { flex-wrap: wrap; }
      .flt-count { flex-basis: 100%; padding: 0 2px 4px; }
      .flt-foot .btn-primary { flex: 1; }
      .flt-big { font-size: 30px; }
    }

    /* ── 3D-аватар: сцена редактора, образцы, маркер на карте ── */
    .avatar-editor { gap: 18px; grid-template-columns: minmax(0, 1fr); }
    .avatar-stage {
      height: 300px; border-radius: 26px; cursor: grab; touch-action: pan-y;
      background:
        radial-gradient(70% 55% at 50% 100%, rgba(var(--you-rgb), .16), transparent 70%),
        radial-gradient(60% 60% at 50% 30%, rgba(var(--lime-rgb), .08), transparent 70%),
        var(--field);
      box-shadow: inset 0 0 0 1px var(--win-line);
    }
    .avatar-stage:active { cursor: grabbing; }
    .avatar-stage-hint {
      position: absolute; left: 16px; top: 14px; pointer-events: none;
      font: 500 10px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); opacity: .75;
      transition: opacity .4s ease;
    }
    .avatar-zoom {
      position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border: 0; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer; color: var(--ink);
      background: var(--glass); box-shadow: 0 8px 20px -8px var(--glass-shadow), inset 0 1px 0 var(--rim), inset 0 0 0 1px var(--glass-edge);
      transition: transform .4s var(--spring), background .2s, color .2s;
    }
    .avatar-zoom svg { width: 19px; height: 19px; }
    .avatar-zoom:active { transform: scale(.86); }
    .avatar-zoom[aria-pressed="true"] { background: var(--act); color: var(--act-ink); }
    .avatar-controls { display: grid; gap: 16px; }
    .avatar-row { gap: 9px; }
    .avatar-swatch {
      width: 34px; height: 34px; border: 0; border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .14);
      transition: transform .4s var(--spring), box-shadow .2s;
    }
    .avatar-swatch[aria-pressed="true"] { transform: scale(1.06); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .14), 0 0 0 2.5px var(--win), 0 0 0 4.5px var(--ink); }
    :root[data-theme="dark"] .avatar-swatch { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); }
    :root[data-theme="dark"] .avatar-swatch[aria-pressed="true"] { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), 0 0 0 2.5px var(--win), 0 0 0 4.5px var(--ink); }
    .avatar-stage.is-touched .avatar-stage-hint { opacity: 0; }
    .avatar-pill { border-radius: 999px; padding: 8px 15px; font-weight: 650; transition: background .2s, color .2s, transform .4s var(--spring); }
    .avatar-pill:active, .avatar-swatch:active { transform: scale(.9); transition-duration: .08s; }
    .user-avatar-wrap { width: 44px; height: 44px; }
    .user-profile-avatar:not(.no-3d) { background: radial-gradient(circle at 50% 80%, rgba(var(--you-rgb), .2), transparent 70%), var(--field); }
    /* выбор пола при регистрации — портреты аватаров */
    .gender-opt .gender-ava {
      width: 76px; height: 76px; border-radius: 50%; display: block;
      background: radial-gradient(circle at 50% 75%, color-mix(in srgb, var(--a3) 28%, transparent), rgba(255, 255, 255, .04) 72%);
      transition: transform .4s var(--spring), box-shadow .25s;
    }
    .gender-opt[aria-pressed="true"] .gender-ava { transform: scale(1.06); box-shadow: 0 0 0 2px var(--a3), 0 10px 26px -8px color-mix(in srgb, var(--a3) 60%, transparent); }
    @media (max-width: 640px) {
      .avatar-stage { height: 260px; }
      .gender-opt .gender-ava { width: 64px; height: 64px; }
    }

    /* ── Телефоны ── */
    @media (max-width: 640px) {
      .menubar { height: 46px; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); }
      .map-tools { height: 46px; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); padding: 0 3px; gap: 0; }
      .map-tools #notif-btn, .map-tools #filter-btn, .map-tools #settings-btn { width: 39px; height: 39px; }
      .geo-btn { width: 48px; height: 48px; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
      .dock-wrap { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
      .dock, :root[data-theme="dark"] .dock { border-radius: 26px; }
      .dock-item { width: 66px; }
      .dock-btn, .dock-item[data-open="true"] .dock-btn { height: 48px; gap: 3px; border-radius: 20px; padding: 0; }
      .dock-btn svg { width: 22px; height: 22px; }
      .dock-pill { border-radius: 20px; }
      .dock-label, .dock-item[data-open="true"] .dock-label { font-size: 10px; }
      .window { border-radius: 28px; }
      .win-title { font-size: 14.5px; }
      .ph-name { font-size: 20px; }
    }
    @media (max-width: 380px) {
      .dock-item { width: 60px; }
      .dock-btn, .dock-item[data-open="true"] .dock-btn { padding: 0; }
    }
    @media (max-width: 350px) { .dock-item { width: 54px; } }
    @media (max-height: 480px) and (orientation: landscape) {
      .menubar, .map-tools { top: calc(8px + env(safe-area-inset-top, 0px)); height: 42px; }
      .map-tools #notif-btn, .map-tools #filter-btn, .map-tools #settings-btn { width: 36px; height: 36px; }
      .dock-btn, .dock-item[data-open="true"] .dock-btn { height: 40px; }
      .dock-label { display: none; }
      .dock-pill::after { bottom: 2px; }
    }

    /* ── Чат: меню сообщения, выбор нескольких, закреплённое ── */
    .chat-msg { position: relative; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: opacity .2s ease, box-shadow .2s ease; }
    .chat-view.is-selecting .chat-msg { cursor: pointer; }
    .chat-view.is-selecting .chat-msg:not(.is-selected) { opacity: .5; }
    .chat-msg.is-selected { box-shadow: 0 0 0 2px var(--win), 0 0 0 4px var(--c2); }
    .chat-msg.is-flash { animation: msg-flash 1.2s ease; }
    @keyframes msg-flash { 0%, 55% { box-shadow: 0 0 0 2px var(--win), 0 0 0 4px var(--c3); } }
    .chat-pin {
      display: flex; align-items: center; gap: 10px; margin: 0 12px 6px; padding: 7px 6px 7px 10px;
      border-radius: 16px; background: var(--field); cursor: pointer; transition: background .2s;
    }
    .chat-pin:hover { background: var(--row-hover); }
    .chat-pin::before { content: ""; flex: none; width: 3px; align-self: stretch; border-radius: 3px; background: var(--prism); }
    .chat-pin-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
    .chat-pin-cap { font: 500 10px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
    .chat-pin-text { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-pin-x {
      flex: none; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft);
      font-size: 19px; line-height: 1; cursor: pointer; transition: background .2s, color .2s;
    }
    .chat-pin-x:hover { background: var(--win); color: var(--ink); }
    .chat-selbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px 12px; background: var(--win); }
    .chat-selbar .btn { padding: 10px 14px; font-size: 13px; }
    .chat-selbar .btn:disabled { opacity: .4; cursor: default; }
    .chat-sel-count { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 13px; white-space: nowrap; }
    .msg-menu { z-index: 8; min-width: 190px; transform-origin: 0 0; }
    .fwd-list { list-style: none; margin: 4px -8px 14px; padding: 0; max-height: min(46vh, 320px); overflow: auto; }
    .fwd-list .person-card { padding: 8px 10px; cursor: pointer; }
    .del-actions { flex-wrap: wrap; }

    /* ── Кнопка «моё место» — в правом нижнем углу, на одной линии с панелью вкладок ── */
    .geo-btn { right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
    @media (max-width: 640px) {
      .geo-btn { width: 48px; height: 48px; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
    }
    /* На телефоне панель по центру не оставляет места сбоку: она занимает ширину слева, кнопка — справа от неё */
    @media (max-width: 520px) {
      .dock-wrap { justify-content: flex-start; padding: 0 calc(max(10px, env(safe-area-inset-right, 0px)) + 56px) 0 max(10px, env(safe-area-inset-left, 0px)); }
      .dock, :root[data-theme="dark"] .dock { flex: 1; max-width: none; }
      .dock-item { flex: 1 1 0; width: auto; min-width: 0; }
    }
    @media (max-height: 480px) and (orientation: landscape) {
      .geo-btn { width: 44px; height: 44px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }

    /* ═══════════════════ ЦВЕТОВЫЕ СХЕМЫ ═══════════════════

  const Globe = (() => {
    let renderer = null, scene = null, camera = null, earth = null, glow = null, rimLight = null, rimLight2 = null;
    let rafId = null, running = false, initialized = false, flying = false;
    const markers = [];        // { vec, sprite, line } — line ведёт из предыдущей точки

    const camDir = new THREE.Vector3(0.35, 0, 1).normalize();

    let lockedHeight = 0;       // высота холста, пока открыта экранная клавиатура
    let currentDir = null;
    let layoutInfo = null;      // { cx, cy, r, logoTop, logoH, portrait, w, h } — раскладка сцены в пикселях
    let readyResolve = null;
    const readyPromise = new Promise((r) => { readyResolve = r; });
    const layoutListeners = [];
    // Стороны, с которых карточка может встать у крестика, и отступы карточки от крестика и от краёв экрана
    const SIDES = { right: [1, 0], left: [-1, 0], above: [0, -1], below: [0, 1] };
    const CARD_GAP = 26, CARD_EDGE = 12;

    const STEP_ANGLE = 0.62;
    const MAX_TURN = Math.PI * 35 / 180;
    const MARKER_RADIUS = 1.04;
    const LINE_RADIUS = 1.004;   // почти на поверхности — у края глобуса пунктир с обратной стороны не выглядывает
    const MIN_MARKER_DIST = 0.45;
    const MARKER_SIZE = 0.22;

    const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      if (!initialized || !running) { update(1); return Promise.resolve(); }

      return new Promise((res) => tweens.push({ start: null, dur: Math.max(1, dur), update, res }));

    function latLonToVec3(lat, lon, r) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;

        -r * Math.sin(phi) * Math.cos(theta),

    function slerpVec(a, b, t) {
      const ang = a.angleTo(b);
      if (ang < 1e-6) return a.clone();
      const s = Math.sin(ang);
      return a.clone().multiplyScalar(Math.sin((1 - t) * ang) / s).add(b.clone().multiplyScalar(Math.sin(t * ang) / s));
    }

    function makeMarkerTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.save();
      ctx.translate(64, 64);
      ctx.rotate(Math.PI / 4);
      ctx.strokeStyle = '#F5F6FF';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.shadowColor = schemeColor('--a3', '#9D86FF');
      ctx.shadowBlur = 14;
      const arm = 22;
      ctx.beginPath();
      ctx.moveTo(-arm, 0); ctx.lineTo(arm, 0);
      ctx.moveTo(0, -arm); ctx.lineTo(0, arm);
      ctx.stroke();
      ctx.restore();
      const tex = new THREE.CanvasTexture(c);
      if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Цвет из текущей схемы (переменная CSS) или запасной
    function schemeColor(name, fallback) {
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return /^#[0-9a-f]{6}$/i.test(v) ? v : fallback;
    }
    // Контровой свет и ореол глобуса — в цветах выбранной схемы
    function tint() {
      if (!initialized) return;
      rimLight.color.set(schemeColor('--a3', '#A77BFF'));
      rimLight2.color.set(schemeColor('--a1', '#45D9E8'));
      glow.material.color.set(schemeColor('--a2', '#8C7CFF'));
      tintEarth();
      if (!running && renderer) renderer.render(scene, camera);
    }

    /* Сама планета — в цвете схемы. У «Призмы» текстура как есть (сине-фиолетовая); для остальных схем
       берётся её чёрно-белая копия, а оттенок задают цвет материала, его свечение и основной свет. */
    const EARTH_LOOK = {
      prism: { gray: false, color: 0xC2C8F2, emissive: 0x10122A, specular: 0x343A70, key: 0xDCE4FF },
      acid:  { gray: true,  color: 0xD2F56E, emissive: 0x0C1603, specular: 0x4A6A14, key: 0xF2FFD0 },
      ember: { gray: true,  color: 0xFF9A66, emissive: 0x200A04, specular: 0x703418, key: 0xFFE4D0 },
      frost: { gray: true,  color: 0xA8D8FF, emissive: 0x06142A, specular: 0x2C5C90, key: 0xE4F4FF },
    };
    let earthTex = null, earthTexGray = null, keyLight = null;
    function grayTexture(tex) {
      const img = tex.image;
      const c = document.createElement('canvas');
      c.width = img.naturalWidth || img.width; c.height = img.naturalHeight || img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, c.width, c.height), px = data.data;
      for (let i = 0; i < px.length; i += 4) {
        // яркость с запасом: после умножения на цвет схемы суша не должна стать темнее, чем в «Призме»
        const l = Math.min(255, (px[i] * 0.3 + px[i + 1] * 0.5 + px[i + 2] * 0.2) * 1.5);
        px[i] = px[i + 1] = px[i + 2] = l;
      }
      ctx.putImageData(data, 0, 0);
      const out = new THREE.CanvasTexture(c);
      if (THREE.SRGBColorSpace) out.colorSpace = THREE.SRGBColorSpace;
      out.anisotropy = tex.anisotropy;
      return out;
    }
    function tintEarth() {
      if (!earth) return;
      const look = EARTH_LOOK[document.documentElement.getAttribute('data-palette')] || EARTH_LOOK.prism;
      if (keyLight) keyLight.color.setHex(look.key);
      const m = earth.material;
      if (!earthTex) { m.emissive.setHex(look.gray ? look.emissive : 0x2A2F6B); return; }   // текстура ещё не загружена
      let map = earthTex;
      if (look.gray) {
        try { map = earthTexGray || (earthTexGray = grayTexture(earthTex)); }
        catch (err) { console.warn('[globe] tint:', err); map = earthTex; }
      }
      if (m.map !== map) { m.map = map; m.needsUpdate = true; }
      m.color.setHex(look.color); m.emissive.setHex(look.emissive); m.specular.setHex(look.specular);
    }

    function addMarkerSprite(vec) {
      const mat = new THREE.SpriteMaterial({ map: makeMarkerTexture(), transparent: true, depthTest: true, depthWrite: false });
      const s = new THREE.Sprite(mat);
      s.position.copy(vec.clone().multiplyScalar(MARKER_RADIUS));
      s.scale.set(0, 0, 0);
      s.userData.alpha = 1;   // «своя» прозрачность; итоговая ещё гасится, когда крестик уходит за край
      earth.add(s);
      return s;
    }

    /* Пунктир по дуге большого круга: каждый штрих — узкий четырёхугольник,
       лежащий на сфере. Дорисовка — через drawRange по штрихам. */
    function buildDashedArc(a, b) {
      const len = a.angleTo(b) * LINE_RADIUS;
      const DASH = 0.032, GAP = 0.022, W = 0.009;
      const n = Math.max(1, Math.floor((len + GAP) / (DASH + GAP)));
      const pos = [], idx = [];
      const at = (s) => slerpVec(a, b, s / len).normalize().multiplyScalar(LINE_RADIUS);
      for (let i = 0; i < n; i++) {
        const s0 = i * (DASH + GAP), s1 = Math.min(len, s0 + DASH);
        const p0 = at(s0), p1 = at(s1);
        const mid = p0.clone().add(p1).normalize();
        const side = new THREE.Vector3().subVectors(p1, p0).cross(mid).normalize().multiplyScalar(W / 2);
        const base = pos.length / 3;
        for (const p of [p0.clone().sub(side), p0.clone().add(side), p1.clone().add(side), p1.clone().sub(side)]) pos.push(p.x, p.y, p.z);
        idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setIndex(idx);
      geo.setDrawRange(0, 0);
      const mat = new THREE.MeshBasicMaterial({ color: 0xDCE2FF, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData.dashCount = n;
      earth.add(mesh);
      return mesh;
    }
    function setArcProgress(mesh, t) {
      mesh.geometry.setDrawRange(0, Math.ceil(mesh.userData.dashCount * t) * 6);
    }

    function disposeObj(o) {
      if (!o) return;
      if (o.parent) o.parent.remove(o);
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    }

    function perpendicular(v) {
      const ref = Math.abs(v.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      return new THREE.Vector3().crossVectors(v, ref).normalize();
    }

    // Лежит ли точка p (единичный вектор) на дуге a→b
    function onArc(p, a, b) { return Math.abs(a.angleTo(p) + p.angleTo(b) - a.angleTo(b)) < 1e-4; }
    function arcsIntersect(a1, a2, b1, b2) {
      const n1 = new THREE.Vector3().crossVectors(a1, a2);
      const n2 = new THREE.Vector3().crossVectors(b1, b2);
      const l = new THREE.Vector3().crossVectors(n1, n2);
      if (l.lengthSq() < 1e-12) return false;
      l.normalize();
      return [l, l.clone().negate()].some((p) => onArc(p, a1, a2) && onArc(p, b1, b2));
    }

    // Следующая точка маршрута при заданном повороте курса
    function buildNext(prevVec, prevDir, turn) {
      const dir0 = prevDir ? prevDir.clone() : perpendicular(prevVec);
      dir0.sub(prevVec.clone().multiplyScalar(dir0.dot(prevVec))).normalize();
      const dir = dir0.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(prevVec, turn)).normalize();
      const axis = new THREE.Vector3().crossVectors(prevVec, dir).normalize();
      const vec = prevVec.clone().applyQuaternion(new THREE.Quaternion().setFromAxisAngle(axis, STEP_ANGLE)).normalize();
      const newDir = vec.clone().sub(prevVec.clone().multiplyScalar(vec.dot(prevVec))).normalize();
      return { vec, dir: newDir };
    }
    // Не близко к прошлым точкам и без пересечения с нарисованными отрезками — путь не перекрещивается
    function validNext(prevVec, vec) {
      if (markers.some((m) => vec.distanceTo(m.vec) < MIN_MARKER_DIST)) return false;
      for (let i = 0; i < markers.length - 2; i++) {
        if (arcsIntersect(prevVec, vec, markers[i].vec, markers[i + 1].vec)) return false;
      }
      return true;
    }

    /* ── Где встанет карточка ──
       Активный крестик всегда в одной точке экрана (camDir). Карточка встаёт рядом с ним с той стороны,
       где влезает и куда не идёт пунктир от предыдущего крестика. Если пунктир «мешает» всем подходящим
       сторонам, глобус при повороте чуть проворачивается вокруг крестика (roll). */
    const scrA = { x: 0, y: 0 }, scrB = { x: 0, y: 0 };
    function toScreen(localVec, q, out) {
      tmpA.copy(localVec).multiplyScalar(MARKER_RADIUS).applyQuaternion(q).add(earth.position).project(camera);
      out.x = (tmpA.x + 1) / 2 * layoutInfo.w;
      out.y = (1 - tmpA.y) / 2 * layoutInfo.h;
      return out;
    }
    function sideFits(side, m, size) {
      const { w, h } = layoutInfo;
      if (side === 'right') return m.x + CARD_GAP + size.w <= w - CARD_EDGE && size.h <= h - 2 * CARD_EDGE;
      if (side === 'left') return m.x - CARD_GAP - size.w >= CARD_EDGE && size.h <= h - 2 * CARD_EDGE;
      if (side === 'above') return m.y - CARD_GAP - size.h >= CARD_EDGE && size.w <= w - 2 * CARD_EDGE;
      return m.y + CARD_GAP + size.h <= h - CARD_EDGE && size.w <= w - 2 * CARD_EDGE;
    }
    function sideRoom(side, m) {
      const { w, h } = layoutInfo;
      if (side === 'right') return (w - CARD_EDGE - m.x - CARD_GAP) * h;
      if (side === 'left') return (m.x - CARD_GAP - CARD_EDGE) * h;
      if (side === 'above') return (m.y - CARD_GAP - CARD_EDGE) * w;
      return (h - CARD_EDGE - m.y - CARD_GAP) * w;
    }
    // Предпочтение: на широком экране — сбоку, на телефоне стоя — над крестиком (снизу — логотип)
    function sidePenalty(side) {
      return layoutInfo.portrait
        ? { above: 0, below: 2, right: 0.3, left: 0.35 }[side]
        : { right: 0, left: 0.05, above: 0.45, below: 0.9 }[side];
    }
    function planFor(vec, prevVec, size, maxRollSteps = 36) {
      const worldDir = vec.clone().applyQuaternion(earth.quaternion).normalize();
      const q0 = new THREE.Quaternion().setFromUnitVectors(worldDir, camDir).multiply(earth.quaternion);
      const m = toScreen(vec, q0, { x: 0, y: 0 });   // от roll не зависит: крестик на оси поворота
      const near = prevVec ? slerpVec(vec, prevVec, 0.3).normalize() : null;
      const fitting = Object.keys(SIDES).filter((s) => sideFits(s, m, size));
      const list = fitting.length ? fitting
        : [Object.keys(SIDES).reduce((a, b) => (sideRoom(b, m) > sideRoom(a, m) ? b : a))];
      const q = new THREE.Quaternion(), rq = new THREE.Quaternion();
      // насколько пунктир уходит от карточки: 1 — строго в противоположную сторону
      const away = (side, roll) => {
        q.copy(q0);
        if (roll) q.premultiply(rq.setFromAxisAngle(camDir, roll));
        toScreen(near, q, scrA);
        const dx = scrA.x - m.x, dy = scrA.y - m.y, len = Math.hypot(dx, dy) || 1;
        const [sx, sy] = SIDES[side];
        return (-dx * sx - dy * sy) / len;
      };
      let best = null, fallback = null;
      for (const side of list) {
        if (!near) {
          const cost = sidePenalty(side);
          if (!best || cost < best.cost) best = { side, roll: 0, cost };
          continue;
        }
        const a0 = away(side, 0);
        if (!fallback || a0 > fallback.score) fallback = { side, roll: 0, score: a0, cost: 5 };
        let found = null;
        for (let k = 0; k <= maxRollSteps && found === null; k++) {
          for (const sign of k ? [1, -1] : [1]) {
            const roll = sign * k * Math.PI / 36;   // шаг 5°
            if (away(side, roll) >= 0.64) { found = roll; break; }   // пунктир не ближе 50° к карточке
          }
        }
        if (found === null) continue;
        const cost = Math.abs(found) * 0.6 + sidePenalty(side);
        if (!best || cost < best.cost) best = { side, roll: found, cost };
      }
      best = best || fallback || { side: list[0], roll: 0, cost: 9 };
      const target = q0.clone();
      if (best.roll) target.premultiply(new THREE.Quaternion().setFromAxisAngle(camDir, best.roll));
      return { side: best.side, cost: best.cost, target };
    }

    function rotateToQ(target, dur, ease = easeInOut) {
      const from = earth.quaternion.clone();
      return tween(dur, (t) => { earth.quaternion.copy(from).slerp(target, ease(t)); });
    }

    function popSprite(sprite) {
      return tween(POP_DUR, (t) => { const s = MARKER_SIZE * Math.max(0, easeOutBack(t)); sprite.scale.set(s, s, s); });
    }

    // Первый крестик: глобус «доплывает» к нему с небольшого разворота, пока проявляется
    async function placeFirst(size) {
      if (!initialized) return null;
      const lat = (Math.random() * 90) - 45;
      const lon = (Math.random() * 360) - 180;
      const vec = latLonToVec3(lat, lon, 1).normalize();
      currentDir = perpendicular(vec);
      const m = { vec, sprite: addMarkerSprite(vec), line: null };
      markers.push(m);
      earth.quaternion.identity();
      const plan = planFor(vec, null, size);
      earth.quaternion.copy(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -0.6).multiply(plan.target));
      await rotateToQ(plan.target, 1500, easeOut);
      await Promise.race([popSprite(m.sprite), wait(200)]);
      return plan.side;
    }

    /* Следующий этап: пунктир от текущего крестика к новому, глобус доворачивается, появляется крестик.
       Из нескольких вариантов следующей точки берём тот, при котором карточке удобнее всего встать. */
    async function advance(size) {
      if (!initialized) return null;
      const prev = markers[markers.length - 1];
      if (!prev) return placeFirst(size);
      let best = null;
      // из первого крестика путь может пойти в любую сторону, дальше — плавно, без резких поворотов
      const first = markers.length === 1;
      const N = first ? 36 : 25;
      for (let i = 0; i < N; i++) {
        const turn = first
          ? (i / N) * Math.PI * 2
          : ((i / (N - 1)) * 2 - 1) * MAX_TURN * 1.8 + (Math.random() - 0.5) * 0.06;
        const cand = buildNext(prev.vec, currentDir, turn);
        if (!validNext(prev.vec, cand.vec)) continue;
        const plan = planFor(cand.vec, prev.vec, size);
        const cost = plan.cost + (first ? 0 : Math.abs(turn) * 0.35) + Math.random() * 0.12;
        if (!best || cost < best.cost) best = { cand, plan, cost };
      }
      if (!best) {
        const cand = buildNext(prev.vec, currentDir, 0);
        best = { cand, plan: planFor(cand.vec, prev.vec, size) };
      }
      currentDir = best.cand.dir;
      const m = { vec: best.cand.vec, sprite: null, line: buildDashedArc(prev.vec, best.cand.vec) };
      markers.push(m);
      const rot = rotateToQ(best.plan.target, ROT_DUR);
      await tween(LINE_DUR, (t) => setArcProgress(m.line, easeInOut(t)));
      m.sprite = addMarkerSprite(m.vec);
      popSprite(m.sprite);
      await Promise.all([rot, wait(220)]);
      return best.plan.side;
    }

    // Плавно погасить крестики и пунктиры (у крестика меняем userData.alpha, у пунктира — opacity)
    function fadeTargets(list) {
      const items = [];
      for (const m of list) {
        if (m.sprite) items.push({ get: () => m.sprite.userData.alpha, set: (v) => { m.sprite.userData.alpha = v; } });
        if (m.line) items.push({ get: () => m.line.material.opacity, set: (v) => { m.line.material.opacity = v; } });
      }
      const from = items.map((it) => it.get());
      return (k) => items.forEach((it, i) => it.set(from[i] * (1 - k)));
    }

    function fadeOutMarker(m, dur) {
      const apply = fadeTargets([m]);
      return tween(dur, apply).then(() => { disposeObj(m.sprite); disposeObj(m.line); });
    }

    function recomputeDir() {
      if (markers.length >= 2) {
        const a = markers[markers.length - 2].vec, b = markers[markers.length - 1].vec;
        currentDir = b.clone().sub(a.clone().multiplyScalar(b.dot(a))).normalize();
      } else if (markers.length) currentDir = perpendicular(markers[0].vec);
      else currentDir = null;
    }

    /* Шаг назад: последний крестик и его пунктир гаснут, глобус возвращается к предыдущему */
    async function back(size) {
      if (!initialized || markers.length < 2) return null;
      const m = markers.pop();
      recomputeDir();
      const cur = markers[markers.length - 1], prev = markers[markers.length - 2];
      const plan = planFor(cur.vec, prev ? prev.vec : null, size);
      await Promise.all([fadeOutMarker(m, 380), rotateToQ(plan.target, 1100)]);
      return plan.side;
    }

    /* Оставить только первый крестик (возврат ко входу) */
    async function resetToFirst(size) {
      if (!initialized) return null;
      if (!markers.length) return placeFirst(size);
      const extra = markers.splice(1);
      recomputeDir();
      const plan = planFor(markers[0].vec, null, size);
      await Promise.all([...extra.map((m) => fadeOutMarker(m, 420)), rotateToQ(plan.target, 1300)]);
      return plan.side;
    }

    /* Сторона карточки без шага по маршруту (сменилось содержимое или размер окна):
       глобус только выравнивается к крестику, без проворота */
    function realign(size) {
      const cur = markers[markers.length - 1];
      if (!initialized || !cur || flying) return null;
      const prev = markers[markers.length - 2];
      const plan = planFor(cur.vec, prev ? prev.vec : null, size, 0);
      earth.quaternion.copy(plan.target);
      return plan.side;
    }

    function clearAll() {
      while (markers.length) { const m = markers.pop(); disposeObj(m.sprite); disposeObj(m.line); }
      currentDir = null;
    }

    // Экранные координаты последнего крестика — оттуда «вылетает» карточка
    function markerScreenPos() {
      if (!initialized) return null;
      const m = markers[markers.length - 1];
      if (!m || !m.sprite) return null;
      earth.updateMatrixWorld();
      const p = new THREE.Vector3();
      m.sprite.getWorldPosition(p);
      p.project(camera);
      return { x: (p.x + 1) / 2 * window.innerWidth, y: (1 - p.y) / 2 * window.innerHeight };
    }

    /* «Полёт к Земле»: камера летит в последний крестик и почти касается поверхности.
       Остальные крестики и пунктир гаснут сразу, а крестик-цель растёт навстречу и тает у самой земли. */
    async function flyIn(dur, onProgress) {
      if (!initialized) return;
      flying = true;
      earth.scale.setScalar(1); if (glow) glow.scale.setScalar(1);
      earth.updateMatrixWorld();
      const center = earth.position.clone();
      const last = markers[markers.length - 1];
      const target = last
        ? last.vec.clone().applyQuaternion(earth.quaternion).add(center)
        : center.clone().add(camDir);
      const normal = target.clone().sub(center).normalize();
      // Останавливаемся низко над поверхностью, но не вплотную — иначе текстура расплывается в пятно
      const endPos = target.clone().add(normal.clone().multiplyScalar(0.22));
      const startPos = camera.position.clone();
      const startLook = new THREE.Vector3(0, 0, 0);
      const look = new THREE.Vector3();
      camera.near = 0.01; camera.updateProjectionMatrix();
      const fadeOthers = fadeTargets(markers.map((m) => (m === last ? { line: m.line } : m)));
      const fadeLast = fadeTargets(last && last.sprite ? [{ sprite: last.sprite }] : []);
      await tween(dur, (t) => {
        // smootherstep: без рывка на старте и мягкое торможение у поверхности
        const e = t * t * t * (t * (t * 6 - 15) + 10);
        camera.position.lerpVectors(startPos, endPos, e);
        const k = Math.min(1, t * 1.6);
        look.lerpVectors(startLook, target, k * k * (3 - 2 * k));
        camera.lookAt(look);
        fadeOthers(Math.min(1, t / 0.3));
        fadeLast(Math.min(1, Math.max(0, (t - 0.5) / 0.28)));
        if (onProgress) onProgress(t);
      });
    }

    // Вернуть камеру и глобус в исходное состояние (после выхода из аккаунта)
    function resetView() {
      tweens.length = 0;
      clearAll();
      flying = false;
      if (!initialized) return;
      camera.near = 0.1;
      updateGlobePosition();
      earth.quaternion.identity();
    }

    /* Раскладка: глобус — главная фигура в центре экрана, под ним логотип.
       Активный крестик стоит в одной точке диска: на широком экране — чуть выше центра (карточка встаёт сбоку),
       на телефоне стоя — в нижней части (карточка встаёт над ним). Размер глобуса задаём расстоянием камеры. */
    function updateGlobePosition() {
      if (!earth || !camera) return;
      const w = window.innerWidth, h = lockedHeight || window.innerHeight;
      const t = Math.tan((camera.fov / 2) * Math.PI / 180);
      const portrait = h > w * 1.05;
      const logoH = Math.round(Math.max(28, Math.min(50, h * 0.05)));
      const gap = Math.round(Math.max(12, Math.min(30, h * 0.03)));
      const margin = Math.max(14, h * 0.035);
      // диаметр с запасом на ореол (1.08 радиуса)
      const D = Math.max(160, Math.min(w * (portrait ? 0.86 : 0.6), (h - logoH - gap - margin * 2) / 1.08, 860));
      const blockH = D + gap + logoH;
      // на телефоне стоя глобус чуть ниже середины: над крестиком нужно место для карточки
      const top = portrait
        ? Math.max(margin, Math.min(h - margin - blockH, h * 0.55 - D / 2))
        : Math.max(margin, (h - blockH) / 2);
      const cx = w / 2, cy = top + D / 2;
      // диаметр глобуса в пикселях ≈ h / (D·tg(fov/2)) — отсюда расстояние камеры
      camDist = Math.min(16, Math.max(2.2, h / (D * t)));
      const H = 2 * camDist * t, W = H * (w / h);
      const x = (cx / w - 0.5) * W, y = (0.5 - cy / h) * H;
      earth.position.set(x, y, 0);
      if (glow) glow.position.set(x, y, 0);
      if (!flying) {
        camera.position.set(0, 0, camDist);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
        camera.updateMatrixWorld();
      }
      // активный крестик: точка видимой полусферы, смещённая от центра диска на долю радиуса (y — вниз)
      const off = portrait ? { x: 0, y: 0.3 } : { x: 0, y: -0.08 };
      const toCam = new THREE.Vector3(-x, -y, camDist).normalize();
      const right = new THREE.Vector3(1, 0, 0).addScaledVector(toCam, -toCam.x).normalize();
      const up = new THREE.Vector3().crossVectors(toCam, right).normalize();
      camDir.copy(toCam).multiplyScalar(Math.sqrt(1 - off.x * off.x - off.y * off.y))
        .addScaledVector(right, off.x).addScaledVector(up, -off.y).normalize();
      layoutInfo = { cx, cy, r: D / 2, logoTop: top + D + gap, logoH, portrait, w, h };
    }

    // Чёткость холста без перегрузки: на больших экранах с высокой плотностью пикселей ограничиваем разрешение
    function pixelRatio() {
      const dpr = window.devicePixelRatio || 1;
      return Math.max(1, Math.min(dpr, 2, Math.sqrt(3.6e6 / (window.innerWidth * window.innerHeight))));
    }

    function onResize() {
      if (!renderer) return;
      const w = window.innerWidth, h = window.innerHeight;
      const canvas = renderer.domElement;
      // На Android экранная клавиатура уменьшает высоту окна. Чтобы глобус не прыгал и не сжимался,
      // пока человек печатает, оставляем холст прежнего размера — лишнее просто обрежется снизу.
      const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
      const prevW = renderer.getSize(new THREE.Vector2()).x;
      if (typing && w === prevW && h < (lockedHeight || camera.userData.h || h)) {
        if (!lockedHeight) lockedHeight = camera.userData.h || h;
        canvas.style.height = lockedHeight + 'px';
        return;
      }
      lockedHeight = 0;
      canvas.style.height = '';
      camera.userData.h = h;
      renderer.setPixelRatio(pixelRatio());
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      if (!flying) {
        updateGlobePosition();
        layoutListeners.forEach((fn) => { try { fn(); } catch (err) { console.warn('[globe layout]', err); } });
      }
    }

    function init() {
      if (initialized || !isThreeAvailable()) return;
      const canvas = document.getElementById('globe-canvas');
      if (!canvas) return;
      const THREE = window.THREE;

      const w = window.innerWidth, h = window.innerHeight;
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(pixelRatio());
      renderer.setSize(w, h, false);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
      camera.position.set(0, 0, 3.4);
      camera.lookAt(0, 0, 0);
      camera.userData.h = h;

      // Свет «призмы»: холодный белый основной и два цветных контровых — фиолетовый и аква
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const key = new THREE.DirectionalLight(0xDCE4FF, 1.1);
      key.position.set(5, 3, 5);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xA77BFF, 0.7);
      rim.position.set(-5, -3, -3);
      scene.add(rim);
      const rim2 = new THREE.DirectionalLight(0x45D9E8, 0.45);
      rim2.position.set(4, -4, -2);
      scene.add(rim2);

      const fallbackMat = new THREE.MeshPhongMaterial({ color: 0x12131C, emissive: 0x2A2F6B, emissiveIntensity: 0.35, shininess: 8 });
      earth = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), fallbackMat);
      scene.add(earth);

      glow = new THREE.Mesh(
        new THREE.SphereGeometry(1.08, 48, 48),
        new THREE.MeshBasicMaterial({ color: 0x8C7CFF, transparent: true, opacity: 0.09, side: THREE.BackSide })
      );
      scene.add(glow);

      rimLight = rim; rimLight2 = rim2; keyLight = key;
      initialized = true;
      tint();
      updateGlobePosition();
      window.addEventListener('resize', onResize);

      // Шейдеры крестика и пунктира собираем заранее — иначе первый крестик появляется с рывком
      const warm = new THREE.Vector3(0, 0, 1);
      const warmSprite = addMarkerSprite(warm);
      const warmLine = buildDashedArc(warm, new THREE.Vector3(0, 1, 0));
      const compile = () => { try { renderer.compile(scene, camera); } catch {} };
      compile();
      disposeObj(warmSprite); disposeObj(warmLine);

      // Текстура Земли лежит в проекте (и в кеше офлайн). Глобус показываем, когда она готова,
      // чтобы не было «пустого» шара и рывка при подмене материала
      const done = () => {
        // два кадра: текстура загрузится в видеокарту до начала анимаций
        requestAnimationFrame(() => requestAnimationFrame(() => readyResolve()));
      };
      new THREE.TextureLoader().load(
        'img/earth-dark.jpg',
        (tex) => {
          if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
          earth.material = new THREE.MeshPhongMaterial({
            map: tex, color: 0xC2C8F2, emissive: 0x10122A, emissiveIntensity: 0.55, shininess: 6, specular: 0x343A70,
          });
          earthTex = tex;
          tintEarth();
          compile();
          if (!running) renderer.render(scene, camera);
          done();
        },
        undefined,
        done
      );
      setTimeout(() => readyResolve(), 3500);   // сеть зависла — показываем глобус без текстуры
    }

    function ready() {
      if (!isThreeAvailable()) return Promise.resolve();
      if (!initialized) init();
      return readyPromise;
    }
    function layout() { return layoutInfo; }
    function onLayout(fn) { layoutListeners.push(fn); }

    function tick(now) {
      if (!running) return;
      rafId = requestAnimationFrame(tick);

      for (let i = tweens.length - 1; i >= 0; i--) {
        const tw = tweens[i];
        if (tw.start === null) tw.start = now;
        const t = Math.min(1, Math.max(0, (now - tw.start) / tw.dur));
        tw.update(t);
        if (t >= 1) { tweens.splice(i, 1); tw.res(); }
      }

      if (earth && !flying) {
        // лёгкое «дыхание» глобуса
        const s = 1 + Math.sin(now * 0.0006) * 0.012;
        earth.scale.setScalar(s);
        if (glow) glow.scale.setScalar(s);
      }
      // Крестик, ушедший на обратную сторону, плавно гаснет, а не просвечивает у края глобуса
      if (earth && markers.length) {
        earth.updateMatrixWorld();
        for (const m of markers) {
          if (!m.sprite) continue;
          m.sprite.getWorldPosition(tmpA);
          tmpB.copy(tmpA).sub(earth.position).normalize();          // нормаль поверхности
          tmpA.subVectors(camera.position, tmpA).normalize();      // направление на камеру
          const vis = Math.min(1, Math.max(0, (tmpB.dot(tmpA) - 0.08) / 0.22));
          m.sprite.material.opacity = m.sprite.userData.alpha * vis;
        }
      }
      renderer.render(scene, camera);
    }

    function start() {
      if (!initialized) init();
      if (!renderer || running) return;
      running = true;
      rafId = requestAnimationFrame(tick);
    }

    function stop() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      // незавершённые анимации доводим до конца, чтобы никто не ждал их вечно
      while (tweens.length) { const tw = tweens.pop(); tw.update(1); tw.res(); }
    }

    document.addEventListener('visibilitychange', () => {
      const scr = document.getElementById('auth-screen');
      if (!scr) return;
      if (document.hidden) stop();
      else if (!scr.hidden && initialized) start();
    });

    return { init, start, stop, advance, back, resetToFirst, realign, markerScreenPos, flyIn, resetView, ready, layout, onLayout, tint };
  })();

  /* ═══════ АВТОРИЗАЦИЯ ═══════ */
  let currentUser = null;
  let profile = { name: 'Ваше имя', handle: '@username', bio: '', avatar: '' };

  /* Фото профиля: их может быть несколько (таблица profile_photos), свежее — главное.
     Уменьшенная копия главного фото хранится в profiles.avatar — её видно на карте и в чатах. */
  const PHOTO_MAX_SIDE = 1080, PHOTO_QUALITY = 0.82, PHOTOS_LIMIT = 10;
  let myPhotos = null;               // [{ id, url }], свежие первыми; null — ещё не загружали
  let profilePhotosMissing = false;  // таблицы нет (не выполнен supabase_profile_photos.sql) — одно фото, как раньше

  function isMissingTableError(error) {
    return !!error && (error.code === '42P01' || error.code === 'PGRST205');
  }

  async function loadProfilePhotos(userId) {
    if (profilePhotosMissing || !userId) return null;
    try {
      const { data, error } = await supabaseClient.from('profile_photos')
        .select('id, data, created_at').eq('user_id', userId)
        .order('created_at', { ascending: false }).limit(PHOTOS_LIMIT);
      if (error) {
        if (isMissingTableError(error)) profilePhotosMissing = true;
        console.warn('[profile_photos] load:', error.message);
        return null;
      }
      return (data || []).map((r) => ({ id: r.id, url: r.data, at: r.created_at }));
    } catch (err) { console.warn('[profile_photos] exception:', err); return null; }
  }

  // Что показывать: фото из таблицы, а если их нет — единственное старое фото из profiles.avatar
  function photosOrAvatar(rows, avatar) {
    if (rows && rows.length) return rows;
    return avatar ? [{ id: null, url: avatar }] : [];
  }

  function downscaleDataUrl(url, maxSide = 256, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onerror = () => reject(new Error('image decode error'));
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = url;
    });
  }

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const USERNAME_RE_AUTH = /^[a-zA-Z][a-zA-Z0-9_.]{2,19}$/;

  function isEmail(v) { return EMAIL_RE.test(String(v).trim()); }
  function normalizeUsername(raw) { return String(raw).trim().replace(/^@+/, '').toLowerCase(); }
  function isValidUsername(raw) { return USERNAME_RE_AUTH.test(normalizeUsername(raw)); }

  function applyUserToProfileFromRow(row, fallbackEmail) {
    if (!row) {
      profile = { name: fallbackEmail ? fallbackEmail.split('@')[0] : 'Пользователь', handle: '@user', bio: '', avatar: '' };
      return;
    }
    profile = {
      name: row.name || (fallbackEmail ? fallbackEmail.split('@')[0] : 'Пользователь'),
      handle: '@' + (row.username || 'user'),
      bio: row.bio || '',
      avatar: row.avatar || '',
      gender: row.gender || '',
      age: row.age || null,
    };
  }

  /* Сохранить профиль. Если в таблице ещё нет колонок gender/age
     (не выполнен supabase_group_filters.sql) — сохраняем без них, чтобы не ломать регистрацию. */
  async function upsertProfileRow(row) {
    const res = await supabaseClient.from('profiles').upsert(row);
    if (res.error && /gender|age/i.test(res.error.message || '')) {
      console.warn('[profiles] нет колонок gender/age — выполните supabase_group_filters.sql');
      const { gender, age, ...rest } = row;
      return supabaseClient.from('profiles').upsert(rest);
    }
    return res;
  }

  async function loadProfileRow(userId) {
    if (!userId) return null;
    const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', userId).maybeSingle();
    if (error) { console.warn('[profiles] load:', error.message); return null; }
    return data;
  }

  async function isUsernameTakenRemote(uname) {
    const u = normalizeUsername(uname).toLowerCase();
    if (!u) return false;
    const { data, error } = await supabaseClient.from('profiles').select('id').eq('username', u).maybeSingle();
    if (error) { console.warn('[username check]', error.message); return false; }
    return !!data;
  }

  /* Сброс состояния сессии: вызывается и при ручном выходе, и по событию SIGNED_OUT.
     Повторный вызов безопасен. */
  function handleSignedOut() {
    if (!currentUser && !authScreen.hidden) return;
    currentUser = null;
    profile = { name: 'Ваше имя', handle: '@username', bio: '', avatar: '' };
    myPhotos = null;

    rtChannels.forEach((c) => { try { supabaseClient.removeChannel(c); } catch {} });
    rtChannels = [];
    for (const fm of friendMarkers.values()) { try { fm.marker.destroy(); } catch {} }
    friendMarkers.clear(); friendMarkerCoords.clear();
    userLocationsById.clear(); userAvatarCfgById.clear(); groupMemberProfiles.clear();
    posts = []; wishes = []; groups = []; notifications = []; friends = [];
    leaveChat(); mediaUrlCache.clear(); chatMessages = []; supportMessages = []; chatsListShown = '';
    pendingIncomingRequests = new Set(); friendRequestOutcome.clear();
    groupMatches = []; groupMatchOutcome.clear(); groupInvites = []; groupInviteOutcome.clear(); groupDetailsId = null; groupDetailsBack = null;
    groupStats = new Map();
    avatarConfig = defaultAvatarFor('male'); avatarConfigReady = false;
    syncPostMarkers(); syncWishMarkers(); updateBadge();
    clearLocalCaches();

    document.body.classList.add('auth-locked');
    authScreen.classList.remove('is-diving', 'is-leaving');
    authScreen.hidden = false;
    closeApp();
    Globe.resetView();
    showAuthScene();
    authBusy = false; authCardShown = false;
    renderAuthLogin();
  }

  function logout() {
    supabaseClient.auth.signOut().finally(handleSignedOut);
  }

  const authScreen = document.getElementById('auth-screen');
  const authCard   = document.getElementById('auth-card');

  // Логотип живёт под глобусом, поэтому в карточках — только заголовок
  function authHeader({ title, sub = '' }) {
    return `
      <h1 class="auth-title">${escapeHtml(title)}</h1>
      <p class="auth-sub">${escapeHtml(sub)}</p>
    `;
  }
  function showAuthError(el, msg) { el.textContent = msg; el.hidden = false; }
  // Ширина карточки под содержимое: 'sm' — одно поле, 'md' — несколько полей
  function setAuthCardSize(size) { authCard.dataset.size = size; }

  /* ── Карточка появляется у крестика на глобусе и прячется обратно в него ── */
  let authBusy = false;        // идёт переход между экранами — новые нажатия игнорируем
  let authCardShown = false;
  let authCardSide = 'right';
  const AUTH_CARD_GAP = 26, AUTH_CARD_EDGE = 12;   // как CARD_GAP / CARD_EDGE в Globe
  const authMotion = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const nextFrames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

  function authCardSize() {
    authCard.style.maxHeight = '';
    return { w: authCard.offsetWidth, h: authCard.offsetHeight };
  }

  /* Поставить карточку у крестика с выбранной стороны. Точка роста (transform-origin) — в самом крестике:
     карточка «распускается» из него и в него же сворачивается. */
  function placeAuthCard(side) {
    const W = window.innerWidth, H = window.innerHeight, E = AUTH_CARD_EDGE, G = AUTH_CARD_GAP;
    authCard.style.maxHeight = '';
    let cw = authCard.offsetWidth, ch = authCard.offsetHeight;
    const pos = Globe.markerScreenPos();
    if (!pos) {   // без 3D — просто по центру
      authCard.style.left = Math.round((W - cw) / 2) + 'px';
      authCard.style.top = Math.round(Math.max(E, (H - ch) / 2)) + 'px';
      authCard.style.transformOrigin = '50% 50%';
      return;
    }
    const avail = side === 'above' ? pos.y - G - E : side === 'below' ? H - E - pos.y - G : H - 2 * E;
    if (ch > avail) {   // не влезает целиком — карточка прокручивается внутри
      authCard.style.maxHeight = Math.max(180, Math.floor(avail)) + 'px';
      ch = authCard.offsetHeight;
    }
    let left, top;
    if (side === 'right') { left = pos.x + G; top = pos.y - ch / 2; }
    else if (side === 'left') { left = pos.x - G - cw; top = pos.y - ch / 2; }
    else if (side === 'above') { left = pos.x - cw / 2; top = pos.y - G - ch; }
    else { left = pos.x - cw / 2; top = pos.y + G; }
    left = Math.round(Math.min(Math.max(left, E), W - E - cw));
    top = Math.round(Math.min(Math.max(top, E), H - E - ch));
    authCard.style.left = left + 'px';
    authCard.style.top = top + 'px';
    authCard.style.transformOrigin = `${(pos.x - left).toFixed(1)}px ${(pos.y - top).toFixed(1)}px`;
    authCard.dataset.side = side;
    authCardSide = side;
  }

  // Логотип под глобусом и центр фоновых колец — по раскладке глобуса
  function syncAuthLayout() {
    const L = Globe.layout();
    if (!L) return;
    const s = authScreen.style;
    s.setProperty('--gx', L.cx.toFixed(0) + 'px');
    s.setProperty('--gy', L.cy.toFixed(0) + 'px');
    s.setProperty('--logo-y', L.logoTop.toFixed(0) + 'px');
    s.setProperty('--logo-h', L.logoH + 'px');
  }
  let authRelayoutTimer = null;
  Globe.onLayout(() => {
    syncAuthLayout();
    clearTimeout(authRelayoutTimer);
    authRelayoutTimer = setTimeout(() => {
      if (authBusy || !authCardShown || authScreen.hidden) return;
      placeAuthCard(Globe.realign(authCardSize()) || authCardSide);
    }, 120);
  });

  function runAuthCardAnim(frames, opts) {
    return new Promise((resolve) => {
      const last = frames[frames.length - 1];
      let anim;
      try { anim = authCard.animate(frames, { fill: 'forwards', ...opts }); }
      catch { Object.assign(authCard.style, last); resolve(); return; }
      anim.onfinish = () => {
        Object.assign(authCard.style, last);
        anim.cancel();
        resolve();
      };
    });
  }

  // Только transform и opacity — их браузер анимирует на видеокарте, без перерисовки
  async function authCardOut() {
    if (!authCardShown) return;
    authCardShown = false;
    authCard.style.pointerEvents = 'none';
    if (authCard.contains(document.activeElement)) document.activeElement.blur();
    await runAuthCardAnim(
      [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.04)', opacity: 0 }],
      { duration: authMotion() ? 360 : 0, easing: 'cubic-bezier(.5, 0, .75, 0)' });
  }

  async function authCardIn() {
    await runAuthCardAnim(
      [{ transform: 'scale(.04)', opacity: 0 }, { opacity: 1, offset: 0.3 }, { transform: 'scale(1)', opacity: 1 }],
      { duration: authMotion() ? 560 : 0, easing: 'cubic-bezier(.2, .9, .25, 1.04)' });
    authCard.style.pointerEvents = '';
    authCardShown = true;
    // На компьютере сразу ставим курсор в поле; на телефоне не открываем клавиатуру сама по себе
    if (!matchMedia('(pointer: coarse)').matches) {
      const f = authCard.querySelector('input:not([type="range"]):not([type="file"]):not([type="hidden"]), textarea');
      if (f) f.focus({ preventScroll: true });
    }
  }

  /* Переход между экранами входа: карточка сворачивается в крестик → новое содержимое (пока невидимо)
     меряем → глобус делает шаг и сам выбирает, с какой стороны крестика карточке встать → карточка
     распускается из нового крестика. globeStep(size) возвращает сторону. */
  async function authTransition(globeStep, paint) {
    if (authBusy) return;
    authBusy = true;
    try {
      await authCardOut();
      paint();
      // первый показ: ждём текстуру глобуса и шрифт, чтобы размер карточки был точным, а анимация — ровной
      await Promise.race([Promise.all([Globe.ready(), document.fonts ? document.fonts.ready : null]), new Promise((r) => setTimeout(r, 3000))]);
      const size = authCardSize();
      const side = (globeStep ? await globeStep(size) : Globe.realign(size)) || authCardSide;
      placeAuthCard(side);
      await authCardIn();
    } catch (err) {
      console.warn('[auth transition]', err);
      if (!authCard.innerHTML) paint();
      placeAuthCard(authCardSide);
      Object.assign(authCard.style, { opacity: '1', transform: 'none', pointerEvents: '' });
      authCardShown = true;
    } finally {
      authBusy = false;
    }
  }

  /* Вход выполнен: карточка сворачивается в крестик, камера летит в него, у самой земли экран
     заволакивает светлыми «облаками» — под ними строятся маркеры — и проявляется карта.
     beforeReveal — работа, которую делаем, пока экран закрыт (до 1.5 с). */
  async function playAuthExit(beforeReveal) {
    if (authScreen.hidden) { if (beforeReveal) await beforeReveal(); return; }
    authBusy = true;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const motion = authMotion();
    let startZoom = null;
    try {
      await authCardOut();
      authScreen.classList.add('is-flying');      // логотип гаснет
      // Карта под экраном входа заранее отдаляется: пока летим, плитки этого масштаба успеют загрузиться
      if (map2gis) { try { startZoom = map2gis.getZoom(); map2gis.setZoom(Math.max(3, startZoom - 2.5)); } catch {} }
      if (motion) {
        let clouded = false;
        await Globe.flyIn(3000, (t) => {
          if (!clouded && t > 0.66) { clouded = true; authScreen.classList.add('is-diving'); }
        });
        authScreen.classList.add('is-diving');
        await wait(350);                           // «облака» сомкнулись полностью
      } else authScreen.classList.add('is-diving');
      Globe.stop();                                // глобус закрыт — освобождаем видеокарту для карты
      if (beforeReveal) await Promise.race([Promise.resolve().then(beforeReveal).catch((err) => console.warn('[enter app]', err)), wait(1500)]);
      // Карта приближается из-под облаков — продолжение полёта. Если за время полёта нашлась геопозиция,
      // летим к ней на её масштаб
      if (map2gis) {
        try {
          const endZoom = lastUserLocation ? 16 : (startZoom != null ? startZoom : map2gis.getZoom());
          if (map2gis.getZoom() > endZoom - 1.5) map2gis.setZoom(Math.max(3, endZoom - 2.5));
          await nextFrames();
          map2gis.setZoom(endZoom, { duration: motion ? 1700 : 0 });
        } catch {}
      }
      await nextFrames();
      playChromeEnter();                           // капсулы интерфейса съезжаются к краям, пока экран входа тает
      authScreen.classList.add('is-leaving');
      await wait(motion ? 1050 : 0);
    } catch (err) {
      console.warn('[auth exit]', err);
    } finally {
      authScreen.hidden = true;
      authScreen.classList.remove('is-diving', 'is-leaving', 'is-flying');
      Globe.stop();
      Globe.resetView();
      authCard.innerHTML = '';
      Object.assign(authCard.style, { opacity: '', transform: '', pointerEvents: '', maxHeight: '' });
      authCardShown = false;
      authBusy = false;
    }
  }

  // Вход — первый крестик на глобусе; сюда же возвращаемся из регистрации и восстановления
  function renderAuthLogin() { return authTransition((size) => Globe.resetToFirst(size), paintAuthLogin); }

  function paintAuthLogin() {
    setAuthCardSize('md');
    authCard.innerHTML = `
      ${authHeader({ title: 'Добро пожаловать', sub: 'Войдите, чтобы продолжить' })}
      <form class="auth-form" id="auth-login-form" novalidate>
        <label class="auth-field">
          <span class="auth-label">Почта или @username</span>
          <input class="auth-input" type="text" id="login-ident" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="you@example.com или @username">
        </label>
        <label class="auth-field">
          <span class="auth-label">Пароль</span>
          <input class="auth-input" type="password" id="login-pwd" autocomplete="current-password" placeholder="Ваш пароль">
        </label>
        <div id="login-error" class="auth-error" hidden></div>
        <button class="auth-btn" type="submit" id="login-submit">Войти</button>
        <div class="auth-links">
          <button class="auth-link" type="button" id="go-register">Создать аккаунт</button>
          <button class="auth-link" type="button" id="go-forgot">Забыли пароль?</button>
        </div>
      </form>
    `;

    const form = authCard.querySelector('#auth-login-form');
    const ident = authCard.querySelector('#login-ident');
    const pwd = authCard.querySelector('#login-pwd');
    const err = authCard.querySelector('#login-error');
    const submit = authCard.querySelector('#login-submit');

    authCard.querySelector('#go-register').addEventListener('click', renderAuthRegister);
    authCard.querySelector('#go-forgot').addEventListener('click', renderAuthForgot);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const idVal = ident.value.trim();
      const pw = pwd.value;
      if (!idVal) { showAuthError(err, 'Введите почту или username'); return; }
      if (!pw) { showAuthError(err, 'Введите пароль'); return; }

      let email = idVal;
      if (!isEmail(idVal)) {
        const uname = normalizeUsername(idVal);
        const { data: foundEmail, error: rpcErr } = await supabaseClient.rpc('get_email_by_username', { uname });
        if (rpcErr || !foundEmail) {
          console.error('[rpc get_email_by_username]', rpcErr);
          showAuthError(err, 'Пользователь с таким username не найден.');
          return;
        }
        email = foundEmail;
      }

      submit.disabled = true;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pw });
      submit.disabled = false;
      if (error) {
        console.error('[signIn]', error);
        showAuthError(err, 'Неверная почта/username или пароль.');
        return;
      }

      currentUser = data.user;
      const row = await loadProfileRow(currentUser.id);
      applyUserToProfileFromRow(row, currentUser.email);
      await enterAppAfterLogin();
    });
  }

  // Восстановление пароля — следующий крестик от входа
  function renderAuthForgot() { return authTransition((size) => Globe.advance(size), paintAuthForgot); }

  function paintAuthForgot() {
    setAuthCardSize('sm');
    authCard.innerHTML = `
      ${authHeader({ title: 'Восстановление', sub: 'Введите почту от аккаунта' })}
      <form class="auth-form" id="auth-forgot-form" novalidate>
        <label class="auth-field">
          <span class="auth-label">Почта</span>
          <input class="auth-input" type="email" id="forgot-email" placeholder="you@example.com">
        </label>
        <div id="forgot-error" class="auth-error" hidden></div>
        <div id="forgot-ok" class="auth-error" hidden style="background:rgba(74,208,122,.14);color:#4AD07A"></div>
        <button class="auth-btn" type="submit">Отправить письмо</button>
        <div class="auth-links">
          <button class="auth-link" type="button" id="back-login">← Назад ко входу</button>
        </div>
      </form>
    `;
    const form = authCard.querySelector('#auth-forgot-form');
    const email = authCard.querySelector('#forgot-email');
    const err = authCard.querySelector('#forgot-error');
    const ok = authCard.querySelector('#forgot-ok');
    authCard.querySelector('#back-login').addEventListener('click', renderAuthLogin);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true; ok.hidden = true;
      const v = email.value.trim();
      if (!isEmail(v)) { showAuthError(err, 'Введите корректную почту'); return; }
      const { error } = await supabaseClient.auth.resetPasswordForEmail(v, {
        redirectTo: window.location.origin + window.location.pathname,
      });
      if (error) { console.error('[resetPassword]', error); showAuthError(err, error.message); return; }
      ok.textContent = 'Если аккаунт существует, письмо отправлено.';
      ok.hidden = false;
    });
  }

  const REG_STEPS = ['name', 'username', 'gender', 'password', 'age', 'photo', 'bio'];

  /* Портреты для шага «пол» рисуются в 3D (отдельная сцена на каждый). Если делать это в момент показа шага,
     переход заметно дёргается — поэтому готовим их заранее, по одному, пока человек вводит имя */
  function prewarmGenderAvatars() {
    const idle = (fn, ms) => setTimeout(() => {
      if (authBusy) { idle(fn, 500); return; }
      (window.requestIdleCallback || ((cb) => setTimeout(cb, 0)))(fn, { timeout: 1500 });
    }, ms);
    idle(() => getAvatarSnapshotDataURL(defaultAvatarFor('male'), 'bust'), 700);
    idle(() => getAvatarSnapshotDataURL(defaultAvatarFor('female'), 'bust'), 1500);
  }

  function renderAuthRegister() {
    const draft = { name: '', username: '', gender: '', password: '', age: 18, avatar: '', photo: '', bio: '', email: '' };
    let stepIdx = 0;

    // Каждый шаг регистрации — новый крестик: вперёд пунктир к следующему, назад — возврат к прошлому
    const go = (delta) => authTransition(
      (size) => (delta > 0 ? Globe.advance(size) : Globe.back(size)),
      () => { stepIdx += delta; renderStep(); });
    // Карточка по размеру шага: одно поле — узкая, пароль и «о себе» — шире
    const STEP_SIZE = { name: 'sm', username: 'sm', gender: 'sm', password: 'md', age: 'sm', photo: 'sm', bio: 'md' };

    function renderStep() {
      const step = REG_STEPS[stepIdx];

      const dots = REG_STEPS.map((_, i) => {
        const cls = i === stepIdx ? 'active' : (i < stepIdx ? 'done' : '');
        return `<span class="auth-step-dot ${cls}"></span>`;
      }).join('');
      const stepInfo = {
        name:     { t: 'Как вас зовут?', s: 'Это имя увидят другие пользователи' },
        username: { t: 'Придумайте username', s: 'Латиница, цифры, «_» и «.», от 3 до 20 символов' },
        gender:   { t: 'Ваш пол', s: 'Поможет точнее подбирать компанию' },
        password: { t: 'Придумайте пароль', s: 'Минимум 6 символов' },
        age:      { t: 'Сколько вам лет?', s: 'Возраст можно будет изменить позже' },
        photo:    { t: 'Добавьте фото', s: 'Необязательно' },
        bio:      { t: 'Расскажите о себе', s: 'Пара слов — и профиль готов' },
      }[step];

      setAuthCardSize(STEP_SIZE[step] || 'md');
      authCard.innerHTML = `
        <div class="auth-eyebrow">Регистрация · ${stepIdx + 1} из ${REG_STEPS.length}</div>
        <div class="auth-steps">${dots}</div>
        <h2 class="auth-step-title">${escapeHtml(stepInfo.t)}</h2>
        <p class="auth-step-sub">${escapeHtml(stepInfo.s)}</p>
        <form class="auth-form" id="reg-form" novalidate>
          <div id="reg-step-body"></div>
          <div id="reg-error" class="auth-error" hidden></div>
          <div class="auth-links" style="justify-content:space-between">
            <button class="auth-link" type="button" id="reg-back">← Назад</button>
            <button class="auth-btn" type="submit" style="width:auto;min-width:140px" id="reg-next">
              ${step === 'bio' ? 'Завершить' : 'Далее'}
            </button>
          </div>
        </form>
      `;

      authCard.querySelector('#reg-back').addEventListener('click', () => {
        if (stepIdx === 0) { renderAuthLogin(); return; }
        go(-1);
      });

      const body = authCard.querySelector('#reg-step-body');
      const err = authCard.querySelector('#reg-error');
      const form = authCard.querySelector('#reg-form');

      if (step === 'name') {
        body.innerHTML = `<label class="auth-field"><span class="auth-label">Имя</span><input class="auth-input" type="text" id="reg-name" maxlength="60" value="${escapeHtml(draft.name)}" placeholder="Например, Алексей"></label>`;
      } else if (step === 'username') {
        body.innerHTML = `
          <label class="auth-field">
            <span class="auth-label">Username</span>
            <div class="username-wrap"><span class="username-prefix" aria-hidden="true">@</span>
              <input class="edit-input username-input" type="text" id="reg-username" maxlength="20" autocapitalize="off" autocorrect="off" spellcheck="false" value="${escapeHtml(draft.username)}" placeholder="username">
            </div>
            <span class="username-status" id="uname-status"></span>
          </label>`;
        const unameEl = authCard.querySelector('#reg-username');
        const status = authCard.querySelector('#uname-status');
        let checkTimer = null;
        const runCheck = () => {
          const v = normalizeUsername(unameEl.value);
          unameEl.value = v;
          if (!v) { status.textContent = ''; status.className = 'username-status'; return; }
          if (!isValidUsername(v)) { status.textContent = 'Неверный формат'; status.className = 'username-status busy'; return; }
          status.innerHTML = `<span class="spinner"></span> Проверяем…`;
