  /* ── Список чатов: две вкладки, последние сообщения и непрочитанное ──
     Последнее сообщение и число непрочитанных по каждому чату держим в памяти: их заполняет один запрос
     после входа, а дальше обновляет realtime. Поэтому список открывается сразу, а счётчики видны везде.
     «Прочитано» — отметка времени на этом устройстве: до какого сообщения чат уже открывали. */
  const chatLast = new Map();     // ключ чата → последнее сообщение
  const chatUnread = new Map();   // ключ чата → сколько непрочитанных
  const SUMMARY_LIMIT = 300;      // сколько последних сообщений каждого вида чатов берём для списка чатов
  let chatSummaryLoaded = false, chatSummarySeq = 0, chatSummaryTimer = 0;
  let chatsListShown = '';        // показанный список: при следующем запуске он появляется сразу, без «Загружаем…»

  let chatsTab = 'dm';
  try { if (localStorage.getItem('chats.tab') === 'group') chatsTab = 'group'; } catch {}
  function setChatsTab(tab) {
    chatsTab = tab === 'group' ? 'group' : 'dm';
    try { localStorage.setItem('chats.tab', chatsTab); } catch {}
    const listEl = winBody.querySelector('#chats-list');
    if (listEl) { listEl.dataset.tab = chatsTab; listEl.scrollTop = 0; }
    winBody.querySelectorAll('[data-chats-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.chatsTab === chatsTab)));
  }

  function msgChatKey(m) {
    return m.matchId !== null ? 'match:' + m.matchId
      : m.groupId !== null ? 'group:' + m.groupId
      : 'dm:' + (String(m.fromId) === String(currentUser.id) ? m.toId : m.fromId);
  }
  const msgTs = (m) => (m && Date.parse(m.createdAt)) || 0;

  let chatReadState = null;   // { uid, base, at: { ключ чата: время } }
  function chatReads() {
    const uid = currentUser ? currentUser.id : '';
    if (chatReadState && chatReadState.uid === uid) return chatReadState;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('chat.read.v1:' + uid) || 'null'); } catch {}
    // первый запуск: всё, что написано раньше, считается прочитанным
    chatReadState = { uid, base: (saved && saved.base) || Date.now(), at: (saved && saved.at) || {} };
    if (!saved) saveChatReads();
    return chatReadState;
  }
  function saveChatReads() {
    const s = chatReadState;
    try { localStorage.setItem('chat.read.v1:' + s.uid, JSON.stringify({ base: s.base, at: s.at })); } catch {}
  }
  function isUnreadMsg(m, key) {
    const s = chatReads();
    return !isMyMsg(m) && msgTs(m) > (s.at[key] || s.base);
  }
  // Чат на экране — всё, что в нём есть, прочитано
  function markChatRead(c) {
    if (!c || !currentUser || document.hidden) return;
    if (c.below) return;   // ленту отлистали вверх, и ниже есть сообщения, которых ещё не видели (см. syncChatDown)
    const key = chatKey(c), s = chatReads();
    let top = chatLast.get(key) || null;
    for (const m of c.messages) if (!m.pending && msgTs(m) >= msgTs(top)) top = m;
    const at = msgTs(top);
    if (at > (s.at[key] || s.base)) { s.at[key] = at; saveChatReads(); }
    // правки чужих сообщений, которые сейчас на экране, тоже увидены: отметка сдвигается до времени правки
    let seen = at;
    for (const m of c.messages) if (m.editedAt && !m.pending && !isMyMsg(m)) seen = Math.max(seen, Date.parse(m.editedAt) || 0);
    pushChatRead(c, key, seen);   // собеседник и участники группы увидят, что сообщение прочитано
    if (chatUnread.get(key)) {
      chatUnread.delete(key);
      if (winBody.querySelector('#chats-list')) paintChatsList(); else updateChatBadges();
    }
  }

  /* ── Кто что прочитал ──
     Таблица chat_reads (supabase_chat_reads.sql): у каждого человека по строке на чат — до какого сообщения
     он дочитал. По ней в личном чате видно «Прочитано», в групповом — список прочитавших сообщение,
     а мои собственные отметки общие для всех моих устройств. Без таблицы всё это просто не показывается. */
  const peerReads = new Map();       // ключ чата → Map(id человека → время, до которого он дочитал)
  const myServerReads = new Map();   // ключ чата → моя отметка, уже сохранённая на сервере
  let chatReadsMissing = false, chatReadsReady = false;
  const chatReadTarget = (c) => String(c.type === 'dm' ? c.peerId : c.type === 'match' ? c.matchId : c.groupId);
  function chatReadsError(error) {
    if (isMissingTableError(error) || /schema cache|does not exist|could not find/i.test(error.message || '')) {
      if (!chatReadsMissing) console.warn('[chat reads] нет таблицы — выполните supabase_chat_reads.sql в Supabase');
      chatReadsMissing = true;
    } else console.warn('[chat reads]', error.message);
  }
  // Строка таблицы → в память. Возвращает ключ чата, если отметка продвинулась
  function applyReadRow(r) {
    if (!currentUser || !r || !r.user_id) return null;
    const myId = String(currentUser.id), uid = String(r.user_id), ts = Date.parse(r.read_at) || 0;
    const key = r.chat_kind !== 'dm' ? r.chat_kind + ':' + r.chat_id
      : uid === myId ? 'dm:' + r.chat_id
      : String(r.chat_id) === myId ? 'dm:' + uid : null;
    if (!key || !ts) return null;
    if (uid === myId) {
      if (ts <= (myServerReads.get(key) || 0)) return null;
      myServerReads.set(key, ts);
      const s = chatReads();
      if (ts > (s.at[key] || s.base)) { s.at[key] = ts; saveChatReads(); }
      return key;
    }
    let map = peerReads.get(key);
    if (!map) peerReads.set(key, (map = new Map()));
    if (ts <= (map.get(uid) || 0)) return null;
    map.set(uid, ts);
    return key;
  }
  async function loadMyChatReads() {
    if (chatReadsMissing || !currentUser) return;
    try {
      const { data, error } = await supabaseClient.from('chat_reads').select('user_id, chat_kind, chat_id, read_at').eq('user_id', currentUser.id);
      if (error) { chatReadsError(error); return; }
      (data || []).forEach(applyReadRow);
      chatReadsReady = true;
      loadPeerDmReads();   // не ждём: на подсчёт непрочитанного эти отметки не влияют
    } catch (err) { console.warn('[chat reads] load:', err); }
  }
  /* Отметки собеседников во всех личных чатах со мной — один раз за сеанс (дальше их ведёт realtime, а открытый
     чат перечитывает свою): галочки у моих сообщений верны сразу, как только чат открыли, а не после ответа сервера */
  let peerDmReadsLoaded = false;
  async function loadPeerDmReads() {
    if (peerDmReadsLoaded || chatReadsMissing || !currentUser) return;
    peerDmReadsLoaded = true;
    const uid = currentUser.id;
    try {
      const { data, error } = await supabaseClient.from('chat_reads').select('user_id, chat_kind, chat_id, read_at').eq('chat_kind', 'dm').eq('chat_id', String(uid));
      if (error || !currentUser || currentUser.id !== uid) { if (error) peerDmReadsLoaded = false; return; }
      (data || []).forEach(applyReadRow);
      if (chat) syncChatReadMarks();
    } catch { peerDmReadsLoaded = false; }
  }
  // Отметки собеседника (личный чат) или всех участников (групповой) для открытого чата
  async function loadChatReads(c) {
    if (chatReadsMissing || !currentUser) return;
    let q = supabaseClient.from('chat_reads').select('user_id, chat_kind, chat_id, read_at').eq('chat_kind', c.type);
    q = c.type === 'dm' ? q.eq('user_id', c.peerId).eq('chat_id', String(currentUser.id)) : q.eq('chat_id', chatReadTarget(c));
    try {
      const { data, error } = await q;
      if (error) { chatReadsError(error); return; }
      (data || []).forEach(applyReadRow);
      chatReadsReady = true;
      if (chat === c) syncChatReadMarks();
    } catch (err) { console.warn('[chat reads] load:', err); }
  }
  // ts — до какого момента прочитано: время последнего сообщения или последней увиденной правки (мс)
  function pushChatRead(c, key, ts) {
    if (chatReadsMissing || !currentUser || !ts) return;
    const prev = myServerReads.get(key) || 0;
    if (ts <= prev) return;
    myServerReads.set(key, ts);
    supabaseClient.from('chat_reads')
      .upsert({ user_id: currentUser.id, chat_kind: c.type, chat_id: chatReadTarget(c), read_at: new Date(ts).toISOString() }, { onConflict: 'user_id,chat_kind,chat_id' })
      .then(({ error }) => {
        if (!error) return;
        if (myServerReads.get(key) === ts) myServerReads.set(key, prev);
        chatReadsError(error);
      }, (err) => console.warn('[chat reads] save:', err));
  }
  // Realtime: кто-то дочитал чат (или я — на другом устройстве)
  function onChatReadRow(r) {
    if (!currentUser || !r) return;
    const mine = String(r.user_id) === String(currentUser.id);
    const key = applyReadRow(r);
    if (!key) return;
    chatReadsReady = true;
    if (mine) { if (chatUnread.get(key)) refreshChatSummariesSoon(); }
    else if (chat && chatKey(chat) === key) syncChatReadMarks();
  }
  /* Галочки у своих сообщений, как в Telegram: одна — отправлено, две — прочитано (в групповом чате —
     хотя бы одним участником). Отметка стоит у каждого сообщения и никуда не переезжает */
  function syncChatReadMarks() {
    const c = chat, body = winBody.querySelector('#chat-view-body');
    if (!c || !body || !currentUser) return;
    const on = chatReadsReady && !chatReadsMissing;
    if (body.classList.contains('reads-on') !== on) {
      body.classList.toggle('reads-on', on);
      fitChatBubbles(body.querySelectorAll(':scope > .chat-msg.me'));   // у времени появились (или пропали) галочки — оно стало шире
    }
    if (!on) return;
    const reads = peerReads.get(chatKey(c)), myId = String(currentUser.id);
    let at = 0;   // до какого момента чат дочитал кто-то, кроме меня
    if (reads) for (const [uid, ts] of reads) if (uid !== myId && ts > at) at = ts;
    for (const el of body.querySelectorAll(':scope > .chat-msg.me[data-ts]')) {
      const read = at > 0 && Number(el.dataset.ts) <= at;
      if (el.classList.contains('is-read') !== read) el.classList.toggle('is-read', read);
    }
  }
  // Имя и аватар участника чата
  function chatPersonById(id) {
    const sid = String(id);
    const known = friends.find((f) => String(f.id) === sid) || groupMemberProfiles.get(id) || groupMemberProfiles.get(sid)
      || (peopleCache.has(sid) && !peopleCache.get(sid).missing ? peopleCache.get(sid) : null);
    if (known) return { id: sid, name: known.name || known.handle || 'Участник', handle: known.handle || '', avatar: known.avatar || '' };
    for (const g of groups) {
      const mem = (g.members || []).find((x) => String(x.id) === sid);
      if (mem) return { id: sid, name: mem.name || mem.handle || 'Участник', handle: mem.handle || '', avatar: mem.avatar || '' };
    }
    return { id: sid, name: 'Участник', handle: '', avatar: '' };
  }
  // Кто в открытом чате прочитал сообщение: первыми — те, кто прочитал раньше
  function chatReaders(m) {
    if (!chat || !currentUser) return [];
    const reads = peerReads.get(chatKey(chat));
    if (!reads) return [];
    const ts = msgTs(m), myId = String(currentUser.id);
    return [...reads].filter(([uid, at]) => uid !== myId && at >= ts).sort((a, b) => a[1] - b[1]).map(([uid]) => chatPersonById(uid));
  }
  function readersLabel(list) {
    if (!list.length) return 'Пока никто не прочитал';
    return `Прочитали: ${escapeHtml(list[0].name)}${list.length > 1 ? ' + ' + (list.length - 1) : ''}`;
  }
  function openReadersModal(m) {
    const list = chatReaders(m);
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <h3 class="modal-title">${list.length ? `Прочитали (${list.length})` : 'Прочитали'}</h3>
        ${list.length ? `<ul class="readers-list">${list.map((p) => `
          <li class="person-card">
            ${avatarCircleHtml(p, 36)}
            <div class="person-main">
              <div class="person-name">${escapeHtml(p.name)}</div>
              ${p.handle ? `<div class="person-handle">${escapeHtml(p.handle)}</div>` : ''}
            </div>
          </li>`).join('')}</ul>` : '<p class="readers-none">Это сообщение пока никто не прочитал.</p>'}
        <div class="modal-actions"><button type="button" class="btn btn-primary" data-close>Закрыть</button></div>
      </div>`;
    modalHost().appendChild(back);
    back.addEventListener('click', (e) => {
      e.stopPropagation();
      if (e.target === back || e.target.closest('[data-close]')) back.remove();
    });
  }

  /* ── Настройки чата: выключенные уведомления и «удалить чат у себя» ──
     Хранятся на устройстве и в таблице chat_prefs (supabase_chat_prefs.sql) — тогда они общие для всех моих
     устройств, а функция send-push не шлёт push по чату, пока уведомления выключены.
     «Удалить чат» — отметка времени: всё, что написано раньше, у меня скрыто; у остальных переписка остаётся. */
  const ICON_BELL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.75 16.25V11a5.25 5.25 0 0 1 10.5 0v5.25"/><path d="M4.75 16.25h14.5M10.4 19.5a1.8 1.8 0 0 0 3.2 0"/></svg>`;
  const ICON_BELL_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.25 13.5V11a5.25 5.25 0 0 0-8.3-4.27M6.75 11v5.25"/><path d="M4.75 16.25h10.5M10.4 19.5a1.8 1.8 0 0 0 3.2 0M4 4l16 16"/></svg>`;
  const MUTE_FOREVER = Date.UTC(2999, 0, 1);
  const chatPrefs = new Map();   // ключ чата → { mutedUntil, clearedAt } (время в мс, 0 — нет)
  let chatPrefsUid = null, chatPrefsMissing = false, chatPrefsWarned = false;
  function chatPref(key) {
    const uid = currentUser ? String(currentUser.id) : '';
    if (chatPrefsUid !== uid) {
      chatPrefs.clear();
      chatPrefsUid = uid;
      try {
        const saved = JSON.parse(localStorage.getItem('chat.prefs.v1:' + uid) || '{}');
        for (const [k, v] of Object.entries(saved)) chatPrefs.set(k, { mutedUntil: Number(v.mutedUntil) || 0, clearedAt: Number(v.clearedAt) || 0 });
      } catch {}
    }
    return chatPrefs.get(key) || { mutedUntil: 0, clearedAt: 0 };
  }
  function setChatPref(key, patch) {
    chatPrefs.set(key, { ...chatPref(key), ...patch });
    try { localStorage.setItem('chat.prefs.v1:' + chatPrefsUid, JSON.stringify(Object.fromEntries(chatPrefs))); } catch {}
  }
  const isChatMuted = (key) => chatPref(key).mutedUntil > Date.now();
  const chatClearedAt = (key) => chatPref(key).clearedAt;
  function chatPrefsError(error) {
    if (isMissingTableError(error) || /schema cache|does not exist|could not find/i.test(error.message || '')) chatPrefsMissing = true;
    console.warn('[chat prefs]', error.message);
  }
  async function loadChatPrefs() {
    if (chatPrefsMissing || !currentUser) return;
    const uid = currentUser.id;
    try {
      const { data, error } = await supabaseClient.from('chat_prefs').select('chat_kind, chat_id, muted_until, cleared_at').eq('user_id', uid);
      if (error) { chatPrefsError(error); return; }
      if (!currentUser || currentUser.id !== uid) return;
      for (const r of (data || [])) {
        const key = r.chat_kind + ':' + r.chat_id;
        setChatPref(key, {
          mutedUntil: (r.muted_until && Date.parse(r.muted_until)) || 0,
          clearedAt: Math.max(chatClearedAt(key), (r.cleared_at && Date.parse(r.cleared_at)) || 0),
        });
      }
    } catch (err) { console.warn('[chat prefs] load:', err); }
  }
  // Сохранить настройки чата на сервере; false — таблицы нет или запрос не прошёл (на устройстве они уже сохранены)
  async function pushChatPref(key) {
    if (chatPrefsMissing || !currentUser) return false;
    const i = key.indexOf(':'), p = chatPref(key);
    const iso = (ms) => (ms ? new Date(ms).toISOString() : null);
    try {
      const { error } = await supabaseClient.from('chat_prefs').upsert({
        user_id: currentUser.id, chat_kind: key.slice(0, i), chat_id: key.slice(i + 1),
        muted_until: iso(p.mutedUntil), cleared_at: iso(p.clearedAt),
      }, { onConflict: 'user_id,chat_kind,chat_id' });
      if (error) { chatPrefsError(error); return false; }
      return true;
    } catch (err) { console.warn('[chat prefs] save:', err); return false; }
  }

  async function setChatMute(key, mode) {
    const until = mode === 'hour' ? Date.now() + 3600 * 1000 : mode === 'day' ? Date.now() + 24 * 3600 * 1000 : mode === 'forever' ? MUTE_FOREVER : 0;
    setChatPref(key, { mutedUntil: until });
    paintChatsList();
    const ok = await pushChatPref(key);
    // без таблицы на сервере push-уведомления продолжат приходить — говорим об этом один раз
    if (!ok && until && chatPrefsMissing && !chatPrefsWarned) {
      chatPrefsWarned = true;
      alert('Уведомления выключены только в самом приложении. Чтобы перестали приходить и push-уведомления, выполните supabase_chat_prefs.sql в Supabase и обновите функцию send-push.');
    }
  }
  function openChatMuteMenu(key, anchorEl) {
    closePostMenus();
    const muted = isChatMuted(key), k = escapeHtml(key);
    const item = (mode, label) => `<button class="pop-item" type="button" data-mute-set="${mode}" data-mute-key="${k}">${label}</button>`;
    const pop = document.createElement('div');
    pop.className = 'popover msg-menu';
    pop.innerHTML = (muted ? item('off', 'Включить уведомления') : '')
      + item('hour', 'Выключить на час') + item('day', 'Выключить на сутки') + item('forever', 'Выключить навсегда');
    winBody.appendChild(pop);
    const r = winBody.getBoundingClientRect(), a = anchorEl.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(a.right - r.left - pop.offsetWidth, r.width - pop.offsetWidth - 8)) + 'px';
    pop.style.top = Math.max(8, Math.min(a.bottom - r.top + 6, r.height - pop.offsetHeight - 8)) + 'px';
    const onDocDown = (ev) => {
      if (pop.contains(ev.target)) return;
      pop.remove();
      document.removeEventListener('pointerdown', onDocDown, true);
    };
    setTimeout(() => document.addEventListener('pointerdown', onDocDown, true), 0);
  }

  async function deleteChatForMe(key) {
    const ok = await confirmModal({
      title: 'Удалить чат?',
      text: 'Переписка исчезнет только у вас — у собеседников она останется. Чат вернётся в список, когда в нём появится новое сообщение.',
      confirmLabel: 'Удалить',
    });
    if (!ok || !currentUser) return;
    // отметка не раньше последнего сообщения — даже если часы устройства отстают от сервера
    setChatPref(key, { clearedAt: Math.max(Date.now(), msgTs(chatLast.get(key)) + 1) });
    chatLast.delete(key);
    chatUnread.delete(key);
    chatHistoryCache.set(key, []);
    KV.set(`chat:${currentUser.id}:${key}`, []);
    paintChatsList();
    await pushChatPref(key);
  }

  /* Свайп строки чата влево открывает кнопки, вправо — прячет; открыта может быть одна строка.
     Мышью: потянуть строку влево или нажать правой кнопкой. */
  function closeChatSwipes(except = null) {
    winBody.querySelectorAll('.chat-swipe.revealed').forEach((el) => { if (el !== except) el.classList.remove('revealed'); });
  }

  // В скольких личных и групповых чатах есть непрочитанное
  function unreadChats() {
    // чаты с выключенными уведомлениями в общий счётчик не идут — цифра остаётся только в их строке
    const keys = [];
    const has = (key) => (chatUnread.get(key) > 0 && !isChatMuted(key) ? (keys.push(key), 1) : 0);
    let dm = 0, group = 0;
    if (currentUser) {
      for (const id of dmChatPeers()) dm += has('dm:' + id);
      for (const g of myGroups()) group += has('group:' + g.id);
      for (const m of myAcceptedMatches()) group += has('match:' + m.id);
    }
    return { dm, group, keys };
  }
  function updateChatBadges() {
    const n = unreadChats();
    const put = (el, count) => { if (el) { el.textContent = count > 99 ? '99+' : String(count); el.hidden = !(count > 0); } };
    put(document.getElementById('chats-badge'), n.dm + n.group);
    put(winBody.querySelector('[data-tab-unread="dm"]'), n.dm);
    put(winBody.querySelector('[data-tab-unread="group"]'), n.group);
    syncAppBadge(n.keys);
  }

  /* ── Цифра на значке приложения (рабочий стол, Dock, панель задач, экран «Домой») ──
     Сколько чатов с непрочитанным: написали два человека и одна группа — 3. Чаты с выключенными
     уведомлениями не считаются, как и в счётчике на вкладке «Чаты». Пока приложение закрыто, цифру
     ведёт сервис-воркер по приходящим push (sw.js), поэтому ему передаём список чатов с непрочитанным.
     Значок с цифрой — у установленного приложения: Chrome и Edge на компьютере, Safari на Mac и iPhone
     (iOS 16.4+, с разрешёнными уведомлениями). На Android цифру у значка рисует сам телефон по уведомлениям.
     Во вкладке браузера то же число видно в заголовке: «(3) GroupIS». */
  let appBadgeShown = null;
  function syncAppBadge(keys) {
    if (currentUser && !chatSummaryLoaded) return;   // сводка ещё не загружена — не сбрасываем цифру, оставшуюся с прошлого раза
    const list = currentUser ? keys : [];
    const sign = list.join(',');
    if (sign === appBadgeShown) return;
    appBadgeShown = sign;
    const n = list.length;
    document.title = n ? `(${n > 99 ? '99+' : n}) GroupIS` : 'GroupIS';
    try {
      if (navigator.setAppBadge) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
    } catch {}
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (sw) { try { sw.postMessage({ type: 'badge-sync', chats: list }); } catch {} }
  }
  // сервис-воркер сменился (первая установка или новая версия) — передаём список и ему
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('controllerchange', () => { appBadgeShown = null; updateChatBadges(); });

  // Последние сообщения всех чатов — тремя запросами одновременно
  async function loadChatSummaries() {
    if (!currentUser) return false;
    const myId = currentUser.id, seq = ++chatSummarySeq;
    const gs = myGroups(), ms = myAcceptedMatches();
    const last = new Map(), unread = new Map(), done = new Set(), got = [], full = new Set();
    const load = async (kind, norm, query) => {
      try {
        const { data, error } = query ? await query().order('created_at', { ascending: false }).limit(SUMMARY_LIMIT) : { data: [] };
        if (error) { console.warn(`[${kind} chat] list:`, error.message); return; }
        if ((data || []).length >= SUMMARY_LIMIT) full.add(kind);   // дальше могли остаться чаты постарше
        for (const r of (data || [])) {
          const m = norm(r);
          if (!isHiddenMsg(kind, m.id)) got.push(m);
        }
        done.add(kind);
      } catch (err) { console.warn(`[${kind} chat] list exception:`, err); }
    };
    await Promise.all([
      loadMyChatReads(),   // что прочитано на других моих устройствах — до подсчёта непрочитанного
      loadChatPrefs(),     // выключенные уведомления и удалённые у себя чаты
      load('match', normMatchRow, ms.length && (() => supabaseClient.from('match_messages').select('*').in('match_id', ms.map((m) => Number(m.id))))),
      load('dm', normDmRow, () => supabaseClient.from('dm_messages').select('*').or(`from_id.eq.${myId},to_id.eq.${myId}`)),
      load('group', normGroupRow, gs.length && (() => supabaseClient.from('group_messages').select('*').in('group_id', gs.map((g) => g.id)))),
    ]);
    if (seq !== chatSummarySeq || !currentUser || currentUser.id !== myId) return false;
    for (const m of got) {
      const key = msgChatKey(m);
      if (msgTs(m) <= chatClearedAt(key)) continue;   // чат удалён у меня — старые сообщения не в счёт
      if (!last.has(key)) last.set(key, m);
      if (isUnreadMsg(m, key)) unread.set(key, (unread.get(key) || 0) + 1);
    }
    /* В выборку попадают SUMMARY_LIMIT последних сообщений всех чатов одного вида сразу. Если с кем-то переписываются
       много, давние чаты в неё не попадают — и в списке выглядели пустыми («Начните диалог»), без времени и в самом
       низу. Таким чатам оставляем уже известное последнее сообщение, а неизвестное догружаем — по одному на чат */
    if (full.size) {
      const specs = [...gs.map((g) => ({ type: 'group', groupId: g.id })), ...ms.map((m) => ({ type: 'match', matchId: String(m.id) })),
        ...friends.map((f) => ({ type: 'dm', peerId: f.id }))];
      const ask = [];
      for (const spec of specs) {
        const key = chatKey(spec);
        if (!full.has(spec.type) || last.has(key)) continue;
        const prev = chatLast.get(key);
        if (prev && !isHiddenMsg(spec.type, prev.id) && msgTs(prev) > chatClearedAt(key)) {
          last.set(key, prev);
          if (chatUnread.get(key)) unread.set(key, chatUnread.get(key));
        } else ask.push(spec);
      }
      await Promise.all(ask.slice(0, 40).map(async (spec) => {
        const list = await loadChatHistory(spec, 5);
        const m = list && list[list.length - 1], key = chatKey(spec);
        if (!m) return;
        last.set(key, m);
        if (isUnreadMsg(m, key)) unread.set(key, 1);
      }));
      if (seq !== chatSummarySeq || !currentUser || currentUser.id !== myId) return false;
    }
    // запрос не удался (нет сети) — по этим чатам остаётся то, что уже знаем
    for (const map of [chatLast, chatUnread]) {
      for (const key of [...map.keys()]) if (done.has(key.split(':')[0])) map.delete(key);
    }
    last.forEach((m, key) => chatLast.set(key, m));
    unread.forEach((n, key) => chatUnread.set(key, n));
    chatSummaryLoaded = true;
    if (chat) markChatRead(chat);
    updateChatBadges();
    return true;
  }
  // Вернулись в приложение: в фоне realtime мог молчать — открытый чат догружает пропущенное (и тогда отмечается
  // прочитанным), счётчики сверяем с сервером
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !currentUser) return;
    if (chat) refreshOpenChat();
    refreshChatSummariesSoon();
  });
  function refreshChatSummariesSoon() {
    clearTimeout(chatSummaryTimer);
    chatSummaryTimer = setTimeout(async () => { if (await loadChatSummaries()) paintChatsList(); }, 600);
  }

  // Новое сообщение (пришло по realtime или отправлено мной): строка чата и счётчики обновляются без запроса к серверу
  function noteChatMessage(m, seen) {
    if (!currentUser || m.pending) return;
    const key = msgChatKey(m);
    if (msgTs(m) >= msgTs(chatLast.get(key))) chatLast.set(key, m);
    if (!seen && isUnreadMsg(m, key)) chatUnread.set(key, (chatUnread.get(key) || 0) + 1);
    paintChatsList();
  }

  // Время последнего сообщения в списке чатов: сегодня — часы и минуты (16:32), раньше — словами, чтобы
  // не путать с временем: «10 октября», в прошлые годы — «10 окт. 2025»
  function fmtChatListTime(iso) {
    const d = iso ? new Date(iso) : null;
    if (!d || isNaN(d)) return '';
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return fmtTime(iso);
    return fmtRu(d, d.getFullYear() === now.getFullYear()
      ? DAY_MONTH : { day: 'numeric', month: 'short', year: 'numeric' }).replace(/\s*г\.$/, '');
  }

  /* Личные чаты — по переписке, а не по списку друзей: добавили в друзья — чат появится, когда кто-то напишет;
     удалили из друзей — переписка остаётся */
  function dmChatPeers() {
    return [...chatLast.keys()].filter((key) => key.startsWith('dm:')).map((key) => key.slice(3));
  }
  // Собеседник личного чата: друг, знакомый по группе или человек из profiles (unknown — ещё не загружен)
  function dmPeer(id) {
    const f = friends.find((x) => String(x.id) === String(id));
    if (f) return { name: f.name || f.handle || 'Пользователь', handle: f.handle || '', avatar: f.avatar || '' };
    const p = chatPersonById(id), unknown = p.name === 'Участник' && !peopleCache.has(String(id));
    return { name: p.name === 'Участник' ? 'Пользователь' : p.name, handle: p.handle, avatar: p.avatar, unknown };
  }

  function chatsListHtml() {
    const gs = myGroups(), ms = myAcceptedMatches();
    const myId = currentUser && currentUser.id;
    const previewOf = (last, fallback, withAuthor) => {
      if (!last) return fallback;
      const text = ellipsize(chatPreviewText(last), 35);
      const who = last.fromId === myId ? 'Вы: ' : (withAuthor && last.authorName ? last.authorName + ': ' : '');
      return who + text;
    };
    const rowHtml = ({ key, attr, avatar, name, fallback, withAuthor }) => {
      const last = chatLast.get(key), n = chatUnread.get(key) || 0;
      // удалённый у себя чат не показываем, пока в нём не появится новое сообщение
      if (!last && chatClearedAt(key)) return '';
      const muted = isChatMuted(key), k = escapeHtml(key);
      // строка сдвигается свайпом влево и открывает кнопки «Уведомления» и «Удалить»
      return `
      <div class="chat-swipe">
        <div class="chat-swipe-actions">
          <button class="group-action-btn settings" type="button" data-chat-mute="${k}" aria-label="Уведомления чата" title="Уведомления">${muted ? ICON_BELL_OFF : ICON_BELL}</button>
          <button class="group-action-btn danger" type="button" data-chat-delete="${k}" aria-label="Удалить чат" title="Удалить чат">${ICON_TRASH}</button>
        </div>
        <div class="chat-row ${n ? 'has-unread' : ''} ${muted ? 'is-muted' : ''}" ${attr} role="button" tabindex="0">
          ${avatar}
          <div class="chat-main">
            <div class="chat-name">${escapeHtml(name)}${muted ? `<span class="chat-muted" title="Уведомления выключены">${ICON_BELL_OFF}</span>` : ''}</div>
            <div class="chat-last">${escapeHtml(previewOf(last, fallback, withAuthor))}</div>
          </div>
          <div class="chat-side">
            ${last ? `<span class="chat-time">${escapeHtml(fmtChatListTime(last.createdAt))}</span>` : ''}
            ${n ? `<span class="unread-pill" aria-label="Непрочитанных: ${n}">${n > 99 ? '99+' : n}</span>` : ''}
          </div>
        </div>
      </div>`;
    };
    const dms = [], grs = [];
    if (myId) {
      for (const g of gs) {
        const key = 'group:' + g.id;
        const avatar = g.photo
          ? `<span class="avatar group-chat-avatar" style="width:44px;height:44px;background-image:url('${safeUrl(g.photo)}')"></span>`
          : `<span class="avatar group-chat-avatar" style="width:44px;height:44px;background:linear-gradient(145deg, var(--c1), var(--c2))">${escapeHtml(firstChar(g.name || '?').toUpperCase())}</span>`;
        grs.push({
          ts: msgTs(chatLast.get(key)),
          html: rowHtml({ key, attr: `data-open-group-chat="${escapeHtml(g.id)}"`, avatar, name: g.name || 'Группа', fallback: 'Групповой чат', withAuthor: true }),
        });
      }
      for (const m of ms) {
        const key = 'match:' + m.id;
        grs.push({
          ts: msgTs(chatLast.get(key)) || Date.parse(m.createdAt) || 0,
          html: rowHtml({
            key, attr: `data-open-match-chat="${escapeHtml(m.id)}"`,
            avatar: featAvatarHtml(m, 44),
            name: matchTitle(m), fallback: 'Match! Напишите первыми', withAuthor: true,
          }),
        });
      }
      // личный чат в списке — только если в нём есть переписка: с другом, с бывшим другом, с кем угодно
      const unknown = [];
      for (const id of dmChatPeers()) {
        const key = 'dm:' + id, p = dmPeer(id);
        if (p.unknown) unknown.push(id);
        dms.push({
          ts: msgTs(chatLast.get(key)),
          html: rowHtml({ key, attr: `data-open-dm="${escapeHtml(id)}"`, avatar: avatarCircleHtml({ name: p.name, avatar: p.avatar }, 44), name: p.name, fallback: 'Начните диалог', withAuthor: false }),
        });
      }
      // собеседника нет среди друзей и знакомых — имя и фото догружаются, и список перерисовывается
      if (unknown.length) ensurePeople(unknown).then((got) => { if (got) paintChatsList(); });
    }
    // свежие диалоги сверху
    const pane = (id, all, empty, items = all.filter((x) => x.html)) => `<div class="chats-pane" data-pane="${id}">${
      items.length ? items.sort((a, b) => b.ts - a.ts).map((x) => x.html).join('') : `<div class="empty-msg">${empty}</div>`}</div>`;
    return pane('dm', dms, 'Пока нет личных чатов.<br>Напишите другу — и переписка появится здесь.')
      + pane('group', grs, 'Пока нет групповых чатов.<br>Создайте группу или вступите в неё.');
  }

  // Перерисовать открытый список (только если он изменился) и счётчики
  function paintChatsList() {
    updateChatBadges();
    const listEl = winBody.querySelector('#chats-list');
    if (!listEl) return;
    const html = chatsListHtml();
    if (listEl.dataset.filled && html === chatsListShown) return;
    if (listEl.dataset.filled) winBody.classList.remove(...SCREEN_ANIM);   // обновление, а не первое появление
    listEl.innerHTML = html;
    listEl.dataset.filled = '1';
    chatsListShown = html;
    if (currentUser) KV.set('chatlist2:' + currentUser.id, html);   // при следующем запуске список покажется сразу
  }

  async function renderChatsList() {
    if (!winBody.querySelector('#chats-list')) return;

  /* Переписки верхних чатов списка — заранее в память (с устройства, а если там пусто или не хватает
     последнего сообщения — с сервера), вместе с их вложениями. Тогда чат открывается без ожидания. */
  let chatsPreheating = false;
  async function preheatChats() {
    if (chatsPreheating || !currentUser) return;
    chatsPreheating = true;
    const uid = currentUser.id;
    const mine = () => currentUser && currentUser.id === uid;
    try {
      const specs = forwardTargets().map((t) => t.spec)
        .sort((a, b) => msgTs(chatLast.get(chatKey(b))) - msgTs(chatLast.get(chatKey(a)))).slice(0, 15);
      for (const spec of specs) {
        if (!mine()) return;
        const key = chatKey(spec);
        if (chat && chatKey(chat) === key) continue;   // открытый чат обновляет себя сам
        let list = chatHistoryCache.get(key);
        if (!list) {
          const saved = await KV.get(`chat:${uid}:${key}`);
          if (!mine()) return;
          list = chatHistoryCache.get(key) || (Array.isArray(saved) ? saved : null);
          if (list) chatHistoryCache.set(key, list);
        }
        const last = chatLast.get(key);
        if (!list || (last && !list.some((m) => String(m.id) === String(last.id)))) {
          const fresh = await loadChatHistory(spec);
          if (!mine()) return;
          if (fresh && !(chat && chatKey(chat) === key)) {
            list = fresh;
            chatHistoryCache.set(key, list);
            KV.set(`chat:${uid}:${key}`, list);
          }
        }
        if (list) await warmChatMedia(list);
      }
    } catch (err) { console.warn('[chat preheat]', err); }
    finally { chatsPreheating = false; }
  }

    if (!v || chat !== c) return;
    if (v === (g.name || '').trim()) { noticeModal({ title: 'Название то же', text: 'Группа уже так называется — предложите другое.' }); return; }
    sendChatMessage({ content: `Предлагаю новое название группы: «${v}»`, special: { propose: 'name', name: v } });
  }
  function proposeGroupPhoto() {
    const c = chat;
    if (!c || c.type !== 'group') return;
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', async () => {
      const file = inp.files && inp.files[0];
      if (!file || !file.type.startsWith('image/') || chat !== c) return;
      let photo = '';
      try { photo = await fileToCompressedDataURL(file, 256, 0.85); } catch (e) { console.warn(e); return; }
      sendChatMessage({ content: 'Предлагаю новую аватарку группы', special: { propose: 'photo', photo } });
    });
    inp.click();
  }
  // Лидер отвечает на предложение: «да» — меняем группу, и в чат уходит ответ
  async function answerProposal(id, ok) {
    const c = chat, m = chatMsgById(id);
    if (!c || c.type !== 'group' || !m || !m.propose || proposalAnswer(m)) return;
    const g = groupById(c.groupId);
    if (!g || !currentUser || g.ownerId !== currentUser.id) return;
    const p = m.propose;
    if (ok) {
      const patch = p.type === 'name' ? { name: p.value.slice(0, 60) } : { photo: p.value };
      const { error } = await supabaseClient.from('groups').update(patch).eq('id', g.id);
      if (error) { alert('Не удалось изменить группу: ' + error.message); return; }
      groups = groups.map((x) => (String(x.id) === String(g.id) ? { ...x, ...patch } : x));
      // в шапке открытого чата — новое название
      if (p.type === 'name' && chat === c) { c.winTitle = patch.name; const t = winTitle.querySelector('.win-title-name'); if (t) t.textContent = patch.name; }
      scheduleFeedRender(); refreshGroupsList();
    }
    const content = ok
      ? (p.type === 'name' ? `✓ Новое название группы: «${p.value}»` : '✓ Новая аватарка группы')
      : (p.type === 'name' ? `Название «${p.value}» не принято` : 'Аватарка не принята');
    await sendChatMessage({ content, special: { answer: String(m.id), ok, propose: p.type } });
    refreshGroupsWorld();
  }

  // Нажали на плашку — карточка группы; «назад» возвращает в чат
  function openSharedGroup(gid) {
    const c = chat;
    if (!c) return;
    if (!groupById(gid)) { alert('Эта группа сейчас не видна — возможно, её удалили или она в союзе.'); return; }
    const spec = { type: c.type, peerId: c.peerId, groupId: c.groupId, matchId: c.matchId };
    const back = c.backFn, reopen = () => openChat(spec, back);
    leaveChat();
    winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
    showGroupDetailsScreen(gid, reopen);
  }

  function chatPreviewText(m) {
    if (m.share) return '👥 Группа «' + m.share.name + '»';
    const labels = { image: '📷 Фото', video: '🎬 Видео', voice: '🎤 Голосовое сообщение', circle: '⭕ Видеосообщение' };
    if (m.kind === 'file') return '📎 ' + (m.fileName || 'Файл');
    if (m.kind && m.kind !== 'text') return labels[m.kind] || 'Вложение';
    return (m.content || '').trim();
  }

  // Группы, где я владелец или участник
  function myGroups() {
    const myId = currentUser && currentUser.id;
    if (!myId) return [];
    return groups.filter((g) => g.ownerId === myId || (g.members || []).some((m) => m.id === myId));
  }

  async function loadChatHistory(c, limit = CHAT_KEEP) {
    const q = c.type === 'dm'
      ? supabaseClient.from('dm_messages').select('*')
          .or(`and(from_id.eq.${currentUser.id},to_id.eq.${c.peerId}),and(from_id.eq.${c.peerId},to_id.eq.${currentUser.id})`)
      : c.type === 'match'
        ? supabaseClient.from('match_messages').select('*').eq('match_id', Number(c.matchId))
        : supabaseClient.from('group_messages').select('*').eq('group_id', c.groupId);
    // последние CHAT_KEEP сообщений: берём с конца и разворачиваем — столько же хранится на устройстве
    const { data, error } = await q.order('created_at', { ascending: false }).limit(limit);
    if (error) { console.warn('[chat] load:', error.message); return null; }
    const cleared = chatClearedAt(chatKey(c));
    return (data || []).reverse().map(c.type === 'dm' ? normDmRow : c.type === 'match' ? normMatchRow : normGroupRow)
      .filter((m) => !isHiddenMsg(c.type, m.id) && msgTs(m) > cleared);
  }

  function fmtDuration(sec) {
    const s = Math.max(0, Math.round(Number(sec) || 0));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function chatMediaHtml(m) {
    // Ссылка подставляется сразу при отрисовке: пока сообщение отправляется — локальный файл, потом — файл,
    // сохранённый на устройстве, а если его там нет — подписанная ссылка, запомненная с прошлого раза.
    // Нет ни того, ни другого — ссылку подставит hydrateChatMedia
    const path = m.mediaPath || '';
    const signed = path ? freshSignedUrl(path) : null;
    const url = m.localUrl || (path && m.kind !== 'file' ? mediaBlobUrls.get(path) : null) || signed;
    const src = (url ? `src="${escapeHtml(url)}" ` : '') + (path ? `data-media-path="${escapeHtml(path)}"` : '');
    if (m.kind === 'image') {
      const size = chatPhotoSize(path);
      return `<img class="chat-photo" ${src} ${size ? `style="${size}"` : ''} alt="Фото" data-open-photo>`;
    }
    if (m.kind === 'video') return `<video class="chat-video" ${src} controls playsinline preload="metadata"></video>`;
    if (m.kind === 'voice') {
      // свой плеер вместо системного: кнопка, «волна» (по ней же перемотка) и время
      return `<div class="chat-voice${isUnheardVoice(m) ? ' is-unheard' : ''}" data-voice data-dur="${Number(m.duration) || 0}">
        <button type="button" class="cv-play" data-voice-play aria-label="Воспроизвести">
          <svg class="cv-ic-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3a1 1 0 0 1 1.5-.86l10.2 6.7a1 1 0 0 1 0 1.72L9.7 19.56a1 1 0 0 1-1.5-.86V5.3z"/></svg>
          <svg class="cv-ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.5 5h2.6a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H7.5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm6.4 0h2.6a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-2.6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
        </button>
        <div class="cv-wave" data-voice-seek aria-hidden="true">${voiceBarsHtml(path || m.id)}</div>
        <span class="chat-voice-dur">${fmtDuration(m.duration)}</span>
        <audio ${src} preload="metadata"></audio>
      </div>`;
    }
    if (m.kind === 'circle') {
      return `<div class="chat-circle-wrap" data-circle>
        <video class="chat-circle" ${src} playsinline muted loop autoplay preload="metadata"></video>
        <svg class="chat-circle-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48.4"/><circle class="ccr-on" cx="50" cy="50" r="48.4" pathLength="100"/></svg>
        ${m.duration ? `<span class="chat-circle-dur">${fmtDuration(m.duration)}</span>` : ''}
        <span class="chat-circle-sound" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.75v4.5h3.4l4.6 3.9V5.85l-4.6 3.9H4z"/><path d="m16.25 9.75 4.5 4.5M20.75 9.75l-4.5 4.5"/></svg></span>
      </div>`;
    }
    if (m.kind === 'file') {
      // Карточка файла: значок по расширению, имя, размер. Ссылку подставит hydrateChatMedia
      const name = m.fileName || 'Файл';
      const ext = fileExt(name);
      const href = m.localUrl ? `href="${escapeHtml(m.localUrl)}"`
        : (signed ? `href="${escapeHtml(signed)}" ` : '') + `data-media-path="${escapeHtml(path)}"`;
      return `<a class="chat-file" ${href} target="_blank" rel="noopener" data-chat-file data-file-name="${escapeHtml(name)}">
        <span class="chat-file-ico" style="background:${fileIconColor(ext)}">${escapeHtml((ext || 'file').slice(0, 4).toUpperCase())}</span>
        <span class="chat-file-main">
          <span class="chat-file-name">${escapeHtml(name)}</span>
          <span class="chat-file-size">${m.fileSize ? escapeHtml(fmtFileSize(m.fileSize)) + ' · ' : ''}${isInlineViewable(ext) ? 'открыть' : 'скачать'}</span>
        </span>
      </a>`;
    }
    return '';
  }

  /* ── Файлы (PDF, документы, архивы) ── */
  // Исполняемые файлы и скрипты не принимаем — их могут подсунуть как «документ»
  const BLOCKED_FILE_EXT = new Set(['exe', 'msi', 'bat', 'cmd', 'com', 'scr', 'pif', 'vbs', 'vbe', 'js', 'jse', 'wsf', 'wsh', 'ps1', 'jar', 'apk', 'app', 'dmg', 'sh', 'reg', 'lnk', 'hta', 'cpl']);
  function fileExt(name) { const m = /\.([a-z0-9]{1,8})$/i.exec(name || ''); return m ? m[1].toLowerCase() : ''; }
  function fmtFileSize(b) {
    if (b < 1024) return b + ' Б';
    if (b < 1024 * 1024) return (b / 1024).toFixed(b < 10240 ? 1 : 0) + ' КБ';
    return (b / 1024 / 1024).toFixed(1) + ' МБ';
  }
  // Что браузер умеет показать сам — открываем во вкладке, остальное скачиваем с нормальным именем
  function isInlineViewable(ext) { return ['pdf', 'txt', 'csv', 'json', 'md', 'jpg', 'jpeg', 'png', 'gif', 'webp', 'mp3', 'mp4'].includes(ext); }
  function fileIconColor(ext) {
    if (ext === 'pdf') return 'linear-gradient(#FF6B5E,#C9302C)';
    if (['doc', 'docx', 'rtf', 'odt', 'pages'].includes(ext)) return 'linear-gradient(#5B9BFF,#2B5FC9)';
    if (['xls', 'xlsx', 'csv', 'ods', 'numbers'].includes(ext)) return 'linear-gradient(#4CD07A,#1E8A45)';
    if (['ppt', 'pptx', 'odp', 'key'].includes(ext)) return 'linear-gradient(#FFA94D,#D9661F)';
    if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return 'linear-gradient(#B08BFF,#6A43C9)';
    if (['txt', 'md', 'json', 'xml'].includes(ext)) return 'linear-gradient(#9AA6C8,#69706C)';
    return 'linear-gradient(145deg, var(--c1), var(--c3))';
  }

  // Скачать файл под его настоящим именем (в хранилище он лежит под служебным)
  async function downloadChatFile(url, name) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blobUrl = URL.createObjectURL(await res.blob());
      const a = document.createElement('a');
      a.href = blobUrl; a.download = name || 'file';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    } catch (err) {
      console.warn('[chat file] download:', err);
      window.open(url, '_blank', 'noopener');
    }
  }

  function chatBubbleHtml(m) {
    const mine = currentUser && String(m.fromId) === String(currentUser.id);
    const isMedia = m.kind && m.kind !== 'text';
    // групповой и совместный чат: у чужого сообщения — имя автора и его аватар (что из них видно, решает syncChatRuns)
    const groupish = !!chat && chat.type !== 'dm';
    let author = '', ava = '';
    if (groupish && !mine) {
      const person = chatPersonById(m.fromId);
      const name = m.authorName || person.name || 'Участник';
      const origin = chat.type === 'match' ? matchOriginName(m.fromId) : '';   // из какой он группы
      author = `<span class="chat-msg-author">${escapeHtml(name)}${origin ? `<span class="chat-msg-origin"> · ${escapeHtml(ellipsize(origin, 24))}</span>` : ''}</span>`;
      ava = `<button type="button" class="chat-msg-ava" data-msg-ava="${escapeHtml(m.fromId)}" tabindex="-1" aria-label="Профиль: ${escapeHtml(name)}">${avatarCircleHtml({ name, avatar: person.avatar }, 32)}</button>`;
    }
    const cls = ['chat-msg', mine ? 'me' : 'them', isMedia ? 'has-media' : '',
      m.kind === 'circle' ? 'is-circle' : '', m.pending ? 'is-pending' : '', m.share ? 'is-share' : '', m.propose ? 'is-propose' : '',
      chat && chat.selected && chat.selected.has(String(m.id)) ? 'is-selected' : ''].join(' ');
    // у своих сообщений рядом со временем — отметка: часы, пока отправляется; потом галочки (их расставляет syncChatReadMarks)
    const ticks = mine ? `<span class="chat-ticks" aria-hidden="true">${m.pending ? ICON_TICK_CLOCK : ICON_TICKS}</span>` : '';
    const time = `<span class="chat-msg-time">${(m.pinned ? '📌 ' : '') + (m.editedAt ? '<span class="chat-edited">изм.</span> ' : '') + fmtTime(m.createdAt) + ticks}</span>`;
    // время идёт сразу за текстом (у фото и видео — за подписью): так оно встаёт в его последнюю строку
    // ссылки в тексте и подписи — кликабельные (linkifyHtml)
    const body = m.share ? chatShareHtml(m) + time
      : m.propose ? chatProposeHtml(m) + time
      : isMedia
      ? chatMediaHtml(m) + (m.content ? `<div class="chat-caption">${linkifyHtml(m.content)}${time}</div>` : time)
      : `<span class="chat-text">${linkifyHtml(m.content)}</span>${time}`;
    // цитата сообщения, на которое ответили: нажатие перематывает ленту к нему
    const quote = m.reply ? `<div class="chat-reply" data-reply-to="${escapeHtml(m.reply.id)}" role="button"><b>${escapeHtml(m.reply.name || 'Сообщение')}</b><span>${escapeHtml(m.reply.text || 'Сообщение')}</span></div>` : '';
    // пересланное: чьё это сообщение — видно и тому, кто переслал, и тому, кому переслали
    const fwd = m.forward ? `<div class="chat-fwd">Переслано от <b>${escapeHtml(m.forward.name || 'пользователя')}</b></div>` : '';
    const run = groupish ? ` data-from="${escapeHtml(m.fromId)}" data-at="${msgTs(m)}"` : '';   // для серий (syncChatRuns)
    return `<div class="${cls}" data-msg-id="${escapeHtml(m.id)}" data-day="${chatDayKey(m.createdAt)}" ${mine && !m.pending ? `data-ts="${msgTs(m)}"` : ''}${run}>${ava}${author}${fwd}${quote}${body}${chatReactsHtml(m)}</div>`;
  }

  // Из какой группы человек — подпись к имени в совместном чате двух групп
  function matchOriginName(uid) {
    const m = chat && chat.type === 'match' ? groupMatches.find((x) => x.id === String(chat.matchId)) : null;
    if (!m) return '';
    const gs = [groupById(m.fromGroup), groupById(m.toGroup)].filter(Boolean);
    const g = gs.find((x) => String(x.ownerId) === String(uid)) || gs.find((x) => isGroupParticipant(x, String(uid)));
    return g ? (g.name || '').trim() : '';
  }

  /* Серии в групповом чате, как в Telegram: сообщения одного человека подряд, с промежутками меньше 15 минут
     и без плашки даты между ними. Имя — над первым сообщением серии (у остальных is-run-cont), аватар — у последнего
     (у остальных is-run-more). fit — заново подобрать ширину тем, у кого имя появилось или пропало */
  const CHAT_RUN_GAP = 15 * 60 * 1000;
  function syncChatRuns(body, fit = true) {
    if (!body || !body.classList.contains('is-group')) return;
    const refit = [];
    let prev = null;
    for (const el of body.children) {
      const msg = el.classList.contains('chat-msg') ? el : null;
      const joined = !!msg && !!prev && prev.dataset.from === msg.dataset.from && Math.abs(msg.dataset.at - prev.dataset.at) < CHAT_RUN_GAP;
      if (msg && msg.classList.contains('is-run-cont') !== joined) { msg.classList.toggle('is-run-cont', joined); refit.push(msg); }
      if (prev && prev.classList.contains('is-run-more') !== joined) prev.classList.toggle('is-run-more', joined);
      prev = msg;
    }
    if (prev) prev.classList.remove('is-run-more');
    if (fit && refit.length) fitChatBubbles(refit);
  }

  /* ── Пузырь по ширине текста, как в Telegram ──
     Текст, перенесённый на несколько строк, CSS растягивает до предельной ширины пузыря (fit-content при переносе
     берёт всё доступное место) — справа остаётся пустая полоса, у одних сообщений шире, у других уже.
     Поэтому самую длинную строку меряем и ставим пузырю её ширину. Сначала снимаем прежние ширины у всех
     сообщений, потом всё меряем, потом всё ставим — лента перекладывается один раз, а не на каждое сообщение. */
  function fitChatBubbles(els) { measureChatBubbles(els)(); }
  /* Замер отдельно от записи: снимаем прежние ширины, всё меряем и возвращаем функцию, которая поставит новые.
     Между замером и записью раскладка готова — высоту ленты можно прочитать и прокрутить её бесплатно. Новые ширины
     высоту не меняют: строки ложатся так же (см. chatBubbleFitWidth) */
  function measureChatBubbles(els) {
    const list = [];
    for (const el of els) if (el.classList.contains('chat-msg') && el.querySelector(':scope > .chat-text')) list.push(el);
    if (!list.length) return () => {};
    for (const el of list) if (el.style.width) el.style.width = '';
    const widths = list.map(chatBubbleFitWidth);
    return () => list.forEach((el, i) => { if (widths[i]) el.style.width = widths[i] + 'px'; });
  }
  // Строки текста узла: у каждой — правый край. Куски одной строки (эмодзи, другой шрифт) складываем в одну
  function chatTextLines(node) {
    const range = document.createRange();
    range.selectNodeContents(node);
    const lines = [];
    for (const r of range.getClientRects()) {
      if (r.height < 1) continue;
      const mid = (r.top + r.bottom) / 2;
      const ln = lines.find((x) => mid > x.top && mid < x.bottom);
      if (ln) { ln.right = Math.max(ln.right, r.right); ln.top = Math.min(ln.top, r.top); ln.bottom = Math.max(ln.bottom, r.bottom); }
      else lines.push({ top: r.top, bottom: r.bottom, right: r.right });
    }
    return lines.sort((a, b) => a.top - b.top);
  }
  // Ширина пузыря, при которой строки ложатся так же, а справа нет пустоты; 0 — менять нечего
  function chatBubbleFitWidth(el) {
    const w = el.offsetWidth;
    if (!w) return 0;   // лента не на экране
    const box = el.getBoundingClientRect();
    const k = box.width / w || 1;   // новое сообщение «выпрыгивает» (scale) — меряем без масштаба
    const cs = getComputedStyle(el);
    const padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
    const inner = el.clientWidth - padL - padR;   // ширина под текст сейчас
    const left = box.left + (el.clientLeft + padL) * k;
    const lines = chatTextLines(el.querySelector(':scope > .chat-text'));
    if (!lines.length) return 0;
    const x = (v) => (v - left) / k;
    let need = Math.max(...lines.map((ln) => x(ln.right)));
    // время остаётся в последней строке, если помещается в ней и сейчас; иначе оно строкой ниже — пузырь не уже него
    const time = el.querySelector(':scope > .chat-msg-time');
    if (time) {
      const tcs = getComputedStyle(time);
      const tw = time.getBoundingClientRect().width / k;   // дробная ширина: offsetWidth округлён и «не помещался» на полпикселя
      const end = x(lines[lines.length - 1].right) + tw + (parseFloat(tcs.marginLeft) || 0) + (parseFloat(tcs.marginRight) || 0);
      need = Math.max(need, end <= inner + 1 ? end : tw);
    }
    // имя автора, «Переслано от …» и цитата должны поместиться целиком (если не помещались и раньше — их обрежет многоточие)
    const textWidth = (node) => { const r = document.createRange(); r.selectNodeContents(node); return r.getBoundingClientRect().width / k; };
    for (const head of el.querySelectorAll(':scope > .chat-msg-author, :scope > .chat-fwd')) need = Math.max(need, textWidth(head));
    const quote = el.querySelector(':scope > .chat-reply');
    if (quote && quote.firstElementChild) {
      need = Math.max(need, Math.max(...[...quote.children].map(textWidth)) + quote.offsetWidth - quote.firstElementChild.offsetWidth);
    }
    // плашки реакций — в один ряд, как без подгонки
    const reacts = el.querySelector(':scope > .chat-reacts');
    if (reacts && reacts.children.length) {
      need = Math.max(need, [...reacts.children].reduce((s, c) => s + c.offsetWidth, 0) + (parseFloat(getComputedStyle(reacts).columnGap) || 0) * (reacts.children.length - 1));
    }
    need = Math.ceil(need + 0.5);
    if (need >= inner - 1) return 0;   // и так впритык
    return need + padL + padR + (el.offsetWidth - el.clientWidth);
  }
  // шрифт Inter догрузился, когда лента уже нарисована, — строки стали другой ширины
  if (document.fonts && document.fonts.addEventListener) {
    document.fonts.addEventListener('loadingdone', () => { const body = winBody.querySelector('#chat-view-body'); if (body) fitChatBubbles(body.children); });
  }

  /* ── Реакции ──
     Долгое нажатие (правая кнопка мыши) — ряд эмодзи над меню, двойное нажатие на сообщение — QUICK_REACTION.
     Нажатие на плашку под сообщением: своя реакция снимается, чужая — ставится такая же. */
  const QUICK_REACTION = '❤️';
  const REACTS_TOP = ['👍', '❤️', '😂', '😮', '😢', '🔥'];
  const REACTS_MORE = ['👎', '🥰', '👏', '😁', '🤔', '🤯', '😱', '🤬', '🎉', '🤩', '🙏', '👌', '🕊', '🤡', '🥱', '🥴', '😍', '🐳',
    '❤️‍🔥', '🌚', '💯', '🤣', '⚡', '🍌', '🏆', '💔', '🤨', '😐', '🍓', '🍾', '💋', '🖕', '😈', '😴', '😭', '🤓', '👻', '👀',
    '🎃', '🙈', '😇', '😨', '🤝', '✍️', '🤗', '🫡', '🎅', '🎄', '☃️', '💅', '🤪', '🗿', '🆒', '💘', '🙉', '🦄', '😘', '💊',
    '🙊', '😎', '👾', '🤷', '😡'];
  const myReaction = (m) => (m && m.reactions && currentUser ? m.reactions[String(currentUser.id)] || null : null);
  const reactKey = (m) => (m && m.reactions ? Object.entries(m.reactions).sort().join(',') : '');
  function chatReactsHtml(m, pop = '') {
    if (!m.reactions || m.pending) return '';
    const groups = new Map();   // эмодзи → кто поставил
    for (const [uid, emoji] of Object.entries(m.reactions)) {
      if (!groups.has(emoji)) groups.set(emoji, []);
      groups.get(emoji).push(uid);
    }
    const mine = myReaction(m), myId = currentUser ? String(currentUser.id) : '';
    const name = (uid) => (uid === myId ? 'Вы' : chatPersonById(uid).name);
    return `<div class="chat-reacts">${[...groups].sort((a, b) => b[1].length - a[1].length).map(([emoji, users]) => `
      <button type="button" class="chat-react ${emoji === mine ? 'is-mine' : ''} ${emoji === pop ? 'is-pop' : ''}" data-react-chip="${escapeHtml(emoji)}"
        title="${escapeHtml(users.map(name).join(', '))}" aria-label="${escapeHtml(emoji)}: ${users.length}"><span class="chat-react-emo">${escapeHtml(emoji)}</span>${users.length > 1 ? `<b>${users.length}</b>` : ''}</button>`).join('')}</div>`;
  }
  // Перерисовать только плашки реакций — сообщение с фото или кружком не пересоздаётся
  function paintChatReacts(m, pop = '') {
    const el = chatBubbleEl(m.id);
    if (!el) return;
    const old = el.querySelector(':scope > .chat-reacts');
    if (old) old.remove();
    const html = chatReactsHtml(m, pop);
    if (html) el.insertAdjacentHTML('beforeend', html);   // плашки — последние в сообщении, под текстом и временем
    fitChatBubbles([el]);   // плашкам может понадобиться пузырь шире
  }

  const reactSqlHint = (error) => /function|schema cache|could not find|reactions|edited_at/i.test(error.message || '')
    ? '\n\nВыполните supabase_chat_reactions.sql в Supabase.' : '';
  async function toggleChatReaction(id, emoji) {
    const c = chat, m = chatMsgById(id);
    if (!c || !m || m.pending || !currentUser || !emoji) return;
    const uid = String(currentUser.id), before = m.reactions;
    const next = { ...(m.reactions || {}) };
    const adding = next[uid] !== emoji;
    if (adding) next[uid] = emoji; else delete next[uid];
    m.reactions = normReactions(next);
    if (navigator.vibrate && adding) { try { navigator.vibrate(8); } catch {} }
    paintChatReacts(m, adding ? emoji : '');   // сразу на экране, сервер — в фоне
    saveChatCache(c);
    const { data, error } = await supabaseClient.rpc('react_chat_message', { chat_kind: c.type, msg_id: String(m.id), emoji });
    if (error) {
      console.warn('[chat react]', error.message);
      m.reactions = before;
      if (chat === c) paintChatReacts(m);
      saveChatCache(c);
      alert('Не удалось поставить реакцию: ' + error.message + reactSqlHint(error));
      return;
    }
    // ответ сервера — реакции всех участников на этот момент
    const fresh = normReactions(data);
    if (reactKey({ reactions: fresh }) !== reactKey(m)) {
      m.reactions = fresh;
      if (chat === c) paintChatReacts(m);
      saveChatCache(c);
    }
  }

  /* ── Редактирование своего сообщения: текст или подпись к фото, видео, файлу ── */
  // пересланное не правят: это чужие слова (или свои, но сказанные в другом чате)
  const canEditMsg = (m) => isMyMsg(m) && !m.pending && !m.forward && !m.share &&['text', 'image', 'video', 'file'].includes(m.kind || 'text');
  function setChatEdit(id) {
    const c = chat;
    if (!c) return;
    const m = id == null ? null : chatMsgById(id);
    if (m && !canEditMsg(m)) return;
    const input = winBody.querySelector('#chat-text');
    if (m) {
      if (!c.editing) c.draft = input ? input.value : '';   // начатое сообщение вернётся в поле после правки
      c.replyTo = null;
      c.editing = m;
      if (input) {
        input.value = m.content || '';
        fitChatInput(input);
        input.focus({ preventScroll: true });
        try { input.setSelectionRange(input.value.length, input.value.length); } catch {}
      }
    } else if (c.editing) {
      c.editing = null;
      if (input) { input.value = c.draft || ''; fitChatInput(input); }
      c.draft = '';
    }
    syncChatReplyBar();
  }
  async function editChatMessage(m, text) {
    const c = chat;
    if (!c || !m || text === m.content) return;
    const prev = { content: m.content, editedAt: m.editedAt || null };
    const apply = (fields) => {
      Object.assign(m, fields);
      if (chat === c) replaceChatBubble(m.id, m);
      saveChatCache(c);
      const key = chatKey(c), last = chatLast.get(key);
      if (last && String(last.id) === String(m.id)) { chatLast.set(key, { ...last, ...fields }); paintChatsList(); }
    };
    apply({ content: text, editedAt: new Date().toISOString() });   // сразу на экране, сервер — в фоне
    const { data, error } = await supabaseClient.rpc('edit_chat_message', { chat_kind: c.type, msg_id: String(m.id), new_content: text });
    if (error) {
      console.warn('[chat edit]', error.message);
      apply(prev);
      alert('Не удалось изменить сообщение: ' + error.message + reactSqlHint(error));
      return;
    }
    // время правки — серверное: по нему сверяется, увидел ли собеседник правку
    if (data && data !== m.editedAt) { m.editedAt = data; if (chat === c) replaceChatBubble(m.id, m); saveChatCache(c); }
  }

  /* ── Даты в ленте чата ──
     Перед первым сообщением каждого дня — плашка по центру: «Сегодня», «Вчера», «5 октября»,
     а для прошлых лет — «5 октября 2024». Плашка прокручивается вместе с лентой; у верха при прокрутке висит плавающая дата (см. initChatFloatDate). */
  function chatDayKey(iso) {
    let d = iso ? new Date(iso) : new Date();
    if (isNaN(d)) d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function chatDayLabel(key) {
    const [y, mo, day] = key.split('-').map(Number);
    const d = new Date(y, mo - 1, day), now = new Date();
    const diff = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - d) / 86400000);
    if (diff === 0) return 'Сегодня';
    if (diff === 1) return 'Вчера';
    return fmtRu(d, y === now.getFullYear() ? DAY_MONTH : DAY_MONTH_YEAR).replace(/\s*г\.$/, '');
  }
  // Привести плашки в соответствие с сообщениями в ленте: добавить недостающие, убрать лишние.
  // scroll = false — ленту вниз поставит тот, кто вызвал (после всех изменений, одной раскладкой)
  function syncChatDates(body, scroll = true) {
    if (!body) return;
    const isDate = (el) => !!el && el.classList.contains('chat-date');
    let changed = false, prevDay = null;
    for (const el of body.querySelectorAll(':scope > .chat-msg')) {
      const day = el.dataset.day || prevDay;
      const sep = isDate(el.previousElementSibling) ? el.previousElementSibling : null;
      if (day && day !== prevDay) {
        const label = chatDayLabel(day);
        if (!sep) { el.insertAdjacentHTML('beforebegin', `<div class="chat-date"><span>${label}</span></div>`); changed = true; }
        else if (sep.firstElementChild.textContent !== label) sep.firstElementChild.textContent = label;
      } else if (sep) { sep.remove(); changed = true; }
      prevDay = day;
    }
    // плашка, за которой не осталось сообщений её дня
    for (const sep of body.querySelectorAll(':scope > .chat-date')) {
      const next = sep.nextElementSibling;
      if (!next || !next.classList.contains('chat-msg')) { sep.remove(); changed = true; }
    }
    if (changed && scroll && chat && chat.stick) scrollChatToBottom();
  }

  /* Плавающая дата, как в Telegram: пока ленту листают, у верха висит дата дня, который сейчас на экране.
     Плашка следующего дня, подъезжая, выталкивает её вверх; через полторы секунды покоя дата гаснет. */
  function initChatFloatDate(body) {
    const fl = winBody.querySelector('#chat-date-float');
    if (!fl) return;
    const PIN = 2, GAP = 4;
    let held = null, timer = 0;
    // плашка в ленте, чьё место заняла плавающая, на это время скрыта — иначе они просвечивают друг сквозь друга
    const release = () => { if (held) held.classList.remove('is-floating'); held = null; };
    const hide = () => { fl.classList.remove('is-on'); release(); };
    body.addEventListener('scroll', () => {
      // ленту вернул вниз скрипт (догрузилось фото, пришло сообщение), а не человек листает — дату не показываем
      if (body.autoTop != null && Math.abs(body.scrollTop - body.autoTop) < 2) { clearTimeout(timer); hide(); return; }
      body.autoTop = null;
      const top = body.getBoundingClientRect().top;
      let cur = null, next = null;
      for (const sep of body.querySelectorAll(':scope > .chat-date')) {
        if (sep.getBoundingClientRect().top - top <= PIN) cur = sep; else { next = sep; break; }
      }
      clearTimeout(timer);
      if (!cur) { hide(); return; }
      if (cur !== held) { release(); held = cur; cur.classList.add('is-floating'); }
      fl.firstElementChild.textContent = cur.firstElementChild.textContent;
      const y = next ? Math.min(PIN, next.getBoundingClientRect().top - top - GAP - fl.offsetHeight) : PIN;
      fl.style.top = (body.offsetTop + y) + 'px';
      // вытолкнутая часть не должна вылезать на шапку чата
      fl.style.clipPath = y < 0 ? `inset(${-y}px 0 0 0)` : '';
      fl.classList.add('is-on');
      timer = setTimeout(hide, 1500);
    }, { passive: true });
  }

  const mediaUrlCache = new Map(); // путь в Storage → { url, exp }

  // Размер фото на экране известен заранее — место под него занято ещё до загрузки
  function chatPhotoSize(path) {
    const d = path && mediaDims.get(path);
    if (!d) return '';
    const k = Math.min(1, 260 / d[0], 320 / d[1]);
    return `width:${Math.max(1, Math.round(d[0] * k))}px;aspect-ratio:${d[0]}/${d[1]}`;
  }
  /* Фото, размер которого заранее не знали (новое, ещё не сохранённое на устройстве), загрузилось — ставим ему
     размер так же, как известным. Иначе пузырь растягивался на исходную ширину снимка (в пикселях камеры),
     а само фото занимало только его левую часть */
  function sizeChatPhoto(img) {
    if (img.style.aspectRatio || !img.naturalWidth || !img.naturalHeight) return;
    const path = img.dataset.mediaPath;
    if (!path) return;
    if (!mediaDims.has(path)) mediaDims.set(path, [img.naturalWidth, img.naturalHeight]);
    img.style.cssText += chatPhotoSize(path);
  }

  const mediaAttr = (el) => (el.tagName === 'A' ? 'href' : 'src');
  const mediaPending = (el) => !el.getAttribute(mediaAttr(el));

  /* Подставить ссылки туда, где их ещё нет: сначала файл с устройства, иначе — подписанная ссылка */
  async function fillChatMedia(els, remoteOnly = false) {
    if (!remoteOnly) {
      await Promise.all(els.filter((el) => el.tagName !== 'A').map(async (el) => {
        const path = el.dataset.mediaPath;
        const url = await cachedMediaUrl(path);
        if (!url || !mediaPending(el)) return;
        if (el.tagName === 'IMG' && !el.style.aspectRatio) el.style.cssText += chatPhotoSize(path);
        el.src = url;
        playWanted(el);
      }));
    }
    const rest = els.filter((el) => el.isConnected && mediaPending(el));
    if (!rest.length) return;
    await signMediaPaths(rest.map((el) => el.dataset.mediaPath));
    for (const el of rest) {
      const url = freshSignedUrl(el.dataset.mediaPath);
      if (url && mediaPending(el)) { el.setAttribute(mediaAttr(el), url); playWanted(el); }
    }
  }

  // Вложение не открылось (ссылка устарела, файл на устройстве испорчен) — один раз берём свежую ссылку
  function onChatMediaError(el) {
    const path = el.dataset.mediaPath, src = el.getAttribute('src') || '';
    if (!path || !src) return;
    if (el.dataset.mediaRetried) { if (el.tagName !== 'IMG') showMediaFallback(el, src); return; }
    el.dataset.mediaRetried = '1';
    if (src.startsWith('blob:')) mediaBlobUrls.delete(path); else mediaUrlCache.delete(path);
    el.removeAttribute('src');
    fillChatMedia([el], true);
  }

  /* Медиа сообщений: большинство уже нарисовано со ссылкой (см. chatMediaHtml). Здесь — недостающие ссылки
     и сохранение фото, голосовых и кружков на устройство, чтобы в следующий раз они открылись мгновенно. */
  async function hydrateChatMedia(root) {
    if (!root) return;
    const els = [...root.querySelectorAll('[data-media-path]')].filter((el) => el.dataset.mediaPath && !el.dataset.mediaBound);
    if (!els.length) return;
    for (const el of els) {
      el.dataset.mediaBound = '1';
      if (el.tagName === 'A') continue;
      // когда медиа загрузится, высота сообщения может вырасти — держим ленту внизу
      el.addEventListener(el.tagName === 'IMG' ? 'load' : 'loadedmetadata', () => {
        if (el.tagName === 'IMG') sizeChatPhoto(el);
        if (chat && chat.stick) scrollChatToBottom();
      });
      if (el.tagName === 'IMG' && el.complete) sizeChatPhoto(el);   // уже загрузилось (из кеша браузера) — load не придёт
      el.addEventListener('error', () => onChatMediaError(el));
    }
    await fillChatMedia(els.filter(mediaPending));
    for (const el of els) {
      const isImg = el.tagName === 'IMG';
      if (!isImg && el.tagName !== 'AUDIO' && !el.classList.contains('chat-circle')) continue;
      const path = el.dataset.mediaPath;
      if (mediaBlobUrls.has(path)) continue;
      const keep = () => { const url = freshSignedUrl(path); if (url) ensureMediaCached(path, url); };
      // фото сохраняем после того, как оно показалось: второй раз по сети оно не скачивается
      if (isImg && !el.complete) el.addEventListener('load', keep, { once: true }); else keep();
    }
  }

  // Браузер не смог декодировать запись (например, формат другого устройства) —
  // вместо пустого плеера даём открыть файл напрямую
  function showMediaFallback(el, url) {
    const box = el.closest('.chat-circle-wrap') || el.closest('.chat-voice') || el;
    const a = document.createElement('a');
    a.className = 'chat-media-fallback';
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    const kind = el.closest('.chat-circle-wrap') ? 'circle' : (el.tagName === 'AUDIO' ? 'voice' : 'video');
    a.textContent = { circle: '⭕ Открыть видеосообщение', voice: '🎤 Открыть голосовое', video: '🎬 Открыть видео' }[kind];
    const msg = box.closest('.chat-msg');
    if (msg) msg.classList.remove('is-circle');
    box.replaceWith(a);
  }

  const chatEmptyHtml = () => `<div class="empty-msg">${chat && chat.loading ? 'Загружаем сообщения…' : 'Начните диалог.'}</div>`;

  /* ── Обои чатов: разбросанные буквы G R O U P I E S ──
     Узор рисуется один раз, шрифтом приложения, и служит маской (--chat-wall): цвет ему даёт тема, поэтому обои
     сами меняются вместе со схемой и светлой или тёмной темой. Раскладка одна и та же при каждом запуске;
     буква у края плитки рисуется и с другой её стороны — плитки сходятся без швов */
  let chatWallReady = false;
  const CHAT_WALL_KEY = 'ui:chat-wall:v1';
  function ensureChatWall() {
    if (chatWallReady) return;
    chatWallReady = true;
    // переменная — у окна (обои есть только в чате внутри него), а не у всей страницы: смена переменной
    // у корня заставляла браузер пересчитать стили каждого элемента на экране
    const put = (url) => { try { win.style.setProperty('--chat-wall', `url(${url})`); } catch {} };
    const draw = () => {
      const S = 360, k = 2, N = 4, cell = S / N;
      const c = document.createElement('canvas');
      c.width = c.height = S * k;
      // холст без видеокарты: картинка маленькая и рисуется один раз, а аппаратный холст дорого создавать
      // и потом вычитывать из видеопамяти для toBlob — это и было заметной паузой
      const g = c.getContext('2d', { willReadFrequently: true });
      g.scale(k, k);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      let seed = 11;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const letters = 'GROUPIES';
      let i = 0;
      for (let row = 0; row < N; row++) {
        for (let col = 0; col < N; col++) {
          const ch = letters[i++ % letters.length];
          const size = 20 + rnd() * 24;
          const x = (col + 0.5 + (row % 2 ? 0.5 : 0)) * cell + (rnd() - 0.5) * cell * 0.45;
          const y = (row + 0.5) * cell + (rnd() - 0.5) * cell * 0.4;
          const rot = (rnd() - 0.5) * 1.1;
          const outline = rnd() < 0.45;
          g.font = `700 ${Math.round(size)}px Inter, system-ui, sans-serif`;   // один раз на букву: смена шрифта — дорогая
          for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) {
            const px = x + dx, py = y + dy;
            if (px < -50 || px > S + 50 || py < -50 || py > S + 50) continue;
            g.save();
            g.translate(px, py);
            g.rotate(rot);
            if (outline) { g.lineWidth = 1.5; g.strokeStyle = '#000'; g.strokeText(ch, 0, 0); }
            else { g.fillStyle = '#000'; g.fillText(ch, 0, 0); }
            g.restore();
          }
        }
      }
      // картинку сжимает браузер в фоне (toBlob), а не главный поток посреди открытия чата; готовый узор
      // остаётся на устройстве — при следующих запусках его не рисуем заново
      if (c.toBlob) c.toBlob((b) => {
        if (!b) { put(c.toDataURL('image/png')); return; }
        put(URL.createObjectURL(b));
        KV.mediaSet(CHAT_WALL_KEY, { blob: b, at: Date.now() });
      }, 'image/png');
      else put(c.toDataURL('image/png'));
    };
    // ждём шрифт Inter, но не дольше секунды: без него буквы нарисуются системным шрифтом.
    // Рисуем в свободный момент: обычно узор уже готов заранее (см. запуск), иначе — сразу после того, как чат показан
    const paint = () => {
      const font = document.fonts && document.fonts.load
        ? Promise.race([document.fonts.load('700 32px Inter'), new Promise((r) => setTimeout(r, 1000))]) : Promise.resolve();
      const later = () => (window.requestIdleCallback ? requestIdleCallback(draw, { timeout: 600 }) : setTimeout(draw, 60));
      font.then(later, later);
    };
    KV.mediaGet(CHAT_WALL_KEY).then((rec) => {
      if (rec && rec.blob) { try { put(URL.createObjectURL(rec.blob)); return; } catch {} }
      paint();
    }, paint);
  }

  function renderChatView() {
    ensureChatWall();
    // сначала — последние сообщения (их и видно), старые дорисуются сверху сразу после первого кадра
    const split = chatSplitIndex(chat.messages);
    const rows = chatRowsHtml(chat.messages.slice(split));
    nowPlaying = null;
    winBody.innerHTML = `
      <div class="support-chat chat-view" style="height:100%">
        <div class="chat-player" id="chat-player" hidden>
          <button type="button" class="cp-toggle" data-player-toggle aria-label="Пауза">
            <svg class="cp-ic-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3a1 1 0 0 1 1.5-.86l10.2 6.7a1 1 0 0 1 0 1.72L9.7 19.56a1 1 0 0 1-1.5-.86V5.3z"/></svg>
            <svg class="cp-ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.5 5h2.6a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H7.5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm6.4 0h2.6a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-2.6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
          </button>
          <div class="cp-main" data-player-jump role="button" tabindex="0"><span class="cp-title"></span><span class="cp-sub"></span></div>

        </div>
        ${chat.type === 'match' ? '<div class="match-vote" id="match-vote"></div>' : ''}
        <div class="chat-pin" id="chat-pin" role="button" tabindex="0" hidden></div>
        <div class="support-chat-body${chat.type !== 'dm' ? ' is-group' : ''}" id="chat-view-body">${rows}</div>
        <div class="chat-down-wrap"><button type="button" class="chat-down" id="chat-down" aria-label="К последним сообщениям" title="К последним сообщениям">${ICON_CHEV_DOWN}<span class="unread-pill" hidden></span></button></div>
        <div class="chat-date chat-date-float" id="chat-date-float" aria-hidden="true"><span></span></div>
        <div class="chat-rec-preview" id="chat-rec-preview" hidden><video playsinline muted></video><span class="chat-rec-ring"></span></div>
        <div class="chat-pin chat-reply-bar" id="chat-reply-bar" hidden></div>
        <form class="support-chat-form chat-composer" id="chat-composer">
          <button type="button" class="chat-tool" data-chat-attach title="Фото, видео или файл" aria-label="Прикрепить фото, видео или файл">${ICON_CLIP}</button>
          ${chat.type === 'match' ? `<button type="button" class="chat-tool vote-tool" id="chat-vote-tool" data-vote-tool hidden title="Голосование о союзе" aria-label="Голосование о союзе">${ICON_SIRENS}</button>` : ''}
          <input type="file" id="chat-file" multiple hidden>
          <textarea class="support-chat-input chat-textarea" id="chat-text" rows="1" placeholder="Сообщение…" maxlength="1000" autocomplete="off" enterkeyhint="enter"></textarea>
          <button type="button" class="chat-tool" data-chat-rec="voice" title="Голосовое сообщение" aria-label="Записать голосовое сообщение">${ICON_MIC}</button>
          <button type="button" class="chat-tool" data-chat-rec="circle" title="Видеосообщение" aria-label="Записать видеокружок">${ICON_CIRCLE}</button>
          <button class="support-chat-send" type="submit" aria-label="Отправить">${ICON_SEND}</button>
        </form>
        <div class="chat-recbar" id="chat-recbar" hidden>
          <span class="chat-rec-dot" aria-hidden="true"></span>
          <span class="chat-rec-label" id="chat-rec-label">Запись</span>
          <span class="chat-rec-time" id="chat-rec-time">0:00</span>
          <span class="sub-toolbar-spacer"></span>
          <button type="button" class="btn" data-chat-rec-cancel>Отмена</button>
          <button type="button" class="btn btn-primary" data-chat-rec-send>Отправить</button>
        </div>
        <div class="chat-selbar" id="chat-selbar" hidden>
          <button type="button" class="btn" data-sel-cancel>Отмена</button>
          <span class="chat-sel-count" id="chat-sel-count"></span>
          <button type="button" class="btn" data-sel-forward>Переслать</button>
          <button type="button" class="btn btn-danger" data-sel-delete>Удалить</button>
        </div>
      </div>`;
    const body = winBody.querySelector('#chat-view-body');
    chat.stick = true;
    chat.below = 0;   // сколько сообщений пришло, пока ленту листали вверх
    watchChatUserScroll(body);
    body.addEventListener('scroll', () => {
      if (!chat) return;
      const near = chatNearEnd(body);
      /* Лента только что сама доехала до нового сообщения, а человек её не трогал — значит, это запоздалое
         событие прокрутки (iPhone досылает их после инерции): ленту не отцепляем от конца, а возвращаем вниз.
         Так же — если ленту с тех пор, как её поставил вниз скрипт (autoTop), никто не трогал: событие пришло ровно
         туда, куда её поставили, или за это время выросла сама лента — догрузились фото, размер которых не был известен
         заранее (браузер при этом сам сдвигает ленту, чтобы видимое не прыгало) */
      const own = body.autoTop != null && (Math.abs(body.scrollTop - body.autoTop) < 2 || body.scrollHeight !== body.autoHeight);
      if (!near && chat.stick && (own || performance.now() < chatFollowUntil) && !chatUserScrolling()) { scrollChatToBottom(); return; }
      chat.stick = near;
      // вернулись к концу ленты — то, что пришло, пока её листали, теперь увидено
      if (chat.stick && chat.below) { chat.below = 0; markChatRead(chat); }
      syncChatDown();
    }, { passive: true });
    const down = winBody.querySelector('#chat-down');
    down.addEventListener('click', () => scrollChatToBottom(true));
    // как и «Отправить», кнопка не забирает фокус у поля — клавиатура телефона не прячется
    down.addEventListener('mousedown', (e) => { if (document.activeElement === winBody.querySelector('#chat-text')) e.preventDefault(); });
    syncChatDates(body, false);
    initChatFloatDate(body);
    /* Лента внизу, пока высота чего-то меняется: догрузилось фото, появилась плашка закреплённого,
       выехала клавиатура. ResizeObserver срабатывает до отрисовки кадра — лента не дёргается,
       как было, когда её возвращали вниз уже после того, как кадр показан */
    const keepBottom = window.ResizeObserver ? new ResizeObserver(() => { if (chat && chat.stick) scrollChatToBottom(); }) : null;
    const watchSizes = () => {
      if (!keepBottom) return;
      keepBottom.observe(body);
