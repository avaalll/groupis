  /* ── Карточка группы ──
     Сверху — фото группы в спектральной рамке, название и короткие сведения (сколько участников, средний возраст,
     состав). Главное в карточке — match: у чужой группы это отдельная тёмная карточка с двумя знаками групп, которые
     тянутся друг к другу, и большой кнопкой «Предложить match»; если запрос уже есть — его состояние и ответ.
     Ниже — желание группы и участники (у участника рядом с ними — вкладки «Медиа», «Ссылки», «Файлы» из чата) */
  const ICON_MATCH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="12" r="5.6"/><circle cx="15" cy="12" r="5.6"/><path fill="currentColor" stroke="none" d="M12 7.27A5.6 5.6 0 0 1 12 16.73A5.6 5.6 0 0 1 12 7.27Z"/></svg>`;
  const GX_LENS = 'M60 11.51A26 26 0 0 1 60 52.49A26 26 0 0 1 60 11.51Z';   // пересечение двух знаков 52×52 со сдвигом 32
  // Круглый знак группы для карточки match: фото, а без фото — первая буква на цвете группы
  function gxDiscHtml(g, cls) {
    if (!g) return `<span class="gx-disc ${cls} is-q">?</span>`;
    const url = safeUrl(g.photo);
    return `<span class="gx-disc ${cls}"${url ? ` style="background-image:url('${url}')"` : ''}>${url ? '' : escapeHtml(firstChar((g.name || '?').trim()).toUpperCase() || '?')}</span>`;
  }
  function gxArtHtml(a, b) {
    return `<div class="gx-art" aria-hidden="true"><span class="gx-ring"></span><span class="gx-ring"></span>
      ${gxDiscHtml(a, 'is-a')}${gxDiscHtml(b, 'is-b')}<svg class="gx-lens" viewBox="0 0 120 64"><path d="${GX_LENS}"/></svg></div>`;
  }
  // Состояние запроса или match: знак, две строки и действие (или кнопки ответа под ним)
  function gxStateHtml({ cls = '', ico, title, sub, action = '', actions = '' }) {
    return `<div class="gx-state ${cls}">
      ${ico}
      <div class="gx-state-main"><div class="gx-state-title">${escapeHtml(title)}</div><div class="gx-state-sub">${escapeHtml(sub)}</div></div>
      ${action}
      ${actions ? `<div class="gx-actions">${actions}</div>` : ''}
    </div>`;
  }
  const ICON_SHARE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>`;

  /* ── Поделиться группой в чате своей группы ──
     В чат уходит сообщение-плашка этой группы: фото, название, состав, желание. По нажатию открывается её карточка,
     а кнопки «Нравится» / «Мимо» на плашке — реакции на сообщение, так группа оценивает находку.
     Плашка — обычное текстовое сообщение («Группа «…»»), а данные группы лежат в колонке reply с пометкой share:
     база не меняется, а у старой версии приложения сообщение просто видно текстом */
  async function shareGroupToChat(g, chatGroupId) {
    const spec = { type: 'group', groupId: String(chatGroupId) };
    const share = { share: 'group', gid: String(g.id), name: cutChars(g.name || 'Группа', 80), count: groupPeople(g).length, wish: cutChars(g.wish || '', 140) };
    const { data, error } = await insertChatRow(spec, { kind: 'text', content: `Группа «${share.name}»`, reply: share });
    if (error) throw error;
    if (!data) return;
    noteChatMessage(data, true);
    const list = chatHistoryCache.get(chatKey(spec));
    if (list && !list.some((x) => String(x.id) === String(data.id))) list.push(data);
  }
  function pickShareTargets(list) {
    if (list.length === 1) return Promise.resolve(list);
    return new Promise((resolve) => {
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      back.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <h3 class="modal-title">Поделиться в чате группы</h3>
          <ul class="fwd-list">${list.map((g, i) => `
            <li class="person-card" data-share-pick="${i}" role="checkbox" aria-checked="false" tabindex="0">
              <span class="person-check"></span>
              <span class="group-avatar" style="width:36px;height:36px;font-size:15px;${safeUrl(g.photo) ? `background-image:url('${safeUrl(g.photo)}')` : ''}">${safeUrl(g.photo) ? '' : escapeHtml(firstChar(g.name || '?').toUpperCase())}</span>
              <div class="person-main"><div class="person-name">${escapeHtml(g.name)}</div><div class="person-handle">${escapeHtml(membersLabel(groupPeople(g).length))}</div></div>
            </li>`).join('')}</ul>
          <div class="modal-actions">
            <button type="button" class="btn" data-cancel>Отмена</button>
            <button type="button" class="btn btn-primary" data-send disabled>Отправить</button>
          </div>
        </div>`;
      modalHost().appendChild(back);
      const send = back.querySelector('[data-send]');
      const chosen = () => [...back.querySelectorAll('[data-share-pick][aria-checked="true"]')].map((el) => list[Number(el.dataset.sharePick)]);
      back.addEventListener('click', (e) => {
        if (e.target === back || e.target.closest('[data-cancel]')) { back.remove(); resolve([]); return; }
        const row = e.target.closest('[data-share-pick]');
        if (row) { row.setAttribute('aria-checked', String(row.getAttribute('aria-checked') !== 'true')); send.disabled = !chosen().length; return; }
        if (e.target.closest('[data-send]')) { const c = chosen(); back.remove(); resolve(c); }
      });
    });
  }
  async function shareGroupFlow(gid, btn) {
    if (isBotId(gid)) { botNoChat(); return; }   // группу-бота в настоящий чат не отправляем
    const g = groupById(gid);
    const targets = myGroups().filter((x) => String(x.id) !== String(gid));
    if (!g || !targets.length) return;
    const picked = await pickShareTargets(targets);
    if (!picked.length) return;
    const label = btn.innerHTML;
    btn.disabled = true;
    try {
      for (const t of picked) await shareGroupToChat(g, t.id);
      btn.innerHTML = picked.length === 1 ? `Отправлено в «${escapeHtml(ellipsize(picked[0].name || 'Группа', 18))}»` : 'Отправлено ✓';
    } catch (err) {
      console.warn('[share group]', err);
      alert('Не удалось поделиться: ' + ((err && err.message) || err));
      btn.innerHTML = label;
    }
    setTimeout(() => { if (btn.isConnected) { btn.innerHTML = label; btn.disabled = false; } }, 2500);
  }

  const gxWaitIco = '<span class="gx-ico"><span class="gx-wait-dot"></span></span>';
  const gxOpenChat = (m) => `<button class="btn btn-primary" type="button" data-open-match-chat="${escapeHtml(m.id)}">Чат</button>`;
  const gxAnswer = (m) => `<button class="btn btn-primary" type="button" data-gm-accept="${escapeHtml(m.id)}">Принять match</button>
    <button class="btn" type="button" data-gm-decline="${escapeHtml(m.id)}">Отклонить</button>`;

  /* Match в карточке чужой группы: предложить от своей группы, ждать ответа, ответить или открыть общий чат */
  function gxMatchHtml(g) {
    const myId = currentUser && currentUser.id;
    const u = myUnion();
    if (u) {
      const m = matchBetween(u.mine.id, u.partner.id);
      if (String(g.id) === String(u.partner.id) && m) {
        return gxStateHtml({ cls: 'is-ok', ico: featAvatarHtml(m, 40), title: 'Союз закреплён', sub: 'Вы видите в ленте только друг друга', action: gxOpenChat(m) });
      }
      return gxStateHtml({ cls: 'is-muted', ico: `<span class="gx-ico">${ICON_MATCH}</span>`, title: 'Новые match недоступны',
        sub: `Ваша группа в союзе с «${u.partner.name}»` });
    }
    const led = groupsOwnedBy(myId);
    if (!led.length) {
      // в группе, но не лидер: запросы и match своей группы видны, а отвечает и предлагает лидер
      const mineAll = myGroups();
      if (mineAll.length) {
        const states = [];
        for (const mine of mineAll) {
          const m = matchBetween(mine.id, g.id);
          if (m && m.status === 'accepted') {
            states.push(gxStateHtml({ cls: 'is-ok', ico: featAvatarHtml(m, 40), title: `Match с «${mine.name}»`, sub: 'Общий чат открыт', action: gxOpenChat(m) }));
          } else if (m && m.status === 'pending' && m.toGroup === String(mine.id)) {
            states.push(gxStateHtml({ cls: 'is-in', ico: featAvatarHtml(m, 40), title: 'Хотят match с вашей группой', sub: `«${g.name}» → «${mine.name}» · ответит лидер` }));
          } else if (m && m.status === 'pending') {
            states.push(gxStateHtml({ cls: 'is-wait', ico: gxWaitIco, title: 'Запрос отправлен', sub: `От «${mine.name}» · ждём ответа лидера` }));
          }
        }
        if (states.length) return states.join('');
        return gxStateHtml({ cls: 'is-muted', ico: `<span class="gx-ico">${ICON_MATCH}</span>`, title: 'Match предлагает лидер',
          sub: 'Попросите лидера вашей группы предложить match' });
      }
      return `<div class="gx-cta">
        ${gxArtHtml(null, g)}
        <div class="gx-cta-title">Match с «${escapeHtml(g.name)}»</div>
        <div class="gx-cta-text">Match предлагают лидеры групп. Создайте свою группу — после match у групп появится общий чат</div>
        <button type="button" class="gx-cta-btn" data-action="create-group">${ICON_PLUS}Создать группу</button>
      </div>`;
    }
    const blocks = [], free = [];
    // все мои группы: в своих отвечаю и предлагаю я, в чужих (я участник) — только вижу состояние
    for (const mine of myGroups()) {
      const m = matchBetween(mine.id, g.id);
      if (mine.ownerId !== myId) {
        if (m && m.status === 'pending' && m.toGroup === String(mine.id)) {
          blocks.push(gxStateHtml({ cls: 'is-in', ico: featAvatarHtml(m, 40), title: 'Хотят match с вашей группой', sub: `«${g.name}» → «${mine.name}» · ответит лидер` }));
        } else if (m && m.status === 'pending') {
          blocks.push(gxStateHtml({ cls: 'is-wait', ico: gxWaitIco, title: 'Запрос отправлен', sub: `От «${mine.name}» · ждём ответа лидера` }));
        } else if (m && m.status === 'accepted') {
          blocks.push(gxStateHtml({ cls: 'is-ok', ico: featAvatarHtml(m, 40), title: `Match с «${mine.name}»`, sub: 'Общий чат открыт', action: gxOpenChat(m) }));
        }
        continue;
      }
      if (m && m.status === 'accepted') {
        blocks.push(gxStateHtml({ cls: 'is-ok', ico: featAvatarHtml(m, 40), title: `Match с «${mine.name}»`,
          sub: m.voteState === 'approved' ? 'Союз закреплён' : m.voteState === 'open' ? 'Идёт голосование о союзе' : 'Общий чат открыт', action: gxOpenChat(m) }));
      } else if (m && m.status === 'pending' && m.fromGroup === String(mine.id)) {
        blocks.push(gxStateHtml({ cls: 'is-wait', ico: gxWaitIco, title: 'Запрос отправлен', sub: `От «${mine.name}» · ждём ответа лидера` }));
      } else if (m && m.status === 'pending') {
        blocks.push(gxStateHtml({ cls: 'is-in', ico: featAvatarHtml(m, 40), title: 'Хотят match с вами', sub: `«${g.name}» → «${mine.name}»`, actions: gxAnswer(m) }));
      } else if (!m || m.status !== 'dissolved') free.push(mine);
    }
    if (free.length) {
      const first = free[0];
      blocks.unshift(`<div class="gx-cta">
        ${gxArtHtml(first, g)}
        <div class="gx-cta-title">Match с «${escapeHtml(g.name)}»</div>
        <div class="gx-cta-text">Группы получат общий чат — дальше решаете вместе</div>
        ${free.length > 1 ? `<div class="gx-from" role="group" aria-label="От какой группы">${free.map((x, i) => `
          <button type="button" class="gx-from-opt" data-match-from="${escapeHtml(x.id)}" aria-pressed="${i === 0}">${escapeHtml(ellipsize(x.name || 'Группа', 18))}</button>`).join('')}</div>` : ''}
        <button type="button" class="gx-cta-btn" data-match-send="${escapeHtml(first.id)}" data-match-to="${escapeHtml(g.id)}">${ICON_MATCH}Предложить match</button>
      </div>`);
    }
    return blocks.join('');
  }

  /* Match в карточке своей группы: совместные чаты, входящие и отправленные запросы. Ничего нет — подсказка, где искать */
  function gxOwnMatchesHtml(g) {
    const myId = currentUser && currentUser.id;
    const gid = String(g.id);
    const list = groupMatches.filter((m) => (m.fromGroup === gid || m.toGroup === gid) && m.status !== 'declined' && m.status !== 'dissolved');
    if (!list.length) {
      const leader = g.ownerId === myId;
      return `<div class="gx-cta is-soft">
        ${gxArtHtml(g, null)}
        <div class="gx-cta-title">Найдите свой match</div>
        <div class="gx-cta-text">${leader ? 'Найдите в ленте группу с похожим желанием и смахните её вправо — это запрос на match' : 'Лидер группы может предложить match любой группе из ленты'}</div>
        <button type="button" class="gx-cta-btn" data-action="open-feed">${ICON_FEED}Открыть ленту</button>
      </div>`;
    }
    return list.map((m) => {
      const otherId = m.fromGroup === gid ? m.toGroup : m.fromGroup;
      const other = groupById(otherId);
      const otherName = other ? other.name : 'Группа';
      if (m.status === 'accepted') {
        return gxStateHtml({ cls: 'is-ok', ico: featAvatarHtml(m, 40), title: matchTitle(m),
          sub: m.voteState === 'approved' ? 'Союз закреплён — только вы друг у друга' : m.voteState === 'open' ? 'Идёт голосование о союзе' : 'Общий чат открыт',
          action: gxOpenChat(m) });
      }
      if (m.toGroup === gid && m.toOwner === myId) {
        return gxStateHtml({ cls: 'is-in', ico: featAvatarHtml(m, 40), title: `«${otherName}» хотят match`, sub: 'Посмотрите группу и ответьте',
          actions: gxAnswer(m) + `<button class="btn gx-wide" type="button" data-view-group="${escapeHtml(otherId)}">Посмотреть группу</button>` });
      }
      return gxStateHtml({ cls: 'is-wait', ico: gxWaitIco, title: otherName, sub: m.toGroup === gid ? 'Хотят match · ждёт ответа лидера' : 'Запрос отправлен · ждём ответа' });
    }).join('');
  }

  /* Карточка группы. fromChat — открыта нажатием на шапку чата этой группы: «назад» и «Чат группы»
     возвращают в тот же чат. У участника под составом — вкладки «Медиа», «Ссылки», «Файлы» из чата группы (sharedTabs) */
  function showGroupDetailsScreen(groupId, backFn, fromChat = false) {
    const back = backFn || (() => showGroupsScreen());
    groupDetailsId = groupId;
    groupDetailsBack = back;
    groupDetailsChat = !!fromChat;
    setScreen(() => {
      const g = groupById(groupId);
      winBody.scrollTop = 0;
      if (!g) {
        winTitle.textContent = 'Группа';
        winBody.innerHTML = `<div class="empty-msg">Группа не найдена — возможно, её удалили.</div>`;
        return;
      }
      const myId = currentUser && currentUser.id;
      const isMember = isGroupParticipant(g, myId);
      winTitle.textContent = g.name;
      const people = groupPeople(g);
      const peopleHtml = people.map((p) => {
        const isMe = p.id === myId;
        return `
          <li class="person-card ${isMe ? '' : 'is-link'}" ${isMe ? '' : `data-view-profile="${escapeHtml(p.id)}" role="button" tabindex="0"`}>
            ${avatarCircleHtml(p, 40)}
            <div class="person-main">
              <div class="person-name">${escapeHtml(p.name || 'Пользователь')}${isMe ? ' (вы)' : ''}</div>
              <div class="person-handle">${p.leader ? '<span class="gx-tag">Лидер</span>' : escapeHtml(p.handle || '')}</div>
            </div>
            ${isMe ? '' : '<span class="chev">›</span>'}
          </li>`;
      }).join('');
      // Лидер видит, кому отправлено приглашение и кто ещё не ответил
      const invitedHtml = g.ownerId === myId ? pendingInvitesOfGroup(g.id).map((inv) => {
        const p = personById(inv.toId) || chatPersonById(inv.toId);
        return `
          <li class="person-card">
            ${avatarCircleHtml(p, 40)}
            <div class="person-main">
              <div class="person-name">${escapeHtml(p.name || 'Пользователь')}</div>
              <div class="person-handle">Приглашение отправлено</div>
            </div>
          </li>`;
      }).join('') : '';
      const mapNote = groupInFeed(g) ? ''
        : `<div class="match-hint">Группа пока не видна в ленте: она появится, когда в ней будет хотя бы двое.</div>`;

      // Есть желание — превью облака над плашкой группы и кнопки «Изменить» / «Удалить» для участников
      const wishHtml = g.wish
        ? `<div class="wish-block gx-wish">
            ${groupWishPreviewHtml(g)}
            ${g.wishAt ? `<div class="wish-meta">обновлено ${wishTimeLabel(Date.parse(g.wishAt))}${wishLeftLabel(Date.parse(g.wishAt)) ? ' · ' + wishLeftLabel(Date.parse(g.wishAt)) : ''}</div>` : ''}
            ${isMember ? groupWishActionsHtml(g) : ''}
          </div>`
        : isMember
          ? `<form class="group-wish-form" id="group-wish-form">
              <input class="edit-input" type="text" id="group-wish-input" maxlength="120" placeholder="Например: сходить в кино сегодня вечером">
              <div class="edit-actions">
                <button type="submit" class="btn btn-primary">Опубликовать</button>
              </div>
              <span class="edit-hint">Желание появится на карточке группы в ленте — его увидят все. Через 12 часов оно исчезнет само.</span>
            </form>`
          : `<div class="match-hint">Группа пока не опубликовала желание.</div>`;

      // короткие сведения о группе — капсулами под названием
      const st = groupStats.get(String(g.id));
      const comp = groupComposition(st);
      const chips = [membersLabel(people.length),
        st && st.avgAge != null ? `ср. возраст ${Math.round(st.avgAge)}` : '',
        comp ? { male: 'парни', female: 'девушки', mixed: 'смешанный состав' }[comp] : ''].filter(Boolean);
      const photo = safeUrl(g.photo);
      const token = String(++sharedSeq);
      // открыта из чата группы — кнопка возвращает в него («назад»), а не открывает чат ещё раз поверх карточки
      const chatBtn = fromChat
        ? `<button type="button" class="btn btn-primary gx-chat" data-action="back-to-groups">Чат группы</button>`
        : `<button type="button" class="btn btn-primary gx-chat" data-open-group-chat="${escapeHtml(g.id)}">Чат группы</button>`;
      const matchHtml = isMember ? gxOwnMatchesHtml(g) : gxMatchHtml(g);
      // человек без группы может попроситься в чужую: заявку получит её лидер
      const free = !isMember && !myGroups().length;
      const jr = free ? myJoinRequest(g.id) : null;
      const joinHtml = !free ? ''
        : jr && jr.status === 'pending'
          ? `<button type="button" class="btn gx-chat gx-join is-sent" disabled>${ICON_CLOCK_MINI}Заявка отправлена</button><div class="gx-join-note">Лидер группы увидит её и ответит</div>`
          : `<button type="button" class="btn btn-primary gx-chat gx-join" data-join-group="${escapeHtml(g.id)}">${ICON_PLUS}Попроситься в группу</button>`
            + (jr && jr.status === 'declined' ? '<div class="gx-join-note">В прошлый раз лидер не принял заявку — можно попроситься снова</div>' : '');
      // лидеру — заявки тех, кто просится в его группу
      const requests = g.ownerId === myId ? joinRequestsToMe(g.id) : [];
      const requestsHtml = requests.length ? `<section class="gx-requests"><div class="user-profile-section-title">Заявки · ${requests.length}</div><ul class="rows">${requests.map((r) => {
        const p = peopleCache.get(r.userId) || personById(r.userId) || chatPersonById(r.userId);
        return `<li class="person-card jr-card">
          <span class="jr-person" data-view-profile="${escapeHtml(r.userId)}" role="button" tabindex="0">${avatarCircleHtml(p, 40)}
            <span class="person-main"><span class="person-name">${escapeHtml((p && p.name) || 'Пользователь')}</span><span class="person-handle">хочет в группу</span></span></span>
          <span class="jr-acts"><button type="button" class="btn" data-jr-decline="${escapeHtml(r.id)}">Отклонить</button><button type="button" class="btn btn-primary" data-jr-accept="${escapeHtml(r.id)}">Принять</button></span>
        </li>`;
      }).join('')}</ul></section>` : '';
      winBody.innerHTML = `
        <div class="user-profile-view gx" data-pm="${token}" data-group-card="${escapeHtml(g.id)}">
          <header class="gx-hero">
            <div class="gx-ava-ring"><div class="gx-ava"${photo ? ` style="background-image:url('${photo}')"` : ''}>${photo ? '' : escapeHtml(firstChar(g.name || '?').toUpperCase())}</div></div>
            <div class="gx-name">${escapeHtml(g.name)}</div>
            <div class="gx-chips">${chips.map((c) => `<span class="gx-chip">${escapeHtml(c)}</span>`).join('')}</div>
            ${isMember ? `<div class="gx-hero-acts">${chatBtn}${g.ownerId === myId ? `<button type="button" class="btn gx-chat" data-group-edit="${escapeHtml(g.id)}">Настройки</button>` : ''}</div>`
              : myGroups().length ? `<button type="button" class="btn gx-chat gx-share" data-share-group="${escapeHtml(g.id)}">${ICON_SHARE}Поделиться</button>` : joinHtml}
          </header>
          ${requestsHtml}
          <section class="gx-match">${matchHtml.includes('gx-cta') ? '' : '<div class="user-profile-section-title">Match</div>'}${matchHtml}</section>
          <section><div class="user-profile-section-title">Желание</div>${wishHtml}</section>
          <div class="pm-members"><div class="user-profile-section-title">Участники</div>${isMember ? mapNote : ''}<ul class="rows">${peopleHtml}${invitedHtml}</ul></div>
          ${isMember ? `<button type="button" class="btn gx-leave" data-leave-group="${escapeHtml(g.id)}">Покинуть группу</button>` : ''}
        </div>`;
      // что прислали в чат группы — видно только её участникам
      if (isMember) sharedTabs({ type: 'group', groupId: String(g.id) }, () => membersTabPlace(token),
        () => !win.hidden && !!winBody.querySelector(`[data-pm="${token}"]`)).load();

      const wishForm = winBody.querySelector('#group-wish-form');
      if (wishForm) {
        wishForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const input = winBody.querySelector('#group-wish-input');
          if (!input.value.trim()) { input.focus(); return; }
          if (await saveGroupWish(g.id, input.value)) rerenderWishContext();
        });
      }
    }, back);
  }

  // Где встают вкладки в карточке группы или союза: первая — «Участники» (состав, .pm-members), за ней — что прислали в чат
  function membersTabPlace(token) {
    const el = winBody.querySelector(`[data-pm="${token}"] > .pm-members`);
    return el ? { root: el.parentElement, after: el.previousElementSibling, first: { id: 'members', label: 'Участники', el } } : null;
  }

  /* ── Карточка союза (и любого match двух групп): открывается из списка групп и нажатием на шапку совместного чата.
     Две группы (каждую можно открыть), все участники, вкладки «Медиа», «Ссылки», «Файлы» из совместного чата и сам чат.
     fromChat — открыта из этого чата: «назад» и «Открыть чат» возвращают в него ── */
  let unionDetails = null;   // { id, back, fromChat } — открытая карточка союза, чтобы к ней вернуться
  function reopenUnionDetails() { if (unionDetails) showUnionDetailsScreen(unionDetails.id, unionDetails.back, unionDetails.fromChat); }
  function showUnionDetailsScreen(matchId, backFn, fromChat = false) {
    const back = backFn || (() => showGroupsScreen());
    unionDetails = { id: String(matchId), back, fromChat: !!fromChat };
    setScreen(() => {
      const m = groupMatches.find((x) => x.id === String(matchId));
      const a = m && groupById(m.fromGroup), b = m && groupById(m.toGroup);
      winBody.scrollTop = 0;
      if (!m || m.status !== 'accepted' || !a || !b) {
        winTitle.textContent = 'Союз';
        winBody.innerHTML = `<div class="empty-msg">Этого союза больше нет.</div>`;
        return;
      }
      const myId = currentUser && currentUser.id;
      winTitle.textContent = matchTitle(m);
      const groupRow = (g) => {
        const url = safeUrl(g.photo);
        return `
          <li class="person-card is-link" data-union-group="${escapeHtml(g.id)}" role="button" tabindex="0">
            <span class="group-avatar" style="width:40px;height:40px;font-size:16px;${url ? `background-image:url('${url}')` : ''}">${url ? '' : escapeHtml(firstChar(g.name || '?').toUpperCase())}</span>
            <div class="person-main">
              <div class="person-name">${escapeHtml(g.name)}</div>
              <div class="person-handle">${escapeHtml(membersLabel(groupPeople(g).length))}${isGroupParticipant(g, myId) ? ' · ваша группа' : ''}</div>
            </div>
            <span class="chev">›</span>
          </li>`;
      };
      const seen = new Set();
      const people = [a, b].flatMap((g) => groupPeople(g).map((p) => ({ ...p, from: g })))
        .filter((p) => !seen.has(p.id) && seen.add(p.id));
      const peopleHtml = people.map((p) => {
        const isMe = p.id === myId;
        const name = p.name && p.name !== 'Лидер группы' ? p.name : chatPersonById(p.id).name;
        return `
          <li class="person-card ${isMe ? '' : 'is-link'}" ${isMe ? '' : `data-view-profile="${escapeHtml(p.id)}" data-profile-back="union" role="button" tabindex="0"`}>
            ${avatarCircleHtml({ name, avatar: p.avatar }, 40)}
            <div class="person-main">
              <div class="person-name">${escapeHtml(name || 'Пользователь')}${isMe ? ' (вы)' : ''}</div>
              <div class="person-handle">${p.leader ? '👑 Лидер · ' : ''}${escapeHtml(p.from.name || 'Группа')}</div>
            </div>
            ${isMe ? '' : '<span class="chev">›</span>'}
          </li>`;
      }).join('');
      const token = String(++sharedSeq);
      // союз закреплён голосованием — «Союз», пока нет — просто match двух групп
      const kind = m.voteState === 'approved' ? 'Союз' : 'Match';
      winBody.innerHTML = `
        <div class="user-profile-view" data-union-card data-pm="${token}">
          <div class="user-profile-hero">
            <div class="union-hero-ava">${featAvatarHtml(m, 128)}</div>
            <div class="user-profile-name">${escapeHtml(matchTitle(m))}</div>
            <div class="user-profile-handle">${kind} · ${escapeHtml(membersLabel(people.length))}</div>
          </div>
          <div><div class="user-profile-section-title">Группы</div><ul class="rows">${groupRow(a)}${groupRow(b)}</ul></div>
          <div class="pm-members"><div class="user-profile-section-title">Участники</div><ul class="rows">${peopleHtml}</ul></div>
          <div class="edit-actions">
            <button type="button" class="btn" data-action="back-to-groups">Назад</button>
            ${fromChat
              ? `<button type="button" class="btn btn-primary" data-action="back-to-groups">Открыть чат</button>`
              : `<button type="button" class="btn btn-primary" data-open-match-chat="${escapeHtml(m.id)}">Открыть чат</button>`}
          </div>
        </div>`;
      sharedTabs({ type: 'match', matchId: String(m.id) }, () => membersTabPlace(token),
        () => !win.hidden && !!winBody.querySelector(`[data-pm="${token}"]`)).load();
    }, back);
  }

  // Пустой текст удаляет желание группы (так устроена set_group_wish)
  async function saveGroupWish(groupId, text) {
    const { error } = await supabaseClient.rpc('set_group_wish', { gid: String(groupId), wish_text: (text || '').trim() });
    if (error) {
      console.error('[rpc set_group_wish]', error);
      alert('Не удалось сохранить желание: ' + error.message);
      return false;
    }
    await refreshGroupsWorld();
    return true;
  }

  /* ═══════ ЛЕНТА ГРУПП ═══════
     Главный экран: чужие группы идут друг за другом карточками, как в приложениях знакомств. Верхнюю карточку
     смахивают пальцем или мышью (или кнопками под колодой, или стрелками на клавиатуре):
     — влево — «мимо», дальше;
     — вправо — главное действие, и оно зависит от того, кто вы:
       лидер группы — предложить ей match от своей группы (своих групп несколько — спросим, от какой);
       без группы — попроситься в неё (её лидер получит заявку);
       участник чужой группы — поделиться находкой в чате своей группы, чтобы решить вместе;
       запрос уже отправлен — дальше, а если match уже есть — открыть общий чат.
     Нажатие на карточку — карточка группы целиком. Кого уже посмотрели, помнится на устройстве сутки: лента не крутит
     одни и те же группы, а когда посмотрели все — можно начать сначала. В ленте только группы, которые мне видны
     (кроме лидера в них есть участники, они не скрыты союзом) и проходят фильтры. Порядок: сначала те, кто ждёт
     моего ответа на match, затем группы с желанием, затем остальные — свежие первыми */
  const FEED_SEEN_KEY = 'feed.seen.v1:';
  const FEED_SEEN_TTL = 24 * 3600 * 1000;
  const FEED_SWIPE = 0.28;          // какую долю ширины карточки протащить, чтобы она улетела
  const feedStage = document.getElementById('feed-stage');
  let feedSeen = null;              // { uid, seen: Map(id группы → когда посмотрели) }
  let feedShown = '';               // что нарисовано сейчас — одно и то же не перерисовываем
  let feedDirty = false, feedRaf = 0, feedDrag = null, feedBusy = false, feedClickBlock = 0;

  function feedSeenMap() {
    const uid = currentUser && currentUser.id;
    if (!uid) return new Map();
    if (feedSeen && feedSeen.uid === uid) return feedSeen.seen;
    let seen = new Map();
    try {
      const raw = JSON.parse(localStorage.getItem(FEED_SEEN_KEY + uid) || '[]');
      const now = Date.now();
      if (Array.isArray(raw)) seen = new Map(raw.filter((x) => Array.isArray(x) && now - Number(x[1]) < FEED_SEEN_TTL));
    } catch {}
    feedSeen = { uid, seen };
    return seen;
  }
  function saveFeedSeen() {
    if (!currentUser || !feedSeen) return;
    try { localStorage.setItem(FEED_SEEN_KEY + currentUser.id, JSON.stringify([...feedSeen.seen].slice(-500))); } catch {}
  }
  function markFeedSeen(gid) { feedSeenMap().set(String(gid), Date.now()); saveFeedSeen(); }
  function clearFeedSeen() { feedSeenMap().clear(); saveFeedSeen(); }

  // Запрос на match от этой группы к одной из моих — ждёт ответа
  function feedIncomingMatch(g) {
    const mine = new Set(myGroups().map((x) => String(x.id)));
    return groupMatches.find((m) => m.status === 'pending' && m.fromGroup === String(g.id) && mine.has(m.toGroup)) || null;
  }
  // all — все чужие группы, которые мне видны; passed — прошли фильтры; queue — ещё не посмотренные, по порядку
  function feedQueue() {
    const myId = currentUser && currentUser.id;
    if (!myId) return { all: [], passed: [], queue: [] };
    const all = groups.filter((g) => !isGroupParticipant(g, myId) && !groupHiddenForMe(g));
    const passed = all.filter(groupPassesFilters);
    const seen = feedSeenMap();
    const rank = (g) => (feedIncomingMatch(g) ? 0 : g.wish ? 1 : 2);
    const queue = passed.filter((g) => !seen.has(String(g.id))).sort((a, b) => rank(a) - rank(b));
    return { all, passed, queue };
  }

  /* Что делает смахивание вправо: { kind, label — подпись кнопки, stamp — штамп на карточке, hint — строка под кнопками }.
     kind: match — предложить match, accept — принять встречный, join — попроситься в группу, share — в чат своей группы,
     chat — открыть общий чат, skip — только дальше */
  function feedAction(g) {
    const myId = currentUser && currentUser.id;
    const gid = String(g.id), name = ellipsize(g.name || 'Группа', 26);
    const u = myUnion();
    if (u) {
      const m = matchBetween(u.mine.id, u.partner.id);
      if (gid === String(u.partner.id) && m) return { kind: 'chat', m, label: 'Открыть общий чат', stamp: 'Чат', hint: `Вы в союзе с «${name}» — вправо, чтобы открыть общий чат` };
      return { kind: 'skip', label: 'Дальше', stamp: 'Дальше', hint: `Ваша группа в союзе с «${ellipsize(u.partner.name || 'Группа', 22)}» — новые match недоступны` };
    }
    const mine = myGroups();
    if (!mine.length) {
      const jr = myJoinRequest(gid);
      if (jr && jr.status === 'pending') return { kind: 'skip', label: 'Дальше', stamp: 'Дальше', hint: 'Заявка в эту группу уже отправлена — лидер ответит' };
      return { kind: 'join', label: 'Попроситься в группу', stamp: 'Хочу', hint: 'Вправо — попроситься в группу, её лидер получит заявку' };
    }
    // match с этой группой уже есть или ждёт ответа — у любой из моих групп
    for (const x of mine) {
      const m = matchBetween(x.id, gid);
      if (!m) continue;
      if (m.status === 'accepted') return { kind: 'chat', m, label: 'Открыть общий чат', stamp: 'Чат', hint: `У вас уже match с «${name}» — вправо, чтобы открыть чат` };
      if (m.status !== 'pending') continue;
      if (m.toGroup === String(x.id) && x.ownerId === myId) return { kind: 'accept', m, label: 'Принять match', stamp: 'Match', hint: `«${name}» хотят match с вами — вправо, чтобы принять` };
      if (m.toGroup === String(x.id)) return { kind: 'skip', label: 'Дальше', stamp: 'Дальше', hint: `«${name}» хотят match с вашей группой — ответит лидер` };
      return { kind: 'skip', label: 'Дальше', stamp: 'Дальше', hint: 'Запрос на match уже отправлен — ждём ответа' };
    }
    const led = mine.filter((x) => x.ownerId === myId);
    if (led.length) {
      const free = led.filter((x) => { const m = matchBetween(x.id, gid); return !m || m.status === 'declined'; });
      if (!free.length) return { kind: 'skip', label: 'Дальше', stamp: 'Дальше', hint: 'С этой группой match больше невозможен' };
      return { kind: 'match', from: free, label: 'Предложить match', stamp: 'Match',
        hint: free.length > 1 ? 'Вправо — предложить match от одной из ваших групп' : `Вправо — предложить match от «${ellipsize(free[0].name || 'Группа', 24)}»` };
    }
    return { kind: 'share', label: 'Показать своим', stamp: 'В чат', hint: 'Match предлагает лидер — вправо, чтобы показать группу в чате своей' };
  }

  const FD_ICON_NOPE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>';
  const FD_ICON_INFO = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.01"/></svg>';
  const FD_ICON_LIKE = {
    match: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5.6"/><circle cx="15" cy="12" r="5.6"/><path class="ic-fill" d="M12 7.27A5.6 5.6 0 0 1 12 16.73A5.6 5.6 0 0 1 12 7.27Z"/></svg>',
    join: '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="ic-fill" d="M12 20.3c-4.6-3.4-8.3-6.6-8.3-10.4A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 8.3 2.5c0 3.8-3.7 7-8.3 10.4z"/></svg>',
    share: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.6 19.5 4.5l-5 15.2-3.2-6.4z"/><path d="M11.3 13.3 19.5 4.5"/></svg>',
    chat: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 17.06 4.2 18.6 4.42 13.39A7 7 0 1 1 7.5 17.06Z"/></svg>',
    skip: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  };
  FD_ICON_LIKE.accept = FD_ICON_LIKE.match;

  function feedCardKey(g) {
    return [g.id, g.name, (g.photo || '').length, g.wish, groupStatsText(g), feedIncomingMatch(g) ? 1 : 0,
      groupPeople(g).map((p) => (p.name || '') + ':' + (p.avatar || '').length).join(',')].join('|');
  }
  // Карточка группы: фото во весь размер (нет фото — спектр и первая буква), название, сведения, желание и кто в ней.
  // i — место в колоде: 0 — сверху, 1 и 2 — выглядывают снизу
  function feedCardHtml(g, i, act) {
    const url = safeUrl(g.photo);
    const people = groupPeople(g);
    const st = groupStats.get(String(g.id));
    const comp = groupComposition(st);
    const chips = [membersLabel(people.length),
      st && st.avgAge != null ? `ср. возраст ${Math.round(st.avgAge)}` : '',
      comp ? { male: 'парни', female: 'девушки', mixed: 'смешанный состав' }[comp] : ''].filter(Boolean);
    const incoming = feedIncomingMatch(g);
    const leader = people[0];
    const cap = leader && leader.name && leader.name !== 'Лидер группы' ? `лидер — ${leader.name}` : '';
    const top = i === 0;
    return `<article class="fd-card ${top ? 'is-top' : 'is-back' + i}" data-fd-group="${escapeHtml(g.id)}"${top
        ? ` tabindex="0" role="button" aria-label="${escapeHtml('Группа «' + (g.name || 'Группа') + '» — открыть')}"` : ' aria-hidden="true"'}>
        <div class="fd-photo${url ? ' has-photo' : ''}"${url ? ` style="background-image:url('${url}')"` : ''}>${url ? '' : escapeHtml(firstChar((g.name || '?').trim()).toUpperCase() || '?')}</div>
        <div class="fd-shade"></div>
        ${act ? `<span class="fd-stamp is-like">${escapeHtml(act.stamp)}</span><span class="fd-stamp is-nope">Мимо</span>` : ''}
        ${incoming || isBotGroup(g) ? `<div class="fd-badge">${incoming ? '<span class="is-hot">Хотят match с вами</span>' : ''}${isBotGroup(g) ? '<span>🤖 Тестовая группа</span>' : ''}</div>` : ''}
        <button type="button" class="fd-more" data-fd-act="open" tabindex="-1" aria-label="Открыть группу" title="Открыть группу"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 11v6M12 7.5v.01"/></svg></button>
        <div class="fd-info">
          <div class="fd-name">${escapeHtml(g.name || 'Группа')}</div>
          <div class="fd-chips">${chips.map((c) => `<span>${escapeHtml(c)}</span>`).join('')}</div>
          ${g.wish ? `<div class="fd-wish"><span>${escapeHtml(g.wish)}</span></div>` : ''}
          <div class="fd-people">${people.slice(0, 5).map((p) => avatarCircleHtml(p, 34)).join('')}${people.length > 5 ? `<span class="fd-more-people">+${people.length - 5}</span>` : ''}${cap ? `<span class="fd-people-cap">${escapeHtml(cap)}</span>` : ''}</div>
        </div>
      </article>`;
  }

  function feedEmptyHtml(kind) {
    const ico = (svg) => `<span class="fd-empty-ico" aria-hidden="true">${svg}</span>`;
    const groupsIco = '<svg viewBox="0 0 24 24"><circle cx="6.9" cy="15.9" r="3.4"/><circle cx="17.1" cy="15.9" r="3.4"/><circle class="ic-fill" cx="12" cy="7.4" r="3.4"/></svg>';
    if (kind === 'none') return `<div class="fd-empty">${ico(groupsIco)}
        <div class="fd-empty-title">Пока нет других групп</div>
        <div class="fd-empty-text">Когда появятся группы, они будут здесь. А пока — соберите свою и позовите друзей.</div>
        <div class="fd-empty-acts"><button type="button" class="btn btn-primary" data-fd-go="create-group">Создать группу</button></div>
      </div>`;
    if (kind === 'filtered') return `<div class="fd-empty">${ico('<svg viewBox="0 0 24 24"><path d="M4 8h3.6M11.4 8H20M4 16h9.6M17.4 16H20"/><circle cx="9.5" cy="8" r="1.9"/><circle cx="15.5" cy="16" r="1.9"/></svg>')}
        <div class="fd-empty-title">Под фильтры ничего не подходит</div>
        <div class="fd-empty-text">Попробуйте другой возраст или состав — или покажите все группы.</div>
        <div class="fd-empty-acts"><button type="button" class="btn" data-fd-go="filters">Фильтры</button><button type="button" class="btn btn-primary" data-fd-go="reset-filters">Показать все</button></div>
      </div>`;
    return `<div class="fd-empty">${ico('<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>')}
        <div class="fd-empty-title">Вы посмотрели все группы</div>
        <div class="fd-empty-text">Новые группы появятся здесь сами. А пока можно пролистать ленту ещё раз.</div>
        <div class="fd-empty-acts"><button type="button" class="btn btn-primary" data-fd-go="again">Смотреть снова</button></div>
      </div>`;
  }

  // Перерисовать ленту в ближайшем кадре (данные о группах приходят пачками — рисуем один раз)
  function scheduleFeedRender() {
    feedDirty = true;
    // под экраном входа ленту не рисуем: её соберут под «облаками», перед тем как экран входа растает
    if (feedRaf || document.body.classList.contains('auth-locked')) return;
    feedRaf = requestAnimationFrame(() => { feedRaf = 0; if (!feedDrag && !feedBusy) renderFeed(); });
  }
  function feedReset() {
    feedSeen = null; feedShown = ''; feedDrag = null; feedBusy = false; feedDirty = false; groupsLoaded = false;
    if (feedStage) feedStage.innerHTML = '';
  }
  function renderFeed() {
    if (!feedStage) return;
    if (document.body.classList.contains('auth-locked')) { feedDirty = true; return; }
    feedDirty = false;
    if (!currentUser) { feedStage.innerHTML = ''; feedShown = ''; return; }
    const { all, passed, queue } = feedQueue();
    let key, html;
    if (queue.length) {
      const top = queue.slice(0, 3), act = feedAction(top[0]);
      key = 'q§' + top.map(feedCardKey).join('¦') + '§' + act.kind + '§' + act.hint;
      if (key === feedShown) return;
      html = `<div class="fd-deck">${top.map((g, i) => feedCardHtml(g, i, i ? null : act)).reverse().join('')}</div>
        <div class="fd-acts">
          <button type="button" class="fd-btn is-nope" data-fd-act="nope" aria-label="Мимо" title="Мимо">${FD_ICON_NOPE}</button>
          <button type="button" class="fd-btn is-info" data-fd-act="open" aria-label="Открыть группу" title="Открыть группу">${FD_ICON_INFO}</button>
          <button type="button" class="fd-btn is-like" data-fd-act="like" aria-label="${escapeHtml(act.label)}" title="${escapeHtml(act.label)}">${FD_ICON_LIKE[act.kind] || FD_ICON_LIKE.skip}</button>
        </div>
        <div class="fd-hint">${escapeHtml(act.hint)}</div>`;
    } else {
      const kind = !groupsLoaded ? 'loading' : !all.length ? 'none' : !passed.length ? 'filtered' : 'seen';
      key = 'e§' + kind;
      if (key === feedShown) return;
      html = kind === 'loading' ? '<div class="fd-deck"><div class="fd-skeleton" aria-label="Загружаем группы"></div></div>' : feedEmptyHtml(kind);
    }
    feedShown = key;
    feedStage.innerHTML = html;
  }

  // Карточка возвращается на место (передумали или протащили недостаточно)
  function resetFeedCard(card) {
    card.classList.remove('is-drag');
    card.style.transform = '';
    card.style.setProperty('--fd-x', '0');
    feedStage.querySelectorAll('.fd-acts .fd-btn').forEach((b) => { b.style.transform = ''; });
    if (feedDirty) scheduleFeedRender();
  }
  function paintFeedDrag(card, dx, dy, w) {
    const k = Math.max(-1, Math.min(1, dx / (w * 0.9)));
    card.style.transform = `translate(${dx.toFixed(1)}px, ${(dy * 0.3).toFixed(1)}px) rotate(${(k * 12).toFixed(2)}deg)`;
    card.style.setProperty('--fd-x', k.toFixed(3));
    // кнопка, к которой тянут, подрастает
    const like = feedStage.querySelector('.fd-acts .is-like'), nope = feedStage.querySelector('.fd-acts .is-nope');
    if (like) like.style.transform = k > 0.12 ? `scale(${(1 + k * 0.2).toFixed(3)})` : '';
    if (nope) nope.style.transform = k < -0.12 ? `scale(${(1 - k * 0.2).toFixed(3)})` : '';
  }
  function flyFeedCard(card, dir) {
    const sign = dir === 'like' ? 1 : -1;
    card.classList.remove('is-drag');
    card.classList.add('is-gone');
    card.style.setProperty('--fd-x', String(sign));
    card.style.transform = `translate(${Math.round(sign * (innerWidth * 0.7 + card.offsetWidth))}px, -40px) rotate(${sign * 22}deg)`;
  }

  // Решение по верхней карточке: dir — 'like' (вправо) или 'nope' (влево)
  async function feedDecide(dir, card = feedStage.querySelector('.fd-card.is-top')) {
    if (feedBusy || !card) return;
    const g = groupById(card.dataset.fdGroup);
    if (!g) { feedShown = ''; renderFeed(); return; }
    let act = dir === 'like' ? feedAction(g) : null;
    feedBusy = true;
    try {
      // своих групп несколько — сначала спрашиваем, от какой match (или в какой чат), передумали — карточка возвращается
      if (act && act.kind === 'match' && act.from.length > 1) {
        const from = await pickMatchFrom(act.from, g);
        if (!from) { resetFeedCard(card); return; }
        act = { ...act, from: [from] };
      }
      if (act && act.kind === 'share') {
        const targets = await pickShareTargets(myGroups());
        if (!targets.length) { resetFeedCard(card); return; }
        act = { ...act, targets };
      }
      flyFeedCard(card, dir);
      markFeedSeen(g.id);
      if (navigator.vibrate && !reduceMotion) { try { navigator.vibrate(dir === 'like' ? 12 : 6); } catch {} }
      await new Promise((r) => setTimeout(r, reduceMotion ? 0 : 240));
      renderFeed();   // следующая карточка поднимается наверх
    } finally {
      feedBusy = false;
      if (feedDirty) scheduleFeedRender();
    }
    if (act) runFeedAction(g, act);
  }

  async function runFeedAction(g, act) {
    const name = ellipsize(g.name || 'Группа', 26);
    const bot = isBotGroup(g);   // тестовая группа-бот: всё только в приложении (см. «ТЕСТОВЫЕ ГРУППЫ-БОТЫ»)
    if (act.kind === 'join') {
      if (await requestJoinGroup(g.id)) feedToast(bot ? `Заявка в тестовую группу «${name}» — бот не ответит` : `Заявка в «${name}» отправлена — лидер ответит`);
      return;
    }
    if (act.kind === 'chat') {
      if (bot) { botNoChat(); return; }
      showApp('messenger'); showMatchChatScreen(act.m.id, () => closeApp()); return;
    }
    if (act.kind === 'accept') {
      const done = respondGroupMatch(act.m.id, true);   // экран меняется сразу, у принятого — анимация match
      await matchFxIdle();
      if (bot) { feedToast(`Match с тестовой группой «${name}» — общего чата у ботов нет`); return; }
      if (await confirmModal({ title: 'Match!', text: 'Общий чат двух групп создан. Открыть его?', confirmLabel: 'Открыть чат', cancelLabel: 'Позже', tone: 'primary' }) && await done) {
        showApp('messenger');
        await showMatchChatScreen(act.m.id, null);
      }
      return;
    }
    if (act.kind === 'share') {
      if (bot) { feedToast(`«${name}» — тестовая группа, в чат она не отправляется`); return; }
      try {
        for (const t of act.targets) await shareGroupToChat(g, t.id);
        feedToast(act.targets.length === 1 ? `«${name}» — в чате «${ellipsize(act.targets[0].name || 'Группа', 22)}»` : `«${name}» — в чатах ваших групп`);
      } catch (err) {
        console.warn('[feed share]', err);
        alert('Не удалось поделиться: ' + ((err && err.message) || err));
      }
      return;
    }
    if (act.kind === 'match') {
      const from = act.from[0];
      const status = await sendGroupMatch(from.id, g.id);
      if (status === 'accepted') { await matchFxIdle(); feedToast('У этой группы уже был запрос к вам — match состоялся!'); }
      else if (status) feedToast(bot ? `Запрос отправлен — тестовая группа ответит через пару секунд` : `Запрос на match с «${name}» отправлен`);
    }
  }

  // От какой из своих групп предложить match
  function pickMatchFrom(list, g) {
    return new Promise((resolve) => {
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      back.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <h3 class="modal-title">Match с «${escapeHtml(ellipsize(g.name || 'Группа', 40))}»</h3>
          <p class="modal-text">От какой из ваших групп предложить?</p>
          <ul class="fwd-list">${list.map((x, i) => `
            <li class="person-card is-link" data-from-pick="${i}" role="button" tabindex="0">
              <span class="group-avatar" style="width:36px;height:36px;font-size:15px;${safeUrl(x.photo) ? `background-image:url('${safeUrl(x.photo)}')` : ''}">${safeUrl(x.photo) ? '' : escapeHtml(firstChar(x.name || '?').toUpperCase())}</span>
              <div class="person-main"><div class="person-name">${escapeHtml(x.name || 'Группа')}</div><div class="person-handle">${escapeHtml(membersLabel(groupPeople(x).length))}</div></div>
            </li>`).join('')}</ul>
          <div class="modal-actions"><button type="button" class="btn" data-cancel>Отмена</button></div>
        </div>`;
      modalHost().appendChild(back);
      back.addEventListener('click', (e) => {
        const row = e.target.closest('[data-from-pick]');
        if (row) { back.remove(); resolve(list[Number(row.dataset.fromPick)]); return; }
        if (e.target === back || e.target.closest('[data-cancel]')) { back.remove(); resolve(null); }
      });
    });
  }

  // Короткая подпись внизу экрана: что произошло после смахивания
  let feedToastTimer = 0;
  function feedToast(text) {
    let el = document.querySelector('.fd-toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'fd-toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.classList.remove('is-on');
    void el.offsetWidth;
    el.classList.add('is-on');
    clearTimeout(feedToastTimer);
    feedToastTimer = setTimeout(() => el.classList.remove('is-on'), 2800);
  }

  function openFeedGroup(gid) {
    if (!groupById(gid)) { feedShown = ''; renderFeed(); return; }
    showApp('groups');
    showGroupDetailsScreen(gid, () => closeApp());
  }

  // ── Перетаскивание верхней карточки: пальцем или мышью ──
  if (feedStage) {
    feedStage.addEventListener('pointerdown', (e) => {
      const card = e.target.closest('.fd-card.is-top');
      if (!card || feedBusy || feedDrag || (e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('button')) return;
      feedDrag = { card, id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0, t: performance.now(), moved: false, w: card.offsetWidth || 320 };
      try { card.setPointerCapture(e.pointerId); } catch {}
    });
    feedStage.addEventListener('pointermove', (e) => {
      const d = feedDrag;
      if (!d || e.pointerId !== d.id) return;
      d.dx = e.clientX - d.x; d.dy = e.clientY - d.y;
      if (!d.moved && Math.hypot(d.dx, d.dy) < 7) return;
      if (!d.moved) { d.moved = true; d.card.classList.add('is-drag'); }
      paintFeedDrag(d.card, d.dx, d.dy, d.w);
    });
    const endFeedDrag = (e, cancel) => {
      const d = feedDrag;
      if (!d || e.pointerId !== d.id) return;
      feedDrag = null;
      try { d.card.releasePointerCapture(e.pointerId); } catch {}
      if (!d.moved) { if (feedDirty) scheduleFeedRender(); return; }   // это нажатие — карточку откроет click
      feedClickBlock = Date.now() + 350;                                  // отпускание после перетаскивания — не нажатие
      const speed = Math.abs(d.dx) / Math.max(1, performance.now() - d.t);
      const fling = Math.abs(d.dx) > d.w * FEED_SWIPE || (Math.abs(d.dx) > 50 && speed > 0.6);
      if (!cancel && fling) feedDecide(d.dx > 0 ? 'like' : 'nope', d.card);
      else resetFeedCard(d.card);
    };
    feedStage.addEventListener('pointerup', (e) => endFeedDrag(e, false));
    feedStage.addEventListener('pointercancel', (e) => endFeedDrag(e, true));

    feedStage.addEventListener('click', (e) => {
      const go = e.target.closest('[data-fd-go]');
      if (go) {
        const what = go.dataset.fdGo;
        if (what === 'again') { clearFeedSeen(); renderFeed(); }
        else if (what === 'create-group') { showApp('groups'); showCreateGroupScreen(); }
        else if (what === 'filters') showApp('filters', document.getElementById('filter-btn'));
        else if (what === 'reset-filters') { feedFilters = { ...DEFAULT_FILTERS }; applyFeedFilters(); }
        return;
      }
      const act = e.target.closest('[data-fd-act]');
      if (act) {
        const kind = act.dataset.fdAct;
        if (kind === 'open') { const top = feedStage.querySelector('.fd-card.is-top'); if (top) openFeedGroup(top.dataset.fdGroup); }
        else feedDecide(kind === 'like' ? 'like' : 'nope');
        if (kind !== 'open' && !reduceMotion) { act.classList.remove('is-pulse'); void act.offsetWidth; act.classList.add('is-pulse'); }
        return;
      }
      if (Date.now() < feedClickBlock) return;
      const card = e.target.closest('.fd-card.is-top');
      if (card) openFeedGroup(card.dataset.fdGroup);
    });
    feedStage.addEventListener('keydown', (e) => {
      const card = e.target.closest && e.target.closest('.fd-card.is-top');
      if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openFeedGroup(card.dataset.fdGroup); }
    });
  }
  // Стрелки на клавиатуре: ← — мимо, → — главное действие (только когда на экране сама лента)
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if (openApp !== 'feed' || !currentUser || !authScreen.hidden || document.body.classList.contains('tour-open')) return;
    if (document.querySelector('.modal-backdrop, .match-fx, .crop-backdrop') || isTextField(document.activeElement)) return;
    e.preventDefault();
    feedDecide(e.key === 'ArrowRight' ? 'like' : 'nope');
  });

  /* ═══════ ТЕСТОВЫЕ ГРУППЫ-БОТЫ ═══════
     Пока настоящих групп мало, в ленте есть 5 групп-ботов: на них проверяют ленту, карточки, фильтры, заявки и match.
     Боты живут только в приложении: в базе их нет, на сервер о них ничего не уходит (их номера отсеиваются из всех
     запросов), другие люди их не видят, на карточке — пометка «Тестовая группа». Что с ними делают, происходит только
     здесь и забывается при перезапуске:
     — заявка в группу-бота остаётся «отправленной» (бот не отвечает);
     — на запрос match бот через пару секунд соглашается — с анимацией match;
     — «Кофе и разговоры» сами предлагают match группе, которую вы ведёте (кнопка Match сверху, «Хотят match с вами»);
     — общего чата, профилей участников и «поделиться в чате» у ботов нет — об этом говорит подсказка.
     Убрать ботов — BOT_GROUPS = false */
  const BOT_GROUPS = true;
  const isBotId = (id) => String(id).startsWith('bot-');
  const isBotGroup = (g) => !!g && isBotId(g.id);
  const BOT_DEFS = [
    { name: 'Велосипедисты', emoji: '🚴', hues: [205, 250], wish: 'Покататься по набережной в субботу', age: 24.4,
      people: [['Артём', 'm'], ['Лиза', 'f'], ['Никита', 'm'], ['Даша', 'f'], ['Илья', 'm']] },
    { name: 'Настолки по пятницам', emoji: '🎲', hues: [330, 15], wish: '', age: 27.3,
      people: [['Алина', 'f'], ['Вера', 'f'], ['Соня', 'f']] },
    { name: 'Бег на рассвете', emoji: '🏃', hues: [135, 175], wish: 'Пробежка 10 км в Парке Горького', age: 21.8,
      people: [['Максим', 'm'], ['Егор', 'm'], ['Тимур', 'm'], ['Глеб', 'm']] },
    { name: 'Кино и попкорн', emoji: '🎬', hues: [265, 300], wish: 'Сходить на премьеру в пятницу вечером', age: 30.1,
      people: [['Олег', 'm'], ['Марина', 'f']] },
    { name: 'Кофе и разговоры', emoji: '☕', hues: [22, 42], wish: '', age: 26, proposes: true,
      people: [['Полина', 'f'], ['Кирилл', 'm'], ['Ксюша', 'f'], ['Денис', 'm']] },
  ];
  const BOT_FACES = ['😀', '😎', '🙂', '🤓', '😊', '🥳', '😌', '🤠', '😄', '🧐'];
  let botList = null, botMatches = [], botJoins = [], botSeq = 0, botProposed = false, botArtStarted = false;
  const botArt = new Map();   // номер группы или человека → фото (data:image/jpeg), рисуются в свободное время

  const botPeople = (k) => BOT_DEFS[k].people.map(([name, sex], i) => ({
    id: `bot-u-${k}-${i}`, name, handle: `@bot_${k}${i}`, avatar: botArt.get(`bot-u-${k}-${i}`) || '', gender: sex === 'm' ? 'male' : 'female',
  }));
  function botGroupsList() {
    if (botList) return botList;
    const now = new Date().toISOString();
    botList = BOT_DEFS.map((d, k) => {
      const people = botPeople(k);
      return { id: 'bot-g-' + k, ownerId: people[0].id, name: d.name, photo: '', visibility: 'public',
        members: people.slice(1).map(({ id, name, handle, avatar }) => ({ id, name, handle, avatar })),
        wish: d.wish, wishAt: d.wish ? now : null, unionWith: null };
    });
    return botList;
  }
  /* Подмешать ботов к данным с сервера — после каждой загрузки групп, match, заявок и сводки
     (сервер присылает списки целиком, и боты из них пропадали бы) */
  function mergeBots() {
    if (!BOT_GROUPS || !currentUser) return;
    const list = botGroupsList();
    const have = new Set(groups.map((g) => String(g.id)));
    if (list.some((g) => !have.has(g.id))) groups = [...groups.filter((g) => !isBotGroup(g)), ...list];
    BOT_DEFS.forEach((d, k) => {
      const people = botPeople(k);
      // имена и фото — в справочник людей: лидер на карточке, участники в карточке группы
      for (const p of people) peopleCache.set(p.id, p);
      const males = people.filter((p) => p.gender === 'male').length;
      groupStats.set('bot-g-' + k, { avgAge: d.age, males, females: people.length - males, total: people.length });
    });
    // «Кофе и разговоры» предлагают match первой группе, которую вы ведёте (один раз за запуск)
    if (!botProposed) {
      const led = groups.find((g) => !isBotGroup(g) && g.ownerId === currentUser.id);
      const k = BOT_DEFS.findIndex((d) => d.proposes);
      if (led && k >= 0) {
        botProposed = true;
        if (!matchBetween('bot-g-' + k, led.id)) {
          botMatches.push({ id: `bot-m-${++botSeq}-${Date.now()}`, fromGroup: 'bot-g-' + k, toGroup: String(led.id), fromOwner: `bot-u-${k}-0`,
            toOwner: currentUser.id, status: 'pending', createdAt: new Date().toISOString(), voteState: 'none', voteStartedBy: null });
        }
      }
    }
    groupMatches = [...groupMatches.filter((m) => !isBotId(m.id)), ...botMatches];
    joinRequests = [...joinRequests.filter((r) => !isBotId(r.id)), ...botJoins];
    if (!botArtStarted) { botArtStarted = true; paintBotArt(); }
  }
  function resetBots() { botList = null; botMatches = []; botJoins = []; botProposed = false; }

  // Фото групп и участников рисуются по одному в свободные моменты — запуск и смахивания не ждут их
  function paintBotArt() {
    const jobs = [];
    BOT_DEFS.forEach((d, k) => {
      jobs.push(() => botArt.set('bot-g-' + k, botPicture(480, 640, d.hues, d.emoji, 200, k * 7 + 3)));
      d.people.forEach((_, i) => jobs.push(() => {
        const n = k * 10 + i;
        botArt.set(`bot-u-${k}-${i}`, botPicture(128, 128, [(n * 47) % 360, (n * 47 + 40) % 360], BOT_FACES[n % BOT_FACES.length], 76, n + 11));
      }));
    });
    const later = (fn) => (window.requestIdleCallback ? requestIdleCallback(fn, { timeout: 1500 }) : setTimeout(fn, 60));
    const step = () => {
      const job = jobs.shift();
      if (job) { try { job(); } catch (err) { console.warn('[боты] фото:', err); } later(step); return; }
      // всё нарисовано — ставим фото группам и людям и перерисовываем то, что на экране
      for (const g of botGroupsList()) {
        g.photo = botArt.get(g.id) || '';
        for (const m of g.members) m.avatar = botArt.get(m.id) || '';
      }
      if (!currentUser) return;
      mergeBots();
      scheduleFeedRender();
      if (winBody.querySelector('[data-group-card]')) quietly(reopenGroupDetails);
      syncMatchButton();
    };
    later(step);
  }
  // Картинка-«фото»: градиент, мягкие блики, как на снимке вне фокуса, и крупный значок по центру
  function botPicture(w, h, hues, emoji, size, seed) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    const gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, `hsl(${hues[0]} 72% 58%)`);
    gr.addColorStop(1, `hsl(${hues[1]} 68% 30%)`);
    g.fillStyle = gr;
    g.fillRect(0, 0, w, h);
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    for (let i = 0; i < 12; i++) {
      const x = rnd() * w, y = rnd() * h, r = (0.08 + rnd() * 0.25) * Math.max(w, h), hue = hues[0] + rnd() * 60;
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `hsla(${hue} 90% 82% / .32)`);
      rg.addColorStop(1, `hsla(${hue} 90% 82% / 0)`);
      g.fillStyle = rg;
      g.fillRect(0, 0, w, h);
    }
    g.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emoji, w / 2, h * (h > w ? 0.42 : 0.54));
    return c.toDataURL('image/jpeg', 0.82);
  }

  // Действия с ботами — только здесь, без сервера
  function botJoin(gid) {
    const busy = busyGroupOf(currentUser.id);
    if (busy) { noticeModal({ title: 'Вы уже в группе', text: `Вы в группе «${busy.name || 'Группа'}» — попроситься в другую можно, когда выйдете из неё.` }); return Promise.resolve(false); }
    if (!myJoinRequest(gid)) botJoins.push({ id: `bot-jr-${++botSeq}`, groupId: String(gid), userId: String(currentUser.id), status: 'pending', createdAt: new Date().toISOString() });
    mergeBots();
    repaintGroupsWorld();
    return Promise.resolve(true);
  }
  function botSendMatch(fromGid, toGid) {
    const from = groupById(fromGid), to = groupById(toGid), uid = currentUser.id;
    const m = { id: `bot-m-${++botSeq}-${Date.now()}`, fromGroup: String(fromGid), toGroup: String(toGid), fromOwner: from ? from.ownerId : uid,
      toOwner: to ? to.ownerId : null, status: 'pending', createdAt: new Date().toISOString(), voteState: 'none', voteStartedBy: null };
    botMatches = [...botMatches.filter((x) => !(x.fromGroup === m.fromGroup && x.toGroup === m.toGroup)), m];
    mergeBots();
    repaintGroupsWorld();
    // бот «думает» пару секунд и соглашается
    setTimeout(() => {
      if (!currentUser || currentUser.id !== uid || m.status !== 'pending') return;
      m.status = 'accepted';
      mergeBots();
      botMatchFx(m);
      repaintGroupsWorld();
    }, 2600);
    return Promise.resolve('pending');
  }
  function botRespondMatch(matchId, accept) {
    const m = botMatches.find((x) => x.id === String(matchId));
    if (!m) return Promise.resolve(false);
    m.status = accept ? 'accepted' : 'declined';
    mergeBots();
    if (accept) botMatchFx(m);
    repaintGroupsWorld();
    return Promise.resolve(true);
  }
  // Анимация match — сразу; номер запоминается как «увиденный», чтобы она не повторилась при следующей загрузке
  function botMatchFx(m) {
    const key = MATCH_FX_KEY + currentUser.id;
    try {
      const seen = JSON.parse(localStorage.getItem(key) || '[]');
      localStorage.setItem(key, JSON.stringify([...(Array.isArray(seen) ? seen : []), m.id].slice(-200)));
    } catch {}
    queueMatchFx(m);
  }
  function botNoChat() {
    noticeModal({ title: 'Тестовая группа', text: 'У групп-ботов нет общего чата и профилей участников — они нужны, чтобы проверять ленту, карточки, заявки и match.' });
  }

  /* ═══════ НАСТРОЙКИ (раздел профиля) ═══════ */
  function showSettingsScreen() {
    if (openApp !== 'profile') showApp('profile');
    setScreen(() => {
      winTitle.textContent = 'Настройки';
      winBody.scrollTop = 0;
      winBody.innerHTML = APPS.settings.render();
      syncSettingsUi();
    }, () => showProfileScreen());
  }

  // Нужной функции на сервере нет (не выполнен соответствующий .sql) — подскажем, что выполнить, а не покажем «ошибку»
  const isMissingRpc = (error) => !!error && (error.code === 'PGRST202' || error.code === '42883'
    || /function|schema cache|could not find|does not exist/i.test(error.message || ''));

  /* ═══════ ПРАВИЛА ═══════ */
  function showRulesScreen() {
    setScreen(() => {
      winTitle.textContent = 'Правила';
      winBody.scrollTop = 0;
      winBody.innerHTML = `
        <div class="legal-page">

  /* Время «чч:мм» у каждого сообщения. toLocaleTimeString каждый раз заново собирает форматтер — на ленте из сотни
     сообщений это заметная доля открытия чата, поэтому форматтер один на всё приложение */
  const TIME_FMT = new Intl.DateTimeFormat('ru-RU', { hour: '2-digit', minute: '2-digit' });
  function fmtTime(iso) { const d = iso ? new Date(iso) : new Date(); return TIME_FMT.format(isNaN(d) ? new Date() : d); }

  function renderMessengerList() {

      <div class="support-chat" style="height:100%">

            return `<div class="chat-msg ${mine ? 'me' : 'them'}">
              <b>${escapeHtml(m.author_name || 'Пользователь')}</b><br>${escapeHtml(m.content)}
              <span class="chat-msg-time">${fmtTime(m.created_at)}</span>

          }).join('') : `<div class="empty-msg">Пока нет сообщений.<br>Напишите первым.</div>`}
        </div>
        <form class="support-chat-form" id="chat-form">

  }
