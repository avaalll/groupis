  /* ── Голосование в совместном чате ── */
  async function refreshMatchVotePanel() {
    const c = chat;
    if (!c || c.type !== 'match') return;
    const m = groupMatches.find((x) => x.id === String(c.matchId));
    if (!m) return;
    const votes = m.voteState === 'open' ? await loadMatchVotes(m.id) : [];
    if (chat !== c) return;
    renderMatchVotePanel(m, votes);
  }

  function renderMatchVotePanel(m, votes) {
    const el = winBody.querySelector('#match-vote');
    if (!el) return;
    const myId = currentUser && currentUser.id;
    const total = Math.max(1, matchParticipantIds(m).length);
    const yes = votes.filter((v) => v.vote).length;
    const no = votes.filter((v) => !v.vote).length;
    const mine = votes.find((v) => v.user_id === myId);
    const need = Math.ceil(total / 2);
    el.dataset.state = m.voteState;
    if (m.voteState === 'approved') {
      el.innerHTML = `<div class="mv-done">💞 Союз закреплён — на карте вы видите только друг друга</div>`;
    } else if (m.voteState === 'open') {
      el.innerHTML = `
        <div class="mv-head"><span class="mv-title">Остаёмся только друг с другом?</span><span class="mv-count">${yes + no} из ${total}</span></div>
        <div class="mv-bar"><span class="mv-yes" style="width:${(yes / total * 100).toFixed(1)}%"></span><span class="mv-no" style="width:${(no / total * 100).toFixed(1)}%"></span></div>
        <div class="mv-actions">
          <button type="button" class="mv-btn yes ${mine && mine.vote ? 'is-on' : ''}" data-vote-yes>❤ За · ${yes}</button>
          <button type="button" class="mv-btn no ${mine && !mine.vote ? 'is-on' : ''}" data-vote-no>✕ Против · ${no}</button>
        </div>
        <div class="mv-hint">Решает ${need} из ${total}: «за» — группы видят только друг друга, «против» — союз распадётся и чат удалится</div>`;
    } else if (isMatchLeader(m, myId)) {
      el.innerHTML = `
        <button type="button" class="mv-start" data-vote-start>🗳 Начать голосование</button>
        <div class="mv-hint">Остаться только друг с другом или разойтись — решат участники обеих групп</div>`;
    } else {
      el.innerHTML = `<div class="mv-hint">🗳 Голосование о союзе может начать лидер одной из групп</div>`;
    }
  }

  // match изменился (realtime или наш голос): распался — закрываем чат, иначе обновляем панель
  function onMatchesChanged() {
    const c = chat;
    if (!c || c.type !== 'match') return;
    const m = groupMatches.find((x) => x.id === String(c.matchId));
    if (!m || m.status !== 'accepted') {
      leaveChat();
      winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
      showMessengerScreen();
      setTimeout(() => alert('Союз распался — совместный чат удалён'), 50);
      return;
    }
    refreshMatchVotePanel();
  }

  async function startMatchVote(matchId) {
    const { error } = await supabaseClient.rpc('start_match_vote', { match_id: Number(matchId) });
    if (error) { alert('Не удалось начать голосование: ' + error.message); return; }
    await loadGroupMatchesFromDB();
    refreshMatchVotePanel();
  }

  async function castMatchVote(matchId, vote) {
    const { data: result, error } = await supabaseClient.rpc('cast_match_vote', { match_id: Number(matchId), vote });
    if (error) { alert('Не удалось проголосовать: ' + error.message); return; }
    if (result === 'open') { refreshMatchVotePanel(); return; }
    // голосование решено — союз закреплён или распался: обновляем карту, чаты, группы
    await refreshGroupsWorld();
    onMatchesChanged();
  }

  function scrollChatToBottom() {
    const body = winBody.querySelector('#chat-view-body');
    if (body) body.scrollTop = body.scrollHeight;
  }

  function chatBubbleEl(id) {
    return winBody.querySelector(`#chat-view-body [data-msg-id="${CSS.escape(String(id))}"]`);
  }

  function appendChatBubble(m) {
    const body = winBody.querySelector('#chat-view-body');
    if (!body) return;
    const empty = body.querySelector('.empty-msg');
    if (empty) empty.remove();
    body.insertAdjacentHTML('beforeend', chatBubbleHtml(m));
    if (body.lastElementChild) body.lastElementChild.classList.add('is-new');   // новое сообщение «выпрыгивает»
    hydrateChatMedia(body);
    scrollChatToBottom();
  }

  function replaceChatBubble(oldId, m) {
    const el = chatBubbleEl(oldId);
    if (!el) return;
    el.insertAdjacentHTML('afterend', chatBubbleHtml(m));
    el.remove();
    hydrateChatMedia(winBody.querySelector('#chat-view-body'));
  }

  function chatMediaFolder(c) {
    if (c.type === 'dm') {
      const [a, b] = [String(currentUser.id), String(c.peerId)].sort();
      return `dm/${a}/${b}`;
    }
    if (c.type === 'match') return `match/${c.matchId}`;
    return `group/${c.groupId}`;
  }

  function baseMime(type) { return String(type || '').split(';')[0].trim(); }

  function extForMime(type) {
    return ({
      'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif',
      'video/mp4': 'mp4', 'video/webm': 'webm', 'video/quicktime': 'mov',
      'audio/webm': 'webm', 'audio/mp4': 'm4a', 'audio/ogg': 'ogg', 'audio/mpeg': 'mp3', 'audio/aac': 'aac',
    })[baseMime(type)] || 'bin';
  }

  async function insertChatRow(c, { kind, content, mediaPath, duration, fileName, fileSize }) {
    // имя и размер — только у файлов: так фото/голосовые работают и без миграции supabase_chat_files.sql
    const fileCols = kind === 'file' ? { file_name: fileName || null, file_size: fileSize || null } : {};
    if (c.type === 'dm') {
      const row = { from_id: currentUser.id, to_id: c.peerId, content: content || '' };
      // Для текста шлём только старые поля — так текст работает и до выполнения миграции
      if (kind !== 'text') Object.assign(row, { kind, media_path: mediaPath, duration: duration || null }, fileCols);
      const { data, error } = await supabaseClient.from('dm_messages').insert(row).select().single();
      return { data: data ? normDmRow(data) : null, error };
    }
    const row = {
      user_id: currentUser.id, author_name: profile.name,
      content: content || '', kind, media_path: mediaPath || null, duration: duration || null, ...fileCols,
    };
    if (c.type === 'match') {
      row.match_id = Number(c.matchId);
      const { data, error } = await supabaseClient.from('match_messages').insert(row).select().single();
      return { data: data ? normMatchRow(data) : null, error };
    }
    row.group_id = c.groupId;
    const { data, error } = await supabaseClient.from('group_messages').insert(row).select().single();
    return { data: data ? normGroupRow(data) : null, error };
  }

  async function sendChatMessage({ kind = 'text', content = '', blob = null, duration = null, fileName = null }) {
    const c = chat;
    if (!c || !currentUser) return;
    let mediaPath = null, localUrl = null;
    const fileSize = kind === 'file' && blob ? blob.size : null;
    if (blob) {
      // у документа берём его собственное расширение (в хранилище — служебное имя, настоящее — в file_name)
      const ext = kind === 'file' ? (fileExt(fileName) || 'bin') : extForMime(blob.type);
      mediaPath = `${chatMediaFolder(c)}/${currentUser.id}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      localUrl = URL.createObjectURL(blob);
    }
    const tmp = {
      id: 'tmp-' + Date.now() + Math.random().toString(36).slice(2, 6),
      fromId: currentUser.id, toId: c.peerId || null, groupId: c.groupId || null, matchId: c.matchId || null, authorName: profile.name,
      content, kind, mediaPath, duration, fileName, fileSize, localUrl, pending: true, createdAt: new Date().toISOString(),
    };
    c.messages.push(tmp);
    if (chat === c) appendChatBubble(tmp);
    try {
      if (blob) {
        const { error: upErr } = await supabaseClient.storage.from(CHAT_BUCKET)
          .upload(mediaPath, blob, { contentType: baseMime(blob.type) || 'application/octet-stream', upsert: false });
        if (upErr) throw upErr;
      }
      const { data, error } = await insertChatRow(c, { kind, content, mediaPath, duration, fileName, fileSize });
      if (error) throw error;
      // своё фото, голосовое или кружок сразу остаётся на устройстве — при следующем открытии чата не скачивается
      if (blob && ['image', 'voice', 'circle'].includes(kind)) rememberMediaBlob(mediaPath, blob, localUrl);
      if (data) { data.localUrl = localUrl; finalizeChatMessage(c, tmp.id, data); }
      saveChatCache(c);
    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      console.warn('[chat] send:', msg);
      c.messages = c.messages.filter((x) => x.id !== tmp.id);
      if (chat === c) { const el = chatBubbleEl(tmp.id); if (el) el.remove(); }
      // Документы требуют миграции: без неё хранилище не примет тип файла, а таблица — kind='file'
      const needsSql = kind === 'file' && /mime|file_name|file_size|kind_check|check constraint/i.test(msg);
      alert('Не удалось отправить: ' + msg + (needsSql ? '\n\nВыполните supabase_chat_files.sql в Supabase.' : ''));
    }
  }

  function finalizeChatMessage(c, tmpId, real) {
    const idx = c.messages.findIndex((x) => x.id === tmpId);
    if (idx === -1) return; // уже заменили копией из realtime
    if (c.messages.some((x) => x.id === real.id)) {
      c.messages.splice(idx, 1);
      if (chat === c) { const el = chatBubbleEl(tmpId); if (el) el.remove(); }
      return;
    }
    c.messages[idx] = real;
    if (chat === c) replaceChatBubble(tmpId, real);
  }

  // Новое сообщение из realtime (личное или групповое)
  function onIncomingChatRow(m) {
    const c = chat;
    const belongs = c && (
      c.type === 'dm'
        ? m.groupId === null && m.matchId === null && (String(m.fromId) === String(c.peerId) || String(m.toId) === String(c.peerId))
        : c.type === 'match'
          ? m.matchId !== null && String(m.matchId) === String(c.matchId)
          : m.groupId !== null && String(m.groupId) === String(c.groupId));
    if (!belongs) {
      rememberIncomingMessage(m);
      if (openApp === 'messenger' && winBody.querySelector('#chats-list')) renderChatsList();
      return;
    }
    if (c.messages.some((x) => x.id === m.id)) return;
    if (String(m.fromId) === String(currentUser.id)) {
      // Своё сообщение может прийти раньше ответа на insert — заменяем черновик, а не дублируем
      const tmp = c.messages.find((x) => x.pending && x.kind === m.kind &&
        (m.mediaPath ? x.mediaPath === m.mediaPath : x.content === m.content));
      if (tmp) {
        m.localUrl = tmp.localUrl;
        c.messages[c.messages.indexOf(tmp)] = m;
        replaceChatBubble(tmp.id, m);
        saveChatCache(c);
        return;
      }
    }
    c.messages.push(m);
    appendChatBubble(m);
    saveChatCache(c);
  }

  function sendChatText() {
    const input = winBody.querySelector('#chat-text');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendChatMessage({ kind: 'text', content: text });
  }

  function imageFileToBlob(file, maxSide = 1600, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image decode error')); };
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/jpeg', quality);
      };
      img.src = url;
    });
  }

  async function onChatFilesPicked(e) {
    const input = e.target;
    const files = [...(input.files || [])];
    input.value = '';
    for (const file of files) {
      if (file.type.startsWith('image/')) {
        // GIF отправляем как есть, чтобы не потерять анимацию; остальное — сжимаем
        const blob = file.type === 'image/gif' ? file : await imageFileToBlob(file).catch(() => file);
        sendChatMessage({ kind: 'image', blob });
      } else if (file.type.startsWith('video/')) {
        if (file.size > MAX_VIDEO_BYTES) { alert(`Видео «${file.name}» больше 50 МБ`); continue; }
        sendChatMessage({ kind: 'video', blob: file });
      } else {
        // Любой другой файл — PDF, документ, таблица, архив — уходит карточкой с именем и размером
        if (BLOCKED_FILE_EXT.has(fileExt(file.name))) { alert(`Файл «${file.name}» нельзя отправить: исполняемые файлы и скрипты запрещены`); continue; }
        if (file.size > MAX_VIDEO_BYTES) { alert(`Файл «${file.name}» больше 50 МБ`); continue; }
        if (!file.size) { alert(`Файл «${file.name}» пустой`); continue; }
        sendChatMessage({ kind: 'file', blob: file, fileName: file.name });
      }
    }
  }

  /* ── Запись голосовых и видеокружков ── */
  let chatRec = null; // { kind, recorder, stream, chunks, startedAt, timer, discard, chat }

  function pickRecorderMime(kind) {
    // Сначала MP4 (H.264/AAC): так пишет iPhone, и такой файл играет и в Safari, и в Chrome.
    // WebM — запасной вариант для браузеров без записи в MP4.
    const list = kind === 'voice'
      ? ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus']
      : ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4',
         'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm'];
    return list.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  }

  async function startChatRecording(kind) {
    if (chatRec || !chat) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      alert('Запись не поддерживается в этом браузере (нужен HTTPS или localhost)');
      return;
    }
    const c = chat;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia(kind === 'voice'
        ? { audio: { echoCancellation: true, noiseSuppression: true } }
        : { audio: true, video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } } });
    } catch (err) {
      console.warn('[chat rec] getUserMedia:', err);
      alert(kind === 'voice' ? 'Нет доступа к микрофону' : 'Нет доступа к камере или микрофону');
      return;
    }
    if (chat !== c || chatRec) { stream.getTracks().forEach((t) => t.stop()); return; }

    const mimeType = pickRecorderMime(kind);
    const opts = {};
    if (mimeType) opts.mimeType = mimeType;
    if (kind === 'circle') opts.videoBitsPerSecond = 1000000;
    const recorder = new MediaRecorder(stream, opts);
    const rec = { kind, recorder, stream, chunks: [], startedAt: Date.now(), timer: null, discard: false, chat: c };
    chatRec = rec;

    recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) rec.chunks.push(ev.data); };
    recorder.onstop = () => {
      finishRecordingUi(rec);
      if (rec.discard || !rec.chunks.length || chat !== rec.chat) return;
      const duration = (Date.now() - rec.startedAt) / 1000;
      if (duration < 0.7) return; // случайное нажатие
      const type = recorder.mimeType || (rec.chunks[0] && rec.chunks[0].type) || mimeType
        || (kind === 'voice' ? 'audio/mp4' : 'video/mp4');
      sendChatMessage({ kind, blob: new Blob(rec.chunks, { type }), duration: Math.round(duration * 10) / 10 });
    };
    // Без timeslice: Safari на iPhone при записи кусками склеивает битый файл,
    // который потом не воспроизводится. Весь файл придёт одним куском при stop().
    recorder.start();
    setRecordingUi(true, kind, stream);

    const maxSec = kind === 'voice' ? MAX_VOICE_SEC : MAX_CIRCLE_SEC;
    rec.timer = setInterval(() => {
      const sec = (Date.now() - rec.startedAt) / 1000;
      const t = winBody.querySelector('#chat-rec-time');
      if (t) t.textContent = fmtDuration(sec);
      if (sec >= maxSec) stopChatRecording(false);
    }, 250);
  }

  function finishRecordingUi(rec) {
    clearInterval(rec.timer);
    rec.stream.getTracks().forEach((t) => t.stop());
    if (chatRec === rec) chatRec = null;
    setRecordingUi(false);
  }

  function stopChatRecording(discard) {
    const rec = chatRec;
    if (!rec) return;
    rec.discard = discard;
    if (rec.recorder.state !== 'inactive') rec.recorder.stop();
    else finishRecordingUi(rec);
  }

  function setRecordingUi(on, kind, stream) {
    const composer = winBody.querySelector('#chat-composer');
    const bar = winBody.querySelector('#chat-recbar');
    const prev = winBody.querySelector('#chat-rec-preview');
    if (composer) composer.hidden = on;
    if (bar) bar.hidden = !on;
    if (on) {
      const label = winBody.querySelector('#chat-rec-label');
      if (label) label.textContent = kind === 'voice' ? 'Голосовое' : 'Видеокружок';
      const t = winBody.querySelector('#chat-rec-time');
      if (t) t.textContent = '0:00';
    }
    if (prev) {
      const v = prev.querySelector('video');
      if (on && kind === 'circle') { v.srcObject = stream; v.play().catch(() => {}); prev.hidden = false; }
      else { if (v) v.srcObject = null; prev.hidden = true; }
    }
  }

  /* ── Просмотр ── */
  function openPhotoViewer(src) {
    const back = document.createElement('div');
    back.className = 'photo-viewer';
    back.innerHTML = `<img src="${escapeHtml(src)}" alt="">`;
    back.addEventListener('click', () => back.remove());
    document.body.appendChild(back);
  }

  // Кружок: по умолчанию крутится без звука; тап — проиграть со звуком, повторный тап — пауза
  function toggleCircle(wrap) {
    const video = wrap.querySelector('video');
    if (!video || !video.src) return;
    if (video.muted) {
      video.muted = false; video.loop = false; video.currentTime = 0;
      video.play().catch(() => {});
      wrap.classList.add('is-playing');
      video.onended = () => {
        video.muted = true; video.loop = true; video.onended = null;
        wrap.classList.remove('is-playing');
        video.play().catch(() => {});
      };
    } else if (video.paused) video.play().catch(() => {});
    else video.pause();
  }

  /* ── Сообщения: кеш переписки, закрепление, выбор, удаление, пересылка ── */
  const chatHistoryCache = new Map();   // ключ чата → сообщения (последние 200)
  function chatKey(c) { return c.type === 'dm' ? 'dm:' + c.peerId : c.type === 'match' ? 'match:' + c.matchId : 'group:' + c.groupId; }
  function saveChatCache(c) {
    if (!currentUser || !c) return;
    const list = c.messages.filter((m) => !m.pending).slice(-200).map(({ localUrl, pending, ...m }) => m);
    const key = chatKey(c);
    chatHistoryCache.set(key, list);
    KV.set(`chat:${currentUser.id}:${key}`, list);
  }
  function rememberIncomingMessage(m) {
    if (!currentUser) return;
    const key = m.matchId !== null ? 'match:' + m.matchId
      : m.groupId !== null ? 'group:' + m.groupId
      : 'dm:' + (String(m.fromId) === String(currentUser.id) ? m.toId : m.fromId);
    const list = chatHistoryCache.get(key);
    if (list && !list.some((x) => String(x.id) === String(m.id))) {
      list.push(m);
      KV.set(`chat:${currentUser.id}:${key}`, list.slice(-200));
    }
    prefetchChatMedia([m]);
  }

  /* После входа, в фоне: переписки всех чатов и вложения последних сообщений — на устройство.
     Тогда любой чат, даже тот, что ещё не открывали, появляется сразу и с фото. */
  let chatsPrefetching = false;
  async function prefetchChats() {
    if (chatsPrefetching || !currentUser) return;
    chatsPrefetching = true;
    const uid = currentUser.id;
    const mine = () => currentUser && currentUser.id === uid;
    try {
      for (const { spec } of forwardTargets().slice(0, 60)) {
        if (!mine()) return;
        const key = chatKey(spec);
        if (chat && chatKey(chat) === key) continue;   // открытый чат обновляет себя сам
        let list = await loadChatHistory(spec);
        if (!mine()) return;
        if (list && !(chat && chatKey(chat) === key)) {
          list = list.slice(-200);
          chatHistoryCache.set(key, list);
          KV.set(`chat:${uid}:${key}`, list);
        } else list = chatHistoryCache.get(key) || (await KV.get(`chat:${uid}:${key}`));
        if (Array.isArray(list)) await prefetchChatMedia(list);
      }
      KV.mediaPrune(MEDIA_KEEP);
    } catch (err) { console.warn('[chat prefetch]', err); }
    finally { chatsPrefetching = false; }
  }

  /* «Удалить у меня»: сообщение остаётся у остальных, а у меня скрыто. Список скрытых хранится
     на устройстве и, если выполнен supabase_chat_actions.sql, на сервере — тогда он общий для всех моих устройств */
  const hiddenMsgs = { dm: new Set(), group: new Set(), match: new Set() };
  const hiddenStoreKey = () => 'chat.hidden.v1:' + (currentUser ? currentUser.id : 'guest');
  function isHiddenMsg(kind, id) { return !!hiddenMsgs[kind] && hiddenMsgs[kind].has(String(id)); }
  function saveHiddenLocal() {
    try {
      localStorage.setItem(hiddenStoreKey(), JSON.stringify({ dm: [...hiddenMsgs.dm], group: [...hiddenMsgs.group], match: [...hiddenMsgs.match] }));
    } catch {}
  }
  async function loadHiddenMessages() {
    if (!currentUser) return;
    try {
      const saved = JSON.parse(localStorage.getItem(hiddenStoreKey()) || '{}');
      for (const kind of Object.keys(hiddenMsgs)) (saved[kind] || []).forEach((id) => hiddenMsgs[kind].add(String(id)));
    } catch {}
    const { data, error } = await supabaseClient.from('chat_hidden_messages').select('chat_kind, msg_id').eq('user_id', currentUser.id);
    if (error) { console.warn('[chat hidden] load:', error.message); return; }
    for (const r of (data || [])) if (hiddenMsgs[r.chat_kind]) hiddenMsgs[r.chat_kind].add(String(r.msg_id));
    saveHiddenLocal();
  }
  async function hideChatMessagesForMe(c, list) {
    const ids = list.map((m) => String(m.id));
    ids.forEach((id) => hiddenMsgs[c.type].add(id));
    saveHiddenLocal();
    removeChatMessagesLocal(c.type, ids);
    setChatSelecting(false);
    const { error } = await supabaseClient.from('chat_hidden_messages').upsert(
      ids.map((id) => ({ user_id: currentUser.id, chat_kind: c.type, msg_id: id })),
      { onConflict: 'user_id,chat_kind,msg_id', ignoreDuplicates: true });
    // без таблицы на сервере сообщение остаётся скрытым на этом устройстве
    if (error) console.warn('[chat hidden] save:', error.message);
  }

  function chatMsgById(id) { return chat ? chat.messages.find((x) => String(x.id) === String(id)) || null : null; }
  function isMyMsg(m) { return !!m && !!currentUser && String(m.fromId) === String(currentUser.id); }
  const chatSqlHint = (error) => /function|schema cache|could not find|pinned/i.test(error.message || '')
    ? '\n\nВыполните supabase_chat_actions.sql в Supabase.' : '';

  function rerenderChatBody() {
    const body = winBody.querySelector('#chat-view-body');
    if (!body || !chat) return;
    const stick = chat.stick !== false;
    body.innerHTML = chat.messages.length ? chat.messages.map(chatBubbleHtml).join('') : `<div class="empty-msg">Начните диалог.</div>`;
    hydrateChatMedia(body);
    if (stick) scrollChatToBottom();
    syncChatPinBar();
    syncChatSelectionUi();
  }

  // События realtime по сообщениям: новое, изменённое (закрепили / открепили) и удалённое
  function handleChatRealtime(payload, kind, norm) {
    if (!currentUser) return;
    if (payload.eventType === 'DELETE') {
      const id = payload.old && payload.old.id;
      if (id != null) removeChatMessagesLocal(kind, [id]);
      return;
    }
    const r = payload.new;
    if (!r) return;
    if (kind === 'dm' && r.from_id !== currentUser.id && r.to_id !== currentUser.id) return;
    const m = norm(r);
    if (payload.eventType !== 'UPDATE') { onIncomingChatRow(m); return; }
    const c = chat;
    if (!c || c.type !== kind) return;
    const idx = c.messages.findIndex((x) => String(x.id) === String(m.id));
    if (idx === -1) return;
    const old = c.messages[idx];
    if (old.pinned === m.pinned && old.content === m.content) return;
    c.messages[idx] = { ...m, localUrl: old.localUrl };
    c.pinIdx = null;
    replaceChatBubble(m.id, c.messages[idx]);
    syncChatPinBar();
    saveChatCache(c);
  }

  function removeChatMessagesLocal(kind, ids) {
    const c = chat;
    if (!c || c.type !== kind) return;
    const gone = new Set(ids.map(String));
    if (!c.messages.some((m) => gone.has(String(m.id)))) return;
    c.messages = c.messages.filter((m) => !gone.has(String(m.id)));
    gone.forEach((id) => { const el = chatBubbleEl(id); if (el) el.remove(); c.selected.delete(id); });
    if (!c.selected.size) c.selecting = false;
    c.pinIdx = null;
    const body = winBody.querySelector('#chat-view-body');
    if (body && !c.messages.length) body.innerHTML = `<div class="empty-msg">Начните диалог.</div>`;
    syncChatPinBar();
    syncChatSelectionUi();
    saveChatCache(c);
  }

  /* Закреплённое — полоса над лентой. Если закреплено несколько, нажатие листает их от нового к старому */
  function pinnedMessages() { return chat ? chat.messages.filter((m) => m.pinned && !m.pending) : []; }
  function syncChatPinBar() {
    const el = winBody.querySelector('#chat-pin');
    if (!el || !chat) return;
    const pins = pinnedMessages();
    if (!pins.length) { el.hidden = true; el.innerHTML = ''; return; }
    chat.pinIdx = Math.min(chat.pinIdx == null ? pins.length - 1 : chat.pinIdx, pins.length - 1);
    const m = pins[chat.pinIdx];
    el.hidden = false;
    el.innerHTML = `
      <div class="chat-pin-main">
        <span class="chat-pin-cap">Закреплено${pins.length > 1 ? ` · ${chat.pinIdx + 1} из ${pins.length}` : ''}</span>
        <span class="chat-pin-text">${escapeHtml(chatPreviewText(m) || 'Сообщение')}</span>
      </div>
      <button type="button" class="chat-pin-x" data-pin-off="${escapeHtml(m.id)}" aria-label="Открепить" title="Открепить">×</button>`;
  }
  function jumpToPinned() {
    const pins = pinnedMessages();
    if (!pins.length) return;
    const idx = Math.min(chat.pinIdx == null ? pins.length - 1 : chat.pinIdx, pins.length - 1);
    const el = chatBubbleEl(pins[idx].id);
    if (el) {
      el.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
      el.classList.remove('is-flash'); void el.offsetWidth; el.classList.add('is-flash');
    }
    chat.pinIdx = (idx - 1 + pins.length) % pins.length;
    syncChatPinBar();
  }
  async function setChatMessagePinned(id, pin) {
    const c = chat, m = chatMsgById(id);
    if (!c || !m || m.pending) return;
    const apply = (value) => {
      m.pinned = value; c.pinIdx = null;
      if (chat !== c) return;
      replaceChatBubble(m.id, m); syncChatPinBar(); syncChatSelectionUi(); saveChatCache(c);
    };
    apply(pin);   // сразу на экране, сервер — в фоне
    const { error } = await supabaseClient.rpc('set_chat_message_pinned', { chat_kind: c.type, msg_id: String(m.id), pin });
    if (error) {
      console.warn('[chat pin]', error.message);
      apply(!pin);
      alert('Не удалось ' + (pin ? 'закрепить' : 'открепить') + ' сообщение: ' + error.message + chatSqlHint(error));
    }
  }

  /* Выбор нескольких сообщений: вместо поля ввода — панель «Переслать / Удалить» */
  function setChatSelecting(on) {
    if (!chat) return;
    chat.selecting = on;
    if (!on) chat.selected.clear();
    syncChatSelectionUi();
  }
  function toggleChatSelected(id) {
    if (!chat) return;
    const key = String(id);
    if (chat.selected.has(key)) chat.selected.delete(key); else chat.selected.add(key);
    chat.selecting = chat.selected.size > 0;
    syncChatSelectionUi();
  }
  function syncChatSelectionUi() {
    const view = winBody.querySelector('.chat-view');
    if (!view || !chat) return;
    view.classList.toggle('is-selecting', chat.selecting);
    view.querySelectorAll('#chat-view-body .chat-msg[data-msg-id]').forEach((el) => el.classList.toggle('is-selected', chat.selected.has(el.dataset.msgId)));
    const bar = view.querySelector('#chat-selbar'), composer = view.querySelector('#chat-composer');
    if (bar) bar.hidden = !chat.selecting;
    if (composer && !chatRec) composer.hidden = chat.selecting;
    const count = view.querySelector('#chat-sel-count');
    if (count) count.textContent = `Выбрано: ${chat.selected.size}`;
    const del = view.querySelector('[data-sel-delete]');
    if (del) del.disabled = !chat.selected.size;
  }

  // Меню сообщения — по долгому нажатию или правой кнопке мыши
  function openMsgMenu(id, x, y) {
    const m = chatMsgById(id);
    if (!m || m.pending) return;
    closePostMenus();
    const pop = document.createElement('div');
    pop.className = 'popover msg-menu';
    const item = (act, label, danger = false) =>
      `<button class="pop-item ${danger ? 'danger' : ''}" type="button" data-msg-act="${act}" data-msg-id="${escapeHtml(m.id)}">${label}</button>`;
    pop.innerHTML = item('pin', m.pinned ? 'Открепить' : 'Закрепить')
      + ((m.content || '').trim() ? item('copy', 'Копировать текст') : '')
      + item('forward', 'Переслать')
      + item('select', 'Выбрать')
      + item('delete', 'Удалить', true);
    winBody.appendChild(pop);
    const r = winBody.getBoundingClientRect();
    const left = Math.max(8, Math.min(x - r.left, r.width - pop.offsetWidth - 8));
    const top = Math.max(8, Math.min(y - r.top, r.height - pop.offsetHeight - 8));
    pop.style.left = left + 'px';
    pop.style.top = (top + winBody.scrollTop) + 'px';
    const onDocDown = (ev) => {
      if (pop.contains(ev.target)) return;
      pop.remove();
      document.removeEventListener('pointerdown', onDocDown, true);
    };
    setTimeout(() => document.addEventListener('pointerdown', onDocDown, true), 0);
  }

  // Окно удаления: «У меня» — скрыть только у себя, «У всех» — удалить из чата (только свои сообщения)
  function deleteChoiceModal({ count, canAll }) {
    return new Promise((resolve) => {
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      back.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <h3 class="modal-title">${count > 1 ? `Удалить сообщения (${count})?` : 'Удалить сообщение?'}</h3>
          <p class="modal-text">${canAll
            ? '«У меня» — сообщение исчезнет только у вас, у остальных останется. «У всех» — исчезнет у всех участников чата, вернуть его нельзя.'
            : 'Сообщение исчезнет только у вас, у остальных участников оно останется. Удалить у всех можно только свои сообщения.'}</p>
          <div class="modal-actions del-actions">
            <button type="button" class="btn" data-pick="">Отмена</button>
            <button type="button" class="btn ${canAll ? '' : 'btn-danger'}" data-pick="me">У меня</button>
            ${canAll ? '<button type="button" class="btn btn-danger" data-pick="all">У всех</button>' : ''}
          </div>
        </div>`;
      win.appendChild(back);
      back.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-pick]');
        if (!btn && e.target !== back) return;
        back.remove();
        resolve(btn ? btn.dataset.pick || null : null);
      });
    });
  }

  async function deleteChatMessages(ids) {
    const c = chat;
    if (!c) return;
    const list = ids.map(chatMsgById).filter((m) => m && !m.pending);
    if (!list.length) return;
    const pick = await deleteChoiceModal({ count: list.length, canAll: list.every(isMyMsg) });
    if (!pick || chat !== c) return;
    if (pick === 'me') { await hideChatMessagesForMe(c, list); return; }
    const gone = list.map((m) => String(m.id));
    removeChatMessagesLocal(c.type, gone);   // сразу с экрана, сервер — в фоне
    setChatSelecting(false);
    const { error } = await supabaseClient.rpc('delete_chat_messages', { chat_kind: c.type, ids: gone });
    if (error) {
      console.warn('[chat delete]', error.message);
      alert('Не удалось удалить: ' + error.message + chatSqlHint(error));
      const fresh = await loadChatHistory(c);
      if (fresh && chat === c) { c.messages = fresh; rerenderChatBody(); saveChatCache(c); }
      return;
    }
    const paths = list.map((m) => m.mediaPath).filter(Boolean);
    if (paths.length) supabaseClient.storage.from(CHAT_BUCKET).remove(paths).then(() => {}, () => {});
  }

  /* Пересылка: копия сообщения в другой чат. Файл копируется в папку того чата — у его участников
     есть доступ только к ней */
  function forwardTargets() {
    const out = [];
    for (const g of myGroups()) {
      const ava = g.photo
        ? `<span class="avatar group-chat-avatar" style="width:36px;height:36px;background-image:url('${safeUrl(g.photo)}')"></span>`
        : `<span class="avatar group-chat-avatar" style="width:36px;height:36px;background:linear-gradient(145deg, var(--c1), var(--c2))">${escapeHtml((g.name || '?').charAt(0).toUpperCase())}</span>`;
      out.push({ spec: { type: 'group', groupId: g.id }, name: g.name || 'Группа', sub: 'Чат группы', ava });
    }
    for (const m of myAcceptedMatches()) {
      out.push({ spec: { type: 'match', matchId: String(m.id) }, name: matchTitle(m), sub: 'Совместный чат',
        ava: `<span class="avatar group-chat-avatar match-chat-avatar" style="width:36px;height:36px">${featMarkHtml(m.voteState)}</span>` });
    }
    for (const f of friends) {
      out.push({ spec: { type: 'dm', peerId: f.id }, name: f.name || f.handle || 'Пользователь', sub: f.handle || '', ava: avatarCircleHtml(f, 36) });
    }
    return out;
  }
  async function forwardMessage(m, target) {
    let mediaPath = null;
    if (m.mediaPath) {
      mediaPath = `${chatMediaFolder(target)}/${currentUser.id}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${fileExt(m.mediaPath) || 'bin'}`;
      const { error } = await supabaseClient.storage.from(CHAT_BUCKET).copy(m.mediaPath, mediaPath);
      if (error) throw error;
      if (mediaBlobUrls.has(m.mediaPath)) mediaBlobUrls.set(mediaPath, mediaBlobUrls.get(m.mediaPath));
    }
    const { data, error } = await insertChatRow(target, {
      kind: m.kind || 'text', content: m.content || '', mediaPath,
      duration: m.duration, fileName: m.fileName, fileSize: m.fileSize,
    });
    if (error) throw error;
    const list = data && chatHistoryCache.get(chatKey(target));
    if (list && !list.some((x) => String(x.id) === String(data.id))) list.push(data);
  }
  function openForwardPicker(ids) {
    const c = chat;
    if (!c) return;
    const wanted = new Set(ids.map(String));
    const msgs = c.messages.filter((m) => wanted.has(String(m.id)) && !m.pending);
    if (!msgs.length) return;
    const targets = forwardTargets().filter((t) => chatKey(t.spec) !== chatKey(c));
    if (!targets.length) { alert('Пересылать пока некуда: нет других чатов.'); return; }
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <h3 class="modal-title">${msgs.length > 1 ? `Переслать сообщения (${msgs.length})` : 'Переслать сообщение'}</h3>
        <ul class="fwd-list">${targets.map((t, i) => `
          <li class="person-card" data-fwd="${i}" role="checkbox" aria-checked="false" tabindex="0">
            <span class="person-check"></span>
            ${t.ava}
            <div class="person-main">
              <div class="person-name">${escapeHtml(t.name)}</div>
              <div class="person-handle">${escapeHtml(t.sub)}</div>
            </div>
          </li>`).join('')}</ul>
        <div class="modal-actions">
          <button type="button" class="btn" data-cancel>Отмена</button>
          <button type="button" class="btn btn-primary" data-send disabled>Отправить</button>
        </div>
      </div>`;
    win.appendChild(back);
    const sendBtn = back.querySelector('[data-send]');
    const chosen = () => [...back.querySelectorAll('[data-fwd][aria-checked="true"]')].map((el) => targets[Number(el.dataset.fwd)]);
    back.addEventListener('click', async (e) => {
      if (e.target === back || e.target.closest('[data-cancel]')) { if (!sendBtn.dataset.busy) back.remove(); return; }
      const row = e.target.closest('[data-fwd]');
      if (row && !sendBtn.dataset.busy) {
        row.setAttribute('aria-checked', String(row.getAttribute('aria-checked') !== 'true'));
        sendBtn.disabled = !chosen().length;
        return;
      }
      if (!e.target.closest('[data-send]') || sendBtn.dataset.busy) return;
      const list = chosen();
      if (!list.length) return;
      sendBtn.dataset.busy = '1'; sendBtn.disabled = true; sendBtn.textContent = 'Отправляем…';
      let failed = 0, lastError = null;
      for (const t of list) {
        for (const m of msgs) {
          try { await forwardMessage(m, t.spec); }
          catch (err) { failed++; lastError = err; console.warn('[chat forward]', err); }
        }
      }
      back.remove();
      if (chat === c) setChatSelecting(false);
      if (failed) alert(`Не удалось переслать (${failed}): ` + ((lastError && lastError.message) || lastError));
    });
  }

  /* ── Открытие / закрытие чата ── */
  function leaveChat() {
    if (chatRec) stopChatRecording(true);
    chat = null;
  }

  /* Чат открывается сразу из переписки, сохранённой на устройстве; свежая версия с сервера
     подтягивается следом и подменяет ленту, только если что-то изменилось */
  async function openChat(spec, backFn) {
    leaveChat();
    const c = { ...spec, messages: [], selected: new Set(), selecting: false, pinIdx: null };
    if (c.type === 'dm') {
      const peer = friends.find((f) => f.id === c.peerId) || groupMemberProfiles.get(c.peerId);
      c.headTitle = 'Чат с ' + (peer ? peer.name : 'пользователем');
      c.winTitle = 'Личный чат';
    } else if (c.type === 'match') {
      const m = groupMatches.find((x) => x.id === String(c.matchId));
      c.headTitle = m ? matchTitle(m) : 'Совместный чат';
      c.winTitle = 'Совместный чат';
    } else {
      const g = groups.find((x) => String(x.id) === String(c.groupId));
      c.headTitle = g ? `Группа «${g.name}»` : 'Групповой чат';
      c.winTitle = g ? g.name : 'Групповой чат';
    }
    chat = c;
    const show = () => setScreen(() => {
      winTitle.textContent = c.winTitle;
      winBody.scrollTop = 0;
      winBody.style.display = 'flex'; winBody.style.flexDirection = 'column'; winBody.style.padding = '0';
      renderChatView();
    }, () => {
      leaveChat();
      winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
      (backFn || showMessengerScreen)();
    });
    const sign = (list) => list.map((m) => m.id + (m.pinned ? '*' : '')).join(',');

    const key = chatKey(c);
    let cached = chatHistoryCache.get(key);
    if (!cached && currentUser) {
      cached = await KV.get(`chat:${currentUser.id}:${key}`);
      if (chat !== c) return; // пока читали кеш, пользователь ушёл
      if (Array.isArray(cached)) chatHistoryCache.set(key, cached); else cached = null;
    }
    if (cached) {
      c.messages = cached.filter((m) => !isHiddenMsg(c.type, m.id));
      await warmChatMedia(c.messages);
      if (chat !== c) return;
      show();
    }

    const fresh = await loadChatHistory(c);
    if (chat !== c) return; // пока грузили, пользователь ушёл
    if (!cached) {
      c.messages = fresh || [];
      await warmChatMedia(c.messages);
      if (chat !== c) return;
      show();
    }
    else if (fresh) {
      // то, что ещё отправляется, остаётся в конце ленты
      const sending = c.messages.filter((m) => m.pending);
      const before = sign(c.messages.filter((m) => !m.pending));
      if (sign(fresh) !== before) { c.messages = [...fresh, ...sending]; rerenderChatBody(); }
    }
    if (fresh) saveChatCache(c);
  }

  function showDmScreen(peerId) { return openChat({ type: 'dm', peerId }); }
  function showGroupChatScreen(groupId, backFn) { return openChat({ type: 'group', groupId }, backFn); }
  function showMatchChatScreen(matchId, backFn) { return openChat({ type: 'match', matchId: String(matchId) }, backFn); }

  /* ═══════ ОБЩИЕ ФУНКЦИИ ═══════ */
  /* С кем воспоминание: «@автор + @друг, @друг» или «@автор + «Группа»».
     Имена сохраняются в самом воспоминании — подпись не меняется, даже если потом кто-то удалится из друзей */
  function postWithLabel(p) {
    const c = p && p.companions;
    if (!c) return '';
    const rest = c.group && c.group.name ? `«${c.group.name}»`
      : (c.users || []).map((u) => u.handle || u.name).filter(Boolean).join(', ');
    if (!rest) return '';
    return `${c.by || p.author || ''} + ${rest}`;
  }

  // Подпись с кнопками: отмеченного человека можно открыть, группу — посмотреть её участников
  function postWithHtml(p) {
    const c = p && p.companions;
    if (!postWithLabel(p)) return '';
    const myId = currentUser && String(currentUser.id);
    const person = (id, text) => id && String(id) !== myId
      ? `<button type="button" class="pw-link" data-post-person="${escapeHtml(id)}">${escapeHtml(text)}</button>`
      : escapeHtml(text);
    const rest = c.group && c.group.name
      ? `<button type="button" class="pw-link" data-post-group="${escapeHtml(c.group.id || '')}">«${escapeHtml(c.group.name)}»</button>`
      : (c.users || []).filter((u) => u.handle || u.name).map((u) => person(u.id, u.handle || u.name)).join(', ');
    return `${person(p.authorId, c.by || p.author || '')} + ${rest}`;
  }

  /* Воспоминание одно на всех: запись одна (и маркер на карте один), а в «Воспоминаниях» его видят автор
     и все отмеченные — друзья и участники отмеченной группы */
  function postIncludesMe(p) {
    const myId = currentUser && String(currentUser.id);
    if (!myId || !p) return false;
    if (String(p.authorId) === myId) return true;
    const c = p.companions;
    if (!c) return false;
    if ((c.users || []).some((u) => String(u.id) === myId)) return true;
    return !!(c.group && c.group.id && isGroupParticipant(groupById(c.group.id), currentUser.id));
  }
  function myPosts() { return posts.filter(postIncludesMe); }

  function postImages(p) {
    if (Array.isArray(p.images) && p.images.length) return p.images;
    if (p.image) return [p.image];
    return [];
  }

  function avatarCircleHtml(person, size = 40) {
    const letter = (person.name || '?').trim().charAt(0).toUpperCase() || '?';
    if (person.avatar) return `<span class="avatar" style="width:${size}px;height:${size}px;background-image:url('${safeUrl(person.avatar)}')"></span>`;
    return `<span class="avatar" style="width:${size}px;height:${size}px;background:linear-gradient(145deg, var(--you-2), var(--you-deep))">${escapeHtml(letter)}</span>`;
  }

  /* Шапка профиля с фото во всю ширину. Несколько фото листаются свайпом
     или нажатием на левую/правую половину, полоски сверху показывают, какое открыто. */
  function photoHeroHtml(photos, name, handle) {
    const many = photos.length > 1;
    return `
      <div class="photo-hero ${many ? 'is-many' : ''}" data-photo-hero>
        <div class="ph-track">${photos.map((ph, i) => `
          <div class="ph-slide"><img src="${safeUrl(ph.url)}" alt="" draggable="false" ${i ? 'loading="lazy"' : ''}></div>`).join('')}
        </div>
        ${many ? `<div class="ph-bars" aria-hidden="true">${photos.map((_, i) => `<span class="${i ? '' : 'is-on'}"></span>`).join('')}</div>` : ''}
        <div class="ph-caption">
          <div class="ph-name">${escapeHtml(name)}</div>
          <div class="ph-handle">${escapeHtml(handle)}</div>
        </div>
      </div>`;
  }

  function photoHeroStep(hero, delta) {
    const track = hero.querySelector('.ph-track');
    const n = track.children.length;
    const cur = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    const next = Math.max(0, Math.min(n - 1, cur + delta));
    if (next !== cur) track.scrollTo({ left: next * track.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  function profileAvatarHtml(size = 84) {
    if (profile.avatar) return `<span class="avatar-preview" style="width:${size}px;height:${size}px;background-image:url('${safeUrl(profile.avatar)}')"></span>`;
    const letter = (profile.name || '?').trim().charAt(0).toUpperCase() || '?';
    return `<span class="avatar-preview" style="width:${size}px;height:${size}px">${letter}</span>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  /* URL картинки для вставки в HTML-шаблон (src="…" или url('…')).
     Пропускает только data:image/…;base64 и https-ссылки, остальное — пустая строка. */
  function safeUrl(u) {
    const s = String(u || '').trim();
    if (/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i.test(s)) return s;
    if (/^https:\/\/[^\s"'()<>\\]+$/i.test(s)) return s;
    return '';
  }
  function normalizeUsernameInput(raw) { return String(raw).trim().replace(/^@+/, '').toLowerCase(); }
  function isValidUsernameInput(u) { return /^[a-zA-Z][a-zA-Z0-9_.]{2,19}$/.test(u); }

    match_vote:        `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M5 3h14v12H5zM8 7h8v2H8zm0 3h5v2H8zM3 17h18v4H3z"/></svg>`,
    match_vote_result: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
    group:   `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>`,
  };
  // Значки уведомлений — оттенки одного спектра; match — весь спектр целиком
  const NOTIF_COLOR = {
    message: 'linear-gradient(145deg, var(--c1), var(--c3))',
    geo:     'linear-gradient(145deg, var(--c1), var(--c2))',
    system:  'linear-gradient(145deg, #3A3A44, #16161B)',
    group:   'linear-gradient(145deg, var(--c2), var(--c3))',
    friend_request: 'linear-gradient(145deg, var(--c1), var(--c2))',
    friend_accept:  'linear-gradient(145deg, var(--c1), #23C48E)',
    group_match:        'var(--prism)',
    group_match_accept: 'linear-gradient(145deg, var(--c3), var(--c4))',
    match_vote:         'linear-gradient(145deg, var(--c1), var(--c3))',
    match_vote_result:  'linear-gradient(145deg, var(--c2), var(--c4))',
  };
  function friendRequestActionsHtml(n) {
    if (n.type !== 'friend_request' || !n.requestId) return '';
    const outcome = friendRequestOutcome.get(n.requestId);
    if (outcome === 'accepted') return `<div class="notif-status">Вы приняли запрос</div>`;
    if (outcome === 'declined') return `<div class="notif-status">Запрос отклонён</div>`;
    if (!pendingIncomingRequests.has(n.requestId)) return `<div class="notif-status">Запрос уже обработан</div>`;
    const id = escapeHtml(n.requestId);
    return `<div class="notif-actions">
      <button class="btn btn-primary" type="button" data-fr-accept="${id}">Принять</button>
      <button class="btn" type="button" data-fr-decline="${id}">Отклонить</button>
    </div>`;
  }
  // Приглашение в группу: уведомление типа «group» с номером приглашения
  function groupInviteActionsHtml(n) {
    if (n.type !== 'group' || !n.requestId) return '';
    const outcome = groupInviteOutcome.get(n.requestId);
    if (outcome === 'accepted') return `<div class="notif-status">Вы вступили в группу</div>`;
    if (outcome === 'declined') return `<div class="notif-status">Приглашение отклонено</div>`;
    if (!pendingIncomingInvite(n.requestId)) return `<div class="notif-status">Приглашение уже обработано</div>`;
    const id = escapeHtml(n.requestId);
    return `<div class="notif-actions">
      <button class="btn btn-primary" type="button" data-gi-accept="${id}">Вступить</button>
      <button class="btn" type="button" data-gi-decline="${id}">Отклонить</button>
    </div>`;
  }
  function groupMatchActionsHtml(n) {
    if (!n.requestId || n.type === 'group') return '';
    const live = groupMatches.find((x) => x.id === n.requestId && x.status === 'accepted');
    const openBtn = `<div class="notif-actions"><button class="btn btn-primary" type="button" data-open-match-chat="${escapeHtml(n.requestId)}">Открыть чат</button></div>`;
    // Голосование и match: кнопка чата — только пока союз жив (распавшийся чат удалён)
    if (n.type === 'match_vote' || n.type === 'match_vote_result' || n.type === 'group_match_accept') return live ? openBtn : '';
    if (n.type !== 'group_match') return '';
    const outcome = groupMatchOutcome.get(n.requestId);
    if (outcome === 'accepted') return `<div class="notif-actions"><button class="btn btn-primary" type="button" data-open-match-chat="${escapeHtml(n.requestId)}">Открыть чат</button></div>`;
    if (outcome === 'declined') return `<div class="notif-status">Запрос отклонён</div>`;
    const m = groupMatches.find((x) => x.id === n.requestId);
    if (m && m.status === 'accepted') return `<div class="notif-actions"><button class="btn btn-primary" type="button" data-open-match-chat="${escapeHtml(m.id)}">Открыть чат</button></div>`;
    if (!pendingIncomingMatch(n.requestId)) return `<div class="notif-status">Запрос уже обработан</div>`;
    return matchResponseButtonsHtml(m);
  }
  function notifIconHtml(type) {
    const svg = NOTIF_ICON[type] || NOTIF_ICON.system;
    const bg = NOTIF_COLOR[type] || NOTIF_COLOR.system;
    return `<span class="notif-icon" style="background:${bg}">${svg}</span>`;
  }
  function unreadCount() { return notifications.filter((n) => !n.read).length; }
  function updateBadge() {
    const badge = document.getElementById('notif-badge'); if (!badge) return;
    const n = unreadCount();
    if (n > 0) { badge.textContent = n > 99 ? '99+' : String(n); badge.hidden = false; } else { badge.hidden = true; }
  }

  /* ═══════ НАВИГАЦИЯ ═══════ */
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dock = document.getElementById('dock');
  const items = [...dock.querySelectorAll('.dock-item')];
  const win = document.getElementById('window');
  const winTitle = document.getElementById('win-title');
  const winBody = document.getElementById('win-body');
  let openApp = null, closeTimer = null;
  let currentBackHandler = null;
  let placesView = (() => { try { return localStorage.getItem('places.view.v1') === 'grid' ? 'grid' : 'feed'; } catch { return 'feed'; } })();
  let avatarStageCleanup = null;
  let userProfileAvatarCleanup = null;

  function savePlacesView(v) { try { localStorage.setItem('places.view.v1', v); } catch {} }

  /* ── Движение между экранами ──
     navDir — откуда пришли: вперёд (новый экран выезжает справа) или назад (слева). */
  let navDir = 'fwd';
  let screenAnimTimer = null;
  const SCREEN_ANIM = ['scr-fwd', 'scr-back', 'scr-open', 'scr-fade'];
  /* Обновление открытого экрана «на месте» — когда пришли новые данные (ответ сервера, realtime),
     а человек никуда не переходил. Без анимации смены экрана и без сброса прокрутки: иначе экран
     мигает на каждое событие. Переходы между экранами по-прежнему анимируются. */
  let quietRender = false;
  function quietly(fn) {
    const top = winBody.scrollTop;
    winBody.classList.remove(...SCREEN_ANIM);
    quietRender = true;
    try { fn(); } finally { quietRender = false; }
    winBody.scrollTop = top;
  }
  function animateScreen(kind) {
    if (reduceMotion || quietRender) return;
    winBody.classList.remove('scr-fwd', 'scr-back', 'scr-open', 'scr-fade');
    void winBody.offsetWidth;   // перезапуск анимации, если класс тот же
    winBody.classList.add('scr-' + kind);
    clearTimeout(screenAnimTimer);
    // снимаем класс, чтобы перерисовки по realtime не анимировались заново
    screenAnimTimer = setTimeout(() => winBody.classList.remove('scr-fwd', 'scr-back', 'scr-open', 'scr-fade'), 700);
  }
  // По краю окна пробегает спектр — при открытии окна и смене вкладки
  let sweepTimer = null;
  function playWindowSweep() {
    if (reduceMotion || quietRender) return;
    win.classList.remove('sweep');
    void win.offsetWidth;
    win.classList.add('sweep');
    clearTimeout(sweepTimer);
    sweepTimer = setTimeout(() => win.classList.remove('sweep'), 1500);
  }
  function setScreen(renderFn, backFn) {
    currentBackHandler = (typeof backFn === 'function') ? backFn : null;
    renderFn();
    animateScreen(navDir === 'back' ? 'back' : 'fwd');
  }
  function goBack() {
    if (typeof currentBackHandler === 'function') {
      const b = currentBackHandler;
      currentBackHandler = null;
      navDir = 'back';
      try { b(); } finally { navDir = 'fwd'; }
    } else closeApp();
  }
  function resetScreenStack() { currentBackHandler = null; }
  function setDots() {
    items.forEach((li) => { li.dataset.open = String(li.querySelector('.dock-btn').dataset.app === openApp); });
    const nBtn = document.getElementById('notif-btn'); if (nBtn) nBtn.classList.toggle('is-active', openApp === 'notifications');
    const sBtn = document.getElementById('settings-btn'); if (sBtn) sBtn.classList.toggle('is-active', openApp === 'settings');
    const fBtn = document.getElementById('filter-btn'); if (fBtn) fBtn.classList.toggle('is-active', openApp === 'filters');
    moveDockPill();
  }

  /* ── «Жидкая» капсула вкладок ──
     Передний край догоняет новую вкладку быстрее заднего: на ходу капсула вытягивается,
     а у цели сжимается обратно с лёгкой пружиной — как капля. */
  const dockPill = dock.querySelector('.dock-pill');
  let dockPillLeft = null;
  function moveDockPill() {
    if (!dockPill) return;
    const li = items.find((x) => x.dataset.open === 'true');
    if (!li || !li.offsetWidth) { dockPill.classList.add('is-hidden'); return; }
    const left = li.offsetLeft;
    const right = dock.clientWidth - li.offsetLeft - li.offsetWidth;
    if (dockPillLeft !== null && left !== dockPillLeft) {
      const toRight = left > dockPillLeft;
      const lead = 'cubic-bezier(.3, 1.35, .5, 1)', trail = 'cubic-bezier(.6, 0, .2, 1)';
      dockPill.style.setProperty('--tl', toRight ? '.5s' : '.34s');
      dockPill.style.setProperty('--tr', toRight ? '.34s' : '.5s');
      dockPill.style.setProperty('--el', toRight ? trail : lead);
      dockPill.style.setProperty('--er', toRight ? lead : trail);
    }
    dockPill.style.left = left + 'px';
    dockPill.style.right = right + 'px';
    dockPill.classList.remove('is-hidden');
    if (dockPillLeft === null) requestAnimationFrame(() => requestAnimationFrame(() => dockPill.classList.add('is-ready')));
    dockPillLeft = left;
  }
  addEventListener('resize', () => {
    if (!dockPill) return;
    dockPill.classList.remove('is-ready');
    dockPillLeft = null;
    moveDockPill();
  });

  /* ── Всплеск при нажатии: из точки касания расходится тонкое спектральное кольцо ── */
  const tapLayer = document.createElement('div');
  tapLayer.className = 'tap-layer';
  tapLayer.setAttribute('aria-hidden', 'true');
  document.body.appendChild(tapLayer);
  const TAP_TARGETS = 'button, a[href], [role="button"], [data-action], .row, .person-card, .chat-row, .seg-opt, .switch, .user-avatar-wrap, .wish-cloud, .wish-place, .map-group-chip, .grid-cell, .pg-item';
  document.addEventListener('pointerdown', (e) => {
    if (reduceMotion || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const t = e.target.closest && e.target.closest(TAP_TARGETS);
    if (!t || t.disabled) return;
    const ring = document.createElement('span');
    ring.className = 'tap-ring';
    ring.style.left = e.clientX + 'px';
    ring.style.top = e.clientY + 'px';
    tapLayer.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove(), { once: true });
    setTimeout(() => ring.remove(), 1200);   // на случай, если анимация не запустилась
  }, { passive: true, capture: true });

  /* ── Заголовок окна «расшифровывается»: буквы перебираются и встают на место ──
     Перебор рисуется поверх (::after по data-scramble) — сам текст заголовка не меняется,
     поэтому проверки вида winTitle.textContent === '…' продолжают работать. */
  const SCRAMBLE_CHARS = 'абвгдежзиклмнопрстуфхцчшэюя0123456789';
  let scrambleRaf = 0, scrambleLast = '';
  function scrambleTitle() {
    const target = winTitle.textContent;
    if (reduceMotion || target === scrambleLast || win.hidden) { scrambleLast = target; return; }
    scrambleLast = target;
    cancelAnimationFrame(scrambleRaf);
    const start = performance.now(), dur = 360 + Math.min(240, target.length * 14);
    winTitle.classList.add('is-scrambling');
    const step = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const fixed = Math.floor(t * t * target.length);
      let s = target.slice(0, fixed);
      for (let i = fixed; i < target.length; i++) {
        s += /\s/.test(target[i]) ? target[i] : SCRAMBLE_CHARS[(Math.random() * SCRAMBLE_CHARS.length) | 0];
      }
      winTitle.dataset.scramble = s;
      if (t < 1) scrambleRaf = requestAnimationFrame(step);
      else { winTitle.classList.remove('is-scrambling'); delete winTitle.dataset.scramble; }
    };
    scrambleRaf = requestAnimationFrame(step);
  }
  new MutationObserver(scrambleTitle).observe(winTitle, { childList: true, characterData: true, subtree: true });

  // Интерфейс «съезжается» к краям — после входа и при запуске с уже открытой сессией
  function playChromeEnter() {
    if (reduceMotion) return;
    document.body.classList.remove('chrome-enter');
    void document.body.offsetWidth;
    document.body.classList.add('chrome-enter');
    setTimeout(() => document.body.classList.remove('chrome-enter'), 1600);
  }

  function showMapApp() {
    leaveChat();
    clearTimeout(closeTimer); closePostMenus();
    win.querySelectorAll(':scope > .modal-backdrop').forEach((el) => el.remove());   // незакрытые окна подтверждения
    if (avatarStageCleanup) { avatarStageCleanup(); avatarStageCleanup = null; }
    if (userProfileAvatarCleanup) { userProfileAvatarCleanup(); userProfileAvatarCleanup = null; }
    winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
    win.classList.remove('is-open', 'sweep');
    closeTimer = setTimeout(() => { win.hidden = true; }, reduceMotion ? 0 : 300);
    resetScreenStack();
    openApp = 'map';
    document.body.classList.remove('app-window');
    document.body.classList.add('app-map');
    setDots();
    if (map2gis && typeof map2gis.invalidateSize === 'function') requestAnimationFrame(() => { try { map2gis.invalidateSize(); } catch {} });
  }

  function showApp(id, fromBtn) {
    if (id === 'map') { showMapApp(); return; }
    if (id === 'messenger') { showMessengerScreen(); return; }
    const app = APPS[id]; if (!app) return;
    leaveChat();
    clearTimeout(closeTimer); closePostMenus();
    if (avatarStageCleanup) { avatarStageCleanup(); avatarStageCleanup = null; }
    if (userProfileAvatarCleanup) { userProfileAvatarCleanup(); userProfileAvatarCleanup = null; }
    winBody.style.display = ''; winBody.style.flexDirection = ''; winBody.style.padding = '';
    winTitle.textContent = app.title;
    winBody.innerHTML = app.render();
    winBody.scrollTop = 0;
    win.hidden = false;
    const wr = win.getBoundingClientRect();
    const br = fromBtn ? fromBtn.getBoundingClientRect() : null;
    const ox = br ? br.left + br.width / 2 - wr.left : wr.width / 2;
    // окно растёт из нажатой кнопки: по горизонтали — от неё, по вертикали — снизу (из панели) или сверху
    const oy = br ? (br.top > wr.top + wr.height / 2 ? wr.height + 60 : -40) : wr.height + 60;
    win.style.transformOrigin = `${ox}px ${oy}px`;
    requestAnimationFrame(() => win.classList.add('is-open'));
    animateScreen(navDir === 'back' ? 'back' : 'open');
    if (navDir !== 'back') playWindowSweep();
    resetScreenStack();
    openApp = id;
    document.body.classList.remove('app-map');
    document.body.classList.add('app-window');
    setDots();
    win.focus({ preventScroll: true });
    if (id === 'settings') syncSettingsUi();
    if (id === 'filters') syncFiltersUi();
    if (id === 'profile') ensureMyPhotos();
    if (id === 'groups') bindGroupSwipe();
    if (id === 'friends') friendsListShown = APPS.friends.render();
    if (id === 'notifications') notifListShown = APPS.notifications.render();
    if (id === 'notifications' && currentUser) {
      supabaseClient.from('notifications').update({ read: true }).eq('user_id', currentUser.id).eq('read', false)
        .then(() => { notifications = notifications.map((n) => ({ ...n, read: true })); updateBadge(); });
    }
  }

  function closeApp() { showMapApp(); }

  // Подписи и счётчик на экране фильтров
  function syncFiltersUi() {
    if (openApp !== 'filters') return;
    const f = mapFilters;
    const q = (s) => winBody.querySelector(s);
    const ageEl = q('#flt-age');
    if (!ageEl) return;
    q('#flt-age-block').classList.toggle('is-off', !f.ageOn);
    q('#flt-age-sub').textContent = f.ageOn ? 'Средний возраст группы' : 'Любой';
    q('#flt-age-val').innerHTML = `${f.spread ? `${f.age - f.spread}–${f.age + f.spread}` : f.age}<small>лет</small>`;
    // заливка дорожки ползунка — до бегунка
    ageEl.style.setProperty('--p', ((f.age - ageEl.min) / (ageEl.max - ageEl.min) * 100).toFixed(1) + '%');
    winBody.querySelectorAll('[data-flt-spread]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.fltSpread) === f.spread)));
    winBody.querySelectorAll('[data-flt-comp]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.fltComp === f.comp)));
    const myId = currentUser && currentUser.id;
    const others = groups.filter((g) => !isGroupParticipant(g, myId) && !groupHiddenForMe(g));
    const passed = others.filter(groupPassesFilters).length;
    q('#flt-count').textContent = others.length
      ? `Подходит ${passed} из ${others.length}`
      : 'Других групп пока нет';
  }

  // Уведомления обновляются на месте: без сброса прокрутки и только если список действительно изменился
  let notifListShown = '';
  function refreshNotifications() {
    updateBadge();
    if (openApp !== 'notifications' || win.hidden) return;
    const html = APPS.notifications.render();
    if (html === notifListShown) return;
    winBody.classList.remove(...SCREEN_ANIM);
    notifListShown = html;
    winBody.innerHTML = html;
  }

  function showPlacesScreen() {
    if (openApp !== 'profile') showApp('profile');
    setScreen(() => {
      closePostMenus();
      if (avatarStageCleanup) { avatarStageCleanup(); avatarStageCleanup = null; }
      if (userProfileAvatarCleanup) { userProfileAvatarCleanup(); userProfileAvatarCleanup = null; }
      winTitle.textContent = 'Воспоминания';
      winBody.scrollTop = 0;
      winBody.innerHTML = renderPlaces();
      bindCarousels();
    }, () => showApp('profile'));
  }

  function renderPlaces() {
    const isGrid = placesView === 'grid';
    return `
      <div class="places-toolbar">
        <div class="view-toggle" role="group">
          <button class="view-btn" type="button" data-view="grid" aria-pressed="${isGrid}"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg></button>
          <button class="view-btn" type="button" data-view="feed" aria-pressed="${!isGrid}"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 5h16v2H4V5zm0 6h16v2H4v-2zm0 6h16v2H4v-2z"/></svg></button>
        </div>
        <span class="places-spacer"></span>
        <button class="view-btn" type="button" data-action="new-post"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></button>
      </div>
      ${isGrid ? renderGrid() : renderFeed()}`;
  }

  function renderFeed(list = myPosts()) {
    if (!list.length) return placesEmptyHtml();
    return `<div class="feed">${list.map((p) => {
      const imgs = postImages(p);
      const multi = imgs.length > 1;
      const mediaHtml = multi
        ? `<div class="post-carousel" data-carousel><div class="slides">${imgs.map((src) => `<div class="slide"><img src="${safeUrl(src)}" loading="lazy"></div>`).join('')}</div>
            <span class="counter"><span data-idx>1</span>/${imgs.length}</span>
            <div class="dots">${imgs.map((_, i) => `<button class="dot ${i === 0 ? 'active' : ''}" type="button"></button>`).join('')}</div></div>`
        : `<img class="post-media" src="${safeUrl(imgs[0])}" loading="lazy">`;
      const isMine = p.authorId === (currentUser && currentUser.id);
      return `<article class="post" data-post-id="${escapeHtml(p.id)}">
        <header class="post-head">
          <span class="avatar" style="background:linear-gradient(145deg, var(--you-2), var(--you-deep))">${escapeHtml((p.author || '?').trim().charAt(0).toUpperCase() || '?')}</span>
          <div class="row-main">
            <div class="post-author ${postWithLabel(p) ? 'is-with' : ''}">${postWithHtml(p) || escapeHtml(p.author || '')}</div>
            <div class="post-place">📍 ${escapeHtml(p.place || '')}</div>
          </div>
          <span class="row-time">${escapeHtml(p.time || '')}</span>
          ${isMine ? `<button type="button" class="post-menu-btn" data-post-menu="${escapeHtml(p.id)}"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg></button>` : ''}
        </header>
        ${mediaHtml}
        ${p.caption ? `<div class="post-body"><div class="post-caption">${escapeHtml(p.caption)}</div></div>` : ''}
      </article>`;
    }).join('')}</div>`;
  }

  function renderGrid(list = myPosts()) {
    if (!list.length) return placesEmptyHtml();
    return `<div class="grid">${list.map((p) => {
      const imgs = postImages(p);
      const badge = imgs.length > 1 ? `<span class="cell-multi">${imgs.length}</span>` : '';
      return `<div class="grid-cell" data-post-id="${escapeHtml(p.id)}" role="button" tabindex="0">
        <img src="${safeUrl(imgs[0])}" loading="lazy">${badge}
        ${p.caption ? `<span class="cell-caption">${escapeHtml(p.caption)}</span>` : ''}
      </div>`;
    }).join('')}</div>`;

  function bindCarousels() {
    winBody.querySelectorAll('[data-carousel]').forEach((el) => {
      const slides = el.querySelector('.slides'); if (!slides) return;
      const dots = [...el.querySelectorAll('.dot')];
      const counter = el.querySelector('[data-idx]');
      const currentIndex = () => Math.max(0, Math.round(slides.scrollLeft / (slides.clientWidth || 1)));
      const goTo = (i) => slides.scrollTo({ left: i * slides.clientWidth, behavior: 'smooth' });
      const update = () => {
        const i = currentIndex();
        dots.forEach((d, k) => d.classList.toggle('active', k === i));
        if (counter) counter.textContent = String(i + 1);
      };
      slides.addEventListener('scroll', update, { passive: true });
      dots.forEach((d, i) => d.addEventListener('click', () => goTo(i)));
      update();
    });
  }

  function closePostMenus() { winBody.querySelectorAll('.popover').forEach((el) => el.remove()); }

  function openPostMenu(postId, anchorEl) {
    closePostMenus();
    const pop = document.createElement('div'); pop.className = 'popover';
    pop.innerHTML = `
      <button class="pop-item" type="button" data-show-on-map="${escapeHtml(postId)}">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>

    winBody.appendChild(pop);
    const bodyRect = winBody.getBoundingClientRect();
    const aRect = anchorEl.getBoundingClientRect();

  function confirmModal({ title, text, confirmLabel = 'Удалить', cancelLabel = 'Отмена' }) {
    return new Promise((resolve) => {
      const back = document.createElement('div'); back.className = 'modal-backdrop';
      back.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <h3 class="modal-title">${escapeHtml(title)}</h3>
          <p class="modal-text">${escapeHtml(text)}</p>
          <div class="modal-actions">
            <button type="button" class="btn" data-cancel>${escapeHtml(cancelLabel)}</button>
            <button type="button" class="btn btn-danger" data-confirm>${escapeHtml(confirmLabel)}</button>
          </div>
        </div>`;
      // поверх всего окна, а не внутри прокрутки — иначе на длинном экране окно уезжает из виду
      win.appendChild(back);
      const cleanup = () => back.remove();
      back.querySelector('[data-cancel]').addEventListener('click', () => { cleanup(); resolve(false); });
      back.querySelector('[data-confirm]').addEventListener('click', () => { cleanup(); resolve(true); });
      back.addEventListener('click', (e) => { if (e.target === back) { cleanup(); resolve(false); } });
      back.querySelector('[data-confirm]').focus();
    });
  }

  // Окно с полем ввода: возвращает текст или null, если отменили
  function promptModal({ title, text = '', value = '', placeholder = '', maxLength = 120, confirmLabel = 'Сохранить' }) {
    return new Promise((resolve) => {
      const back = document.createElement('div'); back.className = 'modal-backdrop';
      back.innerHTML = `
        <form class="modal" role="dialog" aria-modal="true" novalidate>
          <h3 class="modal-title">${escapeHtml(title)}</h3>
          ${text ? `<p class="modal-text">${escapeHtml(text)}</p>` : ''}
          <label class="prompt-field">
            <textarea class="edit-textarea" maxlength="${maxLength}" rows="3" placeholder="${escapeHtml(placeholder)}">${escapeHtml(value)}</textarea>
            <span class="prompt-count"></span>
          </label>
          <div class="modal-actions">
            <button type="button" class="btn" data-cancel>Отмена</button>
            <button type="submit" class="btn btn-primary">${escapeHtml(confirmLabel)}</button>
          </div>
        </form>`;
      win.appendChild(back);
      const form = back.querySelector('form');
      const ta = back.querySelector('textarea');
      const count = back.querySelector('.prompt-count');
      const syncCount = () => { count.textContent = `${ta.value.length} / ${maxLength}`; };
      const done = (v) => { back.remove(); resolve(v); };
      syncCount();
      ta.addEventListener('input', syncCount);
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); done(null); }
        else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
      });
      back.querySelector('[data-cancel]').addEventListener('click', () => done(null));
      back.addEventListener('click', (e) => { if (e.target === back) done(null); });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const v = ta.value.trim();
        if (!v) { ta.focus(); return; }
        done(v);
      });
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    });
  }

      });

  function fileToCompressedDataURL(file, maxSide = 1280, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error);
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('image decode error'));
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* Сцена редактора: аватар можно крутить пальцем или мышью, кнопка с лупой — крупный план лица */
  function setupAvatarStage(canvas) {
    if (avatarStageCleanup) { avatarStageCleanup(); avatarStageCleanup = null; }
    if (!isThreeAvailable()) { canvas.style.display = 'none'; return; }
    const THREE = window.THREE;
    const renderer = makeAvatarRenderer(THREE, canvas, false);
    const size = () => [canvas.clientWidth || 480, canvas.clientHeight || 300];
    let [w, h] = size();
    renderer.setSize(w, h, false);
    const av = createAvatarScene(THREE, avatarConfig, { aspect: w / h, renderer });
    let yaw = 0.2, drag = null, raf = null;
    const onDown = (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      drag = { x: e.clientX, yaw };
      if (canvas.parentElement) canvas.parentElement.classList.add('is-touched');
      try { canvas.setPointerCapture(e.pointerId); } catch {}
    };
    const onMove = (e) => { if (drag) yaw = drag.yaw + (e.clientX - drag.x) * 0.012; };
    const onUp = () => { drag = null; };
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    function tick(now) {
      av.animate(now / 1000, yaw, drag ? 0.25 : 1);
      renderer.render(av.scene, av.camera);
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    function onResize() {
      [w, h] = size();
      renderer.setSize(w, h, false);
      av.resize(w / h);
    }
    window.addEventListener('resize', onResize);
    canvas.__avatarRefresh = () => av.setConfig(avatarConfig);
    canvas.__avatarZoom = () => { av.setFraming(av.framing === 'bust' ? 'full' : 'bust'); return av.framing === 'bust'; };
    avatarStageCleanup = () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      av.dispose();
      try { renderer.dispose(); renderer.forceContextLoss(); } catch {}
    };
  }
