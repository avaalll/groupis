  // Куда встаёт окно подтверждения: в открытое окно раздела, а на ленте (окно закрыто) — поверх всего экрана
  function modalHost() { return win.hidden || !win.classList.contains('is-open') ? document.body : win; }

  // tone: 'danger' — красная кнопка (удалить, выйти), 'primary' — обычное действие (открыть, подробнее)
  function confirmModal({ title, text, confirmLabel = 'Удалить', cancelLabel = 'Отмена', tone = 'danger' }) {
    return new Promise((resolve) => {
      const back = document.createElement('div'); back.className = 'modal-backdrop';
      back.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <h3 class="modal-title">${escapeHtml(title)}</h3>
          <p class="modal-text">${escapeHtml(text)}</p>
          <div class="modal-actions">
            <button type="button" class="btn" data-cancel>${escapeHtml(cancelLabel)}</button>
            <button type="button" class="btn ${tone === 'primary' ? 'btn-primary' : 'btn-danger'}" data-confirm>${escapeHtml(confirmLabel)}</button>
          </div>
        </div>`;
      // поверх всего окна, а не внутри прокрутки — иначе на длинном экране окно уезжает из виду
      modalHost().appendChild(back);
      const cleanup = () => back.remove();
      back.querySelector('[data-cancel]').addEventListener('click', () => { cleanup(); resolve(false); });
      back.querySelector('[data-confirm]').addEventListener('click', () => { cleanup(); resolve(true); });
      back.addEventListener('click', (e) => { if (e.target === back) { cleanup(); resolve(false); } });
      back.querySelector('[data-confirm]').focus();
    });
  }

  // Окно-сообщение с одной кнопкой
  function noticeModal({ title, text, okLabel = 'Понятно' }) {
    return new Promise((resolve) => {
      const back = document.createElement('div'); back.className = 'modal-backdrop';
      back.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <h3 class="modal-title">${escapeHtml(title)}</h3>
          <p class="modal-text">${escapeHtml(text)}</p>
          <div class="modal-actions"><button type="button" class="btn btn-primary" data-ok>${escapeHtml(okLabel)}</button></div>
        </div>`;
      modalHost().appendChild(back);
      const done = () => { back.remove(); resolve(); };
      back.querySelector('[data-ok]').addEventListener('click', done);
      back.addEventListener('click', (e) => { if (e.target === back) done(); });
      back.querySelector('[data-ok]').focus();
    });
  }

  // Окно с полем ввода: возвращает текст или null, если отменили
  function promptModal({ title, text = '', value = '', placeholder = '', maxLength = 120, confirmLabel = 'Сохранить' }) {
    return new Promise((resolve) => {
      const back = document.createElement('div'); back.className = 'modal-backdrop';
      back.innerHTML = `
        <form class="modal" role="dialog" aria-modal="true" novalidate>
          <h3 class="modal-title">${escapeHtml(title)}</h3>
          ${text ? `<p class="modal-text">${escapeHtml(text)}</p>` : ''}
          <label class="prompt-field">
            <textarea class="edit-textarea" maxlength="${maxLength}" rows="3" placeholder="${escapeHtml(placeholder)}">${escapeHtml(value)}</textarea>
            <span class="prompt-count"></span>
          </label>
          <div class="modal-actions">
            <button type="button" class="btn" data-cancel>Отмена</button>
            <button type="submit" class="btn btn-primary">${escapeHtml(confirmLabel)}</button>
          </div>
        </form>`;
      modalHost().appendChild(back);
      const form = back.querySelector('form');
      const ta = back.querySelector('textarea');
      const count = back.querySelector('.prompt-count');
      const syncCount = () => { count.textContent = `${ta.value.length} / ${maxLength}`; };
      const done = (v) => { back.remove(); resolve(v); };
      syncCount();
      ta.addEventListener('input', syncCount);
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); done(null); }
        else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
      });
      back.querySelector('[data-cancel]').addEventListener('click', () => done(null));
      back.addEventListener('click', (e) => { if (e.target === back) done(null); });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const v = ta.value.trim();
        if (!v) { ta.focus(); return; }
        done(v);
      });
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    });
  }

      // С кем воспоминание: несколько друзей или одна группа (необязательно)

        withList.hidden = !withMode;

        await loadPostsFromDB();
        showPlacesScreen();
      });
    }, () => showPlacesScreen());
  }

  function fileToCompressedDataURL(file, maxSide = 1280, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error);
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('image decode error'));
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function saveMyAvatar(thumb) {

  // Миниатюра для чатов и списков — выбранная область главного фото
  async function syncMyAvatar() {
    const main = myPhotos && myPhotos[0];
    await saveMyAvatar(main ? await cropThumbDataUrl(main.url, main.crop) : '');
  }

  async function addMyPhotos(files) {
    if (myPhotos === null && !profilePhotosMissing) await reloadMyPhotos();
    const room = PHOTOS_LIMIT - photosOrAvatar(myPhotos, profile.avatar).length;
    if (room <= 0) return;
    // каждое фото: сжать и выбрать область; отменённое в окне выбора не добавляется
    const picked = files.slice(0, room);
    const items = [];
    for (let i = 0; i < picked.length; i++) {
      const data = await fileToCompressedDataURL(picked[i], PHOTO_MAX_SIDE, PHOTO_QUALITY);
      const crop = await openPhotoCropper(data, {
        title: picked.length > 1 ? `Область фото · ${i + 1} из ${picked.length}` : 'Область фото',
        done: i < picked.length - 1 ? 'Дальше' : 'Готово',
      });
      if (crop) items.push({ data, crop });
    }
    if (!items.length) return;
    if (profilePhotosMissing) {
      // таблицы фото нет — как раньше, одно фото в profiles.avatar
      const last = items[items.length - 1];
      await saveMyAvatar(await cropThumbDataUrl(last.data, last.crop));
      alert('Сохранено одно фото. Чтобы добавлять несколько, выполните supabase_profile_photos.sql в Supabase.');
      return;
    }
    // старое единственное фото (из profiles.avatar) сначала переносим в галерею, чтобы оно не пропало
    if ((!myPhotos || !myPhotos.length) && profile.avatar) items.unshift({ data: profile.avatar, crop: null });
    // по одному — created_at идут по порядку, последнее выбранное фото станет главным
    for (const it of items) {
      const { error } = await insertProfilePhoto(currentUser.id, it.data, it.crop);
      if (error) {
        if (isMissingTableError(error)) {
          profilePhotosMissing = true;
          const last = items[items.length - 1];
          await saveMyAvatar(await cropThumbDataUrl(last.data, last.crop));
          return;
        }
        throw error;
      }
    }
    await reloadMyPhotos();
    await syncMyAvatar();
  }

  async function deleteMyPhoto(id) {
    if (!id) { await saveMyAvatar(''); return; }   // старое единственное фото из profiles.avatar
    const { error } = await supabaseClient.from('profile_photos').delete().eq('id', id);
    if (error) throw error;
    if (myPhotos) myPhotos = myPhotos.filter((ph) => ph.id !== id);
    await reloadMyPhotos();
    await syncMyAvatar();
  }

  async function makeMyPhotoMain(id) {
    // «главное» = самое свежее; берём время позже текущего главного, даже если часы устройства отстают
    const newest = myPhotos && myPhotos[0] && Date.parse(myPhotos[0].at);
    const at = new Date(Math.max(Date.now(), (newest || 0) + 1000)).toISOString();
    const { error } = await supabaseClient.from('profile_photos').update({ created_at: at }).eq('id', id);
    if (error) throw error;
    await reloadMyPhotos();
    await syncMyAvatar();
  }

  /* ── Что прислали в чат: вкладки «Медиа» (фото и видео), «Ссылки» и «Файлы» ──
     Как в Telegram: в профиле собеседника (личный чат), в карточке группы (чат группы) и в карточке союза
     (совместный чат двух групп). Видны только те вкладки, для которых в переписке что-то есть; первая вкладка —
     своя у каждого экрана: «Участники» у группы и союза (у собеседника первой вкладки нет). Ничего такого не присылали —
     экран выглядит по-прежнему. Сообщения, удалённые «у себя», и переписку до «Удалить чат» сюда не берём —
     как и в самом чате. */
  const SHARED_MAX = 400;   // сколько сообщений каждого вида просим у сервера
  const LINK_RE = /(?:https?:\/\/|www\.)[^\s<>"'`]+/gi;
  let sharedMediaWatch = null;   // следит, какие плитки «Медиа» попали на экран (файлы подгружаются только для них)
  let sharedLive = null;         // открытый экран с вкладками: присланное в этот чат появляется на нём сразу
  let sharedSeq = 0;             // метка каждого показа такого экрана (data-pm)

  /* Ссылки в тексте сообщения — все вхождения по порядку, с местом в тексте: только http и https; знаки препинания
     и «лишняя» скобка после ссылки — не её часть */
  function scanLinks(text) {
    const s = String(text || ''), out = [];
    const count = (x, ch) => x.split(ch).length - 1;
    for (const found of s.matchAll(LINK_RE)) {
      let raw = found[0];
      for (let prev = ''; prev !== raw;) {
        prev = raw;
        raw = raw.replace(/[.,;:!?…»”]+$/, '');
        if (raw.endsWith(')') && count(raw, ')') > count(raw, '(')) raw = raw.slice(0, -1);
      }
      let url;
      try { url = new URL(/^www\./i.test(raw) ? 'https://' + raw : raw); } catch { continue; }
      if ((url.protocol !== 'http:' && url.protocol !== 'https:') || !url.hostname.includes('.')) continue;
      // имя сайта — настоящее, из разобранного адреса (в «https://bank.ru@evil.example» сайт — evil.example);
      // у адресов кириллицей оно превращается в «xn--…» — тогда показываем так, как написали
      let host = url.hostname.replace(/^www\./, '');
      if (host.includes('xn--')) {
        const typed = ((/^(?:https?:\/\/)?(?:[^/?#@]*@)?(?:www\.)?([^/?#:]+)/i.exec(raw) || [])[1] || '').toLowerCase();
        try { if (new URL('https://' + typed).hostname === host) host = typed; } catch {}
      }
      out.push({ start: found.index, end: found.index + raw.length, raw, href: url.href, host });
    }
    return out;
  }
  // Разные ссылки сообщения — для вкладки «Ссылки»
  function linksInText(text) {
    const out = [], seen = new Set();
    for (const l of scanLinks(text)) {
      if (seen.has(l.href)) continue;
      seen.add(l.href);
      out.push({ href: l.href, text: l.raw, host: l.host });
    }
    return out;
  }
  // Текст сообщения в HTML: ссылки в нём — настоящие ссылки (открываются в новой вкладке), остальное экранировано
  function linkifyHtml(text) {
    const s = String(text || '');
    let html = '', at = 0;
    for (const l of scanLinks(s)) {
      html += escapeHtml(s.slice(at, l.start))
        + `<a class="chat-link" href="${escapeHtml(l.href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.raw)}</a>`;
      at = l.end;
    }
    return html + escapeHtml(s.slice(at));
  }

  // Сообщения чата spec ({ type, peerId | groupId | matchId }) → { media, links, files }, свежие первыми
  function sharedFromMessages(list, spec) {
    const cleared = chatClearedAt(chatKey(spec));
    const seen = new Set(), media = [], links = [], files = [];
    for (const m of [...list].sort((a, b) => msgTs(b) - msgTs(a))) {
      const id = String(m.id);
      if (seen.has(id) || m.pending || isHiddenMsg(spec.type, id) || msgTs(m) <= cleared) continue;
      seen.add(id);
      if ((m.kind === 'image' || m.kind === 'video') && m.mediaPath) media.push(m);
      else if (m.kind === 'file' && m.mediaPath) files.push(m);
      for (const link of linksInText(m.content)) links.push({ ...link, m });   // ссылка может быть и в подписи к фото
    }
    return { media, links, files };
  }

  /* Вся переписка на устройстве не лежит (только последние CHAT_KEEP сообщений), поэтому фото, видео, файлы
     и сообщения со ссылками спрашиваем у сервера отдельно — двумя запросами, чтобы сбой одного не оставил без другого.
     Ответ — { files, texts }; у запроса, который не удался, вместо списка null */
  async function loadSharedMessages(spec) {
    const none = { files: null, texts: null };
    if (!currentUser) return none;
    let table, norm, scope;
    if (spec.type === 'dm') {
      const peerId = String(spec.peerId);
      if (!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(peerId)) return none;
      const pair = `and(from_id.eq.${currentUser.id},to_id.eq.${peerId}),and(from_id.eq.${peerId},to_id.eq.${currentUser.id})`;
      [table, norm, scope] = ['dm_messages', normDmRow, (q) => q.or(pair)];
    } else if (spec.type === 'match') {
      if (!/^\d+$/.test(String(spec.matchId))) return none;
      [table, norm, scope] = ['match_messages', normMatchRow, (q) => q.eq('match_id', Number(spec.matchId))];
    } else {
      [table, norm, scope] = ['group_messages', normGroupRow, (q) => q.eq('group_id', String(spec.groupId))];
    }
    const ask = async (narrow) => {
      try {
        const { data, error } = await narrow(scope(supabaseClient.from(table).select('*')))
          .order('created_at', { ascending: false }).limit(SHARED_MAX);
        if (error) { console.warn('[shared media] load:', error.message); return null; }
        return (data || []).map(norm);
      } catch (err) { console.warn('[shared media] load:', err); return null; }
    };
    const [files, texts] = await Promise.all([
      ask((q) => q.in('kind', ['image', 'video', 'file'])),
      // грубый отбор «похоже на ссылку» — на сервере, точный разбор — в linksInText
      ask((q) => q.or('content.ilike.%http%,content.ilike.%www%')),
    ]);
    return { files, texts };
  }

  /* Ответ сервера поверх сообщений с устройства. В пределах своего ответа (последние SHARED_MAX сообщений
     каждого вида) решает сервер: чего там нет — то удалили «у всех» или убрали из текста ссылку, и из копии
     на устройстве оно в списки не попадает. Что старше ответа или запрос не удался — берём с устройства. */
  function mergeSharedMessages(local, remote) {
    const kept = (rows) => {
      if (!rows) return () => true;
      const ids = new Set(rows.map((m) => String(m.id)));
      const from = rows.length >= SHARED_MAX ? Math.min(...rows.map(msgTs)) : -Infinity;   // с какого времени ответ полон
      return (m) => ids.has(String(m.id)) || msgTs(m) < from;
    };
    const inFiles = kept(remote.files), inTexts = kept(remote.texts);
    const isFile = (m) => m.kind === 'image' || m.kind === 'video' || m.kind === 'file';
    // серверные идут первыми: у сообщения, которое есть и там, и там, берётся свежий текст
    return [...(remote.files || []), ...(remote.texts || []), ...local.filter((m) => (isFile(m) ? inFiles : inTexts)(m))];
  }

  function sharedMediaHtml(list) {
    if (!list.length) return '';
    const play = '<span class="pm-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.2 5.3a1 1 0 0 1 1.5-.86l10.2 6.7a1 1 0 0 1 0 1.72L9.7 19.56a1 1 0 0 1-1.5-.86V5.3z"/></svg></span>';
    return `<div class="pm-pane pm-grid" data-pm-pane="media" role="tabpanel" hidden>${list.map((m, i) => `
      <button type="button" class="pm-cell" data-pm-open="${i}" aria-label="${m.kind === 'video' ? 'Видео' : 'Фото'}, ${escapeHtml(fmtChatListTime(m.createdAt))}">${
        m.kind === 'video' ? `<video muted playsinline preload="metadata" tabindex="-1"></video>${play}` : '<img alt="" draggable="false" decoding="async">'
      }</button>`).join('')}</div>`;
  }
  function sharedLinksHtml(list, sender) {
    if (!list.length) return '';
    return `<div class="pm-pane pm-list" data-pm-pane="links" role="tabpanel" hidden>${list.map((l) => `
      <a class="pm-row" href="${escapeHtml(l.href)}" target="_blank" rel="noopener noreferrer">
        <span class="pm-ico pm-ico-link" aria-hidden="true">${escapeHtml((l.host.charAt(0) || '?').toUpperCase())}</span>
        <span class="pm-main">
          <span class="pm-title">${escapeHtml(l.host)}</span>
          <span class="pm-sub">${escapeHtml(l.text)}</span>
          <span class="pm-meta">${escapeHtml(sender(l.m))} · ${escapeHtml(fmtChatListTime(l.m.createdAt))}</span>
        </span>
      </a>`).join('')}</div>`;
  }
  function sharedFilesHtml(list, sender) {
    if (!list.length) return '';
    // строка — та же «карточка файла», что и в чате (data-chat-file): по нажатию файл открывается или скачивается
    return `<div class="pm-pane pm-list" data-pm-pane="files" role="tabpanel" hidden>${list.map((m) => {
      const name = m.fileName || 'Файл', ext = fileExt(name);
      return `
      <a class="pm-row" target="_blank" rel="noopener" role="button" tabindex="0" data-chat-file data-media-path="${escapeHtml(m.mediaPath)}" data-file-name="${escapeHtml(name)}">
        <span class="pm-ico" aria-hidden="true" style="background:${fileIconColor(ext)}">${escapeHtml((ext || 'file').slice(0, 4).toUpperCase())}</span>
        <span class="pm-main">
          <span class="pm-title">${escapeHtml(name)}</span>
          <span class="pm-meta">${m.fileSize ? escapeHtml(fmtFileSize(m.fileSize)) + ' · ' : ''}${escapeHtml(sender(m))} · ${escapeHtml(fmtChatListTime(m.createdAt))}</span>
        </span>
      </a>`;
    }).join('')}</div>`;
  }

  /* Вкладки на экране. spec — чей это чат; place() — где они встают, пока экран открыт: { root, after, first } или null.
     root — сам экран (ему ставится has-tabs); first — первая вкладка экрана { id, label, el }, её содержимое el уже
     нарисовано: полоса вкладок встаёт прямо перед ним, остальные панели — сразу за ним. Нет first — полоса встаёт
     после after. alive() — экран ещё открыт. mount() — встроить вкладки заново (экран перерисовали),
     load() — найти, что есть в переписке: сразу — в сообщениях на устройстве, следом — полный список с сервера. */
  function sharedTabs(spec, place, alive) {
    const key = chatKey(spec);
    let shared = null, sign = '', tab = '', base = [], extra = [];
    const sender = (m) => (isMyMsg(m) ? 'Вы' : (m.authorName || chatPersonById(m.fromId).name || 'Участник').trim().split(/\s+/)[0]);
    // Адрес фото или видео: файл, уже лежащий на устройстве, иначе временная ссылка из хранилища
    const mediaUrl = async (m, signIt) => {
      let url = m.localUrl || mediaBlobUrls.get(m.mediaPath) || null;
      if (!url && m.kind === 'image') url = await cachedMediaUrl(m.mediaPath);
      if (!url) url = freshSignedUrl(m.mediaPath);
      if (!url && signIt) { await signMediaPaths([m.mediaPath]); url = freshSignedUrl(m.mediaPath); }
      return url || '';
    };
    // Встроить вкладки в уже нарисованный экран (и убрать их, если показывать нечего)
    const mount = () => {
      const at = place();
      if (!at) return;
      const { root, after, first } = at;
      if (sharedMediaWatch) { sharedMediaWatch.disconnect(); sharedMediaWatch = null; }
      root.querySelectorAll('.pm-bar, .pm-pane').forEach((el) => el.remove());
      const tabs = [];
      if (shared && shared.media.length) tabs.push(['media', 'Медиа']);
      if (shared && shared.links.length) tabs.push(['links', 'Ссылки']);
      if (shared && shared.files.length) tabs.push(['files', 'Файлы']);
      root.classList.toggle('has-tabs', tabs.length > 0);
      if (!tabs.length) {   // ничего не присылали — экран выглядит как раньше
        if (first) first.el.hidden = false;
        return;
      }
      if (first) tabs.unshift([first.id, first.label]);
      if (!tabs.some(([id]) => id === tab)) tab = tabs[0][0];
      const barHtml = `<div class="pm-bar"><div class="chat-tabs" role="tablist" aria-label="Что есть в переписке">${
        tabs.map(([id, label]) => `<button type="button" class="chat-tab" role="tab" data-pm-tab="${id}" aria-selected="false">${label}</button>`).join('')
      }</div></div>`;
      if (first) first.el.insertAdjacentHTML('beforebegin', barHtml); else after.insertAdjacentHTML('afterend', barHtml);
      const bar = root.querySelector('.pm-bar');
      (first ? first.el : bar).insertAdjacentHTML('afterend', sharedMediaHtml(shared.media) + sharedLinksHtml(shared.links, sender) + sharedFilesHtml(shared.files, sender));

      // «Медиа»: файл подгружается, только когда плитка попала на экран (или близко к нему)
      const startMedia = () => {
        const pane = root.querySelector('[data-pm-pane="media"]');
        const cells = [...pane.querySelectorAll('.pm-cell')];
        const near = new WeakSet();   // плитки на экране и рядом с ним
        const fill = async (cell) => {
          const m = shared.media[Number(cell.dataset.pmOpen)], el = cell.firstElementChild;
          if (!m || el.getAttribute('src')) return;
          const url = await mediaUrl(m, false);
          if (!url || el.getAttribute('src')) return;
          if (m.kind !== 'video') { el.src = url; if (watch) watch.unobserve(cell); return; }
          if (watch && !near.has(cell)) return;   // пока узнавали адрес, плитку уже пролистали
          // у видео показываем кадр из самого начала, а не чёрную плитку
          el.src = url.startsWith('blob:') ? url : url + '#t=0.1';
        };
        // видео, ушедшее далеко за экран, отпускаем (вернётся — загрузится снова): телефон держит
        // одновременно лишь несколько видео, а плиток может быть много
        const release = (cell) => {
          const el = cell.firstElementChild;
          if (el.tagName !== 'VIDEO' || !el.getAttribute('src')) return;
          el.removeAttribute('src');
          el.load();
        };
        const watch = sharedMediaWatch = window.IntersectionObserver
          ? new IntersectionObserver((entries) => {
              for (const en of entries) {
                if (en.isIntersecting) { near.add(en.target); fill(en.target); }
                else { near.delete(en.target); release(en.target); }
              }
            }, { root: winBody, rootMargin: '300px 0px' })
          : null;
        const look = () => {
          for (const cell of cells) {
            if (cell.firstElementChild.getAttribute('src')) continue;
            if (watch) { watch.unobserve(cell); watch.observe(cell); } else fill(cell);
          }
        };
        look();
        // временные ссылки на файлы просим порциями: первые плитки появляются сразу, остальные — по мере прокрутки
        (async () => {
          const paths = shared.media.map((m) => m.mediaPath).filter((path) => !mediaBlobUrls.has(path) && !freshSignedUrl(path));
          for (let i = 0; i < paths.length && pane.isConnected; i += 60) {
            await signMediaPaths(paths.slice(i, i + 60));
            if (pane.isConnected) look();
          }
        })();
      };
      // «Файлы»: со ссылкой, готовой заранее, файл открывается сразу по нажатию — иначе браузер может не дать открыть вкладку
      const startFiles = async () => {
        const pane = root.querySelector('[data-pm-pane="files"]');
        await signMediaPaths(shared.files.map((m) => m.mediaPath));
        for (const row of pane.querySelectorAll('[data-chat-file]')) {
          const url = freshSignedUrl(row.dataset.mediaPath);
          if (url) row.href = url;
        }
      };
      const started = new Set();
      const select = (id) => {
        tab = id;
        bar.querySelectorAll('[data-pm-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.pmTab === id)));
        root.querySelectorAll('.pm-pane').forEach((pane) => { pane.hidden = pane.dataset.pmPane !== id; });
        if (first) first.el.hidden = id !== first.id;
        if (started.has(id)) return;
        started.add(id);
        if (id === 'media') startMedia(); else if (id === 'files') startFiles();
      };
      bar.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-pm-tab]');
        if (btn) select(btn.dataset.pmTab);
      });
      const mediaPane = root.querySelector('[data-pm-pane="media"]');
      if (mediaPane) mediaPane.addEventListener('click', (e) => {
        const cell = e.target.closest('[data-pm-open]');
        if (!cell) return;
        // просмотр листает все фото и видео переписки; адрес каждого узнаётся, когда до него долистали
        openMediaViewer(shared.media.map((m) => ({ kind: m.kind, resolve: () => mediaUrl(m, true) })), Number(cell.dataset.pmOpen));
      });
      select(tab);
    };
    // Списки изменились — вкладки встраиваются заново, иначе экран не трогаем
    const refresh = () => {
      const next = sharedFromMessages([...extra, ...base], spec);
      const s = [next.media.map((m) => m.id), next.links.map((l) => l.m.id + ' ' + l.href), next.files.map((m) => m.id)].map((ids) => ids.join(',')).join('|');
      if (s === sign) return;
      sign = s;
      shared = next;
      mount();
    };
    // Пока экран открыт, в этот чат что-то прислали — оно появляется во вкладках сразу
    const offer = (m) => {
      if (msgChatKey(m) !== key || extra.some((x) => String(x.id) === String(m.id))) return;
      if (!alive()) { if (sharedLive && sharedLive.offer === offer) sharedLive = null; return; }
      extra.push(m);
      refresh();
    };
    const load = async () => {
      sharedLive = { offer };
      let local = chatHistoryCache.get(key) || null;
      if (!local && currentUser) {
        const saved = await KV.get(`chat:${currentUser.id}:${key}`);
        if (Array.isArray(saved)) local = saved;
      }
      if (!alive()) return;
      if (local && local.length) { base = local; refresh(); }
      const remote = await loadSharedMessages(spec);
      if (alive() && (remote.files || remote.texts)) { base = mergeSharedMessages(local || [], remote); refresh(); }
    };
    return { mount, load };
  }

  /* Профиль человека показывается сразу из кеша (память или устройство), а с сервера перечитывается
     следом; экран перерисовывается, только если данные изменились */
  const friendProfileCache = new Map();   // userId → { p, photos }
  function showFriendProfile(userId, personHint = null, backFn = null) {
    if (isBotId(userId)) { botNoChat(); return; }   // участник группы-бота — профиля на сервере нет
    setScreen(() => {
      winTitle.textContent = 'Профиль';
      winBody.scrollTop = 0;
      winBody.innerHTML = `<div data-fp-root></div>`;
      // пока человек не ушёл на другой экран, в окне остаётся элемент с этой меткой
      const alive = () => !win.hidden && !!winBody.querySelector(`[data-fp-root="${CSS.escape(String(userId))}"], [data-fp-root=""]`);
      winBody.firstElementChild.dataset.fpRoot = '';
      let shown = null;

      /* ── вкладки «Медиа / Ссылки / Файлы»: что прислали друг другу в личном чате ── */
      const token = String(++sharedSeq);
      const tabs = sharedTabs({ type: 'dm', peerId: userId }, () => {
        const root = winBody.querySelector(`[data-pm="${token}"]`);
        const after = root && root.querySelector('.friend-actions');
        if (!after) return null;
        return { root, after, first: null };
      }, alive);

      const paint = (p, photoRows, fade) => {
        // в личку пишут друзьям и участникам своей группы; остальным (например, из группы с match) — сначала запрос в друзья
        const canWrite = friends.some((f) => String(f.id) === String(userId)) || sharesGroupWithMe(userId);
        const name = p.name || 'Пользователь';
        const handle = '@' + (p.username || 'user');
        const initial = (firstChar(name) || '?').toUpperCase();
        // текущее желание человека (если оно видно мне) — под именем
        const wish = currentWishOf(userId);
        const wishHtml = wish ? `<div class="fp-wish"><span>${escapeHtml(wish.text)}</span>${wish.place ? `<small>${escapeHtml(wish.place)}</small>` : ''}</div>` : '';
        // Есть фото — они во всю ширину шапки и листаются; нет — в шапке первая буква имени
        const photos = photosOrAvatar(photoRows, p.avatar).filter((ph) => safeUrl(ph.url));
        const headHtml = photos.length
          ? `${photoHeroHtml(photos, name, handle)}
            <div class="user-profile-view">
              ${p.bio ? `<div class="profile-bio ph-bio">${escapeHtml(p.bio)}</div>` : ''}${wishHtml}`
          : `
            <div class="user-profile-view">
              <div class="user-profile-hero">
                <div class="user-profile-avatar no-3d">${escapeHtml(initial)}</div>
                <div class="user-profile-name">${escapeHtml(name)}</div>
                <div class="user-profile-handle">${escapeHtml(handle)}</div>
                ${p.bio ? `<div class="profile-bio">${escapeHtml(p.bio)}</div>` : ''}
              </div>${wishHtml}`;

        winBody.innerHTML = `
          <div data-fp-root="${escapeHtml(userId)}" data-pm="${token}">
          ${headHtml}
            <div class="friend-actions">
              ${canWrite
                ? '<button type="button" class="btn btn-primary" id="friend-open-chat">Написать</button>'
                : `<button type="button" class="btn btn-primary" id="friend-add" data-add-friend="${escapeHtml(userId)}">Добавить в друзья</button>`}
            </div>
          </div>
          </div>`;
        if (fade) animateScreen('fade');   // профиль догрузился — мягко проявляем вместо «загрузки»

        const chatBtn = winBody.querySelector('#friend-open-chat');
        if (chatBtn) chatBtn.addEventListener('click', () => showDmScreen(userId));
        // не друг: кнопка показывает, отправлен ли уже запрос (или принять встречный)
        const addBtn = winBody.querySelector('#friend-add');
        if (addBtn && currentUser) friendRelationWith(userId).then((rel) => {
          if (!addBtn.isConnected) return;
          if (rel === 'outgoing') { addBtn.textContent = 'Запрос отправлен'; addBtn.disabled = true; }
          else if (rel === 'incoming') addBtn.textContent = 'Принять запрос';
        });
        tabs.mount();   // профиль перерисовали — вкладки с тем, что есть в переписке, возвращаются на место
      };
      const sign = (p, photos) => JSON.stringify([p.name, p.username, p.bio, p.avatar, (photos || []).map((x) => x.id || x.url),
        (currentWishOf(userId) || {}).text || '']);

      // что есть в переписке: сразу — из сообщений, лежащих на устройстве, следом — полный список с сервера
      tabs.load();

      (async () => {
        let cached = friendProfileCache.get(userId);
        if (!cached) {
          cached = await KV.get('prof:' + userId);
          if (!alive()) return;
        }
        if (cached && cached.p) { paint(cached.p, cached.photos, false); shown = sign(cached.p, cached.photos); }
        else { cached = null; winBody.innerHTML = `<div class="empty-msg" data-fp-root="">Загружаем профиль…</div>`; }

        let p = null;
        const photosReq = loadProfilePhotos(userId);
        try {
          const { data, error } = await supabaseClient
            .from('profiles')
            .select('id, name, username, bio, avatar')
            .eq('id', userId)
            .maybeSingle();
          if (error) console.warn('[friend profile] load:', error.message);
          p = data;
        } catch (err) { console.warn('[friend profile] exception:', err); }
        const photoRows = await photosReq;

        // Пока грузили, пользователь мог уйти на другой экран — не затираем его
        if (!alive()) return;
        if (!p && cached) return;   // сеть не ответила — остаётся то, что показано из кеша

        if (!p && personHint) {
          p = {
            id: personHint.id || userId,
            name: personHint.name || 'Пользователь',
            username: (personHint.handle || '@user').replace(/^@/, ''),
            bio: '',
            avatar: personHint.avatar || '',
          };
        }
        if (!p) {
          winBody.innerHTML = `<div class="empty-msg">Профиль не найден</div>`;
          return;
        }
        const photos = photoRows || (cached && cached.photos) || null;
        if (sign(p, photos) !== shown) { paint(p, photos, !cached); shown = sign(p, photos); }
        friendProfileCache.set(userId, { p, photos });
        KV.set('prof:' + userId, { p, photos });
      })();
    }, () => {
      (backFn || closeApp)();
    });
  }

  /* ═══════ ГЛАВНЫЙ ОБРАБОТЧИК ═══════ */
  // Тап мимо строки группы прячет открытые свайпом кнопки
  winBody.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.group-row')) return;
    winBody.querySelectorAll('.group-row.revealed').forEach((r) => r.classList.remove('revealed'));
  });

  // Галерея фото в профиле: полоски следят за прокруткой (scroll не всплывает — ловим на погружении)
  winBody.addEventListener('scroll', (e) => {
    const track = e.target;
    if (!track.classList || !track.classList.contains('ph-track')) return;
    const idx = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    const hero = track.parentElement;
    hero.querySelectorAll('.ph-bars span').forEach((s, i) => s.classList.toggle('is-on', i === idx));
    if (hero.dataset.phIdx !== String(idx)) { hero.dataset.phIdx = String(idx); syncPhotoHeroHeight(hero); }
  }, true);
  // фото догрузилось (листаемые грузятся лениво) — в раскрытом виде высота подстраивается под него
  winBody.addEventListener('load', (e) => {
    if (e.target.tagName === 'IMG' && e.target.closest('.ph-slide')) syncPhotoHeroHeight(e.target.closest('.photo-hero'));
  }, true);
  // голосовые: события плеера не всплывают — ловим на погружении и перерисовываем кнопку, волну и время
  ['play', 'pause', 'timeupdate', 'ended', 'loadedmetadata', 'volumechange'].forEach((type) => winBody.addEventListener(type, (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.priming) return;   // голосовое «будят» для очереди (primeChatQueue) — это не воспроизведение
    const box = t.tagName === 'AUDIO' && t.closest('.chat-voice');
    const circle = t.tagName === 'VIDEO' && t.closest('.chat-circle-wrap');
    if (box) {
      if (type === 'ended') { try { t.currentTime = 0; } catch {} }
      if (type === 'play') markVoiceHeard(box);   // включила очередь, а не нажатие — тоже прослушано
      paintVoice(box);
    }
    if (!box && !circle) return;
    // полоска «сейчас играет»: голосовое или кружок со звуком; беззвучный повтор кружка — не в счёт
    if (type === 'play' && (box || !t.muted)) nowPlaying = t;
    if (nowPlaying === t && (type === 'ended' || (circle && t.muted))) nowPlaying = null;
    if (nowPlaying === t || type === 'ended' || type === 'play') syncChatPlayer();
    if (circle && nowPlaying === t && !circleRingRaf) paintCircleRing();
    if (box && type === 'ended') playNextInQueue(t);
  }, true));
  /* ── Очередь: голосовые и кружки подряд ──
     Голосовое или кружок дослушали до конца — сразу играет следующее голосовое или кружок ниже в переписке,
     чьё бы оно ни было, и так далее, как в Telegram. Только после конца сам по себе: пауза или крестик очередь
     не продолжают */
  function chatQueueMedia() {
    return [...winBody.querySelectorAll('#chat-view-body .chat-voice audio, #chat-view-body video.chat-circle')];
  }
  function startQueueItem(el) {
    if (el.tagName === 'VIDEO') toggleCircle(el.closest('.chat-circle-wrap')); else toggleVoice(el.closest('.chat-voice'));
  }
  function playNextInQueue(el) {
    if (!el.isConnected) return;
    const list = chatQueueMedia();
    const next = list[list.indexOf(el) + 1];
    if (!next) return;
    if (next.getAttribute('src')) { startQueueItem(next); return; }
    // ссылка на файл ещё подставляется — подождём её немного
    setTimeout(() => { if (next.isConnected && !nowPlaying && next.getAttribute('src')) startQueueItem(next); }, 800);
  }
  /* iPhone и iPad дают звуку играть без нажатия только тем проигрывателям, которые хоть раз запустили нажатием.
     Поэтому в момент нажатия «будим» и следующие голосовые и кружки ленты: голосовое на миг запускается без звука
     и сразу останавливается, кружок (он и так крутится без звука) — просто запускается. Дальше очередь играет сама */
  function primeChatQueue(from) {
    if (!IS_IOS || !from) return;
    const list = chatQueueMedia(), i = list.indexOf(from);
    for (const el of list.slice(i + 1, i + 13)) {
      if (el.primed || !el.getAttribute('src')) continue;
      el.primed = true;
      if (el.tagName === 'VIDEO') { el.play().catch(() => {}); continue; }
      el.dataset.priming = '1';
      el.muted = true;
      el.play().then(() => el.pause(), () => {}).finally(() => {
        try { el.currentTime = 0; } catch {}
        el.muted = false;
        delete el.dataset.priming;
        const box = el.closest('.chat-voice');
        if (box) paintVoice(box);
      });
    }
  }
  winBody.addEventListener('click', (e) => {
    const hero = e.target.closest('.photo-hero[data-photo-hero]');
    if (hero) onPhotoHeroTap(hero, e.clientX);

  win.addEventListener('keydown', (e) => {
