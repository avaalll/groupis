        await refreshFriendsAndMap();
        if (openApp === 'friends' && winTitle.textContent === 'Друзья') showApp('friends');
      }).subscribe();
    rtChannels.push(chFriends);

    const ch6 = supabaseClient.channel('rt:user_locations')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'user_locations' }, (payload) => {
        applyUserLocationChange(payload);
      }).subscribe();
    rtChannels.push(ch6);
  }

  /* ═══════ ГЕОПОЗИЦИИ ДРУЗЕЙ И УЧАСТНИКОВ ГРУПП ═══════ */
  const friendMarkers = new Map();
  const friendMarkerCoords = new Map(); // userId → { coords:[lon,lat], person }
  let userLocationsById = new Map();
  let userAvatarCfgById = new Map();
  let groupMemberProfiles = new Map();

  /* Кого показываем на карте:
     — друзей;
     — участников моих групп (где я лидер);
     — лидеров всех групп: над ними иконка группы, видна всем;
     — после match — всех участников групп, с которыми у моих групп match. */
  function computeRelevantUserIds() {
    const ids = new Set();
    const myId = currentUser && currentUser.id;
    if (!myId) return ids;
    for (const f of friends) ids.add(f.id);
    for (const g of groups) {
      const mine = isGroupParticipant(g, myId);
      // Лидер чужой группы виден, только если группа проходит фильтры
      // Скрытые группы (закреплённый союз, распавшийся союз) не показываем вовсе
      if (mine || (!groupHiddenForMe(g) && groupPassesFilters(g))) ids.add(g.ownerId);
      // Участники всех групп, где я состою (лидером или участником), видят друг друга
      if (!mine) continue;
      for (const m of (g.members || [])) ids.add(m.id);
    }
    for (const m of myAcceptedMatches()) {
      for (const gid of [m.fromGroup, m.toGroup]) {
        const g = groupById(gid);
        if (!g) continue;
        ids.add(g.ownerId);
        for (const mem of (g.members || [])) ids.add(mem.id);
      }
    }
    ids.delete(myId);
    return ids;
  }

  async function loadGroupMemberProfiles() {
    const friendIds = new Set(friends.map((f) => f.id));
    const ids = [...computeRelevantUserIds()].filter((id) => !friendIds.has(id));
    if (!ids.length) { groupMemberProfiles = new Map(); return; }
    // Запасной вариант — имя и аватар, сохранённые в составе группы
    const next = new Map();
    for (const g of groups) {
      for (const m of (g.members || [])) {
        if (ids.includes(m.id) && !next.has(m.id)) next.set(m.id, { id: m.id, name: m.name, handle: m.handle, avatar: m.avatar || '' });
      }
    }
    const { data, error } = await supabaseClient.from('profiles').select('id,name,username,avatar').in('id', ids);
    if (error) console.warn('[group profiles] load:', error.message);
    for (const p of (data || [])) next.set(p.id, { id: p.id, name: p.name, handle: '@' + p.username, avatar: p.avatar || '' });
    groupMemberProfiles = next;
  }

  /* Перечитать друзей и привести маркеры на карте в соответствие.
     loadGroupMemberProfiles нужен, чтобы бывший друг, оставшийся участником группы,
     перерисовался как участник группы, а не завис со старым маркером. */
  async function refreshFriendsAndMap() {
    await loadFriendsFromDB();
    await loadGroupMemberProfiles();
    await loadUserLocations();
  }

  function personById(userId) {
    if (userId === (currentUser && currentUser.id)) return null;
    const f = friends.find((x) => x.id === userId);
    if (f) return f;
    if (groupMemberProfiles.has(userId)) return groupMemberProfiles.get(userId);
    return null;
  }

  /* Подпись на плашке участника-не-друга: название общей группы.
     Общая — где состоим оба (как владелец или участник). Несколько — «Название +N». */
  function sharedGroupsLabel(userId) {
    const myId = currentUser && currentUser.id;
    if (!myId) return '';
    const inGroup = (g, id) => g.ownerId === id || (g.members || []).some((m) => m.id === id);
    let names = groups.filter((g) => inGroup(g, myId) && inGroup(g, userId)).map((g) => (g.name || '').trim()).filter(Boolean);
    if (!names.length) {
      // Не в общей группе, но из группы, с которой у нас match — подписываем его группу
      const matchedIds = new Set(myAcceptedMatches().flatMap((m) => [m.fromGroup, m.toGroup]));
      names = groups.filter((g) => matchedIds.has(String(g.id)) && !inGroup(g, myId) && inGroup(g, userId))
        .map((g) => (g.name || '').trim()).filter(Boolean);
    }
    if (!names.length) return 'группа';
    let first = names[0];
    if (first.length > 16) first = first.slice(0, 15) + '…';
    return names.length > 1 ? `${first} +${names.length - 1}` : first;
  }

  // Плашка группы на карте: фото, название, число участников
  function mapGroupChipHtml(g, extraClass = '', attrs = '') {
    let name = (g.name || 'Группа').trim();
    if (name.length > 22) name = name.slice(0, 21) + '…';
    const count = (g.members || []).length + 1; // участники + лидер
    const ava = g.photo
      ? `<span class="map-group-ava" style="background-image:url('${safeUrl(g.photo)}')"></span>`
      : `<span class="map-group-ava">${escapeHtml((g.name || '?').trim().charAt(0).toUpperCase() || '?')}</span>`;
    return `<div class="map-group-chip ${extraClass}" ${attrs}>
        ${ava}
        <span class="map-group-name">${escapeHtml(name)}</span>
        <span class="map-group-count">${count}</span>
      </div>`;
  }

  /* Иконки групп лидера над его аватаром. Группа с желанием — верхняя: облако висит над ней.
     Клик по ним открывает карточку группы (data-map-group). */
  function mapGroupBadgesHtml(ownedGroups) {
    return [...ownedGroups].sort((a, b) => (b.wish ? 1 : 0) - (a.wish ? 1 : 0))
      .map((g) => mapGroupChipHtml(g, '', `data-map-group="${escapeHtml(g.id)}"`)).join('');
  }

  function mapGroupsKey(ownedGroups) {
    return ownedGroups.map((g) => [g.id, g.name, g.photo, g.wish, (g.members || []).length].join('|')).join('¦');
  }

  function sharesGroupWithMe(userId) {
    const myId = currentUser && currentUser.id;
    return !!myId && groups.some((g) => isGroupParticipant(g, myId) && isGroupParticipant(g, userId));
  }

  function buildFriendMarkerHTML(person, isFriend, avatarCfg, userId, groupLabel, ownedGroups = [], clouds = []) {
    const nameInitial = (person.name || '?').trim().charAt(0).toUpperCase() || '?';
    let label = (person.name || '').trim() || person.handle || 'Пользователь';
    if (label.length > 18) label = label.slice(0, 17) + '…';

    const avatarInner = person.avatar
      ? `<div class="user-badge-avatar" style="background-image:url('${safeUrl(person.avatar)}')"></div>`
      : `<div class="user-badge-avatar" style="background:linear-gradient(145deg, var(--you-2), var(--you-deep))">${escapeHtml(nameInitial)}</div>`;

    const cfg = (avatarCfg && typeof avatarCfg === 'object') ? avatarCfg : null;
    const imgUrl = cfg ? getAvatarSnapshotDataURL(cfg) : null;
    const isLeader = ownedGroups.length > 0;

    // Цвет плашки: друг из общей группы — зелёная, не друг — коричневая, просто друг — обычная
    const tone = isFriend ? (groupLabel ? 'is-friend-group' : '') : 'is-group';
    const dotColor = { '': 'var(--you)', 'is-friend-group': '#0D8A98', 'is-group': '#131318' }[tone];

    const bottom = imgUrl
      ? `<div class="user-avatar-marker"><img src="${imgUrl}" alt=""></div>`
      : isLeader
        ? `<div class="user-dot-marker is-leader"></div>`
        : `<div class="user-dot-marker ${tone}" style="background:${dotColor}"></div>`;

    // Лидер чужой группы: вместо плашки с именем — иконка группы. Облака желаний — над плашкой
    const badge = isLeader
      ? `<div class="user-badge is-leader" data-clickable="true">${wishAnchorsHtml(clouds)}${mapGroupBadgesHtml(ownedGroups)}</div>`
      : `<div class="user-badge" data-clickable="true">
          ${wishAnchorsHtml(clouds)}
          <div class="user-badge-inner ${tone}">
            ${avatarInner}
            <span class="user-badge-name">${escapeHtml(label)}</span>
            ${groupLabel || !isFriend ? `<span class="user-badge-name user-badge-group">· ${escapeHtml(groupLabel || 'группа')}</span>` : ''}
          </div>
        </div>`;

    return `
      <div class="user-avatar-wrap" data-clickable="true" data-user-id="${escapeHtml(userId)}"
           style="pointer-events:auto;cursor:pointer;">
        ${badge}
        ${isLeader ? signalRingsHtml('is-group') : ''}
        ${bottom}
      </div>`;
  }

  /* «Сигнальные кольца» на земле под маркером: группа (и вы сами) как будто пингует радар */
  function signalRingsHtml(kind = '') {
    return `<span class="signal-rings ${kind}" aria-hidden="true"><i></i><i></i></span>`;
  }

  /* Знак «feat» — две пересекающиеся группы; линза пересечения подсвечивается по состоянию союза */
  function featMarkHtml(state = '') {
    return `<svg class="feat-mark ${state ? 'is-' + escapeHtml(state) : ''}" viewBox="0 0 44 44" aria-hidden="true">
      <circle class="fa" cx="17" cy="22" r="11"/><circle class="fb" cx="27" cy="22" r="11"/>
      <circle class="fx" cx="27" cy="22" r="11" clip-path="url(#featClipA)"/></svg>`;
  }

  /* ═══════ ОБЛАКО ЖЕЛАНИЯ ═══════
     Контур — «барашки» по краю суперэллипса, в который вписан текст: облако растёт под текст,
     а барашки не растягиваются. Снизу хвостик, его кончик — точка привязки над иконкой. */
  const WISH_TEXT_MAX = 150;          // ширина текста в облаке (как max-width у .wc-measure)
  const wishSizeCache = new Map();
  const wishGeomCache = new Map();
  let wishMeasureEl = null;

  function wishTextInner(text, caption) {
    return `${caption ? `<span class="wc-cap">${escapeHtml(caption)}</span>` : ''}<span class="wc-msg">${escapeHtml(text)}</span>`;
  }

  function measureWishText(text, caption) {
    const key = text + '\u0001' + caption;
    let size = wishSizeCache.get(key);
    if (size) return size;
    if (!wishMeasureEl) {
      wishMeasureEl = document.createElement('div');
      wishMeasureEl.className = 'wc-text wc-measure';
      wishMeasureEl.setAttribute('aria-hidden', 'true');
      document.body.appendChild(wishMeasureEl);
    }
    wishMeasureEl.innerHTML = wishTextInner(text, caption);
    const r = wishMeasureEl.getBoundingClientRect();
    size = { w: Math.min(WISH_TEXT_MAX, Math.ceil(r.width)) + 2, h: Math.max(16, Math.ceil(r.height)) };
    wishSizeCache.set(key, size);
    return size;
  }

  // side: 'right' — облако справа от иконки, хвостик уходит влево вниз; 'left' — зеркально.
  // pair — над иконкой два облака: хвостик у края облака, чтобы облака разошлись в стороны
  function wishCloudGeometry(tw, th, side, pair = false) {
    const key = `${tw}x${th}:${side}:${pair ? 2 : 1}`;
    const hit = wishGeomCache.get(key);
    if (hit) return hit;
    const a = Math.max(50, tw / 2 / 0.9 + 9);
    const b = Math.max(25, th / 2 / 0.78 + 7);
    // контур — суперэллипс |x/a|⁴ + |y/b|⁴ = 1, обход по часовой стрелке (y вниз)
    const S = 480, P = [];
    for (let i = 0; i <= S; i++) {
      const t = (i / S) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
      P.push([a * Math.sign(c) * Math.sqrt(Math.abs(c)), b * Math.sign(s) * Math.sqrt(Math.abs(s))]);
    }
    // «взвешенная» длина контура: сверху барашки крупнее, снизу мельче
    const U = [0];
    for (let i = 1; i <= S; i++) {
      const w = 1.05 - 0.34 * ((P[i - 1][1] + P[i][1]) / 2 / b);
      U.push(U[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]) / w);
    }
    const total = U[S];
    const n = Math.max(7, Math.min(16, Math.round(total / 30)));
    const step = total / n;
    const dir = side === 'left' ? 1 : -1;   // куда смещён кончик хвостика
    // хвостик — снизу, ближе к стороне иконки: одна «ячейка» контура отдаётся под его основание
    let ti = 0, best = Infinity;
    for (let i = 0; i <= S; i++) {
      const d = Math.abs(P[i][0] - dir * a * (pair ? 0.55 : 0.42));
      if (P[i][1] > 0 && d < best) { best = d; ti = i; }
    }
    const at = (u) => {
      u = ((u % total) + total) % total;
      let lo = 0, hi = S;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (U[mid] <= u) lo = mid; else hi = mid; }
      const k = (u - U[lo]) / Math.max(1e-9, U[hi] - U[lo]);
      return [P[lo][0] + (P[hi][0] - P[lo][0]) * k, P[lo][1] + (P[hi][1] - P[lo][1]) * k];
    };
    const pts = [];
    for (let k = 0; k < n; k++) pts.push(at(U[ti] - step / 2 + k * step));

    const f = (p) => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    const bb = [Infinity, Infinity, -Infinity, -Infinity];
    const add = (x, y) => { bb[0] = Math.min(bb[0], x); bb[1] = Math.min(bb[1], y); bb[2] = Math.max(bb[2], x); bb[3] = Math.max(bb[3], y); };
    // барашки: дуги между соседними точками, выпуклые наружу
    const A = pts[0], B = pts[1];   // основание хвостика (обход снизу идёт справа налево)
    let d = `M${f(B)}`;
    for (let k = 1; k < n; k++) {
      const p = pts[k], q = pts[(k + 1) % n];
      const vx = q[0] - p[0], vy = q[1] - p[1], len = Math.hypot(vx, vy);
      const r = len * 0.56;
      d += `A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${f(q)}`;
      const h = Math.sqrt(Math.max(0, r * r - len * len / 4));
      const cx = (p[0] + q[0]) / 2 - (vy / len) * h, cy = (p[1] + q[1]) / 2 + (vx / len) * h;  // центр — внутри облака
      const a0 = Math.atan2(p[1] - cy, p[0] - cx);
      let da = Math.atan2(q[1] - cy, q[0] - cx) - a0;
      while (da > Math.PI) da -= 2 * Math.PI;
      while (da < -Math.PI) da += 2 * Math.PI;
      for (let j = 0; j <= 8; j++) add(cx + r * Math.cos(a0 + da * j / 8), cy + r * Math.sin(a0 + da * j / 8));
    }
    // хвостик: «рожок» спускается сбоку от плашки и загибается к её краю — кончик касается плашки снаружи,
    // не заходя на аватар и имя
    const M = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
    const T = [M[0] + dir * 13, M[1] + 27];
    const outer = dir < 0 ? A : B;
    const cOut = [outer[0] + dir * 1, M[1] + 24];
    const cIn = [M[0] + dir * 4, M[1] + 14];
    const c1 = dir < 0 ? cOut : cIn, c2 = dir < 0 ? cIn : cOut;
    d += `Q${f(c1)} ${f(T)}Q${f(c2)} ${f(B)}Z`;
    [A, B, T, c1, c2].forEach((p) => add(p[0], p[1]));

    const pad = 6;
    const x0 = bb[0] - pad, y0 = bb[1] - pad;
    const w = Math.ceil(bb[2] - bb[0] + pad * 2), hgt = Math.ceil(bb[3] - bb[1] + pad * 2);
    const geom = { w, h: hgt, vb: `${x0.toFixed(1)} ${y0.toFixed(1)} ${w} ${hgt}`, d, tipX: T[0] - x0, tipY: T[1] - y0, cx: -x0, cy: -y0 - 1 };
    wishGeomCache.set(key, geom);
    return geom;
  }

  function wishCloud({ text, caption = '', tone = 'me', side = 'right', pair = false, attrs = '' }) {
    text = String(text || '');
    const t = measureWishText(text, caption);
    const g = wishCloudGeometry(t.w, t.h, side, pair);
    const html = `<div class="wish-cloud is-${tone}" ${attrs} style="left:${(-g.tipX).toFixed(1)}px;top:${(-g.tipY).toFixed(1)}px;width:${g.w}px;height:${g.h}px;transform-origin:${g.tipX.toFixed(1)}px ${g.tipY.toFixed(1)}px">
        <svg width="${g.w}" height="${g.h}" viewBox="${g.vb}" aria-hidden="true"><path class="wc-edge" d="${g.d}"/><path class="wc-body" d="${g.d}"/></svg>
        <div class="wc-text" style="left:${(g.cx - t.w / 2).toFixed(1)}px;top:${(g.cy - t.h / 2).toFixed(1)}px;width:${t.w}px">${wishTextInner(text, caption)}</div>
      </div>`;
    return { html, g };
  }

  // Облака над маркером: первое — сверху справа, второе (если есть) — сверху слева
  function wishAnchorsHtml(clouds) {
    const list = (clouds || []).slice(0, 2);
    const pair = list.length > 1;
    return list.map((c, i) => {
      const side = i ? 'left' : 'right';
      return `<span class="wish-anchor is-${side} ${pair ? 'is-pair' : ''}">${wishCloud({ ...c, side, pair }).html}</span>`;
    }).join('');
  }
  function wishCloudsKey(clouds) { return (clouds || []).map((c) => [c.tone, c.text, c.caption || ''].join('|')).join('¦'); }

  // Текущее желание человека — последнее без места: оно висит облаком над его иконкой
  function currentWishOf(userId) {
    const uid = String(userId);
    let best = null;
    for (const w of visibleWishes()) {
      if (String(w.authorId) !== uid || Array.isArray(w.coords)) continue;
      if (!best || (w.ts || 0) > (best.ts || 0)) best = w;
    }
    return best;
  }
  function myCurrentWish() { return currentUser ? currentWishOf(currentUser.id) : null; }

  // Группы человека с желанием, которые я вижу: облако группы висит над её лидером
  function wishGroupsOf(userId) {
    const myId = currentUser && currentUser.id;
    return groupsOwnedBy(userId).filter((g) => g.wish && groupOnMap(g) && (isGroupParticipant(g, myId) || (!groupHiddenForMe(g) && groupPassesFilters(g))));
  }

  /* Облака для маркера человека: личное желание и желание его группы.
     asGroupIcon — маркер показан иконкой группы (лидер чужой группы): тогда главное облако — группы. */
  function personWishClouds(userId, person, wishGroups, asGroupIcon) {
    const w = currentWishOf(userId);
    const g = (wishGroups || []).find((x) => x.wish);
    const mine = currentUser && String(userId) === String(currentUser.id);
    const firstName = ((person && person.name) || '').trim().split(/\s+/)[0];
    const personal = w ? { text: w.text, tone: 'me', caption: asGroupIcon ? firstName : '', attrs: mine ? 'data-wish-mine' : '' } : null;
    const group = g ? {
      text: g.wish, tone: 'group',
      // над иконкой группы подпись не нужна; над человеком — название группы
      caption: asGroupIcon && wishGroups.length < 2 ? '' : (g.name || 'Группа'),
      attrs: `data-map-group="${escapeHtml(g.id)}"`,
    } : null;
    return (asGroupIcon ? [group, personal] : [personal, group]).filter(Boolean);
  }

  /* ── Облака разных людей не налезают друг на друга ──
     После каждого изменения карты облака раскладываются «жадно»: сначала выбранное нажатием, затем своё,
     затем остальные — снизу экрана вверх (нижние ближе к зрителю). Облако, которое перекрыло бы уже
     показанное, прячется, а у плашки остаётся маленькое облачко «…»: нажатие выводит это желание вперёд. */
  let wishDeclutterRaf = 0, wishDeclutterTimer = 0, pinnedWishCloud = null;
  function scheduleWishDeclutter() {
    if (!wishDeclutterRaf) wishDeclutterRaf = requestAnimationFrame(declutterWishes);
    // повтор после анимации появления: пока облако «вырастает», его размер ещё не окончательный
    clearTimeout(wishDeclutterTimer);
    wishDeclutterTimer = setTimeout(() => { if (!wishDeclutterRaf) wishDeclutterRaf = requestAnimationFrame(declutterWishes); }, 650);
  }
  function declutterWishes() {
    wishDeclutterRaf = 0;
    const mapEl = document.getElementById('map');
    if (!mapEl) return;
    if (pinnedWishCloud && !pinnedWishCloud.isConnected) pinnedWishCloud = null;
    const items = [...mapEl.querySelectorAll('.wish-anchor > .wish-cloud')].map((el) => ({
      el, r: el.getBoundingClientRect(),
      rank: el === pinnedWishCloud ? 0 : el.closest('[data-own-marker]') ? 1 : 2,
    })).filter((it) => it.r.width > 0);
    items.sort((a, b) => a.rank - b.rank || b.r.bottom - a.r.bottom);
    const pad = 4, placed = [];
    const hit = (a, b) => a.left < b.right - pad && b.left < a.right - pad && a.top < b.bottom - pad && b.top < a.bottom - pad;
    for (const it of items) {
      const tucked = placed.some((r) => hit(r, it.r));
      if (!tucked) placed.push(it.r);
      const anchor = it.el.parentElement;
      it.el.classList.toggle('is-tucked', tucked);
      anchor.classList.toggle('is-tucked', tucked);
      if (tucked && !anchor.querySelector('.wish-peek')) {
        anchor.insertAdjacentHTML('beforeend', '<span class="wish-peek" role="button" aria-label="Показать желание" title="Показать желание"><i></i><i></i><i></i></span>');
      }
    }
  }
  // Нажатие на «…» — это желание выходит вперёд, а перекрывающие его прячутся
  document.getElementById('map').addEventListener('click', (e) => {
    const peek = e.target.closest('.wish-peek');
    if (!peek) return;
    e.stopPropagation();
    pinnedWishCloud = peek.parentElement.querySelector('.wish-cloud');
    declutterWishes();
  }, true);

  // Желания изменились: облака на местах, над моей иконкой и над друзьями
  function refreshWishClouds() {
    if (!map2gis) return;
    syncWishMarkers();
    refreshMyMarker();
    for (const [uid, fm] of [...friendMarkerCoords.entries()]) {
      upsertFriendMarker(uid, fm.person, fm.coords, friends.some((f) => f.id === uid), userAvatarCfgById.get(uid) || null);
    }
  }
  // Шрифт догрузился — размеры текста другие: перемеряем облака
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { wishSizeCache.clear(); wishGeomCache.clear(); refreshWishClouds(); }).catch(() => {});
  }

  // Клик по иконке группы на карте: открыть её карточку
  function openMapGroup(e) {
    const chip = e.target.closest('[data-map-group]');
    if (!chip) return false;
    e.stopPropagation();
    const gid = chip.dataset.mapGroup;
    showApp('groups');
    showGroupDetailsScreen(gid, () => closeApp());
    return true;
  }

  /* Реальный DOM-элемент маркера друга с обработчиком клика —
     так же, как у твоего собственного маркера и маркеров воспоминаний. */
  function buildFriendMarkerElement(person, isFriend, avatarCfg, userId, groupLabel, ownedGroups = [], clouds = []) {
    const tpl = document.createElement('div');
    tpl.innerHTML = buildFriendMarkerHTML(person, isFriend, avatarCfg, userId, groupLabel, ownedGroups, clouds).trim();
    const el = tpl.firstElementChild;

    const openProfile = (e) => {
      if (openMapGroup(e)) return;
      e.stopPropagation();
      showApp('profile');                 // окно скрыто, пока ты на карте — сначала открываем его
      showFriendProfile(userId, person);  // затем показываем профиль друга
    };
    el.addEventListener('click', openProfile);
    return el;
  }

  async function loadUserLocations() {
    if (!map2gis || !currentUser) return;
    const relevant = computeRelevantUserIds();
    if (!relevant.size) {
      for (const [id, fm] of [...friendMarkers.entries()]) {
        try { fm.marker.destroy(); } catch {}
        friendMarkers.delete(id);
        friendMarkerCoords.delete(id);
      }
      return;
    }
    const ids = [...relevant];
    const { data, error } = await supabaseClient.from('user_locations')
      .select('user_id, lat, lon, updated_at, avatar_config')
      .in('user_id', ids);
    if (error) { console.warn('[user_locations] load:', error.message); return; }

    console.log('[user_locations] rows:', data);

    const found = new Set();
    for (const row of (data || [])) {
      found.add(row.user_id);
      userLocationsById.set(row.user_id, [row.lon, row.lat]);
      if (row.avatar_config && typeof row.avatar_config === 'object') {
        userAvatarCfgById.set(row.user_id, row.avatar_config);
      } else {
        userAvatarCfgById.delete(row.user_id);
      }
    }
    const shown = new Set();
    for (const [userId, coords] of userLocationsById.entries()) {
      if (!relevant.has(userId)) continue;
      const person = personById(userId);
      if (!person) continue;
      const isFriend = friends.some((f) => f.id === userId);
      const cfg = userAvatarCfgById.get(userId) || null;
      upsertFriendMarker(userId, person, coords, isFriend, cfg);
      shown.add(userId);
    }
    // Убираем всех, кого не показали в этом проходе: больше не друг и не участник группы,
    // нет геопозиции или нет профиля — иначе на карте остаётся устаревший маркер
    for (const userId of [...friendMarkers.keys()]) {
      if (!shown.has(userId) || !found.has(userId)) removeFriendMarker(userId);
    }
  }

  function removeFriendMarker(userId) {
    const fm = friendMarkers.get(userId);
    if (fm) { try { fm.marker.destroy(); } catch {} }
    friendMarkers.delete(userId);
    friendMarkerCoords.delete(userId);
  }

  function upsertFriendMarker(userId, person, coords, isFriend, avatarCfg) {
    if (!map2gis) return;
    const existing = friendMarkers.get(userId);
    const cfgKey = avatarCfgKey(avatarCfg);
    // Со мной в одной группе — вижу его по имени с названием нашей группы;
    // иконку группы вместо имени показываем только лидерам групп, где меня нет
    const sharesGroup = sharesGroupWithMe(userId);
    const groupLabel = sharesGroup || !isFriend ? sharedGroupsLabel(userId) : '';
    const ownedGroups = sharesGroup ? [] : visibleGroupsOfLeader(userId);
    const groupsKey = mapGroupsKey(ownedGroups);
    // Облака: над иконкой группы — её желание; над человеком — его желание и желание его группы
    const asGroupIcon = ownedGroups.length > 0;
    const clouds = personWishClouds(userId, person, asGroupIcon ? ownedGroups : wishGroupsOf(userId), asGroupIcon);
    const cloudsKey = wishCloudsKey(clouds);
    if (existing) {
      const same =
        existing.avatarKey === cfgKey &&
        existing.isFriend === isFriend &&
        existing.groupLabel === groupLabel &&
        existing.groupsKey === groupsKey &&
        existing.cloudsKey === cloudsKey &&
        existing.personName === (person.name || '') &&
        existing.personAvatar === (person.avatar || '');
      if (same) {
        try { existing.marker.setCoordinates(coords); } catch {}
        existing.location = coords;
        friendMarkerCoords.set(userId, { coords, person });
        scheduleWishDeclutter();
        return;
      }
      try { existing.marker.destroy(); } catch {}
      friendMarkers.delete(userId);
    }
    const html = buildFriendMarkerElement(person, isFriend, avatarCfg, userId, groupLabel, ownedGroups, clouds);
    const marker = new mapgl.HtmlMarker(map2gis, {
      coordinates: coords,
      html,
      anchor: [0.5, 0.85],
      preventMapInteractions: true, // как у собственного маркера — клик не уходит в карту
    });
    friendMarkers.set(userId, {
      marker,
      location: coords,
      avatarKey: cfgKey,
      isFriend,
      groupLabel,
      groupsKey,
      cloudsKey,
      personName: person.name || '',
      personAvatar: person.avatar || '',
    });
    friendMarkerCoords.set(userId, { coords, person });
    scheduleWishDeclutter();
  }

  async function applyUserLocationChange(payload) {
    if (!currentUser) return;
    const row = payload.new || payload.old;
    if (!row) return;
    const userId = row.user_id;
    if (!userId || userId === currentUser.id) return;

    const relevant = computeRelevantUserIds();
    // Человек больше не друг и не участник группы — его маркера на карте быть не должно
    if (!relevant.has(userId)) { removeFriendMarker(userId); return; }

    if (payload.eventType === 'DELETE') {
      userLocationsById.delete(userId);
      userAvatarCfgById.delete(userId);
      removeFriendMarker(userId);
      return;
    }

    const coords = [row.lon, row.lat];
    userLocationsById.set(userId, coords);
    if (row.avatar_config && typeof row.avatar_config === 'object') {
      userAvatarCfgById.set(userId, row.avatar_config);
    } else {
      userAvatarCfgById.delete(userId);
    }

    let person = personById(userId);
    if (!person) {
      const { data, error } = await supabaseClient.from('profiles').select('id,name,username,avatar').eq('id', userId).maybeSingle();
      if (error || !data) return;
      groupMemberProfiles.set(userId, { id: data.id, name: data.name, handle: '@' + data.username, avatar: data.avatar || '' });
      person = groupMemberProfiles.get(userId);
    }
    if (!person) return;
    const isFriend = friends.some((f) => f.id === userId);
    const cfg = userAvatarCfgById.get(userId) || null;
    upsertFriendMarker(userId, person, coords, isFriend, cfg);
  }

  async function upsertMyLocation(coords) {
    if (!currentUser || !Array.isArray(coords) || coords.length !== 2) return;
    const [lon, lat] = coords;
    const row = { user_id: currentUser.id, lat, lon, updated_at: new Date().toISOString() };
    // аватар отправляем, только когда свой уже загружен — иначе затрём сохранённый на сервере
    if (avatarConfigReady) row.avatar_config = avatarConfig;
    const { error } = await supabaseClient.from('user_locations').upsert(row, { onConflict: 'user_id' });
    if (error) console.warn('[user_locations] upsert:', error.message);
  }

  /* ═══════ 2ГИС ═══════ */
  const MAPGL_API_KEY = '48802321-3481-4b6a-9ff4-58e05aa0fd8b';
  const MAP_START_LOCATION = { center: [37.6156, 55.7558], zoom: 11 };
  let map2gis = null;
  let mapStarted = false;
  function ensureMapStarted() {
    if (mapStarted) return;
    mapStarted = true;
    init2GisMap();
  }
  const placeMarkers = new Map();
  const wishMarkers = new Map();
  let openPopupMarker = null;

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = resolve; s.onerror = () => reject(new Error('Не удалось загрузить ' + src));
      document.head.appendChild(s);
    });
  }

  async function init2GisMap() {
    try {
      await loadScript('https://mapgl.2gis.com/api/js/v1');
      // Без кнопок масштаба 2GIS: приближение колесом мыши, жестами и двойным нажатием
      const mapStyleId = MAP_STYLE[resolvedTheme()];
      map2gis = new mapgl.Map('map', {
        center: MAP_START_LOCATION.center, zoom: MAP_START_LOCATION.zoom, key: MAPGL_API_KEY,
        zoomControl: false,
        ...(mapStyleId ? { style: mapStyleId } : {}),
      });

      // Клик по пустому месту карты: закрываем окно или попап.
      // Клики по маркерам друзей обрабатываются самими маркерами.
      map2gis.on('click', () => {
        if (openApp !== null) closeApp(); else closePopup();
      });

      // Облака желаний плавно уменьшаются при отдалении карты; кончик хвостика остаётся у иконки
      const mapEl = document.getElementById('map');
      let wishScaleRaf = 0;
      const syncWishScale = () => {
        wishScaleRaf = 0;
        const k = Math.max(0.7, Math.min(1, 0.7 + (map2gis.getZoom() - 11) * 0.075));
        mapEl.style.setProperty('--wish-k', k.toFixed(3));
      };
      map2gis.on('zoom', () => { if (!wishScaleRaf) wishScaleRaf = requestAnimationFrame(syncWishScale); scheduleWishDeclutter(); });
      map2gis.on('moveend', scheduleWishDeclutter);
      syncWishScale();

      syncPostMarkers(); syncWishMarkers(); startGeolocation();
    } catch (err) { console.error('[карта]', err); }
  }

  /* ═══════ НАСТРОЙКИ ═══════ */
  const SETTINGS_KEY = 'app.settings.v1';
  const DEFAULT_SETTINGS = { notifications: true, geolocation: true };
  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return { ...DEFAULT_SETTINGS };
      const parsed = JSON.parse(raw);
      if (parsed && 'offline' in parsed) delete parsed.offline;
      return { ...DEFAULT_SETTINGS, ...parsed };
    } catch { return { ...DEFAULT_SETTINGS }; }
  }
  function saveSettings(s) { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch {} }
  let settings = loadSettings();

  /* ═══════ ТЕМА ═══════ */
  // Начальную тему ставит скрипт в <head> (до отрисовки), здесь — переключение из настроек и смена системной
  const THEME_KEY = 'app.theme';
  // Карта — в стандартном стиле 2GIS. Свои стили из редактора 2GIS (styles.2gis.com) можно вписать сюда.
  const MAP_STYLE = { light: null, dark: null };
  const themeMq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function getThemePref() { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch { return 'auto'; } }
  function resolvedTheme(pref = getThemePref()) {
    return pref === 'dark' || (pref !== 'light' && themeMq && themeMq.matches) ? 'dark' : 'light';
  }
  let appliedTheme = null;
  function applyTheme() {
    const th = resolvedTheme();
    const root = document.documentElement;
    root.setAttribute('data-theme', th);
    const meta = document.getElementById('meta-theme-color');
    if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--land').trim() || (th === 'dark' ? '#090C0B' : '#E9EBE6'));
    if (th !== appliedTheme) { appliedTheme = th; applyMapStyle(); }
  }
  function applyMapStyle() {
    const id = MAP_STYLE[appliedTheme || resolvedTheme()];
    const mapEl = document.getElementById('map');
    if (mapEl) mapEl.dataset.mapStyle = id ? 'native' : 'filter';
    if (!map2gis || !id || typeof map2gis.setStyleById !== 'function') return;
    try { Promise.resolve(map2gis.setStyleById(id)).catch((err) => console.warn('[карта] стиль:', err)); }
    catch (err) { console.warn('[карта] стиль:', err); }
  }
  function setThemePref(pref) {
    try { localStorage.setItem(THEME_KEY, pref); } catch {}
    // плавный переход цветов только на время смены темы
    document.documentElement.classList.add('theme-switching');
    applyTheme();
    setTimeout(() => document.documentElement.classList.remove('theme-switching'), 450);
    document.querySelectorAll('[data-theme-pref]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themePref === pref)));
  }
  if (themeMq) {
    const onSystemTheme = () => { if (getThemePref() === 'auto') applyTheme(); };
    if (themeMq.addEventListener) themeMq.addEventListener('change', onSystemTheme); else if (themeMq.addListener) themeMq.addListener(onSystemTheme);
  }
  applyTheme();

  /* ═══════ 3D-АВАТАР ═══════
     Фигура собирается из простых тел — сфер, «капсул» и тел вращения. Мужская и женская фигуры

  const AVATAR_HAIR_STYLES = {
    male:   { none: 'Нет', buzz: 'Ёжик', short: 'Короткая', quiff: 'Кок', curly: 'Кудри' },
    female: { long: 'Длинные', bob: 'Каре', ponytail: 'Хвост', bun: 'Пучок', curly: 'Кудри' },
  };
  const AVATAR_OUTFITS = {
    male:   { tee: 'Футболка', hoodie: 'Худи', jacket: 'Куртка' },
    female: { tee: 'Топ', dress: 'Платье', hoodie: 'Худи' },
  };
  // Смена фигуры: причёска и одежда, которых у другой фигуры нет, заменяются на похожие
  const AVATAR_HAIR_SWAP = {
    male:   { long: 'short', bob: 'short', ponytail: 'short', bun: 'short' },
    female: { none: 'bob', buzz: 'bob', short: 'bob', quiff: 'bob' },
  };
  const AVATAR_OUTFIT_SWAP = { male: { dress: 'tee' }, female: { jacket: 'tee' } };
  // Старый формат: hair = none | short | long | blond | ginger — стиль и цвет вместе
  const AVATAR_LEGACY_HAIR = {
    none: ['none', 'espresso'], short: ['short', 'espresso'], long: ['long', 'chestnut'],
    blond: ['short', 'blond'], ginger: ['long', 'ginger'],
  };

  function defaultAvatarFor(gender) {
    return gender === 'female'
      ? { gender: 'female', skin: 'light', clothes: 'rose', hair: 'long', hairColor: 'chestnut', outfit: 'dress' }
      : { gender: 'male', skin: 'tan', clothes: 'ink', hair: 'short', hairColor: 'espresso', outfit: 'tee' };
  }

  // Любая конфигурация (своя, чужая, старого формата) → полная и допустимая для своей фигуры
  function normalizeAvatar(raw, genderHint) {
    const src = raw && typeof raw === 'object' ? raw : {};
    const gender = src.gender === 'female' || src.gender === 'male' ? src.gender : (genderHint === 'female' ? 'female' : 'male');
    const cfg = defaultAvatarFor(gender);
    if (AVATAR_SKINS[src.skin]) cfg.skin = src.skin;
    if (AVATAR_CLOTHES[src.clothes]) cfg.clothes = src.clothes;
    let hair = src.hair, color = src.hairColor;
    if (!AVATAR_HAIR_COLORS[color] && AVATAR_LEGACY_HAIR[hair]) [hair, color] = AVATAR_LEGACY_HAIR[hair];
    hair = AVATAR_HAIR_STYLES[gender][hair] ? hair : AVATAR_HAIR_SWAP[gender][hair];
    if (hair) cfg.hair = hair;
    if (AVATAR_HAIR_COLORS[color]) cfg.hairColor = color;
    const outfit = AVATAR_OUTFITS[gender][src.outfit] ? src.outfit : AVATAR_OUTFIT_SWAP[gender][src.outfit];
    if (outfit) cfg.outfit = outfit;
    return cfg;
  }

  // Аватар хранится по аккаунту: у разных людей на одном устройстве — свои
  function avatarStoreKey(uid) { return AVATAR_KEY + ':' + (uid || 'guest'); }
  function loadLocalAvatar(uid) {
    try { const raw = localStorage.getItem(avatarStoreKey(uid)); return raw ? JSON.parse(raw) : null; } catch { return null; }
  }
  function saveAvatarConfig(a) { try { localStorage.setItem(avatarStoreKey(currentUser && currentUser.id), JSON.stringify(a)); } catch {} }
  let avatarConfig = defaultAvatarFor('male');
  // Пока свой аватар не загружен, на сервер его не отправляем — иначе затрём сохранённый
  let avatarConfigReady = false;

  /* Свой аватар после входа: сначала тот, что сохранён на сервере (виден друзьям), потом — на этом
     устройстве, иначе — новый по полу из профиля. Старая конфигурация без пола получает фигуру по профилю. */
  async function loadMyAvatarConfig() {
    if (!currentUser) return;
    const uid = currentUser.id;
    let raw = null;
    try {
      const { data, error } = await supabaseClient.from('user_locations').select('avatar_config').eq('user_id', uid).maybeSingle();
      if (error) console.warn('[avatar] load:', error.message);
      raw = data && data.avatar_config;
    } catch (err) { console.warn('[avatar] load:', err); }
    if (!currentUser || currentUser.id !== uid) return;
    if (!raw || typeof raw !== 'object') raw = loadLocalAvatar(uid);
    avatarConfig = normalizeAvatar(raw, profile.gender);
    avatarConfigReady = true;
    saveAvatarConfig(avatarConfig);
    if (lastUserLocation && settings.geolocation) { placeUserMarker(lastUserLocation); upsertMyLocation(lastUserLocation); }
  }

  // Пропорции фигур (метры, ступни на y = 0). torso — профиль тела вращения: [радиус, высота]
  function avatarProportions(gender) {
    return gender === 'female' ? {
      headY: 1.655, headR: 0.138, headScale: [0.88, 0.98, 0.96], chin: [0.3, 0.15],
      neckR: 0.044, shoulderY: 1.405, shoulderX: 0.198, wristOut: 0.085, legX: 0.088, hipY: 0.9,
      thigh: 0.088, knee: 0.058, ankle: 0.04, armR: [0.047, 0.039, 0.032], hand: 0.85,
      torso: [[0, 0.84], [0.165, 0.85], [0.212, 0.9], [0.2, 0.98], [0.156, 1.1], [0.163, 1.19], [0.178, 1.27], [0.172, 1.35], [0.13, 1.42], [0.06, 1.465], [0, 1.47]],
      torsoZ: 0.68, waistY: 1.1, split: 1.02, bustY: 1.262,
      eyeX: 0.315, eyeR: 0.172, browW: 0.0035, noseK: 0.86,
    } : {
      headY: 1.705, headR: 0.146, headScale: [0.9, 1.0, 0.97], chin: [0.2, 0.2],
      neckR: 0.057, shoulderY: 1.45, shoulderX: 0.238, wristOut: 0.06, legX: 0.1, hipY: 0.92,
      thigh: 0.09, knee: 0.066, ankle: 0.05, armR: [0.058, 0.048, 0.04], hand: 1,
      torso: [[0, 0.86], [0.17, 0.87], [0.2, 0.92], [0.196, 1.02], [0.19, 1.12], [0.204, 1.24], [0.222, 1.34], [0.214, 1.42], [0.15, 1.48], [0.07, 1.51], [0, 1.515]],
      torsoZ: 0.66, waistY: 1.12, split: 1.0, bustY: 0,
      eyeX: 0.33, eyeR: 0.16, browW: 0.0068, noseK: 1,
    };
  }

  // «Капсула» с разными радиусами концов: от y = 0 (радиус r0) до y = len (радиус r1)
  function capsuleGeo(THREE, r0, r1, len, seg = 16) {
    const pts = [], n = 6;
    for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + (i / n) * (Math.PI / 2); pts.push(new THREE.Vector2(Math.cos(a) * r0, Math.sin(a) * r0)); }
    for (let i = 0; i <= n; i++) { const a = (i / n) * (Math.PI / 2); pts.push(new THREE.Vector2(Math.cos(a) * r1, len + Math.sin(a) * r1)); }
    pts[0].x = 0; pts[pts.length - 1].x = 0;
    return new THREE.LatheGeometry(pts, seg);
  }
  function profileRadius(pts, y) {
    if (y <= pts[0][1]) return pts[0][0];
    for (let i = 1; i < pts.length; i++) {
      const [r0, y0] = pts[i - 1], [r1, y1] = pts[i];
      if (y <= y1) return r0 + (r1 - r0) * ((y - y0) / ((y1 - y0) || 1));
    }
    return pts[pts.length - 1][0];
  }
  // Кусок профиля между y0 и y1 — с точками ровно на концах
  function profileRange(pts, y0, y1) {
    const out = [[profileRadius(pts, y0), y0]];
    for (const p of pts) if (p[1] > y0 + 1e-4 && p[1] < y1 - 1e-4) out.push(p);
    out.push([profileRadius(pts, y1), y1]);
    return out;
  }
  // Детерминированный «шум» — причёска одинаковая при каждой отрисовке
  function avatarRnd(i) { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

  // После деформации сферы нормали на её шве и на полюсах усредняем — иначе виден стык
  function smoothSphereNormals(geo, ws, hs, bottomPole = false) {
    const n = geo.attributes.normal;
    const avg = (ids) => {
      const s = ids.reduce((a, k) => [a[0] + n.getX(k), a[1] + n.getY(k), a[2] + n.getZ(k)], [0, 0, 0]);
      const l = Math.hypot(s[0], s[1], s[2]) || 1;
      ids.forEach((k) => n.setXYZ(k, s[0] / l, s[1] / l, s[2] / l));
    };
    for (let iy = 0; iy <= hs; iy++) avg([iy * (ws + 1), iy * (ws + 1) + ws]);
    avg(Array.from({ length: ws + 1 }, (_, k) => k));
    if (bottomPole) avg(Array.from({ length: ws + 1 }, (_, k) => hs * (ws + 1) + k));
  }

  function buildAvatarGroup(THREE, rawCfg) {
    const cfg = normalizeAvatar(rawCfg);
    const fem = cfg.gender === 'female';
    const P = avatarProportions(cfg.gender);
    const R = P.headR, HS = P.headScale;
    const dress = cfg.outfit === 'dress', hoodie = cfg.outfit === 'hoodie', jacket = cfg.outfit === 'jacket';
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const UP = V(0, 1, 0);
    const mix = (a, b, k) => new THREE.Color(a).lerp(new THREE.Color(b), k).getHex();
    const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();
    const mat = (hex, roughness = 0.8, extra = {}) => new THREE.MeshStandardMaterial({ color: lin(hex), roughness, metalness: 0, ...extra });

    const skinHex = AVATAR_SKINS[cfg.skin].base;
    const hairHex = AVATAR_HAIR_COLORS[cfg.hairColor].hex;
    const cloth = AVATAR_CLOTHES[cfg.clothes];
    const lightHair = cfg.hairColor === 'blond' || cfg.hairColor === 'platinum';

    // кожа чуть «светится» тёплым изнутри — так она выглядит живой, а не пластиковой
    const skin = mat(skinHex, 0.5, { emissive: lin(mix(skinHex, 0xFF5A3C, 0.35)), emissiveIntensity: 0.07 });
    const top = mat(cloth.body, 0.82);
    const topOpen = mat(cloth.body, 0.82, { side: THREE.DoubleSide });
    const pants = mat(cloth.legs, 0.9);
    const hairM = mat(hairHex, 0.46, { side: THREE.DoubleSide });
    const browM = mat(mix(hairHex, 0x2A1D16, lightHair ? 0.45 : 0.25), 0.7);
    const lipM = mat(mix(skinHex, fem ? 0xC4475F : 0xA0504A, fem ? 0.58 : 0.36), 0.42);
    const eyeWhite = mat(0xF6F3EF, 0.32), irisM = mat(fem ? 0x5A3A26 : 0x4A3022, 0.28), pupilM = mat(0x0E0B0A, 0.2);
    const shineM = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
    const goldM = mat(0xE3BE70, 0.28, { metalness: 0.7 });

    const group = new THREE.Group();
    const add = (parent, geo, m, pos, scale, rot) => {
      const mesh = new THREE.Mesh(geo, m);
      if (pos) mesh.position.copy(pos);
      if (scale) mesh.scale.set(scale[0], scale[1], scale[2]);
      if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
      parent.add(mesh);
      return mesh;
    };
    const ball = (r, w = 24, h = 16) => new THREE.SphereGeometry(r, w, h);
    const limb = (parent, a, b, r0, r1, m, seg = 16) => {
      const d = V(0, 0, 0).subVectors(b, a);
      const mesh = new THREE.Mesh(capsuleGeo(THREE, r0, r1, d.length(), seg), m);
      mesh.position.copy(a);
      mesh.quaternion.setFromUnitVectors(UP, d.normalize());
      parent.add(mesh);
      return mesh;
    };
    // шов тела вращения — сзади (phiStart = π), чтобы спереди не было видно стыка
    const lathe = (parent, pts, m, zScale = 1, inflate = 0, phiStart = Math.PI, phiLen = Math.PI * 2) => {
      const g = new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r > 0 ? r + inflate : 0, y)), 44, phiStart, phiLen);
      const mesh = new THREE.Mesh(g, m);
      mesh.scale.z = zScale;
      parent.add(mesh);
      return mesh;
    };
    const ring = (parent, r, tube, y, m, zScale = 1) =>
      add(parent, new THREE.TorusGeometry(r, tube, 8, 44), m, V(0, y, 0), [1, zScale, 1], [Math.PI / 2, 0, 0]);

    /* ── Туловище: низ — брюки (у платья — та же ткань), верх — одежда чуть поверх ── */
    const T = P.torso, yBot = T[0][1], yTop = T[T.length - 1][1];
    const bulk = hoodie ? 0.014 : 0.005;
    const frontZ = (y, extra = 0) => (profileRadius(T, y) + extra) * P.torsoZ;
    lathe(group, profileRange(T, yBot, P.split + 0.015), dress ? top : pants, P.torsoZ);
    const shirt = jacket ? mat(0xF1EFEA, 0.85) : top;
    const chest = lathe(group, profileRange(T, P.split - 0.03, yTop), shirt, P.torsoZ, bulk);
    ring(group, profileRadius(T, P.split - 0.03) + bulk, hoodie ? 0.014 : 0.008, P.split - 0.03, shirt, P.torsoZ);
    if (fem) {
      // женский силуэт: грудь — плавный изгиб самой ткани спереди, без отдельных форм
      const amp = (hoodie ? 0.018 : 0.028) / P.torsoZ;
      const pos = chest.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        if (z <= 0) continue;
        const r = Math.hypot(x, z) || 1;
        const lobes = Math.exp(-(((x - 0.068) / 0.052) ** 2)) + Math.exp(-(((x + 0.068) / 0.052) ** 2));
        const dy = (y - P.bustY) / (y < P.bustY ? 0.045 : 0.065);
        pos.setZ(i, z + amp * Math.min(1, lobes) * Math.exp(-dy * dy) * (z / r) ** 2);
      }
      chest.geometry.computeVertexNormals();
    }
    if (!fem && !hoodie) ring(group, P.neckR + 0.013, 0.011, yTop - 0.024, shirt);   // круглый ворот
    if (hoodie) {
      add(group, new THREE.TorusGeometry(P.neckR + 0.05, fem ? 0.03 : 0.036, 10, 28), top, V(0, P.shoulderY + 0.03, -0.03), [1, 0.8, 1], [Math.PI / 2 - 0.5, 0, 0]);
      const py = P.split + 0.075;
      add(group, ball(0.09), mat(mix(cloth.body, 0x000000, 0.14), 0.85), V(0, py, frontZ(py, bulk) - 0.024), [fem ? 1.15 : 1.35, 0.55, 0.32]);
      const cord = mat(0xF3F1EC, 0.6);
      for (const s of [-1, 1]) {
        const a = V(s * 0.03, P.shoulderY - 0.005, frontZ(P.shoulderY - 0.005, bulk) + 0.004);
        const b = V(s * 0.034, P.shoulderY - 0.12, frontZ(P.shoulderY - 0.12, bulk) + 0.004);
        limb(group, a, b, 0.0045, 0.0045, cord, 6);
        add(group, ball(0.0075, 10, 8), cord, b);
      }
    }
    if (jacket) {
      // расстёгнутая куртка поверх белой футболки: оболочка с разрезом спереди, лацканы и воротник
      lathe(group, profileRange(T, P.split - 0.06, yTop - 0.014), topOpen, P.torsoZ, 0.02, Math.PI * 0.16, Math.PI * 1.68);
      for (const s of [-1, 1]) {
        const ly = P.shoulderY - 0.085;
        add(group, new THREE.BoxGeometry(0.045, 0.16, 0.012), top, V(s * 0.07, ly, frontZ(ly, 0.02) + 0.004), null, [-0.18, 0, s * 0.36]);
      }
      add(group, new THREE.TorusGeometry(P.neckR + 0.03, 0.017, 8, 28, Math.PI * 1.3), top, V(0, yTop - 0.03, -0.004), null, [-Math.PI / 2, 0, -0.15 * Math.PI]);
    }
    if (dress) {
      // юбка-«колокол» до колена и тонкий пояс
      lathe(group, [[0.152, P.waistY + 0.01], [0.19, 1.02], [0.229, 0.9], [0.258, 0.73], [0.279, 0.565], [0.272, 0.54], [0.258, 0.535]], topOpen, 0.8);
      ring(group, profileRadius(T, P.waistY) + 0.011, 0.011, P.waistY, mat(mix(cloth.body, 0x000000, 0.3), 0.6), P.torsoZ);
    }

    /* ── Руки ── */
    const longSleeve = hoodie || jacket;
    const [ra, re, rw] = P.armR;
    for (const s of [-1, 1]) {
      const sh = V(s * P.shoulderX, P.shoulderY - 0.035, 0);
      const el = V(s * (P.shoulderX + 0.032), P.shoulderY - 0.31, -0.022);
      const wr = V(s * (P.shoulderX + P.wristOut), P.shoulderY - 0.565, 0.03);
      add(group, ball(ra + (longSleeve ? 0.012 : 0.009)), top, sh, [1, 0.9, 0.92]);
      if (longSleeve) {
        limb(group, sh, el, ra + 0.01, re + 0.01, top);
        limb(group, el, wr, re + 0.01, rw + 0.012, top);
      } else {
        limb(group, sh, el, ra, re, skin);
        limb(group, el, wr, re, rw, skin);
        limb(group, sh, sh.clone().lerp(el, 0.46), ra + 0.009, ra + 0.006, top);   // короткий рукав
      }
      const dir = V(0, 0, 0).subVectors(wr, el).normalize();
      const hc = wr.clone().addScaledVector(dir, 0.052 * P.hand);
      const hand = add(group, ball(0.046 * P.hand, 20, 14), skin, hc, [0.8, 1.2, 0.56]);
      hand.quaternion.setFromUnitVectors(UP, dir);
      add(group, ball(0.016 * P.hand, 12, 8), skin, hc.clone().add(V(-s * 0.004, 0.014, 0.026 * P.hand)), [0.9, 1.4, 0.9]);
    }

    /* ── Ноги и обувь ── */
    for (const s of [-1, 1]) {
      const hip = V(s * P.legX, P.hipY, 0), knee = V(s * P.legX * 0.9, 0.5, 0.014), ank = V(s * P.legX * 0.84, 0.115, -0.004);
      const legM = dress ? skin : pants;
      const kneeR = dress ? P.knee : P.knee + (fem ? 0.004 : 0.01);
      const ankR = dress ? P.ankle : P.ankle + (fem ? 0.004 : 0.012);
      limb(group, hip, knee, P.thigh + (dress ? -0.006 : 0.004), kneeR, legM);
      limb(group, knee, ank, kneeR, ankR, legM);
      const sz = fem ? 0.84 : 1;
      const upper = fem ? (dress ? 0x2B2228 : 0xF1EEE9) : 0x2B2C31;
      const sole = fem ? (dress ? 0x1A1518 : 0xDAD4CC) : 0xF3F1EC;
      add(group, ball(0.07 * sz), mat(upper, 0.6), V(ank.x, 0.055 * sz + 0.004, 0.04 * sz), [0.78, 0.6, 1.5]);
      add(group, ball(0.07 * sz), mat(sole, 0.75), V(ank.x, 0.02, 0.042 * sz), [0.85, 0.28, 1.56]);
    }

    /* ── Шея и голова ── */
    limb(group, V(0, yTop - 0.06, -0.006), V(0, P.headY - 0.075, 0.004), P.neckR, P.neckR * 0.94, skin);
    const head = new THREE.Group();
    head.position.set(0, P.headY, 0.008);
    group.add(head);
    group.userData.head = head;
    /* Голова — одна плавная форма без швов: сфера, нижняя половина которой сужается к подбородку
       (у женской фигуры — сильнее, лицо уже и мягче), вытягивается вниз и чуть выдвигается вперёд. */
    const [KX, KY] = P.chin, KZ = 0.1, KF = 0.1;
    const headGeo = new THREE.SphereGeometry(R, 48, 36);
    const hp = headGeo.attributes.position;
    const deformHead = (x, y, z) => {
      if (y >= 0) return [x, y, z];
      const t = -y / R;
      return [x * (1 - KX * t * Math.sqrt(t)), y * (1 + KY * t), z * (1 - KZ * t * (z < 0 ? 2 : 0.4)) + KF * R * t];
    };
    for (let i = 0; i < hp.count; i++) {
      const p = deformHead(hp.getX(i), hp.getY(i), hp.getZ(i));
      hp.setXYZ(i, p[0], p[1], p[2]);
    }
    headGeo.computeVertexNormals();
    smoothSphereNormals(headGeo, 48, 36, true);
    add(head, headGeo, skin, null, HS);
    // глубина лица в точке (x, y) — та же формула деформации, решённая обратно
    const faceZ = (x, y) => {
      const ys = y / HS[1];
      const y0 = ys < 0 ? (1 - Math.sqrt(1 - 4 * (KY / R) * ys)) / (2 * KY / R) : ys;
      const t = y0 < 0 ? -y0 / R : 0;
      const x0 = x / HS[0] / (1 - KX * t * Math.sqrt(t));
      const q = R * R - x0 * x0 - y0 * y0;
      return q > 0 ? (Math.sqrt(q) * (1 - KZ * t * 0.4) + KF * R * t) * HS[2] : 0;
    };
    for (const s of [-1, 1]) {
      add(head, ball(R * 0.25, 16, 12), skin, V(s * R * HS[0] * 0.97, -R * 0.05, -R * 0.05), [0.42, 0.8, 0.62], [0, s * 0.35, 0]);
      if (fem) add(head, ball(0.0075, 10, 8), goldM, V(s * R * HS[0] * 0.99, -R * 0.33, -R * 0.03));
    }

    // глаза: белок, радужка, зрачок, блик и верхнее веко
    const er = R * P.eyeR, ey = R * 0.07;
    for (const s of [-1, 1]) {
      const x = s * R * P.eyeX, z0 = faceZ(x, ey) - er * 0.25;
      add(head, ball(er, 20, 14), eyeWhite, V(x, ey, z0), [1, 0.78, 0.55]);
      const front = z0 + er * 0.55, ir = er * 0.56;
      add(head, ball(ir, 16, 12), irisM, V(x, ey - er * 0.04, front - ir * 0.5 + 0.0012), [1, 1, 0.5]);
      add(head, ball(ir * 0.5, 12, 8), pupilM, V(x, ey - er * 0.04, front - ir * 0.25 + 0.0022), [1, 1, 0.5]);
      add(head, ball(ir * 0.26, 8, 6), shineM, V(x + ir * 0.35, ey + ir * 0.3, front + 0.003));
      add(head, new THREE.SphereGeometry(er * 1.1, 20, 10, 0, Math.PI * 2, 0, Math.PI * 0.32), skin, V(x, ey, z0), [1, 0.8, 0.58], [0.22, 0, 0]);
      if (fem) {
        add(head, new THREE.TorusGeometry(er * 1.06, 0.0021, 6, 18, Math.PI), pupilM, V(x, ey + er * 0.08, z0 + er * 0.3), [1, 0.62, 1], [0.2, 0, 0]);
        add(head, new THREE.BoxGeometry(0.008, 0.0022, 0.003), pupilM, V(x + s * er * 1.08, ey + er * 0.18, z0 + er * 0.24), null, [0, 0, s * 0.5]);
      }
      // брови: у мужской фигуры прямые и плотные, у женской — тонкие с изгибом
      const by = R * 0.43;
      const pts = [V(s * R * 0.14, by + 0.002, 0), V(s * R * 0.33, by + (fem ? 0.012 : 0.006), 0), V(s * R * 0.52, by + (fem ? 0.001 : 0.002), 0)];
      pts.forEach((p) => { p.z = faceZ(p.x, p.y) + 0.0015; });
      limb(head, pts[0], pts[1], P.browW * 1.15, P.browW, browM, 8);
      limb(head, pts[1], pts[2], P.browW, P.browW * 0.65, browM, 8);
    }

    // нос: спинка, кончик и крылья
    const nk = P.noseK;
    const nTop = V(0, R * 0.22, faceZ(0, R * 0.22) - 0.004), nTip = V(0, -R * 0.2, faceZ(0, -R * 0.2) + 0.012 * nk);
    limb(head, nTop, nTip, 0.0085 * nk, 0.0135 * nk, skin, 12);
    add(head, ball(0.0172 * nk, 16, 12), skin, nTip.clone().add(V(0, -0.004, 0.002)), [1.1, 0.9, 0.95]);
    for (const s of [-1, 1]) add(head, ball(0.0105 * nk, 12, 8), skin, V(s * 0.0135 * nk, nTip.y - 0.007, nTip.z - 0.009), [1.1, 0.85, 0.9]);

    // губы: у мужской фигуры — сдержанная улыбка, у женской — пухлые губы с «луком Купидона»
    const my = -R * 0.6, mz = faceZ(0, my);
    if (fem) {
      for (const s of [-1, 1]) add(head, ball(0.0085, 14, 10), lipM, V(s * 0.0072, my + 0.0055, mz - 0.0035), [1.55, 0.6, 0.6], [0, 0, s * 0.22]);
      add(head, ball(0.0105, 16, 10), lipM, V(0, my - 0.0045, mz - 0.004), [1.75, 0.68, 0.62]);
      const blush = mat(0xEE8C8C, 0.6, { transparent: true, opacity: 0.3, depthWrite: false });
      for (const s of [-1, 1]) add(head, ball(0.024, 16, 10), blush, V(s * R * 0.5, -R * 0.25, faceZ(s * R * 0.5, -R * 0.25) - 0.004), [1, 0.62, 0.3]);
    } else {
      const arc = Math.PI * 0.62, rr = R * 0.16;
      add(head, new THREE.TorusGeometry(rr, 0.0042, 8, 18, arc), lipM, V(0, my + rr * 0.9, mz - 0.003), [1, 1, 0.6], [0, 0, -Math.PI / 2 - arc / 2]);
    }

    /* ── Причёска ── */
    /* «Шапка» волос облегает голову (та же деформация, что у головы) и идёт по естественной линии роста:
       высоко надо лбом, ниже у висков, над ушами и низко на затылке. Линия — угол от макушки в градусах:
       спереди, у виска, над ухом, за ухом и сзади. */
    const HAIRLINE = {
      short: [60, 70, 80, 112, 136], buzz: [62, 72, 80, 110, 134], curly: [58, 68, 80, 112, 136],
      flowing: [62, 78, 96, 116, 136], sleek: [60, 76, 88, 114, 136],
    };
    const hairlineAt = (line, az) => {
      const a = Math.abs((((az + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) - Math.PI) * 180 / Math.PI;
      const keys = [0, 45, 90, 130, 180];
      for (let i = 1; i < keys.length; i++) {
        if (a > keys[i]) continue;
        const k = (a - keys[i - 1]) / (keys[i] - keys[i - 1]), s = k * k * (3 - 2 * k);
        return (line[i - 1] + (line[i] - line[i - 1]) * s) * Math.PI / 180;
      }
      return line[4] * Math.PI / 180;
    };
    // точка на «шапке»: frac — доля от макушки до линии роста, az — угол вокруг головы (0 — лоб, к +x)
    const hairPoint = (line, frac, az) => {
      const th = frac * hairlineAt(line, az);
      return deformHead(R * Math.sin(th) * Math.sin(az), R * Math.cos(th), R * Math.sin(th) * Math.cos(az));
    };
    const cap = (line, k, m = hairM) => {
      const ws = 56, hsg = 18;
      const g = new THREE.SphereGeometry(R, ws, hsg, 0, Math.PI * 2, 0, Math.PI / 2);
      const pos = g.attributes.position;
      for (let iy = 0; iy <= hsg; iy++) {
        for (let ix = 0; ix <= ws; ix++) {
          const frac = iy / hsg, p = hairPoint(line, frac, (ix / ws) * Math.PI * 2 - Math.PI / 2);
          // объём сверху, а к линии роста волосы прилегают к коже — край не отстоит от головы
          const w = 1 - 0.88 * frac * frac * frac;
          pos.setXYZ(iy * (ws + 1) + ix, p[0] * HS[0] * (1 + (k[0] - 1) * w), p[1] * HS[1] * (1 + (k[1] - 1) * w), p[2] * HS[2] * (1 + (k[2] - 1) * w));
        }
      }
      g.computeVertexNormals();
      smoothSphereNormals(g, ws, hsg);
      return add(head, g, m);
    };
    const curls = (list) => {
      const im = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 10), hairM, list.length);
      const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = V(1, 1, 1);
      list.forEach((c, i) => { sc.setScalar(c.r); m4.compose(c.p, q, sc); im.setMatrixAt(i, m4); });
      im.instanceMatrix.needsUpdate = true;
      head.add(im);
    };
    const topCurls = (n, line, k, rMin, rMax) => {
      const out = [];
      for (let i = 0; i < n; i++) {
        const p = hairPoint(line, Math.sqrt((i + 0.5) / n) * 0.9, i * 2.39996);
        out.push({ p: V(p[0] * HS[0] * k[0], p[1] * HS[1] * k[1], p[2] * HS[2] * k[2]), r: rMin + (rMax - rMin) * avatarRnd(i) });
      }
      return out;
    };
    const hs = cfg.hair;
    if (!fem) {
      if (hs === 'buzz') cap(HAIRLINE.buzz, [1.03, 1.04, 1.04], mat(mix(hairHex, skinHex, 0.28), 0.8));
      if (hs === 'short') {
        // короткая стрижка: объём сверху и мягкая чёлка, зачёсанная набок
        cap(HAIRLINE.short, [1.07, 1.16, 1.09]);
        add(head, ball(R * 0.34, 24, 16), hairM, V(R * 0.14, R * 0.64, R * 0.7), [1.55, 0.42, 0.62], [-0.85, 0, -0.28]);
      }
      if (hs === 'quiff') {
        cap(HAIRLINE.short, [1.05, 1.07, 1.06]);
        add(head, ball(R * 0.56, 28, 18), hairM, V(0, R * 0.9, R * 0.4), [1.12, 0.72, 1.1], [-0.38, 0, 0]);
      }
      if (hs === 'curly') {
        cap(HAIRLINE.curly, [1.06, 1.1, 1.08]);
        curls(topCurls(48, HAIRLINE.curly, [1.1, 1.13, 1.11], R * 0.15, R * 0.21));
      }
    } else {
      if (hs === 'long' || hs === 'bob' || hs === 'curly') cap(HAIRLINE.flowing, [1.07, 1.09, 1.08]);
      if (hs === 'ponytail' || hs === 'bun') cap(HAIRLINE.sleek, [1.04, 1.05, 1.05]);
      if (hs === 'long') {
        // прямые длинные волосы до груди, спереди открывают лицо; косая чёлка
        lathe(head, [[R * 0.6, R * 0.85], [R * 0.92, R * 0.4], [R * 1.04, -R * 0.1], [R * 1.1, -R * 0.85], [R * 1.13, -R * 1.6], [R * 1.11, -R * 2.2], [R * 1.02, -R * 2.42], [R * 0.93, -R * 2.46]],
          hairM, 1, 0, Math.PI * 0.3, Math.PI * 1.4).scale.x = 0.98;
        add(head, ball(R * 0.5, 24, 16), hairM, V(R * 0.2, R * 0.63, R * 0.58), [1.3, 0.42, 0.72], [-0.38, 0, -0.38]);
      }
      if (hs === 'bob') {
        // каре до подбородка с прямой чёлкой
        lathe(head, [[R * 0.6, R * 0.85], [R * 0.95, R * 0.35], [R * 1.1, -R * 0.15], [R * 1.16, -R * 0.62], [R * 1.15, -R * 0.9], [R * 1.07, -R * 1.04], [R * 0.97, -R * 1.07]],
          hairM, 1, 0, Math.PI * 0.26, Math.PI * 1.48).scale.x = 0.98;
        add(head, ball(R * 0.6, 28, 16), hairM, V(0, R * 0.56, R * 0.58), [1.3, 0.38, 0.7], [-0.55, 0, 0]);
      }
      if (hs === 'ponytail') {
        const base = V(0, R * 0.28, -R * 1.02);
        add(head, new THREE.TorusGeometry(R * 0.2, R * 0.07, 8, 18), mat(mix(hairHex, 0x000000, 0.4), 0.5), base, null, [0.95, 0, 0]);
        const pts = [base, V(0, R * 0.02, -R * 1.38), V(0, -R * 0.75, -R * 1.5), V(0, -R * 1.6, -R * 1.34), V(0, -R * 2.0, -R * 1.18)];
        const rad = [R * 0.22, R * 0.24, R * 0.2, R * 0.13, R * 0.04];
        for (let i = 0; i < pts.length - 1; i++) limb(head, pts[i], pts[i + 1], rad[i], rad[i + 1], hairM, 14);
      }
      if (hs === 'bun') {
        const bc = V(0, R * 0.92, -R * 0.55);
        add(head, ball(R * 0.46, 24, 18), hairM, bc, [1, 0.92, 1]);
        add(head, new THREE.TorusGeometry(R * 0.36, R * 0.09, 8, 20), hairM, bc.clone().add(V(0, -R * 0.2, R * 0.06)), null, [Math.PI / 2 - 0.5, 0, 0]);
      }
      if (hs === 'curly') {
        // пышные кудри: макушка и объём по бокам и сзади до плеч
        const list = topCurls(36, HAIRLINE.flowing, [1.1, 1.12, 1.1], R * 0.16, R * 0.22);
        const n = 120;
        for (let i = 0; i < n; i++) {
          const y = R * (0.55 - ((i + 0.5) / n) * 2.15);
          const az = Math.PI * 0.27 + ((i * 0.618034) % 1) * Math.PI * 1.46;
          const rr = R * (1.06 + 0.22 * Math.min(1, Math.max(0, (0.3 * R - y) / (1.6 * R))));
          list.push({ p: V(Math.sin(az) * rr * 0.97, y, Math.cos(az) * rr), r: R * (0.19 + 0.07 * avatarRnd(i + 50)) });
        }
        curls(list);
      }
    }
    return group;
  }

  // Свет «студии»: тёплый основной, холодная заливка и два цветных контровых в цветах «Призмы»
  function addAvatarLights(THREE, scene) {
    scene.add(new THREE.HemisphereLight(0xFFFFFF, 0x6A5D57, 0.62));
    const key = new THREE.DirectionalLight(0xFFF1E4, 1.15); key.position.set(2.2, 3.6, 3.4); scene.add(key);
    const fill = new THREE.DirectionalLight(0xD3DCFF, 0.38); fill.position.set(-3, 1.4, 2.2); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xB9A2FF, 0.75); rim.position.set(-2.2, 2.6, -3.4); scene.add(rim);
    const rim2 = new THREE.DirectionalLight(0x86E8F0, 0.4); rim2.position.set(2.6, 1.6, -3); scene.add(rim2);
  }
  // Мягкая тень под ногами — градиент, а не тяжёлые карты теней
  function avatarShadow(THREE) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 2, 64, 64, 63);
    gr.addColorStop(0, 'rgba(0,0,0,0.45)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.18)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.62), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    mesh.rotation.x = -Math.PI / 2; mesh.position.y = 0.003;
    return mesh;
  }
  function makeAvatarRenderer(THREE, canvas, preserve) {
    const r = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: !!preserve });
    r.outputEncoding = THREE.sRGBEncoding;
    r.toneMapping = THREE.ACESFilmicToneMapping;
    r.toneMappingExposure = 1.15;
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    return r;
  }
  function disposeObject(root) {
    root.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
      ms.forEach((m) => { if (m.map) m.map.dispose(); m.dispose(); });
    });
  }

  /* Сцена с аватаром. framing: 'full' — в полный рост, 'bust' — портрет по плечи.
     Камера к новой точке переезжает плавно (в редакторе — кнопка «крупно»). */
  function createAvatarScene(THREE, cfg, { framing = 'full', aspect = 1 } = {}) {
    const scene = new THREE.Scene();
    addAvatarLights(THREE, scene);
    scene.add(avatarShadow(THREE));
    const camera = new THREE.PerspectiveCamera(30, aspect, 0.05, 30);
    const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), curPos = new THREE.Vector3(), curLook = new THREE.Vector3();
    let group = null, P = null, mode = framing, aimed = false;
    const aim = () => {
      if (mode === 'bust') { camPos.set(0, P.headY - 0.03, 1.32); camLook.set(0, P.headY - 0.09, 0); }
      else { camPos.set(0, 1.06, 3.75); camLook.set(0, 0.94, 0); }
      if (!aimed) { curPos.copy(camPos); curLook.copy(camLook); aimed = true; }
    };
    const setConfig = (c) => {
      if (group) { scene.remove(group); disposeObject(group); }
      group = buildAvatarGroup(THREE, c);
      P = avatarProportions(normalizeAvatar(c).gender);
      scene.add(group);
      aim();
    };
    setConfig(cfg);
    return {
      scene, camera, setConfig,
      setFraming(f) { mode = f; aim(); },
      get framing() { return mode; },
      animate(t, yaw = 0, sway = 1) {
        group.rotation.y = yaw + Math.sin(t * 0.55) * 0.3 * sway;
        const head = group.userData.head;
        if (head) { head.rotation.z = Math.sin(t * 0.8) * 0.03 * sway; head.rotation.x = Math.sin(t * 0.63 + 1) * 0.025 * sway; }
        curPos.lerp(camPos, 0.12); curLook.lerp(camLook, 0.12);
        camera.position.copy(curPos); camera.lookAt(curLook);
      },
      resize(a) { camera.aspect = a; camera.updateProjectionMatrix(); },
      dispose() { disposeObject(scene); },
    };
  }

  // opts: framing ('full' | 'bust'), still — один неподвижный кадр (снимок для карты), yaw — поворот
  function renderAvatarToCanvas(canvas, size, cfg, opts = {}) {
    if (!isThreeAvailable()) return false;
    const THREE = window.THREE;
    const { framing = 'full', still = false, yaw = 0.18 } = opts;
    try {
      const renderer = makeAvatarRenderer(THREE, canvas, true);
      renderer.setSize(size, size, false);
      const av = createAvatarScene(THREE, cfg, { framing });
      let raf = null;
      const draw = (now) => { av.animate(now / 1000, yaw, still ? 0 : 1); renderer.render(av.scene, av.camera); };
      if (still) draw(0);
      else { const tick = (now) => { draw(now); raf = requestAnimationFrame(tick); }; tick(performance.now()); }
      // остановить и освободить WebGL-контекст: маркер пересоздаётся, а число контекстов у браузера ограничено
      canvas.__avatarStop = () => {
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        try { av.dispose(); renderer.dispose(); renderer.forceContextLoss(); } catch {}
      };
      return true;
    } catch (err) { console.warn('[аватар]', err); return false; }
  }

  const avatarSnapshotCache = new Map();

  function avatarCfgKey(cfg) {
    if (!cfg || typeof cfg !== 'object') return '';
    const c = normalizeAvatar(cfg);
    return [c.gender, c.skin, c.clothes, c.hair, c.hairColor, c.outfit].join('|');
  }

  function getAvatarSnapshotDataURL(cfg, framing = 'full') {
    if (!isThreeAvailable() || !cfg || typeof cfg !== 'object') return null;
    const key = avatarCfgKey(cfg) + '|' + framing;
    if (avatarSnapshotCache.has(key)) return avatarSnapshotCache.get(key);
    try {
      const size = framing === 'bust' ? 128 : 112;
      const off = document.createElement('canvas');
      off.width = size; off.height = size;
      const ok = renderAvatarToCanvas(off, size, cfg, { framing, still: true, yaw: 0.3 });
      if (!ok) { avatarSnapshotCache.set(key, null); return null; }
      const dataUrl = off.toDataURL('image/png');
      if (off.__avatarStop) { off.__avatarStop(); off.__avatarStop = null; }
      avatarSnapshotCache.set(key, dataUrl);
      return dataUrl;
    } catch (err) {
      console.warn('[avatar snapshot]', err);
      avatarSnapshotCache.set(key, null);
      return null;
    }
  }

  /* ═══════ МАРКЕР ПОЛЬЗОВАТЕЛЯ ═══════ */
  let userLocationMarker = null;
  let userLocationWatchId = null;
  let lastUserLocation = null;
  let userAvatarCanvas = null;
  let userMarkerKey = '';

  function placeUserMarker(coords) {
    if (!map2gis) return;
    // Над собой: моё текущее желание и желание группы, где я лидер
    const clouds = currentUser ? personWishClouds(currentUser.id, profile, wishGroupsOf(currentUser.id), false) : [];
    const key = [profile.name, profile.avatar, avatarCfgKey(avatarConfig), wishCloudsKey(clouds)].join('§');
    // Ничего не поменялось — только двигаем маркер, не пересоздавая 3D-аватар
    if (userLocationMarker && key === userMarkerKey) {
      try { userLocationMarker.setCoordinates(coords); scheduleWishDeclutter(); return; } catch {}
    }
    userMarkerKey = key;
    if (userLocationMarker) {
      try { if (userAvatarCanvas && userAvatarCanvas.__avatarStop) userAvatarCanvas.__avatarStop(); userLocationMarker.destroy(); } catch {}
      userLocationMarker = null; userAvatarCanvas = null;
    }
    const use3D = isThreeAvailable();
    const wrap = document.createElement('div');
    wrap.className = 'user-avatar-wrap';
    wrap.dataset.ownMarker = '1';
    const nameInitial = (profile.name || '?').trim().charAt(0).toUpperCase() || '?';
    const displayName = (profile.name || '').trim();
    let label = displayName || 'Я';
    if (label.length > 18) label = label.slice(0, 17) + '…';
    const avatarInner = profile.avatar
      ? `<div class="user-badge-avatar" style="background-image:url('${safeUrl(profile.avatar)}')"></div>`
      : `<div class="user-badge-avatar">${escapeHtml(nameInitial)}</div>`;
    const badge = document.createElement('div');
    badge.className = 'user-badge'; badge.dataset.clickable = 'true';
    // Себя я всегда вижу просто по имени — иконку группы видят только те, кто не в ней
    badge.innerHTML = `
      ${wishAnchorsHtml(clouds)}
      <div class="user-badge-inner">
        ${avatarInner}
        <span class="user-badge-name">${escapeHtml(label)}</span>
        <span class="user-badge-status" aria-hidden="true"></span>
      </div>`;
    badge.addEventListener('click', (e) => {
      if (openMapGroup(e)) return;                     // облако группы — карточка группы
      e.stopPropagation();
      showApp('profile');
      if (e.target.closest('[data-wish-mine]')) showWishesScreen(); else showUserProfileScreen();
    });
    wrap.appendChild(badge);
    wrap.insertAdjacentHTML('beforeend', signalRingsHtml('is-me'));
    if (use3D) {
      const inner = document.createElement('div'); inner.className = 'user-avatar-marker';
      const canvas = document.createElement('canvas'); canvas.width = 44; canvas.height = 44;
      inner.appendChild(canvas); wrap.appendChild(inner);
      const ok = renderAvatarToCanvas(canvas, 44, avatarConfig);
      if (ok) userAvatarCanvas = canvas; else inner.className = 'user-dot-marker';
    } else {
      const dot = document.createElement('div'); dot.className = 'user-dot-marker'; wrap.appendChild(dot);
    }
    userLocationMarker = new mapgl.HtmlMarker(map2gis, { coordinates: coords, html: wrap, anchor: use3D ? [0.5, 0.85] : [0.5, 0.5], preventMapInteractions: true });
    scheduleWishDeclutter();
  }

  // Перерисовать свой маркер (например, создали группу или поменяли её желание)
  function refreshMyMarker() {
    if (lastUserLocation && settings.geolocation && userLocationMarker) placeUserMarker(lastUserLocation);
  }

  function startGeolocation() {
    if (!settings.geolocation) return;
    if (!('geolocation' in navigator)) return;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const coords = [pos.coords.longitude, pos.coords.latitude];
        lastUserLocation = coords;
        if (map2gis) { map2gis.setCenter(coords); map2gis.setZoom(16); }
        placeUserMarker(coords); syncWishMarkers();
        upsertMyLocation(coords);
        const btn = document.getElementById('geo-btn'); if (btn) btn.classList.add('is-active');
      },
      (err) => console.info('[гео]', err.message),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
    if (userLocationWatchId === null) {
      userLocationWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const coords = [pos.coords.longitude, pos.coords.latitude];
          lastUserLocation = coords;
          placeUserMarker(coords);
          syncWishMarkers();
          upsertMyLocation(coords);
        },
        (err) => console.info('[гео watch]', err.message),
        { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 }
      );
    }
  }
  function stopGeolocation() {
    if (userLocationWatchId !== null) { try { navigator.geolocation.clearWatch(userLocationWatchId); } catch {} userLocationWatchId = null; }
    if (userLocationMarker) { try { if (userAvatarCanvas && userAvatarCanvas.__avatarStop) userAvatarCanvas.__avatarStop(); userLocationMarker.destroy(); } catch {} userLocationMarker = null; }
    userAvatarCanvas = null; lastUserLocation = null;
    const btn = document.getElementById('geo-btn'); if (btn) btn.classList.remove('is-active');
  }
  function goToUserLocation() {
    if (!map2gis) return;
    if (!settings.geolocation) { settings.geolocation = true; saveSettings(settings); syncSettingsUi(); startGeolocation(); return; }
    if (lastUserLocation) { map2gis.setCenter(lastUserLocation); map2gis.setZoom(16); placeUserMarker(lastUserLocation); syncWishMarkers(); upsertMyLocation(lastUserLocation); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const coords = [pos.coords.longitude, pos.coords.latitude];
        lastUserLocation = coords;
        map2gis.setCenter(coords); map2gis.setZoom(16);
        placeUserMarker(coords); syncWishMarkers();
        upsertMyLocation(coords);
        const btn = document.getElementById('geo-btn'); if (btn) btn.classList.add('is-active');
      },
      (err) => console.warn('[гео]', err.message),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }
  function syncSettingsUi() {
    document.querySelectorAll('.switch[data-setting]').forEach((el) => {
      el.setAttribute('aria-checked', String(!!settings[el.dataset.setting]));
    });
  }
  document.getElementById('geo-btn').addEventListener('click', goToUserLocation);

  /* ═══════ МАРКЕРЫ ВОСПОМИНАНИЙ ═══════ */
  function buildMemoryMarkerElement(post) {
    const imgs = postImages(post);
    const el = document.createElement('div'); el.className = 'memory-marker';
    if (!imgs.length) { el.innerHTML = `<div class="memory-fan"><div class="memory-card" style="transform: translate(-50%, -50%);"><div class="mc-img no-photo"></div></div></div>`; return el; }
    if (imgs.length === 1) { el.innerHTML = `<div class="memory-fan"><div class="memory-card" style="transform: translate(-50%, -50%);"><div class="mc-img" style="background-image:url('${safeUrl(imgs[0])}')"></div></div></div>`; return el; }
    const max = 4, total = Math.min(imgs.length, max);
    const anglesByCount = { 2:[-12,6], 3:[-14,0,14], 4:[-18,-6,6,18] };
    const shiftsByCount = { 2:[-11,11], 3:[-16,0,16], 4:[-20,-7,7,20] };
    const angles = anglesByCount[total] || anglesByCount[4];
    const shifts = shiftsByCount[total] || shiftsByCount[4];
    const cards = [];
    for (let i = 0; i < total; i++) { cards.push({ src: imgs[total - 1 - i] || imgs[0], angle: angles[i], shift: shifts[i], z: i + 1 }); }
    const hiddenCount = Math.max(0, imgs.length - total);
    el.innerHTML = `
      <div class="memory-fan">
        ${cards.map((c) => `<div class="memory-card" style="transform: translate(-50%, -50%) translateX(${c.shift}px) rotate(${c.angle}deg); z-index: ${c.z};"><div class="mc-img" style="background-image:url('${safeUrl(c.src)}')"></div></div>`).join('')}
        ${hiddenCount > 0 ? `<span class="memory-more">+${hiddenCount}</span>` : ''}
      </div>`;
    return el;
  }

  function syncPostMarkers() {
    if (!map2gis) return;
    const aliveIds = new Set(posts.filter((p) => Array.isArray(p.coords)).map((p) => p.id));
    for (const [id, marker] of [...placeMarkers.entries()]) {
      if (!aliveIds.has(id)) { try { marker.destroy(); } catch {} placeMarkers.delete(id); }
    }
    for (const p of posts) {
      if (!Array.isArray(p.coords)) continue;
      if (placeMarkers.has(p.id)) { try { placeMarkers.get(p.id).destroy(); } catch {} placeMarkers.delete(p.id); }
      const html = buildMemoryMarkerElement(p);
      html.addEventListener('click', (e) => { e.stopPropagation(); openPostPopup(p); });
      const marker = new mapgl.HtmlMarker(map2gis, { coordinates: p.coords, html, anchor: [0.5, 1], preventMapInteractions: false });
      placeMarkers.set(p.id, marker);
    }
  }

  function openPostPopup(post) {
    closePopup(); if (!map2gis) return;
    const cover = (Array.isArray(post.images) && post.images[0]) || '';
    const wrap = document.createElement('div'); wrap.className = 'map-popup';
    wrap.innerHTML = `
      ${cover ? `<img class="pop-img" src="${safeUrl(cover)}" alt="">` : ''}
      <div class="pop-place">📍 ${escapeHtml(post.place || '')}</div>
      ${post.caption ? `<div class="pop-caption">${escapeHtml(post.caption)}</div>` : ''}
      <button type="button" class="pop-open">Открыть воспоминание</button>`;
    wrap.querySelector('.pop-open').addEventListener('click', (e) => { e.stopPropagation(); closePopup(); jumpToPostInFeed(post.id); });
    openPopupMarker = new mapgl.HtmlMarker(map2gis, { coordinates: post.coords, html: wrap, anchor: [0.5, 1], preventMapInteractions: false });
  }
  function closePopup() { if (!openPopupMarker || !map2gis) { openPopupMarker = null; return; } try { openPopupMarker.destroy(); } catch {} openPopupMarker = null; }
  function jumpToPostInFeed(postId) {
    showApp('profile'); showPlacesScreen();
    placesView = 'feed'; savePlacesView('feed'); showPlacesScreen();
    requestAnimationFrame(() => {
      const idx = posts.findIndex((x) => x.id === postId);
      const el = winBody.querySelectorAll('.post')[idx];
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    });
  }
  function flyToPost(post) { if (!map2gis || !Array.isArray(post.coords)) return; map2gis.setCenter(post.coords); map2gis.setZoom(15); }

  async function geocodePlace(placeText) {
    if (!placeText) return null;
    const url = new URL('https://catalog.api.2gis.com/3.0/items/geocode');
    url.searchParams.set('q', placeText); url.searchParams.set('fields', 'items.point'); url.searchParams.set('key', MAPGL_API_KEY);
    try {
      const res = await fetch(url.toString());
      if (!res.ok) return null;
      const data = await res.json();
      const items = (data && data.result && data.result.items) || [];
      if (!items.length) return null;
      const point = items[0].point;
      if (!point || typeof point.lon !== 'number' || typeof point.lat !== 'number') return null;
      return [point.lon, point.lat];
    } catch { return null; }
  }

  /* ═══════ ЖЕЛАНИЯ ═══════ */
  /* Желание без места висит облаком над иконкой автора (видно только последнее — «текущее»),
     желание с местом — облаком над точкой на карте. Желание группы хранится в groups.wish. */
  function visibleWishes() {
    const myId = currentUser && String(currentUser.id);
    const friendIds = new Set(friends.map((f) => String(f.id)));
    return wishes.filter((w) => {
      if (!currentUser) return w.audience === 'all';
      if (String(w.authorId) === myId) return true;
      if (w.audience === 'all') return true;
      if (w.audience === 'friends') return friendIds.has(String(w.authorId));
      if (w.audience === 'group') return !!w.groupId && isGroupParticipant(groupById(w.groupId), currentUser.id);
      if (w.audience === 'me') return false;
      return true;
    });
  }

  function syncWishMarkers() {
    if (!map2gis) return;
    const myId = currentUser && String(currentUser.id);
    const list = visibleWishes().filter((w) => Array.isArray(w.coords));
    const alive = new Set(list.map((w) => w.id));
    for (const [id, wm] of [...wishMarkers.entries()]) {
      if (!alive.has(id)) { try { wm.marker.destroy(); } catch {} wishMarkers.delete(id); }
    }
    for (const w of list) {
      const mine = String(w.authorId) === myId;
      const caption = mine ? '' : (w.authorName || '');
      const key = [w.text, caption, w.coords.join(',')].join('|');
      const existing = wishMarkers.get(w.id);
      if (existing && existing.key === key) continue;
      if (existing) { try { existing.marker.destroy(); } catch {} }
      const el = document.createElement('div');
      el.className = 'wish-place';
      el.innerHTML = `<span class="wish-place-dot"></span><span class="wish-anchor is-right">${wishCloud({ text: w.text, caption }).html}</span>`;
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        showApp('profile');
        if (mine) showWishesScreen(); else showFriendProfile(w.authorId, personById(w.authorId));
      });
      const marker = new mapgl.HtmlMarker(map2gis, { coordinates: w.coords, html: el, anchor: [0.5, 0.5], preventMapInteractions: true });
      wishMarkers.set(w.id, { marker, key });
    }
    scheduleWishDeclutter();
  }

  const ICON_TRASH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`;

  function wishAudienceLabel(w) {
    if (w.audience === 'me') return '👤 Только мне';

    return '🌍 Всем';

  function wishTimeLabel(ts) {
