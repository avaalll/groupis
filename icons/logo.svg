<svg xmlns="http://www.w3.org/2000/svg" viewBox="265 -125 1400 1400" width="512" height="512">
  <!-- Groupies: трое показывают друг на друга с телефонами в руках.
       Координаты и ракурс повторяют мем «три Спайдермена» (кадр 2000×1125). -->
  <defs>
    <linearGradient id="gp-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0C18"/>
      <stop offset="1" stop-color="#141830"/>
    </linearGradient>
    <linearGradient id="gp-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191D36"/>
      <stop offset="1" stop-color="#0D0F1D"/>
    </linearGradient>
    <radialGradient id="gp-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3A4380" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3A4380" stop-opacity="0"/>
    </radialGradient>
    <!-- тонкий светлый контур, чтобы тёмные фигуры не терялись на тёмном фоне -->
    <filter id="gp-rim" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/>
      <feFlood flood-color="#4A5488" flood-opacity=".55"/>
      <feComposite in2="d" operator="in" result="rim"/>
      <feMerge><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gp-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="gp-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B4BEFF"/>
      <stop offset="1" stop-color="#6E7EFF"/>
    </linearGradient>
  </defs>

  <!-- ═══ Фон: стена, пол, мягкий ореол ═══ -->
  <rect x="265" y="-125" width="1400" height="1400" fill="url(#gp-wall)"/>
  <path d="M265 690 L1665 670 L1665 1275 L265 1275 Z" fill="url(#gp-floor)"/>
  <path d="M265 690 L1665 670" stroke="#262B4A" stroke-width="4"/>
  <circle cx="1060" cy="300" r="430" fill="url(#gp-halo)"/>
  <!-- тени на полу -->
  <g fill="#05060D" opacity=".55">
    <ellipse cx="560" cy="1085" rx="290" ry="34"/>
    <ellipse cx="1075" cy="845" rx="210" ry="22"/>
    <ellipse cx="1440" cy="1125" rx="220" ry="30"/>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">

  <!-- ════════════ ЦЕНТР: дальше всех, лицом к нам, руки в стороны ════════════ -->
  <g filter="url(#gp-rim)">
    <!-- ноги -->
    <g stroke="#141A30" fill="none">
      <path d="M1010 420 L980 615" stroke-width="64"/>
      <path d="M980 615 L965 720" stroke-width="50"/>
      <path d="M1115 420 L1160 615" stroke-width="64"/>
      <path d="M1160 615 L1190 725" stroke-width="50"/>
    </g>
    <path d="M985 382 L1142 382 L1148 445 L982 445 Z" fill="#141A30"/>
    <!-- обувь -->
    <path d="M942 700 L988 706 L994 786 Q962 824 890 824 Q868 814 888 798 Q934 778 942 740 Z" fill="#07080E"/>
    <path d="M1168 708 L1212 712 L1228 788 Q1262 814 1280 840 Q1278 860 1254 856 L1194 832 Q1168 772 1168 708 Z" fill="#07080E"/>
    <!-- куртка -->
    <path d="M1000 184 Q1065 168 1136 184 Q1168 200 1157 242 L1132 402 L994 402 L974 246 Q964 200 1000 184 Z" fill="#1C2A57"/>
    <path d="M1047 180 L1082 180 L1076 402 L1052 402 Z" fill="#0E1328"/>
    <path d="M1040 180 L1064 232 L1090 180" fill="none" stroke="#2C3C74" stroke-width="7"/>
    <path d="M994 402 L1132 402" stroke="#141D3D" stroke-width="12"/>
    <!-- шея и голова -->
    <rect x="1042" y="146" width="28" height="40" rx="10" fill="#5E443B"/>
    <ellipse cx="1056" cy="94" rx="40" ry="52" fill="#6E5146"/>
    <ellipse cx="1016" cy="100" rx="7" ry="12" fill="#5E443B"/>
    <ellipse cx="1096" cy="100" rx="7" ry="12" fill="#5E443B"/>
    <ellipse cx="1042" cy="98" rx="4" ry="5.5" fill="#150C10"/><ellipse cx="1070" cy="98" rx="4" ry="5.5" fill="#150C10"/><path d="M1034 88 L1049 87 M1063 87 L1078 88" stroke="#0C0A10" stroke-width="3.5"/>
    <path d="M1015 92 Q1012 44 1052 36 Q1096 34 1100 86 Q1088 64 1066 66 Q1074 54 1060 56 Q1040 58 1030 72 Q1020 76 1015 92 Z" fill="#0C0A10"/>
    <!-- левая рука → на левого -->
    <g stroke="#25346A" fill="none">
      <path d="M992 212 L905 248" stroke-width="44"/>
      <path d="M905 248 L826 260" stroke-width="38"/>
    </g>
    <path d="M826 260 L818 261" stroke="#141D3D" stroke-width="40"/>
    <ellipse cx="800" cy="263" rx="21" ry="17" fill="#6E5146"/>
    <path d="M786 256 L740 254" stroke="#6E5146" stroke-width="11" fill="none"/>
    <path d="M806 252 Q796 246 786 252" stroke="#5E443B" stroke-width="7" fill="none"/>
    <!-- правая рука → на правого, с телефоном -->
    <g stroke="#25346A" fill="none">
      <path d="M1146 206 L1215 216" stroke-width="44"/>
      <path d="M1215 216 L1262 210" stroke-width="38"/>
    </g>
    <path d="M1262 210 L1270 209" stroke="#141D3D" stroke-width="40"/>
    <g transform="rotate(-6 1290 192)">
      <rect x="1278" y="166" width="26" height="46" rx="5" fill="#07080E"/>
      <rect x="1281" y="170" width="20" height="36" rx="3" fill="url(#gp-screen)"/>
    </g>
    <ellipse cx="1286" cy="208" rx="20" ry="16" fill="#6E5146"/>
    <path d="M1300 200 L1336 196" stroke="#6E5146" stroke-width="10" fill="none"/>
    <path d="M1278 200 Q1284 194 1292 198" stroke="#5E443B" stroke-width="6" fill="none"/>
  </g>

  <!-- ════════════ ЛЕВЫЙ: 3/4 вправо, широкая стойка ════════════ -->
  <g filter="url(#gp-rim)">
    <!-- ноги -->
    <g stroke="#1A1F36" fill="none">
      <path d="M505 575 L440 790" stroke-width="102"/>
      <path d="M440 790 L405 962" stroke-width="80"/>
      <path d="M612 575 L686 790" stroke-width="102"/>
      <path d="M686 790 L706 935" stroke-width="80"/>
    </g>
    <path d="M462 535 L655 535 L664 612 L466 612 Z" fill="#1A1F36"/>
    <path d="M560 560 L562 640" stroke="#12162A" stroke-width="6"/>
    <!-- обувь -->
    <path d="M382 948 L432 972 L422 1040 Q382 1096 330 1092 Q306 1080 328 1058 Q368 1020 378 988 Z" fill="#07080E"/>
    <path d="M678 922 L732 928 L746 998 Q792 1028 814 1048 Q818 1070 790 1070 L700 1062 Q678 1000 678 922 Z" fill="#07080E"/>
    <!-- куртка -->
    <path d="M538 300 Q600 282 656 304 Q694 330 682 382 L642 562 Q570 584 488 562 L494 400 Q494 330 538 300 Z" fill="#5A1A2C"/>
    <path d="M538 300 Q510 330 500 400 L494 562 Q520 572 552 576 L560 330 Z" fill="#43121F"/>
    <path d="M612 300 L598 568" stroke="#2E0B15" stroke-width="6" fill="none"/>
    <path d="M488 548 Q568 568 644 548" stroke="#3A0F1A" stroke-width="14" fill="none"/>
    <!-- капюшон за шеей -->
    <path d="M552 296 Q590 270 634 296 Q600 318 552 296 Z" fill="#43121F"/>
    <!-- шея и голова (смотрит вправо) -->
    <rect x="578" y="262" width="36" height="42" rx="12" fill="#6A4C42"/>
    <ellipse cx="598" cy="214" rx="50" ry="62" fill="#7B5A4E"/>
    <path d="M646 206 Q660 214 648 226" fill="#7B5A4E"/>
    <ellipse cx="566" cy="220" rx="9" ry="15" fill="#6A4C42"/>
    <ellipse cx="630" cy="208" rx="4.5" ry="6.5" fill="#150C10"/><path d="M620 196 L638 194" stroke="#0C0A10" stroke-width="4"/>
    <path d="M548 222 Q540 160 590 150 Q640 146 650 186 Q628 172 604 176 Q590 168 580 180 Q570 186 566 204 Q556 206 548 222 Z" fill="#0C0A10"/>
    <!-- согнутая рука с телефоном перед собой -->
    <g stroke="#6B2236" fill="none">
      <path d="M606 420 L690 480" stroke-width="56"/>
      <path d="M690 480 L770 488" stroke-width="48"/>
    </g>
    <path d="M770 488 L780 488" stroke="#3A0F1A" stroke-width="50"/>
    <g transform="rotate(-10 812 468)">
      <rect x="794" y="430" width="38" height="70" rx="7" fill="#07080E"/>
      <rect x="798" y="436" width="30" height="56" rx="4" fill="url(#gp-screen)"/>
      <rect x="808" y="439" width="10" height="3" rx="1.5" fill="#07080E"/>
    </g>
    <path d="M784 470 Q800 462 808 476 L812 506 Q796 516 784 506 Z" fill="#7B5A4E"/>
    <g stroke="#6A4C42" stroke-width="5" fill="none">
      <path d="M810 480 Q826 482 828 490"/>
      <path d="M810 492 Q826 494 828 502"/>
    </g>
    <!-- вытянутая рука → на центрального -->
    <g stroke="#6B2236" fill="none">
      <path d="M648 338 L716 386" stroke-width="58"/>
      <path d="M716 386 L770 394" stroke-width="50"/>
    </g>
    <path d="M770 394 L780 394" stroke="#3A0F1A" stroke-width="52"/>
    <ellipse cx="800" cy="394" rx="27" ry="23" fill="#7B5A4E"/>
    <path d="M818 386 L860 382" stroke="#7B5A4E" stroke-width="14" fill="none"/>
    <path d="M790 380 Q808 372 820 384" stroke="#6A4C42" stroke-width="8" fill="none"/>
    <g stroke="#6A4C42" stroke-width="4" fill="none">
      <path d="M812 398 Q822 402 820 410"/>
      <path d="M806 406 Q814 412 810 418"/>
    </g>
  </g>

  <!-- ════════════ ПРАВЫЙ: спиной к нам, присел, голова повёрнута влево ════════════ -->
  <g filter="url(#gp-rim)">
    <!-- ноги -->
    <g stroke="#1B1628" fill="none">
      <path d="M1372 690 L1305 850" stroke-width="112"/>
      <path d="M1305 850 L1332 1000" stroke-width="86"/>
      <path d="M1332 1000 L1340 1100" stroke-width="76"/>
      <path d="M1520 690 L1566 800" stroke-width="112"/>
      <path d="M1566 800 L1536 980" stroke-width="86"/>
      <path d="M1536 980 L1548 1095" stroke-width="76"/>
    </g>
    <path d="M1318 598 Q1440 578 1572 608 L1582 722 Q1450 744 1328 716 Z" fill="#1B1628"/>
    <path d="M1446 610 L1448 730" stroke="#120E1C" stroke-width="6"/>
    <!-- обувь -->
    <ellipse cx="1336" cy="1116" rx="56" ry="26" fill="#07080E"/>
    <ellipse cx="1552" cy="1110" rx="52" ry="24" fill="#07080E"/>
    <!-- куртка (спина) -->
    <path d="M1345 380 Q1440 350 1546 380 Q1592 400 1586 452 L1550 628 Q1440 648 1334 628 L1310 462 Q1300 400 1345 380 Z" fill="#123447"/>
    <path d="M1546 380 Q1592 400 1586 452 L1550 628 Q1510 636 1480 638 L1500 380 Z" fill="#0C2533"/>
    <path d="M1334 612 Q1440 632 1552 612" stroke="#0A1E29" stroke-width="16" fill="none"/>
    <path d="M1442 392 L1446 620" stroke="#0A1E29" stroke-width="5" fill="none"/>
    <!-- капюшон -->
    <path d="M1372 372 Q1436 336 1500 372 Q1470 402 1436 400 Q1400 400 1372 372 Z" fill="#0C2533"/>
    <!-- шея и голова (затылок, виден край щеки слева) -->
    <rect x="1404" y="312" width="42" height="50" rx="14" fill="#6A4C42"/>
    <ellipse cx="1410" cy="256" rx="58" ry="66" fill="#7B5A4E"/>
    <path d="M1372 212 Q1400 186 1440 192 Q1474 204 1470 262 Q1468 300 1446 316 Q1420 324 1396 316 Q1380 300 1384 268 Q1386 240 1372 212 Z" fill="#0C0A10"/>
    <path d="M1360 238 Q1370 196 1410 190 Q1380 204 1372 232 Z" fill="#0C0A10"/>
    <ellipse cx="1462" cy="262" rx="9" ry="15" fill="#6A4C42"/>
    <ellipse cx="1364" cy="250" rx="3.5" ry="6" fill="#150C10"/>
    <!-- рука с телефоном у бедра -->
    <g stroke="#17415A" fill="none">
      <path d="M1552 408 L1604 512" stroke-width="60"/>
      <path d="M1604 512 L1584 582" stroke-width="50"/>
    </g>
    <path d="M1584 582 L1582 590" stroke="#0A1E29" stroke-width="52"/>
    <g transform="rotate(18 1566 612)">
      <rect x="1548" y="580" width="36" height="66" rx="7" fill="#07080E"/>
      <rect x="1551" y="584" width="4" height="58" rx="2" fill="#8C9BFF"/>
    </g>
    <ellipse cx="1578" cy="608" rx="22" ry="20" fill="#7B5A4E"/>
    <!-- вытянутая рука → на центрального -->
    <g stroke="#17415A" fill="none">
      <path d="M1330 422 L1250 500" stroke-width="62"/>
      <path d="M1250 500 L1160 502" stroke-width="52"/>
    </g>
    <path d="M1160 502 L1146 502" stroke="#07080E" stroke-width="54"/>
    <ellipse cx="1118" cy="494" rx="28" ry="23" fill="#7B5A4E"/>
    <path d="M1098 486 L1046 478" stroke="#7B5A4E" stroke-width="14" fill="none"/>
    <path d="M1128 478 Q1110 470 1096 482" stroke="#6A4C42" stroke-width="8" fill="none"/>
    <g stroke="#6A4C42" stroke-width="4" fill="none">
      <path d="M1106 500 Q1096 504 1098 512"/>
      <path d="M1112 508 Q1104 514 1108 520"/>
    </g>
  </g>
  </g>

  <!-- ═══ Свечение экранов ═══ -->
  <g fill="#7C8BFF" opacity=".5" filter="url(#gp-glow)">
    <circle cx="812" cy="466" r="42"/>
    <circle cx="1290" cy="190" r="28"/>
    <circle cx="1566" cy="612" r="30"/>
  </g>
</svg>
